# git-integration-repo — skill-manager unit manifest.
#
# ONE HARD REFERENCE, AND IT IS A RUNTIME FILE DEPENDENCY.
#
# The worktree machinery this skill used to ship — `wt`, new-change.sh,
# close-change.sh, bootstrap-home.sh, agent-home.sh and the shared `lib.sh` —
# now belongs to `git-issue-workflow`. An integration repository is a
# SPECIALIZATION (it exists only when a repo has constituents); a ticket and a
# worktree exist for EVERY repo, and an agent selects a skill by its
# description, so the general machinery has to live in the skill a ticket agent
# already opens. The dependency therefore runs specialized -> general:
#
#   git-integration-repo  ->  git-issue-workflow  ->  git-issue
#
# Every script left here — propagate.sh, refresh.sh, verify.sh,
# init-integration.sh, add-constituent.sh, finalize-constituents.sh — sources
# `die`/`info`/`step`/`help_guard` and the checkout predicates from that
# `lib.sh`, through the single resolver in scripts/integration-lib.sh. So this
# is not a semantic edge and not an optional composition: without the reference,
# `install git-integration-repo` SUCCEEDS and then every entry point here
# refuses at source time with a missing lib.sh. The earlier comment here said
# an empty list "keeps this unit's install self-contained"; that stopped being
# true the moment the library moved, and a stale rationale is worse than none.
#
# SI-12: THE COORDINATE IS GONE, AND IT WAS NOT REPOINTED.
#
# This skill is now a CONTAINED SKILL of the `tla-spec-dev` plugin, and so is
# git-issue-workflow. The reference used to read
# `github:haydenrear/git-issue-workflow-skill`. A git coord still RESOLVES after
# its target is bundled — that is the whole problem — so leaving it here would
# install a SECOND, standalone copy of a skill that is already a sibling in this
# bundle. That is the silent-duplicate class in
# `skills/plugin-repository/references/imports.md` § 3, and it is precisely what
# `deps <unit> --who-imports` measured in the project home on 2026-09-18: three
# contained skills re-materialised as standalone installs by this unit and
# plugin-repository. Removing it is what makes GOAL-one-unit clause 1
# satisfiable rather than merely close.
#
# Nothing is lost. `lib.sh` still arrives, because git-issue-workflow ships in
# the SAME plugin at `skills/git-issue-workflow/` and installing the plugin
# installs every contained skill at one version. What had to change is the
# RESOLVER, not the reference: scripts/integration-lib.sh gained a
# `plugins/*/skills/` rung so it finds lib.sh where a contained skill's bytes
# actually live (SI-02-DF-05).
#
# The composed skills (spec-double-compiler/spec-double-2, test-graph,
# deploy-helm) stay OUT of this list on purpose: they are semantic imports
# declared in SKILL.md frontmatter, invoked when present, and forcing them
# transitively is a different kind of edge. See references/composition.md.
skill_references = [
]

# git, and optionally the git host CLI (glab for GitLab MRs/issues, gh for
# GitHub), are assumed already on PATH. propagate.sh detects which is available
# and degrades gracefully to printing the steps if neither is installed.

[skill]
name = "git-integration-repo"
version = "0.1.0"
description = "Create and operate integration repositories: many repos tracked as plain files in one parent, changed via worktrees, fanned back out as branches/MRs."
