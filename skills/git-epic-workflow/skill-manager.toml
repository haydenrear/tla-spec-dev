# skill-manager 0.18.1 traverses table references through the legacy `name`
# projection. Keep the full pinned git coordinate in `name`; bare string direct
# git references parse but are skipped by that release's transitive walker.
# git-issue-workflow-skill is listed DIRECTLY, and it is the one that matters:
# this skill's own pages name scripts/bootstrap-home.sh and scripts/wt by
# resolved path ($SKILL_MANAGER_HOME/{skills,plugins/*/skills}/git-issue-workflow/scripts/...), and
# a file a page instructs you to run should not depend on another unit's
# dependency list staying as it is. It is a reference and not a skill-import on
# purpose — what is needed is the file on disk, not the whole ticket-execution
# skill in context.
#
# git-integration-skill was ALSO listed here, for exactly those two files. They
# moved to git-issue-workflow (a worktree and a home are things every repo has;
# an integration repository is a specialization), so the reference moved with
# them and the integration unit is no longer pulled into every epic. An epic on
# an integration repo gets it from that repo's own skill-project.toml.
#
# git-issue-skill was listed twice; deduplicated.
# skill-manager-skill and skill-publisher-skill collapsed to skt: the
# repository was RENAMED to skt (GitHub redirects the old name), and the
# skill-manager skill now lives inside that plugin rather than in a
# repository of its own. One coordinate, because there is now one repository.
# SI-16: the hard reference to github:haydenrear/skt is GONE, and its absence
# is the point. skt is a CONTAINED SKILL of this same plugin now, so this
# coord no longer names a thing to go and fetch -- but it still RESOLVES,
# which is worse than an error: install unions this list and clones a
# SECOND, STANDALONE skt at its own version beside the one the bundle
# already ships. Measured on a fresh home before this line was removed:
# `skill-manager list` reported BOTH `skt plugin 0.8.2 git 0f38078` and
# `tla-spec-dev plugin 0.1.0`, and because the standalone installer ran
# second it overwrote bin/cli/skt with rel="plugins/skt/src/skt/cli.py" --
# the pre-demotion path -- which then failed the front door with the
# bootstrap-rung defect that standalone skt at 0f38078 still has.
#
# plugin-repository/references/layout.md states the rule: a reference to a
# skill that is also a member of this bundle is "redundant at best and an
# install-time cycle at worst -- drop it and rely on the bundle."
skill_references = [
]

[[cli_dependencies]]
spec = "brew:gh"
on_path = "gh"

[skill]
name = "git-epic-workflow"
version = "0.4.1"
description = "Plan, rescope, retire tickets from, and finalize spec-backed Git epics through goal-driven, dependency-aware GitHub issues, epic branches, evaluation/perf tickets, and a shared TLA+ workflow."
