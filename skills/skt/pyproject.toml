[project]
name = "skt"
version = "0.8.2"
description = "Skill-lifecycle CLI: startup disclosure, version/sync notifications, and worktree change management for skill-manager homes."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
skt = "skt.cli:main"
# SI-17: moved here with `wt.py` from git-issue-workflow. A passthrough onto
# `scripts/wt`, kept because it is an installed-console-script spelling that
# needs no path resolution at all.
wt-py = "skt.wt:cli_main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/skt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
