# Skill project manifest for plugin-repository.
#
# What this declares: the units an agent working IN THIS CHECKOUT needs. Every
# tracked file here — SKILL.md, references/, scripts/, assets/,
# skill-manager.toml — is skill-unit content, so the work done here is unit
# authoring and the declared units are the authorities for it.
#
# It deliberately does NOT declare `plugin-repository` itself. A repo is its own
# source of truth; installing it into its own home would give an agent two
# copies of the same skill with no rule about which one it is editing.

[project]
name = "plugin-repository"
version = "0.1.0"
description = "Create and operate plugin repositories: skill repos bundled as the contained skills of one skill-manager plugin, changed and versioned as one unit, fanned back out to each skill's own repo."

# --- THE HARD RUNTIME DEPENDENCY. scripts/plugin-repo-lib.sh sources this
#     unit's integration-lib.sh, init-plugin-repo.sh and verify.sh shell out to
#     its scaffolder and its verifier, and refresh.sh / propagate.sh — the two
#     flows references/lifecycle.md sequences — are its scripts. Declared as a
#     project dependency as well as a `skill_reference` because
#     `skill_references` governs the INSTALL graph while this file governs what
#     an agent working in this checkout gets, including inside every ticket
#     worktree, whose home is a clone of this one. Without it, no script here
#     runs and scripts/selftest.sh skips its whole LIVE phase ---

# --- SI-12: the git-integration-repo AND git-issue-workflow ENTRIES ARE GONE,
#     not repointed. All three skills — this one, git-integration-repo and
#     git-issue-workflow — are now contained skills of the `tla-spec-dev`
#     plugin, so they arrive together from one coord and a checkout of this
#     skill is a checkout of the bundle: every sibling is already on disk at
#     skills/<unit>/.
#
#     Leaving either coord here would still RESOLVE, and would install a second,
#     standalone copy of a skill that is already a sibling in this bundle. That
#     is the silent-duplicate class this unit's own references/imports.md § 3
#     documents — the one that reports no error — and removing it is what this
#     ticket exists to do. ---

# --- the authoring authority. `skt` is a PLUGIN whose contained skills are
#     `skt` (orientation, home tiers, publish, ticket lifecycle) and
#     `unit-authoring` (SKILL.md frontmatter, skill-manager.toml, plugin.json,
#     contained-skill semantics, the edit -> push -> sync loop). Its
#     references/plugins.md is the authority this skill's references/layout.md
#     specializes and never restates.
#
#     Note the coordinate: the repo is still `skill-publisher-skill` while the
#     installed unit is the `skt` plugin. That is this skill's own subject
#     matter — a skill repo that became a plugin's contained skill, keeping its
#     repo name and changing its unit identity — and it is why every table in
#     references/migration.md distinguishes the coord from the unit name ---

# --- required BY skt's unit-authoring (its SKILL.md `skill-imports` names
#     skill-manager), and substantive here on its own: `home clone/policy/
#     describe/drift`, `install`, `sync`, `bind` and `project resolve` are the
#     surface every claim in references/lifecycle.md and references/migration.md
#     is made about. Unit `skill_references` are followed automatically;
#     markdown `skill-imports` are not, and `project resolve` refuses the whole
#     resolve with "references missing unit" until the imported unit is
#     declared ---

# --- REPO-SPECIFIC DECISION: nothing else is declared. The tracked content is
#     markdown plus POSIX shell and stdlib Python — no specs/ tree, no
#     test_graph project, no deployable — and scripts/selftest.sh is
#     self-contained (it needs git and the git-integration-repo dependency, and
#     skips its LIVE phase loudly without the latter). Declaring test-graph
#     would transitively pull deploy-helm and its ~555 MB skill-script venvs
#     into every home cloned from this one, for no check this repo runs.

# --- no [[vendored]] block: this repo tracks no symlinks and no content owned
#     by another unit. Verify with `git ls-files -s | grep ^120000` -> 0 entries.

# --- SI-16/SI-17 SWEEP: the entries that used to sit here are GONE, not
#     repointed. Every unit they named -- skt, unit-authoring, skill-manager,
#     spec-double-compiler, test-graph -- is now a CONTAINED SKILL of the
#     tla-spec-dev plugin, and so is this one. They arrive together from one
#     coord. A `source = "github:haydenrear/..."` here would still RESOLVE,
#     and resolving it installs a SECOND, standalone copy of a sibling in
#     this bundle -- the silent-duplicate class in
#     skills/plugin-repository/references/imports.md section 3, and the same
#     duplication SI-02 deleted from the root manifest.
#
#     A checkout of THIS skill is now a checkout of the bundle, so an agent
#     editing it already has every sibling on disk at skills/<unit>/.
#     Nothing needs to be installed to reach them. The rationale each
#     deleted block carried is preserved in git history.
