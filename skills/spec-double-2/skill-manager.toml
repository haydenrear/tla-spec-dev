# Transitive unit references are intentionally empty. This skill is
# installable on its own; SKILL.md uses semantic skill-imports for
# authoring guidance without forcing additional install-time units.
skill_references = []

[[cli_dependencies]]
spec = "pip:jinja2-cli[yaml]==0.8.2"
on_path = "jinja2"

[[cli_dependencies]]
spec = "pip:pytest==8.3.4"
on_path = "pytest"

# `skill-script:tlc2` and `skill-script:tla-spec-dev` USED to be declared here,
# beside the `pip:` deps, and their installers lived in this skill's own
# `skill-scripts/`. SI-11 moved both to the PLUGIN manifest
# (`skill-manager-plugin.toml`) and both installers to the plugin root's
# `skill-scripts/`. The reason is in that file; the short version is that a
# `skill-script:` dep declared on a CONTAINED SKILL has no working spelling,
# because the resolver looks the script up by the INSTALLED UNIT's name, which
# for a contained skill is the plugin's. Declaring it here produced
# `cli: 15 installed, 2 failed` on every install from git (SIS-W2-F-05).
#
# The `pip:` deps below stay: they are resolved by the pip backend, which never
# touches `skill-scripts/`, so they work from either manifest and belong with
# the capability that uses them.

[skill]
name = "spec-double-2"
version = "0.1.0"
description = "Generate and maintain Python spec doubles from constrained, annotated TLA+ specifications."
