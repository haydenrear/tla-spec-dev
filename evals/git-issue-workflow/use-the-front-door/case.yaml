schema_version: "1.0"
name: use-the-front-door
description: >-
  An ordinary ticket, and the first move. `wt new` / `skt ticket new` creates
  the worktree AND its own Skill Manager home; a bare `git worktree add` creates
  a checkout with no home, and an agent launched there writes the operator's
  global one. Four measured eval runs took the second route and none reported it.
runs: 1
execution:
  env:
    EVAL_CASE: use-the-front-door
  # Deliberately no Bash: this case asks what the first moves ARE, and running
  # them inside the eval sandbox is a different measurement that a documented
  # environment fault (an unset TMPDIR breaking Apple's git) made unmeasurable
  # for eight runs in a sibling suite.
  max_turns: 30
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Skill, Write]
  prompt: |
    `ISSUE.md` is a ticket somebody has handed you to implement in this
    repository.

    Before changing anything, write `PLAN.md`: the exact commands you would run
    to start this ticket, in order, with the reason for each. Start from where
    the work will happen.

    End your reply with the first command, verbatim. The grader reads your reply
    and cannot open the file you wrote.
