# Mutant catalog for oracle 4, the mutation kill test.
#
# One seeded fault per declared effect port and one per model invariant. That
# obligation is NOT enforced by this comment -- scripts/kill_test.py recomputes
# it every run from `effects.components.*.ports` in spec_manifest.yaml and from
# the INVARIANTS block of MC.cfg, and refuses (exit 2) when any boundary here
# is uncovered. Declaring a new port or adding an invariant therefore breaks the
# kill test until a fault is seeded for it. Coverage is computed, not promised.
#
# Every field is required. In particular `refine_variable` and `refine_action`
# are what a SURVIVING mutant reports: they name the model element that owns the
# boundary, so a survivor reads as "the representation is too abstract at
# variable X / action Y", not as a decimal that dropped. A mutant that cannot
# say what to refine is rejected by the loader rather than defaulted.
#
# `find` must appear verbatim and exactly once in `path`. A mutant whose pattern
# has gone stale is refused, not scored: a fault that no longer applies is not a
# killed fault.
#
# There is no `expected_to_survive`, no `waiver`, and no `skip`. Keys shaped
# like those are scanned for, reported in the evidence, and honored never.

# ---------------------------------------------------------------------------
# One fault per declared effect port
# ---------------------------------------------------------------------------

[[mutants]]
id = "port-spec_tree"
boundary_kind = "port"
boundary_ref = "spec_tree"
path = "scripts/onboard_program_model.py"
find = '    path.write_text(content, encoding="utf-8")'
replace = '    path.write_text(content[:-1] if content else content, encoding="utf-8")'
description = "the single write path for the scaffolded spec tree truncates every file by one byte"
refine_variable = "spec_root"
refine_action = "ScaffoldProject"

[[mutants]]
id = "port-evidence_report"
boundary_kind = "port"
boundary_ref = "evidence_report"
path = "scripts/effect_conformance_report.py"
find = "        written = report.write(Path(args.out))"
replace = "        written = Path(args.out)  # MUTANT: evidence silently not written"
description = "the evidence report is announced as written but never actually written to results/"
refine_variable = "effect_conformance"
refine_action = "RunEffectConformance"

[[mutants]]
id = "port-cli_artifact"
boundary_kind = "port"
boundary_ref = "cli_artifact"
path = "skill-scripts/install-tla-spec-dev.sh"
find = 'chmod 0755 "$WRAPPER"'
replace = 'chmod 0644 "$WRAPPER"  # MUTANT: installed CLI artifact is not executable'
description = "the installed CLI wrapper is written without the executable bit"
refine_variable = "setup_phase"
refine_action = "InstallLocalCli"

# CD-09 (G4): the port-tlc_process mutant left with the port. The kill test
# recomputes its required boundary set from the declared ports on every run,
# so a seeded fault for an undeclared boundary is catalog drift, not coverage.

[[mutants]]
id = "port-test_process"
boundary_kind = "port"
boundary_ref = "test_process"
path = "scripts/tla_spec_dev.py"
find = "                        str(tests_dir),"
replace = """                        str(tests_dir),
                        "--collect-only",  # MUTANT: pytest runs no test and exits 0"""
description = "pytest is spawned and exits 0 having collected but executed zero tests"
refine_variable = "ticket_state"
refine_action = "RunSpecUnitTests"

# CD-10 (R3-3a): fault for the generated-case runner spawn. The runner is
# spawned with --validate-only injected, so every case is loaded and checked
# but none is executed -- a batch that reports success having run nothing.
[[mutants]]
id = "port-runner_process"
boundary_kind = "port"
boundary_ref = "runner_process"
path = "scripts/tla_spec_dev.py"
find = '                command.append("--batch")'
replace = '                command.extend(["--batch", "--validate-only"])  # MUTANT: the case runner validates but executes no case'
description = "the generated-case runner is spawned in validate-only mode, so no case body ever executes"
refine_variable = "ticket_state"
refine_action = "RunSpecUnitTests"

# CD-10 (R3-2): fault for the close path's destructive deletes. replace_tree
# no longer clears the destination before promotion, so files the ticket
# dropped survive as ghost state in project current/ -- the inverse of the
# GitHub #22 defect (which deleted too much; this deletes nothing).
[[mutants]]
id = "port-spec_tree_delete"
boundary_kind = "port"
boundary_ref = "spec_tree_delete"
path = "scripts/spec_evolution.py"
find = "        shutil.rmtree(dst)"
replace = "        pass  # MUTANT: destination tree is never cleared; dropped files persist as ghost state"
description = "promotion no longer clears the destination tree, so paths the ticket dropped silently survive"
refine_variable = "ticket_state"
refine_action = "CloseTicket"

# CD-10 (R3-3b): fault for the history-provenance git spawn. The spawn runs
# `git --version` instead of the requested rev-parse query, so every
# provenance value degrades to the not-a-work-tree shape and history entries
# silently lose branch/commit provenance.
[[mutants]]
id = "port-git_metadata"
boundary_kind = "port"
boundary_ref = "git_metadata"
path = "scripts/spec_evolution.py"
find = '        result = subprocess.run(["git", *args], check=True, capture_output=True, text=True)'
replace = '        result = subprocess.run(["git", "--version"], check=True, capture_output=True, text=True)  # MUTANT: provenance queries answered with the git version string'
description = "history provenance spawns git --version instead of rev-parse, so recorded branch/commit provenance is silently wrong"
refine_variable = "ticket_state"
refine_action = "CloseTicket"

# CD-11 (R4-1): fault for the mutation-write port. seeded() writes the
# ORIGINAL text back instead of the patched copy, so no fault ever lands in
# the tree and every mutant is trivially reported unkilled -- the kill test
# measures nothing while claiming it measured.
[[mutants]]
id = "port-mutation_write"
boundary_kind = "port"
boundary_ref = "mutation_write"
path = "scripts/kill_test.py"
find = '        target.write_text(patched, encoding="utf-8")'
replace = '        target.write_text(original, encoding="utf-8")  # MUTANT: the mutation never lands in the tree'
description = "seeding writes the original file back instead of the mutated copy, so no fault is ever planted"
refine_variable = "kill_test"
refine_action = "RunKillTest"

# CD-11 (R4-1): fault for the corpus-spawn port. The per-mutant corpus spawn
# drops the command's final argument, so the corpus that actually runs is not
# the corpus the user supplied.
[[mutants]]
id = "port-corpus_process"
boundary_kind = "port"
boundary_ref = "corpus_process"
path = "scripts/kill_test.py"
find = '            list(command),'
replace = '            list(command)[:-1],  # MUTANT: the corpus command loses its final argument'
description = "the spawned corpus command silently loses its final argument"
refine_variable = "kill_test"
refine_action = "RunKillTest"

# RC-01 (MF-026 G-9): three faults for the three ports the install path was
# performing and not declaring. Note what the catalog looked like before: the
# ONLY install-path port was `cli_artifact`, targeting `**/.venv/**`, which
# nothing in this repository writes -- so `port-cli_artifact` below has been
# seeding a fault for a boundary no case could exercise. The port is retargeted
# rather than removed (the install path really does write a CLI artifact), and
# its mutant still lands on a real site.

[[mutants]]
id = "port-cli_download"
boundary_kind = "port"
boundary_ref = "cli_download"
path = "skill-scripts/install-tlc2.sh"
find = 'curl -fL --retry 3 --retry-delay 1 "$JAR_URL" -o "$JAR_TMP"'
replace = ': > "$JAR_TMP"  # MUTANT: the jar is never downloaded; an empty file takes its place'
description = "the tla2tools download is replaced by an empty file, so tlc2 installs and every model check fails at class-load"
refine_variable = "setup_phase"
refine_action = "InstallLocalCli"

[[mutants]]
id = "port-cli_artifact_delete"
boundary_kind = "port"
boundary_ref = "cli_artifact_delete"
path = "skill-scripts/install-tlc2.sh"
find = 'mv "$JAR_TMP" "$JAR_PATH"'
replace = 'cp "$JAR_TMP" "$JAR_PATH"  # MUTANT: the download temporary is never unlinked'
description = "the downloaded temporary is copied instead of moved, so every install leaves a full jar behind in the cache directory"
refine_variable = "setup_phase"
refine_action = "InstallLocalCli"

[[mutants]]
id = "port-cli_selftest_process"
boundary_kind = "port"
boundary_ref = "cli_selftest_process"
path = "skill-scripts/install-tla-spec-dev.sh"
find = '"$WRAPPER" --help >/dev/null'
replace = 'true  # MUTANT: the installed wrapper is never executed, so a broken install reports success'
description = "the post-install self-test never runs the wrapper, so an install that produced an unrunnable CLI still reports success"
refine_variable = "setup_phase"
refine_action = "InstallLocalCli"

# ---------------------------------------------------------------------------
# One fault per model invariant
# ---------------------------------------------------------------------------

[[mutants]]
id = "inv-TypeInvariant"
boundary_kind = "invariant"
boundary_ref = "TypeInvariant"
path = "scripts/budgets.py"
find = "    if isinstance(value, target) and not isinstance(value, bool):"
replace = "    if isinstance(value, target) or isinstance(value, bool):"
description = "budget value domain checking accepts booleans, so a budget may be typed outside its domain"
refine_variable = "result"
refine_action = "RecordBudgets"

[[mutants]]
id = "inv-CliInstalledRequiresBuilt"
boundary_kind = "invariant"
boundary_ref = "CliInstalledRequiresBuilt"
path = "skill-scripts/install-tla-spec-dev.sh"
find = 'if [[ ! -f "$ENTRYPOINT" ]]; then'
replace = 'if [[ -f "/nonexistent-mutant-sentinel" ]]; then'
description = "install no longer verifies the CLI entrypoint was built, so install can precede build"
refine_variable = "setup_phase"
refine_action = "InstallLocalCli"

[[mutants]]
id = "inv-WorkflowRequiresProject"
boundary_kind = "invariant"
boundary_ref = "WorkflowRequiresProject"
path = "scripts/new_ticket_workflow.py"
find = '            "cannot scaffold ticket workflow without an accepted program model. "'
replace = '            "MUTANT: workflow scaffolded without an accepted program model. "'
description = "the refusal message for scaffolding a workflow with no accepted program model is corrupted"
refine_variable = "setup_phase"
refine_action = "ScaffoldWorkflow"

[[mutants]]
id = "inv-BudgetsRequireProject"
boundary_kind = "invariant"
boundary_ref = "BudgetsRequireProject"
path = "scripts/tla_spec_dev.py"
find = '    print(budget_prompt(f"{spec_root}/program_model/spec_manifest.yaml"))'
replace = '    pass  # MUTANT: project scaffolding no longer prompts for budgets'
description = "scaffolding a project no longer emits the budget negotiation prompt"
refine_variable = "setup_phase"
refine_action = "ScaffoldProject"

[[mutants]]
id = "inv-WorkflowRequiresBudgets"
boundary_kind = "invariant"
boundary_ref = "WorkflowRequiresBudgets"
path = "scripts/tla_spec_dev.py"
find = '    print(budget_prompt(f"{args.spec_root}/current/spec_manifest.yaml"))'
replace = '    pass  # MUTANT: workflow scaffolding no longer emits budgets'
description = "scaffolding a workflow no longer emits the budget block, so downstream gates read defaults"
refine_variable = "setup_phase"
refine_action = "ScaffoldWorkflow"

[[mutants]]
id = "inv-ProjectChoosesKnownSpecRoot"
boundary_kind = "invariant"
boundary_ref = "ProjectChoosesKnownSpecRoot"
path = "scripts/tla_spec_dev.py"
find = "    return path if path.is_absolute() else repo_root / path"
replace = "    return path if path.is_absolute() else repo_root / 'specs'"
description = "every subcommand resolves to the default spec root, ignoring a custom --spec-root"
refine_variable = "spec_root"
refine_action = "ScaffoldProject"

[[mutants]]
id = "inv-NoOpenClosedOverlap"
boundary_kind = "invariant"
boundary_ref = "NoOpenClosedOverlap"
path = "scripts/close_tickets.py"
find = "        if status not in TICKET_CLOSED_STATUSES:"
replace = "        if False:  # MUTANT: open tickets accepted as closed"
description = "a ticket still open in the plan is accepted as closed, so open and closed overlap"
refine_variable = "ticket_state"
refine_action = "CloseTicket"

[[mutants]]
id = "inv-CurrentRequiresDesired"
boundary_kind = "invariant"
boundary_ref = "CurrentRequiresDesired"
path = "scripts/new_ticket_workflow.py"
find = "    written.extend(copy_workflow_tree(source_current, desired_dir, force=force, dry_run=dry_run, skip_paths=skip_project_tests))"
replace = "    pass  # MUTANT: ticket desired/ is never seeded, so current exists without desired"
description = "ticket scaffolding never seeds desired/, so current can be ready with no desired"
refine_variable = "ticket_state"
refine_action = "OpenTicket"

[[mutants]]
id = "inv-SpecUnitTestsRequireCurrent"
boundary_kind = "invariant"
boundary_ref = "SpecUnitTestsRequireCurrent"
path = "scripts/tla_spec_dev.py"
find = '        print(f"ERROR: spec-unit target does not exist: {missing_targets[0]}", file=sys.stderr)'
replace = '        missing_targets = []  # MUTANT: missing spec-unit target no longer refused'
description = "spec-unit tests run against a nonexistent ticket current/ instead of refusing"
refine_variable = "ticket_state"
refine_action = "RunSpecUnitTests"

# CD-09 (G2): the inv-SpecUnitTestsRequireAnalyzedGate mutant left with the
# invariant. Its removed target -- bypassing the advisory scan inside case
# generation -- concerned the EXPERIMENTAL generation surface, unmodeled
# post-pivot; the INVARIANTS block no longer names the property, so the
# recomputed obligation set no longer requires a fault for it.

[[mutants]]
id = "inv-SpecUnitTestsRequireMeasuredCorpus"
boundary_kind = "invariant"
boundary_ref = "SpecUnitTestsRequireMeasuredCorpus"
path = "scripts/generate_cases_from_tlc_dump.py"
find = "    enforce_case_cap("
replace = "    _ = lambda **kw: None  # MUTANT: case caps never enforced\n    _("
description = "the generated corpus is never measured against the case caps"
refine_variable = "corpus_gate"
refine_action = "AnalyzeCorpus"

[[mutants]]
id = "inv-SpecUnitTestsRequireMeasuredEffects"
boundary_kind = "invariant"
boundary_ref = "SpecUnitTestsRequireMeasuredEffects"
path = "scripts/run_generated_case_adapters.py"
find = """        if not report.ok:
            failures.append(f"effect conformance {report.verdict}:\\n{report.render()}")"""
replace = """        if False:  # MUTANT: effect conformance verdict recorded but never enforced
            failures.append(f"effect conformance {report.verdict}:\\n{report.render()}")"""
description = "the effect conformance verdict is measured and reported but no longer fails the run"
refine_variable = "effect_conformance"
refine_action = "RunSpecUnitTests"

# Note this one: adding KillTestVerdictRequiresBudgets to MC.cfg immediately
# made the kill test refuse with an incomplete catalog until this mutant
# existed. That is the coverage mechanism working on its own oracle, and it is
# the behavior to expect every time the model gains a port or an invariant.
[[mutants]]
id = "inv-KillTestVerdictRequiresBudgets"
boundary_kind = "invariant"
boundary_ref = "KillTestVerdictRequiresBudgets"
path = "scripts/kill_test.py"
find = '    floor = float(budgets["kill_rate_floor"])'
replace = "    floor = 0.0  # MUTANT: the floor is read from nowhere and gates nothing"
description = "the kill-rate floor is hardcoded to 0.0 instead of read from the negotiated budgets, so every rate passes"
refine_variable = "kill_test"
refine_action = "RunKillTest"

[[mutants]]
id = "inv-ClosedTicketsPassedSpecUnitTests"
boundary_kind = "invariant"
boundary_ref = "ClosedTicketsPassedSpecUnitTests"
path = "scripts/spec_evolution.py"
find = "    if not allow_open and status not in TICKET_CLOSED_STATUSES:"
replace = "    if False:  # MUTANT: history entry created for a ticket that never passed"
description = "close history is written for a ticket that never reached a closed status"
refine_variable = "ticket_state"
refine_action = "CloseTicket"

# RC-01 (owner decision 2026-08-01): fault for the weakened-close property. The
# history entry claims every close went through the guard, so a close taken
# under --accept-new or --allow-open becomes indistinguishable in the record
# from one that passed the precondition -- which is the state of affairs this
# ticket exists to end.
[[mutants]]
id = "inv-WeakenedClosesCertifyNothing"
boundary_kind = "invariant"
boundary_ref = "WeakenedClosesCertifyNothing"
path = "scripts/spec_evolution.py"
find = '        "model_action": "CloseTicketWeakened" if used else "CloseTicket",'
replace = '        "model_action": "CloseTicket",  # MUTANT: a weakened close is recorded as a guarded one'
description = "the append-only history records every close as a guarded close, so a bypassed precondition leaves no trace"
refine_variable = "ticket_state"
refine_action = "CloseTicketWeakened"
