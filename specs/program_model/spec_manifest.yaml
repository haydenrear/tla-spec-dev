# MF-023: the accepted baseline is now the DECOMPOSED model. Core.tla /
# Internal.tla / External.tla replace the single TlaSpecDevCli.tla module, and
# the state/action inventory below is reconciled with them. Before this ticket
# this manifest still named cli_built, cli_installed, project_scaffolded,
# workflow_scaffolded, active_tickets, desired_ready, current_ready,
# spec_unit_tests_passed and closed_tickets -- variables collapsed by MF-020,
# MF-022 and MF-025 -- and listed an action, ValidateTestGraphCli, that exists
# in no model at all. Nothing checked either fact.
module: External
internal_module: Internal
core_module: Core
package: tlaspecdevcli_program_cases

status:
  workflow: closed
  active_ticket: null
  active_ticket_title: null
  model_role: accepted_program_model
  relation_to_current: none_until_next_ticket_workflow
  relation_to_desired_program_model: none_until_next_ticket_workflow
  updated: null
  accepted_slice:
    name: shipped-tla-spec-dev-cli-workflow
    status: accepted
    summary: "The shipped CLI workflow is implemented, documented, validated through spec-unit adapters, and covered by the parent specWorkflow Test Graph."
    implemented_actions:
      - BuildSkillCli
      - InstallLocalCli
      - ScaffoldProject
      - ScaffoldWorkflow
      - OpenTicket
      - CloseTicket
      - RunSpecUnitTests
    validation:
      tlc:
        - python3 -c "import subprocess; subprocess.run(['bash','scripts/run_tlc.sh','specs/program_model/Internal.tla','specs/program_model/Internal.cfg'], timeout=120, check=True)"
      unit:
        - rg "tla-spec-dev --spec-root" README.md SKILL.md references test_graph/README.md
        - uv run --with pytest -m pytest tests -q
        - uv run --with pytest -m pytest specs/program_model/tests -q
      graph:
        - python3 /Users/hayde/.skill-manager/skills/test-graph/scripts/run.py specWorkflow
      evidence:
        - "SKILL.md, README.md, references, and test_graph/README.md introduce tla-spec-dev before lower-level implementation scripts."
        - "Docs preserve the desired-first ticket workflow, spec-root rule, and specWorkflow reference path."
        - "Workflow close snapshot is recorded under specs/.history/tla-spec-dev-cli-workflow/closed-snapshot."
  next_workflow: "scaffold specs/current and specs/desired_program_model only when opening the next desired/current ticket workflow."

source_model:
  closed_workflow_history: ../.history/tla-spec-dev-cli-workflow/closed-snapshot

state:
  # Internal view -- the workflow state machine.
  InternalState:
    fields:
      setup_phase:
        type: int          # 0..5 bootstrap ordinal (MF-022 collapse)
        tla: setup_phase
      spec_root:
        type: SpecRoot
        tla: spec_root
      ticket_state:
        type: dict[TicketId, int]   # 0..5 lifecycle ordinal (MF-025 collapse)
        tla: ticket_state
      complexity_gate:
        type: str
        tla: complexity_gate
      corpus_gate:
        type: str
        tla: corpus_gate
      effect_conformance:
        type: str
        tla: effect_conformance
      kill_test:
        type: str
        tla: kill_test
  # External view -- the observable CLI channel, and nothing else.
  ExternalState:
    fields:
      last_command:
        type: str
        tla: lastCommand
      result:
        type: CliWorkflowResult
        tla: result

actions:
  - BuildSkillCli
  - InstallLocalCli
  - ScaffoldProject
  - RecordBudgets
  - ScaffoldWorkflow
  - OpenTicket
  - UpdateTicketDesired
  - UpdateTicketCurrent
  - AnalyzeComplexity
  - AnalyzeCorpus
  - RunEffectConformance
  - RunKillTest
  - RunSpecUnitTests
  - CloseTicket

commands:
  build_skill_cli:
    cli: skill-script:tla-spec-dev creates the local wrapper
    action: BuildSkillCli
    adapter: BuildSkillCliAdapter
  install_local_cli:
    cli: tla-spec-dev --help
    action: InstallLocalCli
    adapter: InstallLocalCliAdapter
  scaffold_project:
    cli: tla-spec-dev --spec-root <root> scaffold project
    action: ScaffoldProject
    adapter: ScaffoldProjectAdapter
  scaffold_workflow:
    cli: tla-spec-dev --spec-root <root> scaffold workflow
    action: ScaffoldWorkflow
    adapter: ScaffoldWorkflowAdapter
  open_ticket:
    cli: tla-spec-dev --spec-root <root> open ticket <ticket-name>
    action: OpenTicket
    adapter: OpenTicketAdapter
  run_spec_unit_tests:
    cli: tla-spec-dev --spec-root <root> run spec-unit-tests
    action: RunSpecUnitTests
    adapter: RunSpecUnitTestsAdapter
  close_ticket:
    cli: tla-spec-dev --spec-root <root> close ticket <ticket-name>
    action: CloseTicket
    adapter: CloseTicketAdapter
  # MF-023: validate_test_graph_cli REMOVED. It named action
  # ValidateTestGraphCli, which exists in no TLA model -- MF-026's fourth
  # desync. It is a VALIDATION HARNESS invocation, and this manifest's own
  # test_modeling_rule forbids modeling validation harnesses as program
  # behavior, so the correct reconciliation is to drop it from the action
  # vocabulary rather than to invent a model action for it. TestGraphCliAdapter
  # and its unit test are retained as an ordinary harness test.

ports:
  TlaSpecDevCliPort:
    role: production_adapter_surface
    commands:
      - BuildSkillCli
      - InstallLocalCli
      - ScaffoldProject
      - ScaffoldWorkflow
      - OpenTicket
      - CloseTicket
      - RecordBudgets
      - UpdateTicketDesired
      - UpdateTicketCurrent
      - AnalyzeComplexity
      - AnalyzeCorpus
      - RunEffectConformance
      - RunKillTest
      - RunSpecUnitTests

invariants:
  - TypeInvariant
  - CliInstalledRequiresBuilt
  - WorkflowRequiresProject
  - ProjectChoosesKnownSpecRoot
  - NoOpenClosedOverlap
  - CurrentRequiresDesired
  - SpecUnitTestsRequireCurrent
  - ClosedTicketsPassedSpecUnitTests

case_codegen:
  style: explicit_transition_cases
  generation_status: planned

adapters: case_adapters.toml
notes:
  package_from_program_model: tlaspecdevcli_program_cases
  progressive_disclosure: "CLI-007 documents the end-to-end CLI workflow through progressive-disclosure onboarding references."
