    schedule_revision: 1
    depends_on: []
    blocks: [RD-02, RD-03, RD-04]
    wave: 1
    promotion_order: 10
    promotion_predecessor: null
    conflict_keys:
      production: []
      tla: []
      adapters: []
      test_graph: []
      workflow: [examples/validation/scorecards/score_tools.py, references/eval_scorecard.md]
    objective: >-
      FIRST AND ALONE. subtract-to-measure was justified by 'D2 = 2 on 27 of 27 cards', true of ONE example, restated unscoped in the charter, the plan and the issue, and verified with a script containing `if "ab_quota_ledger" not in f: continue`. Make that catchable: a claim of the form 'D<n> = k on N of N cards' must carry its scope and something must refuse it when the underlying cards span more examples than the claim admits. SWEEP the existing charters, plans and issues -- those claims are data. Make CONTESTED COMPUTE: rule 5 says a spread > 1 is contested and needs a third pass, nothing implements it, and index printed a dash on all four rows of a round where a spread of 2 existed. And record JUDGE TIER as a first-class field: opus judged D3 2,2 and sonnet 4,3 on the same artifact while D2 agreed across tiers, and nothing surfaces that.
    desired_actions: []
    implementation_scope: [examples/validation/scorecards/, references/eval_scorecard.md, tests/]
    goals:
      - goal: GOAL-scope-loss-catchable
        contribution: direct
        expected_effect: >-
          The count of refuted historical claims moves off zero, or the ticket reports which claims the check cannot reach and why.
        local_signal: sweep the record and report the refuted claims, named
      - goal: GOAL-tags-earn-their-place
        contribution: enabling
        expected_effect: >-
          none -- contested must compute before architecture tags can be designed against it; D3's contested spread is the best evidence tags are needed
        local_signal: contested fires on the known spread-2 case
      - goal: GOAL-apparatus-priced
        contribution: guard
        expected_effect: none expected
        local_signal: N/A
    acceptance:
      commands: [uv run --with pytest --with pyyaml python -m pytest tests -q]
      assertions: ["An unscoped D<n> = k on N of N claim is refused when the underlying cards span more examples than it admits.", 'contested computes: a spread > 1 sets the flag and index reports it.', Judge tier is a first-class recorded field and a tier split is visible., "Each check ships a demonstrated FAILING input run against the REAL historical claims, not a fixture."]
