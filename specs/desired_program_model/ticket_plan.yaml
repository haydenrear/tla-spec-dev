  - id: PA-06
    title: 'EVALUATION: three arms, judged blind, deciding the three goals'
    status: planned
    role: evaluation
    owns_goals: [GOAL-port-reach, GOAL-cases-drive-ports, GOAL-complexity-measurable]
    github_issue: https://github.com/haydenrear/tla-spec-dev/issues/135
    schedule_revision: 1
    depends_on: [PA-01, PA-02, PA-03, PA-04, PA-05]
    blocks: []
