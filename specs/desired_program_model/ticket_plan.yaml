      tla: []
      adapters: []
      test_graph: []
      workflow: [examples/validation/ab/]
    objective: >-
      Goes FIRST AND ALONE, seeded before any measurement runs, because three tickets in a row correctly declined to seed it after seeing their numbers. GOAL-port-reach clause 2 could not be met last epic because no positive control is seeded inside a port's region, so every port-scoped kill number is a FLOOR including the headline. PA-06-DF-07 is blocking and worse: the repaired control is unobservable in one step on three of four trees AND ITS PROBE CANNOT FAIL -- a no-op reports HOLDS. Fixing the control without fixing the probe re-creates the defect. R2 applies: if it cannot be made to work on some tree, REPORT IT RED.
    desired_actions: []
    implementation_scope: [examples/validation/]
    goals: []
    acceptance:
      commands: [uv run --with pytest --with pyyaml python -m pytest tests -q]
      assertions: [A positive control is seeded INSIDE a port's region on every tree that declares a port., "The probe ships a DEMONSTRATED FAILING INPUT: a deliberately broken control that the probe reports broken.", "Any control that cannot be made to work is reported RED, never made green by weakening its assertion."]
    model_delta_expectation: none expected
