  - id: CD-06
    title: "Descriptor accuracy: R/W matrix attributed to top-level actions through called operators"
    status: planned
    github_issue: "PLACEHOLDER_ISSUE_CD06"
    schedule_revision: 1
    depends_on: [CD-05]
    blocks: [CD-07]
    wave: 2
    promotion_order: 40
    promotion_predecessor: CD-08
    conflict_keys:
      production:
        - scripts/analyze_complexity.py
        - tests/test_analyze_complexity.py
      tla: []
      adapters: []
      test_graph: []
      workflow: []
    objective: >
      Resolves VAL-07 and VAL-12 — the same attribution defect from both
      directions, hit independently in three validation runs. The R/W matrix
      attributes primed variables to the syntactic primer, so (a) wrapper
      actions that prime a variable only through a helper operator vanish
      from the matrix (9 CLI actions collapsed to 4 on taskq), and (b)
      helper operators are listed AS actions while composed actions whose
      writes happen entirely through called operators or UNCHANGED get no
      column (MarkExternal listed, RunFulfillmentWorker absent, on
      distributed_history). Dense-row fractions, dense columns,
      action_count, component action counts — and the fitness facts derived
      from them — are computed over a partially wrong action set. Fix:
      attribute primes to the top-level action disjuncts (Next/ExternalNext
      members), expanding called-operator bodies transitively (the CD-01/F1
      resolution machinery, extended by CD-05); helpers are not actions.
      Regression tests covering both shapes, failing pre-fix; verify against
      the real distributed_history External view and record the corrected
      matrix as evidence.
    desired_actions: []
    implementation_scope:
      - scripts/analyze_complexity.py (action attribution / matrix construction)
      - tests/test_analyze_complexity.py (both-direction regression tests)
    current_increment:
      model_state: []
      model_actions: []
      adapters: []
      unit_tests:
        - uv run --with pytest --with pyyaml -m pytest tests -q
      graph_after_unit_pass:
        - specWorkflow
        - cliWorkflow
    acceptance:
      commands:
        - python3 scripts/tla_spec_dev.py --spec-root specs run spec-unit-tests --ticket CD-06
      assertions:
        - "Helper-primed wrapper actions appear as matrix columns; helpers do not (regression test failing pre-fix)."
        - "Actions writing only through called operators or UNCHANGED get columns (regression test failing pre-fix)."
        - "On examples/distributed_history External.tla the matrix lists the ExternalNext disjuncts (RunFulfillmentWorker present, MarkExternal absent) — recorded as evidence."
        - "Dense rows/columns and action counts are computed over the corrected action set; fitness facts follow."
        - "Zero TLA+ model delta: ticket current == desired; TLC green; max_distinct_states 500000 carried through desired/ with rationale and verified post-promotion."
      evidence:
