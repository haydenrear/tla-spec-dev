# Canonical plan for the modular-fuzzing epic. GitHub issues mirror this file
# for handoff; this file remains the source of truth. Dispatched ticket IDs,
# dependency edges, waves, and promotion order are immutable after issue
# assignment — add amendment tickets instead of editing dispatched identities.
version: 1
name: modular-fuzzing-epic
updated: "2026-07-18"
purpose: "Mechanize the modular pure-function/side-effect fuzzing doctrine (references/modular_fuzzing.md) in the tla-spec-dev CLI: per-program budgets, complexity analysis gates, corpus distillation, effect conformance, External channel enforcement, mutation kill tests, and the skill feedback loop."

