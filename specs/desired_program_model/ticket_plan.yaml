    Component-size heuristics are unaffected and working correctly.

planning_rules:
  current_model_rule: Update specs/current after each production slice lands as a whole-program working copy of specs/program_model, not a ticket projection.
  unit_validation_rule: Run current-model TLC and adapter/unit tests before adding graph execution.
  graph_rule: Add graph or integration nodes only after current-model validation passes.
  semantic_model_rule: Do not add test graph nodes, pytest jobs, CI workflow steps, integration harnesses, or validation scripts as TLA+ program state/actions. The CLI's own workflow commands (scaffold, analyze, generate, close) ARE program behavior for this repository.
  evidence_rule: Record tests and graph runs as evidence for semantic program actions in manifests or ticket status.
  desired_sync_rule: Update this file and spec_manifest.yaml whenever scope, order, acceptance checks, or status changes; bump schedule_revision for any change to IDs, edges, waves, promotion order, conflict keys, or validation scope.
  promotion_rule: Only epic finalization promotes; ticket agents close exactly their own ticket and never run close_tickets.py or use --accept-new.
  case_execution_rule: Spec-case execution is DEFERRED epic-wide by owner direction 2026-07-18. Tickets build and unit-test their mechanisms but do not run generated spec cases, case generation over the reachable state graph, the distilled corpus, the effect-conformance sweep, or the mutation kill test. All such runs happen in MF-023, which performs the Internal/External decomposition by dogfooding the finished toolchain on this repository. Rationale -- runs made against the single-module baseline would be evidence about a model shape the epic intends to replace, and would have to be redone after the split. The surviving MF-011 gate finding (C1 touched by 11 actions vs max_component_actions 8) refuses case generation for exactly that reason -- it is a true finding about the undecomposed baseline, not a miscalibration, and must NOT be worked around with --allow-over-budget or by renegotiating the component budgets. Validate with unit tests, adapter tests, fixtures, and the repository test graphs instead, and record per ticket which validations were deferred to MF-023.
  toolchain_rule: Never invoke the PATH `tla-spec-dev` wrapper for this epic. It execs ~/.skill-manager/skills/spec-double-compiler, a separate clone tracking main and pinned at da0a7ff (this epic's base_sha), so it runs pre-epic behavior and contains none of the epic's work. `skill-manager sync` does NOT fix this, because the installed clone tracks main and the epic does not reach main until finalization. Use `python3 scripts/tla_spec_dev.py --spec-root specs ...` from the repository root for every lifecycle command. The automated layers (pytest, spec-unit adapters via production_adapters.py, test_graph nodes) already resolve to the repository and need no change. Revisit at epic finalization, when merging to main makes the installed clone correct again.

