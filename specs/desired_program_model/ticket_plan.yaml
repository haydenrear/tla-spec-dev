# Canonical plan for the complexity-descriptor-main-readiness workflow.
# GitHub issues mirror this file for handoff; this file remains the source of
# truth. Dispatched ticket IDs, dependency edges, waves, and promotion order
# are immutable after issue assignment — add amendment tickets instead of
# editing dispatched identities.
#
# Successor to the closed complexity-descriptor-epic workflow (snapshot in
# specs/.history/). Owner direction 2026-07-22: this batch makes the epic
# branch safe to merge to main — every negative side effect the six validation
# runs surfaced is fixed here. All 19 triaged findings
# (specs/results/epic-close/deferred_findings_final.yaml) map onto CD-04..08.
# After the batch merges, the validation agents are re-run; main merge and
# skill-manager sync happen only on explicit owner say-so after that.
version: 1
name: complexity-descriptor-main-readiness
updated: "2026-07-22"
purpose: "Main-readiness batch: replace every remaining prescriptive suggestion with a factual finding plus a redesign question (take the descriptor + intuition doc to consider making the architecture simpler); fix the descriptor-accuracy blind spots validation found (domain resolution, R/W attribution); align all scaffold/UX language with the advisory doctrine; repair the shipped example so it passes its own workflow. Zero TLA+ model delta throughout."

epic:
  id: complexity-descriptor
  branch: epic/complexity-descriptor
  default_branch: main
  base_sha: fe0491cd630f518ef839582dfb9f926c1b49e983
  schedule_revision: 1
  review_mode: epic-owner-post-merge
  notes: >
    Same epic branch, successor spec workflow. Per repository-owner direction,
    ticket agents merge their reviewed-green feature branch into
    epic/complexity-descriptor themselves after validation and ticket close;
    the epic owner reviews post-merge. The repository owner closes GitHub
    issues. Never merge to main and never run skill-manager sync without
    explicit owner say-so. All five tickets are zero-TLA+-model-delta; each
    still opens/closes its spec ticket with evidence and carries
    max_distinct_states 500000 with its rationale through desired/. Wave 1
    (CD-04, CD-05, CD-08) runs in parallel on disjoint conflict keys;
    promotion is strictly serialized 10..50. After CD-07 merges, the three
    validation examples are re-run before any main-merge decision.

deferment_policy:
  mode: batch
  blocking: escalate
  budget: 5
  backlog: "specs/desired_program_model/deferred_findings.yaml"

planning_rules:
  current_model_rule: Update specs/current after each production slice lands as a whole-program working copy of specs/program_model, not a ticket projection.
  unit_validation_rule: Run current-model TLC and adapter/unit tests before adding graph execution.
  graph_rule: Add graph or integration nodes only after current-model validation passes.
  semantic_model_rule: Do not add test graph nodes, pytest jobs, CI workflow steps, integration harnesses, or validation scripts as TLA+ program state/actions. The CLI's own workflow commands ARE program behavior for this repository.
  evidence_rule: Record tests and graph runs as evidence for semantic program actions in manifests or ticket status.
  desired_sync_rule: Update this file and spec_manifest.yaml whenever scope, order, acceptance checks, or status changes; bump schedule_revision for any change to IDs, edges, waves, promotion order, conflict keys, or validation scope.
  promotion_rule: Only workflow finalization promotes the whole model; ticket agents close exactly their own ticket and never run close_tickets.py or use --accept-new.
  case_execution_rule: The fuzzing machinery is EXPERIMENTAL and not product validation — do not run case generation, the corpus, effect conformance, or the kill test as ticket validation (CD-08 exercises the example's documented generation path as its ACCEPTANCE surface, which is different from product validation).
  toolchain_rule: Never invoke the PATH `tla-spec-dev` wrapper. It execs ~/.skill-manager/skills/spec-double-compiler, a clone tracking main at da0a7ff (pre-everything), so it runs none of the epic lineage's work. Use `python3 scripts/tla_spec_dev.py --spec-root specs ...` from the repository root. Revisit after the main merge + sync this batch prepares.

status:
  workflow: complexity-descriptor-main-readiness
  active_ticket: none-dispatch-pending
  active_ticket_title: "Main-readiness batch planned; wave 1 (CD-04, CD-05, CD-08) ready to dispatch"
  desired_module: TlaSpecDevCli
  phase: implementation

service_catalog:
  existing_boundaries:
    - tla-spec-dev CLI (scaffold/open/run/analyze/close)
    - scripts/analyze_complexity.py complexity descriptor
    - scripts/fitness_functions.py advisory fitness rules
    - scripts/corpus_diagnostics.py corpus gate (EXPERIMENTAL fuzzing surface)
    - examples/distributed_history ticket-workflow example
  desired_boundaries:
    - corpus gate speaks findings + a redesign question, never a prescriptive move
    - descriptor domain resolution covers operator-defined sets, wrapped conjuncts, and multi-view invariant naming
    - R/W matrix attributed to top-level actions through called operators
    - scaffold/UX language consistent with the advisory doctrine
    - the shipped example passes its own documented workflow out of the box
  adapter_boundaries:
    - specs/program_model/production_adapters.py spec-unit adapters
    - test_graph specWorkflow / cliWorkflow graphs
  known_gaps:
    - "Suggestions removed by CD-01 may return in a later epic, earned from real-app descriptor observations, possibly as an agent. Not in this batch."

tickets:
  - id: CD-04
    title: "Corpus gate: replace suggestion language with a redesign question; sweep all remaining prescriptive-move output"
    status: planned
    github_issue: "PLACEHOLDER_ISSUE_CD04"
    schedule_revision: 1
    depends_on: []
    blocks: [CD-07]
    wave: 1
    promotion_order: 10
    promotion_predecessor: null
    conflict_keys:
      production:
        - scripts/corpus_diagnostics.py
        - scripts/tla_spec_dev.py
        - tests/test_corpus_diagnostics.py
        - references/modular_fuzzing.md
      tla: []
      adapters: []
      test_graph: []
      workflow: []
    objective: >
      Resolves VAL-13. The corpus gate still prints "Suggested move: ...
      RECOMMENDATION REQUIRING USER APPROVAL" (corpus_diagnostics.py ~760,
      with supporting text ~48/~767 and the analyze corpus help in
      tla_spec_dev.py ~612) — prescriptive-move language the epic pivot
      removed from the scanner but not from this path, and a real validation
      agent met it mid-ticket. Replace it with a factual finding plus a
      REDESIGN QUESTION: state what the corpus concentration measures, then
      prompt the reader to consider whether the architecture can be
      redesigned to make the program simpler — pointing at the complexity
      descriptor and references/complexity_intuition.md as the judgment
      inputs (the CD-02 framing: "take this complexity descriptor to
      consider how to refactor complexity out of the app"). Nothing is
      prescribed and nothing is auto-applied. Then SWEEP the whole
      repository for every remaining case of prescriptive suggestion
      language the pivot missed (grep-driven inventory: "suggested move",
      "suggest_move", "recommendation requiring", "apply the suggested",
      case-insensitive): every occurrence in reachable output, help text,
      docs, or tests is removed or reworded to the finding+question form;
      immutable history (specs/.history) is left untouched and listed as
      exempt. The inventory with per-occurrence disposition is recorded as
      evidence — the owner's stated concern is that earlier passes did not
      capture all the cases.
    desired_actions: []
    implementation_scope:
      - scripts/corpus_diagnostics.py (finding + redesign question output)
      - scripts/tla_spec_dev.py (analyze corpus help text)
      - tests/test_corpus_diagnostics.py (assert question form, no prescriptive move)
      - references/modular_fuzzing.md (corpus gate description)
    current_increment:
      model_state: []
      model_actions: []
      adapters: []
      unit_tests:
        - uv run --with pytest --with pyyaml -m pytest tests -q
      graph_after_unit_pass:
        - specWorkflow
        - cliWorkflow
    acceptance:
      commands:
        - python3 scripts/tla_spec_dev.py --spec-root specs run spec-unit-tests --ticket CD-04
      assertions:
        - "The corpus gate's over-cap output states the measurement and asks the redesign question; it names the descriptor and references/complexity_intuition.md; no prescriptive move (abstract/decompose/refactor/apply) appears in any reachable output or help text."
        - "A repo-wide grep inventory (recorded as evidence) shows zero remaining prescriptive suggestion language outside specs/.history and immutable ticket records, with a per-occurrence disposition for everything found."
        - "Tests assert the question form and fail if prescriptive-move wording returns."
        - "Zero TLA+ model delta: ticket current == desired; TLC green; max_distinct_states 500000 carried through desired/ with rationale and verified post-promotion."
      evidence:
        - specs/tickets/CD-04/results/suggestion_sweep_inventory.md
        - specs/tickets/CD-04/results/corpus_gate_output_after.txt
        - specs/tickets/CD-04/results/tlc_current.txt
        - specs/tickets/CD-04/results/spec_unit_tests.txt
        - specs/tickets/CD-04/results/repo_unit_tests.txt
        - specs/tickets/CD-04/results/graph_specWorkflow.txt
        - specs/tickets/CD-04/results/graph_cliWorkflow.txt

  - id: CD-05
    title: "Descriptor accuracy: domain resolution sees operator-defined sets, wrapped conjuncts, and multi-view invariant naming"
    status: planned
    github_issue: "PLACEHOLDER_ISSUE_CD05"
    schedule_revision: 1
    depends_on: []
    blocks: [CD-06, CD-07]
    wave: 1
    promotion_order: 20
    promotion_predecessor: CD-04
    conflict_keys:
      production:
        - scripts/analyze_complexity.py
        - tests/test_analyze_complexity.py
        - references/architecture_tractability.md
      tla: []
      adapters: []
      test_graph: []
      workflow: []
    objective: >
      Resolves VAL-06, VAL-16, VAL-17 — three domain-resolution blind spots
      that real agents hit in three of six validation runs, each currently
      degrading the bound to UNKNOWN (or a partial product) on standard
      patterns. (1) VAL-06: _set_size resolves only literals, int ranges,
      BOOLEAN, unions, and cfg constants; an operator-defined set (TaskStatus
      == {...} in an EXTENDS-ed module, used as tasks \in [Names ->
      TaskStatus]) resolves unknown even though resolve_definition_body has
      already expanded the operator — consult it (the same transitive
      resolution CD-01 built for F1). (2) VAL-16: the `variable \in <domain>`
      regex captures to end-of-line, so a membership conjunct wrapped across
      lines silently resolves unknown — parse conjunct-wise, not line-wise.
      (3) VAL-17: domain-source precedence (any TypeInvariant in the EXTENDS
      hierarchy becomes the sole source, then TypeOK, then cfg invariants)
      interacts badly with the scaffold's own multi-view layout where
      TypeInvariant cannot be redefined per view — merge domain sources
      (per-variable, first resolvable wins with a documented order) instead
      of first-named-definition-wins, or document the per-view naming
      convention and make the resolver honor both names. Regression tests for
      each, failing pre-fix. Document exactly what the resolver can see.
    desired_actions: []
    implementation_scope:
      - scripts/analyze_complexity.py (_set_size, infer_dimensions, domain-source precedence)
      - tests/test_analyze_complexity.py (three regression tests, failing pre-fix)
      - references/architecture_tractability.md (document the resolver's coverage)
    current_increment:
      model_state: []
      model_actions: []
      adapters: []
      unit_tests:
        - uv run --with pytest --with pyyaml -m pytest tests -q
      graph_after_unit_pass:
        - specWorkflow
        - cliWorkflow
    acceptance:
      commands:
        - python3 scripts/tla_spec_dev.py --spec-root specs run spec-unit-tests --ticket CD-05
      assertions:
        - "An operator-defined set in an EXTENDS-ed module resolves (regression test failing pre-fix); a membership conjunct wrapped across lines resolves (failing pre-fix); a multi-view scaffold layout resolves domains for both views without renaming tricks (failing pre-fix)."
        - "The explicit-UNKNOWN path (F3) is preserved for genuinely unresolvable domains — never a silent number."
        - "The resolver's coverage is documented where agents look (the reference the scanner output cites)."
        - "Zero TLA+ model delta: ticket current == desired; TLC green; max_distinct_states 500000 carried through desired/ with rationale and verified post-promotion."
      evidence:
        - specs/tickets/CD-05/results/domain_resolution_regressions.txt
        - specs/tickets/CD-05/results/tlc_current.txt
        - specs/tickets/CD-05/results/spec_unit_tests.txt
        - specs/tickets/CD-05/results/repo_unit_tests.txt
        - specs/tickets/CD-05/results/graph_specWorkflow.txt
        - specs/tickets/CD-05/results/graph_cliWorkflow.txt

