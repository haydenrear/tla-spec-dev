epic_goals:
  - id: GOAL-removal-can-be-priced
    kind: eval
    statement: >-
      A removal can be priced AT ALL -- the pricing instrument is capable of returning a non-zero answer.
    metric: >-
      Whether any removal prices non-zero, and whether the instrument reproduces the one known DIES->SURVIVES.
    harness: RM-01's instrument, exercised by RM-03's removals, decided by RM-05
    baseline:
      value: >-
        ENTAILED. 0 OF 9 gap mutants over the sealed before-table could have priced their removal: six had no kill at all, three were killed by detectors that outlived their cut, and one ticket deleted no detector so all six of its mutants were structurally incapable. The re-runnability rule EXCLUDES the faults that could go DIES->SURVIVES -- the one fault the machinery uniquely caught was declared not_seedable because it cannot be re-run after the cut. SM-04-GM-T1 is the ONLY removal ever measured to cost anything.
      measured_at: 19c5c7b
      evidence: specs/results/scorecards/reading-discipline/ -- RD-02
    target: >-
      The instrument reproduces SM-04-GM-T1's DIES->SURVIVES, and at least one historical removal is re-priced. NO TARGET ON THE PRICE -- a high price on a past removal is the informative outcome, and an instrument tuned until the number is comfortable has failed this goal.
    evaluation_ticket: RM-05
    evidence_root: specs/results/scorecards/portable-substrate/GOAL-removal-can-be-priced
  - id: GOAL-dead-weight-gone
    kind: quality
    statement: >-
      The three levers that failed against a control are gone, and the removal is priced per removal or honestly labelled unpriced.
    metric: >-
      Per removal: lines removed, lines added to prove it safe, the ratio. Never a total. Plus what an adopter must now understand, before and after.
    harness: RM-03, re-measured by RM-05
    baseline:
      value: >-
        ALL THREE STILL CARRIED. Generated-case bug-finding: 0 unique kills against 4 the other way, replicated on new subjects. Static gates: five epics, no caught bug. The suite as a finding channel: ONE finding in seven rounds at the cost of a full run each time. And every epic that called itself a simplification came out net-additive -- subtract-to-measure at net +1677 lines.
      measured_at: 19c5c7b
      evidence: NEXT-EPIC.md sections 0-AAAAAA and 0-AAAAA
    target: >-
      The three are removed or the round says which survived and why, each priced or labelled unpriced. THE SUITE IS DEFUNDED AS A FINDING CHANNEL, NOT DELETED -- it keeps the regression-guard job.
    evaluation_ticket: RM-05
    evidence_root: specs/results/scorecards/portable-substrate/GOAL-dead-weight-gone
  - id: GOAL-dimensions-replicate
    kind: eval
    statement: >-
      D2 and D3 replicate on a subject that is not ab_quota_ledger, and D4/D5 are either bound to tier-proof evidence or dropped.
    metric: >-
      D2 and D3 on the toolchain as a subject, with a real before/after; and the bind-or-drop decision for D4 and D5.
    harness: RM-04's blind round on scripts/, decided by RM-05
    baseline:
      value: >-
        D2 rests on TWO PAIRS OF ONE EXAMPLE IN ONE ROUND, and the round's own evaluator flagged it as the result to be most suspicious of because it came back clean against a sealed prediction that it would be thin. D2 ALSO SPLIT BY TIER -- opus [4,4] against sonnet [3,3], disjoint, on the dimension the card says holds still. D3's architecture tag was derived on one example and its state_colocation threshold of 0.5 HAS NEVER BEEN MEASURED NEAR ITS BOUNDARY. D4 and D5 both move under judge tier, and on D5 the tiers ran in OPPOSITE directions. The toolchain in scripts/ has NEVER been scored as a subject.
      measured_at: 19c5c7b
      evidence: specs/results/scorecards/reading-discipline/ -- RD-03, RD-04
    target: >-
      D2 and D3 either replicate off ab_quota_ledger or are BOUNDED by the attempt -- both outcomes are results. D4 and D5 are bound or dropped; NOT DECIDING IS NOT ACCEPTABLE.
    evaluation_ticket: RM-05
    evidence_root: specs/results/scorecards/portable-substrate/GOAL-dimensions-replicate
  - id: GOAL-portable
    kind: eval
    statement: >-
      What an external project would need to grade its own architecture with this substrate is decided on evidence, including what is irreducibly local.
    metric: >-
      The minimum an adopter must supply; which dimensions survive the trip; and the named list of what CANNOT be exported, with reasons.
    harness: RM-02's research, tested against the 73 sealed cards, decided by RM-05
    baseline:
      value: >-
        NEVER ASKED. The card has only ever graded this repository's own methodology, and its anchors are written in this project's vocabulary -- ports, adapters, effects, a spec double compiler -- which an external project does not have. Whether the card grades ARCHITECTURE or grades CONFORMANCE TO THIS PROJECT'S ARCHITECTURE is unmeasured.
      measured_at: 19c5c7b
      evidence: references/eval_scorecard.md, and the 73 sealed cards
    target: >-
      A decision with evidence from the sealed record, including an explicit list of what is irreducibly local. A design concluding everything is portable has not been tested. AND PORTABILITY MAY NOT BECOME A REASON TO ADD.
    evaluation_ticket: RM-05
    evidence_root: specs/results/scorecards/portable-substrate/GOAL-portable
tickets:
  - id: RM-01
    title: Build a gap mutant that can actually go DIES to SURVIVES
    status: planned
    github_issue: https://github.com/haydenrear/tla-spec-dev/issues/209
    schedule_revision: 1
    depends_on: []
    blocks: [RM-03, RM-05]
    wave: 1
    promotion_order: 10
    promotion_predecessor: null
    conflict_keys:
      production: []
      tla: []
      adapters: []
      test_graph: []
      workflow: [examples/validation/instruments/]
    objective: >-
      FIRST AND ALONE -- everything else depends on it. The instrument that prices removals CAN ONLY RETURN ZERO: a gap mutant prices a removal only if every detector that killed it is one the removal deletes, and over the sealed before-table that is 0 OF 9. The re-runnability rule is self-confirming BY CONSTRUCTION -- it excludes exactly the faults that could go DIES->SURVIVES, and SM-01 named the one fault the machinery uniquely caught and declared it not_seedable BECAUSE it cannot be re-run after the cut. Characterise the exclusion, build an instrument that can return non-zero, DEMONSTRATE A DIES->SURVIVES ON A REAL REMOVAL, and re-price at least one historical removal. SM-04-GM-T1 is the known-positive: an instrument that cannot reproduce it is not working. DO NOT TUNE UNTIL A COMFORTABLE NUMBER APPEARS -- a high price on a past removal is the informative outcome.
    desired_actions: []
    implementation_scope: [examples/validation/, tests/]
    goals:
      - goal: GOAL-removal-can-be-priced
        contribution: direct
        expected_effect: Pricing moves from structurally-always-zero to capable of a non-zero answer.
        local_signal: a DIES->SURVIVES on a real removal
      - goal: GOAL-dead-weight-gone
        contribution: enabling
        expected_effect: none -- nothing may be cut until a cut can be priced
        local_signal: N/A
      - goal: GOAL-dimensions-replicate
        contribution: guard
        expected_effect: none expected
        local_signal: N/A
      - goal: GOAL-portable
        contribution: guard
        expected_effect: none expected
        local_signal: N/A
    acceptance:
      commands: [uv run --with pytest --with pyyaml python -m pytest tests -q]
      assertions: [The instrument returns non-zero on at least one real removal., SM-04-GM-T1's DIES->SURVIVES is reproduced., 'At least one historical removal is re-priced, and a non-zero result is reported loudly.', A demonstrated FAILING input on a real subject.]
    model_delta_expectation: none expected
  - id: RM-02
    title: 'RESEARCH: what an external project would need, and what that says about what to cut'
    status: planned
    github_issue: https://github.com/haydenrear/tla-spec-dev/issues/210
    schedule_revision: 1
    depends_on: []
    blocks: [RM-03, RM-05]
    wave: 1
    promotion_order: 20
    promotion_predecessor: RM-01
    conflict_keys:
      production: []
      tla: []
      adapters: []
      test_graph: []
      workflow: [references/portable_scorecard.md]
    objective: >-
      A RESEARCH TICKET -- design and evidence, NO production code. Its output SCOPES RM-03's removal. The card has only ever graded this repository's own methodology, and the owner intends to expose it so external projects grade their own architecture, with the regressions they find by hand becoming card and architecture iterations they choose. That is strategic AND it is the only non-arbitrary stopping rule available for how much to cut. Decide: what is actually portable; what the card assumes that only this repo satisfies -- DOES IT GRADE ARCHITECTURE OR CONFORMANCE TO THIS PROJECT'S ARCHITECTURE, answered from the sealed cards rather than the anchors' wording; the minimum an adopter must supply; WHICH DIMENSIONS SURVIVE THE TRIP, because a dimension that cannot be trusted in the project that built it should not be exported; and whether the card's change rule survives an adopter using it. THE TRAP: do not design a product, and DO NOT LET PORTABILITY BECOME A REASON TO ADD. The most valuable output may be 'these three things cannot be exported and here is why.'
    desired_actions: []
    implementation_scope: [references/, specs/results/]
    goals:
