version: 1
name: score-drives-validation-epic
updated: null
purpose: >-
  THE OWNER'S GOAL IN TWO HALVES: any project being onboarded can, DURING THE GOAL PROCESS and across any and all epics, score its VALIDATION and its ARCHITECTURE; and from that goal and scorecard, NEW VALIDATION is introduced into the project -- improved architecture and diagrams, and integration and unit tests derived from them. HALF ONE IS HALF TRUE. HALF TWO HAS NEVER BEEN ATTEMPTED.


  THREE MEASURED GAPS. (1) THE CARD CANNOT SCORE VALIDATION AND WE REMOVED THAT ABILITY ON PURPOSE: at version 5 it serves only D2 complexity and D3 modularity, while D1 bug-detection, D4 behavior-preservation and D5 are RECORDED NOTES THAT TAKE NO SCORE. D1 and D4 were the validation dimensions and were cut because 38% of D1 and 18% of D4 anchor decisions cited THIS PROJECT'S OWN MACHINERY against 0% on D3 and D5 -- they graded toolchain ownership. (2) THE SCORE IS NOT IN THE GOAL PROCESS: across every skill the surface is THREE SKILLS AND FOUR FILES, and no goal has ever been keyed to a dimension. (3) THE LOOP IMPROVES THE INSTRUMENT AND NEVER THE PROGRAM: every closure has terminated in a card change and a score change, and NO SCORE HAS EVER PRODUCED A TEST, A DIAGRAM, A MODEL ACTION OR AN ADAPTER -- 0 for 7 epics.


  AND ONE DEBT: the D3 caveat has NO NEGATIVE CONTROL. It was applied to an artifact with exactly the property it names and the score went to 3, which demonstrates plumbing rather than discrimination.
planning_rules:
  served_surface_is_the_metric: >-
    serve | wc -c, 6281 bytes and 9 rungs, MUST NOT GROW. Repository lines are net-additive BY CONSTRUCTION because the change rule keeps old anchors and R-H4 seals the record, so they measure nothing. AN ANCHOR IS PERMANENT AND A PROMPT OR RECORDED NOTE IS FREE -- prefer the cheapest carrier and justify any new rung.
  do_not_rebuild_d1_and_d4: >-
    They were MEASURED to grade toolchain ownership -- 38% and 18% of anchor decisions citing local machinery against 0% elsewhere. A dimension that asks 'do you have model-derived cases' is D1 with a haircut. IF VALIDATION IS NOT SCORABLE WITHOUT GRADING A TOOLCHAIN, SAYING SO IS THE RESULT and it redirects the goal.
  the_card_is_never_mandatory: >-
    A project that declines to score runs epics exactly as it does today. DESIGN FOR ABSENCE FIRST. A skill that hard-requires a scorecard is a skill nobody can adopt, and the goal was to make scoring AVAILABLE everywhere rather than COMPULSORY anywhere. A goal that cannot be scored is not a goal that fails.
  use_a_harvested_defect: >-
    HARVEST-CL-03.md carries 38 classes found by judges across seven epics, of which roughly ONE was ever filed. The measured bottleneck of this programme is that NOTHING CONSUMED A FILED FINDING. SV-04 is the consumption step; inventing a fresh defect dodges the thing being tested.
  no_new_gates_rule: >-
    Seven epics of static checking caught zero bugs. Nothing in this epic refuses anything about anyone's code.
  skills_are_read_never_edited: >-
    Skills are READ from this repository and never edited. Anything that must change in SKILL_MANAGER_HOME is PROPOSED AS A DIFF AND ESCALATED. Never run skill-manager sync.
  measurement_rule: >-
    File findings; fix nothing during a measurement. SEAL PREDICTIONS BEFORE MEASURING AND SAY WHEN, in a commit with a timestamp. If every prediction passes, report it as an ALARM. Never edit a target to match a result. Do NOT report git archive figures as tree properties. Do NOT hand-roll a wait loop. Write scratch output to a TICKET-SPECIFIC path. VERIFY YOUR BRANCH POINT -- even when the owner hands you the SHA, which has been wrong once.
