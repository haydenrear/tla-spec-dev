version: 1
name: "hexagonal-prompting-epic"
updated: null
purpose: >-
  A test-case generator and a prompt, measured by a scorecard. Not a static
  analyzer.

  The predecessor epic shipped four architecture levers and measured them
  twice. Bug detection did not move by a single cell -- 4 of 6, 6 of 6, 0 of 3
  guard relaxation, 0 of 3 ordering, identical before and after seven repair
  tickets. Every check it shipped was defeated cheaply: six lines of YAML in
  round 1, a 41-line re-export file in round 2, both with every declaration
  digest unchanged. Its own coverage audit, on reaching `pass`, reported that
  the remaining unmodelled surface is bookkeeping, that coverage and case
  generation are DIRECTLY OPPOSED on this model (closing gaps grew the corpus
  to 18,391x its own cap), and that the effect oracle cannot see across a
  process boundary at all.

  Meanwhile the most valuable result the project has produced came from an
  agent READING A README and noticing the public surface was false of the
  model. No metric contains it and no gate could reach it.

  So this epic inverts the bet. Architecture guidance becomes a PROMPT, not a
  schema the tool checks -- on the hypothesis that an agent working from the
  diagram, far from the code, will produce a modular design if simply asked.
  The toolchain's job narrows to what TLA+ and TLC are actually good at:
  generating edge cases, including the rejected inputs no corpus has ever
  emitted. And the whole thing is decided by an A/B eval scored on the
  standardized scorecard by agent judges, because a number computed from an
  artifact can be optimized by editing the artifact, while a judgement that
  must cite the artifact can only be satisfied by changing what the artifact is.

  If the prompt arm catches more bugs and is simpler at equal behavior, we have
  won, and we won by prompting. If it is indistinguishable from the control,
  the prompt is decoration and we learn that in one round instead of after
  another epic of analyzer work. Both outcomes are worth the run.

planning_rules:
  current_model_rule: "Update specs/current after each production slice lands as a whole-program working copy of specs/program_model, not a ticket projection."
  unit_validation_rule: "Run current-model TLC and adapter/unit tests before adding graph execution."
  graph_rule: "Add graph or integration nodes only after current-model validation passes."
  semantic_model_rule: >-
    Do not add test graph nodes, pytest jobs, CI workflow steps, integration
    harnesses, or validation scripts as TLA+ program state/actions. The modeled
    program surface is the shipped CLI lifecycle. The predecessor's four
    rulings carry forward verbatim in substance -- the experimental fuzzing
    surface stays modeled; case generation is MODELED (superseding the dead
    `generate` ruling); refusal branches and per-flag variants are out-of-model
    EXCEPT the six guard-weakening flags, which are modeled; advisory internals
    and wrapper scripts are harness plumbing. THE STANDING PROVISO: an
    out-of-model FILE does not make an out-of-model EFFECT.
  representation_scope_rule: >-
    `implementation_scope` is EDIT PERMISSION, never representation scope. The
    MF-026 audit of the predecessor halted partly on that conflation. The
    coverage audit reads `representation_scope` and nothing else.
  surface_cost_rule: >-
    NEW, and it is the most important rule in this plan. The predecessor
    measured the price of adding modeled surface: roughly 1.5 new coverage gaps
    and 8x state space per surface-adding ticket, and a corpus that grew past
    its own cap. Adding model surface is therefore a COST to be justified, not a
    virtue. A ticket that adds an action or a variable states in its plan entry
    what it buys and what the state space costs, BEFORE it is dispatched.
  no_new_gates_rule: >-
    This epic ships NO new blocking check, no new gate, and no new static
    analyzer. Owner direction 2026-08-03: the hoops already built are not smart
    enough to provide value and agents spend real time jumping through them.
    Guidance goes in prompts; verdicts come from judged scorecards. If a ticket
    finds itself adding a rule that refuses something, it has left scope.

