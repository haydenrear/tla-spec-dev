        - specs/.history/architectural-coherence-epic/ticket-002-AC-02/results/suppression-ignored.txt
        - specs/.history/architectural-coherence-epic/ticket-002-AC-02/results/zero-model-delta.txt
        - specs/.history/architectural-coherence-epic/ticket-002-AC-02/results/zero-model-delta-diff.txt
        - specs/.history/architectural-coherence-epic/ticket-002-AC-02/results/tlc-current.txt
        - specs/.history/architectural-coherence-epic/ticket-002-AC-02/results/spec-unit-tests.txt
        - specs/.history/architectural-coherence-epic/ticket-002-AC-02/results/pytest-full.txt
    model_delta_expectation: "ZERO. Document the no-op model result with evidence."
    model_delta_result: >
      ZERO, as expected. specs/tickets/AC-02/current == desired byte for byte
      (diff -r, exit 0, after clearing the scaffolded __pycache__). TLC on
      ticket current is green and IDENTICAL to AC-01's close figure:
      32,122,220 generated / 1,292,951 distinct / depth 26 / 58s. AC-01 had
      already authored architecture_scan with all four values and the
      AnalyzeArchitecture action; AC-02 supplies the CODE side of the same
      command, which makes coherent and divergent reachable without adding
      state or an action. Modelling a flag of an existing command as a separate
      transition is what the plan's semantic_model_rule forbids. Documented at
      the ticket's results/zero-model-delta.txt.
    finding: >
      THE DOGFOOD IS THE FINDING, and it took three runs to state honestly.
      (1) The acceptance command as written -- no declared partition -- reports
      unmappable and does NOT run the diff: consumable_as_architecture is false
      because lastCommand and result are written by all fifteen commands. Had
      the diff run, all 258 code edges would have been internal to the single
      component and the report would have read 0 divergences, 0 absences,
      coherent. (2) With a DECLARED four-component partition (surface /
      tickets / corpus / kill) the check runs and IS falsifiable: corpus<->kill
      and kill<->tickets have no port, so an edge across either would have been
      a divergence. 34 modules all mapped, 258 edges, 140 internal, 118
      convergences, 0 divergences, 0 absences -- a genuine negative result
      about scripts/. The verdict is still unmappable, now for five extraction
      blind spots: three computed-name importlib.import_module calls,
      scripts/run_tlc.sh (no extractor), and spec_double_compiler/ (first-party,
      beside the code root, outside --code). (3) The COARSER three-component
      partition this ticket wrote first (folding kill_test in with the other
      scanner verdicts) has a port between every pair and could not have
      falsified anything; unfalsifiable_coherence fires and refuses to call it
      clean. Runs 2 and 3 are both defensible readings of the same model,
      separated by one variable's placement -- which is the ticket's central
      caution: the map and the partition are where the lying would happen, and
      the tool measures the declaration it is handed without being able to
      audit it. unfalsifiable_coherence catches only the fully degenerate case;
      a merely COARSE partition still reports a real-looking clean. Expect
      unmappable far more often than coherent on any real Python tree. Full
      write-up, including every way the tool looked wrong, noisy, or gameable,
      in the ticket's results/dogfood-findings.txt.

