  - id: FI-03
    title: 'Make the scorecard carry a delta: record judging practice, measure cross-round stability'
    status: planned
    github_issue: https://github.com/haydenrear/tla-spec-dev/issues/153
    schedule_revision: 1
    depends_on: [FI-01]
    blocks: [FI-06]
    wave: 2
    promotion_order: 30
    promotion_predecessor: FI-02
    conflict_keys:
      production: []
      tla: []
      adapters: []
      test_graph: []
      workflow: [examples/validation/scorecards/score_tools.py, references/eval_scorecard.md]
    objective: >-
      SELF-IMPROVEMENT.md exists so the DELTA is the measurement, and three of five dimensions cannot currently carry one. PA-06 re-scored byte-identical trees and four dimension-points moved; D2 and D3 moved zero. The mechanism is judging practice, not the rubric: both judges seeded and ran their own faults, and D4 anchor 4 is awardable only by a judge who executes one. Make judging practice a recorded required field; measure cross-round stability directly by re-scoring a sealed artifact; and make the instability caveat executable so it can be promoted from prose to an R-H rule. Changing the card requires a scorecard_version bump and a re-score under both versions -- that is the card's own change rule. D2 and D3 held still: do not 'fix' them.
    desired_actions: []
    implementation_scope: [examples/validation/scorecards/, references/eval_scorecard.md, tests/]
    goals: []
    acceptance:
      commands: [uv run --with pytest --with pyyaml python -m pytest tests -q]
      assertions: ['Judging practice is a recorded, required field on the card.', "Cross-round stability is measured against the 4-dimension-point baseline and reported as a number.", The instability caveat has a check behind it and audit still reports 0 violations.]
    model_delta_expectation: none expected
  - id: FI-04
    title: A fixture whose arms CAN diverge, and an honest answer on generator vs suite
    status: planned
    github_issue: https://github.com/haydenrear/tla-spec-dev/issues/154
    schedule_revision: 1
    depends_on: [FI-01]
    blocks: [FI-06]
    wave: 3
    promotion_order: 40
    promotion_predecessor: FI-03
    conflict_keys:
      production: []
      tla: []
      adapters: []
      test_graph: []
      workflow: [examples/validation/ab/]
    objective: >-
      GOAL-cases-drive-ports could not have been met by the experiment that measured it: the arms are identical on 10 of 11 mutated rows, so the A/B can only diverge where re-anchoring fails. The 64 of 64 was arithmetic that could not have come out otherwise. A GOAL WHOSE NULL IS ENTAILED BY ITS FIXTURE IS NOT A MEASUREMENT -- either the fixture changes or the goal does, and this ticket decides which explicitly. If the fixture changes, the bar is a seeded fault one arm catches and the other structurally cannot: the fixture's own demonstrated failing input, per R1. Also settle the harder question: no generated instrument has a unique kill and suite-fake strictly dominates every generated column, three epics running. AN HONEST ANSWER, INCLUDING 'WE SHOULD NOT KEEP FUNDING THE GENERATOR', IS A LEGITIMATE PRODUCT OF THIS TICKET.
    desired_actions: []
    implementation_scope: [examples/validation/]
    goals: []
    acceptance:
