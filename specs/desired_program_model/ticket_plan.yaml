    objective: >-
      The one mechanism with a measured, replicated edge. Content-asserting
      effect providers caught 2 of 6 seeded faults that NOTHING else caught --
      the two durable-side ones -- reproduced cell for cell across two rounds
      and independently replicated by a blind agent on a fresh 16-mutant
      catalogue at 3 of 3 durable-write mutants under the checking mapping and 0
      of 3 under the silent one. That mapping choice is worth 30% of the
      instrument's entire yield.

