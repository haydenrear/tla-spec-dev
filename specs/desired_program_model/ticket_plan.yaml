version: 1
name: reading-discipline-epic
updated: null
purpose: >-
  SIX EPICS HAVE CLOSED ON THE SAME FINDING -- a claim read forward without being checked -- and every fix so far has been a rule someone has to remember. This epic makes scope-loss catchable by machine.


  Three instances, ascending: `contested` is a scoring rule with NO IMPLEMENTATION, and every card ever written carries contested = [] while D3 spread 2 on the toolchain removal. D3 was called the one stable dimension on the strength of ONE example, then spread 2 and split by judge tier on a second. And an entire epic was justified by 'D2 = 2 on 27 of 27 cards', which was true of ab_quota_ledger ALONE -- across 49 sealed cards D2 has taken four values over seven examples, and ex3_over_complex scored 3 from both judges three epics earlier. The owner wrote it into the charter, the plan and the issue, and verified it with a script scoped to one example.


  R-H2 forbids AVERAGING across examples. Nothing forbade GENERALISING FROM ONE.


  The same defect one granularity up is architecture: a ports-and-adapters program is validated through port-bound adapters, a flat effectful one through an oracle that drives 8 of 18 actions -- same D1 anchor, different instrument reach. RD-04 researches architecture tags; RD-05 implements what it decides. THE TRAP: a tag must not become a suppression key.
planning_rules:
  scope_carrying_rule: >-
    NEW, R3, AND THE EPIC'S SUBJECT. A claim carries its scope, and something REFUSES it when it does not. A figure of the form 'D<n> = k on N of N' is a statement about whichever examples, instruments and architectures produced those N cards. If the underlying set is wider than the claim admits, THE CLAIM IS WRONG EVEN WHEN EVERY NUMBER IN IT IS RIGHT.
  tag_is_not_a_suppression_key_rule: >-
    NEW. If any unflattering comparison can be dismissed as 'different architecture', the card stops being able to say anything. Three guards: declared BEFORE scoring and derived where derivation is possible; INCOMPARABLE reported and never dropped, because a missing row and an incomparable one are not the same claim; and a tag value EARNS ITS PLACE by demonstrating it changes a score -- if two artifacts differing only in it score identically on all five dimensions it distinguishes nothing and is deleted. The vocabulary is falsifiable or it is decoration.
  no_new_gates_rule: >-
    Five epics of static checking caught zero bugs. A tag constrains what may be COMPARED; it refuses nothing about the code.
  demonstrated_failure_rule: >-
    R1. An instrument ships with a demonstrated FAILING input, run against real historical cards rather than a synthetic fixture.
  removal_is_a_delta_rule: >-
    Every removal ships with a mutant seeded in its gap BEFORE the cut. Both outcomes are results.
  denominator_rule: If a count moves, say whether the numerator rose or the denominator fell.
  measurement_rule: >-
    File findings; fix nothing during a measurement. Never edit a target to match a result. Never re-run selectively until a number passes. If every prediction passes, report it as an ALARM. Verify your branch point against the SHA in your work order -- wt new branches from the LOCAL ref and put a ticket 21 commits behind last epic.
