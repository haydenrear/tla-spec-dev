version: 1
name: close-the-loop-epic
updated: null
purpose: >-
  THE LOOP THIS WHOLE PROGRAMME AIMS AT -- hand-found regression -> card iteration -> architectural delta -> re-score -- CANNOT BE RUN BY ANYONE WHO DID NOT BUILD IT, AND HAS NEVER BEEN RUN END TO END EVEN BY US. Small epic, and a gate: nothing about transfer, static analysis or spectral signal can be measured until it works.


  THREE BLOCKERS. SUPPORTED_VERSIONS = (1,2,3,4) is a literal in our source, so an adopter bumping to 5 must edit our code -- and a v5 card is STAMPED version 4 WITH check REPORTING 0 PROBLEMS. Worse, the seal does not seal what a judge reads: rewriting a caveat DELETES IT FROM THE SERVED BYTES WHILE anchors_digest STAYS BYTE-IDENTICAL.


  A PRICE CANNOT MEAN ANYTHING YET. The normal shape of a removal here -- every killing node inside a deleted file -- ALWAYS returns ENTAILED-SURVIVES, because that verdict follows from git show alone. The previous epic's headline was WITHDRAWN when its own zero-gap control returned the same verdict, from a row MISSING from the four-row output the report printed as three.


  AND THE LOOP'S INPUT IS BEING PRODUCED AND DROPPED. Two blind judges in two tickets independently found reference_ports's REAL adapter can stop touching the filesystem and survive both wirings. FILED ZERO TIMES, under twenty-two D3 = 4 cards.
planning_rules:
  served_surface_is_the_metric: >-
    serve | wc -c, not repository lines. The served rubric is the ONLY surface this project has ever shrunk -- 8396 -> 6319 bytes and 25 -> 9 rungs -- and it was byte-identical at every version-3 commit across two epics. Repository lines are net-additive BY CONSTRUCTION because the change rule keeps old anchors and R-H4 seals the record. THE SERVED SURFACE IS 6409 BYTES AND 9 RUNGS AND MUST NOT GROW.
  anchors_are_permanent_prompts_are_not: >-
    An anchor cannot be deleted once shipped -- the change rule forbids it -- while a prompt costs nothing against the sealed surfaces. PREFER PROMPTS. Any card iteration should be the smallest change that carries the regression.
  do_not_manufacture_a_regression: >-
    CL-03 closes the loop with a REAL, ALREADY-FOUND, UNFILED regression. If the FileJournal hole turns out not to be real, SAY SO -- that is a finding about the judges' notes and is worth more than a tidy loop closure.
  open_vs_closed_population: >-
    The measured typology, which corrected the owner's guess: a thing survives when what it ranges over is FIXED AND NAMEABLE, and goes when its population can grow, because then it silently stops meaning what it said. record-without-gate is NOT the discriminator -- total gated, D2's anchor 4 capped D2 eight times, and both were removed anyway.
  no_new_gates_rule: Six epics of static checking caught zero bugs.
  measurement_rule: >-
    File findings; fix nothing during a measurement. SEAL PREDICTIONS BEFORE MEASURING AND SAY WHEN. Never edit a target to match a result. If every prediction passes, report it as an ALARM. Do NOT report git archive figures as tree properties. Do NOT hand-roll a wait loop. Verify your branch point against the SHA in your work order -- wt new branches from the LOCAL ref and has put tickets 4, 14 and 21 commits behind.
  inherited_reds: >-
    TWO deliberate failures come from portable-substrate: RM-06-DF-01, the same-tag control that cannot tell treatment from architecture, and test_nothing_in_the_repository_invokes_the_pricer, which NEXT-EPIC.md trips by MENTIONING price_removal. If you repair the second, EXEMPT NARRATIVE DOCUMENTS AS A CLASS rather than allow-listing one file.
status:
  workflow: close-the-loop-epic
  active_ticket: null
  active_ticket_title: null
  desired_module: TlaSpecDevCli
  phase: planning
epic:
  id: close-the-loop
  branch: epic/close-the-loop
  default_branch: main
  base_sha: a662675
  base_note: Branched from main after portable-substrate merged, with 2 deliberate reds.
  schedule_revision: 1
  review_mode: epic-owner-post-merge
  notes: >-
    Never merge to main and never run skill-manager sync without explicit owner say-so. Never invoke tla-spec-dev from PATH. THE PLAN MUST LOAD WITH BOTH LOADERS. Never kill a process by name alone, and check whether a process is yours before touching it.
deferment_policy:
  mode: batch
  blocking: escalate
  budget: 5
  backlog: specs/desired_program_model/deferred_findings.yaml
epic_goals:
  - id: GOAL-change-rule-runnable
    kind: eval
    statement: >-
      A stranger can bump a card version without editing our source, a bad version fails LOUDLY, and the seal covers what a judge actually reads.
    metric: >-
      Whether a version bump is possible without a source edit; whether an unsupported version is refused rather than stamped; and whether a served-byte change moves the seal.
    harness: CL-01, decided by CL-04
    baseline:
      value: >-
        UNRUNNABLE AND SILENT. SUPPORTED_VERSIONS = (1,2,3,4) is a Python literal. A v5 card is STAMPED version 4 and check REPORTS 0 PROBLEMS. And rewriting a caveat DELETES IT FROM THE SERVED BYTES WHILE anchors_digest STAYS BYTE-IDENTICAL -- the seal does not seal what a judge reads.
      measured_at: a662675
      evidence: specs/results/scorecards/portable-substrate/RM-05/RESULT.md
    target: >-
      A version bump without a source edit, an unsupported version refused loudly with a demonstrated failing input, and the served bytes sealed. NO GROWTH IN THE SERVED SURFACE -- 6319 bytes, 9 rungs.
    evaluation_ticket: CL-04
    evidence_root: specs/results/scorecards/close-the-loop/GOAL-change-rule-runnable
  - id: GOAL-price-means-something
    kind: eval
    statement: >-
      A price distinguishes a fault whose habitat was deleted from one that survived a cut, and a declared control can never appear as a priced result.
    metric: >-
      Whether ENTAILED-SURVIVES and EXTINCT are distinguishable; whether any historical removal re-prices non-zero; and whether RM-01's known positives still reproduce.
    harness: CL-02, decided by CL-04
    baseline:
      value: >-
        A PRICE CARRIES NO INFORMATION FOR THE NORMAL SHAPE OF A REMOVAL. Every killing node inside a deleted file yields ENTAILED-SURVIVES from git show alone, and the previous epic's own zero-gap control -- is_control true, gap NONE on purpose -- returned the same verdict from a row MISSING from the printed output. Re-priced history is 0 of 10. RM-01-RF-1 and SM-04-GM-T1 are the known positives.
      measured_at: a662675
      evidence: specs/results/scorecards/portable-substrate/RM-05/RESULT.md -- RM-05-DF-01
    target: >-
      EXTINCT distinguishable from ENTAILED-SURVIVES, controls excluded from the verdict table, both known positives reproducing. NO TARGET ON ANY PRICE -- a high price on a past removal is the informative outcome, and an instrument tuned until the number is comfortable has failed this goal.
    evaluation_ticket: CL-04
    evidence_root: specs/results/scorecards/close-the-loop/GOAL-price-means-something
  - id: GOAL-loop-closes-once
    kind: eval
    statement: >-
      One hand-found regression becomes a card iteration end to end -- the transferable artifact this programme has never produced.
    metric: >-
      Count of judge-found observations harvested and filed; and whether ONE was carried through regression -> card iteration -> architectural delta -> re-score.
    harness: CL-03, decided by CL-04
    baseline:
      value: >-
        ZERO. Two blind judges in two different tickets independently found that reference_ports's REAL adapter can stop touching the filesystem and survive both wirings -- a genuine architectural regression, found by hand, FILED ZERO TIMES, sitting under twenty-two D3 = 4 cards. Judges have been writing real observations into rationales for seven epics and nobody has ever harvested them.
      measured_at: a662675
      evidence: specs/results/scorecards/portable-substrate/RM-05/RESULT.md -- section 4
    target: >-
      The loop closes ONCE, end to end, on a real already-found regression. IF THE FileJournal HOLE IS NOT REAL, SAYING SO IS THE RESULT -- that is a finding about the judges' notes and is worth more than a tidy closure. Manufacturing a regression to close the loop with fails this goal.
    evaluation_ticket: CL-04
    evidence_root: specs/results/scorecards/close-the-loop/GOAL-loop-closes-once
tickets:
  - id: CL-01
    title: Make the card's change rule runnable by a stranger, and make it fail loudly
    status: done
    github_issue: https://github.com/haydenrear/tla-spec-dev/issues/221
    schedule_revision: 1
    depends_on: []
    blocks: [CL-02, CL-03, CL-04]
    wave: 1
    promotion_order: 10
    promotion_predecessor: null
    conflict_keys:
      production: []
      tla: []
      adapters: []
      test_graph: []
      workflow: [examples/validation/scorecards/score_tools.py, references/]
    objective: >-
      FIRST AND ALONE -- nothing else in the portability argument matters until this works. SUPPORTED_VERSIONS = (1,2,3,4) is a literal in our source, so an adopter bumping to 5 must edit our code, AND IT FAILS SILENTLY: a v5 card is stamped version 4 and check reports 0 problems. Worse, THE SEAL DOES NOT SEAL WHAT A JUDGE READS -- rewriting a caveat deletes it from the served bytes while anchors_digest stays byte-identical. Fix SUPPORTED_VERSIONS, the caveat parse and the audit bootstrap so a bump needs no source edit; make an unsupported version REFUSED LOUDLY with the v5 case as the demonstrated failing input; make the seal cover the served bytes, saying whether the digest is widened or a second seal is added and why; and ship a SHORT adopter-facing page saying HOW, since portable_scorecard.md already says WHAT.
    desired_actions: []
    implementation_scope: [examples/validation/scorecards/, references/, tests/]
    goals:
      - goal: GOAL-change-rule-runnable
        contribution: direct
        expected_effect: A stranger can run the change rule, and silent failure becomes loud.
        local_signal: a v5 card is refused; serve | wc -c unchanged or lower
      - goal: GOAL-price-means-something
        contribution: guard
        expected_effect: none expected
        local_signal: N/A
      - goal: GOAL-loop-closes-once
        contribution: enabling
        expected_effect: none -- a card iteration needs a runnable change rule
        local_signal: N/A
    acceptance:
      commands: [uv run --with pytest --with pyyaml python -m pytest tests -q]
      assertions: [A version bump is possible without editing our source., "An unsupported version is REFUSED rather than stamped, with the v5 case as a demonstrated failing input.", A served-byte change moves the seal., The served surface does not grow beyond 6319 bytes and 9 rungs.]
    model_delta_expectation: none expected
  - id: CL-02
    title: 'Make a price mean something: EXTINCT, controls excluded, --head validated'
    status: planned
    github_issue: https://github.com/haydenrear/tla-spec-dev/issues/222
    schedule_revision: 1
    depends_on: [CL-01]
    blocks: [CL-04]
    wave: 2
    promotion_order: 20
    promotion_predecessor: CL-01
    conflict_keys:
      production: []
      tla: []
      adapters: []
      test_graph: []
      workflow: [examples/validation/gap_mutants/]
    objective: >-
      NO REMOVAL IN THIS REPOSITORY CAN CURRENTLY BE PRICED, because the normal shape of a removal is the shape that always returns ENTAILED-SURVIVES. RM-05 withdrew the previous epic's headline to prove it: the round's own control, declared is_control true with gap 'NONE, on purpose', RETURNED THE SAME VERDICT, and that row was MISSING from the four-row output the report printed as three. For every killing node inside a deleted file the verdict follows from git show alone and no other verdict is reachable. Give entail a verdict meaning EXTINCT; EXCLUDE DECLARED CONTROLS from the verdict table so a zero-gap row can never appear as a priced result; validate --head; and re-price at least one historical removal, REPORTING A NON-ZERO LOUDLY if one appears. RM-01-RF-1 and SM-04-GM-T1 are the known positives -- an instrument that cannot reproduce both is not working.
    desired_actions: []
    implementation_scope: [examples/validation/gap_mutants/, tests/]
    goals:
      - goal: GOAL-price-means-something
        contribution: direct
        expected_effect: A price stops being entailed by the shape of the removal.
        local_signal: EXTINCT vs ENTAILED-SURVIVES on a real cut
      - goal: GOAL-change-rule-runnable
        contribution: guard
        expected_effect: none expected
        local_signal: N/A
