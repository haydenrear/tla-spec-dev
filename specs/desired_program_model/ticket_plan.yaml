# Canonical plan for the architectural-coherence epic. GitHub issues mirror this
# file for handoff; this file remains the source of truth. Dispatched ticket
# IDs, dependency edges, waves, and promotion order are immutable after issue
# assignment -- add amendment tickets instead of editing dispatched identities.
#
# Predecessor epics (closed): modular-fuzzing, complexity-descriptor,
# effect-provider, complexity-descriptor-main-readiness. See specs/.history/
# and ARCHITECTURAL-COHERENCE-EPIC.md at repo root.
version: 1
name: architectural-coherence-epic
updated: "2026-07-26"
purpose: >
  Two levers on one idea: the diagram is the design authority, so the
  decomposition it implies should be both ENTERABLE (BDD case modules that
  slice a view by aspect) and CHECKABLE (an architecture descriptor derived
  from the model, plus a reflexion check that measures production code against
  it). Case modules cut the behavior surface from the user's side; the
  architecture descriptor cuts the implementation by state ownership; both are
  projections of the same variables x actions structure. Advisory throughout,
  and the epic ends with a fact-finding eval run rather than a claim.

planning_rules:
  current_model_rule: Update specs/current after each production slice lands as a whole-program working copy of specs/program_model, not a ticket projection.
  unit_validation_rule: Run current-model TLC and adapter/unit tests before adding graph execution.
  graph_rule: Add graph or integration nodes only after current-model validation passes.
  semantic_model_rule: Do not add test graph nodes, pytest jobs, CI workflow steps, integration harnesses, or validation scripts as TLA+ program state/actions.
  evidence_rule: Record tests and graph runs as evidence for semantic program actions in manifests or ticket status.
  desired_sync_rule: Update this file and spec_manifest.yaml whenever scope, order, acceptance checks, or status changes.
  promotion_rule: When specs/current equals specs/desired_program_model, promote the converged model to specs/program_model.

