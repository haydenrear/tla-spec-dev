        WHERE THE EVIDENCE ACTUALLY IS: `close ticket` consumes
        specs/tickets/HP-05/ into the append-only record, so every path above
        now reads
        specs/.history/hexagonal-prompting-epic/ticket-004-HP-05/ticket/results/.
        The instruments are sealed beside them under .../ticket/measure/; the
        43,128-case corpus is NOT committed and .../ticket/measure/README.md
        carries the exact commands that regenerate it.
