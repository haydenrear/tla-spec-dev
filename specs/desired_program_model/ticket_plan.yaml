epic_goals:
  - id: GOAL-caveat-discriminates
    kind: eval
    statement: >-
      The D3 caveat DISCRIMINATES rather than applying general downward pressure -- settled by the negative control close-the-loop never ran.
    metric: >-
      D3 on an artifact that plainly LACKS the single-observer property, scored under both version 4 and version 5, same judge model, same tag, two passes a side.
    harness: SV-01, decided by SV-05
    baseline:
      value: >-
        NO NEGATIVE CONTROL EXISTS. The caveat was applied to an artifact WITH exactly the property it names and D3 went 4,4 -> 3,3. Both firings on record -- ours and the blind adopter's -- ran the SAME DIRECTION. No artifact lacking the property has ever been scored under both versions.
      measured_at: eab2883
      evidence: specs/results/scorecards/close-the-loop/CL-04/RESULT.md -- CL-04-DF-05
    target: >-
      A verdict either way. IF D3 FALLS THERE TOO the caveat is downward pressure and close-the-loop's headline is a RECALIBRATION rather than a detection -- and A NULL MUST BE REPORTED AS LOUDLY AS THE MOVE WAS, naming every claim that inherits the correction.
    evaluation_ticket: SV-05
    evidence_root: specs/results/scorecards/score-drives-validation/GOAL-caveat-discriminates
  - id: GOAL-validation-is-scorable
    kind: eval
    statement: >-
      Whether VALIDATION can be scored at all without grading conformance to a toolchain -- decided on evidence, with a negative answer accepted as a result.
    metric: >-
      A candidate dimension tested against the sealed record, plus the D1/D4 autopsy applied to it: what fraction of its anchor decisions would cite local machinery?
    harness: SV-02's research, decided by SV-05
    baseline:
      value: >-
        THE CARD SCORES D2 AND D3 ONLY. D1 bug-detection, D4 behavior-preservation and D5 are RECORDED NOTES TAKING NO SCORE. D1 and D4 were retired because an anchor decision cited this project's own machinery in 38% of D1 and 18% of D4 rationales against 0% on D3 and D5 -- verbatim, 'Anchor 4 is refused: T's cases are hand-written' -- and D1 read 3 on 55 of 59 cards of the only example the project scores.
      measured_at: eab2883
      evidence: references/portable_scorecard.md, and RM-02's rationale analysis
    target: >-
      A decision with evidence from the 87 sealed cards and the 38 harvested classes. IF VALIDATION IS NOT SCORABLE WITHOUT GRADING A TOOLCHAIN, SAYING SO IS THE RESULT and it redirects the goal. A candidate whose autopsy looks like D1's has rebuilt D1.
    evaluation_ticket: SV-05
    evidence_root: specs/results/scorecards/score-drives-validation/GOAL-validation-is-scorable
  - id: GOAL-scored-at-goal-time
    kind: eval
    statement: >-
      A project scores as part of the GOAL PROCESS rather than as a separate evaluation act -- and a project that declines to score is unaffected.
    metric: >-
      A goal keyed to a dimension with a baseline scored AT DECLARATION and sealed; plus proof that a project with no card runs epics unchanged.
    harness: SV-06's design, SV-03 and SV-07's implementation, decided by SV-05
    baseline:
      value: >-
        ZERO. Across every skill the surface is THREE SKILLS AND FOUR FILES: one cross-reference in git-epic-workflow/references/goals-and-evaluation.md, git-issue-workflow's goal-signal.md, and git-issue's SKILL.md and regression-close.md. NO GOAL HAS EVER BEEN KEYED TO A DIMENSION, and scoring happens in an evaluation ticket as a separate act. spec-double-compiler's ~990 matches are its bundled copy of this repository's own record.
      measured_at: eab2883
      evidence: survey of SKILL_MANAGER_HOME at eab2883
    target: >-
      A goal can be scored at declaration and the evaluation compares against the sealed number -- AND a project with no card is provably unaffected. Tested the way CL-04 tested the loop, BY AN AGENT WITH NONE OF OUR SOURCE. Any proposal that makes the card mandatory anywhere fails this goal.
    evaluation_ticket: SV-05
    evidence_root: specs/results/scorecards/score-drives-validation/GOAL-scored-at-goal-time
  - id: GOAL-loop-reaches-the-program
    kind: eval
    statement: >-
      A score produces NEW VALIDATION IN THE PROGRAM -- a test, a diagram, a model action or an adapter -- and the re-score detects it.
    metric: >-
      One end-to-end: score or card iteration -> a concrete validation artifact that did not exist -> a re-score that moves, with the counterfactual stated.
    harness: SV-04, decided by SV-05
    baseline:
      value: >-
        0 FOR 7 EPICS. Every loop this project has closed terminated in a CARD change and a SCORE change. CL-03 ran regression -> card iteration -> re-score and deliberately never touched the artifact. NO SCORE HAS EVER PRODUCED A TEST, A DIAGRAM, A MODEL ACTION OR AN ADAPTER.
      measured_at: eab2883
      evidence: specs/results/scorecards/close-the-loop/ -- CL-03 and CL-04
    target: >-
      One closure into the program, on a HARVESTED defect rather than a fresh one, with the validation justified by the defect it catches and the score movement reported as the OBSERVATION rather than the objective. Tuning validation to raise a number is MF-020 and fails this goal.
    evaluation_ticket: SV-05
    evidence_root: specs/results/scorecards/score-drives-validation/GOAL-loop-reaches-the-program
