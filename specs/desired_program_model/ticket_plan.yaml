  - id: MF-020
    title: "Collapse ticket phase booleans into an ordinal"
    status: done
    github_issue: "https://github.com/haydenrear/tla-spec-dev/issues/21"
    schedule_revision: 1
    depends_on: [MF-012]
    blocks: [MF-011]
    wave: 2
    promotion_order: 15
    promotion_predecessor: MF-012
    conflict_keys:
      production: []
      tla: [TlaSpecDevCli.tla]
      adapters: [specs/program_model/production_adapters.py]
      test_graph: []
      workflow: []
    objective: "Approved architectural move surfaced by the MF-012 complexity ledger: replace the three parallel booleans desired_ready / current_ready / spec_unit_tests_passed with a single ordinal ticket_phase in [Tickets -> 0..3]. The invariants already pin them to a strict total order, so only 4 of 8 combinations are reachable; the ordinal represents the same behavior with none of the unreachable product space. Measured on the MF-012 model: -2 state variables, -13.1% generated states, and an 8x smaller declared state-space bound (3,145,728 -> 393,216) at IDENTICAL 919 reachable states and identical depth 21 — the reachable-state equality is the proof that nothing is under-represented. Scheduled before MF-011 so the analyze-complexity gate is built and calibrated against the model shape the epic is keeping, rather than measuring a shape already slated for removal. See references/architecture_tractability.md."
    desired_actions: []
    implementation_scope:
      - specs/program_model/TlaSpecDevCli.tla (variable and invariant rewrite)
      - specs/program_model/production_adapters.py (phase-aware adapters)
      - specs/current/tests (adapter assertions referencing the booleans)
    current_increment:
      model_state:
        - ticket_phase
      model_actions: []
      adapters:
        - specs/.../production_adapters.py updated to read ticket_phase
      unit_tests:
        - uv run --with pytest -m pytest tests -q
        - uv run --with pytest -m pytest specs/tickets/MF-020/current/tests -q
      graph_after_unit_pass:
        - specWorkflow
        - cliWorkflow
    acceptance:
      commands:
        - bash scripts/run_tlc.sh specs/tickets/MF-020/current/TlaSpecDevCli.tla specs/tickets/MF-020/current/MC.cfg
        - tla-spec-dev --spec-root specs run spec-unit-tests --ticket MF-020
      assertions:
        - the three booleans are gone; ticket_phase carries the ordering.
        - reachable distinct states remain 919 and depth remains 21 — behavior retention is proven by equality, not asserted.
        - declared state-space bound drops to 393,216; state variables drop by 2.
        - every invariant expressed over the old booleans has an equivalent over ticket_phase; none is silently dropped.
      evidence:
        - specs/tickets/MF-020/results/invariant-mapping.md
        - specs/tickets/MF-020/results/complexity-ledger.md
        - specs/tickets/MF-020/results/tlc-current.txt
        - specs/tickets/MF-020/results/tlc-desired.txt
        - specs/tickets/MF-020/results/spec-unit-tests.txt
        - specs/tickets/MF-020/results/pytest-repo.txt
        - specs/tickets/MF-020/results/graph-specWorkflow.txt
        - specs/tickets/MF-020/results/graph-cliWorkflow.txt
        - specs/tickets/MF-020/results/refinement-probe/tlc-setup-phase-probe.txt
      result_notes:
        - "Retention gate MET: 919 distinct states, depth 21, 10/10 invariants — identical to MF-012 baseline."
        - "Complexity: state variables 13 -> 11; declared bound 3,145,728 -> 393,216 (8x)."
        - "Generated-states target (3,183) NOT met: shipped 3,664. Reaching it requires tightening the RunSpecUnitTests guard to `= 2`, which deletes the idempotent spec-unit re-run transition. Recorded as a finding, not applied. See complexity-ledger.md section 4."
        - "Refinement search FOUND a further reduction (setup_phase bootstrap chain, 11 -> 7 variables, bound -> 73,728 at identical 919/21). Prototyped and measured; recommendation only, awaiting owner approval."


  - id: MF-021
    title: "Promotion must not destroy files unique to specs/current"
    status: pending
    github_issue: "https://github.com/haydenrear/tla-spec-dev/issues/25"
    schedule_revision: 1
    depends_on: [MF-020]
    blocks: [MF-011]
    wave: 2
    promotion_order: 17
    promotion_predecessor: MF-020
    conflict_keys:
      production: [scripts/spec_evolution.py, scripts/close_ticket.py]
      tla: [TlaSpecDevCli.tla]
      adapters: [specs/program_model/production_adapters.py]
      test_graph: []
      workflow: []
    objective: "Fix the silent data-loss defect in ticket promotion (GitHub #22). promote_ticket_outputs calls replace_tree(active_dir/'desired', specs_dir/'current'), and replace_tree does shutil.rmtree(dst) before copying. Because the ticket's desired/ tree is seeded from a different source than specs/current, any file unique to specs/current is destroyed with no warning and no failure. Observed twice: MF-012 and MF-020 both lost specs/current/tests/test_current_ticket_workflow.py, which carried MF-012's budgets retention test; the file was not in the history seal either, so the on-disk copy was the only one. Deleted tests cannot fail, so the loss is invisible exactly when it matters. Promotion must either preserve current-only files or abort loudly enumerating every file it would remove. Silent deletion is not an acceptable default for test files."
    desired_actions: []
    implementation_scope:
      - scripts/spec_evolution.py (replace_tree / promote_ticket_outputs)
      - scripts/close_ticket.py (close-time reporting of removals)
    current_increment:
      model_state: []
      model_actions: []
      adapters:
        - specs/.../production_adapters.py close adapter asserting current-only files survive promotion
      unit_tests:
        - uv run --with pytest -m pytest tests -q
        - uv run --with pytest -m pytest specs/tickets/MF-021/current/tests -q
      graph_after_unit_pass:
        - specWorkflow
        - cliWorkflow
    acceptance:
      commands:
        - bash scripts/run_tlc.sh specs/tickets/MF-021/current/TlaSpecDevCli.tla specs/tickets/MF-021/current/MC.cfg
        - tla-spec-dev --spec-root specs run spec-unit-tests --ticket MF-021
      assertions:
        - a file present in specs/current but absent from the ticket desired/ tree survives promotion, or promotion fails naming it.
        - the close output enumerates every path promotion removed; no path is removed silently.
        - a regression test reproduces the original loss (seed a current-only test file, promote, assert it survives) and fails against the pre-fix behavior.
        - directories unique to specs/current (e.g. refinement-probe/) are covered by the same rule, not just files.
      evidence: []

