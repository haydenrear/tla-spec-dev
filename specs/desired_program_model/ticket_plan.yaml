    objective: >-
      THE HALF OF THE COMPLEXITY WORK THAT DID NOT LAND. The stated intent was general statistics that block nothing and PROMPT THE MODEL ABOUT WHAT THEY MEAN. ports-as-adapters shipped the statistics and the human-readable intuition and not the prompting: grep -rn code_complexity prompts/ is EMPTY, and hexagonal_implementation.md still points only at the TLA+ descriptor. So the figures reach a human and a judge's mechanical block, and no agent is ever handed them and asked what they mean about its own design. The figures are worth asking about -- branch points in effectful modules 10 vs 1 on trees making the same three outside-world calls, so only LOCATION differs. It must not become a thermostat: no threshold, no verdict, nothing gated. Also preserve the DISPATCHED prompt as an artifact -- PA-06-DF-10 measured the length-match headline on a file that was not the prompt arm C received.
