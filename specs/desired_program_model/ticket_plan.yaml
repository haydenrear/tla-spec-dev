version: 1
name: portable-substrate-epic
updated: null
purpose: >-
  REMOVE WHAT HAS BEEN MEASURED DEAD, THEN PROVE THE TWO DIMENSIONS THAT SURVIVE -- and use 'could someone else adopt this?' as the stopping rule for how much to cut. Remove first, then iterate: you cannot demonstrate a dimension works while carrying instruments already known not to.


  Four interventions have been measured against a control and TWO SURVIVED. The prompt moves D3 (1 -> 4 replicated, length-matched arm C at 1/1). A revision pass moves D2 (two pairs cleared, byte-identical pair refused 4/4). Model-derived case generation does NOT find bugs hand-written tests miss (0 unique kills against 4 the other way, on new subjects). Static gates catch nothing (five epics, no caught bug). And the suite produced ONE finding in seven rounds as a finding channel -- it is a fine regression guard, which is a different job it keeps.


  THE THING THAT MAKES THIS HARD: the instrument that prices removals CAN ONLY RETURN ZERO. A gap mutant can price a removal only if every detector that killed it is one the removal deletes -- 0 OF 9 over the sealed table -- and the re-runnability rule systematically excludes the faults that could go DIES->SURVIVES. Two epics of free removals were free BY CONSTRUCTION, and the epic that called itself the great simplification came out net +1677 lines. RM-01 fixes that BEFORE anything is cut.
planning_rules:
  remove_before_iterate_rule: >-
    OWNER DIRECTION. The removal comes first. A dimension proven on a substrate still carrying three dead levers is a dimension proven under noise we already know about.
  adoption_is_the_stopping_rule: >-
    NEW. 'Simplify' has no natural end; 'could a project that did not build this adopt it?' does. AND IT MUST NOT BECOME A REASON TO ADD -- if the honest answer is that adoption requires LESS, that is the more useful finding.
  pricing_must_be_able_to_fail: >-
    If RM-03's removals all price at zero again, THAT IS A FINDING ABOUT RM-01 and must be reported as one -- not as three free cuts. An unpriced removal honestly labelled beats a zero that was entailed.
  no_axis_tuned_to_a_known_answer: >-
    The complexity descriptor could not see the only simplification ever measured: 19 of 21 axes byte-identical, one moving the WRONG WAY, while eight judges found it independently. Adding an axis tuned to that known answer is MF-020 in its purest form. If an axis is added it ships with a seeded case where it moves the wrong way.
  no_new_gates_rule: >-
    Five epics of static checking caught zero bugs. Nothing in this epic refuses anything about the code.
  scope_carrying_rule: >-
    R3. A claim carries its scope. `scope` has THREE known bounds -- name the one that applies to anything it reports.
  measurement_rule: >-
    File findings; fix nothing during a measurement. Never edit a target to match a result. Never re-run selectively until a number passes. If every prediction passes, report it as an ALARM. Do NOT report git archive figures as tree properties. Do NOT hand-roll a wait loop for a run you started. Verify your branch point against the SHA in your work order.
