    NEVER merge to main. NEVER run skill-manager sync, skt sync, skt publish, home sync or home close-out -- CHANGE MANAGEMENT IS THE EPIC OWNER'S JOB, IN ONE PLACE: the owner merges the ticket PR, then merges the ticket worktree home's changes into the project home, and only then removes the worktree. A ticket agent's obligation is DISCLOSURE: say in the PR body whether anything in your home changed, or say plainly that nothing did. ALL UNITS WERE SYNCED IN BOTH TIERS ON 2026-08-15 BY OWNER DECISION, superseding the kickoff freeze; spec-double-compiler now ships at 436c78c and therefore carries every charter and NEXT-EPIC.md on disk, which is the #271 section 7.5 contamination channel LIVE BY DECISION. WAVE 1 RAN BEFORE THE SYNC AND WAVES 2+ AFTER IT -- that is a difference between tickets and SS-08 must not average across it. Never invoke tla-spec-dev from PATH. THE PLAN MUST LOAD WITH BOTH LOADERS. Never kill a process by name alone, and check whether a process is yours before touching it. THE EPIC'S AUTHORITATIVE SKILL MANAGER HOME IS THE PER-WORKTREE HOME. Branch from the OID in your assignment, never from a local ref name. Local main was fast-forwarded 08d1d6a -> 436c78c on 2026-08-15 with explicit owner approval, AFTER the epic branch was cut and after every baseline in this plan was measured, so no figure here depends on it.
deferment_policy:
  mode: batch
  blocking: escalate
  budget: 5
  backlog: specs/deferred_findings.yaml
  note: >-
    RECORD TO THE BACKLOG, KEEP WORKING YOUR ASSIGNED SLICE, TRIAGE BETWEEN WAVES AND AT FINALIZATION. A blocking finding -- your ticket's REQUIRED validation cannot pass without touching another surface -- ESCALATES to the owner rather than widening the ticket. An entry with no reproduction is not a finding, it is a hunch: DO NOT FILE IT. Every row names its channel and its cost. Until SS-01 merges, pass --ledger specs/deferred_findings.yaml explicitly. The 29 unfiled SF-* skill findings reported by the predecessor's close are filed by whichever ticket touches that surface, under this policy.
epic_goals:
  - id: GOAL-absent-input-consumed
    kind: quality
    statement: >-
      An instrument handed an absent or empty input answers UNDECIDED or refuses -- never PASS -- and the rule that requires it is EXECUTED BY THE SUBSTRATE rather than written down.
    metric: >-
      (1) Whether R1's absent-input extension exists AS AN EXECUTED CHECK over this project's own instrument register, with a demonstrated refusal on a REAL instrument rather than a fixture. (2) Instances of the class remaining, over the measured denominator of 48, each repair carrying its own demonstrated absent-input case. NO TARGET ON THE REPAIR RATE ITSELF -- a threshold on a repair count before the check exists would be MF-020.
    harness: >-
      The absent-input check run against the instrument register at the integrated epic tip, plus a re-sweep of the 43 verdict-producing modules under scripts/ and examples/validation/ reporting instances remaining with numerator and denominator named. Decided by SS-08.
    baseline:
      value: >-
        48 INSTANCES ACROSS 30 OF 43 VERDICT-PRODUCING MODULES; 1 fixed (score_tools._finding_ids, signature change set[str] -> set[str] | None), 47 OPEN. Ledger rows CA-10-DF-17 through CA-10-DF-25, all disposition 'carried' into this epic. NO CHECK EXISTS: R1 requires a demonstrated FAILING input on a real subject and DOES NOT REQUIRE AN ABSENT ONE, and that single gap is why all 48 shipped. NOTE THE CORRECTION IN THE SOURCE: three of the five originally-named exemplars were ALREADY REPAIRED and nothing in the record said so, and each left a NAMED HALF behind -- so the class as first stated overstated the live count and the sweep is the authority, not the exemplar list.
      measured_at: 436c78c55c60c3ee45901223176124df5e38b6ff
      evidence: specs/results/scorecards/stabilize-substrate/GOAL-absent-input-consumed/class-rows-436c78c.txt specs/results/scorecards/stabilize-substrate/GOAL-absent-input-consumed/baseline.md -- SEALED RAW OUTPUT FIRST, narrative second. The harness is a COMMAND, so clause (a) of GOAL-judged-goals-compliant is satisfied by the sealed raw output of that command, never by a directory and never by the prose that summarises it. Repointed by SS-03; the baseline VALUE and measured_at are untouched.
    target: >-
      MULTI-CLAUSE, EACH DECIDED SEPARATELY. (a) R1's absent-input extension EXISTS AS AN EXECUTED CHECK over this project's own instrument register -- not a doctrine line, not a comment, not a paragraph in a reference. (b) That check has a DEMONSTRATED REFUSAL ON A REAL INSTRUMENT in this repository, failing before and passing after, per R1 itself. (c) The class is RE-MEASURED at the tip over the same 43 modules and the remaining count is reported with numerator and denominator named; a count that fell because modules were deleted is NOT a repair and must be reported as denominator movement. (d) Every repair this epic ships carries its own demonstrated absent-input case. (e) NO NEW GATE OVER SUBJECT-PROGRAM CONTENT: the check is scoped to this project's own instrument register and refuses nothing about an adopter's code.
    evaluation_ticket: SS-08
    evidence_root: specs/results/scorecards/stabilize-substrate/GOAL-absent-input-consumed
  - id: GOAL-tree-stabilizes
    kind: quality
    statement: >-
      The test tree converges, not just the red count -- collection, skips, passes and reds all reported together, and every movement in any of them attributed.
    metric: >-
      failed / passed / skipped / XFAILED / collected from 'uv run --with pytest --with pyyaml -m pytest tests -q' and '--collect-only', reported as NUMBERS THAT SUM, plus the count of nodes that are collected-but-skipped, not-collected, and passing-vacuously. AMENDED AFTER SS-01: THERE ARE FIVE BUCKETS, NOT FOUR. SS-01 added an xfail(strict=True) pinning SS-01-DF-01 -- correctly, because 'untested in both directions' is what the review required -- and a four-number report silently stops summing the moment one exists. failed + passed + skipped + xfailed = collection, every time.
    harness: >-
      'uv run --with pytest --with pyyaml -m pytest tests -q' and 'uv run --with pytest --with pyyaml -m pytest tests -q --collect-only' at the integrated epic tip, compared line by line against this goal's baseline evidence, with EVERY MOVEMENT ATTRIBUTED to a named cause and its numerator/denominator direction stated. Decided by SS-08.
    baseline:
      value: >-
