    objective: >-
      THE MEASUREMENT. FILE FINDINGS; FIX NOTHING. EIGHT OBLIGATIONS, EACH PAID FOR BY A PREDECESSOR'S FAILURE. (1) DECIDE EVERY GOAL CLAUSE BY CLAUSE. Never collapse a multi-clause target to one word -- a ledger storing one verdict per goal WILL PICK THE FLATTERING CLAUSE. The predecessor's evaluation SPLIT A CLAUSE TO GAIN A MET AND SPLIT ANOTHER TO INVENT A MISSED and had to withdraw both; SPLITTING A CLAUSE TO ADD A MET AND SPLITTING ONE TO ADD A MISSED ARE THE SAME ERROR. Score on the target text, not on a split of your own. (2) REPORT THE TREE, NOT JUST THE COUNT: failed, passed, skipped, XFAILED and collection, NUMBERS THAT SUM -- FIVE BUCKETS, NOT FOUR, since SS-01 added an xfail(strict=True) -- with EVERY movement attributed and numerator/denominator named. AND THREE ARTIFACTS OF THIS EPIC'S OWN MACHINERY ARE ALREADY MEASURED, SO DO NOT ATTRIBUTE THEM TO ANY TICKET'S WORK: `open ticket` inflates collection by +4 and `close ticket` removes it; `close ticket` seals the history entry and deletes the workspace in ONE operation so EVERY sealed entry carries a pre-close figure that differs from its live RESULT -- YOU WILL MEET THIS EIGHT TIMES; and a figure is a joint property of the artifact AND THE TREE IT WAS MEASURED IN (SS-01-DF-03: the same ledger bytes score 21/18/3 under a bare --root and 20/17/3 in the repository, and scope records nothing about which root it swept). (3) RUN JUDGED WORK THROUGH --safe-mode PLUS A NEUTRAL CELL AND STATE EXACTLY WHAT YOUR JUDGES RECEIVED EITHER WAY. Neither half suffices: safe-mode does not strip gitStatus, and a neutral cell does not strip the session hook. VERIFY, DO NOT TRUST THE FLAG -- its memory behaviour is observed four times and specified zero times, and blind_dispatch check reads the AGENT'S REPORT rather than the harness's configuration. DO NOT NAME YOUR CELL AFTER YOUR TICKET: the path check refuses only the literals tla-spec and spec-dev, and the predecessor's own neutral cell contained its ticket id and the instrument could not catch it. AND STATE THE PART THAT IS YOURS: THE AGENT SELECTING THE PACKET IS NOT BLIND, and an evaluating session run from the primary checkout CARRIES MEMORY.md AND FIVE COMMIT SUBJECT LINES BEFORE IT READS ANYTHING. That was the largest unstated cost in the last round. (4) SEAL PREDICTIONS BEFORE MEASURING, IN A COMMIT, WITH A TIMESTAMP. IF EVERY PREDICTION PASSES, REPORT IT AS AN ALARM. And DISCOUNT A PREDICTION RECONSTRUCTED FROM THE RECORD -- that is a reading comprehension test, not a forecast. (5) RE-DERIVE EVERY FIGURE YOU QUOTE. The predecessor's evaluation published three refuted figures and its headline finding was refuted on review, OFF BY 1,000 ON ITS OWN ENUMERATION, and the error ran toward EXCUSING THE EPIC IT WAS MEASURING. THIS EPIC'S OWN CHARTER SECTION 0 CORRECTS THREE FIGURES IN THE STARTER ISSUE -- CHECK THOSE THREE TOO. (6) REPORT FINDINGS BY CHANNEL WITH THE TOKEN BASIS NAMED, and say which tickets recorded their own; 'not instrumented' is the honest answer, not a gap. ASK FOR THE DISPATCHING SESSION'S COST FIRST -- it is almost certainly the largest and it is the one nobody has measured. (7) DO NOT ROUTE YOUR OWN FINDINGS TO YOURSELF: self-routing satisfies D3 with full marks and means nothing. (8) VERIFY THE THREE KICKOFF DEFECTS ARE REPAIRED BEFORE YOU MEASURE ANYTHING. READ THIS FIRST, IT CHANGES WHAT YOU WILL SEE (SS-00-DF-13): ALL THREE ARE REPAIRED AND ALL THREE LEDGER ROWS STILL SAY `disposition: open`. The ledger is APPEND-ONLY -- a byte-identical prefix is verified at every merge -- SO NO EXISTING ROW CAN EVER BE AMENDED, and a `disposition` is a claim frozen when the row was filed, not a record of what happened. `disposition.py --epic SS` accordingly exits 1 with `REFUSED epic SS: 10 of 67 findings undisposed` and lists DF-01/-02/-03 as `filed and routed nowhere`, which is FALSE ABOUT ALL THREE. DO NOT READ `open` AS UNREPAIRED AND DO NOT RAISE THE ALARM THIS OBLIGATION ORDERS UNTIL YOU HAVE RUN THE INSTRUMENTS -- which is what this obligation already told you to do. The owner verified at c5b7c2a: `baseline_is_a_card.py` prints `this instrument cannot classify the harness from declared data and refuses to guess from prose (SS-00-DF-03)` and `a plan that declares no workflow -> keyed [('UNDECLARED','GOAL-x')] (counted, never dropped)` for DF-02's direction, and SS-01 RESULT.md section 5 records DF-01 repaired WITH ITS STATED MECHANISM REFUTED. THE LEDGER/REALITY GAP IS ITSELF A FINDING AND YOU SHOULD REPORT IT AS ONE: the instrument this programme built to prove findings get consumed UNDER-REPORTS CONSUMPTION, in the direction that makes the programme look worse. The rows were NOT edited to `repaired` -- editing three rows in the epic's favour days before its evaluation, breaking the prefix check the epic has enforced at every merge, is indefensible whatever the intent. SS-00-DF-01 is SS-01's, SS-00-DF-02 and SS-00-DF-03 are SS-03's, and ALL THREE ARE DEFECTS IN INSTRUMENTS YOU MUST USE TO DECIDE THE GOALS. Two mis-report IN A DIRECTION: DF-02 shrinks a denominator and INFLATES a compliance rate, DF-01 accuses TRUE citations of being fabricated. CHECK EACH BY RUNNING IT, NOT BY READING ITS PR -- for DF-01 that means audit on TWO INDEPENDENT FRESH WORKTREES OF THE SAME COMMIT returning the same count. IF ANY IS NOT REPAIRED, REPORT IT AS AN ALARM, NAME WHICH FIGURES ARE AFFECTED AND IN WHICH DIRECTION, AND QUOTE NO AFFECTED FIGURE WITHOUT THAT CAVEAT. DO NOT REPAIR IT YOURSELF: an evaluation that fixes its own instrument mid-measurement has measured nothing. AND IF A REPAIR MOVED A BASELINE -- the 0-of-20 is the likely one -- THAT MOVEMENT IS A FACT ABOUT THE INSTRUMENT UNTIL PROVEN OTHERWISE, reported with numerator and denominator named, never absorbed into a goal verdict. (9a) CROSS-CHECK `disposition.py --ticket` AGAINST THE ID PREFIX, AND PREFER `--epic`. SS-07-DF-07, VERIFIED BY THE OWNER: `--ticket` filters on the FREE-TEXT `found_by` field, and this project credits REVIEWERS there, so it silently under-counts. Measured: `--ticket SS-01` reports `DISPOSED ticket SS-01: 2 findings, all three clauses hold` WHILE SS-01 OWNS SEVEN ROWS BY ID PREFIX, and 28 of 317 rows repo-wide do not name their own ticket in `found_by`. CORRECTED TWICE, AND THE SECOND CORRECTION IS THE DURABLE ONE. First wording: 'NEVER quote --ticket, it silently under-counts' -- OVERSTATED, it would have had you discount a sound receipt. Second wording: 'it under-counts for some tickets, not all; SS-02 is 4 of 4' -- TRUE WHEN WRITTEN AND STALE WITHIN THE SAME ROUND, because SS-02 then filed five more rows and became 4 OF 9. THE DURABLE STATEMENT, MEASURED: `--ticket` IS BLIND TO ROWS CREDITED TO A REVIEWER. SS-02's five invisible rows are EXACTLY the five its independent reviewer found. So the instrument under-reports PRECISELY THE EXTERNALLY-FOUND FINDINGS, WHICH IS THE DIRECTION THAT FLATTERS THE TICKET -- and adversarial review is the most productive mechanism this programme has, so the consumption instrument is blind exactly where the value is. THE RULE IS: quote `--epic`; where you quote `--ticket`, CROSS-CHECK AGAINST THE ID-PREFIX COUNT, state both, and read any gap as reviewer-found rows the instrument cannot see. NOTE FOR THE RECORD: this is the owner's third pass at this obligation and the first two were wrong in opposite directions -- one over-trusting the ticket, one over-trusting the instrument. THE INSTRUMENT THIS PROGRAMME BUILT TO PROVE FINDINGS GET CONSUMED CANNOT SEE FIVE OF ONE TICKET'S SEVEN AND REPORTS THAT ALL CLAUSES HOLD -- the absent-input class inside the consumption instrument itself, on the epic's own thesis. SS-01 and SS-03 both closed quoting `--ticket`, so BOTH CLOSE RECEIPTS RECORD A WEAKER CHECK THAN THEY APPEAR TO; say so rather than re-opening sealed entries. `--epic` is sound and correctly REFUSES: `--epic SS` exits 1 with `6 of 21 findings undisposed`, naming the owner's six open SS-00-DF-* rows. THAT REFUSAL IS THE MECHANISM