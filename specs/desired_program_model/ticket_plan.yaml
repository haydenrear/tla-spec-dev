    objective: >
      THE severe one, owner-verified twice: six lines of YAML declaring a
      one-component partition make the divergent fixture -- four real
      divergences -- report `coherent`, exit 0. The refusal AC-01 built lives
      on the EMERGENT path and the DECLARED path walks around it: the guard
      reads `if not unported_pairs and len(names) >= 2`, `divergence_detectable`
      is computed and no consumer reads it, and a declared partition the
      descriptor itself prints as DOES NOT DECOMPOSE is consumed with the
      failed criteria appearing nowhere in the text or the JSON
      (`blind_spots: []`). Measured blast radius over all 203 partitions of the
      ex5 fixture: 12 report `coherent` and ALL 12 fail the criteria, while 0
      of the honest partitions produce a clean. This is the MF-027 false-clean
      class, which this epic's own doctrine forbids outright. Fix: the basis
      travels with the verdict -- partition origin, every criterion with its
      measurement, and `divergence_detectable` -- in BOTH the text and the
      JSON; a partition that cannot express a divergence cannot yield
      `coherent` whatever its component count; and the `[]`-where-text-says-
      NOT-MEASURABLE JSON asymmetry (AC-03-DF-01) is closed in the same pass,
      since a consumer reading `[]` as "owns nothing" is the same defect one
      field over.
    desired_actions: []
    implementation_scope:
      - scripts/architecture_reflexion.py
      - scripts/analyze_architecture.py
      - tests/
      - references/architecture_coherence.md
