epic:
  id: architectural-coherence
  branch: epic/architectural-coherence
  default_branch: main
  base_sha: be936c12c169b0debe704fb525107d900420a53a
  schedule_revision: 7
  review_mode: epic-owner-post-merge
  notes: >
    Base is main (c72d03a) plus be936c1, the case-module doctrine and probe
    evidence this epic mechanizes (references/case_modules.md,
    examples/case_modules/, tickets/039-case-modules.md). Per owner direction
    2026-07-26, ticket agents merge their reviewed-green feature branch into
    epic/architectural-coherence themselves after validation and ticket close;
    the epic owner reviews post-merge and prepares the next ticket. The
    repository owner closes GitHub issues; neither ticket agents nor the epic
    owner do. Never merge to main and never run skill-manager sync without
    explicit owner say-so. Never invoke tla-spec-dev from PATH (it execs a
    stale installed clone) -- use python3 scripts/tla_spec_dev.py --spec-root
    specs. Run pytest with --with pyyaml or the YAML-validity guard skips
    silently. Validate this file with the git-epic-workflow validator after
    every edit. NOTE at dispatch time: tests/test_new_ticket_workflow.py::
    test_skill_requires_two_minute_case_generation_budget is RED on main
    (asserts phrases the c72d03a docs refresh removed) -- a pre-existing
    failure, not yours; file it, do not fix it inside a ticket.
    2026-07-27 AMENDMENT (schedule_revision 2, pre-dispatch, no assignment
    identities changed): (a) EXECUTION IS LOCAL-ONLY by owner direction --
    ticket agents push NOTHING, open no PR, and edit no GitHub issue; they
    commit on their feature branch in their worktree and stop. The epic owner
    merges each ticket branch into epic/architectural-coherence locally and
    verifies post-merge. The remote epic branch and issues #120-#126 stay as
    they were pushed on 2026-07-26. (b) The EV-01/EV-02 validation scope is
    widened by the owner's stated aims -- see eval_aims below -- which is why
    the revision moved; ticket IDs, dependencies, waves, promotion order, and
    conflict keys are unchanged.
    2026-07-30 AMENDMENT (schedule_revision 3): the epic's own eval found 14
    defects and the owner directed that they be REPAIRED INSIDE THIS EPIC
    rather than carried to NEXT-EPIC.md. Seven repair tickets (RP-01..RP-07)
    added in waves 6-7, and EV-03 added in wave 8 to re-run the evals against
    the repaired tree. No dispatched identity, dependency, wave, promotion
    order or conflict key of CM-01..EV-02 changed -- those tickets are closed
    and their history is sealed. NEXT-EPIC.md's NE-01..NE-04 remain the
    charter; where a repair ticket lands part of an NE item, the ticket says
    so and NEXT-EPIC.md is amended at EV-03 to record what was done here
    instead of deferred.
  model_delta: >
    Unlike the complexity-descriptor epic, this one is NOT zero-model-delta.
    specs/desired_program_model adds the architecture_scan variable (unknown |
    coherent | divergent | unmappable) and the AnalyzeArchitecture action for
    `tla-spec-dev analyze architecture`. Measured by the epic owner on the
    authored desired model: TLC green, 1,292,951 distinct states / 32,122,220
    generated, depth 26, 59s (specs/results/tlc-desired-epic-ac.txt) against
    the baseline's 283,805 distinct / 6,209,780 generated, depth 25, 12s
    (specs/results/tlc-baseline-epic-ac.txt) -- 4.6x. That increase is the
    recorded justification the standing objective requires: the scan verdict is
    a new externally observable outcome of the CLI and none of its values is
    derivable from another variable. It exceeds the advisory
    max_distinct_states, which stays ADVISORY -- do not renegotiate the budget
    to make the number look better, and do not merge "unmappable" into
    "unknown" to shrink the domain: "I could not measure this" and "not run"
    are different facts, the same distinction analyze complexity already draws.
  coherence_doctrine: >
    Owner decision 2026-07-26: the architecture check is an ADVISORY SCANNER
    plus a GENERATION-TIME lever, never a gate. Divergences are reported facts;
    enforcement happens when the implementation brief constrains what an agent
    may write, not when a close is refused. No action in the model guards on
    architecture_scan and no close/promotion path may read it. A gate is earned
    per check on real-app evidence, exactly as
    references/architecture_tractability.md, "Advisory, Not Blocking" requires.

eval_aims: >
  Owner direction 2026-07-27, binding on EV-01's predictions and EV-02's
  scoring. The evals are not a formality at the end of this epic; they are the
  point of it. What the levers are being tested FOR, in the owner's order:
  (1) CATCH HARDER BUGS -- the MF-038 class and worse. A generated corpus that
  exercises the program without detecting its faults is the failure this epic
  must not repeat; score bug-detection directly, with seeded faults whose
  content differs subtly, not merely case counts.
  (2) BE A SUBSTRATE FOR MANUAL TEST STARTERS -- a person writes one aspect
  (a Given plus an entry point) and the toolchain expands it into many cases
  that fuzz the bug out. Score how much a human has to write versus how many
  distinct behaviors come back, and whether an aspect written by a
  non-author of the model produces a usable corpus.
  (3) BE RERUNNABLE AND DETERMINISTIC -- the same aspect, rerun, produces the
  same corpus and the same verdict; a failure replays exactly (the ex1-run4
  replay-command property). Score determinism by rerunning, not by asserting
  it. A nondeterministic corpus is a finding, however good its first run.
  These aims are what the predictions must be written against, and they
  outrank tidiness: an honest negative on any of the three is the most
  valuable output available from EV-02.

deferment_policy:
  mode: batch
  blocking: escalate
  budget: 5
  backlog: "specs/desired_program_model/deferred_findings.yaml"

service_catalog:
  existing_boundaries:
    - "analyze complexity: the shipped descriptor (dimension table, bound, R/W matrix, modularity, dense rows) -- the input the architecture view is derived from"
    - "generate_cases_from_tlc_dump.py: view-aware case generation, the surface case modules enter through"
    - "spec_evolution.record_complexity_ledger: the standing-objective ledger (see CM-F1)"
    - "prompts/coverage_audit.md: the precedent for a sub-agent prompt as a shipped artifact"
  desired_boundaries:
    - "analyze architecture: model-implied components, single-writer ownership, ports, and the reflexion diff against production code"
    - "case_modules: manifest block declaring per-aspect modules, the view each extends, and its action scope"
    - "prompts/implementation_brief.md: the constrained ask that carries component ownership into generation"
    - "prompts/aspect_decomposition.md: the BDD decomposition ask, from the user's perspective"
  adapter_boundaries:
    - "specs/current/tests/test_tla_spec_dev_analyze_adapter.py: conformance for the analyze command family, extended by AC-01"
  known_gaps:
    - "The reflexion extractor ships for Python only (AC-02). Non-Python targets report unmappable, never silently clean -- the MF-027 refusal shape."
    - "Neither lever has eval coverage before EV-01/EV-02. Until then every claim in this epic is a design claim, not a measurement."
    - "RESTORED 2026-08-01 (owner amendment, schedule_revision 4; MF-026 ESC-1): this repository's baseline remains a SINGLE TlaSpecDevCli.tla module without the Internal/External view split -- future work, unscoped. AC-03 measured 2 of 115,975 partitions meeting all three shipped criteria at Q = 0.0029, and the repository's own DECLARED four-component partition measures Q = -0.025 against a 0.6 criterion. The decision stands; the External view being unrepresented is an INVENTORY ROW under this line, not a gap."
    - "RESTORED 2026-08-01 (MF-026 ESC-1): `generate` is unmodeled -- recorded granularity limitation per semantic_model_rule; modeled if/when the experimental surface is promoted."
    - "RESTORED 2026-08-01, NARROWED SAME DAY (MF-026 ESC-1 and the round-2 reservation): per-command refusal branches beyond the modeled gate verdicts, and per-flag CLI variants, are out-of-model -- recorded granularity limitation per semantic_model_rule. This covers the five group subcommands' `incomplete command` exit-2 outcome and 72 of the 78 options. THE SIX GUARD-WEAKENING FLAGS ARE EXCLUDED FROM THIS GAP AND ARE MODELED: --accept-new and --allow-open bypass a precondition TLC proves over 1,292,951 states, and no oracle in this toolchain could see the difference while they were inventoried."
    - "RESTORED 2026-08-01 (MF-026 ESC-7): the effect-provider runtime -- scripts/run_generated_case_adapters.py provider machinery, spec_double_compiler/*, templates/python/ports.py.j2 -- is SHIPPED validation harness and toolchain plumbing, out-of-model, exactly as the spec-unit runner always was. This resolves the contradiction the audit found between that ruling and a ticket implementation_scope naming templates/: implementation_scope is edit permission and never a representation claim (representation_scope_rule)."
    - "NOT A GAP AND NOT A WAIVER (MF-026 ESC-6): skill-scripts/ is out-of-model plumbing, but install-tlc2.sh:37 performs a real network download on a MODELED action path with no network.* port declared anywhere. The file is out of model; the effect is not. Closing that port is scheduled work, not an answered escalation."

representation_scope:
  note: >-
    ADDED 2026-08-01 by owner amendment (schedule_revision 4), answering MF-026
    ESC-2, ESC-3, ESC-4, ESC-5 and ESC-7. THIS is the surface the MF-026
    coverage audit measures the model against -- one boundary decision, made
    once and reviewed once, never waived per finding. Written with explicit
    directory globs where a directory is meant, because the audit's closure rule
    treats a bare file path as scoping that file alone and turns every unnamed
    file into an escalation. The previous run produced 187 unclassifiable rows
    of 596, including 24 of 34 files in scripts/, for exactly that reason.
  in_model:
    - "scripts/**/*.py -- the shipped CLI toolchain the program model represents. THE WHOLE DIRECTORY, closing the 24-of-34 unclassifiable hole; individual files inside it are governed by semantic_model_rule's four rulings, not by silence."
    - "specs/current/spec_manifest.yaml, specs/desired_program_model/spec_manifest.yaml, specs/program_model/spec_manifest.yaml -- where every effect port is declared. Named by NO line of this plan before this amendment (ESC-4), which is why three model/manifest desync gaps had to be filed against an unrelated anchor."
    - "specs/*/TlaSpecDevCli.tla and specs/*/MC*.cfg -- the model itself and its finite instances."
    - "specs/*/production_adapters.py and specs/*/adapter_case_runtime.py -- COMPLETION 2026-08-01 (MF-026 round-2 ESC-9). The spec-unit adapters that bind modeled actions to the real CLI. The FIRST amendment named the manifests and the model and skipped the layer between them, which was an omission and not a boundary: the predecessor plan named specs/program_model/production_adapters.py explicitly under adapter_boundaries, and MF-026 run 1 had already recorded that dropping this exact file 'excluded in-scope surface'. Restoring it."
  out_of_model:
    - "tests/**, specs/*/tests/**, test_graph/** -- test and validation harnesses. ESC-3 found 62 rows with NO available disposition, in scope by an implementation_scope list and un-modelable by semantic_model_rule. semantic_model_rule wins; representation_scope_rule explains why there was never a real conflict."
    - "examples/** -- fixtures, worked examples and eval subjects. They are what the toolchain is pointed AT, not surface of it. This is what put 325 fixture files in scope for TlaSpecDevCli.tla."
    - "specs/.history/** -- sealed append-only snapshots, 5,402 files. Excluded by THIS PLAN LINE rather than by an auditor's own filter (ESC-5). Sealed history is a record of program surface, never program surface."
    - "spec_double_compiler/**, templates/** -- generator templates and harness plumbing, per the restored known_gaps ruling (ESC-7)."
    - "skill-scripts/**, *.sh wrappers, run_tlc.sh -- installer and wrapper shell, per semantic_model_rule (4). SUBJECT TO THE STANDING PROVISO: out-of-model files still owe ports for effects they perform on modeled action paths (ESC-6)."
    - "prompts/**, references/**, templates/*.md, *.md -- documentation and sub-agent prompts. Shipped artifacts, not program state."
    - "specs/tickets/** -- COMPLETION 2026-08-01 (MF-026 round-2 ESC-8). Per-ticket workspaces and their recorded graph reports, 110 rows. The first amendment covered specs/.history/** and root-level test_graph/** and reached neither. Clerical omission, not a boundary decision."
    - "specs/results/** -- COMPLETION 2026-08-01 (MF-026 round-2 ESC-10). Recorded evidence and previous audits' own sweep tooling. An audit's instruments are not the program they measure."

tickets:
  - id: CM-01
    title: "Case modules: declared model discovery, manifest block, per-module action scope, corpus aggregation"
    status: done
    github_issue: "https://github.com/haydenrear/tla-spec-dev/issues/120"
    schedule_revision: 1
    depends_on: []
    blocks: [EV-01]
    wave: 1
    promotion_order: 10
    promotion_predecessor: null
    conflict_keys:
      production:
        - scripts/spec_evolution.py
        - scripts/generate_cases_from_tlc_dump.py
        - scripts/budgets.py
        - tests/test_spec_evolution.py
        - tests/test_generate_cases_from_tlc_dump.py
      tla: []
      adapters: []
      test_graph: []
      workflow:
        - references/case_modules.md
        - examples/case_modules/
    objective: >
      Mechanize the case-module option and fix the defect the probe found
      underneath it. Three parts, in this order. (1) CM-F1 --
      record_complexity_ledger locates its model as the alphabetically first
      *.tla excluding MC*, which on any Core/Internal/External baseline
      resolves to Core.tla paired with External.cfg and measures bound=None,
      modularity=0.0; the standing-objective ledger has been measuring a module
      with no variables and no actions. The measured model becomes DECLARED,
      and a mismatched .tla/.cfg pair is an error rather than a silent
      measurement. This is a live defect on every three-module project,
      independent of case modules. (2) A `case_modules:` block in
      spec_manifest.yaml -- per module, the view it extends, its action subset,
      and (for a Given form) the recorded claim the Given asserts. (3)
      Per-module action scope so generation stops emitting the R4-DF-04
      zero-case alias-wrapper warning for actions that simply are not in this
      aspect (CM-F2), plus an aggregation report of per-action coverage across
      modules against the view's action set -- a report, never a gate.
    desired_actions: []
    implementation_scope:
      - scripts/spec_evolution.py
      - scripts/generate_cases_from_tlc_dump.py
      - scripts/budgets.py
      - tests/
      - references/case_modules.md
    current_increment:
      model_state: []
      model_actions: []
      adapters: []
      unit_tests:
        - "uv run --with pytest --with pyyaml -m pytest tests -q"
      graph_after_unit_pass: []
    acceptance:
      commands:
        - "uv run --with pytest --with pyyaml -m pytest tests -q"
        - "python3 scripts/tla_spec_dev.py --spec-root specs run spec-unit-tests --ticket CM-01"
      assertions:
        - "A three-module baseline's ledger measures the declared model; a mismatched .tla/.cfg pair errors instead of reporting bound=None."
        - "A case module declared in the manifest generates without spurious zero-case warnings for actions outside its scope."
        - "The aggregation report names every view action entered by no module and not covered by the view's own corpus, and blocks nothing."
        - "The probe's three modules (examples/case_modules/) still reproduce their recorded case counts: 160 / 16 / 14."
      evidence:
        - "specs/tickets/CM-01/results/cm-f1-model-discovery.txt"
        - "specs/tickets/CM-01/results/cm-f2-action-scope.txt"
        - "specs/tickets/CM-01/results/case_module_coverage.txt"
        - "specs/tickets/CM-01/results/case_module_coverage.json"
        - "specs/tickets/CM-01/results/zero-model-delta.txt"
        - "specs/tickets/CM-01/results/tlc-current.txt"
        - "specs/tickets/CM-01/results/descriptors-before-after.txt"
        - "specs/tickets/CM-01/results/pytest-full.txt"
        - "specs/tickets/CM-01/results/spec-unit-tests.txt"
        - "specs/tickets/CM-01/results/cm-01-df-02-parse-cfg-invariants.txt"
    model_delta_expectation: >
      ZERO. Case-module generation lives in generate_cases_from_tlc_dump.py,
      which the CLI lifecycle model does not represent. Document the no-op
      model result with evidence at close; do not invent an action to have a
      delta.

  - id: AC-01
    title: "Architecture descriptor: the structure the diagram implies"
    status: done
    github_issue: "https://github.com/haydenrear/tla-spec-dev/issues/121"
    schedule_revision: 1
    depends_on: []
    blocks: [AC-02, AC-03]
    wave: 1
    promotion_order: 20
    promotion_predecessor: CM-01
    conflict_keys:
      production:
        - scripts/analyze_architecture.py
        - scripts/analyze_complexity.py
        - scripts/tla_spec_dev.py
        - tests/test_analyze_architecture.py
      tla:
        - specs/current/TlaSpecDevCli.tla
        - specs/current/MC.cfg
      adapters:
        - specs/current/tests/test_tla_spec_dev_analyze_adapter.py
      test_graph: []
      workflow:
        - references/architecture_coherence.md
        - SKILL.md
    objective: >
      Turn the structure analyze complexity already computes internally into a
      first-class, addressable artifact: components (variable clusters), the
      single writer of each variable and every violation of single-writer
      ownership, the crossing actions that are the ports between components,
      and the actions whose write set spans components. Emit it as
      `tla-spec-dev analyze architecture` with a text descriptor and a
      machine-readable form the later tickets consume. It states facts and
      makes no suggestions -- the CD-01 precedent binds: a chooser that is
      confidently wrong on standard TLA+ is worse than no chooser.
    desired_actions:
      - AnalyzeArchitecture
    implementation_scope:
      - scripts/analyze_architecture.py
      - scripts/tla_spec_dev.py
      - specs/current/TlaSpecDevCli.tla
      - specs/current/MC.cfg
      - specs/current/tests/
      - references/architecture_coherence.md
      - SKILL.md
    current_increment:
      model_state:
        - architecture_scan
      model_actions:
        - AnalyzeArchitecture
      adapters:
        - TlaSpecDevAnalyzeArchitectureAdapter
      unit_tests:
        - "uv run --with pytest --with pyyaml -m pytest tests -q"
        - "python3 scripts/tla_spec_dev.py --spec-root specs run spec-unit-tests --ticket AC-01"
      graph_after_unit_pass:
