epic:
  id: ports-as-adapters
  branch: epic/ports-as-adapters
  default_branch: main
  base_sha: ccba2159b2167670cdfb94e92c5a0282df6c84f1
  base_note: >-
    Branched from main after hexagonal-prompting was merged LOCALLY (owner direction 2026-08-03/05). The remote is untouched and `skill-manager sync` was NOT run. THIS EPIC PUSHES ITS BRANCH AND OPENS GITHUB ISSUES -- owner direction 2026-08-04 -- which reverses the no-remote rule for the branch and the issues only. It does not authorize a main push or a skill sync.
  schedule_revision: 1
  review_mode: epic-owner-post-merge
  notes: >-
    Never merge to main and never run skill-manager sync without explicit owner say-so. Never invoke tla-spec-dev from PATH -- and note the sharper version the predecessor learned at its close: a GATE CAN OUTLIVE ITS REMOVAL IN AN INSTALLED COPY. The repo retired a refusal and the skill home's stale module still enforced it, because Python puts a script's own directory first on sys.path. Run this repository's own scripts/. Run pytest as `uv run --with pytest --with pyyaml python -m pytest tests -q`. Validate this file with the git-epic-workflow validator after every edit. FINDINGS ARE FILED, NEVER FIXED INLINE, DURING A MEASUREMENT.
deferment_policy:
  mode: batch
  blocking: escalate
  budget: 5
  backlog: specs/desired_program_model/deferred_findings.yaml
representation_scope:
  note: >-
    What the MF-026 coverage audit measures the model against, when it is run -- it RECORDS and no longer refuses (retired 2026-08-04). DIFFED against the predecessor's final block rather than copied, because copying it lost two governing rulings in two consecutive epics.
  in_model:
    - scripts/**/*.py -- the shipped CLI toolchain
    - specs/*/spec_manifest.yaml -- where every effect port is declared
    - specs/*/TlaSpecDevCli.tla and specs/*/MC*.cfg
    - specs/*/production_adapters.py and specs/*/adapter_case_runtime.py
    - specs/*/case_adapters.toml -- the model's own action -> adapter binding table
    - specs/*/kill_mutants.toml -- oracle 4's input
    - specs/*/tlc_projection.py -- what makes a tractable corpus possible at all
  out_of_model:
    - >-
      tests/**, specs/*/tests/**, test_graph/** -- harnesses; semantic_model_rule forbids modeling them
    - examples/** -- fixtures, eval subjects, and the eval harness
    - >-
      specs/.history/**, specs/tickets/**, specs/results/** -- sealed history, ticket workspaces, recorded evidence
    - spec_double_compiler/**, templates/** -- generator templates and harness plumbing
    - skill-scripts/**, *.sh wrappers -- installer shell, SUBJECT TO THE STANDING PROVISO
    - prompts/**, references/**, *.md -- documentation and sub-agent prompts
    - >-
      scripts/run_generated_case_adapters.py provider machinery and scripts/generate_python.py codegen -- shipped validation harness, per the predecessor's restored carve-out
    - repository dotfiles and tool config
  view_split:
    - >-
      This repository's baseline remains a SINGLE TlaSpecDevCli.tla module with no Internal/External split -- future work, unscoped. The External view being unrepresented is an INVENTORY ROW under this line, not a gap.
service_catalog:
  existing_boundaries:
    - >-
      scripts/generate_cases_from_tlc_dump.py -- `generate cases`, including the negative-corpus mode that took guard relaxation off zero
    - scripts/run_generated_case_adapters.py -- the corpus runner and effect-provider mapping
    - >-
      scripts/effect_conformance.py -- the effect oracle; in-process CPython only, cannot see across a process boundary
    - >-
      scripts/analyze_complexity.py -- the TLA+ descriptor. A thermometer. Reports, refuses nothing.
    - prompts/hexagonal_implementation.md -- the ask that produced D3 = 4
    - >-
      references/eval_scorecard.md + examples/validation/scorecards/score_tools.py -- the card and its checker
    - references/architecture_advice.md -- what the deleted scanners taught, as instructions
  desired_boundaries:
    - Ports the agent declares in the DOMAIN's vocabulary, declared in the MANIFEST too
    - Cases generated PER PORT, not only per action
    - Adapters bound to ports, so a generated case drives a real port
    - 'The fake/real swap as the instrument: identical cases against both, a fault in either dies'
    - Complexity of PRODUCED CODE, measurable at all
    - A scorecard the toolchain SCAFFOLDS rather than each judge hand-authoring from the rubric
  adapter_boundaries:
    - specs/current/tests/ -- conformance for whatever the port-binding surface grows
  known_gaps:
    - >-
      The effect oracle cannot see across a process boundary (in-process CPython only). A port for an action whose effects happen in a child is dead on arrival and no added coverage moves it.
    - >-
      8.7% of the whole-view corpus executes; 39,100 refusal edges carry no arguments. Report executable counts beside every kill number.
    - >-
      ORDERING stays out of scope. Invisible when the modelled thing is a SET -- a property of the model, not a limit of corpora.
epic_goals:
  - id: GOAL-port-reach
    kind: eval
    statement: >-
      A fault behind a port cannot hide. Identical cases run against the real adapter and its fake, so a fault in either one dies.
    metric: >-
      Scorecard D1 (bug detection) plus the per-class per-arm kill table, with a fault seeded DELIBERATELY inside an adapter implementation rather than in the domain. D3 anchor 4 already asks for the real/fake pair; this goal asks whether that pair CATCHES anything.
    harness: >-
      the HP-01-shaped seeded catalogue extended with adapter-internal faults, run against real and fake wirings, scored by two blind judges
    baseline:
      value: >-
        A fault in the treatment arm's in-memory adapter SURVIVED EVERY INSTRUMENT -- five corpus instruments, the oracle, and the hand-written suite. The port created a region no shared oracle reaches. Measured at hexagonal-prompting HP-06. CITATION CORRECTED 2026-08-05 (epic owner, pre-dispatch audit): this baseline was dispatched citing HP-06-DF-10, which documents a DIFFERENT result -- that the guard-relaxation zeros under the whole-view corpus are the oracle's skip rule rather than the sealed catalogue's stated mechanism. THIS RESULT CARRIES NO DF ID AT ALL. It was never filed as a deferred finding; it survives only as a bullet in SELF-IMPROVEMENT.md and inside judge rationales. That an epic's flagship baseline went unfiled for a full epic is itself a finding about the ledger, and PA-06 reports it.
      measured_at: f431c62
      evidence: >-
        specs/.history/hexagonal-prompting-epic/closed-snapshot/results/scorecards/SELF-IMPROVEMENT.md:329-333 -- "The port has a cost nobody predicted." Corroborated by the D3/D1 judge rationales under closed-snapshot/results/scorecards/hexagonal-prompting/. NOT HP-06-DF-10; see the value field.
    target: >-
      The same adapter-internal fault dies on at least one generated instrument, and no positive control is red.
    evaluation_ticket: PA-06
    evidence_root: specs/results/scorecards/ports-as-adapters/GOAL-port-reach
  - id: GOAL-cases-drive-ports
    kind: eval
    statement: >-
      Generated cases drive PORTS, not only whole actions -- so a codebase with real ports is validated differently from one without, and the two arms stop producing identical verdicts.
    metric: >-
      Per-mutant verdict divergence between the arms, plus scorecard D1. The number that must move is the count of comparable cells where the arms AGREE.
    harness: per-port case generation over both arms, per-mutant verdict table, two blind judges
    baseline:
      value: >-
        Per-mutant verdicts IDENTICAL ON 56 OF 56 strictly comparable cells between a hexagonal arm and a non-hexagonal one. Adapters bind to whole actions, so the port boundary is invisible to every oracle. The structure arrived and caught nothing.

        BASELINE CORRECTED 2026-08-05 (epic owner, pre-dispatch audit; owner-approved). This goal was dispatched baselining 49 OF 49 at f431c62. That number is SUPERSEDED, not wrong: EVAL-RERUN at b3a0199 -- which post-dates f431c62 -- REPLICATED AND WIDENED it on a fresh artifact pair and a catalogue seeding all ten mutants on both arms rather than eight, giving 56 of 56. On an independently authored 15-mutant catalogue the only two differing cells were the two rows its author had declared non-parallel. The superseded run is SEALED AND UNEDITED; 49 of 49 stands on the record as measured. The bar moves up because measuring divergence against the weaker instrument would credit divergence the wider one absorbs -- which is the exact hazard PA-05 is chartered to prevent, found live in this plan.
      measured_at: b3a0199 (EVAL-RERUN, repaired instrument); superseded baseline 49 of 49 at f431c62
      evidence: >-
        specs/.history/hexagonal-prompting-epic/closed-snapshot/results/scorecards/SELF-IMPROVEMENT.md:309-315 for the supersession; closed-snapshot/results/scorecards/hexagonal-prompting-rerun/ for the 56-cell run; closed-snapshot/results/scorecards/hexagonal-prompting/ for the sealed 49-cell run.
    target: >-
      The arms' per-mutant verdicts DIVERGE on at least one cell, and the divergence is attributable to a port rather than to prompt length.
    evaluation_ticket: PA-06
    evidence_root: specs/results/scorecards/ports-as-adapters/GOAL-cases-drive-ports
  - id: GOAL-complexity-measurable
    kind: quality
    statement: >-
      The complexity of PRODUCED CODE is measurable at all, and the measurement can tell two implementations of one spec apart. A thermometer, not a thermostat: it reports, it refuses nothing, and nothing is gated on it.
    metric: >-
      A measurement over produced code that distinguishes the arms, reported beside scorecard D2 in the mechanical block and NEVER scored.
    harness: the new instrument run over all arms of the A/B, output recorded in mechanical.json
    baseline:
      value: >-
        NO SUCH INSTRUMENT EXISTS. The shipped descriptor reads TLA+; all arms produce Python. That is why D2 measured 2 for both arms from all four judges last epic -- not the prompt failing to simplify, but nothing in the toolchain being able to tell. The goal's predecessor MISSED and that miss stands on the record; this is the instrument it was missing.
      measured_at: f431c62
      evidence: specs/results/scorecards/SELF-IMPROVEMENT.md
    target: >-
      The instrument runs over produced code and reports figures that differ between arms. NO TARGET ON THE NUMBER ITSELF -- a threshold before anything can produce a number would be inventing the answer.
    evaluation_ticket: PA-06
    evidence_root: specs/results/scorecards/ports-as-adapters/GOAL-complexity-measurable
tickets:
  - id: PA-01
    title: The three-arm harness, the port-aware catalogue, and the sealed predictions
    status: planned
    github_issue: https://github.com/haydenrear/tla-spec-dev/issues/130
    schedule_revision: 2
    schedule_revision_note: >-
      BUMPED TO 2 by the epic owner 2026-08-05, mid-flight, adding a FOURTH part: repair the positive control. Reason, and it is a planning defect rather than a discovery about the code: GOAL-port-reach's target carries the clause "and no positive control is red". examples/validation/ab/seeded_faults.toml:299-306 declares M07 the positive control -- "must die on every instrument on every arm. If M07 survives, every other number in the round is void." The closing ledger 21da25b records arm B's M07 as CORRECTLY RED, i.e. surviving, and PORTS-AS-ADAPTERS-EPIC.md section 8 states it plainly: "A positive control that survives invalidates its row. One is currently red." So the epic's flagship goal was dispatched with a target clause ALREADY FAILING AT BASELINE and NO TICKET OWNING ITS REPAIR. Six tickets were planned and none of them fixes the control. PA-01 owns examples/validation/ab/ and had not sealed, so the work goes here rather than into a seventh ticket. THE TARGET IS NOT TOUCHED. Repairing an instrument BEFORE any measurement is not the forbidden act; the forbidden acts are repairing after an unflattering signal and moving a target to meet a result, and neither is happening. If the control cannot be made to work on some arm it is REPORTED RED, never made green by weakening what it asserts -- a control that cannot fail is the exact defect EVAL-SUPPRESS found in this instrument.
    depends_on: []
    blocks: [PA-03, PA-05, PA-06]
    wave: 1
    promotion_order: 10
    promotion_predecessor: null
    conflict_keys:
      production: []
      tla: []
      adapters: []
      test_graph: []
      workflow: [examples/validation/ab/, examples/validation/PREDICTIONS-PA.md]
    objective: >-
      This epic's EV-01. Three parts.

      (1) A THIRD ARM, which the last epic could not run and which is the only way to settle its biggest confound. Arm A ordinary prompt, arm B the hexagonal ask, and ARM C a length-matched control: as long as arm B in unique content, asking for nothing architectural. Last epic's D3 went 1 to 4 on the treatment, and its own report says the win cannot be attributed to "hexagonal" rather than to a 6.6x longer prompt. Arm C is what separates them. If arm C matches arm B, the finding is that longer prompts produce better structure, which is worth knowing and is not what we claimed.

      (2) A PORT-AWARE CATALOGUE. Extend the seeded-fault file with faults seeded DELIBERATELY INSIDE AN ADAPTER IMPLEMENTATION, not in the domain. That is the class the last epic proved invisible: a fault in the treatment arm's in-memory adapter survived every instrument, because the port creates a region no shared oracle reaches. Keep the exactly-once harness, keep the apply/revert byte-identical check, and keep declaring what is NOT seeded with reasons so the eval reports "not seeded" rather than "not caught".

      (3) SEALED PREDICTIONS, committed before any other ticket is dispatched, with at least three NEGATIVES. The last epic's most informative results were both negatives: a repair that worked and moved zero cells (predicted), and a treatment that produced the structure and caught nothing (not predicted). Predict what will NOT move.

      Carry forward the fixture, model and behavioural suite from the previous epic's A/B rather than authoring new ones -- the point of a baseline is that it is the same subject.
    desired_actions: []
    implementation_scope: [examples/validation/]
    goals:
      - goal: GOAL-port-reach
        contribution: enabling
        expected_effect: none -- enabling only; supplies the adapter-internal faults this goal is measured with
        local_signal: python3 examples/validation/ab/check_catalogue.py
      - goal: GOAL-cases-drive-ports
        contribution: enabling
        expected_effect: none -- enabling only; supplies the third arm that separates hexagonal from prompt length
        local_signal: unique-content line counts per arm, reported as a number
      - goal: GOAL-complexity-measurable
        contribution: enabling
        expected_effect: none -- enabling only; supplies the arms the instrument must tell apart
        local_signal: 'N/A: harness ticket'
    acceptance:
      commands: [uv run --with pytest --with pyyaml python -m pytest tests -q]
      assertions: ["Three arms exist as three prompt files; arm C is length-matched to arm B in unique content and asks for nothing architectural, and the match is reported as a measured number.", "The catalogue seeds at least two faults INSIDE an adapter implementation, each proven to occur exactly once, apply/revert byte-identical.", "PREDICTIONS-PA.md is committed before any other ticket is dispatched and contains at least three explicit NEGATIVE predictions.", "ADDED AT schedule_revision 2. M07's status is established BY RUNNING IT on every arm including the new arm C, and reported per arm. If it is red on any arm the control is repaired so it does a control's job on all three; if it cannot be made to work on some arm that is REPORTED RED rather than made green by weakening the assertion. A prediction about M07 is sealed in PREDICTIONS-PA.md BEFORE the repair, not after. The related defect is checked while in there: the rerun found arm B's positive control \"does not do a control's job\" and the catalogue carries arm A's role string verbatim over it."]
    model_delta_expectation: none -- and per surface_cost_rule that is a feature
  - id: PA-02
    title: 'Complexity of produced code: build the instrument that was missing'
    status: closed
    github_issue: https://github.com/haydenrear/tla-spec-dev/issues/131
    schedule_revision: 1
    depends_on: []
    blocks: [PA-06]
    wave: 1
    promotion_order: 20
    promotion_predecessor: PA-01
    conflict_keys:
      production: [scripts/code_complexity.py, tests/test_code_complexity.py]
      tla: []
      adapters: []
      test_graph: []
      workflow: [references/complexity_intuition.md]
    objective: >-
      THE GOAL THIS REPLACES DID NOT FAIL BECAUSE THE PROMPT FAILED TO SIMPLIFY. It failed because nothing in the toolchain could tell. The shipped descriptor reads TLA+; every arm produces Python. Both arms scored D2 = 2 from all four judges for that reason.

      Build the missing measurement: complexity of PRODUCED CODE. Modules, public surface, pieces of mutable state, branch count, depth -- the same kind of figures the TLA+ descriptor reports, over the thing the agent actually wrote.

      A THERMOMETER, NOT A THERMOSTAT, and this is the whole design constraint. It reports. It refuses nothing. Nothing is gated on it. Its output lands in the scorecard's MECHANICAL BLOCK, which is recorded and never scored, precisely so that a disagreement between measurement and judgement is visible as a finding rather than resolved by arithmetic.

      Two rules the instrument must not violate, both bought by measurement:

      - MF-020: A NUMBER FALLING IS NOT EVIDENCE THE DESIGN IMPROVED. A metric
        can improve because an edge was deleted. The best complexity result in
        the record was withheld from a top score by both judges for exactly this.
        The instrument reports figures; it must not report a verdict.
      - CD-01: it proposes no cut, no refactor, no move. A tool that picks the
        boundary makes every edge legal by construction.

      NO TARGET ON THE NUMBER. The goal is that the instrument exists and can tell two implementations of one spec apart. Setting a threshold before anything can produce a figure would be inventing the answer.
    desired_actions: []
    implementation_scope: [scripts/code_complexity.py, references/complexity_intuition.md, tests/]
    goals:
      - goal: GOAL-complexity-measurable
        contribution: direct
        expected_effect: >-
          The instrument runs over produced Python and reports figures that DIFFER between the arms. If the figures are identical across arms, the instrument cannot tell them apart and the goal is missed.
        local_signal: run it over the previous epic's two committed arms and report whether the figures differ
      - goal: GOAL-port-reach
        contribution: guard
        expected_effect: none -- must not gate, refuse, or block anything
        local_signal: N/A
      - goal: GOAL-cases-drive-ports
        contribution: guard
        expected_effect: none expected
        local_signal: N/A
    acceptance:
      commands: [uv run --with pytest --with pyyaml python -m pytest tests -q, python3 scripts/code_complexity.py examples/validation/ab/arms/<arm>]
      assertions: ["The instrument reports figures over produced Python and exits 0 on every input, including one it cannot fully parse -- an unparseable construct costs completeness and is REPORTED, never a refusal.", "It reports no verdict, proposes no change, and nothing in the toolchain gates on its output.", "Run over the previous epic's two committed arms it produces figures that differ, or the ticket reports that it cannot tell them apart."]
    model_delta_expectation: none expected -- a reporting tool, not program behaviour the model represents
  - id: PA-03
    title: Ports in the manifest, and cases generated per port
    status: done
    github_issue: https://github.com/haydenrear/tla-spec-dev/issues/132
    schedule_revision: 1
    depends_on: [PA-01]
    blocks: [PA-04, PA-06]
    wave: 2
    promotion_order: 30
    promotion_predecessor: PA-02
    conflict_keys:
      production: [scripts/generate_cases_from_tlc_dump.py, tests/test_generate_cases_from_tlc_dump.py]
      tla: []
      adapters: []
      test_graph: []
      workflow: [prompts/hexagonal_implementation.md, references/generation_modes.md]
    objective: >-
      The first half of making the two senses of "adapter" one object.

      The prompt already makes an agent declare ports in the DOMAIN'S vocabulary. Have it declare them in the MANIFEST too, in the same shape the toolchain already uses for effect ports -- so a port the agent invented becomes a port the toolchain knows about.

      Then generate cases PER PORT, not only per action. Today every generated case drives a whole action, which is why a hexagonal codebase and a non-hexagonal one produce identical verdicts on 49 of 49 comparable cells: the port boundary is invisible to generation. NOTE, added by the epic owner 2026-08-05: 49 of 49 is the SEALED HP-06 number and it was SUPERSEDED before this epic opened. EVAL-RERUN at b3a0199 replicated and widened it to 56 OF 56 strictly comparable cells on a fresh artifact pair and a wider catalogue. Aim at 56 of 56. See GOAL-cases-drive-ports.baseline for why the bar moved up.

      Inherit rather than rebuild. The negative-corpus mode already emits the disabled edges at each reachable state and took guard relaxation from 0 of 3 to 3 of 3; per-port generation should compose with it, not replace it. And the tractability work stands: a corpus nobody can run is not a mechanism, and this model needed a projection to produce one at all.
    desired_actions: []
    implementation_scope: [scripts/generate_cases_from_tlc_dump.py, prompts/hexagonal_implementation.md, references/generation_modes.md, tests/]
    goals:
      - goal: GOAL-cases-drive-ports
        contribution: direct
        expected_effect: >-
          The arms' per-mutant verdicts DIVERGE for the first time. If they stay identical on all comparable cells, generation still cannot see a port and the goal is missed.
        local_signal: per-mutant verdict table over both arms, counting cells where they agree
      - goal: GOAL-port-reach
        contribution: enabling
        expected_effect: none on its own -- supplies the per-port cases PA-04 binds to adapters
        local_signal: case counts per declared port
      - goal: GOAL-complexity-measurable
        contribution: guard
        expected_effect: none expected; must not grow a corpus past its cap again
        local_signal: case count against the manifest cap
    acceptance:
      commands: [uv run --with pytest --with pyyaml python -m pytest tests -q, python3 scripts/tla_spec_dev.py --spec-root specs generate cases <model> --out <corpus>]
      assertions: ["A port declared by an agent in the manifest produces its own case set, and the count per port is reported.", "Per-port generation composes with the negative-corpus mode rather than replacing it; guard relaxation does not regress from 3 of 3.", "Corpora stay under the manifest cap, and byte-identical across two independent generations INCLUDING failing executions.", Per-class per-arm kill table reported. Never a single rate.]
    model_delta_expectation: >-
      Possibly one generation-mode variant. Per surface_cost_rule, state what it buys and what the state space costs BEFORE adding it -- the predecessor measured ~1.5 new coverage gaps and ~8x state space per surface-adding ticket.
  - id: PA-04
    title: Adapters bind to ports, and the fake/real swap becomes the instrument
    status: done
    github_issue: https://github.com/haydenrear/tla-spec-dev/issues/133
    schedule_revision: 1
    depends_on: [PA-03]
    blocks: [PA-06]
    wave: 3
    promotion_order: 40
    promotion_predecessor: PA-03
    conflict_keys:
      production: [scripts/run_generated_case_adapters.py, scripts/effect_conformance.py, tests/test_effect_conformance.py]
      tla: []
      adapters: []
      test_graph: []
      workflow: [references/case_modules.md]
    objective: >-
      The second half, and the one that closes the epic's thesis.

      Bind spec-unit and Test Graph adapters TO PORTS rather than to whole actions, so a generated case drives a real port. Then make the FAKE/REAL SWAP the instrument: run the identical case list against the real adapter and against its fake, and a fault in either one dies.

      This is aimed at one measured hole. A fault in the previous epic's treatment arm lived in its in-memory adapter and SURVIVED EVERY INSTRUMENT -- five corpus instruments, the effect oracle, and the hand-written suite. The port created a region no shared oracle reaches, so hexagonal architecture made the code more modular and simultaneously created somewhere for a bug to hide.

      Note what the scorecard already asks: D3 anchor 4 wants a driven port exercised by a real adapter AND a fake with the same cases passing against both. One arm reached it. What nobody has shown is that the pair CATCHES anything, and that is this ticket.

      Two inherited defects are yours if they block you, and both were found by RUNNING rather than inspecting: the oracle drives 8 of 18 actions because nine adapters have no run() at all, and its counterfactual showed that an adapter differing ONLY in having one takes a mutant from surviving to dying 8 of 8. The oracle's reach was never the limit; the adapters' shape was.
    desired_actions: []
    implementation_scope: [scripts/run_generated_case_adapters.py, scripts/effect_conformance.py, references/case_modules.md, tests/]
    goals:
      - goal: GOAL-port-reach
        contribution: direct
        expected_effect: >-
          The adapter-internal fault PA-01 seeded dies on at least one generated instrument. If it survives everything again, the port region is still unreachable and the goal is missed.
        local_signal: PA-01's adapter-internal faults against the real and fake wirings
      - goal: GOAL-cases-drive-ports
        contribution: direct
        expected_effect: >-
