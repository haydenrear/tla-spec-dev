    desired_actions: []
    implementation_scope: [specs/results/scorecards/]
    goals:
      - goal: GOAL-caveat-discriminates
        contribution: direct
        expected_effect: The caveat's discrimination is settled either way.
        local_signal: D3 under v4 vs v5 on an artifact without the hole
      - goal: GOAL-validation-is-scorable
        contribution: guard
        expected_effect: none expected
        local_signal: N/A
      - goal: GOAL-scored-at-goal-time
        contribution: guard
        expected_effect: none expected
        local_signal: N/A
      - goal: GOAL-loop-reaches-the-program
        contribution: guard
        expected_effect: none expected
        local_signal: N/A
    acceptance:
