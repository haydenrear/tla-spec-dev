        contribution: enabling
        expected_effect: none -- enabling only; PA-06 decides this goal with the card this ticket scaffolds
        local_signal: scaffold a card, fill one dimension, and confirm `check` rejects it uncited
      - goal: GOAL-cases-drive-ports
        contribution: enabling
        expected_effect: none -- enabling only
        local_signal: 'N/A: tooling ticket'
      - goal: GOAL-complexity-measurable
        contribution: enabling
        expected_effect: >-
          none -- enabling only; the complexity figures land in the mechanical block this scaffold emits
        local_signal: 'N/A: tooling ticket'
    acceptance:
      commands: [uv run --with pytest --with pyyaml python -m pytest tests -q, "python3 examples/validation/scorecards/score_tools.py scaffold specs/results/scorecards/ports-as-adapters --example ab_quota_ledger --arms A,B,C --judges 2", "python3 examples/validation/scorecards/score_tools.py check specs/results/scorecards/ports-as-adapters"]
      assertions: ["A scaffolded card carries the anchors and scoring rules inline, and `check` still rejects an uncited score >= 2 and a 4 with no refuses_to_claim.", "Arms are emitted under opaque labels; the mapping lands in a separate file; scaffolding twice over the same path REFUSES rather than overwriting.", "History is readable per example, with instrument changes marked between rows, and the reading rules are in references/eval_scorecard.md.", Every new behaviour ships a test that FAILS on the parent commit.]
