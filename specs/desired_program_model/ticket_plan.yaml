# Canonical plan for the architectural-coherence epic. GitHub issues mirror this
# file for handoff; this file remains the source of truth. Dispatched ticket
# IDs, dependency edges, waves, and promotion order are immutable after issue
# assignment -- add amendment tickets instead of editing dispatched identities.
#
# Predecessor epics (closed): modular-fuzzing, complexity-descriptor,
# effect-provider, complexity-descriptor-main-readiness. See specs/.history/
# and ARCHITECTURAL-COHERENCE-EPIC.md at repo root.
version: 1
name: architectural-coherence-epic
updated: "2026-07-26"
purpose: >
  Two levers on one idea: the diagram is the design authority, so the
  decomposition it implies should be both ENTERABLE (BDD case modules that
  slice a view by aspect) and CHECKABLE (an architecture descriptor derived
  from the model, plus a reflexion check that measures production code against
  it). Case modules cut the behavior surface from the user's side; the
  architecture descriptor cuts the implementation by state ownership; both are
  projections of the same variables x actions structure. Advisory throughout,
  and the epic ends with a fact-finding eval run rather than a claim.

planning_rules:
  current_model_rule: Update specs/current after each production slice lands as a whole-program working copy of specs/program_model, not a ticket projection.
  unit_validation_rule: Run current-model TLC and adapter/unit tests before adding graph execution.
  graph_rule: Add graph or integration nodes only after current-model validation passes.
  semantic_model_rule: >-
    Do not add test graph nodes, pytest jobs, CI workflow steps, integration
    harnesses, or validation scripts as TLA+ program state/actions. The modeled
    program surface is the SHIPPED CLI lifecycle -- scaffold, open, run
    spec-unit-tests, analyze (descriptor scan), close.

    RESTORED 2026-08-01 by owner amendment (schedule_revision 4), answering
    MF-026 ESC-1. These four rulings were folded into the PREDECESSOR plan on
    2026-07-23 at the previous audit's request (ESC-C2-1) so that plan would be
    self-contained; this plan truncated them away, and six of the twelve gaps
    the architectural-coherence audit found exist because of that reversion.
    They are restored here in this plan's own words, so this plan is
    self-contained too and no future audit has to read them across from a sealed
    snapshot:

    (1) The experimental fuzzing surface -- corpus gate, effect conformance,
    kill test -- remains MODELED as-is, a faithful representation of shipped
    experimental commands.

    (2) SUPERSEDED 2026-08-01 by owner decision (MF-026 round-2 ESC-11). The
    predecessor's ruling read "`generate` is UNMODELED, a recorded granularity
    limitation, modeled if/when the experimental surface is promoted." Two
    things are now wrong with it and both are recorded rather than quietly
    dropped. First, it names a `generate` command that does not exist in
    `build_parser`, so it classifies no file and left `generate_python.py` and
    `generate_docs.py` unclassified. Second, the owner has ruled that
    case-module generation IS modeled -- it is shipped, user-invocable program
    surface, and MF-026 G-6/G-10 found that two tickets closed "zero model
    delta" against surface the model does not contain. THE RULING NOW READS:
    case generation is MODELED, as a `GenerateCases` action carrying
    corpus_process (spawn), spec_tree (write) and spec_tree_delete (the metadir
    rmtree), with the parameter-recovery audit write folded into the same
    action. `generate_python.py` and `generate_docs.py` are IN MODEL under
    scripts/**/*.py and are classified by that line, not by this one.

    (3) Per-command refusal branches beyond the modeled gate verdicts, and
    per-flag CLI variants, are OUT-OF-MODEL as a recorded granularity
    limitation -- for 72 of the 78 options.

    NARROWED 2026-08-01 by owner decision (MF-026 round-2 reservation). The
    predecessor's ruling ended "guard-weakening flags are governed by doctrine,
    not modeled." That sentence was doing more work than it can carry, and the
    auditor put the cost on the record rather than deciding it: `CloseTicket`
    guards on `TicketSpecUnitTestsPassed`, TLC proves
    `ClosedTicketsPassedSpecUnitTests` over 1,292,951 states, and `--accept-new`
    / `--allow-open` exist SPECIFICALLY to bypass that precondition -- while no
    modeled state records their use and the kill test seeds only inside modeled
    boundaries. No oracle can see the difference, so the strongest claim this
    model makes has an unmeasured bypass.

    THE SIX GUARD-WEAKENING FLAGS ARE THEREFORE MODELED: --accept-new,
    --allow-open, --no-promote-current, --validate-only, --force, --dry-run. A
    close taken under a weakening flag is a DIFFERENT STATE from one taken under
    the guard. Six of 78 -- the granularity limitation the rest of this ruling is
    about is untouched, and the remaining 72 options stay inventoried as
    presentation.

    (4) Advisory tooling internals (fitness evaluation inside analyze,
    silent-degrade guards, runner env re-exec), the close/start/scaffold wrapper
    scripts, run_tlc.sh, clock/provenance reads on the close path, and the
    effect-provider runtime are validation harness / toolchain plumbing:
    OUT-OF-MODEL.

    THE STANDING PROVISO, NOT WAIVED BY ANY OF THE FOUR: an out-of-model FILE
    does not make an out-of-model EFFECT. Where a modeled action performs a real
    effect, that effect MUST still be declared as a port. MF-026 ESC-6 is the
    live counterexample -- skill-scripts/install-tlc2.sh:37 performs a real curl
    download on the BuildSkillCli / InstallLocalCli path and no network.* port
    is declared anywhere, although the effect sandbox observes network.connect.
    Ruling the file out of model does NOT rule out the port; that port is a gap
    to close, not an escalation to answer.
  representation_scope_rule: >-
    ADDED 2026-08-01 by owner amendment (schedule_revision 4), answering MF-026
    ESC-2. `implementation_scope` on a ticket is an EDIT-PERMISSION list -- the
    files that agent may touch. It is NOT a representation scope and must never
    be read as one. Read as one it measures the wrong surface in both
    directions: 325 example-fixture files land in scope for TlaSpecDevCli.tla
    while 24 of the 34 files in scripts/ -- the program the model actually
    represents -- are named by no plan line at all. The coverage audit reads
    `representation_scope` below and nothing else. Neither list is derived from
    the other.
  evidence_rule: Record tests and graph runs as evidence for semantic program actions in manifests or ticket status.
  desired_sync_rule: Update this file and spec_manifest.yaml whenever scope, order, acceptance checks, or status changes.
  promotion_rule: When specs/current equals specs/desired_program_model, promote the converged model to specs/program_model.

