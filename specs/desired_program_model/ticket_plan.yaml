  - id: HP-03
    title: "The negative corpus: TLC's disabled edges, asserted rejected -- and a corpus that fits its own cap"
    status: done
    github_issue: null
    schedule_revision: 1
    depends_on: [HP-01]
    blocks: [HP-06]
    wave: 2
    promotion_order: 30
    promotion_predecessor: HP-02
    conflict_keys:
      production: ["scripts/generate_cases_from_tlc_dump.py", "tests/test_generate_cases_from_tlc_dump.py"]
      tla: []
      adapters: []
      test_graph: []
      workflow: ["references/generation_modes.md"]
    objective: >-
      The single largest available increase in what a generated corpus can see,
      and the only ticket aimed at a fault class that has measured ZERO on every
      instrument in every round.

      A generated corpus replays only ENABLED edges, so it contains no rejected
      inputs: a service that accepts what the model forbids passes every case.
      Round 1: 0 of 3. Round 2: 0 of 3, on both arms, AFTER RP-02 took parameter
      recovery from 0 of 5 to 5 of 5 -- which moved nothing and thereby
      falsified round 1's own explanation. RP-02 counted why: all 330 recovered
      arguments are arguments the guard ACCEPTS, 0 are rejected inputs, and 220
      refusable pairs exist in the state space a state graph can never emit. A
      third blind catalogue reproduced it unaided: `330 'status': 'applied'` --
      the corpus never once asks the program to reject a call.

      So build the generator mode: at each reachable state, the actions whose
      guards are DISABLED, emitted as cases asserting the call is REJECTED. TLC
      already knows them; the profile does not widen.

      AND MAKE A CORPUS TRACTABLE, because today one is not. Carries
      RC-02-DF-04 and MF026-R4-F-01: `generate cases` on MCsmall -- the config
      that exists to make a corpus tractable -- produces 3,678,217 cases and a
      7.4 GB file CPython cannot import, 18,391x the manifest's own cap, and
      this model has no tlc_projection.py while every worked example does. A
      negative corpus nobody can run is not a mechanism.

      DO NOT BUDGET ANY OF THIS AGAINST PARAMETER RECOVERY. That hypothesis is
      dead, measured, and retracted in writing.
    desired_actions: []
    implementation_scope: ["scripts/generate_cases_from_tlc_dump.py", "references/generation_modes.md", "tests/"]
    goals:
      - goal: GOAL-catch-bugs
        contribution: direct
        expected_effect: "Guard-relaxation kills move off zero for the first time. If they do not, the class needs a profile change rather than a generator, and that is the epic's most valuable finding."
        local_signal: "the HP-01 seeded catalogue's guard-relaxation class, per arm"
      - goal: GOAL-simpler-same-behavior
        contribution: guard
        expected_effect: "none expected; must not grow the corpus past its cap again"
        local_signal: "case count against the manifest cap"
      - goal: GOAL-hexagonal-in-fact
        contribution: guard
        expected_effect: "none -- generator work, no architecture claim"
        local_signal: "N/A"
    acceptance:
      commands:
        - "uv run --with pytest --with pyyaml python -m pytest tests -q"
        - "python3 scripts/tla_spec_dev.py --spec-root specs generate cases <model> --out <corpus>"
      assertions:
        - "A negative corpus emits, per reachable state, the disabled actions with the argument that would be refused, each asserting rejection."
        - "Zero false rejections on the green control: no case asserts rejection of an input the model enables."
        - "Byte-identical across two independent generations, INCLUDING its failing executions."
        - "This model produces a corpus its own cap accepts, and the run states which projection made that true."
        - "Per-class per-arm kill table reported. Never a single kill rate."
      evidence:
        - "specs/.history/hexagonal-prompting-epic/ticket-002-HP-03/ticket/results/negative-corpus-generation.txt"
        - "specs/.history/hexagonal-prompting-epic/ticket-002-HP-03/ticket/results/kill-table-hp01.json"
        - "specs/.history/hexagonal-prompting-epic/ticket-002-HP-03/ticket/results/kill-table-fresh.json"
        - "specs/.history/hexagonal-prompting-epic/ticket-002-HP-03/ticket/results/kill-table-dedupe-cost.json"
        - "specs/.history/hexagonal-prompting-epic/ticket-002-HP-03/ticket/results/false-rejection-analysis.txt"
        - "specs/.history/hexagonal-prompting-epic/ticket-002-HP-03/ticket/results/determinism.txt"
        - "specs/.history/hexagonal-prompting-epic/ticket-002-HP-03/ticket/results/mcsmall-tractability.txt"
        - "specs/.history/hexagonal-prompting-epic/ticket-002-HP-03/ticket/results/corpus-shape.txt"
        - "specs/.history/hexagonal-prompting-epic/ticket-002-HP-03/ticket/results/shipped-runner-negative.txt"
        - "specs/.history/hexagonal-prompting-epic/ticket-002-HP-03/ticket/results/goal-signal.txt"
        - "specs/.history/hexagonal-prompting-epic/ticket-002-HP-03/ticket/results/zero-model-delta.txt"
        - "specs/.history/hexagonal-prompting-epic/ticket-002-HP-03/ticket/results/spec-unit-tests.txt"
        - "specs/.history/hexagonal-prompting-epic/ticket-002-HP-03/ticket/results/pytest-full.txt"
      close_note: >-
        THE HEADLINE, AND IT IS THE FIRST TIME: guard relaxation moved off zero.
        3 of 3 on HP-01's seeded catalogue and 5 of 5 on a fresh independently
        authored one, against 0 of 3 and 0 of 5 for the whole-view corpus on the
        same reference implementation and the same run. Baseline was 0 of 3, 0 of
        3 and 0 of 4 across three catalogues, five instruments and two rounds.

        Assertion 1 MET. The mode evaluates each action's own body at every
        reachable state over every argument tuple its quantifier domains admit,
        and emits a case wherever it is definitely FALSE. 118 cases on the
        fixture, each carrying exact arguments and the violated conjunct verbatim
        as its rejection reason.

        Assertion 2 MET, and it is a property of the algorithm rather than of the
        fixture. Evaluation is three-valued; every unimplemented construct is
        UNKNOWN and UNKNOWN never emits, so an unsupported construct costs
        completeness and can never cost soundness. Cross-checked: 3,440 ENABLED
        edges re-evaluated at their own source states, 0 evaluated FALSE. The
        disabled set is computed by EVALUATING the model and never by subtracting
        the dump's edges -- measured, the dump holds 4,028 edges where 7,716
        argument tuples are not disabled, so the subtraction would have reported
        enabled inputs as refusable.

        Assertion 3 MET including failing executions. Two full generations of a
        43,246-case corpus (each with its own TLC run) are byte-identical across
        all six package files; two generations of the projected 541-case MCsmall
        corpus likewise; and two runs of the shipped runner over a corpus that
        FAILS 4 cases produce identical failure text, case order included.

        Assertion 4 PARTIALLY MET, and the shortfall is recorded rather than
        closed. `specs/current/tlc_projection.py` did not exist; it does now, and
        MCsmall goes from 3,678,217 cases / 7.4 GB (18,391x the cap) to 541 cases
        / 667 KB -- 6,799x -- by moving pure outputs and recorded verdicts out of
        the state into the asserted output, deleting no oracle. Every run now
        names its projection unprompted, in stdout and in docs.md. But 541 is
        still 2.7x the cap of 200, and HP-03 did NOT raise the cap: the accept
        path's suggested value is 541, the number this ticket produced, and a
        budget fitted to the result it must admit is not a budget. Filed
        HP-03-DF-02 for the owner.

        Assertion 5 PARTIALLY MET. Per-class per-instrument tables are reported
        for both catalogues with controls, and no aggregate rate is computed
        anywhere. The PER-ARM axis is NOT measurable at HP-03: the arms are
        implementations the A/B produces at HP-06 and neither has any code yet.
        Every number is on the fixture's reference implementation, which is
        explicitly not an arm.

        THE UNFLATTERING HALF, recorded here rather than only in the fixture.
        The hand-written suite kills 10 of 10. The whole-view corpus kills 5 of
        10 and the two corpora together 8 of 10 -- so on this fixture the
        generator is still worse than a suite written in an afternoon, and HP-06
        must say so. M07, a positive control the catalogue declares must die on
        every instrument on every arm, SURVIVES the whole-view corpus, because
        Reserve contributes zero executable cases. Only 3,440 of 43,128 positive
        cases (8.0%) are executable at all.

        THE COMPARISON THIS TICKET EXISTS TO MAKE. HP-01's fixture already
        contains the profile change -- seven explicit Refuse* actions. They
        produce 39,100 cases (90.7% of the corpus) carrying NO arguments, because
        their parameters appear nowhere in their bodies and no recovery mechanism
        can recover what the state pair does not contain. Zero of them are
        executable. The generator produces the same refusals as 118 executable
        cases. The negative corpus did not need a profile change; the profile
        change did not produce a usable negative corpus.

        ZERO MODEL SURFACE ADDED, per surface_cost_rule, argued rather than
        asserted in results/zero-model-delta.txt: a per-flag variant of the
        existing GenerateCases action, no new port, no second TLC run, 1x state
        space.

        Four findings FILED and none fixed. HP-03-DF-01 is the one worth reading:
        the fixture's model guards a reservation id its own API allocates rather
        than accepts, so 4 of 118 negative cases assert the rejection of a call
        the UNMUTATED reference correctly accepts. It is a true statement about a
        model that does not refine its own FEATURE.md, it was invisible to every
        existing instrument, and the negative corpus is what found it.
        HP-03-DF-04 retracts a documented limit: ordering is NOT invisible to
        corpora, it is invisible when the model represents the ordered thing as a
        set, and M09 died on the whole-view corpus because this model uses a
        sequence.

        WHERE THE EVIDENCE ACTUALLY IS: `close ticket` consumes
        specs/tickets/HP-03/ into the append-only record, so every path above
        now reads
        specs/.history/hexagonal-prompting-epic/ticket-002-HP-03/ticket/results/.
        The measurement instruments -- the adapter, the fresh catalogue and the
        kill-table driver -- are sealed beside them under .../ticket/measure/.

        Reconciled onto epic tip 757de49 (schedule_revision 2, HP-02 merged).
        Re-checked HP-03's entry field by field against the amended plan: goals,
        contributions, expected effects, local signals, conflict keys, wave,
        promotion order and predecessor are all unchanged by the amendment, which
        touched only GOAL-simpler-same-behavior's metric and harness.
    model_delta_expectation: >-
      A generation mode may need an action. If so, state what it buys and what
      the state space costs BEFORE dispatch, per surface_cost_rule -- the
      predecessor measured ~1.5 new coverage gaps and 8x state space per
      surface-adding ticket.

      OUTCOME: none needed. The mode is a per-flag variant of GenerateCases,
      which semantic_model_rule places out-of-model, and it performs no effect
      that action does not already declare. 1x state space, zero new coverage
      gaps.

  - id: HP-04
    title: "Make the adapters actually run: load a scaffolded project's adapters, skip what cannot execute, run a slice"
    status: done
    github_issue: null
    schedule_revision: 1
    depends_on: [HP-01]
    blocks: [HP-06]
    wave: 2
    promotion_order: 40
    promotion_predecessor: HP-03
    conflict_keys:
      production: ["scripts/effect_conformance.py", "scripts/run_generated_case_adapters.py", "tests/test_effect_conformance.py"]
      tla: []
      adapters: []
      test_graph: []
      workflow: ["references/case_modules.md"]
    objective: >-
      The adapters are the half that catches bugs, and three measured defects
      stop them. All three were found by RUNNING the oracle for the first time
      in the project's history, not by inspecting it.

      RC-02-DF-02: the oracle never puts the target spec dir on sys.path, so it
      cannot import the `case_adapters.toml` convention the CLI itself
      scaffolds. It cannot read a project it created.

      RC-02-DF-03: it never consults `can_run` and aborts the whole run on the
      first apply()-only adapter. NINE OF SEVENTEEN adapters in this model are
      apply()-only, so it sees 8 of 18 actions.

      MF026-R4-F-01: the gap count is NOT REPRODUCIBLE -- 20 / 15 / 14 across
      three runs of an identical corpus, a 43% spread on the number that would
      gate, because a work directory persists between runs. Any claim resting on
      that number is currently unciteable.

      Plus CM-F5, still open and still the cheapest outside-in artifact: a slice
      narrower than its view orphans the view's effect providers, both shipped
      mappings bind the port, so a slice has ZERO working configurations and the
      documented workaround needs a third file that exists nowhere. A round-2
      blind agent lost 3 of its 15 actions to it and had to author that file --
      and observed that the mapping it wrote is a STRICTLY WEAKER instrument
      with no durable-write oracle, so a green slice run over-reads.
    desired_actions: []
    implementation_scope: ["scripts/effect_conformance.py", "scripts/run_generated_case_adapters.py", "references/case_modules.md", "tests/"]
    goals:
      - goal: GOAL-catch-bugs
        contribution: direct
        expected_effect: "The oracle sees 18 of 18 actions instead of 8, and a hand-written slice executes. More of the corpus reaching real adapters is the mechanism by which D1 can move at all."
        local_signal: "run effect-conformance twice over the same corpus; the gap count must be identical"
      - goal: GOAL-hexagonal-in-fact
        contribution: direct
        expected_effect: "An adapter swappable for a fake with the same cases passing is D3 anchor 4; this ticket is what makes that runnable."
        local_signal: "run one aspect's corpus against a real adapter and a fake"
      - goal: GOAL-simpler-same-behavior
        contribution: guard
        expected_effect: "none expected"
        local_signal: "N/A"
    acceptance:
      commands:
        - "uv run --with pytest --with pyyaml python -m pytest tests -q"
        - "python3 scripts/tla_spec_dev.py --spec-root specs run effect-conformance --cases-dir <corpus>"
      assertions:
        - "The oracle loads the adapters of a freshly scaffolded project without the caller adjusting sys.path."
        - "An adapter that cannot execute a case is SKIPPED AND REPORTED, never aborting the run."
        - "Two runs over an identical corpus report an identical gap count. A nondeterministic oracle is a finding, however good its first run."
        - "A slice narrower than its view runs end to end with no owner writing the author a file, and any derived mapping states which oracles it does NOT carry."
      evidence:
        - "specs/tickets/HP-04/results/adapter-reach.txt"
        - "specs/tickets/HP-04/results/scaffolded-project.txt"
        - "specs/tickets/HP-04/results/dead-ports-reread.txt"
        - "specs/tickets/HP-04/results/determinism-two-runs.txt"
        - "specs/tickets/HP-04/results/cmf5-baseline.txt"
        - "specs/tickets/HP-04/results/cmf5-after.txt"
        - "specs/tickets/HP-04/results/real-and-fake.txt"
        - "specs/tickets/HP-04/results/kill-table.txt"
        - "specs/tickets/HP-04/results/goal-signal.txt"
        - "specs/tickets/HP-04/results/suite-comparison.txt"
        - "specs/tickets/HP-04/results/pytest-full.txt"
        - "specs/tickets/HP-04/results/spec-unit-tests.txt"
        - "specs/tickets/HP-04/results/tlc-current-mcsmall.txt"
      close_note: >-
        ALL FOUR ASSERTIONS MET, AND THE HEADLINE RESULT IS THE ONE HP-01
        PREDICTED WOULD BE UNFLATTERING: THE MUTANT MATRIX MOVED BY ZERO CELLS.

        Assertion 1: `run effect-conformance --target specs/current` runs with
        no PYTHONPATH. Also demonstrated on a project this CLI freshly
        scaffolded (scaffolded-project.txt), whose mapping uses a different
        convention again -- `specs.program_model.adapters:X` rather than the
        bare `production_adapters:X` this repository uses. Both resolve.

        Assertion 2: the oracle reports on 18 of 18 modeled actions and DRIVES
        8. The 10 it does not drive are named with a machine-readable reason:
        9 `not-runnable` (apply() and no run(case, work_dir)) and 1 `unbound`
        (Stutter, deliberately not bound). Skips enter no verdict per
        no_new_gates_rule and are impossible to miss. A SECOND abort was found
        on the way and closed the same way: an adapter that ACCEPTS a case and
        then RAISES used to kill the run on case 1 of 148; it is now collected
        per case and FAILS the run as `adapter_error`, which is not a new gate
        because the run already failed by crashing.

        Assertion 3: 20 / 20 / 20 gaps over three runs of an identical corpus
        sharing one work dir, with the WHOLE report identical, not merely the
        count. The same corpus on the epic-tip oracle gives 20 / 19 / 19 gaps
        and 9 / 10 / 10 dead ports.

        Assertion 4: the ex4 slice executes 50 cases against
        `specs/program_model/case_adapters.toml` -- the mapping the fixture
        already ships -- with no third file. Every run with semantic providers
        now states which oracles it CARRIES (port -> provider, so a silent
        provider and a content-asserting one can be told apart) and which it
        does NOT, with "treat its kill count as a FLOOR", in the run output
        rather than only in documentation.

        THE KILL TABLE, per class per arm, and it is a zero. oracle-before
        produced NO REPORT on the control and on all 10 mutants -- the
        instrument was not merely blind, it was unciteable. oracle-after kills
        0 of 10, every class. M10, seeded by HP-01 into this ticket's own blind
        spot, SURVIVES: prediction N05 confirmed, "visible without being
        killable". The corpus runner (unchanged by this ticket) kills the
        positive control M07 and the cross-aspect M08, and 0 of 3 guard
        relaxation and 0 of 2 durable content.

        THE COUNTERFACTUAL IS THE USEFUL PART. Bind the SAME action to an
        adapter whose only difference is that it has a run(case, work_dir), and
        M10 dies on 8 of 8 cases. The oracle's reach was never what limited
        detection; nine missing methods are. Filed as HP-04-DF-01 with the
        measurement attached, because a survivor on its own reads as "HP-04 did
        not help".

        A SEVEN-OF-NINE CORRECTION, found by running rather than by reading.
        RC-02 reported 9 DEAD PORTS for this model. Only `cli_download` and
        `cli_artifact_delete` are proven dead; the other 7 are UNEXERCISED --
        every action declaring them was skipped. A manifest edit made on the
        strength of that column would have removed live surface.

        AND ONE MORE BLIND SPOT, found the same way. `EffectSandbox` never
        patched `Path.open`, so `path.open("a")` -- the idiomatic durable append
        -- crossed the boundary unobserved while `open(path, "a")` was
        recorded. It surfaced because the oracle "killed" the ORDERING NEGATIVE
        CONTROL: M09 swaps that append for a `Path.write_text`, so the oracle
        detected a change of API rather than of behavior. Patched; M09 now
        survives, as its own prediction says it should. Observed-effect counts
        rise (67 -> 84) because the oracle now sees writes it used to miss.

        MODEL DELTA, DECLARED RATHER THAN SLIPPED IN, against a
        `model_delta_expectation` of "none expected". `spec_tree_delete` is
        attached to `RunEffectConformance` because resetting the per-case work
        directory is a real `filesystem.delete` under `**/specs/**`, and this
        manifest's own rule says an undeclared effect on a modeled action path
        is a gap. Surface cost per surface_cost_rule: ZERO -- no new port (it is
        already declared and already exercised by CloseTicket,
        CloseTicketWeakened and GenerateCases), no new action, no new variable,
        and no change to the TLA state space; TLC enumerates 118,573 distinct
        states before and after. What it buys is assertion 3.

        FOUR FINDINGS FILED, NONE FIXED: HP-04-DF-01 (the nine missing run()
        implementations, with the counterfactual), HP-04-DF-02 (one boundary,
        two incompatible `effects:` schemas -- the reason the M10 instrument
        needed a manifest of its own), HP-04-DF-03 (a generated corpus recovers
        NO arguments for a refusal -- HP-03's territory, replicated on a second
        model), HP-04-DF-04 (`open ticket` snapshots the oracle's scratch tree
        into the ticket and `close ticket` would promote it into the model;
        measured at 706 of 801 tracked files on this ticket's own first
        workspace).

        MEASURED AND UNFLATTERING, recorded here rather than only in the
        fixture: the first version of this ticket's own kill-table harness
        reported 10 of 10 KILLED on every class, including the negative
        control. It was comparing reports that carried differently-named temp
        directories. The flattering number was the bug.
    model_delta_expectation: >-
      STATED, not "none". These are defects in the harness, and the harness fix
      made one previously-absent effect real: the oracle now DELETES its
      per-case work directory before each case, under `**/specs/**`. That owes a
      port by the manifest's own rule, so `spec_tree_delete` is attached to
      `RunEffectConformance` in all three trees with the `@port` mirror. Per
      surface_cost_rule: zero new ports, actions or variables, and no change to
      the state space (effects.actions is a declaration table; TLC enumerates
      118,573 distinct states before and after). What it buys is the ticket's
      own assertion 3 -- a gap count two runs can agree on.

  - id: HP-05
