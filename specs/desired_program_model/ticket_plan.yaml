  - id: AC-02
    title: "Reflexion check: measure the production code against the model's architecture"
    status: done
    github_issue: "https://github.com/haydenrear/tla-spec-dev/issues/122"
    schedule_revision: 1
    depends_on: [AC-01]
    blocks: [AC-04]
    wave: 2
