        writes and the append to case_adapters.toml are all writes under a
        `specs/` tree, which the existing `spec_tree` port already declares.

        NO NEW GATE. An unbound port runs, a silent provider runs, a port with
        no `content:` block runs, and codegen never fails because a mapping is
        weak. The audit is a print, not an exit code. The only thing that raises
        is the content assertion itself, which is the oracle firing on a failing
        case.

        PREDICTIONS-HP.md was not touched. Reconciled onto epic tip ea45ecf
        (HP-04 merged at 09b0ced); HP-05's plan entry was re-checked field by
        field against the amended plan -- goals, contributions, expected
        effects, local signals, conflict keys, wave, promotion order and
