      workflow: []
    objective: >-
      MF-026 round 3 returned `fail` with three gaps and ZERO escalations, and
      two of the three are in surface RC-01 itself created -- one of them the
      same class RC-01 was closing. The gate is converging (12 -> 9 -> 3 gaps,
      7 -> 4 -> 0 escalations) and this ticket is meant to close it.

      N-1 [major] -- G-9 IS ONLY HALF CLOSED. `cli_download`,
      `cli_artifact_delete` and `cli_selftest_process` are declared in the ports
      block of all three trees and referenced by NO `effects.actions` row;
      `BuildSkillCli: [cli_artifact]` and `InstallLocalCli: [cli_artifact]` are
      unchanged. Three rules break at once: the manifest's own "a declared port
      no case exercises is DEAD MODEL SURFACE"; the `@port` mirror rule at
      TlaSpecDevCli.tla:214-222, violated in the OPPOSITE direction from round-2
      G-1; and decisively, `effect_conformance.py:511-518` binds ports through
      `effects.actions`, so G-9's curl download, mv unlink and wrapper self-test
      spawn are STILL undeclared for the actions that perform them. RC-01 wrote
      the ports, wrote correct comments naming which action path each belongs
      to, and never attached them. Attach them.

      N-2 [major] -- `generate cases` SHIPS THE EXACT CLASS RC-01 FIXED for the
      three analyze commands in the same commit. `--out` is `required=True` with
      no location constraint; writes at :96, :669, :882-883, and a DESTRUCTIVE
      `shutil.rmtree` at :140 against a metadir path, all running against ports
      that target `**/specs/**`. `resolve_evidence_out` already exists in
      spec_paths.py and is simply not applied here. Apply it, and constrain or
      declare the rmtree.

      N-3 [minor] -- the docstring RC-01 wrote at
      generate_cases_from_tlc_dump.py:1145 cites :115/:139/:881-882; the actual
      lines are :116/:140/:882-883. Stale in the very commit that wrote it, and
      the THIRD CONSECUTIVE TICKET to ship a stale line citation. Fix it and add
      whatever check makes the fourth one impossible -- that recurrence is the
      finding, not the three digits.

      AND THE HIGHEST-VALUE ACTION IN THE ROUND, which is not a gap: RUN
      `effect-conformance` ONCE. Before RC-01 the shipped CLI had no path to a
      corpus at all; `generate cases` now provides one, which converts that
      oracle's unreachability from STRUCTURAL to OPERATIONAL. It has never been
      executed against this model -- `generation_status: planned`, no
      `specs/*/generated/` exists -- so every `declared` verdict in every audit
      has been unchecked. `effect_conformance.py:977` emits DEAD MODEL SURFACE
      for precisely the N-1 defect, so ONE RUN of the now-reachable oracle would
      have caught the gap its own unreachability allowed. Generate a corpus, run
      the oracle, record what it says, and move `generation_status` off
      `planned` if the run supports it.

      NOT A GAP AND DO NOT "FIX" IT: `cli_artifact`, `cli_download` and
      `cli_artifact_delete` target `*`, so two modeled actions may write
      anywhere. The auditor recorded the reasoning rather than filing it -- the
      schema has no env-var interpolation, and `*` is HONEST where
