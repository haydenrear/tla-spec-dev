epic_goals:
  - id: GOAL-scope-loss-catchable
    kind: eval
    statement: >-
      Scope-loss in a claim is catchable by machine rather than by remembering, and the historical record is swept with the check.
    metric: >-
      THE COUNT OF EXISTING CLAIMS THE NEW CHECKS REFUTE when swept over charters, plans, issues and the ledger. Reported with each refuted claim named, never as a bare total.
    harness: RD-01's checks run over the historical record by RD-03 on the integrated tip
    baseline:
      value: >-
        ZERO. Nothing has ever refused an unscoped claim. Three are known: 'D2 = 2 on 27 of 27' (true of one example, justified an epic), 'D3 is the one dimension that discriminates and holds still' (one example, spread 2 and split by tier on a second), and contested itself, a scoring rule with no implementation whose flag reads [] on every card ever written.
      measured_at: 946b1ee
      evidence: specs/results/scorecards/subtract-to-measure/ -- SM-05
    target: >-
      NO TARGET ON THE COUNT -- setting one before anything has ever been swept would be inventing the answer, and a HIGH count is the informative outcome. What is targeted: every refuted claim is NAMED, and claims the check cannot reach are counted separately rather than omitted.
    evaluation_ticket: RD-03
    evidence_root: specs/results/scorecards/reading-discipline/GOAL-scope-loss-catchable
  - id: GOAL-tags-earn-their-place
    kind: eval
    statement: >-
      Architecture tags make the card more comparable WITHOUT making it more excusable -- and every tag value in the vocabulary has demonstrated that it changes a score.
    metric: >-
      Count of tag values that survive the earn-its-place test (two artifacts differing only in that value score differently on some dimension) over the count proposed; plus the count of INCOMPARABLE pairs REPORTED rather than dropped.
    harness: RD-04's design tested by RD-05's implementation, swept by RD-03
    baseline:
      value: >-
        NO TAGS EXIST. Comparability is two axes -- same example, unchanged instrument -- and architecture is implicit. D2 = 2 on greenfield against 3/4 on a real before/after, and D3 contested 2/2/3/4 with judges disagreeing about WHAT THE ARTIFACT IS, one refusing a D3 = 4 its own execution supported because the port lives in a fixture.
      measured_at: 946b1ee
      evidence: specs/results/scorecards/subtract-to-measure/ -- SM-05, and the D3 cards
    target: >-
      Every tag value in the shipped vocabulary has a demonstration that it changes a score, or is DELETED. A value that survives on argument rather than demonstration is a failure of this goal even if the taxonomy looks right.
    evaluation_ticket: RD-03
    evidence_root: specs/results/scorecards/reading-discipline/GOAL-tags-earn-their-place
  - id: GOAL-apparatus-priced
    kind: quality
    statement: >-
      What the safety apparatus costs is measured, and whether it earns that cost is decided on evidence.
    metric: >-
      Per removal: lines removed, lines added to prove it safe, and the ratio. Reported per removal, never as a total.
    harness: RD-02's census over the predecessor's removals, re-run by RD-03
    baseline:
      value: >-
        UNMEASURED, and the predecessor called itself a simplification while coming out NET +1677 code_lines. Every removal shipped new instruments, tests and demonstrations to prove it safe and nobody counted that as a cost. Two SURVIVES->DIES and zero DIES->SURVIVES across everything cut in two epics may be a fact about the removals rather than about the mutants.
      measured_at: 946b1ee
      evidence: specs/results/scorecards/subtract-to-measure/ -- SM-05
    target: >-
      The cost is reported per removal with its ratio, and the round says whether the apparatus earns it. BOTH ANSWERS ARE ACCEPTABLE; not deciding is not.
    evaluation_ticket: RD-03
    evidence_root: specs/results/scorecards/reading-discipline/GOAL-apparatus-priced
  - id: GOAL-product-round
    kind: eval
    statement: >-
      The instruments this epic family built are USED ON THE PRODUCT, and the three original questions get a current answer with a card that now demonstrably measures.
    metric: >-
      The three original goals re-decided on current evidence, each baseline -> measured -> verdict: do model-derived cases catch bugs hand-written tests miss; does the prompt produce simpler code at equal behaviour (D2 ANCHOR 3 IS NOW REACHABLE AND NEVER WAS BEFORE); and does the effectful vs ports-and-adapters choice change what validation can see, now that the choice is taggable.
    harness: >-
      the RD-05 tag, the working card, and the seeded catalogue, run over produced code rather than over the toolchain
    baseline:
      value: >-
        NOT MEASURED SINCE ports-as-adapters. What stands: the prompt is the ONE lever with a replicated, confounder-controlled effect -- D3 1 -> 4, with arm C longer and scoring 1/1. No generated instrument has a unique kill; suite-fake strictly dominates on author-written catalogues, is COMPLEMENTARY on one blind catalogue and DOMINATED on another, so that comparison turns on a model constant. D2 = 2 on every greenfield card because anchor 3 was structurally unreachable for a subject with no before.
      measured_at: 946b1ee
      evidence: specs/results/scorecards/ -- HP-06, EVAL-RERUN, PA-06, SM-05
    target: >-
      Each of the three gets a verdict with a reason. NO TARGET ON ANY NUMBER -- the point is that they are answered with working instruments rather than left open for a fourth epic. A result showing a lever does NOT work is the preferred outcome and closes the question either way.
    evaluation_ticket: RD-03
    evidence_root: specs/results/scorecards/reading-discipline/GOAL-product-round
