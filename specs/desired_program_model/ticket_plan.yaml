  id: stabilize-substrate
  branch: epic/stabilize-substrate
  default_branch: main
  base_sha: 436c78c55c60c3ee45901223176124df5e38b6ff
  base_note: >-
    Branched from main at 436c78c, the merge of epic/cut-the-apparatus. RE-DERIVED ON THIS BRANCH, not carried from the work order. Card served 6,281 bytes / sha256:2d7d4a0506d9b259 / card version 5 / rubric file sha256:b7fe75437bf68646. Apparatus 41,971 Python lines (scripts 27,056 + examples/validation 14,915) -- ISSUE #271 SAYS 41,691 AND THAT FIGURE IS AT ea624b9; the +280 is the four post-close commits. Collection 1491. Judged-goal compliance 0 of 20 (31 distinct goals, 20 judged, 95 sealed cards) -- ISSUE #271 SAYS 0 OF 18 AND THAT IS THE PRE-cut-the-apparatus DENOMINATOR. scope reads 0 counted figures on CUT-THE-APPARATUS-EPIC.md and 3, all REFUTED, on NEXT-EPIC.md. Ledger 296 rows: 134 carried, 129 open, 16 repaired, 9 settled, 3 consumed, 3 wontfix, 2 refuted.
