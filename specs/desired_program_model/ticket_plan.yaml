# This file is part of the desired program model.
# It is the CANONICAL plan for epic/self-improvement-substrate. GitHub issues
# mirror it for handoff; they do not replace it.
version: 1
name: self-improvement-substrate
updated: "2026-09-17"
schedule_revision: 4
purpose: "Make tla-spec-dev one plugin and one loop: the substrate improves because of what agents ran into while using it, and the epic agent is the one writer of the model, the matrix, the scorecard row and the plugin."

planning_rules:
  # ADDED AT REVISION 4, 2026-09-19, AND IT CHANGES THE ENDGAME.
  # The epic branch does NOT merge into tla-spec-dev's default branch. That
  # repository must keep shipping the spec-double-compiler SKILL, because
  # everyone who has it installed syncs from there; landing a PLUGIN layout on
  # its main would break those syncs. The epic's result reaches users through
  # tla-spec-dev-plugin instead, by cutover once the epic closes.
  #
  # This also retires a practice the epic agent started in wave 3 and repeated
  # at every wave close WITHOUT stating what it implied: pushing the epic tip to
  # tla-spec-dev-plugin's main. That made the install source track unmerged
  # mid-epic work -- 354 commits ahead of tla-spec-dev's main at the wave-6
  # gate. It stops here. The plugin repo's main receives the epic's result at
  # cutover, not its work in progress.
  no_default_branch_merge: >-
    The epic branch never merges to tla-spec-dev's default branch, and the epic
    tip is never pushed to tla-spec-dev-plugin's main mid-epic. tla-spec-dev
    keeps shipping the skill; the plugin is delivered by cutover at epic close.
    `finalize` for this epic means the cutover, not a default-branch merge.
  # ADDED AT REVISION 3, 2026-09-18. SI-13 and SI-15 land work in the
  # skill-manager repository (git@github.com:haydenrear/skill-manager.git),
  # which is a separate checkout and a separate pull request. Every piece of
  # this epic's wave-close machinery -- conflict_keys, the review artifact, the
  # cumulative backlog, the promotion order -- is scoped to THIS repository and
  # does not see that one. The gap was found while drafting those two tickets,
  # not at their wave, which is the only reason it is written here rather than
  # discovered at wave 7.
  cross_repo_rule: >-
    A ticket whose scope reaches skill-manager opens a SECOND pull request in
    that repository and names it in its own PR body: the repo, the branch, the
    PR number, and what changed there. The epic agent records both PRs in the
    wave review artifact and merges them in the promotion order the plan
    declares. conflict_keys govern this repository only; two tickets touching
    the same file in skill-manager is a collision the plan cannot see, so no two
    tickets in the same wave may carry skill-manager scope. SI-13 (wave 7) and
    SI-15 (wave 9) are deliberately in different waves for this reason.
  current_model_rule: Update specs/current after each production slice lands as a whole-program working copy of specs/program_model, not a ticket projection.
  unit_validation_rule: Run current-model TLC and adapter/unit tests before adding graph execution.
  graph_rule: Add graph or integration nodes only after current-model validation passes.
  semantic_model_rule: Do not add test graph nodes, pytest jobs, CI workflow steps, integration harnesses, or validation scripts as TLA+ program state/actions.
  evidence_rule: Record tests and graph runs as evidence for semantic program actions in manifests or ticket status.
  desired_sync_rule: Update this file and spec_manifest.yaml whenever scope, order, acceptance checks, or status changes.
  promotion_rule: When specs/current equals specs/desired_program_model, promote the converged model to specs/program_model.
  # Owner decision at kickoff, 2026-09-17. It overrides git-epic-workflow
  # SKILL.md rule 5 and epic-ticket.md §3 for this epic and every epic after it;
  # SI-07 writes it into the skill.
  model_ownership_rule: >-
    The EPIC AGENT owns the TLA+ work. It scaffolds each ticket's desired and
    current state before dispatch, manages validation, places the attribution
    anchors, and closes and promotes the spec ticket at wave merge. A ticket
    agent moves current toward desired, runs the spec tests, and may make SMALL
    edits to desired; a structural change to desired comes back to the epic
    agent rather than being made in the ticket. Ticket agents never run
    `close ticket`, `close_tickets.py`, or `--accept-new`.

status:
  workflow: self-improvement-substrate
  active_ticket: SI-01
  active_ticket_title: "Migrate the skill surface into a plugin: tla-spec-dev / skills/spec-double-2"
  desired_module: TlaSpecDevCli
  phase: planning
  epic_branch: epic/self-improvement-substrate
  epic_issue: "https://github.com/haydenrear/tla-spec-dev/issues/333"

service_catalog:
  existing_boundaries:
    - "spec-double-compiler skill surface at the repository root"
    - "five workflow skills, each its own repository, installed separately in three home tiers"
    - "tla-spec-dev CLI (scripts/tla_spec_dev.py), modelled by specs/program_model/TlaSpecDevCli.tla"
  desired_boundaries:
    - "one skill-manager plugin `tla-spec-dev` whose skills/ holds spec-double-2 and the five nested workflow skills"
    - "one improvement record: a finding carries an anchor, a skill-change disposition, and the goal it moved"
    - "one writer: the epic agent applies model deltas, anchors, card rows and proposed skill changes at wave close"
  adapter_boundaries:
    - "specs/program_model/production_adapters.py — import roots move when the surface moves"
  known_gaps:
    - "13 skill-feedback findings are `recorded-local` and never left the file"
    - "39 deferred rows carry no skill-change field"
    - "no instrument scores whether the process improved the substrate"

deferment_policy:
  mode: batch
  blocking: escalate
  budget: 5
  # CUMULATIVE ledger carrying every prior epic's findings: 33 rows at kickoff.
  # Append this epic's findings; never truncate, re-template or reorder it —
  # sealed close-history records point into it by ID.
  backlog: "specs/results/deferred_findings_final.yaml"

# Owner decision 2026-09-17, after the kickoff review: gate three boundaries
# rather than six -- after the migration (2), after the epic-agent rules land
# (4), and at evaluation (6). Waves 1, 3 and 5 still produce a committed review
# artifact; they just do not stop for an answer. Not a schedule_revision change:
# revision covers IDs, edges, waves, promotion order, conflict ownership and
# validation scope, and a policy change is none of those.
review_policy:
  cadence: milestone
  gate: true
  merges: owner
  milestones: [2, 4, 6]
  artifact_root: "specs/results/epic-self-improvement-substrate/review"
  walkthrough: required

# Baselines were measured on b7a7d203, the epic branch's base, before any ticket
# landed. Evidence: specs/results/epic-self-improvement-substrate/baseline/kickoff.md
epic_goals:
  - id: GOAL-one-unit
    kind: integration
    statement: "The substrate installs, syncs and improves as one plugin rather than seven separately versioned units."
    metric: "installed units belonging to this substrate, in the root home and the project home; the three test graphs and both eval cases green on the plugin layout"
    # AMENDED at the wave-2 review, 2026-09-17. The original harness named
    # `plugin-repository/scripts/verify.sh` as the local signal. SI-02 measured
    # that it CANNOT go green and the cause is structural, not a bug in this
    # work: it greps from `.` so it reads the gitignored home and sealed eval
    # transcripts (SI-02-DF-01), and after migration it will not start at all
    # because git-integration-repo's integration-lib.sh resolves
    # git-issue-workflow/lib.sh at the standalone path with no plugin rung
    # (SI-02-DF-05). Both of those skills are OUTSIDE the bundle by owner
    # decision, so this epic cannot fix them. An instrument that cannot run is
    # not an instrument; it is replaced here rather than left to fail at SI-08.
    harness: "skt status in the root and project homes; skill-manager list showing the plugin with no outstanding errors and a git source; test_graph graphs specWorkflow, cliWorkflow, effectProviderExamples; the plugin's own eval cases (SI-10)"
    baseline:
      value: "6 units across 6 repositories (spec-double-compiler + the five workflow skills), each installed in root, project and every worktree home"
      measured_at: "b7a7d203"
      evidence: "specs/results/epic-self-improvement-substrate/baseline/kickoff.md"
    # Clause 3 is NEW, added at the wave-2 review because the migration itself
    # falsified an assumption in clause 1. After SI-02 the project home holds
    # plugin:tla-spec-dev, but installed from a local path: `skill-manager list`
    # reports SOURCE unknown/local_file and NEEDS_GIT_MIGRATION, "file/local
    # installs do not sync". The change-managed count fell 19 -> 16 because the
    # plugin stopped being counted. The goal says the substrate "installs, syncs
    # and improves as one plugin"; one unit that cannot sync satisfies the count
    # and not the sentence, so the clause is now explicit and reported
    # separately.
    # WAVE-4 GATE, 2026-09-18. Clause 1 was measured UNSATISFIABLE and is
    # deliberately NOT reworded. git-integration-repo and plugin-repository --
    # both left outside the bundle at kickoff -- import test-graph,
    # spec-double-compiler and git-issue-workflow, so any home carrying them
    # re-materialises standalone copies of contained skills. That happened in
    # the project home on 2026-09-18 (three units, installSource GIT, one
    # installedAt, minutes after the plugin install). The owner's decision was
    # to move those two INTO the bundle (SI-12, #359) rather than amend the
    # sentence to excuse copies that exist only as non-member dependencies.
    # Changing the words would have made the clause true by making it say less.
    target: "three clauses, reported one verdict each: (1) one installed unit for this substrate and zero standalone copies of the five migrated skills in root or project home; (2) every listed graph and eval case green on the new layout; (3) that unit is change-managed -- a git source, no NEEDS_GIT_MIGRATION, and `skt sync` able to update it"
    evaluation_ticket: "SI-08"
    evidence_root: "specs/results/epic-self-improvement-substrate/goals/GOAL-one-unit"

  - id: GOAL-findings-become-changes
    kind: eval
    statement: "A finding that names a skill ends as an applied change, or a declined one with a reason on the record — never as `recorded-local`."
    metric: "findings by disposition across skill_feedback.md, both deferred backlogs, and the matrix"
    harness: "python3 scripts/improvement_ledger.py (built by SI-04); advisory, exit 0 always"
    baseline:
      value: "37 skill-feedback blocks: 13 recorded-local, 4 wontfix; 33 + 6 deferred rows with no skill-change field at all"
      measured_at: "b7a7d203"
      evidence: "specs/results/epic-self-improvement-substrate/baseline/kickoff.md"
    target: "every finding carries a skill_change disposition — applied, declined with a recorded reason, or not-a-skill; 0 recorded-local at epic close"
    evaluation_ticket: "SI-08"
    evidence_root: "specs/results/epic-self-improvement-substrate/goals/GOAL-findings-become-changes"

  - id: GOAL-blockers-propose
    kind: eval
    statement: "An agent that hits a blocker in the substrate proposes the change, in the PR or in its response."
    metric: "the improvement card, scored by two blind judges over the wide-lane refusal cases and this epic's own ticket PRs"
    harness: "judged procedure: the improvement card (SI-03), two blind judges per subject, dispatched per references/blind_dispatch.md, evidence under the goal evidence_root"
    baseline:
      value: "no such instrument exists"
      measured_at: "b7a7d203"
      evidence: "specs/results/epic-self-improvement-substrate/baseline/kickoff.md"
    target: "NO TARGET ON THE NUMBER — the goal is decided by whether the card runs, discriminates between a PR that proposes and one that does not, and the two judges agree within 1"
    evaluation_ticket: "SI-08"
    evidence_root: "specs/results/epic-self-improvement-substrate/goals/GOAL-blockers-propose"

  - id: GOAL-epic-owns-the-model
    kind: quality
    statement: "At every wave close the epic agent has applied the wave's model delta, placed every anchor, written the card row, and applied or declined every proposed skill change — and ticket PRs no longer carry model edits."
    metric: "the four required blocks present in each wave review artifact; files under specs/ touched by ticket PRs other than results/"
    harness: "scripts/validate_epic_plan.py --verbose (warns, never errors, on a missing block); git diff --name-only over each ticket PR filtered to specs/"
    baseline:
      value: "the artifact schema has no such blocks — human-review.md §3.4 is prose; ticket agents open and close their own spec tickets today"
      measured_at: "b7a7d203"
      evidence: "specs/results/epic-self-improvement-substrate/baseline/kickoff.md"
    target: "four blocks in every wave artifact from wave 4 on (wave 1–3 artifacts are the baseline shape), and no ticket PR after SI-07 changes a file under specs/ except under results/"
    evaluation_ticket: "SI-23"
    evidence_root: "specs/results/epic-self-improvement-substrate/goals/GOAL-epic-owns-the-model"

  - id: GOAL-no-new-gates
    kind: quality
    statement: "Nothing this epic adds refuses. Every new check warns, prints one line, and exits 0."
    metric: "new refusal paths in the epic diff; the force/override cases in the skill-manager wide lane"
    harness: "grep -rnE 'SystemExit|sys.exit\\([^0]|refuse' over the epic's new code; wide lane w-epic-*-force-*, w-sdc-forced-close-*, w-giw-wt-new-dirty-ok"
    baseline:
      value: "the drop-gates work of 2026-09-14: --force / SKILL_GATES=off everywhere, and the predecessor measured that a gate here reads to an agent as a stop"
      measured_at: "b7a7d203"
      evidence: "specs/results/epic-self-improvement-substrate/baseline/kickoff.md"
    target: "zero new refusal paths; every new check has a one-line warning form; the force cases stay green"
    evaluation_ticket: "SI-23"
    evidence_root: "specs/results/epic-self-improvement-substrate/goals/GOAL-no-new-gates"

  - id: GOAL-progressive-disclosure
    kind: quality
    statement: "The plugin discloses progressively: little loads at session start, a card is short, and the rest is reached through a reference map when the task needs it."
    metric: "words of skill description (loaded every session) and words of card body (loaded when the skill is used), per skill and in total"
    harness: "the word-count script recorded in the baseline evidence, re-run over skills/*/SKILL.md; plus the wide lane's budget graders (Bash <= 4) to show the cut did not cost turns"
    baseline:
      value: "descriptions 923 words over the six units that become the plugin; card bodies 15,479 words total, ranging 933 (discovery) to 4,114 (git-epic-workflow)"
      measured_at: "b7a7d203"
      evidence: "specs/results/epic-self-improvement-substrate/baseline/kickoff.md"
    # WAVE-4 GATE, 2026-09-18. The baseline MOVED AGAINST the goal and the
    # target is deliberately unchanged. Card bodies went 15,598 -> 16,840
    # (+1,242) because SI-06 and SI-07 added exactly what their tickets
    # required: git-epic-workflow +521 (the five-block schema and rule 10),
    # git-issue-workflow +325, discovery +163, test-graph +136, git-issue +97.
    # Descriptions held at 923. The increase is rationalised, not excused --
    # every added word is a rule an agent is expected to follow, which is why
    # SI-09's job is to move them behind the reference map rather than delete
    # them. SI-09 now has 1,242 more words to cut than its issue assumed, and
    # SI-12 adds two more cards to the set.
    target: "descriptions <= 600 words in total; every card body <= 1,500 words with the remainder behind the reference map; no wide-lane budget case regresses"
    evaluation_ticket: "SI-23"
    evidence_root: "specs/results/epic-self-improvement-substrate/goals/GOAL-progressive-disclosure"

  - id: GOAL-evals-one-command
    kind: integration
    statement: "Every eval this development loop runs lives in one place -- the plugin's evals/ -- and runs in one command, without a shim plugin, a units-override file, or a second harness in another repository."
    metric: "eval cases runnable in one command from the plugin, and how many of the loop's surfaces have at least one"
    harness: "claude plugin eval <plugin dir> over the plugin's own evals/, each case reported green, red, or UNDECIDED"
    baseline:
      value: "2 cases, reachable only through examples/agent_integration/eval-plugin (a symlink shim built because plugin eval refuses a directory over 20,000 entries and specs/ alone is 20,493); the wide lane needs units-override.txt"
      measured_at: "b7a7d203"
      evidence: "specs/results/epic-self-improvement-substrate/baseline/kickoff.md"
    # OWNER SCOPE WIDENED, 2026-09-18, before wave 5. The goal used to stop at
    # "any skill in the plugin". It now covers the whole loop, because the
    # loop's evals are currently split across two repositories and two
    # harnesses that do not share a runner:
    #
    #   this plugin      7 cases under evals/, run by evals/run.sh, which
    #                    stages a 6,264-entry view because `claude plugin eval`
    #                    refuses a directory over 20,000 entries.
    #   skill-manager    63 cases under specs/evals/harness/evals/, run by
    #                    eval_run_case() in a 43,330-byte lib.sh, against a
    #                    branched home built per case.
    #
    # 70 cases, two runners, two environments, one loop. `claude plugin eval`
    # runs on a PLUGIN; skill-manager is not one (it has no .claude-plugin/),
    # and tla-spec-dev is. So the cases move to the plugin rather than the
    # plugin growing a second harness to meet them. SI-15 performs the move.
    #
    # MEASURED WHILE WIDENING, and it is a defect not a detail: skill-manager's
    # specs/evals/README.md documents `./build-env.sh "$SKILL_MANAGER_HOME"`
    # and `./run.sh 'epic-*'` as THE way to run that lane. Neither file exists
    # in specs/evals/harness/. The documented one-command entry is already
    # fiction on that side, which is part of why this goal is worth widening.
    baseline_widened:
      value: "70 cases across two repositories and two runners: 7 in this plugin's evals/ (staged-view runner), 63 in skill-manager's specs/evals/harness/evals/ (branched-home runner). Neither of skill-manager's two documented entry points, build-env.sh and run.sh, exists."
      measured_at: "45a42b54"
      evidence: "specs/results/epic-self-improvement-substrate/goals/GOAL-evals-one-command"
    target: "all of the loop's cases under the plugin's evals/, runnable in one command; at least one case per nested skill; every case green or explicitly UNDECIDED with a reason; no units-override file and no second harness"
    evaluation_ticket: "SI-23"
    evidence_root: "specs/results/epic-self-improvement-substrate/goals/GOAL-evals-one-command"

  - id: GOAL-pinned-eval-toolchain
    kind: integration
    statement: "An eval run declares the toolchain it ran against. The skt version is pinned and recorded per run, and a full-suite run asks which version to use rather than silently taking whatever the operator's home happens to hold."
    metric: "eval runs whose recorded evidence names the exact skt ref they ran against, over eval runs performed"
    harness: "the suite's own run record, plus a read of the case scaffold: the pinned ref must appear in the repository, not only in a run log"
    baseline:
      value: "0 of the loop's runs record a toolchain version. skt resolves from the operator's live home at gitRef 'main' (gitHash 286a3694a815c6f6a9e76bffcb03a1fd8100cce3, installed 2026-09-14), and 'main' is a moving target; nothing in either harness pins it, asks for it, or writes it next to a score."
      measured_at: "45a42b54"
      evidence: "specs/results/epic-self-improvement-substrate/goals/GOAL-pinned-eval-toolchain"
    # THE HARD CONSTRAINT, measured before this goal was written, so that the
    # ticket is not asked to discover it: `claude plugin eval` HAS NO VERSION
    # PINNING FOR PLUGIN DEPENDENCIES. Its `plugins:` field takes relative
    # filesystem paths only -- no git ref, no marketplace constraint, no
    # lockfile, and no manifest-level "this plugin depends on that one".
    #
    # So the pin cannot be DECLARED; it has to be MATERIALISED. The shape that
    # works is: a scaffold step clones skt at a recorded ref into a fixture
    # directory, and the case points `plugins:` at that path. The ref lives in
    # the repository under change control, which is what makes a run
    # reproducible and a score comparable across weeks.
    #
    # The "asks which version" clause is therefore a RUNNER obligation, not a
    # schema one: there is no field for the CLI to prompt about.
    target: "every full-suite run records the skt ref it used; the ref is pinned in the repository rather than resolved from the operator's home; the runner asks which version before a full run and refuses to guess silently"
    evaluation_ticket: "SI-08"
    evidence_root: "specs/results/epic-self-improvement-substrate/goals/GOAL-pinned-eval-toolchain"

  - id: GOAL-one-plugin
    kind: integration
    statement: "The substrate is ONE installed plugin. skt ships inside it, wt ships inside skt, and the only thing installed separately is the skill-manager CLI, which comes from Homebrew."
    metric: "units a fresh machine installs to get the whole substrate, and whether the front door resolves with skt contained"
    harness: "a fresh home: brew install the CLI, install the plugin, then run the front door (`skt ticket new`) and `skill-manager list`"
    baseline:
      value: "2 installed units plus a brew formula: the tla-spec-dev plugin AND the skt plugin, separately versioned and separately synced; wt lives in git-issue-workflow/scripts/wt inside the bundle while the tool that calls it sits outside"
      measured_at: "73867de9"
      evidence: "specs/results/epic-self-improvement-substrate/goals/GOAL-one-plugin"
    # THE BOOTSTRAP CYCLE WAS CHECKED BEFORE THIS GOAL WAS WRITTEN, because
    # "skt installs plugins, so skt cannot live inside a plugin" is the obvious
    # objection and it turns out to be false:
    #   * `brew install haydenrear/skill-manager/skill-manager` is ALREADY the
    #     supported install path; skill-manager 0.28.1 is running from
    #     /opt/homebrew/Cellar. The JVM CLI that installs plugins is not skt.
    #   * `<home>/bin/cli/skt` is a GENERATED WRAPPER, not the tool. It resolves
    #     `plugins/skt/src/skt/cli.py` relative to the home it lives in, with no
    #     absolute path baked in. Contained skt needs ONE more rung there --
    #     the same two-rung change SI-12 made twice.
    # So the chain is: brew -> skill-manager CLI -> installs the plugin ->
    # provides skt, wt and every skill. No cycle.
    target: "one installed plugin provides the substrate; the front door resolves with skt contained; no standalone skt unit in root or project home; the CLI comes from brew"
    evaluation_ticket: "SI-23"
    evidence_root: "specs/results/epic-self-improvement-substrate/goals/GOAL-one-plugin"

  - id: GOAL-evals-earned
    kind: quality
    statement: "No eval is written for behaviour nobody has watched work. Each eval stage runs its test graphs and verifies the workflow scripts BY HAND first, and the eval encodes what was observed."
    metric: "eval stages whose manual-verification record precedes their first eval case, over eval stages shipped"
    harness: "each stage's own evidence directory: the graph run, the by-hand transcript of the scripts, and only then the case"
    baseline:
      value: "0 of the loop's eval stages have a manual-verification record; the 7 cases here and the 63 in skill-manager were written without one being required"
      measured_at: "73867de9"
      evidence: "specs/results/epic-self-improvement-substrate/goals/GOAL-evals-earned"
    # THIS GOAL EXISTS BECAUSE OF THIS EPIC'S OWN RECORD, not as a principle.
    # Four waves running, the recurring defect has been a check whose negative
    # result is indistinguishable from not having looked -- committed by ticket
    # agents AND by the epic agent, twice in one session at the wave-6 gate,
    # including a sweep that carried a non-vacuity assert and still scanned the
    # wrong population. An eval written for behaviour never observed by hand is
    # that defect with a budget attached. Manual first is the cheapest known
    # remedy: you cannot assert what a check should say until you have seen the
    # behaviour say it.
    target: "every eval stage ships a manual-verification record that predates its first case; no stage's cases are written before its graphs run"
    evaluation_ticket: "SI-23"
    evidence_root: "specs/results/epic-self-improvement-substrate/goals/GOAL-evals-earned"

