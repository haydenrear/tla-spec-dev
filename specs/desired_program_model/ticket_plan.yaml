epic:
  id: cut-the-apparatus
  branch: epic/cut-the-apparatus
  default_branch: main
  base_sha: 08d1d6a90ad2638cdfceee7cc2e150732daa3438
  base_note: >-
    Branched from main at 08d1d6a, the merge of epic/score-drives-validation. Card served 6,281 bytes / 9 rungs / sha256:2d7d4a0506d9b259. Apparatus 43,553 Python lines (scripts 27,652 + examples/validation 15,901, excluding __pycache__). Tests 32,162 lines.
  schedule_revision: 1
  review_mode: epic-owner-post-merge
  notes: >-
    NEVER merge to main and NEVER run skill-manager sync without explicit owner say-so. Never invoke tla-spec-dev from PATH. THE PLAN MUST LOAD WITH BOTH LOADERS. Never kill a process by name alone, and check whether a process is yours before touching it. THE EPIC'S AUTHORITATIVE SKILL MANAGER HOME IS THE PER-WORKTREE HOME; 11 change-managed units are stale against their sources and are DELIBERATELY NOT SYNCED for the duration.
deferment_policy:
  mode: batch
  blocking: escalate
  budget: 5
  backlog: specs/desired_program_model/deferred_findings.yaml
epic_goals:
  - id: GOAL-apparatus-cut
    kind: quality
    statement: >-
      The apparatus surrounding a 6,281-byte card gets materially smaller, every deletion is justified by a finding already on the record, and every cut is priced.
    metric: >-
      Python lines under scripts/ and examples/validation/, reported SEPARATELY per surface and never combined with the card. Command: find scripts examples/validation -name '*.py' -not -path '*/__pycache__/*' | xargs wc -l | tail -1. The card is reported separately by score_tools.py serve | wc -c and serve --digest-only.
    harness: >-
      The line-count command above run on the integrated epic tip, plus a per-cut price table naming, for each deletion, the finding ID that justifies it and what the tree can no longer do. Decided by CA-08.
    baseline:
      value: >-
        43,553 Python lines -- scripts/ 27,652 and examples/validation/ 15,901, excluding __pycache__. Card 6,281 bytes, 9 rungs, sha256:2d7d4a0506d9b259, version 5. Tests 32,162 lines. NOTE THE DENOMINATOR: issue #254 quotes 42,446 at d038afd on a glob it did not state; this figure is THIS command at THIS tree and the two are not interchangeable.
      measured_at: 08d1d6a90ad2638cdfceee7cc2e150732daa3438
      evidence: specs/results/scorecards/cut-the-apparatus/GOAL-apparatus-cut/baseline.md
    target: >-
      MULTI-CLAUSE, EACH DECIDED SEPARATELY. (a) scripts/ + examples/validation/ Python lines fall to 30,487 or below -- a cut of at least 30% from 43,553. (b) EVERY deletion in the epic names the finding ID that justifies it; a cut with no finding behind it is a failure of this clause even if the lines fell. (c) The card does not grow: serve | wc -c is 6,281 or less at the tip. (d) The surfaces are reported SEPARATELY and the tree is named in every figure.
    evaluation_ticket: CA-08
    evidence_root: specs/results/scorecards/cut-the-apparatus/GOAL-apparatus-cut
  - id: GOAL-consumption-obligatory
    kind: quality
    statement: >-
      A filed finding must receive an explicit disposition before an epic can close, and the register that counts consumption is actually kept -- or the programme is honestly renamed.
    metric: >-
      Harvest classes CONSUMED INTO PROGRAM VALIDATION over the true denominator; the presence of a disposition requirement demonstrated with a REFUSAL on a real input; and the presence of the channel and cost fields six and three epics have asked for.
    harness: >-
      The disposition mechanism run against THIS epic's own filed findings, including at least one demonstrated refusal on a real input (R1); plus a recount of the harvest register with the numerator/denominator movement named. Decided by CA-08.
    baseline:
      value: >-
        1 OF 38 (2.6%) consumed into program validation -- class A1, SV-04. 4 of 38 named by a ledger row, and THREE OF THOSE FOUR ARE THIS PROJECT CATCHING ITSELF COMMITTING THE CLASS rather than consuming it. HARVEST-CL-03.md carries 38 classes and was UNTOUCHED last epic; SV-01-DF-05 filed three new classes into the ledger and not into the harvest, so 38 STOPPED GROWING ON 2026-08-11 AND UNDERSTATES THE BACKLOG. The ledger has NO channel field, six epics after it was first asked for. NO cost block exists, three epics after CL-04 proposed it.
      measured_at: 08d1d6a90ad2638cdfceee7cc2e150732daa3438
      evidence: specs/results/scorecards/close-the-loop/GOAL-loop-closes-once/CL-03/HARVEST-CL-03.md and specs/results/scorecards/SELF-IMPROVEMENT.md
    target: >-
      MULTI-CLAUSE, EACH DECIDED SEPARATELY. NO TARGET ON THE RATE ITSELF -- a threshold on a consumption number before the mechanism exists would be MF-020, and the mechanism is what is being built. (a) A disposition requirement exists, is exercised on this epic's own findings, and has a DEMONSTRATED REFUSAL on a real input rather than a fixture. (b) The register is repaired: the true denominator is stated, and the numerator/denominator movement is named per denominator_rule. (c) The channel field and the cost block exist and are populated by this epic's own tickets. (d) If any clause cannot be met, THE HONEST ALTERNATIVE IS ON THE TABLE AND MUST BE STATED: describe this as a measurement programme rather than a self-improvement loop. Both are respectable; silence is not.
    evaluation_ticket: CA-08
    evidence_root: specs/results/scorecards/cut-the-apparatus/GOAL-consumption-obligatory
  - id: GOAL-blind-dispatch
    kind: quality
    statement: >-
      A judged round can run without the operator's own conclusions in the judge's context -- or the fact that it cannot is stated as a finding about the whole programme.
    metric: >-
      What a dispatched agent ACTUALLY receives before it reads anything, MEASURED rather than assumed; and whether a fresh agent under the new dispatch path reports receiving any of the operator's conclusions.
    harness: >-
      A measured inventory of the pre-read context (auto-memory, environment block, CLAUDE.md, session hooks, anything else), plus fresh agents dispatched through the candidate path and ASKED WHAT THEY RECEIVED, unprompted-disclosure style. Decided by CA-08.
    baseline:
      value: >-
        NO ROUND THIS PROGRAMME HAS RUN WAS BLIND IN THE SENSE ITS OWN DISPATCHES ASSERT. 4 of 4 blind agents in SV-05's 2x2 disclosed UNPROMPTED that the operator's auto-memory and the environment block were in their context before they read anything; one quoted MEMORY.md verbatim -- 'up to 2 points per judge move on byte-identical artifacts' -- and named four prior epics. The environment block additionally hands every subagent this repository's path, branch, clean status and THE SUBJECT LINES OF ITS FIVE MOST RECENT COMMITS, several of which state epic outcomes in words. IT ARRIVES WITH NO TOOL CALL, so no forbidden-reading list in any dispatch can reach it. Applies retroactively to CL-04's adopter probe and census, SV-01's four judges, SV-04's four judges, SV-06's survey and SV-05's own four agents.
      measured_at: 08d1d6a90ad2638cdfceee7cc2e150732daa3438
      evidence: specs/results/scorecards/score-drives-validation/SV-05/RESULT.md -- SV-05-DF-02
    target: >-
      MULTI-CLAUSE, EACH DECIDED SEPARATELY. NO NUMERIC TARGET -- the instrument does not exist yet. (a) What a dispatched agent receives is MEASURED and written down, not assumed. (b) A dispatch path exists that demonstrably carries none of the operator's conclusions, PROVEN by fresh agents asked what they received rather than by inspecting configuration. (c) The cost is stated: if blindness cannot be achieved with this harness, THAT IS A FINDING ABOUT THE WHOLE PROGRAMME and it is stated rather than worked around. (d) DO NOT SOLVE THIS BY EDITING MEMORY SILENTLY AND CALLING THE PROBLEM GONE -- the record must say what every past round carried.
    evaluation_ticket: CA-08
    evidence_root: specs/results/scorecards/cut-the-apparatus/GOAL-blind-dispatch
  - id: GOAL-four-results-stand
    kind: quality
    statement: >-
      The four results that survived a control, a replication or a deliberate attempt to refute them are still standing after the cuts -- or the epic says exactly which one it broke.
    metric: >-
      For each of the four results: does it still reproduce from the sealed record, and does the instrument that produced it still run at the epic tip? Plus the suite baseline, with the two deliberate reds intact and no new red introduced silently.
    harness: >-
      Per-result reproduction check at the integrated tip, plus uv run --with pytest --with pyyaml -m pytest tests -q compared against the epic-base figure recorded in this baseline. Decided by CA-08.
    baseline:
      value: >-
        FOUR RESULTS STANDING AT THE EPIC BASE. (1) Asking for an architecture changes the architecture -- D3 1 -> 4 on the prompt alone, replicated, confound killed directly by arm C at 1/1 with a LONGER prompt carrying no architectural vocabulary. (2) D3 separates architectures on more than one example -- eval_toolchain, effectful [0,1] vs ports-and-adapters [2,4], disjoint, both judge tiers both sides. (3) D3's v5 caveat discriminates -- SV-01, D3 held 4,4 at v4 and v5 on an artifact LACKING the property against CL-03's 4,4 -> 3,3 on one that has it, prediction sealed at a timestamped commit before any judge ran. (4) A score can produce a test and the re-score sees it -- SV-04, control 3,3 vs treatment 4,4, same bytes plus one file, D2 flat at 2 across all four. Suite at the epic base is recorded in this goal's evidence file, with the two deliberate reds named.
      measured_at: 08d1d6a90ad2638cdfceee7cc2e150732daa3438
      evidence: specs/results/scorecards/cut-the-apparatus/GOAL-four-results-stand/baseline.md
    target: >-
      MULTI-CLAUSE, EACH DECIDED SEPARATELY. (a) Each of the four results either still reproduces from the sealed record with its instrument still running at the tip, or the epic NAMES which one it broke, what cut broke it, and whether that trade was worth it. (b) The suite's two deliberate reds are intact and unrepaired; any additional red is DECLARED with its cause. (c) The instruments RM-02 called the substrate's best export -- scope, seal, contested, the blinding mechanism, R-H1/R-H2/R-H4/R3, the version/served double seal -- still run. A SILENTLY BROKEN RESULT IS THE WORST OUTCOME AVAILABLE AND FAILS THIS GOAL EVEN IF THE LINES FELL.
    evaluation_ticket: CA-08
    evidence_root: specs/results/scorecards/cut-the-apparatus/GOAL-four-results-stand
tickets:
  - id: CA-01
    title: 'Blindness: measure what a dispatched agent actually receives, then build and prove a memory-free dispatch'
    status: done
    github_issue: https://github.com/haydenrear/tla-spec-dev/issues/255
    schedule_revision: 1
    depends_on: []
    blocks: [CA-05, CA-08]
    wave: 1
    promotion_order: 10
    promotion_predecessor: null
    conflict_keys:
      production: []
      tla: []
      adapters: []
      test_graph: []
      workflow: [examples/validation/instruments/fixtures/blinding/, references/blind_dispatch.md, specs/results/scorecards/cut-the-apparatus/GOAL-blind-dispatch/]
    objective: >-
      GOAL 03, AND IT LANDS BEFORE ANY JUDGED ROUND IN THIS EPIC. The owner's words: 'make sure the memory doesn't leak in, because that's been a killer.' SV-05 measured 4 of 4 blind agents disclosing UNPROMPTED that the operator's auto-memory and the environment block were in their context before they read anything; one quoted MEMORY.md verbatim, naming the exact prior on the exact question a D3 judge is asked. IT ARRIVES WITH NO TOOL CALL, so no forbidden-reading list in any dispatch can reach it, and NOTHING A DISPATCH SAYS REMOVES A BLOCK THE HARNESS INJECTS FIRST. THREE THINGS, IN ORDER. FIRST, ESTABLISH WHAT A DISPATCHED AGENT ACTUALLY RECEIVES -- auto-memory, environment block, CLAUDE.md, session hooks, skill listings, anything else -- BY MEASURING IT, NOT BY ASSUMING IT: dispatch agents that are asked only to report their own pre-read context verbatim, and record what comes back. SECOND, BUILD A DISPATCH PATH THAT DEMONSTRABLY CARRIES NONE OF THE OPERATOR'S CONCLUSIONS, and PROVE IT THE SAME WAY -- fresh agents through the new path, asked what they received, with their answers recorded verbatim. Inspecting configuration is not proof; R1 requires a demonstrated failing input on a real subject, so SHOW THE PATH REFUSING TO LEAK ON A CASE THAT LEAKED BEFORE. THIRD, SAY WHAT IT COSTS. IF BLINDNESS CANNOT BE ACHIEVED WITH THIS HARNESS, THAT IS A FINDING ABOUT THE WHOLE PROGRAMME and it must be stated rather than worked around, together with a contamination note that can be printed beside every number the way SV-01-DF-01 did. DO NOT SOLVE THIS BY EDITING THE OPERATOR'S MEMORY SILENTLY AND CALLING THE PROBLEM GONE -- the record must say what every past round carried, and any change to a memory file or a skill is PROPOSED AS A DIFF AND ESCALATED, never applied. ASK EVERY AGENT YOU DISPATCH WHAT IT REJECTED.
    desired_actions: []
    implementation_scope: [examples/validation/instruments/, references/, specs/results/scorecards/cut-the-apparatus/]
    goals:
      - goal: GOAL-blind-dispatch
        contribution: direct
        expected_effect: >-
          Moves the baseline from '4 of 4 leaked, nobody measured it' to a measured inventory plus either a proven memory-free path or a stated impossibility. Either outcome decides clauses (a) and (c).
        local_signal: fresh agents through the candidate path, asked what they received, answers recorded verbatim
      - goal: GOAL-four-results-stand
        contribution: guard
        expected_effect: none expected -- this ticket ships no cut
        local_signal: uv run --with pytest --with pyyaml -m pytest tests -q
      - goal: GOAL-apparatus-cut
        contribution: guard
        expected_effect: >-
          none expected, and NOTE THE HAZARD -- this is the one ticket in the epic that could ADD apparatus. Any mechanism it ships is counted against GOAL-apparatus-cut and must be priced like a cut.
        local_signal: find scripts examples/validation -name '*.py' -not -path '*/__pycache__/*' | xargs wc -l | tail -1
      - goal: GOAL-consumption-obligatory
        contribution: enabling
        expected_effect: none -- CA-05's disposition work needs a dispatch path it can trust
        local_signal: N/A
    acceptance:
      commands: [uv run --with pytest --with pyyaml -m pytest tests -q]
      assertions: ['What a dispatched agent receives is MEASURED and recorded verbatim, not assumed.', 'A candidate memory-free dispatch path exists AND is proven by fresh agents asked what they received -- or its impossibility is stated as a finding.', 'A demonstrated failing input on a real subject (R1), not a fixture.', 'The cost is stated plainly, including if blindness is unachievable.', 'No memory file and no skill is edited; any such change is a proposed diff and an escalation.', 'Every dispatched agent is asked what it REJECTED and the answers are recorded.', 'Any mechanism shipped is priced in lines against GOAL-apparatus-cut.']
    model_delta_expectation: none expected
  - id: CA-02
    title: 'Cut the gap-mutant / removal-pricing machinery, which was measured to be able to return only one answer'
    status: done
    github_issue: https://github.com/haydenrear/tla-spec-dev/issues/256
    schedule_revision: 1
    depends_on: []
    blocks: [CA-03, CA-04, CA-08]
    wave: 1
    promotion_order: 20
    promotion_predecessor: CA-01
    conflict_keys:
      production: [examples/validation/gap_mutants/, examples/validation/removal_census/, scripts/complexity_ledger.py]
      tla: []
      adapters: []
      test_graph: []
      workflow: [tests/test_price_removal.py, tests/test_removal_census.py, tests/test_complexity_ledger.py, specs/results/scorecards/cut-the-apparatus/GOAL-apparatus-cut/]
    objective: >-
      THE FIRST CUT, AND THE ONE WITH THE CLEANEST FINDING BEHIND IT. RM-05-DF-01 and CL-02: the normal shape of a removal here ALWAYS returns ENTAILED-SURVIVES, because that verdict follows from git show alone. RM-03's 'first PRICED removal' was WITHDRAWN when its own zero-gap control returned the same verdict. Re-priced history over kill sets returned 'priced rows: [], 0 of 10'. RM-02 adds that the catalogues are ab_quota_ledger fixtures with NO VERSION AN ADOPTER RECEIVES, and that this argument SURVIVES A ZERO AND SURVIVES A DEFECTIVE CLASSIFIER PRODUCING ONE, BECAUSE IT IS NOT A PRICING ARGUMENT. CORRECTED 2026-08-13, CA-00-DF-05: this entry PREVIOUSLY read 'a gap mutant can price a removal only if every detector that killed it is one the removal deletes -- 0 OF 9 over the sealed table. THE INSTRUMENT COULD ONLY EVER RETURN ZERO.' THE SEALED RECORD REFUTES THAT IN THREE PLACES. RM-05-DF-01 forbids the quotation by name -- 'WHAT SURVIVES, STATED SO THIS FINDING CANNOT BE QUOTED AS THE EPIC PRICED NOTHING -- the epic HAS a priced removal'. RM-02 section 10.2 -- 'the instrument CAN FIRE, history remains free'. And RD-02, whose own 0 of 9 is explicitly scoped as NOT a statement about every mutant, REFUSED THIS VERY DELETION under MF-020 turned on itself. THE DEFENSIBLE SENTENCE IS NEXT-EPIC section 5's: 'a non-zero was the informative outcome, the instrument would have printed one, and none appeared -- the goal is met and THE INSTRUMENT IS NOT YET USEFUL'. THE CUT STILL STANDS, on RM-02's adoption argument and NEXT-EPIC section 5's 'do not fund a third epic on it' -- right for a weaker and true reason rather than a strong and false one. Cut it: price_removal.py, altered_score_probe.py, removal_census.py, their catalogues, and whatever in complexity_ledger.py exists only to feed them. PRICE THE CUT: lines removed per surface, what the tree can no longer do, and which sealed results depended on it -- and CHECK THAT DEPENDENCY EXPLICITLY, because HISTORY-toolchain_removal.md and the sealed cards must still read. ONE OF THE TWO DELIBERATE REDS IS THE PRICER GREP TRIPPED BY NARRATIVE DOCUMENTS: say what happens to that red when the pricer goes, and DO NOT quietly claim a red repaired that was actually deleted -- denominator_rule applies to suite counts. Establish the epic's PRICE TABLE FORMAT in this ticket as a plain markdown file with a fixed row shape -- NO NEW CODE; the epic is about cutting apparatus, and a tool to measure cutting apparatus is apparatus.
    desired_actions: []
    implementation_scope: [examples/validation/gap_mutants/, examples/validation/removal_census/, scripts/, tests/, specs/results/scorecards/cut-the-apparatus/]
    goals:
      - goal: GOAL-apparatus-cut
        contribution: direct
        expected_effect: >-
          -1,444 lines or more from examples/validation/ (price_removal.py 838, altered_score_probe.py 177, removal_census.py 429) plus whatever in scripts/ exists only to feed them, and the epic's price-table format established.
        local_signal: find scripts examples/validation -name '*.py' -not -path '*/__pycache__/*' | xargs wc -l | tail -1
      - goal: GOAL-four-results-stand
        contribution: guard
        expected_effect: >-
          none expected -- none of the four results depends on the pricer. VERIFY THAT RATHER THAN ASSERTING IT, and say what happens to the deliberate pricer-grep red.
        local_signal: uv run --with pytest --with pyyaml -m pytest tests -q
      - goal: GOAL-consumption-obligatory
        contribution: enabling
        expected_effect: none -- this is the worked example of a finding being consumed into a deletion
        local_signal: N/A
      - goal: GOAL-blind-dispatch
        contribution: guard
        expected_effect: none expected
        local_signal: N/A
