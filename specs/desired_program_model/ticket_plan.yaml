version: 1
name: stabilize-substrate-epic
schedule_revision: 2
updated: null
purpose: >-
  THE TREE IS THE FINISH CONDITION, NOT THE COUNT. The predecessor closed its workflow for the first time in this repository's history and the tree entered a state it had never been in: reds moved 8 -> 11 -> 7, EVERY MOVEMENT ATTRIBUTED, and the answer was neither 'we regressed' nor 'we fixed it'. The count converged BY REPAIRED NUMERATOR, NOT FALLEN DENOMINATOR. 22 skips, 13 uncollected nodes and 3 vacuous passes remain and only the count was measured. This epic stabilizes the executable substrate and reports the TREE -- reds, passes, skips AND collection -- with every movement attributed, or names the movement it cannot attribute, WHICH IS THE FINDING.


  FOUR NEW GOALS AND ONE CARRIED. (1) CONSUME THE ABSENT-INPUT CLASS -- 48 instances across 30 of 43 verdict-producing modules return a confident PASSING answer when handed an absent or empty input; R1 requires a demonstrated FAILING input and does not require an ABSENT one, and THAT GAP IS WHY ALL 48 SHIPPED. The doctrine extension is landed AS AN EXECUTED CHECK, not cited. (2) STABILIZE THE TREE. (3) BRING THIS PROJECT'S OWN JUDGED GOALS INTO COMPLIANCE -- 0 of 20 have a baseline the evaluation can open, and SV-05 established THE COMPLIANCE RATE OF ZERO IS OURS, not the documentation's. (4) MAKE COUNTED FIGURES IN PROSE REACHABLE -- scope returns ZERO counted figures on charters, plans, baselines and price tables, so the instrument proposed as the durable fix CANNOT READ THE DOCUMENTS THAT DIRECT THE WORK. (5) CARRIED UNCHANGED: FOUR RESULTS MUST STILL STAND.


  THERE IS NO SIZE GOAL AND THAT IS A DECISION. The change rule keeps old anchors, R-H4 seals the record, and the close-out writes a full specs/.history snapshot, so NET-ADDITIVE IS REQUIRED BY CONSTRUCTION -- four epics running have called themselves simplifications and come out net-additive, the last by +398,596/-7,366. A fifth line-count target would measure the close-out, not the work. NOTHING IN THIS EPIC IS CUT FOR BEING LONG.


  AND THE FIRST THING THIS EPIC DID WAS RUN ITS OWN RULE AGAINST ITS OWN WORK ORDER. Issue #271 handed three figures and THREE OF THEM MOVED: 41,691 py lines is measured at ea624b9 and is 41,971 at the epic base (+280 from four post-close commits); '0 of 18 judged goals' is 0 OF 20 at the epic base -- NUMERATOR HELD, DENOMINATOR ROSE; and the live ledger path the instruments name DOES NOT EXIST, because the close deletes it. VERIFY EVERY CLAIM IN YOUR OWN WORK ORDER BEFORE ACTING ON IT.
planning_rules:
  the_tree_is_the_finish_condition: >-
    REPORT REDS, PASSES, SKIPS AND COLLECTION TOGETHER, ALWAYS. Never report a red count alone. denominator_rule: if a count moves, SAY WHETHER THE NUMERATOR ROSE OR THE DENOMINATOR FELL. A red that appears after fixing a metric is NOT automatically a regression -- it may be the substrate reporting truthfully for the first time. Fix the metrics and see whether the count converges before concluding something broke. THE EPIC-BASE FIGURE IS IN GOAL-tree-stabilizes' BASELINE EVIDENCE and every ticket compares against THAT, not against a recollection. Collection at the base is 1491.
  consumption_is_changing_what_the_substrate_checks: >-
    FILING A FINDING ROUTES IT; IT DOES NOT CHANGE WHAT THE SUBSTRATE CHECKS. GOAL-consumption-obligatory measured 1-of-41 and the epic then produced 57 findings while consuming almost none into its own checks. When a finding names a MECHANISM rather than an instance, ask what rule, test or doctrine line would have caught the whole class, and LAND THAT ALONGSIDE THE FIX. If the answer is 'nothing would have', THAT IS THE FINDING. A doctrine line with no instrument is a preference.
  r1_now_requires_an_absent_input: >-
    R1 -- a demonstrated FAILING input on a REAL SUBJECT -- IS EXTENDED BY SS-02: every instrument also ships a demonstrated ABSENT-INPUT case, and THE CORRECT ANSWER TO AN ABSENT INPUT IS UNDECIDED OR A REFUSAL, NEVER PASS. The worked shape is a SIGNATURE CHANGE: set[str] -> set[str] | None, because the old type could not distinguish 'read and found nothing' from 'read nothing' and answered the second with the first. Every ticket promoting after SS-02 complies for any instrument it touches.
  schedule_revision_2_two_conflict_key_defects_the_owner_shipped: >-
    AMENDED 2026-08-17, schedule_revision 1 -> 2, after the SS-04 review found TWO CONFLICT-KEY DEFECTS THE OWNER SHIPPED AT KICKOFF. NEITHER IS A TICKET'S FAULT AND BOTH FORCED TICKETS INTO POSITIONS THE PLAN THEN JUDGED THEM FOR. (1) tests/test_score_tools.py IS ASSIGNED TO SS-01, WHICH IS CLOSED -- so three tests that SS-04 turned red by superseding their enumerations sit in a file NO OPEN TICKET CAN CLAIM, and the owner's dispatch note to SS-04 wrongly said SS-06 owned it. IT IS NOW SS-06'S, which is the ticket that owns the tree; SS-06 is notified directly. (2) examples/validation/instruments/instruments.toml IS IN NO TICKET'S CONFLICT KEYS ANYWHERE IN THIS PLAN -- while SS-02's mechanism REQUIRES every instrument-shipping ticket to register a contract there. EVERY REGISTERING TICKET IS FORCED OUTSIDE ITS KEYS BY DESIGN, and SS-04 was the first to hit it and disclosed it. IT IS NOW A SHARED APPEND SURFACE: any ticket may add or amend ONLY ITS OWN instrument's row, must say so in the PR body, and must never edit another instrument's row. THE DEEPER FINDING, WHICH IS THE OWNER'S: the plan partitioned TRACKED FILES and the epic then built a mechanism whose use requires writing to an unpartitioned one. A conflict-key scheme that a later ticket's mechanism can force you to violate is not a partition. NOTE ALSO THAT instruments.toml IS NOT IN DEFAULT_SWEEP, so scope cannot check the figures tickets are now required to write there -- SS-04 shipped stale figures into it while correcting stale figures in it.
  an_instrument_a_ticket_SHIPS_must_be_REGISTERED: >-
    OWNER RULING 2026-08-17, and it reverses the owner's earlier instinct. THE EPIC HAS SHIPPED TWO INSTRUMENTS -- SS-07's stranded_loaders.py and SS-06's vacuity_probe.py -- AND NEITHER IS REGISTERED IN instruments.toml, SO NEITHER IS SWEPT BY THE absent-input CHECK SS-02 BUILT. Both were then found BY HAND to carry the absent-input defect: SS-07-DF-08 (rglob swallows PermissionError, so 'I was not allowed to look' is reported as 'there is nothing there') and SS-06-DF-05 (the same mechanism, in the instrument written to police vacuity). THE EPIC IS COUNTING A CLASS WHILE ITS OWN NEW INSTRUMENTS SIT OUTSIDE THE COUNT, and the check's 3-of-56 excludes exactly the instruments this epic produced. THE RULING: A TICKET THAT SHIPS AN INSTRUMENT MUST REGISTER IT WITH ITS THREE-STATE ABSENT-INPUT CONTRACT, AND MUST NOT REPAIR THE INSTRUMENT TO MAKE THE CONTRACT PASS INSIDE THE SAME TICKET. A FAILING CONTRACT IS FILED AND REPORTED AS THE TICKET'S OWN RESULT. That keeps MF-020 intact from both sides -- you cannot tune the instrument to pass, because passing is not required; and you cannot leave it unswept, because registering is. THE DENOMINATOR MOVEMENT IS DECLARED, NOT ABSORBED: registering both takes the population from 56 to 58 with two more instruments FAILING, which is denominator movement in the UNFLATTERING direction and is the honest form. WHY THE OWNER'S EARLIER REFUSAL WAS WRONG: SS-07 was told not to register so it could not 'make itself pass', and it complied by measuring its three states BY HAND and reporting that it would fail -- which was honest but left the disclosure in prose. This epic's own repeated lesson answers it: AN UNSWEPT LOCATION MAKES A FIGURE STABLE, IT DOES NOT MAKE IT TRUE. The disclosure belongs in the register, where the check can read it. SS-05 AND SS-08 ARE BOUND BY THIS. Retro-registration of stranded_loaders.py and vacuity_probe.py is SS-05's, whose slice is repairs, and it files rather than repairs what the contracts refuse.
  SF_309_the_close_out_conflict_is_resolved_in_favour_of_the_EPIC: >-
    OWNER RULING 2026-08-17. SS-06 filed SF-309, the reviewer verified it is LITERAL, and it is the owner's to resolve: git-issue-workflow references/epic-ticket.md section 7 says 'Before you stop: skill-manager home close-out --home ... --into ...', while this plan's skills_are_read_never_edited says 'NO TICKET AGENT RUNS home close-out, home sync, skt sync OR skt publish'. TWO WRITTEN INSTRUCTIONS AND NO RULE FOR WHICH WINS. THE EPIC WINS, FOR A MEASURED REASON RATHER THAN BECAUSE IT IS MORE LOCAL: SS-00-DF-06 established that the close-out gate CANNOT DISTINGUISH 'this home was edited' from 'the home it compares against moved', reported staleness as authorship on two ticket homes where NOTHING had been edited, and printed a fix whose direction would have silently reverted the owner's just-authorised sync. A GATE THAT MIS-REPORTS IN ONE DIRECTION AND WHOSE REMEDY UNDOES THE OPERATOR'S LAST ACT IS NOT A SAFETY MECHANISM. What replaces it is not nothing: the owner merges each ticket worktree's home into the project home and only then removes the worktree, and every ticket DISCLOSES whether anything in its home changed. SS-06 established its home clean BY INSPECTION -- zero files newer than bootstrap -- which the reviewer independently verified, and that is a stronger statement than the gate's exit code. THE SKILL IS NOT EDITED FROM HERE: SF-309 is a PROPOSED DIFF ESCALATED TO THE OWNER, recorded in specs/results/skill_feedback.md, and the resolution must reach git-issue-workflow through its own repository, not through this one.
  kickoff_defects_are_repaired_before_the_evaluation: >-
    OWNER DECISION. THE THREE DEFECTS THE KICKOFF FOUND ARE REPAIRED BEFORE SS-08 RUNS, NOT CARRIED PAST IT. SS-00-DF-01 -- the archived-ledger fallback resolves by filesystem mtime, so a fresh checkout audits against a four-epic-old 88-id snapshot -- is SS-01's. SS-00-DF-02 -- a goal id reused across epics is silently collapsed into one census row, SHRINKING the denominator -- and SS-00-DF-03 -- the judged-instrument recogniser is a keyword matcher over harness prose, so the denominator of 0-of-20 is a claim about a keyword list -- are SS-03's. EACH REPAIR CARRIES A DEMONSTRATED FAILING INPUT ON A REAL SUBJECT (R1), AND A DEMONSTRATED ABSENT-INPUT CASE FOR ANY TICKET PROMOTING AFTER SS-02. WHY THIS IS NOT ORDINARY BACKLOG: ALL THREE ARE DEFECTS IN THE INSTRUMENTS SS-08 MUST USE TO DECIDE THE GOALS, and two of the three MIS-REPORT IN A DIRECTION -- DF-02 shrinks a denominator and INFLATES a compliance rate, DF-01 accuses TRUE citations of being fabricated. AN EVALUATION RUN ON INSTRUMENTS KNOWN TO MIS-REPORT IS NOT A MEASUREMENT. IF A REPAIR IS NOT COMPLETE WHEN SS-08 STARTS, SS-08 REPORTS IT AS AN ALARM, NAMES WHICH FIGURES ARE AFFECTED AND IN WHICH DIRECTION, AND QUOTES NO AFFECTED FIGURE WITHOUT THAT CAVEAT -- IT DOES NOT REPAIR IT, BECAUSE AN EVALUATION THAT FIXES ITS OWN INSTRUMENT MID-MEASUREMENT HAS MEASURED NOTHING. MF-020 STILL BINDS ON ALL THREE: do not tune a repaired instrument until this epic's own goals land where the owner expects, and do not reword the plan to flip a classification. AND RE-DERIVE WHAT THE REPAIR MOVES: a figure that changes because the instrument was repaired is A FACT ABOUT THE INSTRUMENT until proven otherwise, and it is stated with numerator and denominator named.
  do_not_assume_a_filed_finding_is_open: >-
    THREE OF THE FIVE ORIGINALLY-NAMED ABSENT-INPUT EXEMPLARS WERE ALREADY REPAIRED AND NOTHING IN THE RECORD SAID SO -- and each left a NAMED HALF behind. CHECK. And MEASURE BEFORE REPAIRING; DO NOT QUIETLY SHRINK THE CLASS. The predecessor's cut list had three of four items that did not exist as described and a fourth that was load-bearing in the opposite direction; every one was correctable from data the author already had.
  the_static_gates_doctrine_as_adjudicated: >-
    TWO CLAIMS, NOT ONE. (1) No static check in this project has ever been shown to catch a semantic defect in SHIPPED PROGRAM CODE -- and that is NOT evidence about gates, it is a fact about what the project chose to build, since the instrument was never aimed at X. (2) Static checks over THIS PROJECT'S OWN RECORD, METADATA AND METHOD have caught real defects repeatedly and changed outcomes -- 3 catches : 1 false refusal last epic. THE DOCTRINE MAY REFUSE A GATE OVER SUBJECT-PROGRAM CONTENT ON A BURDEN-SHIFTING BASIS; IT MAY NOT REFUSE A CHECK OVER THIS PROJECT'S OWN RECORD OR METADATA. 'Seven cycles, zero bugs' HAS NEVER BEEN AUDITED and may not be invoked until it has been. SS-02's check is in the permitted population and is scoped to this project's own instrument register; SS-04's recogniser IS EXPLICITLY NOT A GATE and reports UNREACHABLE by default.
  no_size_goal: >-
    NOTHING IN THIS EPIC IS CUT FOR BEING LONG. RM-03-DF-03 is structural: the change rule keeps old anchors and R-H4 seals the record, and the close-out writes a full specs/.history snapshot, so a repository-line goal MEASURES THE CLOSE-OUT. If a ticket removes code, it names the finding ID that justifies it and prices what the tree can no longer do -- that discipline survives; the TARGET does not. serve | wc -c is 6,281 at the base and MUST NOT GROW; that is the only size clause and it belongs to the card, never combined with repository lines.
  no_diagram_rung: >-
    diagram, mermaid, UML, C4 and .svg appear in 0 sentences across 0 of 95 cards. DO NOT ADD A DIAGRAM RUNG. Eight epics, zero evidence base. Three tickets have refused to build one and ALL THREE REFUSALS WERE CORRECT (MF-020).
  do_not_restore_d1_d4_d5: >-
    Do NOT restore D1, D4 or D5 as scored dimensions. SV-07-DF-01: ANY CARD CHANGE, NOTE OR RUNG, COSTS A VERSION BUMP, which owes a re-score under both versions, and serve | wc -c does not distinguish carriers on that axis.
  every_research_ticket_runs_its_own_rule: >-
    EVERY RESEARCH TICKET RUNS ITS OWN PROPOSED RULE AGAINST THE SEALED RECORD BEFORE IT SHIPS, and reports what the rule refuses. That is R1 pointed at prose, and it is not a gate. Four tickets corrected their predecessor two epics ago and FOUR OF FIVE CORRECTIONS WERE AVAILABLE TO THE PARTY CORRECTED FROM DATA IT ALREADY HAD.
  blindness_is_re_probed_every_round: >-
    --safe-mode's memory behaviour is OBSERVED FOUR TIMES AND SPECIFIED ZERO TIMES, and blind_dispatch check reads THE AGENT'S REPORT rather than the harness's configuration, so it CANNOT DETECT THE REGRESSION IT EXISTS TO GUARD AGAINST. VERIFY EACH ROUND; DO NOT TRUST THE FLAG. --safe-mode PLUS a neutral cell -- neither half suffices, safe-mode does not strip gitStatus. THE CELL PATH CHECK REFUSES ONLY THE LITERALS tla-spec AND spec-dev, so a path naming your TICKET passes: DO NOT NAME YOUR CELL AFTER YOUR TICKET. Ask every blind agent what it REJECTED and what was LOADED in its packet. THE AGENT CHOOSING WHAT TO PUT IN FRONT OF BLIND JUDGES IS ITSELF NEVER BLIND -- say so.
  measurement_rule: >-
    FILE FINDINGS; FIX NOTHING DURING A MEASUREMENT. SEAL PREDICTIONS BEFORE MEASURING AND SAY WHEN, in a commit with a timestamp. IF EVERY PREDICTION PASSES, REPORT IT AS AN ALARM. Never edit a target to match a result. MF-020: never add an axis, test, rung or case fitted to a known answer. NAME A FINDING ID, NOT A TICKET, in any justification. DO NOT QUOTE A FIGURE WITHOUT THE TREE IT WAS MEASURED ON.
  skills_are_read_never_edited: >-
    Skills are READ from this repository and NEVER edited. Anything that must change in a SKILL_MANAGER_HOME is PROPOSED AS A DIFF AND ESCALATED, never applied. THE AUTHORITATIVE HOME FOR THIS EPIC IS THE PER-WORKTREE HOME CREATED AT PROVISIONING. AMENDED 2026-08-15: THE KICKOFF FREEZE IS SUPERSEDED -- ALL UNITS WERE SYNCED IN BOTH TIERS BY OWNER DECISION. spec-double-compiler now ships at 436c78c and therefore carries EVERY CHARTER AND NEXT-EPIC.md ON DISK: that is #271 section 7.5's unmeasured contamination channel, now LIVE BY DECISION RATHER THAN BY ACCIDENT, and any agent dispatched from a home carrying it may be reading this epic's own conclusions before it reads anything. SAY SO RATHER THAN CLAIMING A BLINDNESS THE ROUND DOES NOT HAVE. WAVE 1 RAN BEFORE THE SYNC AND WAVES 2+ AFTER IT; that is a real difference between tickets and SS-08 MUST NOT AVERAGE ACROSS IT. AND NO TICKET AGENT RUNS home close-out, home sync, skt sync OR skt publish -- change management is the owner's, in one place, after the PR merges and before the worktree is removed.
  operational_rules_this_project_has_paid_for: >-
    THE TEST COMMAND IS 'uv run --with pytest --with pyyaml -m pytest tests -q' -- without --with pyyaml, 12 tests go PHANTOM RED. VERIFY YOUR BRANCH POINT: wt new branches from the LOCAL ref, and YOUR ASSIGNMENT NAMES A RESOLVED COMMIT OID -- USE IT, never a branch name. Local main was stale at 08d1d6a for the first hours of this epic and was fast-forwarded to 436c78c with the owner's explicit approval on 2026-08-15; THE HAZARD IS THE HABIT, NOT THAT ONE REF -- a ref is a symbolic name, not an identity, and this project has put tickets 4, 14 and 21 commits behind by trusting one. DO NOT EDIT FILES A RUNNING MEASUREMENT READS -- six parties did this in one epic, starting with the owner. WRITE SCRATCH OUTPUT TO A TICKET-SPECIFIC PATH -- two concurrent tickets corrupted a shared baseline.txt. Do NOT hand-roll a wait loop for a run you started. NEVER kill a process by name alone and check whether a process is yours first. NEVER invoke tla-spec-dev from PATH; use python3 scripts/tla_spec_dev.py --spec-root specs. READ THE VALIDATOR'S OUTPUT, NOT ITS EXIT CODE. close ticket REFUSES WHILE THE PLAN SAYS planned -- flip your entry first.
  the_ledger_is_cumulative_and_has_moved: >-
    THE LIVE LEDGER FOR THIS EPIC IS specs/deferred_findings.yaml, carrying all 296 inherited rows, moved by the owner at kickoff and verified byte-identical to the closed snapshot. APPEND; NEVER REWRITE, NEVER TRUNCATE, NEVER REORDER, NEVER 'RESET IT FOR THIS EPIC' -- the filed_as references in sealed close-history records point into it by ID. UNTIL SS-01 MERGES the instruments still name the dead per-epic path specs/desired_program_model/deferred_findings.yaml, so invoke 'python3 scripts/disposition.py --ledger specs/deferred_findings.yaml' explicitly. THE 25 ARCHIVAL SCORECARDS THAT CITE THE OLD PATH MUST NOT BE REWRITTEN.
