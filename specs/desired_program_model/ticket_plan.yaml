# Canonical plan for the modular-fuzzing epic. GitHub issues mirror this file
# for handoff; this file remains the source of truth. Dispatched ticket IDs,
# dependency edges, waves, and promotion order are immutable after issue
# assignment — add amendment tickets instead of editing dispatched identities.
version: 1
name: modular-fuzzing-epic
updated: "2026-07-18"
purpose: "Mechanize the modular pure-function/side-effect fuzzing doctrine (references/modular_fuzzing.md) in the tla-spec-dev CLI: per-program budgets, complexity analysis gates, corpus distillation, effect conformance, External channel enforcement, mutation kill tests, and the skill feedback loop."

epic:
  id: modular-fuzzing
  branch: epic/modular-fuzzing
  default_branch: main
  base_sha: da0a7ffe59078111bdc61fdaeefa2e296bf16057
  schedule_revision: 4
  review_mode: epic-owner-post-merge
  notes: >
    Per repository-owner direction, ticket agents merge their reviewed-green
    feature branch into epic/modular-fuzzing themselves after validation and
    ticket close; the epic owner reviews post-merge and prepares the next
    ticket. The epic owner closes GitHub issues; ticket agents never do.
    2026-07-17: MF-011 amended (schedule_revision 2) before start to add
    tractability diagnostics per references/architecture_tractability.md;
    architectural moves are recommendations requiring user approval.
    2026-07-17: MF-019 added (complexity minimization objective, wave 8,
    promotion after MF-017); MF-011 bumped to revision 3 and MF-016 to
    revision 2 for the new reverse blocks edges. The standing objective and
    recursive refinement loop doctrine landed in
    references/architecture_tractability.md and SKILL.md.
    2026-07-18: epic schedule_revision bumped to 2 (per desired_sync_rule,
    for the MF-019 addition). Issues #12/#14/#15/#16/#18 backfilled with the
    standing-objective close-out instruction and an
    architecture_tractability.md reference — their bodies predated the
    doctrine; per-ticket schedule revisions unchanged (no compared
    scheduling fields changed).
    2026-07-18: MF-012 accepted and closed at post-merge review (merge
    fb79bc5). Its complexity ledger surfaced an architectural move that the
    owner approved: MF-020 added (ticket_phase ordinal collapse) at
    promotion_order 15, between MF-012 and MF-011, so the analyze-complexity
    gate is calibrated against the retained model shape. MF-011 bumped to
    revision 4 (depends_on gains MF-020; promotion_predecessor MF-012 ->
    MF-020). Waves of already-dispatched tickets deliberately NOT renumbered:
    promotion_order is the real serialization and its gaps of 10 exist for
    insertion, so only MF-011's assignment needed re-rendering.
    2026-07-18: MF-020 accepted and closed at post-merge review (merge
    690b7389). Variables 13 -> 11 and declared bound 3,145,728 -> 393,216 at
    identical 919 reachable states and depth 21. IMPORTANT CORRECTION: the
    projected -13.1% generated-states reduction (originating in the MF-012
    ledger, propagated into tickets/020 and issue #21) was WITHDRAWN as
    erroneous. Reproducing it required tightening the RunSpecUnitTests guard
    from >= 2 to = 2, deleting a legitimate idempotent re-fire transition —
    a behavior change, not a re-representation. Generated states are
    unchanged at 3,664. The distinct-state gate is structurally blind to
    deleted self-loops, so MF-011 and MF-019 must treat projected reductions
    as unverified until the transition-level diff is inspected; a
    generated-states drop at constant distinct states is a red flag, not a
    win. Known desync: specs/program_model/spec_manifest.yaml still names the
    three collapsed booleans (frozen accepted baseline, promoted wholesale at
    epic finalization) — must be reconciled there.
    2026-07-18: MF-021 added at promotion_order 17, before MF-011, per owner
    direction to fix the promotion data-loss defect (GitHub #22) before any
    further model refactor runs that gauntlet. Root cause located:
    replace_tree rmtree's specs/current before copying the ticket desired/
    tree, and desired/ is seeded from a different source than current/, so
    current-only files are destroyed silently. It has now fired on two
    consecutive tickets and destroyed the sole copy of a prior ticket's
    regression test. MF-011 bumped to revision 5 (depends_on gains MF-021;
    promotion_predecessor MF-020 -> MF-021). The setup_phase collapse
    (11 -> 7 variables, bound 393,216 -> 73,728 at identical 919/21, found
    and measured by the MF-020 agent) remains an open owner decision,
    deliberately deferred until promotion is safe.

planning_rules:
  current_model_rule: Update specs/current after each production slice lands as a whole-program working copy of specs/program_model, not a ticket projection.
  unit_validation_rule: Run current-model TLC and adapter/unit tests before adding graph execution.
  graph_rule: Add graph or integration nodes only after current-model validation passes.
  semantic_model_rule: Do not add test graph nodes, pytest jobs, CI workflow steps, integration harnesses, or validation scripts as TLA+ program state/actions. The CLI's own workflow commands (scaffold, analyze, generate, close) ARE program behavior for this repository.
  evidence_rule: Record tests and graph runs as evidence for semantic program actions in manifests or ticket status.
  desired_sync_rule: Update this file and spec_manifest.yaml whenever scope, order, acceptance checks, or status changes; bump schedule_revision for any change to IDs, edges, waves, promotion order, conflict keys, or validation scope.
  promotion_rule: Only epic finalization promotes; ticket agents close exactly their own ticket and never run close_tickets.py or use --accept-new.

status:
  workflow: modular-fuzzing-epic
  active_ticket: MF-021
  active_ticket_title: "Promotion must not destroy files unique to specs/current"
  desired_module: TlaSpecDevCli
  phase: implementation

service_catalog:
  existing_boundaries:
    - tla-spec-dev CLI (scaffold/open/run/close)
    - scripts/generate_cases_from_tlc_dump.py case generation
    - scripts/run_generated_case_adapters.py adapter runner
    - spec_manifest.yaml / actions.yml / testgraph_bindings.yml schemas
  desired_boundaries:
    - budgets block in spec_manifest.yaml read by all gates
    - analyze complexity pre-TLC gate
    - sandboxed effect observation in the adapter runner
    - channel-authentic Test Graph bindings with double|real port configurations
  adapter_boundaries:
    - specs/program_model/production_adapters.py spec-unit adapters
    - test_graph specWorkflow / cliWorkflow graphs
  known_gaps:
    - "This repository's own baseline is a single TlaSpecDevCli.tla module without the Internal/External view split that SKILL.md mandates for onboarded projects. Out of scope for this epic; migrate via references/migration.md in a follow-up epic."

