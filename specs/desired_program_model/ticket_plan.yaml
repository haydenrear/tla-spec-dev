      assertions: [The fixture/goal decision is made explicitly and the reasoning recorded., "If the fixture changed, it ships a demonstrated divergence: a fault one arm catches and the other cannot.", 'The generator-versus-suite question is answered with evidence, either way.']
    model_delta_expectation: none expected
  - id: FI-05
