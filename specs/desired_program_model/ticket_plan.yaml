version: 1
name: cut-the-apparatus-epic
schedule_revision: 1
updated: null
purpose: >-
  THE RATIO IS THE SUBJECT. Seven epics produced 95 sealed scorecards and 210 findings, of which FOUR RESULTS SURVIVE ADVERSARIAL CHECKING. The machinery built to produce them is 43,553 lines of Python across scripts/ and examples/validation/ at the epic base, against a served card of 6,281 bytes and two scored dimensions -- roughly HALF OF ONE PERCENT. This epic changes that ratio without destroying the four results.


  THREE OWNER GOALS. (1) CUT THE APPARATUS, NOT THE CARD -- the pricing instrument is entailed, the gates catch nothing, the descriptor cannot see the one simplification measured, and four checks passed a live defect. Each is a candidate for deletion ON MEASURED GROUNDS, and every cut is PRICED. (2) MAKE CONSUMPTION OBLIGATORY, OR STOP CALLING IT A LOOP -- detection, filing, scoring and re-scoring all work; consumption is 1 of 38 because nothing requires it. (3) FIX BLINDNESS BEFORE RUNNING ANOTHER JUDGED ROUND -- every scorecard number in the record was produced by a judge carrying the operator's own conclusions in context, and the owner's words are 'make sure the memory doesn't leak in, because that's been a killer'. GOAL 03 LANDS FIRST AND BEFORE THE EVALUATION.


  AND ONE CONSTRAINT ABOVE ALL: FOUR RESULTS MUST STILL STAND. Asking for an architecture changes the architecture (D3 1 -> 4 on the prompt alone, confound killed by arm C at 1/1). D3 separates architectures on a second example (eval_toolchain, disjoint, both judge tiers both sides). D3's v5 caveat discriminates (SV-01: 4,4 held at both versions on an artifact lacking the property, against CL-03's 4,4 -> 3,3 on one that has it). A score can produce a test and the re-score sees it (SV-04: control 3,3 vs treatment 4,4, D2 flat at 2 across all four). EVERYTHING CUT MUST LEAVE THESE STANDING.
planning_rules:
  cut_the_apparatus_not_the_card: >-
    serve | wc -c is the metric for the CARD -- 6,281 bytes, 9 rungs, sha256:2d7d4a0506d9b259 at the epic base. IT MUST NOT GROW. REPOSITORY LINES ARE THE METRIC FOR THE APPARATUS and they are what this epic is about. NEVER REPORT THE CARD AND THE APPARATUS AS ONE NUMBER, and never report a cut in repository lines without saying WHICH SURFACE. RM-03-DF-03: the change rule keeps old anchors and R-H4 seals the record, so a CARD removal cannot delete prose or code -- three epics called themselves simplifications and came out net-additive BECAUSE THAT OUTCOME IS REQUIRED BY CONSTRUCTION.
  cut_on_the_record_never_on_aesthetics: >-
    EVERY DELETION NAMES THE FINDING THAT JUSTIFIES IT, and every cut is PRICED -- what it cost, what it removed, and what it can no longer do. A cut with no finding behind it does not ship. RM-03 declined kill_test.py because it is a MODEL DELTA; that refusal was right for that ticket. A MODEL DELTA IS NOW A COST TO PRICE RATHER THAN A REASON TO STOP.
  instruments_that_earned_their_keep: >-
    DO NOT CUT scope, seal, contested, the blinding mechanism, R-H1/R-H2/R-H4/R3, or the version/served double seal. RM-02 called them 'the substrate's best export, and the epic should be careful not to cut them for being unglamorous'. CL-01's second seal caught a real class one ticket later. analyze_complexity.py and code_complexity.py SERVE THE SPEC WORKFLOW AND STAY -- only their role as a PRECONDITION OF A D2 SCORE is cut. The suite KEEPS its regression-guard job; it is defunded only as a FINDING CHANNEL.
  the_tla_path_is_kept_and_simplified: >-
    OWNER DECISION, NOT A FINDING: the TLA+ / case-generation / adapter path STAYS. 'I do want to keep parts of the TLA+ diagram, I still think generating cases, using adapters is valid, I want to make it dead simple, the regressions should tried to be included in TLA+ and adapters in the most simple validated way.' NOTE THE TENSION HONESTLY RATHER THAN RESOLVING IT QUIETLY: the measurement says the current implementation does not beat hand-written tests -- ZERO unique kills against FOUR the other way, replicated on new subjects -- and the owner's direction is to keep it and shrink it. THOSE ARE COMPATIBLE ONLY IF IT GETS DRAMATICALLY SMALLER. SIMPLIFY AGGRESSIVELY; DO NOT DELETE. If the simplified version still yields zero unique kills, SAY SO -- that is a result, and the direction was to simplify it, not to prove it works.
  no_new_gates_rule: >-
    Seven epics of static checking caught ZERO bugs. NOTHING IN THIS EPIC REFUSES ANYTHING ABOUT ANYONE'S CODE. The consumption obligation in GOAL-consumption-obligatory is a CLOSE-OUT DISPOSITION REQUIREMENT on this project's own epics, not a gate on an adopter's code.
  no_diagram_rung: >-
    diagram, mermaid, UML, C4 and .svg appear in 0 sentences across 0 of 95 cards. DO NOT ADD A DIAGRAM RUNG. Eight epics, zero evidence base.
  do_not_restore_d1_d4_d5: >-
    Do NOT restore D1, D4 or D5 as scored dimensions without the both-wordings re-score SV-02 says is owed first. SV-07-DF-01: ANY CARD CHANGE, NOTE OR RUNG, COSTS A VERSION BUMP, which owes a re-score under both versions, and serve | wc -c does not distinguish carriers on that axis.
  every_research_ticket_runs_its_own_rule: >-
    SV-05 section 6, carried forward as charter: EVERY RESEARCH TICKET RUNS ITS OWN PROPOSED RULE AGAINST THE SEALED RECORD BEFORE IT SHIPS, and reports what the rule refuses. Four tickets corrected their predecessor last epic and FOUR OF FIVE CORRECTIONS WERE AVAILABLE TO THE PARTY CORRECTED FROM DATA IT ALREADY HAD. That is R1 pointed at prose, and it is not a gate.
  skills_are_read_never_edited: >-
    Skills are READ from this repository and NEVER edited. Anything that must change in SKILL_MANAGER_HOME is PROPOSED AS A DIFF AND ESCALATED. NEVER run skill-manager sync -- and do NOT sync mid-epic, which moves text under tickets already running. SV-05-DF-03: two homes exist and the last epic ran on the older one; THE AUTHORITATIVE HOME FOR THIS EPIC IS THE PER-WORKTREE HOME CREATED AT PROVISIONING, and 11 units are stale against their sources at the epic base. That staleness is DECLARED, not repaired.
  measurement_rule: >-
    FILE FINDINGS; FIX NOTHING DURING A MEASUREMENT. SEAL PREDICTIONS BEFORE MEASURING AND SAY WHEN, in a commit with a timestamp. IF EVERY PREDICTION PASSES, REPORT IT AS AN ALARM. Never edit a target to match a result. denominator_rule: if a count moves, SAY WHETHER THE NUMERATOR ROSE OR THE DENOMINATOR FELL, including suite counts. ASK EVERY BLIND AGENT WHAT IT REJECTED -- it has produced more than any check. MF-020: never add an axis, test, rung or case fitted to a known answer.
  operational_rules_this_project_has_paid_for: >-
    VERIFY YOUR BRANCH POINT -- wt new branches from the LOCAL ref and has put tickets 4, 14 and 21 commits behind, and the owner's handed SHA has been wrong once. Do NOT report git archive figures as tree properties (nine of ten 'archive failures' were that). WRITE SCRATCH OUTPUT TO A TICKET-SPECIFIC PATH -- two concurrent tickets corrupted a shared baseline.txt. Do NOT hand-roll a wait loop for a run you started. NEVER kill a process by name alone and check whether a process is yours first. THE TEST COMMAND IS 'uv run --with pytest --with pyyaml -m pytest tests -q' -- README.md:35 omits --with pyyaml and yields 12 PHANTOM REDS. READ THE VALIDATOR'S OUTPUT, NOT ITS EXIT CODE. Never invoke tla-spec-dev from PATH.
  the_two_deliberate_reds: >-
    TWO REDS ARE INHERITED AND DELIBERATE: RM-06-DF-01 (the same-tag control cannot tell treatment from architecture) and the pricer grep tripped by narrative documents. DO NOT REPAIR THEM SILENTLY. SV-02 and SV-01 independently found a THIRD undeclared red last epic; the epic base suite figure is recorded in the GOAL-four-results-stand baseline evidence and every ticket compares against THAT, not against a recollection.
