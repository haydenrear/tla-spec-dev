, NOT WHAT WAS MEASURED -- the owner's :.0f mtime probe, the owner's un-cross-tabulated marginals, scope's dependence on the root it is swept in, the close gate reading staleness as authorship, and a `cell` exit code read through a pipe. BEFORE YOU PUBLISH A FIGURE, ASK WHAT YOUR OWN INSTRUMENT COULD BE ADDING TO IT. (11) NAME WHAT SHOULD CHANGE IN THE SUBSTRATE. A finding that is only filed has been ROUTED, NOT CONSUMED -- and this epic's whole thesis is that consumption means changing what the substrate CHECKS. AND ASK EVERY BLIND AGENT BOTH QUESTIONS: what did you REJECT, and what was LOADED in your packet. The first produced more than any check; the second produced the best finding in the last round the first time it was asked.
