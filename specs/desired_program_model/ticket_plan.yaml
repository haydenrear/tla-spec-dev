        THE HEADLINE, AND IT IS ONE CELL: M04 moved from surviving every corpus
        instrument in every previous round to DYING under the default mapping.
        durable_content 1 of 2 -> 2 of 2. Same corpus, same adapter, same seam,
        same mutants; the only difference between the columns is one line of
        TOML naming a provider.

        Assertion 1 MET, with the boundary stated. Codegen now GENERATES the
        content-asserting provider for every manifest port with role: effect and
        BINDS it in case_adapters.toml for any effect port that has none --
        additive only, so a table somebody wrote is never rewritten. A real
        project scaffolded from scratch, given one port declaration and nothing
        else, ends up asserting durable content with nobody writing a line of
        provider code (results/scaffolded-project.txt, run end to end). What is
        NOT met is the moment before the declaration exists: `scaffold project`
        still ships a `raise NotImplementedError` provider stub and a
        commented-out binding, and `scaffold_spec.py` /
        `onboard_program_model.py` are in no ticket's conflict keys and not in
        HP-05's edit permission. FILED as HP-05-DF-01.

        Assertions 2 and 3 MET on the paths this ticket owns, with the gap named
        rather than papered over. Codegen prints a full mapping audit unprompted
        on every invocation, and each generated provider announces its own
        binding on stdout the first time it binds. Four situations produce the
        SAME closing sentence -- silent provider bound, content-asserting
        provider with no `content:` block, role: effect port bound to nothing,
        and a boundary declared under `effects:` that no provider can reach
        (which is exactly how HP-01's own fixture declares LedgerAppendPort):
        "Nothing compares what crossed this port against the model, so kills
        counted under this mapping are a FLOOR, not a total, and a green run
        over-reads." All four captured verbatim in
        results/mapping-announcement.txt. THE GAP: the shipped runner never
        prints the mapping it loaded and does not pass it to the provider, so
        the announcement recovers the name from TLA_SPEC_DEV_MAPPING or from
        --mapping on the command line and says `<unnamed mapping>` when it
        cannot. run_generated_case_adapters.py is HP-04's conflict key. FILED as
        HP-05-DF-02.

        THREE THINGS THAT ARE UNFLATTERING, recorded here rather than only in
        the evidence.

        (1) M05 WAS ALREADY DYING. The ticket objective and the dispatch brief
        both say the two durable-side mutants survive both corpora. True of M04,
        FALSE of M05: HP-03's own committed kill table records M05 as KILLED by
        corpus-whole, and this run reproduces that under all three mappings. The
        model's CLOSE element is << "CLOSE", t, committed[t] >>, so its third
        slot IS the total and the ordinary projected-state comparison already
        sees a zeroed one; only the COMMIT element drops its total. ONE mutant
        moved, not two.

        (2) THE 30% FIGURE DOES NOT REPRODUCE AS A PROPORTION. On the blind
        agent's 16-mutant catalogue the mapping was worth 3 of 10 kills; here it
        is worth 1 of 6 under the checking mapping and 1 of 10 overall. The
        DIRECTION has now replicated three times on three fixtures. The
        MAGNITUDE is fixture-dependent and 30% must not be quoted as a property
        of the mechanism.

        (3) THE GENERATOR IS STILL WORSE THAN THE SUITE. Suite 10 of 10.
        Whole-view corpus under the checking mapping 6 of 10. Whole-view
        (checking) + HP-03's negative corpus 9 of 10, up from 8 of 10 -- the gap
        narrows from two mutants to one. The survivor is M07, the catalogue's
        declared POSITIVE CONTROL, which is supposed to die on every instrument
        and does not because it is seeded inside reserve() and Reserve
        contributes zero executable cases. While that control is red the
        wrong_value row is not citeable as a clean kill measurement.

        THE REPRODUCTION CONTROL, without which none of the above is readable.
        This instrument installs a seam the reference implementation does not
        have (the durable append goes through the port AND to the file), so a
        third column runs with no provider bound at all. It reproduces HP-03's
        committed `corpus-whole` column in all ten rows, so the map-checking
        column is a mapping effect and nothing else. Two full runs of the whole
        table were identical including failing executions.

        PER ARM: NOT MEASURABLE AT HP-05, for the reason HP-03 recorded -- the
        arms are implementations the A/B produces at HP-06 and neither has code
        yet. Every number is on the fixture's reference implementation, which is
        explicitly not an arm.

        ZERO MODEL SURFACE ADDED, argued in results/zero-model-delta.txt rather
        than asserted: no TLA+ action, no TLA+ variable, no new declared effect
        port, and TLC enumerates 3,678,218 states / 118,573 distinct before and
        after, the same two figures to the digit. The `content:` and `kind:`
        manifest keys are optional and every existing manifest generates
