        - "specs/tickets/RP-01/results/df02-blast-radius-after.json (203 partitions: 0 coherent)"
        - "specs/tickets/RP-01/results/df02-blast-radius-comparison.txt (12 -> 0; the measured case for basis_limits != blind_spots)"
        - "specs/tickets/RP-01/results/ex4-coherent-control-after.txt (false-positive control: still coherent)"
        - "specs/tickets/RP-01/results/ex5-divergent-after.txt (still divergent: 4 divergences + 1 absence)"
        - "specs/tickets/RP-01/results/tlc-current.txt (green: 1,292,951 distinct / depth 26)"
