    objective: >
      Implement the reflexion model (Murphy/Notkin/Sullivan): a DECLARED map
      from production modules to model components, an extracted dependency
      graph of the real code, and a diff reported as convergences (a code edge
      the model declares a port for), divergences (a code edge with no port --
      the Jenga), and absences (a declared port no code edge realizes -- dead
      architecture). Python extraction ships; any target the extractor cannot
      resolve reports `unmappable`, which is NOT clean -- the same refusal
      MF-027 gave the effect oracle, for the same reason: a clean report on
      something you could not see is indistinguishable from a clean report on
      something you could.
    desired_actions: []
    implementation_scope:
      - scripts/architecture_reflexion.py
      - scripts/analyze_architecture.py
      - tests/
      - references/architecture_coherence.md
    current_increment:
      model_state: []
      model_actions: []
      adapters: []
      unit_tests:
        - "uv run --with pytest --with pyyaml -m pytest tests -q"
      graph_after_unit_pass: []
    acceptance:
      commands:
        - "python3 scripts/tla_spec_dev.py --spec-root specs analyze architecture specs/program_model/TlaSpecDevCli.tla specs/program_model/MC.cfg --code scripts --map specs/program_model/architecture_map.yaml"
        - "uv run --with pytest --with pyyaml -m pytest tests -q"
      assertions:
        - "Convergences, divergences, and absences are reported separately, with file:line evidence for every divergent edge."
        - "An unresolvable target yields `unmappable`, and no flag, key, or annotation downgrades it to clean -- proved by a test in the TestNothingDowngrades... shape."
        - "The check never blocks: exit 0 on divergence, nonzero only when the map or the extraction is unusable."
        - "Run against this repository's own scripts/ tree; the report is read and its findings recorded. The dogfood is the acceptance test (tickets/023 precedent), and a finding that the tool is wrong outranks a clean report."
      evidence:
        - specs/.history/architectural-coherence-epic/ticket-002-AC-02/results/dogfood-findings.txt
        - specs/.history/architectural-coherence-epic/ticket-002-AC-02/results/reflexion-dogfood-repo.txt
        - specs/.history/architectural-coherence-epic/ticket-002-AC-02/results/reflexion-dogfood-declared.txt
        - specs/.history/architectural-coherence-epic/ticket-002-AC-02/results/reflexion-dogfood-declared.json
        - specs/.history/architectural-coherence-epic/ticket-002-AC-02/results/fixture-coherent.txt
