version: 1
name: ports-as-adapters-epic
updated: null
purpose: >-
  Make the model's PORTS and the toolchain's ADAPTERS the same object.

  The predecessor proved the two halves work separately and do not meet. Asking an agent for ports and adapters took modularity from D3 = 1 to D3 = 4 on both blind judges -- the first 4 in the project. A negative corpus took guard relaxation from 0 of 3 to 3 of 3, a class that had measured zero on every instrument in this project's history. And then: per-mutant verdicts IDENTICAL ON 49 OF 49 comparable cells between a hexagonal arm and a non-hexagonal one, with a fault in the treatment arm's own in-memory adapter SURVIVING EVERY INSTRUMENT. The prompt created ports; the validation machinery does not know ports exist. The structure arrived and caught nothing.

  Its cleanest result says why this epic is shaped as it is: D1 = 3 on BOTH arms. The bug-catching gain was the generator, which both arms get -- not the prompt. Architecture and detection are separate levers with separate effects, and nothing yet connects them.

  So: declare the agent's ports in the manifest, generate cases per port, bind adapters to ports rather than to whole actions, and make the fake/real swap the instrument. Complexity analysis stays a thermometer -- it reports, refuses nothing, and its output is input to a judgement. Verdicts come from judged scorecards, because a number computed from an artifact can be optimized by editing the artifact while a judgement that must cite the artifact can only be satisfied by changing what the artifact is.
planning_rules:
  current_model_rule: >-
    Update specs/current after each production slice lands as a whole-program working copy of specs/program_model, not a ticket projection.
  unit_validation_rule: Run current-model TLC and adapter/unit tests before adding graph execution.
  graph_rule: Add graph or integration nodes only after current-model validation passes.
  semantic_model_rule: >-
    Do not add test graph nodes, pytest jobs, CI workflow steps, integration harnesses, or validation scripts as TLA+ program state/actions. The modeled program surface is the shipped CLI lifecycle. Case generation is MODELED. Refusal branches and per-flag variants are out-of-model EXCEPT the six guard-weakening flags. Advisory internals, wrapper scripts and the effect-provider runtime are harness plumbing. THE STANDING PROVISO: an out-of-model FILE does not make an out-of-model EFFECT.
  representation_scope_rule: >-
    `implementation_scope` is EDIT PERMISSION, never representation scope. A carried-forward scope block MUST BE DIFFED AGAINST ITS SOURCE, not copied and trusted -- copying one silently dropped two governing rulings in two consecutive epics.
  surface_cost_rule: >-
    Adding modeled surface COSTS: the predecessor measured ~1.5 new coverage gaps and ~8x state space per surface-adding ticket. State what it buys and what the state space costs BEFORE dispatch. Removing surface is also a delta and also needs its validated-refactor basis recorded.
  no_new_gates_rule: >-
    This epic ships NO new blocking check and no new static analyzer. Three epics of static checking caught zero bugs and were each defeated cheaply; the scanners were deleted on 2026-08-04 and what they taught is references/architecture_advice.md. Guidance goes in prompts, verdicts come from judged scorecards. A ticket adding a rule that refuses something has left scope.
  declaration_executability_rule: >-
    NEW. A declaration that nothing executes will drift from the code it describes -- five mismatches in five consecutive attempts by three authors, in both directions, plus a test for the class that passed vacuously by reading the wrong key. Any declaration this epic adds ships with something that checks it against behaviour, using the SHIPPED builders so a rename fails a test instead of silently orphaning the declaration.
