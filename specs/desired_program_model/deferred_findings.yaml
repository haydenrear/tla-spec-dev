    summary: >-
      PREDICTION IDS AND MUTANT IDS SHARE A NAMESPACE, SO THE SEAL CHECK CANNOT
      CHECK A PREDICTION ABOUT THE MUTANT `N01`.

      `PREDICTIONS-PA.md` numbers its negative predictions `N01`-`N08`. The eval's
      replacement negative CONTROL is the mutant
      `N01-negative-control-outstanding-id-order`. Both are matched by the same
      `[MN]\d\d` shape, so a checker reading a section that says "N01" cannot tell
      "the prediction I am numbering" from "the mutant I am predicting about".

      `check_prediction_seal.py` resolves the collision by DROPPING any token that
      is also a section id in the same file. That is the safe direction -- it can
      only produce a missed check, never a false ALREADY MEASURED -- but it means
      the one mutant this project chose as its working negative control is exactly
      the one a prediction cannot be checked against by id.
    reproduction: >-
      `grep -n '^### N01' examples/validation/PREDICTIONS-PA.md` -> a prediction.
      `grep -n 'N01-negative-control' examples/validation/ab/eval/controls.toml` ->
      a mutant. `tests/test_prediction_seal.py::test_a_prediction_id_that_collides_with_a_mutant_id_is_not_a_subject`
      asserts the drop.
    evidence:
    - examples/validation/check_prediction_seal.py -- attach_subjects, section_ids
    - tests/test_prediction_seal.py
    why_out_of_scope: >-
      `PREDICTIONS-PA.md` is SEALED and FI-05 may not amend it, and renaming the
      mutants would invalidate every sealed kill table that keys on them. The fix
      belongs to whoever writes the NEXT predictions file, before it is sealed.
    suggested_fix: >-
      Number predictions in a namespace that cannot collide with a mutant id --
      `PRED-01` / `NEG-01`, or the epic prefix the tickets already use -- and have
      the seal check refuse a file whose section ids intersect the mutant ids in
      the records it was given. That refusal is at authoring time, on an unsealed
      file, which is the only moment anything about a predictions file can be fixed.
    blast_radius: >-
      One mutant, in one direction: a prediction about `N01` is reported UNPARSED
      rather than checked. No sealed number moves.
    disposition: carried
    disposition_ticket: "https://github.com/haydenrear/tla-spec-dev/issues/168"
    disposition_note: >-
      Carried to epic/subtract-to-measure SM-04 (#168): harden the scorecard where it is demonstrably broken, WITHOUT retiring D2/D4/D5, because we have not yet separated 'the card cannot measure' from 'there was nothing to measure'.

