  surface:
    production: ["scripts/generate_cases_from_tlc_dump.py", "references/testgraph_adapters.md"]
    tla: []
    adapters: []
    test_graph: []
  summary: >-
    Pure alias wrapper actions (CliAdd(t) == AddTask(t)) are attributed in
    the TLC dot dump to the inner action's definition site, so the external
    view filter silently generated ZERO cases for 7 of 9 external actions.
    Undocumented; the shipped example never hits it because its wrappers
    all add conjuncts. Silent-zero coverage loss is the dangerous part.
  reproduction: >-
    External view whose wrappers are pure aliases; generate cases; observe
    0 cases for those actions with no warning. Anchoring conjuncts restore
    attribution.
  evidence: ["examples/validation/runs/ex1-run4/scoring.md"]
  why_out_of_scope: "Post-merge validation finding; filed, not fixed."
  suggested_fix: >-
    Warn (or attribute through single-alias definitions) when a declared
    view action generates zero cases; document the anchoring-conjunct
    convention.
  blast_radius: "External case coverage on alias-styled views."
  disposition: pending
  disposition_ticket: null
