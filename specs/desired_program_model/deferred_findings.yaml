  - id: SM-01-DF-01
    found_by: "SM-01"
    found_at_commit: "b2b8e9c"
    schedule_revision: 1
    severity: major
    surface:
      production: []
      tla: []
      adapters: []
      test_graph: []
      workflow: ["specs/results/scorecards/ports-as-adapters/GOAL-port-reach/measure/run_port_swap.py"]
    summary: >-
      THE TWO COLUMNS SM-02'S ENTIRE CASE RESTS ON CARRY NO EXECUTABLE COUNT AND
      ARE STRUCTURALLY EXEMPT FROM CONTROL CHECKING. `run_port_swap.run_suite`
      returns `{"total_failed": int(returncode != 0), "failures": tail}` and
      nothing else -- no `total_ran`, no `total_skipped`, no `per_action`. Every
      `corpus-*` column carries all four.

      Two consequences, and the second is worse than the first.

      (1) A `SURVIVED` in `suite-real` or `suite-fake` cannot be told apart from
      a suite that did not run. `total_failed` is derived from an exit code, and
      pytest exits 0 for a passing run and for a run whose items were collected
      and skipped -- which is the FI-06 finding, in the driver rather than in the
      registry.

      (2) `control_verdict` decides a control's role against `witness_count`,
      which reads `per_action`. The suite columns have no `per_action`, so
      `witness_count` returns `None`, which the function's own docstring defines
      as "not evaluable ... nothing is decided against it". THE TWO SUITE COLUMNS
      ARE THEREFORE NEVER DECIDED BY THE CONTROL MACHINERY AT ALL. That machinery
      exists because PA-04's first run reported `control_red: []` while a
      declared control survived four columns; the repair covered the corpus
      columns and left the suite columns in exactly the state it was written to
      end.

      This matters here and not in the abstract. `suite-fake` strictly dominating
      `corpus-port-swap:fake` -- it kills PA-M13 and the port column does not --
      is the load-bearing evidence for defunding the `[ports.*]` machinery. That
      domination is measured on a column with no executable count and no control.
