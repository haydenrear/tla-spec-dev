      PA-03 ran `run_controls.py` only with `--module-dir reference` (the flat
      tree), and PA-04 and PA-06 measured the ported tree with
      `run_port_swap.py`, which runs every cell in a FRESH INTERPRETER for
      exactly this reason. FI-01 is the first ticket to point `run_controls.py`
      at a ported tree.

      WHY IT IS BLOCKING RATHER THAN MAJOR. FI-02 enumerates every shipped
      instrument and FI-03..FI-06 measure with them. `run_controls.py` is the
      shipped driver whose docstring is the reproduction recipe for this fixture,
      and it now silently produces a fully dead column on any ported subject. A
      dead column with a green-looking artifact is the exact failure EVAL-RERUN
      spent a round recovering from.
