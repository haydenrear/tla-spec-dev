  - id: SV-02-DF-02
    found_by: "SV-02, measuring the epic's own surface metric"
    found_at_commit: "a527305"
    schedule_revision: 1
    severity: minor
    surface:
      production: []
      tla: []
      adapters: []
      test_graph: []
      workflow: ["examples/validation/scorecards/score_tools.py", "SCORE-DRIVES-VALIDATION-EPIC.md"]
    summary: >-
      THE EPIC'S SURFACE METRIC DOES NOT NAME ITS STREAM, AND THE TWO READINGS
      DIFFER BY 92 BYTES.

      Every ticket in this epic is handed the same standing rule: "`serve |
      wc -c` is the surface metric -- 6,281 bytes, 9 rungs, must not grow."
      `serve` writes the served card to stdout and one line to STDERR: "served
      digest sha256:... (card version 5, rubric file sha256:...)". So
      `serve | wc -c` is 6,281 and `serve 2>&1 | wc -c` is 6,373, on the same
      tree with nothing changed.

      SV-02 read 6,373 first and spent a measurement establishing that the card
      had not grown by 92 bytes since `close-the-loop`. The failure is cheap and
      it is the shape this project keeps finding: a number quoted without the
      command that produces it, in the one rule six concurrent tickets are all
      told not to break. A ticket that redirects stderr -- which is the natural
      thing to do when a tool prints a digest you do not want in a diff -- will
      report a 92-byte regression that does not exist, or will fail to notice a
      92-byte one that does.

      The stderr line is correct behaviour and should not move: the digest is
      metadata about the served bytes and putting it on stdout would change the
      bytes it describes. The defect is that neither the tool's help nor the
      epic's rule says which stream carries the metric.
    reproduction: >-
      `python3 examples/validation/scorecards/score_tools.py serve 2>/dev/null | wc -c`
      -> 6281.
      `python3 examples/validation/scorecards/score_tools.py serve 2>&1 | wc -c`
      -> 6373.
    evidence:
      - "SCORE-DRIVES-VALIDATION-EPIC.md section 5 -- the standing rule, no stream named"
      - "examples/validation/scorecards/score_tools.py -- `serve` prints the digest line to stderr"
      - "references/eval_scorecard.md version history -- the 6,319 -> 6,281 figure the rule inherits"
    why_out_of_scope: >-
      SV-02 ships no production code and does not edit the epic charter. The
      repair is one sentence in each of two files and belongs with whoever owns
      the charter.
    suggested_fix: >-
      Write the metric as the command that produces it -- `serve 2>/dev/null |
      wc -c` -- in the epic's standing rules and in `serve --help`. Nothing about
      the tool changes.
    disposition: open
  - id: SV-02-DF-03
    found_by: "SV-02, costing carriers against the 6,281-byte surface"
    found_at_commit: "a527305"
    schedule_revision: 1
    severity: minor
    surface:
      production: []
      tla: []
      adapters: []
      test_graph: []
      workflow: ["references/eval_scorecard.md"]
    summary: >-
      THE SERVED CARD ASKS A JUDGE THREE SEPARATE TIMES WHETHER IT SEEDED A
      FAULT, ON A SURFACE THAT MUST NOT GROW.

      In the 6,281 bytes a judge is served, the same question appears at three
      places: scoring rule 8 ("whether the judge seeded a fault of its own and
      ran it against the artifact, and what it ran"), the whole `Judging
      practice -- REQUIRED` block ("Did you seed a fault of your own and run it
      against this artifact...?"), and the tail of the N-D1 note prompt ("Name
      the fault you seeded if you seeded one").

      The first two are deliberate -- a rule and the field it governs -- and the
      third is a third statement of the same ask inside the prompt for a note.
      It costs 43 of N-D1's 113 bytes. That is 0.7% of the entire surface spent
