      json.load(open(p))['dimensions']['D4']['score'],
      (json.load(open(p)).get('judging_practice') or {}).get('executed_own_faults'))
      for p in sorted(glob.glob('specs/results/scorecards/falsifiable-instruments-rescore-v2/ab_quota_ledger/*U*/scorecard.json')
      + glob.glob('specs/results/scorecards/subtract-to-measure-sm04-rescore-v*/ab_quota_ledger/*/scorecard.json'))]"`
    evidence:
