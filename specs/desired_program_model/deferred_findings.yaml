      tla: []
      adapters: []
      test_graph: []
      workflow: ["examples/validation/instruments/demonstrate.py", "examples/validation/instruments/instruments.toml"]
    summary: >-
      A DEMONSTRATION THAT STOPPED RUNNING ENTIRELY REPORTS `ok`, AND TWELVE OF
      THE TWENTY-SIX REST ON THAT SLOT KIND.

      `demonstrate.py:judge()` checks `expect_exit` and substrings; `run_pytest`
      never inspects output. **ALL TWELVE `kind = "pytest"` failing slots in the
      registry declare `expect_exit = 0` and NOTHING ELSE** -- not one carries an
      `expect_output`. pytest exits 0 when every collected test is SKIPPED. So a
      demonstration decorated `@pytest.mark.skip`, or whose node stops matching,
      or whose whole file is skipped by a missing import, is reported as having
      reproduced.

      Demonstrated, not reasoned: a probe registry with one row whose failing
      slot is a single `@pytest.mark.skip` test prints
      `probe  ok  -  -  demonstrated-can-fail`, `WITH a demonstrated failing
      input 1`, `Every declared demonstration reproduced`, exit 0.

      THIS IS THE `R-H5` FAILURE GENERALISED. The registry knows that a
      demonstration pinned to an unimplemented identifier goes quietly green and
      it moved that one to a free id. The pytest slots have the same property
      structurally, for a different reason, and no comment records it.
      `test_every_cited_pytest_node_exists` does not close it: it is an
      `f"def {part}" not in text` substring check, blind to markers, and for a
      whole-file node it checks only that the file exists.

      The twelve: effect-oracle, control-property-probe, arms-length-match,
      divergence-reachability, scorecard-seal, thermometer-tripwire,
      skill-root-tripwire, complexity-ledger, close-promotion-preconditions,
      external-channel-enforcement, spec-unit-adapter-conformance,
      case-modules-validate.
    reproduction: >-
      `python3 -c "import tomllib; d=tomllib.load(open('examples/validation/instruments/instruments.toml','rb'));
      print([e['id'] for e in d['instrument'] if (e.get('failing') or {}).get('kind')=='pytest'
      and not (e.get('failing') or {}).get('expect_output')])"` -> all twelve.
      Then point `demonstrate.py --registry` at a one-row registry whose failing
      slot is a `@pytest.mark.skip`ped test -> `ok`, exit 0.
    evidence:
      - "examples/validation/instruments/demonstrate.py -- judge(), run_pytest()"
      - "examples/validation/instruments/instruments.toml -- the twelve pytest failing slots"
      - "tests/test_instrument_demonstrations.py -- test_every_cited_pytest_node_exists"
    why_out_of_scope: >-
      The fix is to `demonstrate.py`'s judging, which is the instrument FI-06 is
      measuring with. Changing what counts as a reproduced demonstration
      mid-measurement would move the 26 while it is being reported.
    suggested_fix: >-
      Parse pytest's summary line and require at least one PASSED among the
      collected nodes, or require every pytest slot to declare an
      `expect_output` naming the assertion text. The second is cheaper and is
      what the cli slots already do.
    blast_radius: >-
