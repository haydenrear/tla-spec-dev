      At `e63969d`, before FI-04's row was added: `python3 -c "import tomllib;
      d=tomllib.load(open('examples/validation/instruments/instruments.toml','rb'));
      print(any('divergence.py' in p for e in d['instrument'] for p in
      e.get('paths',[])))"` -> False, while
      `uv run --with pytest python -m pytest tests/test_instrument_demonstrations.py -q`
      -> all green.
