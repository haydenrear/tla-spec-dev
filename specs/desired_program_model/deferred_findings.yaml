  - id: RP-07-DF-01
    found_by: "RP-07"
    found_at_commit: "b2d3a35"
    schedule_revision: 3
    severity: minor
    surface:
      production: []
      tla: []
      adapters: []
      test_graph: ["test_graph/README.md"]
    summary: >-
      The Test Graph executor's process-ownership contract ("node launcher
      exited with live descendants") and the Kotlin Gradle plugin's default
      `daemon` compile strategy are mutually incompatible for ANY node that
      runs a nested Gradle build which compiles Kotlin. The default forks
      `KotlinCompileDaemon --daemon-autoshutdownIdleSeconds=7200`, a shared
      user-scoped service designed to outlive its build, as a descendant of
      the node launcher; the contract then correctly reports it as leaked and
      reaps it -- reaching a daemon shared with the outer build. RP-07 fixed
      the one node in THIS repository that hits it
      (`spec.workflow.failure_cleanup_probe`) by pinning
      `kotlin.compiler.execution.strategy=in-process`, and documented the
      requirement in test_graph/README.md. But the requirement is a general
      consequence of the contract, not a property of this probe, and it is
      currently written down only in this repository. Any other repo whose
      test_graph nodes shell out to a Gradle build that compiles Kotlin will
      hit the same red, with the same opaque bare-PID message and no pointer
      to the cause. The natural home for the guidance is the test-graph skill
      itself (references/workflows.md already documents the supervisor's exit
      codes but says nothing about daemons), or a diagnostic in the executor
      that names the surviving processes' command lines rather than only their
      PIDs.
    reproduction: >-
      On this repository at b2d3a35, `cd test_graph && ./gradlew specWorkflow
      --console=plain` fails with "node spec.workflow.failure_cleanup_probe
      errored: node launcher exited with live descendants: <pids>". Resolving
      a reported PID with `ps -eo pid,ppid,args` shows
      `org.jetbrains.kotlin.daemon.KotlinCompileDaemon
