      test_graph: []
      workflow: ["examples/validation/scorecards/score_tools.py", "references/eval_scorecard.md"]
    summary: >-
      `served_digest` DOES NOT COVER EVERY BYTE A JUDGE IS SERVED. IT COVERS THE
      RUBRIC SECTION OF THE CARD, NOT THE CARD.

      scorecard_version 3 states that "the digest recorded on a card now covers
      exactly the bytes a judge is served". A judge is served `scorecard.md`, and
      `_skeleton_md` writes prose of its own around `served_rubric` -- headings,
      the blinding note, the citation label, the disclosures section. None of
      that is inside `served_digest`, which is taken over `served_rubric` alone.

      M3 measured the consequence: inverting `_skeleton_md`'s hand-written
      statement of a scoring rule changed no digest, no verdict and no exit code
      anywhere in the repository. Every judge would have been handed the
      inversion with a digest that still matched.

      SM-06 deleted the two restatements that made this dangerous, so no scoring
      rule is stated twice in a scaffolded card today. THE STRUCTURAL GAP IS NOT
      CLOSED: any prose a later author adds to `_skeleton_md` reaches a judge
      from outside the digest, exactly as these did.
    reproduction: >-
      `python3 -c "import importlib.util,pathlib;
      s=importlib.util.spec_from_file_location('st','examples/validation/scorecards/score_tools.py');
      m=importlib.util.module_from_spec(s); s.loader.exec_module(m);
      r=m.load_rubric(pathlib.Path('references/eval_scorecard.md'));
      print(m.served_digest(r,3))"` -- then scaffold a card and observe that
      `scorecard.md` is strictly larger than `served_rubric(r, 3)` while carrying
      that digest.
    evidence:
      - "specs/results/scorecards/subtract-to-measure/SM-06/dup-mutants-before.json -- M3"
      - "examples/validation/scorecards/score_tools.py -- `_skeleton_md`, and `served_digest` beside it"
      - "references/eval_scorecard.md -- 'How this card reaches a judge'"
    why_out_of_scope: >-
      SM-06 is a REMOVAL ticket and the removal is done. Widening `served_digest`
      to the whole scaffolded card is a change to the card's own contract, which
      is SM-04's surface and sealed behind `anchors_digest sha256:eeccf4576bc6fd85`
      -- and it is not free: a digest over the whole card moves whenever the
      blinding label changes, which would re-scaffold rounds for no reason.
      `FI-03-DF-02` argued exactly that trade-off in the other direction.
    suggested_fix: >-
      Either take a second digest over the FULL scaffolded card and record it
      beside `served_digest`, the way `file_sha256` sits beside it for the rubric
      file, or run `result_leaks` over the whole rendered `scorecard.md` rather
      than over `served_rubric` alone. The second is cheaper and catches the
      class M3 belongs to; neither is SM-06's to choose.
    blast_radius: >-
      Every card scaffolded under version 3. The digests are not wrong, but the
      sentence "exactly the bytes a judge is served" is broader than what is
