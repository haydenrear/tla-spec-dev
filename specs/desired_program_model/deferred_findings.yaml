    evidence:
      - "references/eval_scorecard.md:216 -- the retirement sentence"
      - "references/eval_scorecard.md, `Retired anchors, versions 1-3` -- D4 anchor 3's model clause and anchor 4's provenance-free wording"
      - "references/portable_scorecard.md section 1.1 -- the same mechanism proved for D2's anchor 4"
      - "references/scoring_validation.md section 3 -- the 5-of-5 table"
      - "specs/results/scorecards/score-drives-validation/GOAL-validation-is-scorable/SV-02/analysis/scorability.py -- sections 7 and 8"
    why_out_of_scope: >-
      SV-02 is a research ticket that ships no production code, and the sentence
      is a predecessor's statement at a predecessor's scope. RM-02 set the
      precedent by filing `architecture_tags.md` section 2.2 rather than editing
