  - id: FI-04-DF-01
    found_by: "FI-04"
    found_at_commit: "4697687"
    schedule_revision: 1
    severity: major
    surface:
      production: []
      tla: []
      adapters: []
      test_graph: []
      workflow:
        - "FALSIFIABLE-INSTRUMENTS-EPIC.md"
        - "examples/validation/ab/README.md"
        - "specs/results/scorecards/ports-as-adapters/RESULTS.md"
    summary: >-
      THE SENTENCE THREE EPICS HAVE CARRIED FORWARD IS CONTRADICTED BY EVIDENCE
      THAT HAS BEEN SEALED IN THIS REPOSITORY SINCE `b3a0199` AND WAS NEVER
      COMPUTED.

      `FALSIFIABLE-INSTRUMENTS-EPIC.md` section 2 restates as settled: "On this
      fixture the generated corpus is still worse than a suite a competent
      engineer writes in an afternoon", and supports it with "no generated
      instrument has a unique kill" plus "`suite-fake` strictly dominates
      `corpus-port-swap:fake`".

      BOTH SUPPORTING FACTS ARE TRUE AND BOTH ARE ABOUT CATALOGUES WRITTEN BY
      THE AUTHOR OF THE SUITE. On the only catalogues in this repository
      authored BLIND -- `blind_author_catalogue_arm_{a,b}.toml`, written by an
      agent that had never seen the fixture's catalogue, harness or reference --
      the comparison REVERSES INTO A TIE WITH A KILL EACH WAY:

        seeded/arm A   generated union 10 of 11, suite 10 of 11, IDENTICAL SETS
        seeded/arm B   generated union 10 of 11, suite 10 of 11, IDENTICAL SETS
        blind/arm A    generated union 11 of 15, suite 11 of 15, and the sets
                       DIFFER: BA-P11 killed by corpus-whole, corpus-slice-res,
                       map-silent and map-checking, and MISSED BY THE SUITE;
                       BA-P05 killed by the suite and missed by all six
                       generated instruments
        blind/arm B    the same shape: BA-Q11 generated-only, BA-Q05 suite-only

      `BA-P11`/`BA-Q11` is `identity_reuse` -- reservation ids numbered from the
      count of live reservations, so an id is handed out again once its
      predecessor is resolved and a later commit can silently overwrite a live
      hold. That is not a toy fault.

      THE ROUND THAT PRODUCED THE NUMBERS REPORTED THE COUNTS AND NOT THE SETS.
      `hexagonal-prompting-rerun/GOAL-catch-bugs/README.md` says "the generated
      corpora TIE the hand-written suite on a catalogue nobody tuned", which is
      true and is the union count. A union count cannot tell "the same eleven"
      from "eleven each, differing by one in each direction", and the difference
      is the whole funding question.

      SO THE DOMINANCE RESULT IS A PROPERTY OF WHO WROTE THE CATALOGUE. It holds
      where the catalogue author wrote the suite and it reverses on the one
      catalogue that controls for that. It has been re-derivable at `b3a0199`,
      `f052d3c`, `da075ce`, `fcdbe6f`, `ccba215` and `51fe73d`, and
      `examples/validation/ab/eval/generator_vs_suite.py` PASSES ITS TEST ON THE
      PARENT COMMIT with nothing but the script copied in. Nobody ran the
      arithmetic.
    reproduction: >-
      `python3 examples/validation/ab/eval/generator_vs_suite.py --out /tmp/x.json`
      at this tip, and the same script copied into `git archive fcdbe6f` or
      `git archive 51fe73d`, which prints the same blind rows. Also
      `tests/test_fixture_can_diverge.py::test_the_dominance_result_is_a_property_of_who_wrote_the_catalogue`,
      which is one of exactly three tests in that file that PASS on the parent.
    evidence:
