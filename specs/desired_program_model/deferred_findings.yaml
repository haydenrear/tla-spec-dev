      handle ON a tree module, and `domain` is a tree module that nothing points
      at from outside.

      MEASURED, NOT REASONED. `run_controls.py --tree examples/validation/ab
      --module-dir reference_ports --binding ports_binding --instrument
      corpus-port=<port corpus>` reports 15 of 15 mutants SURVIVED, including
