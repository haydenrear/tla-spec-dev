        15  non-pytest CLI slot exiting nonzero    -- the instrument refused
         3  pytest slot with failed >= 1           -- the instrument went red
        16  pytest slot that PASSES                -- a META-TEST asserted it would refuse

      18 observed, 16 asserted. The asserted shape is not hollow: if the
