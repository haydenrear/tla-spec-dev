  - id: SV-04-DF-04
    found_by: "SV-04, adjudicating a factual contradiction between two of its own judges"
    found_at_commit: "60f2699"
    schedule_revision: 1
    severity: moderate
    surface:
      production: []
      tla: []
      adapters: []
      test_graph: []
      workflow:
        - "specs/desired_program_model/deferred_findings.yaml"
        - "references/eval_scorecard.md"
    summary: >-
      `CL-03-DF-02` IS FALSE IN ITS STRONG FORM -- A SUITE CAN ASSERT DURABILITY
      WITHOUT ANY CASE FAILING AGAINST THE FAKE -- AND THE ROUND THAT SHOWED IT
      ALSO REPRODUCED HARVEST CLASS F6 IN ITS OWN TWO JUDGES.

      (a) THE CORRECTION. `CL-03-DF-02` records a version 4 judge's reasoning that
      D3's anchor 4 "is unsatisfiable by any suite that does assert durability,
      since such a case must fail the fake", and concludes "the anchor
      structurally rewards blindness to the property that makes the real adapter
      real." SV-04 measured otherwise. Put the durability cases in a class
      parametrised over the DURABLE adapters only, and the set of cases run
      against both implementations is untouched: both `LG` judges ran the identical
      28-case suite through both wirings, said so, and awarded anchor 4 with a
      durability-asserting suite present. The anchor does not reward blindness; it
      requires the two kinds of case to live in two places. SV-04 predicted, and
      sealed, that a judge would REASON about this tension -- none did, because
      there was no tension to reason about. The weaker half of `CL-03-DF-02`
      stands: the anchor's text does not ASK for an out-of-band observer, and it
      took the version 5 caveat to make its absence cost anything.

      (b) THE F6 INSTANCE, and it is the reason (a) needed adjudicating. Judges
      `LG-p1` and `LG-p2` made contradictory factual claims about the same
      described fault. `LG-p1`: the domain "returning a shadow instead of calling
      the port" passes 70 of 70. `LG-p2`: "ledger_lines() returning a shadow
      instead of calling the port" dies in 1-7 cases under both wirings. Both are
      correct and they ran different mutants under one sentence. The operator ran
      both: divert the READ only, leaving the writes going to the port, and 7 of 28
      fail under each wiring; divert the read AND the writes, so the port is never
      called at all, and nothing anywhere fails. The interesting mutant is the
      second and it is `SV-04-DF-01`.

      THE MECHANISM IS UNDER-SPECIFICATION IN `judging_practice.what_was_run`. The
      field records what a judge ran in prose. Two judges wrote the same prose for
      two different mutants, and a reader of the sealed cards has no way to tell
      without rebuilding both. `HARVEST-CL-03.md` `F6` recorded this shape once
      ("two judges of the same artifact made mutually contradictory FACTUAL
      claims"); this is a second instance with the mechanism identified.
    reproduction: >-
      The two mutants are in section 6 of
      `specs/results/scorecards/score-drives-validation-sv04/RESULT-SV-04.md` and
      in `SV-04-DF-01`'s reproduction. For (a): read both `LG` cards' D3
      rationales, which report the shared 28 passing through both wirings AND a
      durability-asserting suite in the same packet.
    evidence:
      - "specs/desired_program_model/deferred_findings.yaml -- CL-03-DF-02"
      - "specs/results/scorecards/score-drives-validation-sv04/toolchain_removal/20260812-sv04conf-LG-p1/scorecard.json"
      - "specs/results/scorecards/score-drives-validation-sv04/toolchain_removal/20260812-sv04conf-LG-p2/scorecard.json"
      - "examples/validation/ab/tests/test_journal_conformance.py -- TestPortContract over both adapters, TestDurableRecord over the durable ones only"
      - "specs/results/scorecards/close-the-loop/GOAL-loop-closes-once/CL-03/HARVEST-CL-03.md -- F6"
    why_out_of_scope: >-
      `CL-03-DF-02` is another ticket's finding at another ticket's scope and
      SV-04 does not edit it, on the precedent `RM-02` set for
      `architecture_tags.md` and `SV-02` set for `eval_scorecard.md`'s retirement
      sentence. The correction is recorded beside it instead.
    suggested_fix: >-
      For (a): annotate `CL-03-DF-02` with this measurement rather than closing it,
      since its weaker half is still true and is still the reason the caveat
      exists. For (b): the cheapest real fix is to require `what_was_run` to carry
      the mutant's DIFF or its find/replace pair, the way
      `examples/validation/ab/seeded_faults.toml` already does for the catalogue --
      a judge's prose description of a mutant is not a mutant.
    disposition: open
