  - id: SV-02-DF-04
    found_by: "SV-02, pricing a restored dimension by running `serve` against a scratch rubric"
    found_at_commit: "a527305"
    schedule_revision: 1
    severity: minor
    surface:
      production: []
      tla: []
      adapters: []
      test_graph: []
      workflow: ["examples/validation/scorecards/score_tools.py"]
    summary: >-
      A DIMENSION'S SCALE IS DEFINED IN A DICT WITH A DEFAULT, AND THE DEFAULT
      REPORTS AS AN ANCHOR-COUNT ERROR RATHER THAN AS A VERSION FACT.

      `TOP_SCORE_V4 = {"D2": 3, "D3": 4}` and `top_score` returns
      `TOP_SCORE_V4.get(dim, 4)` for any version at or above 4. The dict's own
      comment is unusually good -- it explains that deleting D2's anchor 4 costs
      the top of the scale and that "that cost is this dict rather than a
      sentence somewhere". The default is the gap: a dimension absent from the
      dict silently gets a 0-4 scale.

      Today no dimension is affected, because D1, D4 and D5 carry no live
      anchors at version 4 or above. It fires the moment anyone un-retires one.
      SV-02 priced a restored D4 on a 0-3 scale and `serve` refused with
      "D4 does not carry anchors 0-4 (got ['0', '1', '2', '3'])" -- a message
      about the rubric's anchor count when the cause is that the version map has
      no row for D4. The author is told to add anchors they deliberately did not
      write. With a 0-4 block the tool gives the right refusal, naming the
      retirement, which is the message that should have come first.

      This is not blocking and nothing depends on it now. It is filed because
      SV-03 and SV-07 may restore a dimension, and this is thirty seconds of
      confusion sitting exactly on that path.
    reproduction: >-
      Copy `references/eval_scorecard.md` to a scratch path, insert a
      `### D4 — behavior preservation` block carrying anchors 0-3 above
      `## The recorded notes`, and run
      `python3 examples/validation/scorecards/score_tools.py serve --rubric <scratch>`.
      -> exit 2, "D4 does not carry anchors 0-4 (got ['0', '1', '2', '3'])".
      Repeat with anchors 0-4 -> exit 2, "declares scorecard version 5 and still
      serves anchors for D4", which is the accurate refusal.
      `specs/results/scorecards/score-drives-validation/GOAL-validation-is-scorable/SV-02/analysis/carrier_cost.py`
      section 4 runs the second case on every invocation.
    evidence:
      - "examples/validation/scorecards/score_tools.py -- `TOP_SCORE_V4`, `top_score`, and the anchor-range check in `load_rubric`"
      - "specs/results/scorecards/score-drives-validation/GOAL-validation-is-scorable/SV-02/analysis/carrier_cost.py section 4"
    why_out_of_scope: >-
      SV-02 ships no production code. Nothing in the tree hits this path.
    suggested_fix: >-
      Check the retirement before the anchor range, so a dimension the version
      does not score is refused for that reason whatever anchors it carries.
      Alternatively give `TOP_SCORE_V4` a row per scored dimension and drop the
      default, so the dict states every scale rather than most of them -- which
      is what its own comment already claims it does.
    disposition: open
