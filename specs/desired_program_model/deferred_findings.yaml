      the two arms' faults are different faults, and reporting the pair as a
      difference the way PA-M11/PA-M12 are reported. Note that the goal's own
      metric ("the count of comparable cells where the arms AGREE") is what
      encodes the impossibility, so the metric moves with the catalogue.
    blast_radius: >-
