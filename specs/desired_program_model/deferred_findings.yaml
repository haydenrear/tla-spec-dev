  - id: AC-02-DF-01
    filed_by: AC-02
    filed_on: "2026-07-27"
    status: deferred
    severity: medium
    blocking: false
    title: >
      TlaSpecDevCli writes lastCommand and result from every action, so the
      model admits no architecture the reflexion check can measure
    reproduction: >
      python3 scripts/tla_spec_dev.py --spec-root specs analyze architecture
      specs/program_model/TlaSpecDevCli.tla specs/program_model/MC.cfg
      --code scripts --map specs/program_model/architecture_map.yaml
      -- reports architecture_scan = unmappable and does not run the diff:
      consumable_as_architecture is false (one component, Q = 0.000). Adding
      --components specs/program_model/architecture_components.yaml makes the
      check run, but only because the partition separates kill_test; the
      coarser three-component partition
      (surface / tickets / scanners) has a port between EVERY pair and reports
      unfalsifiable_coherence. Both reproduced 2026-07-27 on
      feature/122-ac02-reflexion-check.
    detail: >
      All fifteen commands write lastCommand and result, so the variable
      interaction graph is effectively complete and the emergent clustering
      finds one component at Q = 0.000. Every declared partition of the model
      then has a port from the component holding those two variables to every
      other component. Divergence is detectable only across pairs that exclude
      them, which today means only the pairs involving kill_test. The practical
      consequence: this repository's own architecture is measurable only in a
      narrow corner, and any future variable that every command writes closes
      that corner too. This is a fact about the MODEL, not a defect in
      analyze_architecture or architecture_reflexion, and it is the reason both
      AC-01 and AC-02 report unmappable on their primary target.
      Possible directions, none of them this ticket's to take: split lastCommand
      and result into per-component result variables; model the CLI surface as
      a component with no state of its own; or accept that the CLI lifecycle
      model is genuinely one component and record the architecture check as
      inapplicable to it. The third is a legitimate answer and should not be
      ruled out to make a scanner produce output.
    outside_conflict_keys: true
    owner_note: >
      AC-02's conflict keys list no TLA+ files (tla: []) and the epic is
      declared zero-model-delta for this ticket. Changing the model to make the
      scanner measurable would also be exactly the tail-wagging-the-dog move the
      advisory doctrine warns against. Raised for EV-01/EV-02 to score against,
      since "the toolchain cannot measure its own repository" is a fact those
      evals should carry.
    disposition: carried
    disposition_ticket: null
    disposition_note: >
      Carried, deliberately not ticketed. This is a statement about the
      repository's OWN model (lastCommand/result written by every action),
      not a defect in a shipped program. Fixing it means decomposing this
      repository -- tickets/023 -- and doing that inside a repair wave would
      change the very model every other measurement in this epic is baselined
      against. Recorded in NEXT-EPIC.md for the next epic.
  - id: AC-03-DF-01
    found_by: "AC-03"
    found_at_commit: "e73b7d1"
    schedule_revision: 1
    severity: minor
    surface:
      production: ["scripts/analyze_architecture.py"]
      tla: []
      adapters: []
      test_graph: []
    summary: >-
      The architecture descriptor encodes "not measurable with one component"
      two different ways in the same JSON payload, and one of them is
      indistinguishable from a real measurement. For a single-component
      partition, `measured.ownership.single_writer_violations` is `null` and
      `measured.ownership.single_writer_basis` carries the reason -- correct,
      and exactly the MF-027 discipline. But
      `measured.partition.components[0].owns` is the empty list `[]`, with no
      accompanying reason anywhere in the JSON. The TEXT renderer prints
      `owns: NOT MEASURABLE with one component -- every variable would be
      trivially owned`; the JSON does not. A consumer that branches on `owns`
      reads `[]` as "this component owns nothing", which is a plausible
      architectural fact, when the field means "the question is undefined
      here". That is the false-clean shape the whole command exists to refuse,
      surviving in the machine-readable half of the contract that AC-02 and
      AC-03 actually read.
    reproduction: >-
      python3 scripts/tla_spec_dev.py --spec-root specs analyze architecture
      specs/current/TlaSpecDevCli.tla specs/current/MC.cfg --format json |
      python3 -c "import json,sys; d=json.load(sys.stdin)['measured'];
      print('owns      =', d['partition']['components'][0]['owns']);
      print('violations=', d['ownership']['single_writer_violations']);
      print('basis     =', d['ownership']['single_writer_basis'])".
      Observed at e73b7d1: `owns = []`, `violations = None`,
      `basis = 'NOT MEASURABLE: ...'`. Compare the same run with
      `--format text`, which prints the NOT MEASURABLE sentence for `owns`.
    evidence:
      - "specs/.history/architectural-coherence-epic/ticket-003-AC-03/ticket/results/architecture_descriptor_emergent.json"
      - "specs/.history/architectural-coherence-epic/ticket-003-AC-03/ticket/results/implementation_brief_REFUSED_emergent.md"
    why_out_of_scope: >-
      scripts/analyze_architecture.py is AC-01's production surface and AC-02's
      live conflict key; AC-03's keys are prompts/, templates/,
      references/case_modules.md and SKILL.md. AC-03 defends against it in the
      consumer instead: Gate A of prompts/implementation_brief.md refuses to
      render before the field can be read, and the prompt names this field
      explicitly as one that lies.
    suggested_fix: >-
      Emit `owns: null` (not `[]`) whenever ownership is undefined for the
      partition, and add a sibling reason field the way `single_writer_basis`
      does for violations. Do not fix it by documenting the convention -- a
      consumer that must read prose to interpret a field is the problem.
    blast_radius: >-
      AC-02's reflexion check reads the same payload. Any consumer branching on
      a truthiness test over `owns` is affected.
    disposition: ticketed
    disposition_ticket: RP-01

  - id: AC-03-DF-02
    found_by: "AC-03"
    found_at_commit: "e73b7d1"
    schedule_revision: 1
    severity: major
    surface:
      production: ["scripts/analyze_complexity.py", "scripts/analyze_architecture.py", "references/architecture_coherence.md"]
      tla: []
      adapters: []
      test_graph: []
    summary: >-
      "This model does not decompose" is a statement about the SEARCH, not
      about the model, and the descriptor states it as though it were about the
      model. The emergent partition comes from greedy modularity maximization,
      which on specs/current/TlaSpecDevCli.tla terminates at the trivial
      one-component partition (Q = 0.000) and produces the report "this model
      DOES NOT DECOMPOSE ... There is no cut to name". Exhaustive enumeration
      of all 115,975 set partitions of that model's 10 variables, scored with
      the SHIPPED `analyze_complexity.modularity` and the SHIPPED three
      criteria, finds **2 partitions that meet all three criteria** -- the best
      at Q = 0.0029 with a crossing-action fraction of 0.188 (versus the 0.5
      rule). The shipped tool confirms it when the partition is handed back as
      a declaration: `--components` on
      `[corpus_gate, effect_conformance] | [the rest]` prints "MEASURED RESULT:
      the partition is a cut -- every criterion above is met." This matters
      beyond one number: references/architecture_coherence.md calls the
      non-decomposition of this repository's two real targets "the epic's most
      load-bearing measurement", and AC-03's non-vacuity precondition, AC-02's
      `unmappable` verdict, and the case for declared partitions all rest on
      it. The finding does not overturn the refusal doctrine -- refusing to
      invent a cut is still right, and a Q of 0.003 is negligible structure --
      but the wording claims more than greedy search establishes.
    reproduction: >-
      python3 specs/.history/architectural-coherence-epic/ticket-003-AC-03/ticket/results/ac03_df02_exhaustive_partition_search.py
      (checked in, ~40s, no dependencies beyond the repository). Observed at
      e73b7d1: "partitions examined: 115975 / partitions meeting ALL THREE
      criteria: 2 / shipped emergent partition: 1 component(s), Q = 0.000000,
      decomposes = False". Then confirm with the shipped CLI using the
      `--components` file printed in that script's docstring.
    evidence:
      - "specs/.history/architectural-coherence-epic/ticket-003-AC-03/ticket/results/ac03_df02_exhaustive_partition_search.py"
      - "specs/.history/architectural-coherence-epic/ticket-003-AC-03/ticket/results/ac03_df02_exhaustive_partition_search.txt"
    why_out_of_scope: >-
      Both scanner scripts are outside AC-03's conflict keys, and
      references/architecture_coherence.md is AC-02's key. AC-03 touches
      neither; its prompts consume whatever the descriptor reports.
    suggested_fix: >-
      Say what was searched. "Greedy modularity maximization found no partition
      meeting the criteria" is true and checkable; "this model does not
      decompose" is neither. Exhaustive search is tractable at this variable
      count and intractable in general, so the honest fix is the wording plus a
      named search method in `partition.origin`, not a better search. Do NOT
      fix it by adopting the exhaustive search and proposing the partition it
      finds -- naming a cut the project did not declare is the CD-01 failure
      this command exists to avoid.
    blast_radius: >-
      Wording only in the tool; but references/architecture_coherence.md,
      SKILL.md's architecture-descriptor paragraph, and AC-01's and AC-03's
      close-out summaries all repeat the stronger claim.
    disposition: fixed-inline
    disposition_note: >
      Epic owner amended references/architecture_coherence.md on the epic
      branch after the AC-03 merge: the greedy-vs-exhaustive distinction, the
      two passing partitions with Q = 0.0029 / crossing 0.188, the refusal to
      adopt exhaustive search or propose those partitions, and the
      Internal.tla-decomposes correction. Reproduction rerun independently by
      the owner (115,975 partitions examined, 2 meeting all three criteria).
      Not retrofitted into any dispatched ticket.
    disposition_ticket: null

  - id: EV-01-DF-01
    found_by: "EV-01"
    found_at_commit: "0f5a024"
    schedule_revision: 1
    severity: major
    surface:
      production: ["scripts/infer_action_params.py"]
      tla: []
      adapters: []
      test_graph: []
    summary: >-
      MF-029 parameter inference recovers ZERO of five action parameters on a
      plain set-membership model, and the consequence is not cosmetic: it makes
      the generated corpus unable to drive the program without help from the
      oracle. Every action of the EV-01 fixture model has the shape
      `Accept(i) == i \in inbox /\ inbox' = inbox \ {i} /\ accepted' = accepted
      \cup {i}`. The inference reports each one "UNRECOVERABLE -> UNCHECKED (no
      conjunct pins the parameter to a before-state variable, indexes a
      function with it, or writes it into the after-state)", so all 330
      generated cases carry `params={'i': UNCHECKED}`. An adapter then has no
      way to know WHICH item the transition acted on except by diffing
      `case.before` against `case.after` -- that is, by reading the oracle. The
      corpus keeps its power over wrong values, wrong fields, wrong counts and
      wrong statuses, and loses it entirely over the class "acted on the wrong
      item". The inference is honest about not knowing (it never fabricates),
      but nothing in the docs says that a set-based model gives up a whole
      fault class, and a reader who sees "330/330 cases carry arguments" will
      not conclude that none of them is checkable.
    reproduction: >-
      cd examples/validation/ex4_pipeline_coherent && PYTHONPATH=$PWD python3
      ../../../scripts/generate_cases_from_tlc_dump.py
      specs/program_model/Pipeline.tla specs/program_model/Pipeline.cfg
      --out /tmp/ev01gen --package pipeline_cases --view internal
      --actions-metadata specs/program_model/actions.yml
      --state-projector specs.program_model.tlc_projection:project_visible_state
      --output-projector specs.program_model.tlc_projection:project_adapter_output
      --dedupe projected ; then read
      /tmp/ev01gen/spec-unit/pipeline_cases/param_recovery_audit.md -- all five
      actions UNRECOVERABLE. A copy is kept at
      examples/validation/ex4_pipeline_coherent/evidence/param_recovery_audit.md.
    evidence:
      - "examples/validation/ex4_pipeline_coherent/evidence/param_recovery_audit.md"
      - "examples/validation/ex4_pipeline_coherent/specs/program_model/adapters.py"
    why_out_of_scope: >-
      scripts/infer_action_params.py is not in EV-01's conflict keys (which are
      the four examples/ directories), and EV-01 is a fixtures-and-predictions
      ticket that must not change the instrument it is building fixtures for.
    suggested_fix: >-
      Two separable parts. (1) Extend the inference to the set-membership
      shape: when a conjunct is `x \in v` and the after-state shows `v' = v \
      {x}` or `w' = w \cup {x}`, the parameter IS determined by the state pair
      whenever the difference is a singleton, and singleton-ness is checkable
      per case. (2) Independently of (1), say the consequence out loud where a
      reader will meet it -- the audit should state that an UNCHECKED parameter
      means the adapter must source the argument elsewhere, and that sourcing
      it from the after-state removes one fault class from the corpus's reach.
      (2) is worth doing even if (1) is judged out of scope, because the
      silence is what makes the gap dangerous.
    blast_radius: >-
      Any project whose model uses set membership rather than function indexing
      -- which the constrained TLA+ profile encourages -- and every kill-rate
      number measured on such a project.
    disposition: ticketed
    disposition_ticket: RP-02
    disposition_note: ""

  - id: EV-01-DF-02
    found_by: "EV-01"
    found_at_commit: "0f5a024"
    schedule_revision: 1
    severity: major
    surface:
      production: ["scripts/analyze_architecture.py", "scripts/architecture_reflexion.py", "references/architecture_coherence.md"]
      tla: []
      adapters: []
      test_graph: []
    summary: >-
      A DECLARED component partition that the descriptor itself reports as
      NOT DECOMPOSING is still consumed as an architecture, and the reflexion
      check will report `coherent` against it. `consumable_as_architecture`
      returns True for any declared partition regardless of the criteria
      (analyze_architecture.py:500 -- "a declared partition is consumable
      because the project named it"), so the three-criteria table stands
      between a project and a false clean only on the EMERGENT path. Measured
      on the EV-01 fixture: a four-component declared partition scores
      `crossing_action_fraction = 0.6` against the `<= 0.5` rule and prints
      "MEASURED RESULT: this model DOES NOT DECOMPOSE under this partition" --
      and the same partition with a matching map yields 3 convergences, 0
      divergences, 0 absences, `architecture_scan = coherent`, exit 0. The
      `unfalsifiable_coherence` refusal does not fire because three of the six
      component pairs are unported, so divergence was formally detectable. The
