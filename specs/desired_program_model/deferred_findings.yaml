      THE SUITE'S ONLY FINDING IN SEVEN ROUNDS.

      `tests/test_score_tools.py::test_the_committed_history_rendering_is_current`
      regenerates `HISTORY-ab_quota_ledger.md` and compares it to the committed
      copy. Scaffolding 24 UNFILLED skeletons -- which carry no measurement, no
      commit and no scores -- makes the committed rendering stale, because the
      regenerated one grows a "Scaffolded, not yet measured" section. The suite
      goes red on a round that has not measured anything yet.

      The test is CORRECT and its docstring states the right principle: "a
      committed rendering that nothing regenerates is the same class of stale
      artifact this ticket is about." The defect is the interaction: a round must
      either commit its skeletons and go red, or scaffold and fill in one
      unbroken step, or regenerate a rendering in the middle of its own
      measurement.

