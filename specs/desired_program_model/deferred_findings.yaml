      three versions stale, and reported "the card's content is unchanged" about
      a card that had in fact changed twice underneath it. It was caught only by
      comparing `git rev-parse HEAD` against the SHA named in the work order.

      THE FAILURE DIRECTION IS THE BAD ONE: a stale base looks exactly like a
      fresh one, and every check the ticket runs passes on it.
    reproduction: >-
      `git rev-parse epic/subtract-to-measure origin/epic/subtract-to-measure` in
      any checkout that has not pulled the epic branch since it was created. The
      two differ; `wt new <ticket> epic/<name>` uses the first.
    evidence:
      - "git rev-parse epic/subtract-to-measure -> 67b9943 while origin/ was 6aac1ec"
