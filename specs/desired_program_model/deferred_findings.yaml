      A completeness check that DERIVES the instrument set rather than listing
      it is a design question -- what counts as an instrument is exactly the
      judgement FI-02's registry preamble spends three paragraphs on, and a
      heuristic that scans for `sys.exit(1)` would sweep in every argparse usage
