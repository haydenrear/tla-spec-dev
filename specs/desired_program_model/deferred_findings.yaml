    summary: >-
      THE DEMONSTRATION TABLE RUNS THE COMPLEXITY INSTRUMENT ELEVEN TIMES ON
      EVERY `audit`, AND THAT IS THE PRICE OF NOT CACHING IT.

      R-H1's third clause re-derives the table from the tree on every run, which
      is the property that stops an authority row going stale -- and it costs
      ~1.1s of subprocess time per `audit`, `index` being unaffected. The
      alternative is a cached derivation, which is exactly the staleness the
      clause exists to prevent, so the cost is deliberate.

      It also makes `audit` depend on the declared scopes EXISTING in the tree
      it is run in. In a tree where they do not, the clause reports UNVERIFIED
      and checks nothing rather than reporting a violation -- so a green audit in
      such a tree says nothing about the table. Recorded so that is not read as
      a clean result.
    suggested_fix: >-
      Nothing, unless `audit` becomes hot. If it does, the honest move is a
      `--skip-architecture` flag that PRINTS that it skipped, never a cache.
    blast_radius: "`audit` runtime, and what a green audit means in a partial tree."
    disposition: open
