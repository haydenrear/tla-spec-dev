  - id: CD-08-DF-01
    found_by: "CD-08 ticket agent"
    found_at_commit: "fc59df1"
    schedule_revision: 1
    severity: minor
    surface:
      production: ["examples/run_distributed_history_validation.py"]
      tla: []
      adapters: []
      test_graph: []
    summary: >-
      The example validation wrapper's --mode local path still cannot pass
      end to end: its validate_kill_test step strictly asserts verdict
      "pass" while the recorded honest result for the pristine example is
      0.571 (4/7) against kill_rate_floor 0.8 (three surviving mutants,
      each with a true refinement pointer, documented in the docstring).
      Additionally the docstring's claim that "--mode local cannot reach
      this step today anyway" (blamed on a pre-pivot complexity-gate
      refusal) is stale after CD-08: the regeneration path now completes,
      so local-mode runs WILL reach and fail the kill test.
    reproduction: >-
      python3 examples/run_distributed_history_validation.py --mode local
      on a machine with tlc2/docker prerequisites; the run reaches
      validate_kill_test and exits at the strict verdict assertion.
    evidence: ["specs/tickets/CD-08/results/example_end_to_end.txt"]
    why_out_of_scope: >-
      CD-08's assigned findings are VAL-08/09/10/11/14/18 (the documented
      regeneration + adapter path, which now passes). Making the kill test
      clear its floor is real modeling work on the example (refine
      projections/ProjectOrder, orders/Checkout, responses/
      SubmitCreateAccount), deliberately deferred by MF-016/MF-023, and
      the epic's case_execution_rule excludes the kill test from ticket
      validation. Softening the floor or the assertion would be the exact
      degeneracy the kill test exists to prevent.
    suggested_fix: >-
      Either refine the example's internal model until the three recorded
      survivors die (the MF-023-era deferred work), or have the wrapper
      surface the recorded sub-floor result as an explicit known-result
      gate with the refinement pointers, and refresh the stale docstring
      sentence about local mode not reaching the step.
    blast_radius: "Anyone following the README's local-mode wrapper instructions end to end; the documented adapter-path commands and the k3d graph path are unaffected."
    disposition: pending
    disposition_ticket: null
