      TWELVE INDEPENDENT BLIND JUDGES ALL WROTE CITATIONS THE SCHEMA CHECK
      REJECTS, AND NOTHING THEY WERE SERVED TOLD THEM THE FORMAT WAS MACHINE
      CHECKED.

      `check --require-filled` over this round reports 180 problems across 24
