      acme 3 3'] while the ledger file on disk was empty... a 'real' adapter that
      is secretly a second fake passes as the real one."

      RM-03's version-4 judge reached the same place independently one ticket
      earlier: "having to enumerate behaviors made me run the swap against the
      shared suite, which is what surfaced that the shared suite pins nothing
      about the file on disk -- THE SINGLE MOST USEFUL FINDING ON THIS CARD."

