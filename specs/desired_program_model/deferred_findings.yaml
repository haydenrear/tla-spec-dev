    disposition_ticket: "https://github.com/haydenrear/tla-spec-dev/issues/169"

  - id: SM-06-DF-03
    found_by: "SM-06 (gap mutant M4, the control)"
    found_at_commit: "6aac1ec"
    schedule_revision: 2
    severity: minor
    surface:
      production: []
      tla: []
      adapters: []
      test_graph: []
      workflow: ["examples/validation/scorecards/score_tools.py"]
    summary: >-
      `check` DID NOT CATCH AN EDITED ANCHOR INSIDE A CARD. `audit` DID, AND FOR
      A DIFFERENT REASON THAN THE ONE ANYONE WOULD PREDICT.

      M4 edited an anchor inside a scaffolded `scorecard.md` so that the copy
      reproduced beside the score no longer agreed with the card. The predicted
      catcher was `rubric.digest`, which the card describes as what `check` uses
      "to refuse a skeleton scaffolded against a stale bar".

      `score_tools.py check specs/results/scorecards` returned EXIT 0. What went
      red was `audit` -- R-H4's seal digest, which covers the card's contents and
      refuses when they changed -- and the three suite nodes that run it.

      The distinction is real and worth writing down: `rubric.digest` is recorded
      AT SCAFFOLD TIME and compared to the rubric, so it detects a card scaffolded
      against a bar that has since moved. It does not read the anchors reproduced
      inside the card, so it cannot detect the card being edited afterwards. A
      card whose anchors were altered after scaffolding and BEFORE sealing passes
      `check` and is invisible to `audit` too.
    reproduction: >-
      Edit one anchor line inside any `specs/results/scorecards/**/scorecard.md`,
      then run `python3 examples/validation/scorecards/score_tools.py check
      specs/results/scorecards` (exit 0) and
      `python3 examples/validation/scorecards/score_tools.py audit` (exit 1, and
      only because that card is sealed).
    evidence:
      - "specs/results/scorecards/subtract-to-measure/SM-06/dup-mutants-before.json -- M4, score_tools_check exit 0"
      - "references/eval_scorecard.md -- `rubric.served_digest` is the load-bearing one"
    why_out_of_scope: >-
      Making `check` re-derive the anchors from the card text inside `scorecard.md`
      is new checking behaviour on the scorecard tool, which is SM-04's surface,
      and SM-06 adds no gate. The measurement is the contribution.
    suggested_fix: >-
      `check` already parses the rubric; have it also parse the anchors out of the
      `scorecard.md` it is checking and compare, reporting a mismatch the way it
      reports `PROSE-DRIFT`. Note the gap it does NOT close: an unsealed card
      edited between scaffold and fill has no digest anywhere.
    blast_radius: >-
      Unsealed cards between scaffolding and sealing. Sealed ones are covered by
      R-H4, which is what caught M4.
    disposition: carried
    disposition_ticket: "https://github.com/haydenrear/tla-spec-dev/issues/169"

  - id: SM-06-DF-04
    found_by: "SM-06 (building the check, and measuring what it misses)"
    found_at_commit: "6aac1ec"
    schedule_revision: 2
    severity: minor
    surface:
      production: []
      tla: []
      adapters: []
      test_graph: []
      workflow: ["tests/test_card_has_one_home.py"]
    summary: >-
      THE ONE-HOME CHECK CANNOT SEE A PARAPHRASE, AND SEVERAL OF THE COPIES IT
      WAS BUILT TO REPLACE WERE PARAPHRASES.

      `tests/test_card_has_one_home.py` derives every needle from the card and
      matches on content words, which finds a quotation that reworded its
      punctuation or its connectives. It does not find a restatement in someone
      else's words. Measured, not assumed: README stated one scoring rule in its
      own wording, sharing no content-word run with the card's wording of it, and
      the scanner did not flag that line. It was found by reading and deleted by
      hand, along with three others in the same class.

      A second blind spot: one scoring rule's lead sentence is three words, short
      enough that matching it would flag any sentence on the same subject, so it
      is dropped and that rule is not watched at all.

      Both are demonstrated by `test_the_blind_spots_are_declared_and_still_real`
      rather than only written down, so the day either stops being true the test
      says so.

      AND THE SCOPE IS FIVE CARVE-OUTS. One principle -- a record of what was true
      when it was written is not a live declaration -- with five instances. Each
      is argued in the file's docstring; none is executed as a rule. A sixth added
      without argument is how this becomes a whitelist.
    reproduction: >-
      `uv run --with pytest --with pyyaml python -m pytest
      tests/test_card_has_one_home.py::test_the_blind_spots_are_declared_and_still_real -q`
    evidence:
      - "tests/test_card_has_one_home.py -- 'WHAT THIS CANNOT SEE'"
      - "examples/validation/instruments/instruments.toml -- one-home-tripwire"
    why_out_of_scope: >-
      Widening the matcher to catch a paraphrase means matching ordinary English,
      which trades a real blind spot for false positives on a check whose whole
      value is that nobody turns it off. R2 says report the inability rather than
      buy coverage with noise.
    suggested_fix: >-
      None mechanical that is worth its false positives. What would work is a
      judged pass: ask a blind agent to find restatements of the card, which is
      the channel that has produced almost every finding worth having in this
      project and which no scanner has beaten.
    blast_radius: >-
      A paraphrase of the card can still land anywhere and go stale. The measured
      failure history -- two wrong rows in one charter -- was a table, which this
      check does catch.
    disposition: carried
    disposition_ticket: "https://github.com/haydenrear/tla-spec-dev/issues/169"

  - id: SM-06-DF-05
    found_by: "SM-06 (provisioning its own worktree)"
