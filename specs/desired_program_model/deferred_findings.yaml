  - id: SM-04-DF-06
    found_by: "SM-04 blind judge, v3 pass 1 (unprompted, in Disclosures)"
    found_at_commit: "2098d55"
    schedule_revision: 2
    severity: major
    surface:
      production: []
      tla: []
      adapters: []
      test_graph: []
      workflow: ["references/eval_scorecard.md"]
    summary: >-
      D2 CARRIES A 2-TO-4-POINT CRACK BETWEEN TWO READINGS OF ITS OWN ANCHOR
      LADDER -- WIDER THAN THE D5 CRACK scorecard_version 3 EXISTS TO RECORD --
      AND IT WAS FOUND BY A JUDGE WHO HAD NOT BEEN TOLD ANY OF THAT.

      D2 anchor 0 is "Complexity is unmeasured, or measured and ignored". D2
      anchor 2 is "The design's complexity is proportional to its behavior". The
      card's global rule is SCORE THE LOWEST ANCHOR THE ARTIFACT FULLY SATISFIES.
      Read strictly cumulatively -- each anchor requiring the ones beneath it --
      an artifact that measures no complexity at all FAILS to escape anchor 0 and
      is forced to 0, whatever its shape. Read as the dimension's own `read_first`
      implies -- the judge reads the MEASURED DESCRIPTOR, which the harness
      supplies, and then judges the shape -- the same artifact is a 2.

      The judge scored 2 and filed the alternative:

        "read strictly cumulatively, anchor 2 sits above anchor 0's 'complexity
         is unmeasured', and this artifact measures none -- forcing 0. I went
         with 2 per the dimension's own read_first, but this is a 2-TO-4-POINT
         SPREAD on one artifact depending on how a judge reads cumulativity -- a
         far wider crack than the D5 one this card version exists to record."

      WHY THIS MATTERS MORE THAN IT LOOKS. D2 = 2 on 31 of 31 cards ever written
      about `ab_quota_ledger`. `FI-06-DF-05` establishes that anchor 3 is
      unreachable for a greenfield artifact, which explains the CEILING. This
      explains the FLOOR: every judge so far has taken the non-cumulative reading
      and landed on 2, and nothing on the card tells them to. The constant is
      pinned from both ends by the anchor text, and neither end has been chosen
      deliberately.
    reproduction: >-
      `references/eval_scorecard.md`, D2's five anchors and the "Score the LOWEST
      anchor the artifact fully satisfies" instruction, against
      `specs/results/scorecards/ports-as-adapters/blind/artifact_U/`, which
      records no complexity measurement of any kind. Then the Disclosures of
      `specs/results/scorecards/subtract-to-measure-sm04-rescore-v3/ab_quota_ledger/20260806-sm04v3-R-p1/scorecard.md`.
    evidence:
      - "references/eval_scorecard.md -- D2 anchors 0 and 2, and the read_first preamble"
      - "specs/results/scorecards/subtract-to-measure-sm04-rescore-v3/ab_quota_ledger/20260806-sm04v3-R-p1/scorecard.md -- Disclosures, rejected item 5"
      - "specs/desired_program_model/deferred_findings.yaml -- FI-06-DF-05"
    why_out_of_scope: >-
      SM-04's prohibition is explicit and this is exactly what it forbids.
      REWRITING D2's ANCHORS PRE-DECIDES SM-05. The whole epic exists to find out
      whether D2 can move when given a subject with a real before and after; an
      anchor edited now would make that result a fact about the edit. `do_not_
      retire_untested_rule` and "never edit a target to match a result" both bind
      here, and the SM-04 brief names D2 anchor 3 specifically.
    suggested_fix: >-
      NOT BEFORE SM-05, and then only with a version bump and a measured
      discontinuity. The cheapest honest candidate is not an anchor edit at all:
      state on the card whether the ladder is CUMULATIVE, once, for all five
      dimensions. D1 and D4 spell their inheritance out in the anchor text
      ("3, and ..."); D2's anchors 0-2 do not, and D5's do not either. The
      ambiguity is in what the card leaves unsaid about its own reading rule, not
      in any one anchor's words -- which is why it can be fixed without moving a
      bar, and why it must still be measured when it is.
    blast_radius: >-
      Every D2 score in the repository, in both directions. It does not falsify
      the 31-of-31 constant; it removes one of the two explanations for it that
      anybody had checked.
    disposition: carried
    disposition_ticket: "https://github.com/haydenrear/tla-spec-dev/issues/169"
    disposition_note: >-
      Carried to epic/subtract-to-measure SM-05 (#169), which is the ticket that
      scores D2 on a real before and after. SM-05 must read this BEFORE scoring
      and must NOT act on it during the measurement.

  - id: SM-04-DF-07
