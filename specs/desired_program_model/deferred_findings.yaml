    summary: >-
      THE OPERATOR'S PERSISTENT AUTO-MEMORY AND ENVIRONMENT BLOCK ARE IN EVERY
      SUBAGENT'S CONTEXT BEFORE IT READS ANYTHING, AND THEY NAME THIS PROJECT'S
      EPICS, ITS OUTCOMES AND ITS SCORECARD'S MEASURED INSTABILITY. NO DISPATCH
      IN THIS PROGRAMME HAS EVER NAMED THIS LEAK, AND NO FORBIDDEN LIST CAN
      REACH IT, BECAUSE IT REQUIRES NO TOOL CALL.

      Four of four blind agents in SV-05's 2x2 reported it without being asked
      about it specifically. One quoted the memory file verbatim -- "up to 2
      points per judge move on byte-identical artifacts" -- and named
      `single-example generalisation`, `ports-as-adapters`, `subtract-to-measure`
      and `architectural-coherence`. Verified by the operator against
      `~/.claude/projects/-Users-hayde-IdeaProjects-tla-spec-dev/memory/MEMORY.md`,
      whose entries include, in the summary line a subagent sees:

        "Scorecard D1/D4/D5 unstable -- measured 2026-08-05: up to 2 points per
         judge move on byte-identical artifacts; its D2/D3 claim is CORRECTED by
         the next two entries"
        "Subtract-to-measure epic -- merged to main 2026-08-07; D2 proven able to
         measure, D3 shown contested with nothing computing it"

      A JUDGE DISPATCHED TO SCORE D2 AND D3 BLIND HAS, IN CONTEXT BEFORE IT
      OPENS THE PACKET, A SENTENCE TELLING IT WHICH DIMENSIONS THIS PROJECT
      BELIEVES ARE STABLE AND WHICH IT BELIEVES ARE CONTESTED.

      The environment block additionally hands every subagent this repository's
      absolute path, its branch, its clean/dirty status and THE SUBJECT LINES OF
      ITS FIVE MOST RECENT COMMITS -- several of which state epic outcomes in
      words ("the loop closed, and a stranger ran it"; "the card can measure, and
      the premise was false").

      Two of the four agents said in terms that they could not claim it had no
      influence on their answer.

      THIS IS STRICTLY WORSE THAN `SV-01-DF-03`. That finding filed `git status`
      as a blinding leak the dispatches never named; a forbidden list can name
      `git status`. Nothing a dispatch says can remove a block the harness
      injects before the dispatch is read. IT APPLIES RETROACTIVELY TO EVERY
      BLIND ROUND THIS PROGRAMME HAS RUN: CL-04's adopter probe and census,
      SV-01's four judges, SV-04's four judges, SV-06's survey, and SV-05's own
      four agents.
    reproduction: >-
      Dispatch any subagent with a prompt that asks it to report, verbatim,
      everything in its context before its first tool call. Compare against
      `~/.claude/projects/<project>/memory/MEMORY.md` and against the environment
      block. SV-05's four `OWNER-NOTES.md` files under its scratch path each
      carry a `## Contamination` section written independently.
    why_out_of_scope: >-
      SV-05 files findings and fixes nothing. The leak is a property of the
      harness that runs the agents, not of any file this repository ships, and
      the two candidate mitigations (below) are both the owner's call.
    suggested_fix: >-
      There is no fix inside this repository, and pretending otherwise is worse
      than naming it. Two honest options. (a) STOP CLAIMING BLINDNESS THIS ROUND
      DOES NOT HAVE: every dispatch and every RESULT should state that the judge
      carried the operator's project memory, so the claim matches the fact --
      zero cost, and it is what R3 already requires of a scope. (b) Run judges
      from a harness home with no project memory bound, and record the memory
      file's digest in the card beside the served digest, so a reader can tell
      what a judge was carrying. Option (a) is owed immediately and independently
      of (b).
    blast_radius: >-
      Every claim in this programme that rests on a judge being blind. It does
      not obviously point in the direction of any particular score, and this
      finding does NOT assert that any published number is wrong. What it asserts
      is that the word "blind" in eight epics of dispatches has meant "blind to
      the packet and to our source", never "blind to our conclusions" -- and that
      the difference was never measured because it was never noticed.
    disposition: open
