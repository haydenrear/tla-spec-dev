      was real when filed: pre-EVAL-SUPPRESS baselines had not been re-affirmed
      and nothing in the record said so. PA-03 has now re-derived the whole
      table on the post-EVAL-SUPPRESS driver and it holds -- over the 77 cells
      its tables share with the repaired run, ZERO cells moved, on BOTH arms.
      The finding asked for exactly this and it came back clean.
      `ab-cells-identical-56` therefore moves under_review -> current with
      reaffirmed_at = f052d3c.

      ONE STEP OF THE REFUTATION'S OWN ARITHMETIC DOES NOT REPRODUCE, recorded
      because a denominator exists in order to be reproducible. The refutation
      reached 56 as "excluding controls leaves 8 non-control mutants x 7
      instruments". The three declared CONTROLS are M07, M09 and N01; the three
      rows excluded as not-the-same-diff are M07, M08 and M10. Both sets have
      size three, so both give 8 x 7 = 56 -- the agreement is in size, not in
      construction. The two rules are separable on HP-06: "non-control" gives
      6 x 7 = 42 and does NOT reproduce the sealed 49, while "not the same diff"
      gives 7 x 7 = 49 and does. Nothing about the refutation's conclusion
      changes: M07 is out of the denominator under either rule.

      WHAT THE TOOL COULD AND COULD NOT DO. `score_tools.py audit` correctly
      reported that the claim straddled an unreaffirmed instrument change, and
      that is what surfaced the question. It cannot tell whether a change
      TOUCHED the cells a claim is about, because it reads claims and commits,
      not kill tables. A straddle is a prompt to go and look, never a finding on
      its own -- and PA-05 published it as a finding without going and looking,
      at data sitting in a commit it had already declared an instrument change.
      That limit is now stated in references/eval_scorecard.md under R-H3.
