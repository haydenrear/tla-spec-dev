    summary: >-
      THE CARD GIVES D4'S TIER INSTABILITY AS AN INDEPENDENT REASON FOR RETIRING
      IT, AND IT IS NOT INDEPENDENT -- IT IS A SYMPTOM OF THE CLAUSE THE SAME
      VERSION DELETED FROM D2.

      `references/eval_scorecard.md:216` explains the version 4 retirements one
      line each, and D4's reads "N-D4 tier-split on 4 of the 8 judge groups
      scored by both `opus` and `sonnet`, more than any other dimension." Read
      beside the other two reasons -- N-D1's top anchor needing cases derived
      from the model, N-D5's independence from architecture -- it presents
      instability as a defect of the dimension rather than of one rung.

      MEASURED OVER EVERY D4 TIER-SPLIT GROUP IN THE SEALED RECORD: in 5 of 5
      groups, EVERY card on the lower side names the model clause at anchor 3 as
      its ceiling. The three `reading-discipline` arms are the sharpest -- D, M
      and N, a two-point gap on each, and all six `sonnet` cards refuse anchor 3
      in almost the same words ("a mutation check is not a model-derived check";
      "there is no TLA+ spec or generator anywhere in this tree"; "everything
      here is hand-written") while all six `opus` cards read the same clause as
      an illustration, clear it and go to 4. Four of those six lower-tier cards
      report a break they caught in their own prose BEFORE refusing the rung.

      THIS IS THE MECHANISM RM-02 PROVED FOR D2's ANCHOR 4, NOW SHOWN FOR D4's
      ANCHOR 3. RM-02 called the D2 case "the single strongest evidence in this
      ticket that the local clause is what makes the card local", and measured
      four of four `sonnet` judges naming the model clause against zero of four
      `opus`. D4 is the second instance, in the same direction, by the same tier,
      and nobody looked for it -- so a clause-level defect was recorded as a
      dimension-level one.

      AND THE FIGURE ITSELF HAS MOVED. "4 of the 8 judge groups" was true when
      written; at `a527305` the corpus is 87 cards and D4 splits 5 of 9. The
      sentence is a `COUNT-MOVED` shape that `scope` cannot see, because a figure
      counting judge groups carries no bind-and-value form.

      WHY IT MATTERS BEYOND THE PAGE: SV-02 was asked whether validation is
      scorable and the record says the toolchain grading sits in three clauses,
      not two dimensions. A reader of the card today is told D4 was unstable
      full stop, which argues against the whole ladder rather than against one
      rung, and that reading would foreclose the one experiment
      `references/scoring_validation.md` section 9 says must run before any rung
      is restored.
