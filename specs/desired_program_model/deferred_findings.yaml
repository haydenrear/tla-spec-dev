  - id: VAL-06
    found_by: "validation-ex1-run1"
    found_at_commit: "9a80f7b"
    schedule_revision: 1
    severity: major
    surface:
      production: ["scripts/analyze_complexity.py"]
      tla: []
      adapters: []
      test_graph: []
    summary: >-
      Domain resolution (_set_size) handles only set literals, int ranges,
      BOOLEAN, unions thereof, and cfg-constant names. A standard shape like
      `tasks \in [Names -> TaskStatus]` with TaskStatus defined in an
      EXTENDS-ed module resolves to bound UNKNOWN even though the invariant
      is found. The honest-unknown path works (no silent 1), but the
      resolver is narrower than the standard patterns real users write, and
      the limitation is undocumented.
    reproduction: >-
      Model with TypeInvariant using a function set over a module-defined
      status set; scan: bound = UNKNOWN. Inlining the status-set literal in
      the invariant resolves it. Expected: module-defined set operators
      resolved (profile permitting) or the limitation documented.
    evidence: ["examples/validation/runs/ex1-run1/scoring.md"]
    why_out_of_scope: "Post-epic validation finding; filed, not fixed."
    suggested_fix: >-
      Resolve zero-arity set-operator definitions transitively (the same
      machinery as CD-01's invariant alias resolution) before giving up, and
      document what the resolver can see.
    blast_radius: "scripts/analyze_complexity.py domain resolution; F3 accuracy on real models."
    disposition: pending
    disposition_ticket: null
  - id: VAL-07
    found_by: "validation-ex1-run1"
    found_at_commit: "9a80f7b"
    schedule_revision: 1
    severity: major
    surface:
      production: ["scripts/analyze_complexity.py"]
      tla: []
      adapters: []
      test_graph: []
    summary: >-
      The R/W matrix attributes variable writes to the syntactic primer, so
      wrapper actions that prime a variable only through a helper operator
      (e.g. MarkCli(cmd, task, exit) doing the lastCli' assignment) vanish
      from the matrix, dense-column list, and action count: 9 CLI actions
      collapsed to 4 rows until the assignments were inlined. Understates
      action counts, which also feeds fitness-function facts.
    reproduction: >-
      External view whose actions call a shared helper for the primed
      variable; scan and compare the action columns with the module's
      disjuncts. Observed: helper listed as the action, wrappers absent.
      Expected: attribution to the top-level actions (or a documented
      limitation).
    evidence: ["examples/validation/runs/ex1-run1/scoring.md"]
    why_out_of_scope: "Post-epic validation finding; filed, not fixed."
    suggested_fix: >-
      Expand helper-operator bodies when attributing primed variables (same
      transitive-resolution direction as CD-01/F1), or document the
      inline-your-primes convention.
    blast_radius: "R/W matrix, dense columns, action_count, component actions; fitness facts derived from them."
    disposition: pending
    disposition_ticket: null
