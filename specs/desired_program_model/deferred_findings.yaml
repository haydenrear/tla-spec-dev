  - id: FI-01-DF-04
    found_by: "FI-01 (self-audit: what did I ship that nothing executes?)"
    found_at_commit: "2cce78c"
    schedule_revision: 1
    severity: minor
    surface:
      production: []
      tla: []
      adapters: []
      test_graph: []
      workflow: ["examples/validation/ab/check_catalogue.py"]
    summary: >-
      `PORT_REGION` IS A TRANSCRIPTION OF THE GENERATOR'S OUTPUT, NOT A READING
      OF IT, AND IT IS THE ONE DECLARATION FI-01 ADDED THAT NOTHING EXECUTES
      AGAINST ITS SOURCE.

      The probe's region test decides whether a control is seeded where a
      port-scoped instrument can see it. The region it uses is the constant
      `("closed", "committed", "ledger_lines")`, typed out from what
      `tla_spec_dev.py generate cases --port-cases only` prints for this
      fixture's one port. `tests/test_falsifiable_controls.py` pins the constant;
      NOTHING compares it against the generator.

      So if the manifest declares a second port, or `LedgerAppendPort`'s region
      grows a variable, the probe's region test silently NARROWS: a control
      seeded in the new part of the region would be reported OUT_OF_REGION and a
      correct control would be called broken. The failure direction is the safe
      one -- it produces a false RED, not a false green -- and it is still the
      `declaration_executability_rule`'s own shape, filed by the ticket that
      quotes that rule three times.
    reproduction: >-
      `grep -n 'PORT_REGION' examples/validation/ab/check_catalogue.py` -> a
      literal tuple. `python3 scripts/tla_spec_dev.py --spec-root specs generate
      cases examples/validation/ab/model/QuotaLedger.tla ... --port-cases only`
      -> "region {closed, committed, ledger}". Nothing joins them.
    evidence:
      - "examples/validation/ab/check_catalogue.py -- PORT_REGION"
      - "examples/validation/ab/model/spec_manifest.yaml -- effects.components.ledger.ports"
    why_out_of_scope: >-
      Reading the region from the generator means either generating a corpus
      inside the probe -- which turns a seconds-long probe into a TLC run and
      makes it unusable as the cheap re-runnable check it is for -- or teaching
      `check_catalogue.py` to compute a port's derived region from the manifest,
      which is duplicating the generator's logic in a second place. Both are
      designs, not fixes, and both are larger than the ticket.
    suggested_fix: >-
      Have the generator WRITE the region it computed into the corpus package
      (it already writes `case_coverage.json` beside the cases), and have the
      probe read it from there when a corpus is available and fall back to the
      constant with a printed note when one is not. The declaration then has one
      producer and one consumer and a rename breaks the consumer.
    blast_radius: >-
      The probe's region test, on any future fixture with a different port
      shape. Nothing today: this fixture declares one port and its region is
      measured to be the three names the constant carries.
    disposition: carried
    disposition_ticket: "https://github.com/haydenrear/tla-spec-dev/issues/167"
    disposition_note: >-
      Carried to epic/subtract-to-measure SM-03 (#167): cut or repair the hollow instruments and fix the registry that cannot see an omission. DELETION IS THE DEFAULT -- an instrument that cannot be shown to fail is not an instrument.

  - id: FI-02-DF-01
    found_by: "FI-02 (the enumeration itself: what does each mode CLAIM to watch, and can it report it?)"
    found_at_commit: "51fe73d"
    schedule_revision: 1
    severity: major
    surface:
      production: []
      tla: []
      adapters: []
      test_graph: []
      workflow: ["examples/validation/ab/check_catalogue.py"]
    summary: >-
      `--verify-suite` CANNOT REPORT THE ONE THING IT IS NAMED FOR. A mutant
      whose recorded `predicted_suite` disagrees with what the suite actually
      does prints `*** DISAGREES ***` and is then NOT appended to `problems`,
      so the run exits 0. Only two conditions reach `problems`: a missing
      anchor tree, and a control run that is already red on the UNMUTATED tree
      -- neither of which is a prediction.

      Every `predicted_suite`, `predicted_corpus_whole`, `predicted_corpus_neg`
      and `predicted_corpus_port` annotation in `seeded_faults.toml` is
      therefore UNCHECKED PROSE. They read like commitments -- and PA-06's
      `PREDICTIONS-PA.md` protocol treats commitments-before-dispatch as the
      thing that makes a measurement honest -- but nothing compares them to a
      measured cell and fails.

      THIS IS THE SAME SHAPE AS `PA-06-DF-07`(b) AND `PA-06-DF-11`, in a third
      place: an instrument whose verification runs and whose verification
      cannot come out wrong. It is the fourth mode of the same script; the
      first three (integrity, `--controls`, `--demonstrate`) all can and do go
      red, which is why this one was not noticed.
    reproduction: >-
      `sed -n '764,865p' examples/validation/ab/check_catalogue.py` -- the
      `*** DISAGREES ***` branch at ~834-839 prints and does not append, and the
      closing comment at ~860-864 says so. Contrast the two `problems.append`
      calls in the same function. Enumerated in
      `examples/validation/instruments/instruments.toml` as
      `suite-verification`, classification `demonstrated-cannot-fail`.
    evidence:
      - "examples/validation/ab/check_catalogue.py -- verify_suite"
      - "examples/validation/ab/seeded_faults.toml -- every predicted_* annotation"
      - "examples/validation/instruments/instruments.toml -- suite-verification"
    why_out_of_scope: >-
      FI-02's slice is the ENUMERATION plus the tripwire it was explicitly
      chartered to fix. Making `--verify-suite` refuse a wrong prediction adds a
      refusal to an instrument this ticket is measuring with, during the
      measurement, which is both halves of the forbidden act at once. It is also
      not obviously the right repair: a prediction that turns out wrong is a
      FINDING about the predictor, and the project's own doctrine is that
      findings are reported, not gated on.
    suggested_fix: >-
      Do not make it refuse. Make it REPORT a count -- "N of M recorded
      predictions disagreed with the measured cell", by mutant id, in the
      artifact -- and let a ticket read it. If a gate is ever wanted, it belongs
      to the round's protocol (a prediction sealed before dispatch that later
      disagrees is a scorecard input), not to the fixture harness.
