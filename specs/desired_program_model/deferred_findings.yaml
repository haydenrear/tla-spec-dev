    summary: >-
      THE CHEAP REPLACEMENT FOR THE AFTER-RUN IS UNSOUND IN THE DIRECTION IT IS
      USED, AND IT WILL PRICE RM-03's REMOVALS AT ZERO IF RM-03 USES IT.

      `removal_census.py discriminating()` decides whether a re-run could say
      anything by set-differencing DETECTOR NAMES:

          surviving = [d for d in kills if d not in deleted_detectors]
          if surviving:  ->  NON-DISCRIMINATING, "DIES after the cut was
                             entailed before the cut was made"

      A surviving detector NAME is not a surviving kill. Two ways it fails:

      (a) `pytest-full` is the whole suite and no removal in this repository's
      history has ever deleted it. Any fault it kills is NON-DISCRIMINATING by
      arithmetic before anything runs. That is 5 of the 9 rows in the sealed
      before-table, and a sixth goes the same way through `instrument-registry`.
      The remaining three had no kill at all. The 0 of 9 is therefore a property
      of the classifier's granularity at least as much as of the removals.

      (b) A detector can survive by NAME and lose the KILL, because a removal
      can leave a node id in place and replace its BODY. SM-03 did exactly that:
      `tests/test_instrument_demonstrations.py::test_the_named_instruments_are_all_enumerated`
      has the same file, the same function and the same node id at `bf0fb29~1`
      and `bf0fb29`, and a different check inside it.

      DEMONSTRATED, ON A REAL REMOVAL. `RM-01-RF-1` -- a registered instrument
      outside the derived enumeration scope silently loses its row -- is
      measured DIES at `bf0fb29~1` and SURVIVES at `bf0fb29`. `discriminating()`
      run unmodified over the same sealed artifacts reports NON-DISCRIMINATING.

      THE ASYMMETRY, which is the repair: survivorship over a before-table is
      SOUND towards SURVIVES and UNSOUND towards DIES. If no killing
      (detector, node) survives, every kill the fault had is gone and that is a
      proof from the before-run alone. If some killing node survives, NOTHING
      follows. There is no such thing as an entailed DIES.
    reproduction: >-
      uv run --with pytest --with pyyaml python -m pytest
      tests/test_price_removal.py::test_the_shipped_classifier_calls_a_real_priced_removal_entailed -q
    evidence:
      - "specs/results/scorecards/portable-substrate/GOAL-removal-can-be-priced/RM-01/residual-before-bf0fb29p.json"
      - "specs/results/scorecards/portable-substrate/GOAL-removal-can-be-priced/RM-01/residual-after-bf0fb29.json"
      - "specs/results/scorecards/portable-substrate/GOAL-removal-can-be-priced/RM-01/audit-shipped-classifier.json"
      - "examples/validation/gap_mutants/price_removal.py"
    why_out_of_scope: >-
      `discriminating()` is RD-02's shipped instrument in a file RM-01 does not
      own, and `measurement_rule` forbids editing a target during a measurement.
      RM-01 built the sound reading beside it and left the unsound one running,
      visible, so the disagreement is inspectable.
    suggested_fix: >-
