    summary: >-
      THE SEEDING RULE STRUCTURALLY EXCLUDES THE FAULTS THAT COULD PRICE A
      REMOVAL, AND THE EXCLUSION WAS DISCLOSED AND NEVER READ AS ONE.

      A gap mutant can report that a removal cost something only if EVERY
      detector that killed it is a detector the removal deletes. Computed over
      SM-01's sealed before-table, that is 0 of 9 -- each mutant was already
      dying on a detector that outlived its cut, or was not dying at all. The
      `DIES` verdicts SM-02 and SM-05 re-ran and published were entailed by the
      before-table before either cut was made.

      The mechanism is the re-runnability requirement. A mutant must be
      applicable to the AFTER tree, and a fault only the removed mechanism
      catches usually lives on a surface the removal deletes. SM-01 named
      exactly such a fault for the ports machinery -- dropping `fake =` from a
      `[ports.*]` table, "caught today by `render_oracle_statement`" -- and put
      it in `[[not_seedable]]` with the reason, on the record, before anything
      was cut.

      Nothing read that as the reason the table could only come out one way, and
      "the measured price of removing the `[ports.*]` machinery is ZERO" was
      published as a measurement rather than as an entailment.
    reproduction: >-
      python3 examples/validation/removal_census/removal_census.py discriminate
      -- 0 of 10 rows DISCRIMINATING. The excluded fault is the third
      `[[not_seedable]]` row of gap_mutants.toml.
    evidence:
      - "examples/validation/gap_mutants/gap_mutants.toml -- [[not_seedable]], the `fake =` key"
      - "specs/results/scorecards/reading-discipline/GOAL-apparatus-priced/discriminating-power.json"
      - "specs/results/scorecards/subtract-to-measure/SM-02-RESULTS.md -- the ZERO headline"
    why_out_of_scope: >-
      The fix is a change to how removals are seeded, which is a design decision
      for the epic rather than a repair a measurement ticket makes to the
      catalogue it is measuring.
    suggested_fix: >-
      Classify discriminating power from the before-table and REPORT IT with the
      verdict, so an entailed `DIES` reads as entailed. `removal_census.py
