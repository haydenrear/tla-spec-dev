      `UNBLINDING.md` is in the planned path list, it already exists, and the
      collision check refuses the WHOLE BATCH on it alone.

      The refusal is deliberate and its reasoning is sound for the case it was
      written for -- "fresh random labels would otherwise write new card
      directories beside a measurement and silently orphan its key". It does not
      distinguish that case from a second subject scaffolded under EXPLICIT
      `--labels`, where no key is orphaned because no label is drawn.

      RD-03 scaffolded six subjects by renaming `UNBLINDING.md` to
      `UNBLINDING-rd03-<label>.md` between calls, which is the escape the tool's
      own error message names ("move or rename the existing run"). It works and
      it is hand-sequencing, which is the class `FI-06-DF-11(c)` is already open
      on.
