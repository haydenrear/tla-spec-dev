    summary: >-
      `GOAL-cases-drive-ports` CANNOT BE MET BY THIS EXPERIMENT. THE NULL IS
      ENTAILED BY THE CATALOGUE DESIGN, AND THE DESIGN IS THE RIGHT ONE.

      An exhaustive observational fingerprint -- every command sequence of
      length 4 over a 13-action alphabet, 28,561 sequences, 2 tenants, quota 2,
      full projection after every step, run per arm per mutant -- measures the
      three arms' MUTATED trees to be observationally IDENTICAL ON 10 OF 11
      ROWS. Only `M07` on arm B differs, and that row is a declared substitute.

      Two trees with the same observational fingerprint cannot be told apart by
      any black-box instrument. So "the arms' per-mutant verdicts are identical"
      is a CONSEQUENCE OF THE RE-ANCHORING SUCCEEDING, not a measurement about
      detection, and THE EXPERIMENT CAN ONLY PRODUCE A DIVERGENCE WHERE THE
      RE-ANCHORING FAILS.

      The obvious rival explanation is measured FALSE: the trees are not
      near-identical. 78 vs 151 vs 202 code lines; `dict[str, bool]` vs `set`
      for `closed`; plain tuple vs dataclass vs derived computation for a held
      reservation.

      AND THE RULE THAT PRODUCES THIS IS CORRECT AND WAS ADOPTED FOR A GOOD
      REASON. EVAL-RERUN's blind-author channel states it: hold the `semantic`
      equal across arms "so that a per-arm score compares two implementations
      rather than two catalogues". That is exactly right for comparing
      DETECTION, and it makes comparing VALIDATION-SHAPE impossible in the same
      table.

      SECOND, SMALLER: the strictly comparable denominator is too small. The
      exclusion of `M08` and `M10` rests on the SYNTACTIC rule `seeded_by =
      "addition"`. The fingerprint measures both to be the SAME EXPERIMENT on
      all three arms, so the comparable set is 10 of 11 rows and the result is
      80 OF 80 IDENTICAL on every pairing rather than 64 of 64. PA-06 reports
      both and uses 64 -- the number the plan and the ledger carry -- because a
      denominator is not swapped after a result is known.
    reproduction: >-
      The fingerprint script and its output are described in
      specs/results/scorecards/ports-as-adapters/channels/ADVERSARIAL.md, AD-F1
      and AD-F2. Cheap partial check: the three arms' `kill-table-arm-*.json`
      agree on 64 of 64 strictly comparable cells and on 80 of 80 under the
      measured rule.
    evidence:
      - "specs/results/scorecards/ports-as-adapters/channels/ADVERSARIAL.md"
      - "specs/results/scorecards/ports-as-adapters/GOAL-cases-drive-ports/results/"
      - "specs/results/scorecards/hexagonal-prompting-rerun/GOAL-catch-bugs/README.md -- the same-semantic rule"
