      The flip is not an architecture. The report that calls the partition a cut
      lists `lastCommand` and `result` as single-writer violations ACROSS THE
      SAME BOUNDARY on the next page -- the two god-variables whose presence was
      the entire reason the model was a blob. And Q = 0.0116 is 26x below the
      Newman threshold of 0.3 that the tool itself prints and deliberately does
      not apply; the `modularity_q` criterion is `Q > 0`, which 0.0116 clears
      exactly as 0.0 did not.

      This is a measurement of the SCANNER, not of the repository. AC-03
      independently measured 2 of 115,975 partitions of this model meeting all
      three criteria at Q = 0.0029, so a verdict a single variable can invert is
      consistent with what AC-03 already recorded -- but AC-03 recorded it as a
      property of the partition search, and this is the shipped default path a
      user gets with no `--components` file at all.
    reproduction: >-
      At d3eb851 (before RC-01):
      `python3 scripts/tla_spec_dev.py --spec-root specs analyze architecture
      specs/current/TlaSpecDevCli.tla specs/current/MC.cfg`
      -> "MEASURED RESULT: does not decompose", one component, Q = 0.
      After RC-01, the same command -> "MEASURED RESULT: the partition is a cut
      -- every criterion above is met", C1/C2, Q = 0.011605,
      crossing_action_fraction 0.0556.
    evidence:
      - "specs/results/rc01-architecture-current.txt (the post-change scan)"
      - "tests/test_analyze_architecture.py::TestAModelThatResistsClusteringSaysSo::test_the_repositorys_own_model_flipped_out_of_the_blob_case"
      - "specs/program_model/architecture_components.yaml (AC-03's 2-of-115,975 measurement)"
    why_out_of_scope: >-
      RC-01's slice is closing nine representation gaps the coverage audit
      found. Changing what makes a partition a cut is a DOCTRINE decision on
      AC-01/AC-03's surface -- it decides what `analyze architecture` reports to
      every user of this skill, not just to this repository -- and a
      reconciliation ticket that quietly retuned a criterion while its own model
      delta was in flight would be indistinguishable from tuning the scanner to
      like the change it just made. Filed instead, with the flip asserted in a
      test so the next reader meets it.
    suggested_fix: >-
      Two candidates, and the choice is the owner's. (a) Add a fourth criterion
      that the shipped report already computes and prints: a partition whose
      SINGLE-WRITER VIOLATIONS include variables written from every component is
      not a cut, whatever Q says. That is the criterion this case actually
      fails. (b) Replace `Q > 0` with a stated floor and publish the number --
      the report already prints Newman's 0.3 as "reported, not applied", which
      is the current arrangement's weakest point: a threshold worth printing is
      either a criterion or it is decoration. Do NOT simply raise Q until this
      repository fails again; the fix has to be stated as a rule, not fitted to
      an instance.
    blast_radius: >-
      Every consumer of `analyze architecture` with no declared `--components`
      file, which is the default path. AC-02's reflexion check branches on
      `consumable_as_architecture`, so this flip also changes whether the
      reflexion check reports `unmappable` or attempts a real measurement
      against a two-component map -- for this repository and for any user model
      shaped like it. Nothing gates on it (the epic's coherence_doctrine keeps
      the scanner advisory), so no close, promotion or generation changes
      behaviour.
    disposition: open
    disposition_ticket: null
    disposition_note: >-
      Filed by RC-01 rather than fixed. RC-01 verified the flip is caused by the
      model delta and not by any change to the scanner: `git stash` of the
      TlaSpecDevCli.tla change alone restores the blob verdict.

      NARROWING WORTH HAVING, measured after filing: the flip is confined to
      the EMERGENT partition. Under this repository's DECLARED four-component
      partition (specs/program_model/architecture_components.yaml) the model
      still does not decompose -- 2 of 3 criteria fail, Q = -0.0228,
      crossing_action_fraction 0.5556 -- and the reflexion verdict is still
      `unmappable`, exactly as AC-02 and AC-03 recorded
      (specs/results/rc01-architecture-reflexion.txt). So the fragile path is
      the DEFAULT one, taken when no partition is declared, and a project that
      declares its components is not exposed to it. That makes the finding
      narrower and, if anything, sharper: the emergent clustering is the mode
      whose answer nobody declared and nobody can review.

  - id: RC-01-DF-02
    found_by: "RC-01"
