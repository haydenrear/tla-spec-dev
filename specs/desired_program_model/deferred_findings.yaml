  - id: RP-04-DF-01
    found_by: "RP-04"
    found_at_commit: "506e0e0"
    schedule_revision: 3
    severity: minor
    surface:
      production: ["scripts/complexity_ledger.py"]
      tla: []
      adapters: []
      test_graph: []
    summary: >-
      RP-04 made an incomplete state-space bound refuse the cap comparison, but
      deliberately did NOT change how such a bound feeds the ledger's DELTA
      DIRECTION, which is a real gate: `compute_delta` puts `bound` in
      DIRECTION_METRICS, and direction drives three refusals in `evaluate`
      (an unjustified increase, and a decrease with degraded or unverified
      validated-refactor evidence). A bound delta between two products taken
      over different resolved subsets is not a measurement of the model getting
      bigger or smaller -- the same argument RP-04 used to refuse
      percent-of-cap -- yet it can still refuse a close or license a decrease.
      RP-04 records the fact (`comparable: false` plus a `note` on the bound
      delta entry, printed as "NOT LIKE-FOR-LIKE" under the number) and stops
      there, because both ways of acting on it are policy calls the owner
      should make, not side effects of a reporting fix. Dropping a
      non-comparable bound from the direction WEAKENS a gate and opens a
      gaming vector (make a variable unresolvable, lose the increase);
      hard-refusing on it turns an advisory finding into a build failure, which
      the epic's standing doctrine forbids. Note also that EVERY ledger entry
      written before RP-04 lacks `bound_complete`, so every delta against
      history is `comparable: false` with the "unrecorded" note -- honest, and
      noisy until a few entries accumulate.
    reproduction: >-
      python3 -c "import sys; sys.path.insert(0,'.'); from scripts import
      complexity_ledger as cl; print(cl.compute_delta({'scope_id':'p',
      'metrics':{'bound':1000,'bound_complete':True}},
      {'bound':4,'bound_complete':False})['direction'])". Observed: decrease --
      on a pair whose own recorded note says the two numbers are products over
      different subsets of the representation.
    evidence:
      - "specs/.history/architectural-coherence-epic/ticket-009-RP-04/ticket/results/cm-01-df-03-before-after.txt"
    why_out_of_scope: >-
      RP-04's brief is explicit that an incomplete bound is a FINDING, not a
      build failure, and that the ticket must not become a gate. Changing the
      direction rules in either direction changes what refuses a close, which
      is the epic owner's call.
    suggested_fix: >-
      Decide, with the owner, what a non-comparable bound delta should do to
      the direction. The narrowest defensible option is a third value --
      direction `incomparable` for the bound term alone, recorded and printed,
      leaving `variables` and `distinct_states` to decide the direction on
      their own -- rather than silently counting it or silently dropping it.
    blast_radius: >-
      scripts/complexity_ledger.py only. No current entry is affected: this
      repository's bound is over its cap and has been incomplete in the same
      8-of-10 way across every recorded entry, so its deltas are like-for-like
      in practice even though the flag now says they are not provably so.
    disposition: open
    disposition_ticket: null
    disposition_note: >-
      Filed by RP-04 as the limit it chose not to cross. Candidate for the
      next epic alongside NE-01.
