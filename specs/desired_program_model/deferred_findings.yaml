  - id: RD-02-DF-01
    found_by: "RD-02"
    found_at_commit: "7514df0"
    schedule_revision: 1
    severity: major
    surface:
      production: []
      tla: []
      adapters: []
      test_graph: []
      workflow: ["examples/validation/scorecards/score_tools.py"]
    summary: >-
      `scope` REACHES ONLY COUNTED FIGURES THAT NAME A DIMENSION, AND `19 of 44`
      IS SCOPED TO THOSE.

      DISTINCT FROM `RD-01-DF-01`, which is about generalisations that carry NO
      COUNT. This is about figures that DO count and are still invisible:
      `_ANOTHER_DIM = re.compile(r"D[1-5]")` means a counted claim reaches the
      sweep only if a dimension's name sits beside it.

      Demonstrated on RD-02's own result document, which carries at least twelve
      counted figures -- "0 of 9 mutants", "3 of 4 copies", "13 of 14",
      "9 of the 10 rows". `scope --path` over it reports
      `0 counted figure(s): 0 REFUTED, 0 COUNT-MOVED, 0 HOLDS, 0 UNREACHABLE`.
      Not one refused, and not one counted as UNREACHABLE -- which is the count
      that exists so a claim the check cannot reach is not read as one that
      holds.

      A three-line probe separates the two cases cleanly: `D2 = 2 on 27 of 27
      cards` is REFUTED with four counterexamples; `0 of 9 mutants could have
      priced a removal` and `3 of 4 copies were invisible` are not seen at all.
      One counted figure reported out of three.

      SO `19 of 44` IS A COUNT OF DIMENSION-NAMED FIGURES, not of counted figures
      in this repository. This document alone would add twelve to a denominator
      it is not in. THIS IS `SM-05-DF-02` INSIDE THE EPIC THAT WAS OPENED TO FIX
      IT -- SM-05 disclosed the same class error about its own leak scanner in
      the same words: a result stated without the dimension's name is invisible
      to a pattern keyed on the dimension's name.
    reproduction: >-
      printf 'D2 = 2 on 27 of 27 cards\n0 of 9 mutants could have priced a
      removal\n3 of 4 copies were invisible\n' > /tmp/probe.md; python3
      examples/validation/scorecards/score_tools.py scope --path /tmp/probe.md
      -- reports `1 counted figure(s)`.
    evidence:
      - "examples/validation/scorecards/score_tools.py -- _ANOTHER_DIM = re.compile(r\"D[1-5]\")"
      - "specs/results/scorecards/reading-discipline/GOAL-apparatus-priced/RD-02-RESULT.md section 5a"
    why_out_of_scope: >-
      RD-01 owns the instrument, this is a measurement ticket, and RD-03 sweeps
      the record on the integrated tip. Editing a check during a round that is
      measuring what the check reports is how a target gets edited to match a
      result.
    suggested_fix: >-
      Not a wider regex on its own -- `N of M` with no dimension name is common
      enough in ordinary prose that matching it bare would inflate the count.
      Either the figure declares its population inline, or `scope` grows a second
      report -- counted figures it cannot attribute to a dimension, listed and
      counted separately, so the denominator stops being silently narrow. RD-03
      decides.
    blast_radius: >-
      Every counted figure in the record that does not name a dimension. Unknown
      by construction, and at least twelve in RD-02's result alone.
    disposition: open

