    summary: >-
      THE FREE CARRIER IS NOT FREE, AND THE BYTE METRIC DOES NOT DISTINGUISH THE
      TWO CARRIERS IT RANKED. `references/scoring_validation.md` section 6 prices
      a sharpened recorded-note prompt at -15 bytes against +682 for a restored
      scored dimension, and section 7 concludes "Carrier R requires a version
      bump and would hand every adopter that experience. The free carriers do
      not." The second sentence is false, measured.

      A recorded note's PROMPT is inside both of the card's seals. It is in the
      payload `load_rubric` digests, and it is in the bytes `serve` emits, which
      `## Version history` declares per version and
      `score_tools.version_history_problems` recomputes for the current row. Put
      the priced prompt into the card and change nothing else, and the card's own
      change rule refuses it in the tree's own words -- "Bump the card, or
      restore the text; a served surface that changes under a fixed version is
      the card changing silently". The shipped card's own version 5 row is the
      precedent and says so: it moved no anchor, moved only served bytes, and
      took a bump to do it.

      So both carriers cost a version bump, and a bump is what SV-02 used to
      reject the rung -- an INSTRUMENT-LOG era boundary, the change rule's
      re-score of a prior example under both versions, and CL-04 blocker 2 handed
      to every adopter. What separates them after that is the rung count and the
      +682 bytes, which is still a real difference and is no longer the
      difference the recommendation rested on. The epic's surface metric
      `serve | wc -c` is not the binding constraint for note-shaped changes, and
      nothing said so before this ticket tried to spend it.
    reproduction: >-
      python3 scripts/candidate_note_bar.py -- prices the candidate at 6,266
      bytes and 9 rungs against the card's 6,281 and 9, with the anchors digest
      byte-identical. Then
      `pytest tests/test_candidate_note_bar.py::test_the_note_prompt_is_inside_both_seals`,
      which puts the same prompt into the card WITHOUT a version row and asserts
      the change rule's refusal, and shows the two real sealed version-5 cards
      under specs/results/scorecards/close-the-loop-cl03-v5/ drifting against the
      candidate while they do not drift against the shipped bar.
    evidence:
      - "references/scoring_validation.md -- sections 6 and 7"
      - "references/eval_scorecard.md -- `Changing this card`, and the version 5 row of `### Version history`"
      - "examples/validation/scorecards/score_tools.py -- version_history_problems, SERVED_SEAL_FROM"
      - "scripts/candidate_note_bar.py"
      - "tests/test_candidate_note_bar.py::test_the_note_prompt_is_inside_both_seals"
      - "specs/results/scorecards/close-the-loop-cl03-v5/toolchain_removal/20260811-cl03v5-CL-p1/scorecard.json"
    why_out_of_scope: >-
      The work order forbids forcing a card bump and says in terms that if the
      note requires one, that is a finding and not a licence. Bumping would also
      require the change rule's re-score under both versions, which is a judging
      round and belongs to SV-05. Editing SV-02's page is out of scope for the
      same reason RM-02 left `architecture_tags.md` section 2.2 standing: a
      predecessor's statement at a predecessor's scope is filed, not rewritten.
    suggested_fix: >-
      Run SV-02 section 9's first experiment -- one prior example re-scored under
      both wordings -- with `scripts/candidate_note_bar.py --out` supplying the
      candidate arm, and let that round decide the prompt AND the rung together,
      since they are now known to cost the same bump. If the owner wants the note
      without a round, that is a deliberate exception to the change rule and
      should be recorded as one.
    blast_radius: >-
      SV-04 and SV-05 key on the denominator inside a note, so what the note ASKS
      for is on their path: the shipped prompt asks for a fault the judge seeded
      and does not ask for the artifact's denominator at all. Any future ticket
      that reads SV-02's byte table as the price of a note will under-price it by
      a version bump.
