  - id: PA-03-DF-02
    found_by: "PA-03"
    found_at_commit: "1cad5ea"
    schedule_revision: 1
    severity: major
    surface:
      production: []
      tla: []
      adapters: []
      test_graph: []
      workflow: ["examples/validation/ab/eval/run_controls.py"]
    summary: >-
      A DECLARED LIMITATION CAN ONLY SAY "THIS INSTRUMENT NEVER EXECUTED THAT
      ACTION". A PROJECTED CORPUS'S REAL LIMITATION IS THE OPPOSITE SHAPE AND IS
      INEXPRESSIBLE.

      `verify_limitation` reads one witness form: `witness_action` plus
      `witness_polarity` plus `witness_ran_must_be`, checked against the run's
      own `per_action` counts. That is the right check for an instrument blind
      because it never made the call. It cannot state the other reason an
      instrument is blind: **it made the call and does not observe the variable
      the fault lands on.**

      PA-03's `corpus-port` is the clean demonstration, and it is clean because
      the executability number rules the other explanation out. It executes
      **294 accepting `Reserve` cases** -- exactly as many as `corpus-whole`,
      83.2% of its whole corpus -- and still cannot decide `M07`, because the
      port's derived region is `{committed, ledger, closed}` and M07's symptom
      lands on `available`. No witness of the available shape is true, so the
      only honest outcome is a RED positive control on an instrument whose
      blindness is precisely characterised.

      EVAL-RERUN found the same gap from the other side (`EVAL-RERUN-DF-04`,
      `corpus-slice-led`: "its stated cause -- it cannot execute the mutated line
      -- is false ... the only operative constraint there is the projection"),
      and repaired the VERIFICATION rather than the VOCABULARY. The vocabulary
      is what is missing.
    reproduction: >-
      Generate the port corpus and run it:
      `python3 scripts/tla_spec_dev.py --spec-root specs generate cases
      examples/validation/ab/model/QuotaLedger.{tla,cfg} --out <scratch>/specs/corpus-port
      --package quota_port --view internal --negative-cases with-positive --port-cases only`
      then `run_controls.py ... --instrument corpus-port=<scratch>/specs/corpus-port/spec-unit/quota_port`.
      `controls_on_unmutated_code["corpus-port"]["per_action"]["Reserve"]["ran_accepting"] == 294`
      and `per_mutant["M07-positive-control-wrong-hold"]["corpus-port"] == "SURVIVED"`.
    evidence:
      - "specs/tickets/PA-03/results/kill-table-arm-a.json"
      - "specs/tickets/PA-03/results/kill-table-arm-b.json"
    why_out_of_scope: >-
      `examples/validation/` is PA-01's `implementation_scope`, not PA-03's, and
      the driver is the instrument under measurement. Adding a witness form
      mid-measurement is editing the instrument after seeing an unflattering
      signal, which is the forbidden half of the repair rule.
    suggested_fix: >-
      Add a second witness form -- a PROJECTION witness naming the variable the
      mutant's semantic lands on, verified against the instrument's own case
      `after` keys rather than against a promise. It is checkable from data the
      corpus already carries, so it does not become a suppression key: an
      instrument whose cases DO project the named variable would fail the
      witness and the cell would be decided normally.
    blast_radius: >-
      Every projected instrument. `corpus-slice-res`, `corpus-slice-led` and now
      `corpus-port` are all scoped by projection, and for all three the only
      available declaration is one that misstates why the instrument is blind or
      is falsified by the run's own data.
    disposition: carried
    disposition_ticket: "PA-06"
