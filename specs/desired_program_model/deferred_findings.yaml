    summary: >-
      THE CONTAMINATION WAS IN THE SCAFFOLD, NOT ONLY IN THE RUBRIC FILE, AND
      EVERY CARD SCAFFOLDED UNDER VERSION 2 CARRIED IT.

      `FI-03-DF-02` and `FI-06-DF-04` both located the leak in
      `references/eval_scorecard.md` and both suggested the same fix: split the
      rubric and dispatch only the judge-facing half. NEITHER LOOKED AT
      `_skeleton_md`. The scaffolded `scorecard.md` -- the file the judge writes
      into, which they read whether or not they ever open the rubric -- emitted
      three result-stating lines of its own:

        rule 8's cross-reference, rendered as the link text
        "r-h5--A-MOVEMENT-IS-A-MEASUREMENT-only-if-the-judging-practice..."

        "> This field exists because two judges re-scored **byte-identical
         trees** and FOUR DIMENSION-POINTS MOVED."

        "**D1, D4 AND D5 ALL MOVED ON UNCHANGED INPUT; only D4's anchor is
         gated, because only D4's anchor asks you to run something.**"

      6 of 6 cards scaffolded under version 2 carry all three. So the
      contamination FI-06-DF-04 scoped to "the rubric the judges were instructed
      to read" was also present in the one file they could not avoid reading, and
      a round that had correctly refused to hand out the rubric file would still
      have handed out the finding.

      The last of the three is the sharpest: it names D5 explicitly as a
      dimension that moves, and D5 is where FI-03's version 2 judges then split
      3 against 4.
