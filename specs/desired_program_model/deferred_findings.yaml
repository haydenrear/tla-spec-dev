    summary: >-
      THE TIER FIELD IS BEING READ OVER A RECORD THAT IS ALMOST ENTIRELY ONE
      TIER, AND `contested` IS STRUCTURALLY HARDEST TO TRIP ON THE SHAPE THE
      RECORD IS MOSTLY MADE OF. Both numbers are needed to read either.

      44 of 49 sealed cards are `claude-opus-5[1m]`. Only `subtract-to-measure`
      ever dispatched a second tier, so a tier split is measurable on 2 of 23
      judge groups and is observed on BOTH of them -- D3 on the toolchain
      removal, D4 and D5 on the greenfield. Two for two is not a rate; it is the
      whole sample.

      And 20 of the 23 groups carry exactly two judges, where a spread greater
      than 1 requires a two-point disagreement, while one group has a single
      judge and cannot be contested at all. The one group that fires is one of
      only two four-judge groups. `1 contested in 23 groups` is therefore as much
      a fact about how rounds were dispatched as about how stable the card is,
      and reading it as the latter is the `denominator_rule` failure.
    reproduction: >-
      python3 examples/validation/scorecards/score_tools.py contested -- 23
      groups, 1 contested, 3 tier splits over the 2 groups where two tiers exist.
    evidence:
      - "specs/results/scorecards/reading-discipline/GOAL-scope-loss-catchable/RD-01.md sections 5 and 6"
      - "examples/validation/instruments/instruments.toml -- scorecard-contested blind_spot"
    why_out_of_scope: >-
      The remedy is to dispatch mixed-tier rounds, which is a decision about how
      evals are run rather than a change to this instrument, and making it inside
      the ticket that built the instrument would be measuring with the thing being
      changed.
    suggested_fix: >-
      Dispatch both tiers in every future round, so the tier field has a
      denominator. Until then quote a tier split only with `2 of 23 groups could
      show one` attached.
    blast_radius: >-
      Any cross-epic reading of the tier field or of the contested rate.
    disposition: open

