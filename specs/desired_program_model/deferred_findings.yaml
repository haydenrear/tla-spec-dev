  - id: RD-01-DF-01
    found_by: "RD-01"
    found_at_commit: "7136c3a"
    schedule_revision: 1
    severity: major
    surface:
      production: []
      tla: []
      adapters: []
      test_graph: []
      workflow: ["examples/validation/scorecards/score_tools.py"]
    summary: >-
      `scope` CANNOT REACH A GENERALISATION THAT DOES NOT COUNT, AND ONE OF THE
      THREE INSTANCES THAT OPENED THIS EPIC IS ONE.

      R3 is executed against figures of the form `D<n> = k on N of M`. The second
      instance in `READING-DISCIPLINE-EPIC.md` section 2 is *"D3 was called the
      one dimension that discriminates and holds still"* -- the same
      single-example generalisation, with no count in it at all. So does *"every
      subject this project has ever scored was greenfield"*, which sat beside the
      "27 of 27" figure in the same charter and did equal work in justifying the
      epic. The sweep finds ZERO of that class, not because there are none but
      because it is not looking, and a reader who sees `17 REFUTED` and no
      caveat will read it as a sweep of the generalisations rather than of the
      counted ones.

      This is declared as `scorecard-scope`'s blind spot in
      `examples/validation/instruments/instruments.toml` and printed by
      `demonstrate.py`, so it is recorded rather than silent. It is filed because
      a declared inability is still an inability.
    reproduction: >-
      python3 examples/validation/scorecards/score_tools.py scope -- 38 counted
      figures reported; grep the same corpus for "holds still" and "greenfield"
      and neither appears in any verdict block.
    evidence:
      - "READING-DISCIPLINE-EPIC.md:27-29 -- the D3 instance, uncounted"
      - "SUBTRACT-TO-MEASURE-EPIC.md:24 -- the greenfield claim, uncounted"
      - "examples/validation/instruments/instruments.toml -- scorecard-scope blind_spot"
    why_out_of_scope: >-
      A parser that guessed at the population behind a prose sentence would be
      inventing the subject the writer declined to state, which is exactly what
      `prediction-seal` declined to do one layer down and was right to. Widening
      the grammar to match ordinary English would also start matching ordinary
      English, and a count inflated by a parser is worse than no count.
    suggested_fix: >-
      Not a wider regex. Either a declared-claims register that a document points
      at -- so a generalisation is written once, with its scope, and re-derived --
      or an explicit "this figure is uncounted and unverifiable" report that
      names the sentences a reader must check by hand. RD-03 decides which on the
      integrated tip.
    blast_radius: >-
      Every uncounted generalisation in the record, count unknown by construction.
    disposition: open

