  - id: RM-02-DF-01
    found_by: "RM-02"
    found_at_commit: "2c0d94e"
    schedule_revision: 1
    severity: major
    surface:
      production: []
      tla: []
      adapters: []
      test_graph: []
      workflow: ["examples/validation/scorecards/score_tools.py"]
    summary: >-
      THE BLINDING MECHANISM HAS A BOUNDED LIFETIME BAKED INTO A CONSTANT, AND
      THIS REPOSITORY HAS FOUR ARMS LEFT.

      `LABEL_POOL = "DEFGHJKLMNRSTUVWZ"` is 17 characters, and `scaffold` draws
      opaque arm labels from it EXCLUDING every label any prior round published
      (`used_labels`). That exclusion is correct and is the whole reason the
      blinding is a mechanism rather than a discipline. Its consequence is that
      the pool is CONSUMED, never released, and a scorecard root can be blinded
      at most 17 times in its life.

      Measured on this repository at `2c0d94e`: 18 labels taken (17 letters plus
      `A-CONTROL-REFERENCE`), leaving `['G', 'J', 'L', 'V']`. FOUR. `scaffold`
      already refuses a batch it cannot label -- "only N unused opaque labels
      remain" -- so a round wanting five arms is refused today, and after four
      more arms no round in this repository can ever be blinded again.

      RM-04 plans a blind round on `scripts/` and this binds it directly.

      IT IS ALSO A PORTABILITY FINDING, which is why RM-02 found it: an adopter
      receives a mechanism with 17 uses in it and no notice that it expires.
    reproduction: >-
      python3 -c "import sys,pathlib; sys.path.insert(0,'examples/validation/scorecards');
      import score_tools as st; t=st.used_labels(pathlib.Path('specs/results/scorecards'));
      print([c for c in st.LABEL_POOL if c not in t])"
    evidence:
      - "examples/validation/scorecards/score_tools.py:145"
      - "examples/validation/scorecards/score_tools.py:1229-1235"
      - "specs/results/scorecards/portable-substrate/GOAL-portable/RESULT.md"
    why_out_of_scope: >-
      RM-02 ships no production code. Changing the pool is a code change and it
      is also a decision about what a label means, which belongs with whoever
      runs the next blind round rather than with the research ticket that found
      the ceiling.
    suggested_fix: >-
      Do not simply lengthen the string -- that buys a few rounds and hides the
      same cliff. Either scope exclusion to the round rather than to the
      repository (labels need to be unguessable WITHIN a round; a label reused
      six epics apart leaks nothing a judge can act on), or make labels
      two-character so the pool is not a scarce resource at all. Whichever is
      chosen, `scaffold` should say how many remain on every successful run, not
      only when it refuses.
    blast_radius: >-
      Every future blinded round in this repository, RM-04 first.
    disposition: open

  - id: RM-02-DF-02
    found_by: "RM-02"
    found_at_commit: "2c0d94e"
    schedule_revision: 1
    severity: major
    surface:
      production: []
      tla: []
      adapters: []
      test_graph: []
      workflow: ["references/eval_scorecard.md"]
    summary: >-
      D3 TIER-SPLITS THREE TIMES AS OFTEN AS D2, AND THE CARD ADVISES RESTING
      CROSS-EPIC CLAIMS ON BOTH.

      `references/eval_scorecard.md` R-H5 says D2 and D3 "are the dimensions
      that have held still on unchanged input" and that "a cross-epic claim is
      safest on those"; `ports-as-adapters` rested its headline there on that
      advice.

      Measured over the 8 judge groups in the sealed record scored by BOTH
      tiers, counting a split exactly as R-H6 defines one (disjoint ranges on
      the same artifact): D1 0 of 8, D2 1 of 8, D3 3 of 8, D4 4 of 8, D5 2 of 8.
      D3 is the SECOND LEAST stable dimension across tiers and no page says so.

      R-H5's claim is not wrong -- it is about unchanged input WITHIN a tier, and
      that is a different quantity. The defect is that the two statements sit in
      the same file with nothing distinguishing them, and a reader taking the
      advice will take it across tiers.

      AND THE D2 SPLIT'S MECHANISM IS NOW CONFIRMED FROM THE RATIONALES, not only
      proposed. On `reading-discipline` arms `D` and `M`, 4 of 4 `sonnet` judges
      name D2 anchor 4's D4 >= 3 gate -- and D4 anchor 3's model-derivation clause
      behind it -- as the reason 3 is their ceiling, and 0 of 4 `opus` judges do.
      Unanimous within each tier. That is `RD-03-DF-14`'s proposed mechanism
      measured, and it means the D2 tier split is not about complexity at all.

      THE MAGNITUDE, so this is not overread: two of D3's three splits are
      one-point offsets at the FLOOR (`[1,1]` against `[0,0]`). The third,
      `toolchain_removal` at `opus [2,2]` against `sonnet [3,4]`, straddles the
      2->3 seam RD-04 identified as where "the domain silently changes referent".
      One of three is at the seam that matters.

