  - id: SM-04-DF-02
    found_by: "SM-04"
    found_at_commit: "2098d55"
    schedule_revision: 2
    severity: major
    surface:
      production: []
      tla: []
      adapters: []
      test_graph: []
      workflow: ["references/eval_scorecard.md", "specs/results/scorecards/SELF-IMPROVEMENT.md"]
    summary: >-
      NO CARD WRITTEN BEFORE VERSION 3 CAN EVER SAY WHAT ITS JUDGE WAS SERVED,
      AND THE LEDGER'S CROSS-ROUND COMPARISONS DO NOT SAY SO.

      `rubric.served_digest` starts at scorecard_version 3. For the 36 cards
      written under versions 1 and 2, the question "were these two judges served
      the same bytes" is permanently unanswerable -- the parsed digest they DO
      carry was `sha256:e33638087c4191da` across six commits and a 2x growth of
      the rubric file, so it answers a different question.

      This is the same shape as `R-H5`'s `readable = false` for version 1 cards,
      and like that one it is the CORRECT answer rather than a defect to be
      cleared. What is missing is that nothing says it. `SELF-IMPROVEMENT.md`
      and `FI-03`'s `RESULT.md` compare version 1 and version 2 arms and treat
      "same rubric digest" as "same bar", which for those rounds it is not known
      to be.
    reproduction: >-
      `python3 -c "import json,glob; print(sorted({('served_digest' in
      (json.load(open(p)).get('rubric') or {})) for p in
      glob.glob('specs/results/scorecards/**/scorecard.json', recursive=True)}))"`
      -> every pre-SM-04 card False.
    evidence:
      - "examples/validation/scorecards/score_tools.py -- _rubric_block, gated on card_version >= 3"
      - "references/eval_scorecard.md -- Version history, the FI-06-DF-11(b) note"
      - "specs/results/scorecards/falsifiable-instruments/GOAL-scorecard-carries-a-delta/RESULT.md"
    why_out_of_scope: >-
      SM-04 fixes what is demonstrably broken and nothing else. Back-filling a
      served digest onto a sealed card would require deciding what its judge was
      served, which nobody recorded -- and R-H4 forbids editing a sealed card in
      any case. The honest move is to state the limit, not to manufacture the
      number.
    suggested_fix: >-
      Say it where the comparisons are made: a cross-round claim whose ends are
      not both version 3 cannot assert that the two judges read the same bar, and
      `audit` could report that as an OPEN the way `R-H5` reports an unreadable
      movement. Do NOT back-fill.
    blast_radius: >-
      Every cross-round scorecard comparison in the repository predating SM-04.
      It does not falsify any of them; it removes one of the grounds they are
      asserted on.
    disposition: carried
    disposition_ticket: "https://github.com/haydenrear/tla-spec-dev/issues/169"
    disposition_note: >-
      Carried to epic/subtract-to-measure SM-05 (#169), the evaluation.

  - id: SM-04-DF-03
    found_by: "SM-04"
    found_at_commit: "2098d55"
    schedule_revision: 2
    severity: major
    surface:
      production: []
      tla: []
      adapters: []
      test_graph: []
      workflow: ["specs/results/scorecards/", "references/eval_scorecard.md"]
    summary: >-
      THE DISPATCH IS THE VECTOR AND NOTHING EXECUTES OVER IT.

      `serve` and `scaffold` now REFUSE to emit a rubric that states a result
      about the five dimensions. But what a judge is TOLD to read lives in a
      hand-written `JUDGE-DISPATCH*.md` that no tool parses. FI-03's said
      "`references/eval_scorecard.md` -- the rubric. Read it." SM-04's says the
      opposite and puts that file on the forbidden list -- IN PROSE, with nothing
      behind it.

      So the mechanism shipped at SM-04 covers the bytes the card carries and
      not the instruction that sends a judge elsewhere. A round can still
      contaminate its judges in one line of markdown, and the refusal will pass
      green while it happens.

      This is `R2` applied to SM-04's own instrument: naming the residue is worth
      more than the appearance of coverage.
    reproduction: >-
      `grep -n "eval_scorecard.md"
      specs/results/scorecards/falsifiable-instruments/GOAL-scorecard-carries-a-delta/JUDGE-DISPATCH-v2.md`
      -> line 39, "the rubric. Read it." Nothing in `tests/` or
      `score_tools.py` reads that file.
    evidence:
      - "specs/results/scorecards/falsifiable-instruments/GOAL-scorecard-carries-a-delta/JUDGE-DISPATCH-v2.md:39"
      - "specs/results/scorecards/subtract-to-measure/SM-04/JUDGE-DISPATCH.md -- the prose that replaces it"
      - "examples/validation/scorecards/score_tools.py -- result_leaks, which never sees a dispatch"
    why_out_of_scope: >-
      Building a checker over dispatch files is a new instrument, and R1 says an
      instrument ships with a demonstrated failing input. That is a ticket, not a
      line. It is also close to the standing rule's boundary: refusing to serve a
      contaminated card is data hygiene, and a checker that reads a dispatch and
      refuses is a step toward gating how a round is run.
    suggested_fix: >-
      The cheap honest version, if one is wanted: have `scaffold` write the
      forbidden-reading list into the example directory beside `UNBLINDING.md`,
      generated rather than hand-written, so a dispatch that contradicts it is
      contradicted by a file rather than by a reader's memory. Do not make it a
      refusal.
    blast_radius: >-
      Every future round. The version 3 mechanism is necessary and is not
      sufficient, and this says which half is missing.
    disposition: carried
    disposition_ticket: "https://github.com/haydenrear/tla-spec-dev/issues/169"
    disposition_note: >-
      Carried to epic/subtract-to-measure SM-05 (#169), the evaluation.

  - id: SM-04-DF-04
    found_by: "SM-04 (running its own detector over the whole corpus of cards)"
    found_at_commit: "2098d55"
    schedule_revision: 2
    severity: minor
    surface:
      production: []
      tla: []
      adapters: []
      test_graph: []
      workflow: ["examples/validation/scorecards/score_tools.py"]
    summary: >-
      `result_leaks` MUST NEVER BE RUN OVER A FILLED CARD, AND NOTHING STOPS
      SOMEONE DOING IT.

      Over the 36 `scorecard.md` in the tree it reports 14. Six of those are the
      SCAFFOLD-EMITTED lines of `SM-04-DF-01`. THE OTHER EIGHT ARE THE JUDGE'S
      OWN WRITING: "This is the score I moved on most, and rule 5 decided it"
      (a rationale), and "The rubric's own instability note records that judges
      who did this moved D4 and D5 by four dimension-points" (a disclosure --
      which is a judge honestly reporting the contamination, i.e. exactly the
      material this project most wants written down).

      The detector's contract is SERVED TEXT ONLY, and that contract lives in a
      docstring. A later ticket wiring it into a close-time card check -- which
      is a natural-looking thing to do, since `check` already calls
      `rubric_leak_problems` -- would report a judge's honest disclosure as a
      violation and teach judges to stop writing them.
    reproduction: >-
      Load `score_tools` and run `result_leaks` over every
      `specs/results/scorecards/**/scorecard.md`: 14 of 36 report, of which 6
      contain a scaffold-emitted string and 8 do not.
    evidence:
      - "specs/results/scorecards/falsifiable-instruments-rescore-v2/ab_quota_ledger/20260806-v2-W-p1/scorecard.md:123 -- a rationale"
      - "specs/results/scorecards/falsifiable-instruments-rescore-v1/ab_quota_ledger/20260806-v1-T-p2/scorecard.md:187 -- a disclosure"
      - "examples/validation/scorecards/score_tools.py -- result_leaks"
    why_out_of_scope: >-
      Fixing it means either narrowing the detector, which weakens the one thing
      it is for, or adding a guard against a misuse nobody has committed yet.
      Naming the contract is worth more than either.
    suggested_fix: >-
      If it is ever wired into `check`, run it over the SCAFFOLDED REGION only --
      which is now identifiable, because `served_rubric`'s output is embedded
      verbatim and its digest is on the card. Never over a judge's Rationale,
      Verdict or Disclosures.
    blast_radius: >-
      None today. The exposure is a future check that punishes the disclosure
      channel, which has produced more of this project's findings than any other.
    disposition: carried
