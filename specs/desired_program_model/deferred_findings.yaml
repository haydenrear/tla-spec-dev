      that prose notes are better than numbers, and filed nothing. RM-04 recorded
      `GG-p1`'s four seeded faults in the card's `N-D1` note, and filed nothing.
      Neither RESULT page lists it. `grep -i 'FileJournal\|durab\|on disk'` over
      `deferred_findings.yaml` returns no finding about it.

      WHY THIS IS THE CHANNEL RESULT AND NOT A SIDE NOTE. The record's standing
      recommendation for four rounds has been "keep funding blind judges". This
      epic funded them and they delivered the only concrete defect anyone found in
      a shipped fixture -- twice -- and the ledger records it zero times. The
      owner's question is whether "hand-found regression -> card iteration ->
      architectural delta" transfers to another project. Here it did not complete
      inside the project that invented it.
