      - "examples/validation/scorecards/score_tools.py -- audit_rh3, the `rel` filter is `affects` only"
      - "references/eval_scorecard.md -- Version history, the card change FI-03 could not declare"
    why_out_of_scope: >-
      The fix is a schema change to the log plus a change to `audit_rh3`'s
      scoping, in the ticket whose whole job was to MEASURE stability. Changing
      what `audit` scopes over, mid-measurement, is the `measurement_rule`'s
      forbidden act. The alternative available to FI-03 -- re-affirming six
      claims about kill tables it never looked at, in order to make its own
      paperwork green -- is worse: `reaffirmed_at` is supposed to mean somebody
      went and looked.
    suggested_fix: >-
