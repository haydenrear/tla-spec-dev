      - "references/eval_scorecard.md:192 -- rule 2 as served"
      - "all eight cards under specs/results/scorecards/subtract-to-measure-sm05*/"
    why_out_of_scope: >-
      Loosening the grammar changes the instrument every card is validated by,
      inside the round it is validating. And the cards may not be edited to suit
      it: `measurement_rule`.
    suggested_fix: >-
      Accept `path:line` and `path:line-line` as a PREFIX, with free text after a
      separator -- the citation is still machine-checkable and the judge's reason
      survives beside it, which is what makes a card readable. Then either make
      rule 2 cap the score in the emitted reading, or reword it to say what it
      does: refuse the batch.
    blast_radius: >-
