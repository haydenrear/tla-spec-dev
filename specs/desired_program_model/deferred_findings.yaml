  - id: FI-03-DF-04
    found_by: "FI-03 (trying to declare its own instrument change and finding it could not)"
    found_at_commit: "51fe73d"
    schedule_revision: 1
    severity: major
    surface:
      production: []
      tla: []
      adapters: []
      test_graph: []
      workflow: ["specs/results/scorecards/INSTRUMENT-LOG.toml", "examples/validation/scorecards/score_tools.py"]
    summary: >-
      `INSTRUMENT-LOG.toml` CONFLATES TWO DIFFERENT INSTRUMENTS, AND ONE OF THEM
      HAS NEVER BEEN RECORDED IN IT AT ALL.

      Every one of the eight `[[change]]` entries is a change to the KILL-TABLE
      instrument -- `run_controls.py`, the corpus columns, the port-swap columns.
      None is a change to THE SCORECARD, though the card is the instrument every
      scorecard row is measured on. The rubric gained R-H1..R-H4 at PA-05 and the
      "Known instability" section at the close of `ports-as-adapters`, and
      neither is in the log.

      FI-03 bumped `scorecard_version` to 2 and tried to declare it. It cannot,
      because `affects` scopes a change by EXAMPLE and every row here is
      `ab_quota_ledger`. Declaring it turns six unrelated `current` claims --
      `ab-cells-identical-64-pa06`, both `goal-port-reach` clauses,
      `goal-cases-drive-ports-missed-at-pa06`, `goal-complexity-measurable-met`
      -- into SUPERSEDED-UNMARKED violations, even though not one of them was
      measured on the scorecard and not one is capable of being affected by it.

      **So the log's own rule forces a choice between recording a real
      instrument change and keeping `audit` green** -- and "keeping audit green"
      is how the last three gates in this project died.
    reproduction: >-
      Add a `[[change]]` with `affects = ["ab_quota_ledger"]`, a date after
      `8878cd5` and `paths = ["references/eval_scorecard.md"]`, then run
      `python3 examples/validation/scorecards/score_tools.py audit`. Six
