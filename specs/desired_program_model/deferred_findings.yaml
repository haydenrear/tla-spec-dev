    summary: >-
      RECORDING JUDGING PRACTICE DID NOT MAKE D4 STABLE. IT MOVES TWO POINTS
      BETWEEN ROUNDS WHOSE JUDGES ALL EXECUTED THEIR OWN FAULTS.

      FI-03's account of D4 was judging practice: "the arm that matches PA-06's
      practice is the arm that matches PA-06's numbers", and scorecard_version 2
      was built on it -- `judging_practice` required, D4 anchor 4 gated on it.

      SM-04 re-scored the same sealed, byte-identical `artifact_U` with four fresh
      blind judges. ALL FOUR RECORDED `executed_own_faults: true`, with 8, 17, 16
      and 11 items in `what_was_run`, every one of them fault seeding against a
      scratch copy. D4 came out 2, 3, 3, 4 -- the whole usable range.

        FI-03 v2 p1  D4 = 4    ->   SM-04 v2 p1  D4 = 2     (-2)
        FI-03 v2 p2  D4 = 4    ->   SM-04 v2 p2  D4 = 3     (-1)
        FI-03 v2 p1  D4 = 4    ->   SM-04 v3 p1  D4 = 3     (-1)

      Both ends of every one of those rows record `executed_own_faults: true`. So
      the variable version 2 exposed is real and is NOT the whole mechanism.
      `R-H5`'s standing caveat -- a D1, D4 or D5 delta of <= 2 points per judge is
      within demonstrated noise -- survives, and now survives a round where the
      one variable anybody had identified was held constant.

      AND A HYPOTHESIS THAT IS NOT A MEASUREMENT. D4 fell in BOTH SM-04 arms
      relative to FI-03 v2, and the SM-04 arms are the first ever served a card
      with `SM-04-DF-01`'s three result-stating lines removed -- two of which told
      the judge that executing earns anchor 4 and that D4 moves. That is
      consistent with the removed paragraph having INFLATED D4. It is not
      established and cannot be from this data: round, judges, decontamination and
      dispatch all differ at once. Recorded so it is not rediscovered as a
      conclusion.
    reproduction: >-
