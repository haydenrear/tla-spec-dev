  - id: FI-06-DF-11
    found_by: "FI-06 (fresh adversarial channel D -- 'is the anchors digest actually machine-checked?')"
    found_at_commit: "6c05d22"
    schedule_revision: 1
    severity: minor
    surface:
      production: []
      tla: []
      adapters: []
      test_graph: []
      workflow: ["references/eval_scorecard.md", "examples/validation/scorecards/score_tools.py"]
    summary: >-
      "THE MACHINE-CHECKED STATEMENT THAT THE BAR FOR EACH SCORE DID NOT MOVE"
      IS NOT MACHINE-CHECKED, AND THE RUBRIC DIGEST COVERS FOUR MATERIALLY
      DIFFERENT FILES.

      (a) `references/eval_scorecard.md` says two versions carrying the same
      anchors digest is "the machine-checked statement that the bar for each
      score did not move". `version_history_problems` compares only the CURRENT
      version's declared row against the anchors currently in the file. Version
      1's anchors are archived nowhere. Editing an anchor and updating BOTH
      version rows to the new digest passes with no problems -- demonstrated in a
      sandbox with D1 anchor 4 rewritten to "3. (BAR LOWERED.)". The mechanism
      detects a stale table, not a moved bar. (The anchors genuinely never moved
      -- `eeccf4576bc6fd85` at all seven sampled commits. The claim is true; the
      sentence describing how it is known is false.)

      (b) `FI-03-DF-02` is understated. `load_rubric`'s parsed digest
      `sha256:e33638087c4191da` is identical at `f65bb9b` (HP-06 judged, 9,705
      bytes), `24ed3fa` (EVAL-RERUN judged, 9,705), `930fa57` (PA-06 judged,
      16,514), `8878cd5` (16,626), `d3f483d` (19,627) and `51fe73d` (FI-03
      judged, 19,503). **One hash over a 2x growth of the file, including the
      entire R-H1..R-H4 block and the entire instability section.** DF-02 scopes
      it to PA-06 vs FI-03-v1; it is every round from HP-06 forward.

      (c) `score_tools.py`'s `--card-version 1` does not reproduce a prior card:
      `_skeleton_json` stamps the requested version number while every anchor,
      rule and digest is read from the CURRENT file. So a v1/v2 re-score reads
      the same anchors from the same file, and the card's own change rule --
      "re-score a prior example under both versions so the discontinuity is
      measured" -- is structurally incapable of measuring an ANCHOR
      discontinuity. Harmless here only because FI-03 scaffolded the v1 arm
      before editing the rubric, which is operator sequencing rather than a
      mechanism.

      (d) `FI-03-DF-04`'s premise is wrong as written. It says the log "cannot
      [record a scorecard change] because `affects` scopes a change by EXAMPLE";
      `score_tools.py` reads `if not ch.get("affects") or ...`, so OMITTING
      `affects` applies a change to every card. The consequence it names is real
      and the mechanism is the opposite of the one stated. It also says "not one
      of them was measured on the scorecard" of six claims, and
      `pa06-scores-moved-on-unchanged-artifacts` is a scorecard claim.
    reproduction: >-
      For (b): `for c in f65bb9b 24ed3fa 930fa57 8878cd5 d3f483d 51fe73d; do
      git show $c:references/eval_scorecard.md > /tmp/r.md;
      python3 -c "import importlib.util,sys; ..." ; done` -> one digest, six files.
      For (a): copy the rubric to a scratch tree, rewrite a D1 anchor, update
      both version-history rows to the recomputed `anchors_digest`, call
      `version_history_problems` -> no problems.
    evidence:
      - "references/eval_scorecard.md -- Version history, 'the machine-checked statement'"
      - "examples/validation/scorecards/score_tools.py -- version_history_problems, _skeleton_json, load_rubric"
      - "specs/desired_program_model/deferred_findings.yaml -- FI-03-DF-02, FI-03-DF-04"
    why_out_of_scope: >-
      Widening what the digest covers is `FI-03-DF-02`'s open fix and remains
      out of scope for the same reason: it re-scaffolds every skeleton and
      changes the instrument between rounds being compared.
    suggested_fix: >-
      Archive each version's anchors block in the file (the change rule already
      says "keep the old anchors in the file") and have
      `version_history_problems` recompute EVERY row's digest against its own
      archived block. Record the rubric's whole-file sha256 on every card beside
      the parsed digest, per `FI-03-DF-02`. Make `--card-version` read the
      archived block rather than the current one.
    blast_radius: >-
      The comparability claim behind every cross-round scorecard comparison in
      the repository, and the version-2 discontinuity measurement.
    disposition: carried
    disposition_ticket: "https://github.com/haydenrear/tla-spec-dev/issues/169"
    disposition_note: >-
      Carried to epic/subtract-to-measure SM-05 (#169), the evaluation: score the removal on the card and find out whether D2 was ever able to move.

