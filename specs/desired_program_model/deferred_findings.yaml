  - id: RD-05-DF-01
    found_by: "RD-05"
    found_at_commit: "4ec3028"
    schedule_revision: 1
    severity: major
    surface:
      production: []
      tla: []
      adapters: []
      test_graph: []
      workflow: ["tests/test_code_complexity.py"]
    summary: >-
      THE INVARIANT THAT BLOCKED RD-04 WAS FIRING ON THE WRONG LINE, AND IT
      CANNOT SEE THE THING IT WAS ESCALATED ABOUT.

      `test_no_reader_of_this_instrument_gates_on_its_output` propagates taint
      through assignments WITHIN A MODULE and does not cross a function
      boundary. RD-04's `analysis/derive_and_test.py` was flagged at line 130 --
      `if out.returncode != 0`, a branch on a SUBPROCESS EXIT STATUS -- and the
      three clause comparisons inside `derive(record)` that the whole §9.9
      escalation is about were NEVER SEEN, because `record` arrives as a
      parameter and carries no taint.

      So the escalated finding was true (the predicate does branch on figures)
      and the test that reported it was reporting something else.

      AND THE TAINT SET IS NAME-KEYED RATHER THAN SCOPE-AWARE, which cuts the
      other way. `measure()` builds a local `args` list holding the
      instrument's path; that puts the NAME `args` into a module-wide set, so
      every unrelated `args` in the file is tainted and
      `root = pathlib.Path(args.root)` in `main()` spreads it further.
