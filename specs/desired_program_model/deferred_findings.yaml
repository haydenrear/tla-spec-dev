    summary: >-
      NOTHING WATCHES A STATEMENT OF HOW A DIMENSION HAS SCORED. SM-06 CLOSED THE
      "COPY OF THE CARD" CLASS AND DELIBERATELY EXEMPTED THE "COPY OF A RESULT"
      CLASS -- WHICH IS THE CLASS THAT REACHES A JUDGE.

      `tests/test_card_has_one_home.py:378` is
      `test_a_score_citation_is_not_a_statement_of_the_card`, and its docstring
