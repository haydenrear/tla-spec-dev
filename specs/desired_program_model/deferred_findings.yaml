    summary: >-
      SCORING RULE 5's REMEDY HAS NEVER BEEN APPLIED TO ANYTHING, EVER.

      Rule 5 says a contested dimension "is adjudicated by a third pass that must
      cite new evidence, not re-read the same lines". Now that the flag computes,
      the record contains exactly one contested dimension -- `toolchain_removal`
      arm K, D3, spread 2 -- and the ledger records `third_pass = "none"` for it,
      because none happened.

      IT IS NOT THAT PASSES 3 AND 4 WERE THE ADJUDICATION. They were dispatched
      blind at the same time as passes 1 and 2, on the same packet, and BOTH SIT
      ON ONE SIDE OF THE SPLIT -- opus 2, 2 against sonnet 4, 3. A third pass
      exists to break a tie from outside it; four simultaneous blind passes are
      four first passes.

      So the rule has a remedy clause that has never once executed, in three
      epics, and until RD-01 nothing could even tell you when it was owed. That
      is one layer above the defect this epic is about: the flag was unimplemented
      AND the action the flag triggers is unimplemented, and the second is not
      fixed by fixing the first.
    reproduction: >-
      python3 examples/validation/scorecards/score_tools.py contested -- one
      group; specs/results/scorecards/INSTRUMENT-LOG.toml
      [[contested]] sm05-toolchain-d3-spread-2 -- third_pass = "none".
    evidence:
      - "specs/results/scorecards/subtract-to-measure-sm05/toolchain_removal/20260807-sm05rm-K-p1/scorecard.md:285 -- a judge rejecting a D3 = 4 its own execution supports because the port lives in a fixture"
      - "specs/results/scorecards/INSTRUMENT-LOG.toml -- the [[contested]] entry"
    why_out_of_scope: >-
      Dispatching a third pass now would be running a judge round inside the
      ticket that built the instrument measuring judge rounds. And both SM-05
      judges recorded that no new evidence could settle it, because the
      disagreement is about WHAT THE ARTIFACT IS -- which is RD-04's subject, not
      a pass that can be ordered.
    suggested_fix: >-
      Decide whether rule 5's third pass is a real procedure or a sentence, and
      say which on the card. If real, it needs a dispatch shape that is not "a
      fifth blind pass": a pass told what the split is about and required to cite
      evidence neither side cited. If not, delete the clause and record that a
      contested dimension is REPORTED and left contested -- which is what has
      actually happened every time.
    blast_radius: >-
      One group today. Every future round with more than two judges, or two
      judges two points apart.
    disposition: open

  - id: RD-01-DF-04
    found_by: "RD-01"
