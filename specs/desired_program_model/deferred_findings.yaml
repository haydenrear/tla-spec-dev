      `epic/subtract-to-measure`, TWENTY-ONE COMMITS BEHIND `origin/`.

      The front door was used exactly as the work order spells it. The local
      branch was at `67b9943` -- the commit that OPENED SM-06 in the plan -- while
      `origin/epic/subtract-to-measure` was at `6aac1ec` with SM-01 through SM-04
      merged. `wt` resolved the bare name against the local ref and created
      `feature/SM-06` from it.

      SM-06 depends on SM-04 and is sequenced behind it deliberately, because both
      touch `references/eval_scorecard.md`. Had this not been noticed, the ticket
