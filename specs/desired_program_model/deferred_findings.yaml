      AND NOTHING SAYS SO.

      `test_the_named_instruments_are_all_enumerated` asserts
      `required <= enumerated` against ten literal paths written by FI-02. It
      catches a RENAME that drops an existing row. It cannot catch an ADDITION
      that was never added, because a new instrument is not in `required` and
      the subset relation stays true.

      MEASURED ON THIS TICKET, not reasoned. FI-04 shipped
      `examples/validation/ab/eval/divergence.py` -- something that watches a
      subject (the A/B fixture), produces a verdict about it
      (`CLAIMED_REACHABLE_BUT_UNDEMONSTRATED`) and returns nonzero on it, which
      is the registry's own definition of an instrument. FI-02's suite was FULLY
      GREEN with it absent. FI-04 registered it by hand during the reconcile;
      had FI-04 not thought to look, the enumeration whose stated product is
      "NOTHING IS SILENTLY OMITTED" would have shipped one short and every
      count derived from it would have been wrong by one.

      THIS IS THE SAME SHAPE THE OWNER FLAGGED FROM FI-03'S RECONCILE -- FI-02's
      audit meta-check pinned to the unimplemented id `R-H5`, which went green
      when FI-03 implemented `R-H5`. Both are declarations that stop asserting
      when the world moves under them, and both are the
      `declaration_executability_rule`'s own failure shape inside the ticket
      that quotes it. `FI-01-DF-04` is the third instance (`PORT_REGION` as a
      transcribed constant).
