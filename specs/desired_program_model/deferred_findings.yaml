      workflow: ["references/eval_scorecard.md"]
    summary: >-
      (a) D3's ANCHOR 4 IS UNSATISFIABLE BY ANY SUITE THAT ACTUALLY ASSERTS THE
      PROPERTY IT IS ABOUT, AND THEREFORE REWARDS BLINDNESS TO IT. The anchor
      reads "3, and a driven port is exercised by a real adapter and a fake, WITH
      THE SAME CASES PASSING AGAINST BOTH." A case that asserts the real adapter
      wrote a file MUST FAIL against the fake -- that is what makes the fake a
      fake. So the anchor's own text excludes exactly the property that
      distinguishes a real adapter from a fake, and a fixture scores 4 BECAUSE it
      does not test durability. CL-03's version 4 pass 1 judge found the
      durability hole, nearly deducted, and refused: "I rejected the deduction
      because the finding is worse than a deduction: rung 4 is unsatisfiable by
      any suite that does assert durability, since such a case must fail the fake.
      The anchor structurally rewards blindness to the property that makes the
      real adapter real."

      CL-03's card iteration puts this in the CAVEAT and deliberately does not
      touch the anchor: an anchor is permanent under the change rule and 83
      sealed cards are read against it. The caveat tells a judge what the rung
      does not prove. IT DOES NOT MAKE THE RUNG SATISFIABLE.

      (b) D2's LADDER GRADES TWO DIFFERENT THINGS ON ONE AXIS, and it produced
      this round's only contested spread. Rungs 0-1 grade whether a MEASUREMENT
      happened; rungs 2-3 grade the DESIGN. An artifact that ships no figures
      cannot occupy rung 1 at all, so falling short of rung 2 drops it into the
      same cell as "measured and ignored". Two judges, one model, one artifact,
      one card version, wrote the SAME defect -- `_available` stored and
      hand-maintained across three write sites when R1 determines it -- both
      derived it away in scratch and got 28/28 through both wirings, and scored
      it 2 and 0. They do not disagree about the code.
    reproduction: >-
      (a) Write a case asserting the ledger file on disk contains
      "COMMIT acme 3 3" and run it through both composition points of
      `examples/validation/ab/reference_ports`: it passes under
      `QUOTA_LEDGER_IMPL=quota_ledger` and fails under `quota_ledger_fake`, so
      the suite that would catch the hole cannot satisfy anchor 4's "same cases
      passing against both".
      (b) `python3 examples/validation/scorecards/score_tools.py contested --root specs/results/scorecards`
      -> `CONTESTED D2 spread 2 -- claude-opus-5[1m]/pass 1 = 2, claude-opus-5[1m]/pass 2 = 0`
      on `close-the-loop-cl03-v5/toolchain_removal/CL`, with both rationales
      naming the same defect.
    evidence:
      - "specs/results/scorecards/close-the-loop-cl03-v4/toolchain_removal/20260811-cl03v4-CL-p1/scorecard.md -- Disclosures"
      - "specs/results/scorecards/close-the-loop-cl03-v5/toolchain_removal/20260811-cl03v5-CL-p2/scorecard.md -- Disclosures"
      - "specs/results/scorecards/INSTRUMENT-LOG.toml -- [[contested]] cl03-v5-d2-spread-2"
      - "references/eval_scorecard.md -- D3 anchor 4, D2 anchors 0-3"
    why_out_of_scope: >-
      An anchor change is not a caveat change. It moves `anchors_digest`, makes
      every one of 83 sealed cards incomparable across the bar, and CL-03's
      measurement is a controlled comparison whose whole validity rests on the
      anchors holding still. Changing the rung being measured, inside the ticket
      measuring it, is the move `measurement_rule` forbids. It is also a design
      question -- what a top rung on a port dimension should ask for when the
      distinguishing property is by definition not shared -- and it belongs to a
      round that can score the alternative.
    suggested_fix: >-
      For (a): the rung wants "the same cases passing against both" AND "at least
      one case that passes against the real adapter and FAILS against the fake,
      demonstrating the fake is a fake". That is two populations, not one, and it
      is a real anchor change with a version bump behind it. Do NOT fix it by
      widening the caveat further -- a caveat that has to carry a rung's meaning
      is a rung in the wrong place. For (b): split D2 into a recorded note about
