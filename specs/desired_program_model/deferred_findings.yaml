    why_out_of_scope: >-
      NOT out of scope: this is SM-04's own defect 2 and it is repaired here.
      Filed anyway, because the fix is not the finding -- the finding is that two
      independent adversarial channels named the right paragraph and the wrong
      file, and a third would have too. Recorded so the next round does not read
