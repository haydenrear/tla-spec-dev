  - id: SM-02-DF-03
    found_by: "SM-02"
    found_at_commit: "067c5ea"
    schedule_revision: 1
    severity: major
    surface:
      production: []
      tla: []
      adapters: []
      test_graph: []
      workflow: ["examples/validation/gap_mutants/run_gap_mutants.py"]
    summary: >-
      A SINGLE FLAKY NODE UNDER MACHINE CONTENTION PRODUCES A `DIES` THAT IS
      INDISTINGUISHABLE FROM A REAL KILL AT THE VERDICT LEVEL. `verdict()` returns
      `DIES` as soon as `new_failures()` is non-empty -- one node is enough -- and
      the rendered table prints `DIES <detector> <n> executed` with no indication
      of WHICH node died. A reader who does not open `new_failing_nodes` in the
      JSON cannot tell a kill from a coincidence.

      OBSERVED, not hypothesised. In SM-02's run of record `SM-GM-I1` reported
      `SURVIVES -> DIES` on `pytest-full`. Its one new failing node was
      `tests/test_testgraph_channels.py::test_runner_refuses_a_binding_without_a_channel`
      -- unrelated to the mutant (which skips `tests/test_complexity_ledger.py`),
      unrelated to anything SM-02 removed, and PASSING in the acceptance suite at
      the same commit. Re-run alone on a quiet machine at the same commit:
      `SURVIVES, 1290 executed, new_failing_nodes: []`. Three heavy pytest runs
      were in flight on one machine at the time (SM-02's own acceptance run,
      SM-03's ticket, and the staged-tree run).

      THE RUNNER ALREADY HAS THE MACHINERY TO SAY THIS AND DOES NOT USE IT. It
      excludes `SELF_DETECTION` nodes from the verdict and reports them separately
      in `self_detected_nodes` -- exactly the right shape, applied to exactly one
      known node. A cell whose entire kill set is a node the mutant's own
      `[[mutant.edit]]` paths cannot reach is the same class of problem and gets
      no such treatment.

      This is not the FI-01-DF-01 shape (a false SURVIVED). It is its mirror: a
      false DIES, which in a REMOVAL epic is the more expensive error, because a
      false DIES makes a cut look free when it is not -- or, as here, makes an
      untouched mechanism-2 row look like scope leakage from SM-02.
    reproduction: >-
      Compare the `SM-GM-I1` `pytest-full` cell in
      `specs/results/scorecards/subtract-to-measure/gap-mutants-after-SM-02.json`
      (`DIES`, one new node in `tests/test_testgraph_channels.py`) against
      `python3.14 examples/validation/gap_mutants/run_gap_mutants.py --family staged
      --only SM-GM-I1-the-cited-demonstration-node-is-collected-and-skipped --out /tmp/i1.json`
