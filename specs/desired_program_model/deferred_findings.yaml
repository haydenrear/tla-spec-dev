    summary: >-
      THE ONE PLACE A DECLARATION CAN STILL MOVE A REFUSAL, NAMED RATHER THAN
      LEFT TO BE FOUND.

      The design's A1 defence is that a DECLARED VALUE never refuses -- only the
      derived one does, and moving the derived value means moving the state out
      of the effectful module. That holds. But the demonstration table is
      re-derived from THE CARDS THAT MAP TO EACH SUBJECT, and that mapping is
      declared: `subjects.toml` says which round/arm labels belong to which
      scope. Nothing derives it and nothing can -- a sealed card carries no
      subject field and R-H4 forbids adding one.

      So an author who cannot edit `instance_state_in_effectful_modules` CAN
      edit which cards enter the comparison, and the separation is computed over
      whatever population that leaves. Dropping `arm_c` from `arm_a`'s label
      list, for instance, changes the population every `does not separate`
      verdict is read against.

      IT IS NOT HYPOTHETICAL IN ONE DIRECTION: RD-04's analysis computed
      null-entailment populations over MAPPED cards only, RD-05 had to choose
      the same, and the choice changes D1's reported population (the unmapped
      owner-pre card carries D1 = 0). Neither choice is wrong; nothing
      currently states which one the rule means.
    suggested_fix: >-
      Make the mapping checkable rather than trusted: `audit` could report any
      card of a mapped example that belongs to NO subject, so a card silently
      dropped from a population is visible the way `contested` is. RD-05 reports
      the count (1 of 49) and does not check it, because filing beats fixing
      during a measurement.
    blast_radius: >-
      Every refusal the axis grants, and every population range printed beside a
      `does not separate` verdict.
