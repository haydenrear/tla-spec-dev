      A BLINDED ROUND'S CARDS MAP TO NO DECLARED SUBJECT UNTIL SOMEBODY EDITS
      `subjects.toml` BY HAND, AND EVERY GATE IN THE ROUND'S OWN TOOLCHAIN
      REPORTS CLEAN WHILE THEY DO NOT.

      `scaffold` on a multi-arm round writes `subject.name: null` with
      `blinded: true`. That is correct and it is `F3`'s first defence -- a card
      whose own `subject` names the arm hands a judge the arm before it scores.
      The consequence is that `architecture_tags.subject_of` cannot use the card's
      own field and must fall back to the `labels` list in `subjects.toml`, and
      NOTHING WRITES THAT ENTRY. `scaffold` knows the round directory and the arm
      labels at the moment it blinds them, and does not record them.

      WHAT REPORTED CLEAN on SV-04's four unregistered cards, every one of them
      run before the gap was known:

        score_tools.py check --require-filled  ->  4 filled, 0 problem(s)
        score_tools.py seal                    ->  sealed 8 file(s)
        score_tools.py audit                   ->  0 violation(s)
        score_tools.py contested               ->  counts the groups correctly (3 -> 5)
        architecture_tags.py derive            ->  "16 of 20 decided; 4 refused",
                                                   BYTE-IDENTICAL before and after
                                                   the registration

      The only thing that caught it is
      `tests/test_architecture_tags.py::test_a_card_with_no_subject_is_legal_and_is_every_sealed_card`,
      which asserts every row but exactly one maps to a subject and failed
      `(82, 87)` -- and it sits in a repository suite that takes 21 minutes.

      THIS IS THE `C` CLASS OF `HARVEST-CL-03.md` -- gates that report clean on
      broken input -- inside the scoring toolchain itself, and it cost this ticket
      a full suite re-run. It also means a round can be scaffolded, judged, sealed
      into `INSTRUMENT-LOG.toml` and audited while its cards are invisible to
      every architecture-tag comparison, which is precisely the comparability
      machinery `RD-05` built them for.
    reproduction: >-
      Scaffold any multi-arm round (blinding is the default):
      `score_tools.py scaffold <dir> --example E --arms A,B --judges 2`.
      Fill the cards, then run `check --require-filled`, `seal`, `audit`,
      `contested` and `architecture_tags.py derive` -- all clean. Then run
      `pytest tests/test_architecture_tags.py::test_a_card_with_no_subject_is_legal_and_is_every_sealed_card`
      -> fails, naming the count. Add the round's `[round-dir, arm-label]` pairs
      to the matching `[subject.*].labels` in `subjects.toml` and it passes.
    evidence:
      - "examples/validation/scorecards/score_tools.py -- scaffold, which blinds `subject.name` and writes no label"
      - "examples/validation/scorecards/architecture_tags.py:321-337 -- `subject_of`, and its fallback to `labels`"
      - "examples/validation/scorecards/subjects.toml -- `[subject.toolchain_fixture]`, empty `labels` until SV-04 filled it"
      - "tests/test_architecture_tags.py:629 -- the only check that fails"
      - "specs/results/scorecards/score-drives-validation-sv04/RESULT-SV-04.md section 9c"
    why_out_of_scope: >-
      The registration itself is in scope and SV-04 made it -- the round is
      registered and the red is gone. What is out of scope is changing `scaffold`
      to write the label automatically, because `scaffold` is the instrument this
      ticket ran its own round through and editing it mid-ticket would change the
      instrument between the arms, which `R-H2` forbids.
    suggested_fix: >-
      Have `scaffold` append the `[round-dir, arm-label]` pairs to the named
      subject's `labels` when it blinds `subject.name`, since it holds both values
      at that moment and the blinding is exactly what makes them necessary. Failing
      that, make `check` refuse a filled card that maps to no declared subject --
      it already refuses a card whose `subject.scope` disagrees with
      `subjects.toml`, so the lookup is present and only the null-name case is
      unguarded. The second is smaller and turns a 21-minute discovery into an
      immediate one.
    disposition: repaired
    disposition_note: >-
      CONSUMED AND REPAIRED BY CA-03, VIA THIS FINDING'S OWN FIRST SUGGESTION:
      `cmd_scaffold` now calls `register_round()` and records the
      [round-dir, arm-label] pair when it blinds `subject.name`. The SECOND
      suggestion -- make `check` refuse -- was REJECTED as a sixth gate, which
      this epic forbids. R1 demonstration ships as
      tests/test_score_tools.py::test_a_blinded_round_registers_itself_and_the_unregistered_card_is_the_failing_input,
      which runs the failing input FIRST on the real subject `toolchain_fixture`
      -- the exact entry SV-04 filled by hand.

      DECLARED BOUND, RAISED BY INDEPENDENT REVIEW OF PR #266 AND NOT FIXED: the
      repair is guarded by `if args.subject and not args.unblinded`, and
      `--subject` is OPTIONAL. THIS FINDING'S OWN REPRODUCTION COMMAND CARRIES NO
      `--subject`, so that path is untouched and still produces cards mapping to
      no declared subject. The rejected `check` option would have covered it.
      Half the defect is closed, not all of it, and the record says which half.
      See five-checks.md, "DECLARED BOUND".
  - id: SV-05-DF-01
    found_by: "SV-05, running the shipped instrument to produce the per-version digest table the work order asked for"
    found_at_commit: "3e16b96"
    schedule_revision: 1
    severity: major
    surface:
      production: []
      tla: []
      adapters: []
      test_graph: []
      workflow:
        - "examples/validation/scorecards/score_tools.py"
        - "references/eval_scorecard.md"
    summary: >-
      `serve --card-version N` SILENTLY SERVES THE WRONG CARD FOR EVERY N BELOW
      THE CURRENT ONE, AND ONLY N ABOVE IT REFUSES.

      Measured at this tree, with `--digest-only`:

        --card-version 1   4,450 bytes   9 rungs   sha256:a753de37842e4953
        --card-version 2   5,191 bytes   9 rungs   sha256:d6bc48a44641aead
        --card-version 3   5,548 bytes   9 rungs   sha256:116146e48ecec13b
        --card-version 4   6,281 bytes   9 rungs   sha256:2d7d4a0506d9b259
        --card-version 5   6,281 bytes   9 rungs   sha256:2d7d4a0506d9b259
        --card-version 6   REFUSED, with a correct and helpful message

        the REAL version 4, --rubric examples/validation/scorecards/rubric_v4_frozen.md
                           6,319 bytes   9 rungs   sha256:a213a36770ccab09

      TWO SEPARATE DEFECTS, AND THE FIRST IS THE DANGEROUS ONE.

      (1) VERSION 4 AND VERSION 5 ARE BYTE-IDENTICAL, and neither is version 4.
      The diff between `--card-version 4` and the frozen v4 file is exactly two
      lines, and one of them is THE VERSION 5 CAVEAT -- "and two fakes are not a
      pair ... if the only observer of the effect the port exists for is the
      adapter that wrote it, say so and take 3". That sentence is the TREATMENT
      in this epic's headline experiment. A round that reproduces a version 4 arm
      through the flag alone serves the version 5 text under a
      `scorecard_version: 4` label, records `sha256:2d7d4a0506d9b259` as the
      served digest of a version 4 card, and `check` accepts it.

      (2) VERSIONS 1-3 RENDER AT 9 RUNGS, which is D2's four plus D3's five --
      the version 5 population. Versions 1-3 scored FIVE dimensions. The retired
      ladders are gone from the file, so those renders are cards that never
      existed, and nothing says so.

      SV-01 got the version 4 arm right ONLY because it used
      `--rubric rubric_v4_frozen.md`. THIS IS THE MECHANISM BEHIND THE STILL-OPEN
      `FI-06-DF-11(c)` -- five consecutive rounds reproducing an old card by
      operator sequencing rather than by tooling -- and it is worse than that
      finding states: the tooling route EXISTS and returns the wrong card without
      a word. The refusal path proves the tool knows how to say no; it says no
      only in the direction that cannot corrupt a record.
    reproduction: >-
      python3 examples/validation/scorecards/score_tools.py serve --card-version 4 --digest-only
      python3 examples/validation/scorecards/score_tools.py serve --card-version 5 --digest-only
      -- identical. Then:
      python3 examples/validation/scorecards/score_tools.py serve --rubric examples/validation/scorecards/rubric_v4_frozen.md --card-version 4 --digest-only
      -- sha256:a213a36770ccab09, and diff the two renders: the version 5 caveat
      is present in the first.
    why_out_of_scope: >-
      SV-05 is the evaluation and files findings without fixing them. Changing
      `serve` during a measurement round would edit the instrument four of this
      epic's eight cards were produced by. `references/eval_scorecard.md` is also
      outside this ticket's implementation_scope.
    suggested_fix: >-
      Make `--card-version N` REFUSE for any N whose text the current file cannot
      reconstruct, exactly as it already refuses N above the declared version, and
      name the frozen-rubric route in the refusal. The card file keeps retired
      anchors under `Retired anchors` where a person can read them and a judge
      cannot be served them, so the file already knows which versions it cannot
      rebuild. A second, cheaper half: have `scaffold` refuse to write a card
      whose `scorecard_version` is below the declared one unless `--rubric` names
      a frozen file.
    blast_radius: >-
      Every future A/B across a card version boundary, which is the design this
      programme has used for its last three headline results. Any such round run
      through the flag alone produces two arms that are byte-identical and a card
      set that looks like a version comparison and is not. It also silently
      breaks `FI-06-DF-11(c)`'s premise that the reproduction problem is
      operator discipline.
    disposition: open
  - id: SV-05-DF-02
    found_by: "SV-05, from disclosures volunteered independently and unprompted by all four of its blind agents"
    found_at_commit: "3e16b96"
    schedule_revision: 1
