  - id: CA-01-DF-01
    found_by: "CA-01"
    found_at_commit: "87a526b"
    amended_at_commit: "f8b40bb"
    schedule_revision: 1
    severity: minor
    blocking: false
    disposition: open
    surface:
      production: []
      tla: []
      adapters: []
      test_graph: []
      workflow: ["references/blind_dispatch.md"]
    summary: >-
      REFUTED IN ITS ORIGINAL FORM AND REWRITTEN. AS FIRST FILED THIS SAID
      BLINDNESS TO THIS PROJECT'S IDENTITY WAS NOT REACHABLE WITH THIS HARNESS,
      AND FILED IT BLOCKING. THAT WAS WRONG, AND IT WAS WRONG BY THE ONE FLAG
      CA-01 NAMED AND DECLINED TO MEASURE. `claude --safe-mode` authenticates
      normally on OAuth and removes the leak. Found by an independent reviewer of
      PR #263; filed by the epic owner as CA-00-DF-03; MEASURED INDEPENDENTLY BY
      CA-01 AFTERWARDS, and the two agree.

      CA-01's own two probes, same probe text as the original four:

        --safe-mode at the repository cwd
          auto-memory        GONE
          SessionStart hook  GONE
          project skills     GONE (11 built-in entries, no project units)
          MCP instructions   GONE
          gitStatus          STILL PRESENT, commit subjects and all

        --safe-mode in a neutral cell
          all of the above   GONE, including gitStatus
          agent's own words: "no instruction/memory file (CLAUDE.md), no
          repository status listing (the environment block states 'Is a git
          repository: false'), no MCP server instructions"

      SO NEITHER HALF IS SUFFICIENT ALONE AND THE COMBINATION IS. `--safe-mode`
      does NOT remove the gitStatus block: at the repository cwd the probe still
      received the five commit subject lines, and it reported REJECTING an
      inference from them -- "I was inclined to infer that 'attribute every red'
      and '210-row findings ledger' imply a scoring rubric with red/amber/green
      bands and therefore answer yes to (b)". That is the original leak class
      operating under safe-mode, caught only because the agent declined it.
      Conversely the neutral cell alone does not remove the hook or the skill
      listing. `--safe-mode` + a cwd outside any git repository removes every
      source this finding originally named.

      WHAT SURVIVES, and it is now a small finding rather than a blocking one:
      the `<env>` block and the scratchpad path. Under `--safe-mode` in a neutral
      cell these no longer name this project -- the cell is neutral by
      construction -- so the residue is that a judge knows its own working
      directory and platform. `--bare` would additionally drop the `<env>`
      dynamic sections and remains unusable here for the auth reason in
      CA-01-DF-02, which is unchanged.

      WHAT CA-01 ESTABLISHED AND WHAT IT DID NOT. Established: the EFFECT,
      twice, on this harness version, with the transcripts recorded. NOT
      established: whether `--safe-mode` disables auto-memory BY DESIGN or
      INCIDENTALLY. Its own `--help` text names "CLAUDE.md, skills, plugins,
      hooks, MCP servers, custom commands and agents, output styles, workflows,
      custom themes, keybindings, and more" -- auto-memory is not named, and "and
      more" is carrying it. A round that depends on this is depending on
      undocumented behaviour, which is the exact objection CA-01 raised against
      the `Explore` tier in CA-01-DF-03 and it applies here with equal force.
      RECORD THE MEMORY DIGEST BESIDE EVERY ROUND rather than trusting the flag.

      CONSEQUENCE FOR THE EPIC: judged rounds CAN be run effectively blind to the
      operator's conclusions, so GOAL-blind-dispatch clause (c)'s "state the
      impossibility" escape hatch was invoked PREMATURELY by CA-01 and is
      withdrawn. CA-08 should use `--safe-mode` plus a neutral cell and verify
      each round rather than assume it.
    reproduction: >-
      `cd <neutral dir outside any git repo> && claude --safe-mode -p "<the probe
      at specs/results/scorecards/cut-the-apparatus/CA-01/probes/probe-prompt.txt>"`
      and the same at the repository root. Transcripts:
      specs/results/scorecards/cut-the-apparatus/CA-01/probes/ARM-S1-safemode-repo.txt
      and ARM-S2-safemode-cell.txt.
    evidence:
      - "specs/results/scorecards/cut-the-apparatus/CA-01/probes/ARM-S1-safemode-repo.txt"
      - "specs/results/scorecards/cut-the-apparatus/CA-01/probes/ARM-S2-safemode-cell.txt"
      - "specs/results/scorecards/cut-the-apparatus/CA-01/ADDENDUM.md"
    why_out_of_scope: >-
      The remaining residue is the `<env>` block and the scratchpad path, which
      are emitted by the harness and are not reachable from this repository. The
      `--bare` route to removing them is blocked by credentials, which is
      CA-01-DF-02 and is the operator's decision.
    suggested_fix: >-
      CA-08 dispatches judges as `claude --safe-mode -p` from a directory outside
      any git repository, and runs `blind_dispatch.py check` on each reply rather
      than trusting the flag. A successor establishes whether the auto-memory
      suppression is by design -- one question to the harness's documentation
      owners, not a measurement -- because an incidental behaviour can change
      without notice.
    blast_radius: >-
      Positive rather than negative now. The epic can run judged rounds blind to
      the operator's conclusions, which changes CA-08's method. The residual risk
      is depending on undocumented behaviour without recording the memory digest
      beside the round.

