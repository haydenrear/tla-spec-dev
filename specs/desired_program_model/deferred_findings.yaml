  - id: SM-03-DF-01
    found_by: "SM-03 (build the instrument, then ask what it cannot report -- applied to the repair itself)"
    found_at_commit: "f0c215d"
    schedule_revision: 1
    severity: major
    surface:
      production: []
      tla: []
      adapters: []
      test_graph: []
      workflow: ["examples/validation/instruments/demonstrate.py"]
    summary: >-
      THE REGISTRY RUNNER JUDGES AN EXIT CODE WHERE ITS SIBLING ONE DIRECTORY
      OVER COMPARES FAILURE SETS, AND THAT IS WHY TWO TRIPWIRES STILL CANNOT BE
      DEMONSTRATED.

      SM-03 made `run_pytest` stage, which is what turned `spec-yaml-tripwire`
      and `source-citation-tripwire` from `no-demonstration-constructible` into
      `demonstrated-can-fail`. It did not make the third and fourth
      demonstrable, and the reason is not the tripwires.

      A staged tree small enough to build is not GREEN to begin with.
      `tests/test_port_declarations.py` imports `run_generated_case_adapters`
      transitively through `scripts/`, so three of its nodes are red before any
      fault is seeded. Measured: seeding a degenerate `target: "**"` into the
      staged manifest produces exactly one NEW failure,
      `test_no_declared_port_target_is_degenerate[program_model]`, and nothing
      else moves -- so the demonstration is real and the runner cannot see it,
      because `judge()` compares `observed["exit"]` against `expect_exit` and
      red-on-red is indistinguishable from red-on-green.

      THE FIX ALREADY EXISTS IN THIS REPOSITORY, ONE DIRECTORY OVER.
      `examples/validation/gap_mutants/run_gap_mutants.py` runs every detector
      on the PRISTINE staged tree first and records its failing node ids,
      because a `git archive` tree has nine pre-existing failures that read
      git history. Its verdict rule compares failure SETS and never exit codes,
      and its docstring says so in the third paragraph. The registry runner has
      no baseline pass at all.

      Note what this does to the count SM-03 reports: two rows are in
      "cannot be shown to fail" for a reason that is a property of the harness,
      which is the same class of error SM-01 found in the reason those rows
      carried BEFORE this ticket. One layer of it was peeled off and another was
      found underneath.
    reproduction: >-
      Stage `tests/test_port_declarations.py`, `scripts/effect_conformance.py`
      and `specs/program_model/spec_manifest.yaml` into a scratch tree and run
      `python -m pytest -q tests/test_port_declarations.py` -> `3 failed, 1
      passed, 2 skipped`, all three failures `ModuleNotFoundError: No module
      named 'run_generated_case_adapters'`. Rewrite one manifest port's
      `target: "**/specs/**"` to `target: "**"` and run again -> `4 failed`,
      the new one being
      `test_no_declared_port_target_is_degenerate[program_model]`. Both runs
      exit 1, so `expect_exit` decides nothing between them.
    evidence:
      - "examples/validation/instruments/demonstrate.py -- judge(), which reads observed['exit'] and the expect_* needles only"
      - "examples/validation/gap_mutants/run_gap_mutants.py -- 'THE BASELINE IS A SET OF FAILURES, NOT AN EXIT CODE'"
      - "examples/validation/instruments/instruments.toml -- the port-declaration-tripwire row, whose reason now records this"
    why_out_of_scope: >-
      `measurement_rule`: file findings, fix nothing during a measurement. SM-03
      already changed `run_pytest` once, to stage; adding a pristine-baseline
      pass would be a second structural change to the program that produces the
      count this ticket exists to report, inside the ticket that reports it. The
      before and the after would no longer be the same instrument, which is the
      objection SM-01 raised against editing `run_port_swap.py` mid-epic and it
      applies here unchanged.
    suggested_fix: >-
      Give `run_pytest` the baseline pass `run_gap_mutants.py` already has: run
      the cited nodes on the staged tree BEFORE the `mutate` block is applied,
      record the failing node ids, and judge on the difference. `expect_exit`
      then becomes redundant for staged slots rather than wrong. Roughly thirty
      lines, and every one of them already exists in the sibling runner.
    blast_radius: >-
      Two registry rows -- `port-declaration-tripwire` and
      `manifest-self-records-tripwire` -- and any future demonstration that
      wants to break a shipped file inside a tree too small to be green. It does
