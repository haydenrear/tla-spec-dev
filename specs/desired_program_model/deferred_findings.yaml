      week". The argument is sound and the consequence is unwatched: a sentence
      asserting how D2 has scored is not a statement OF the card, so nothing
      compares it to anything.

      Seven files carrying prior D-results were on NO dispatch's forbidden list:

        specs/results/complexity_ledger.json
        specs/results/skill_feedback.md
        specs/results/deferred_findings_hexagonal_prompting.yaml
        references/architecture_advice.md
        references/hexagonal_prompting.md
        examples/validation/instruments/instruments.toml
        examples/validation/ab/eval/results/*.json

      Every judge dispatch ever written forbids "everything under
      `specs/results/scorecards/`" and stops there. `complexity_ledger.json` and
      `skill_feedback.md` sit one directory up. `skill_feedback.md` has carried
      "GOAL-simpler-same-behavior MISSED (D2 = 2 from all four judges -- an A/B
      cannot reach anchor 3)" since `1a2b65f` on 2026-08-04, so SIXTEEN judges
      across three rounds (FI-03 v1, FI-03 v2, SM-04) could read the exact
      conclusion they were the instrument for. No SM-04 card mentions either file,
