    schedule_revision: 6
    severity: minor
    surface:
      production: []
      tla: []
      adapters: ["specs/desired_program_model/production_adapters.py", "specs/desired_program_model/case_adapters.toml", "specs/desired_program_model/tests/"]
      test_graph: []
    summary: >-
      `specs/desired_program_model`'s ADAPTER LAYER WAS A FULL TICKET BEHIND ITS
      OWN MODEL, AND ITS OWN TEST SAID SO WITHOUT ANYONE HEARING IT. At d3eb851
      the desired tree's TlaSpecDevCli.tla carried 15 @command actions
      (AC-01 added AnalyzeArchitecture) while its `case_adapters.toml` bound 14,
      its `production_adapters.py` had no `AnalyzeArchitectureAdapter`, and its
      `tests/test_tla_spec_dev_binding_reconciliation.py` still asserted
      "fourteen command actions".

      The reason nobody noticed is the finding: `run spec-unit-tests --scope
      project` targets `specs/current` ONLY, so the desired tree's spec-unit
      tests -- a 17-file suite, including the binding reconciliation check
      CD-09's gap G5 was opened to install -- HAVE NEVER BEEN EXECUTED. Had they
      run, the desired tree's own test would have failed at AC-01 and this would
      have been a one-line fix five tickets ago. This is the same shape as the
      audit's central observation, one layer down: an oracle that is never
      pointed at a surface reports nothing about it, which is not the same as
      reporting that it is clean.
    reproduction: >-
      At d3eb851: `diff specs/current/case_adapters.toml
      specs/desired_program_model/case_adapters.toml` -> the AnalyzeArchitecture
      binding is present in one and absent in the other. And
      `uv run --with pytest python -m pytest specs/desired_program_model/tests -q`
      -> the binding reconciliation test asserts 14 against a 15-action module.
    evidence:
      - "specs/.history/architectural-coherence-epic/ticket-002-AC-01/ (the ticket that grew the model without the desired adapters)"
      - "scripts/tla_spec_dev.py spec_unit_target_dirs (project scope resolves to specs/current only)"
    why_out_of_scope: >-
      The DESYNC is in scope and RC-01 fixed it -- `specs/*/production_adapters.py`
      is in this ticket's conflict keys, the plan's representation_scope names
      those files IN MODEL (round-2 ESC-9), and the ticket's own acceptance
      requires current and desired to be semantically equal. What is deferred is
      the MECHANISM: whether `run spec-unit-tests` should validate the desired
      tree at all, and if so under which scope. That changes the shipped
      command's target resolution for every user of this skill and is a
      behaviour decision, not a reconciliation.
    suggested_fix: >-
      Either add a scope that includes `specs/desired_program_model` (so the
      target model's own conformance suite runs), or delete the desired tree's
