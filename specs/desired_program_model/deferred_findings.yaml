  - id: RD-04-DF-01
    found_by: "RD-04"
    found_at_commit: "7514df0"
    schedule_revision: 1
    severity: major
    surface:
      production: []
      tla: []
      adapters: []
      test_graph: []
      workflow: ["examples/validation/scorecards/score_tools.py"]
    summary: >-
      `scope` DOES NOT MERELY FAIL ON A SUBJECT-SCOPED CLAIM. IT REFUTES ONE, AND
      WHICH ANSWER YOU GET DEPENDS ON WHERE THE LINE WRAPS.

      RD-01's `score_tools.py scope` resolves a figure's population from a NAMED
      EXAMPLE found in the window, and reports an ARM-SCOPED figure UNREACHABLE
      on the stated ground that arm labels are round-local and opaque by design.
      Every figure RD-04's design makes worth writing is scoped by a SUBJECT,
      which is neither an example nor an arm.

      Take the true figure "D3 = 4 on 10 of 10 `ports-and-adapters` cards of
      `ab_quota_ledger`". All 10 cards of the subject arm_b carry D3 = 4 and no
      other `ports-and-adapters` subject of that example has a card. `scope`
      gives it TWO DIFFERENT VERDICTS:

      QUALIFIER IMMEDIATELY AFTER THE COUNT -> UNREACHABLE, "the counted noun
      narrows the population with ['ports-and-adapters'], which names no example
      in this corpus".

      THE SAME QUALIFIER ANYWHERE ELSE -> REFUTED. After the card noun, in an
      aside, or on the next line, the narrowing word is invisible: scope falls
      back to the example, the population is 35, and it reports "25 card(s) in
      the population its words denote do not carry D3 = 4" and names twelve of
      them. EVERY ONE OF THOSE 25 IS A CARD ABOUT A DIFFERENT SUBJECT.

      THE CLAIM IS TRUE AND THE REFUTATION IS MANUFACTURED, by a checker that
      cannot see the axis the claim is scoped on.

      THE MECHANISM IS PLACEMENT, NOT WRAPPING. `scope` inspects a window of at
      most three words immediately after the count. Line-wrapping is one instance
      of that; it was found first and stated too narrowly, the epic owner could
      not reproduce it with different probe text and named the broader class, and
      two further probes confirm the general form on a single line.

      AND A SECOND BLIND SPOT COMPOUNDS IT, MEASURED BY RD-02: `scope` is keyed
      on a `D[1-5]` token, so a counted figure naming its dimension IN WORDS is
      never counted. A four-line probe carrying four counted figures reports
      "1 counted figure(s)".

      TOGETHER THESE MAKE RD-01's OWN HEADLINE A SCOPED CLAIM WHOSE SCOPE NOBODY
      STATED. Its denominator is `figures carrying a dimension token`, not
      `counted figures`; its numerator can include refutations that are artifacts
      of qualifier placement rather than false claims. REFUTED is the verdict
      GOAL-scope-loss-catchable counts as its HEADLINE, with no target on it and
      a high count declared the honest outcome, so a checker that can both miss
      figures and manufacture refutations can move that headline in EITHER
      direction. RD-01's own doctrine -- `absent` and `checked, none found` are
      different claims -- applies with more force to `refuted` and
      `could not read`.
    reproduction: >-
      Five probe files preserved at
      specs/results/scorecards/reading-discipline/GOAL-tags-earn-their-place/RD-04/analysis/wrap_probe/,
      with a README naming each. `python3
      examples/validation/scorecards/score_tools.py scope --path <that dir>/<f>`:
      same_line.md -> 1 UNREACHABLE; wrapped.md, qualifier_after_noun.md and
      qualifier_in_aside.md -> 1 REFUTED each, the last two on a single line;
      no_dimension_token.md -> "1 counted figure(s)" out of four.
    evidence:
      - "references/architecture_tags.md -- section 9.8"
      - "examples/validation/scorecards/score_tools.py -- evaluate_claim, the named-example branch"
      - "specs/results/scorecards/reading-discipline/GOAL-tags-earn-their-place/RD-04/RESULT.md -- section 3"
    why_out_of_scope: >-
      RD-04 is a research ticket and ships no production code. Changing
      `score_tools.py` is RD-05's surface and its conflict key.
    suggested_fix: >-
      RD-05 either teaches `scope` to resolve a subject scope from the cards'
      `subject.scope` field, or accepts that every architecture-scoped figure in
      this repository is UNREACHABLE and says so where a reader will find it.
      Both answers are legal; leaving it undecided is not.
    blast_radius: >-
      Every claim the tag design is built to enable, from the moment RD-05 ships
      it.
    disposition: open
