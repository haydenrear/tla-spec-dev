    summary: >-
      `check`'s CITATION GRAMMAR REJECTS THE ANNOTATED CITATIONS JUDGES ACTUALLY
      WRITE, AND SCORING RULE 2's STATED CONSEQUENCE IS NOT WHAT THE CODE DOES.

      `score_tools.py check --require-filled` over SM-05's eight cards reports 150
      problems and exits 1. EVERY ONE of the 150 is the same class -- "citation
      ... is not file:line or file:line-line" -- because judges wrote
      `path:line -- what is there` rather than a bare `path:line`. Zero problems
      are substantive: no missing citation, no 4 without `refuses_to_claim`, no
      D4 = 4 against `executed_own_faults: false`, no missing `anchor_reading`.

      So a round of eight well-evidenced cards fails the check that a workflow
      close runs, for punctuation. The fix a hurried operator reaches for is to
      rewrite the judges' citations, which is editing a measurement.

      SEPARATELY, THE RULE MISDESCRIBES ITS OWN MECHANISM. Rule 2 as served reads
      "A score with no citation is capped at 1, MECHANICALLY, by the schema
      check." `check` does not cap anything: it appends a problem string and
      returns a nonzero exit. The score stays as written and `index` and `history`
      print it unchanged. A rule that says it caps and only reports is the
      `declaration_executability_rule` shape the project has filed four times
      against other declarations.
    reproduction: >-
      python3 examples/validation/scorecards/score_tools.py check
      specs/results/scorecards/subtract-to-measure-sm05
      specs/results/scorecards/subtract-to-measure-sm05-greenfield --require-filled
      -- 150 problems, exit 1, all of one class.
