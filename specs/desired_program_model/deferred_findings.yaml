  - id: RD-04-DF-04
    found_by: "RD-04"
    found_at_commit: "7514df0"
    schedule_revision: 1
    severity: minor
    surface:
      production: []
      tla: []
      adapters: []
      test_graph: []
      workflow: ["references/architecture_tags.md"]
    severity_note: >-
      (c) IS BLOCKING FOR RD-05 AND IS ESCALATED TO THE EPIC OWNER RATHER THAN
      PARKED. It is recorded on this finding rather than as a sixth because the
      deferment budget is 5 and all three items are properties of the same
      derivation predicate.
    summary: >-
      THREE UNVALIDATED PROPERTIES OF THE DERIVATION PREDICATE: A PICKED
      THRESHOLD, A CLAUSE CORRELATED WITH THE ANCHOR IT SEPARATES ON, AND A
      STANDING INVARIANT THAT FORBIDS THE WHOLE MECHANISM.

      (c) THE THERMOSTAT COLLISION -- BLOCKING FOR RD-05, FOUND ONLY IN A TREE
      WITH NO PER-CHECKOUT HOMES.
      tests/test_code_complexity.py::test_no_reader_of_this_instrument_gates_on_its_output
      states a repository-wide invariant: a file "is allowed to refer to the
      instrument and to transcribe its figures. It is not allowed to branch on
      them, compare them, assert on them or exit on them -- that is a thermostat,
      whatever it is called."

      RD-04's derivation predicate branches on exactly those figures:
      instance_state_in_effectful_modules / instance_state against a threshold,
      declared_interfaces and effectful_calls against zero. RD-04's own analysis
      script trips the tripwire in the homeless tree, and RD-05's implementation
      will trip it harder because it will branch on a SHIPPED path.

      THE TWO READINGS. Either it IS a thermostat, in which case the tag cannot
      be derived at all -- and derivation is the ENTIRE anti-suppression
      mechanism, so a declared-only tag is the suppression key the ticket exists
      to prevent. Or it is NOT: the invariant is aimed at a figure deciding
      something about the CODE, and the plan's own no_new_gates_rule says a tag
      "constrains what may be COMPARED and refuses nothing about the code", so a
      derived tag is a classifier over the RECORD rather than a thermostat over
      the PROGRAM.

      RD-04's view is the second and it is a VIEW, NOT A DEMONSTRATION. The
      invariant as written carries no such exception, and the existing
      GATING_SCAN_EXEMPT entries are each bounded by a property another test
      checks. RD-05 MUST NOT ADD ITSELF TO THAT LIST without the invariant's
      scope being stated by the owner.

      (b) THE CLAUSE-(c) / ANCHOR-4 CORRELATION. Derivation clause (c) asks for a
      second implementation behind the seam; D3's anchor 4 asks for a driven port
      exercised by a real adapter AND a fake. Close enough that the D3 separation
      could be the predicate quietly encoding the anchor, in which case
      `ports-and-adapters` would ENTAIL a high D3 and the separation would
      measure nothing -- the same NULL-ENTAILED shape RD-02 found in the gap
      mutants, where a mutant can price a removal only if every detector that
      killed it is one the removal deletes.

      ENTAILMENT IS REFUTED BY THE RECORD: `ex4_pipeline_coherent` derives
      `ports-and-adapters` under all three clauses and was scored D3 = 3 by BOTH
      blind judges, so the predicate does not force a 4. (A claim about the
      PREDICATE, not a comparison across examples, so R-H2 does not bite.) The
      CORRELATION stands and is unquantified: one counterexample refutes
      entailment and does not measure how much of the separation the overlap
      explains. RD-05 carries it on the demonstration table row as a declared
      confound.

      (a) THE THRESHOLD.

      RD-04's derivation predicate requires
      `instance_state_in_effectful_modules / instance_state < 0.5`. Across the
      eleven subjects measured, the observed values are 0.100, 0.111 and 0.125
      against 1.000, 1.000, 1.000 and 1.000. ANY threshold in the open interval
      (0.125, 1.000) gives the identical answer on every subject in the record.

      No artifact anywhere near the boundary has ever been measured, so 0.5 is a
      choice and not a measurement. This is the shape of finding MF-020 is about:
      a number that looks derived and is picked.
    reproduction: >-
      specs/results/scorecards/reading-discipline/GOAL-tags-earn-their-place/RD-04/analysis/result.json
      -- the `state_colocation` field of each derived subject.
    evidence:
      - "references/architecture_tags.md -- sections 3.1 and 9.2"
    why_out_of_scope: >-
      Validating it requires an artifact that lands near the boundary and none
      exists. Manufacturing one to validate a threshold would be building the
      target for the measurement.
    suggested_fix: >-
      RD-05 makes the threshold a named, printed constant with the observed
      distribution beside it, so the first artifact that lands near it is visibly
      the one that decides the clause.
    blast_radius: >-
      One clause of the derivation predicate; currently decides nothing because
      no subject is near it.
    disposition: open
