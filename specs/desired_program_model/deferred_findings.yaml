  - id: SM-02-DF-01
    found_by: "SM-02"
    found_at_commit: "067c5ea"
    schedule_revision: 1
    severity: minor
    surface:
      production: ["scripts/run_generated_case_adapters.py"]
      tla: []
      adapters: []
      test_graph: []
      workflow: ["references/case_modules.md"]
    summary: >-
      THE RESIDUE OF THE CUT, AND THE TWO TOML READERS NOW DISAGREE ABOUT IT.
      SM-02 removed the `[ports.*]` branch from `load_mappings` and from
      `parse_simple_mapping_toml`. It added NO refusal, because
      `no_new_gates_rule` forbids one. The consequence is that the two readers
      the runner ships now behave differently on the same file:

        tomllib (Python >= 3.11, the normal path)  parses the `[ports.*]` table
          into a dict that `load_mappings` never looks at. A MIXED mapping --
          `[actions.*]` plus `[ports.*]` -- loads, runs, and silently drives
          zero port bindings, with nothing printed. A ports-ONLY mapping reports
          the pre-existing `no adapter mappings found in <path>`.

        parse_simple_mapping_toml (Python < 3.11, and the fallback)  now has no
          branch for `[ports.` at all, so the first `key = value` line inside
          the table raises `unsupported TOML line`.

      So the same file is accepted-and-ignored on one interpreter and rejected on
      the other. Both are defensible; having both is not. The four shipped
      mappings that still carry a `[ports.*]` table are all sealed measurement
      artifacts under `specs/results/scorecards/ports-as-adapters/GOAL-port-reach/measure/`,
      so nothing in the working toolchain hits this today -- which is exactly why
      it is easy to leave and easy to be surprised by later.
    reproduction: >-
      `python3 -c "import sys; sys.path.insert(0,'scripts'); from run_generated_case_adapters import load_mappings, parse_simple_mapping_toml; open('/tmp/m.toml','w').write('[actions.Commit]\nadapter = \"m:A\"\n\n[ports.\"ledger.LedgerAppendPort\"]\nadapter = \"m:R\"\nfake = \"m:F\"\n'); print(sorted(load_mappings(__import__(\"pathlib\").Path('/tmp/m.toml'))))"`
      -> `['Commit']`, no notice. Then feed the same text to
      `parse_simple_mapping_toml` -> `ValueError: unsupported TOML line`.
    evidence:
      - "scripts/run_generated_case_adapters.py -- load_mappings, parse_simple_mapping_toml"
      - "tests/test_ports_binding_removed.py::test_a_ports_only_mapping_now_declares_no_binding_at_all"
      - "tests/test_ports_binding_removed.py::test_the_fallback_toml_parser_no_longer_knows_what_a_ports_table_is"
    why_out_of_scope: >-
      Both candidate repairs add something. A printed notice re-introduces a
      reader of `ports` into the file this ticket is measured on removing code
      from, and a refusal is a new gate, which `no_new_gates_rule` forbids
      outright. Neither belongs in the ticket whose whole subject is whether a
      removal can be measured. Filed rather than fixed, per `measurement_rule`.
    suggested_fix: >-
      If it is ever worth spending, the cheap shape is to make the two readers
      agree by DELETION rather than by addition: have `load_mappings` reject any
      top-level table it does not know, which subtracts the asymmetry instead of
      adding a special case for `ports`. That is a refusal and therefore not
      SM-02's to make; it should be weighed against simply leaving a dead table
      inert, which is what the sealed artifacts want.
    blast_radius: >-
      Zero shipped mapping outside `specs/results/` declares a `[ports.*]` table,
      and the four that do are sealed evidence that is not re-run except by
      `run_gap_mutants.run_ports_family`, where the failure is already reported
      as CONTROL_RED rather than as a survival.
    disposition: carried
    disposition_ticket: "https://github.com/haydenrear/tla-spec-dev/issues/189"
    disposition_note: >-
      Carried to the successor epic RD-02 (#189): price the safety apparatus. The simplification came out net +1677 code_lines because every removal shipped new instruments to prove it safe, and nobody measured that as a cost.
