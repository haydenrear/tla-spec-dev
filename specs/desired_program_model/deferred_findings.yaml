    summary: >-
      D2 IS A CONSTANT ON THIS EXAMPLE, NOT A STABLE DIMENSION, AND THE LEDGER
      CITES ITS ZERO MOVEMENT AS THE STRONGEST STABILITY EVIDENCE IN THE
      PROJECT.

      D2 = 2 on **27 of 27** cards ever written about `ab_quota_ledger`,
      counting every sealed `specs/.history` snapshot: five rounds
      (hexagonal-prompting, EVAL-RERUN, PA-06, rescore-v1, rescore-v2), two card
      versions, three arms, an owner tracking pass, every judge. **Not one card
      has ever recorded any other value.** D3 on the same 27 takes 1, 2 and 4.

      AND IT IS FORCED BY THE ANCHOR, NOT BY THE ARTIFACTS. D2 anchor 3 requires
      "a simplification was made and its effect measured -- the before and after
      figures are both recorded". These artifacts are built once from a
      `FEATURE.md`; there is no before. The judges say so unprompted in their own
      rationales: "no before figure for this artifact exists anywhere" (PA-06
      T-p2), "Anchor 3 fails ... no simplification with before and after figures
      is recorded anywhere" (PA-06 W-p1), "Nothing was transformed from P into Q"
      (EVAL-RERUN Q-p1).

      A DIMENSION THAT HAS NEVER TAKEN A SECOND VALUE CANNOT BE SHOWN STABLE BY
      FAILING TO MOVE. D4 and D5 cannot carry a delta because they are noisy;
      D2 cannot carry one because it has no signal. Those are opposite defects
      and the ledger reports them as one good-news line.

      THE LEDGER ALREADY CONTAINS ITS OWN REFUTATION, FIFTY LINES ABOVE.
      `SELF-IMPROVEMENT.md:1069`, written at PA-06 close: "**D2 reaching 4.** No.
      All six cards are 2, and **anchor 3 is now known to be unreachable by
      construction under this task design.**" Then `:1122` calls D2's zero
      movement "the strongest stability evidence this project has ever produced
      about anything" and `:1144` records "D2 ... can it carry a delta? yes".

      AND THE MECHANICAL BLOCK DISAGREES WITH D2, which by the card's own
      scoring rule 7 is a finding. `scripts/code_complexity.py`, role=code:
      modules 1 / 4 / 1, declared_interfaces 0 / 1 / 0, internal_import_edges
      0 / 3 / 0, branch_points_in_effectful_modules **10 / 1 / 10**,
      instance_state_in_effectful_modules 8 / 1 / 7 -- on three arms making the
      same kind of outside-world call, so only LOCATION differs. D2 scores all
      three identically.

      The only D2 variation anywhere in the repository is on
      `architectural-coherence`'s ex1/ex3/ex6, a different example set that
      `R-H2` forbids reading across -- and those ten cards were scored at
      `ab0dfee`, where `references/eval_scorecard.md` is not in the tree and the
      cards carry no `anchors` block and no `rubric` key.
