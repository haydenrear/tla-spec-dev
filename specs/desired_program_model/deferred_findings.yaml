  - id: SM-05-DF-05
    found_by: "SM-05's blind judges (the ladder-fit question), escalating SM-04-DF-06"
    found_at_commit: "f49a1c9"
    schedule_revision: 3
    severity: major
    surface:
      production: []
      tla: []
      adapters: []
      test_graph: []
      workflow: ["references/eval_scorecard.md"]
    summary: >-
      THE LADDER DOES NOT FIT A SUBJECT THAT SHIPS NO MODEL. FOUR OF FIVE TOP
      RUNGS ARE STRUCTURALLY UNREACHABLE ON A GREENFIELD ARTIFACT, AND
      SM-04-DF-06's CUMULATIVITY CRACK IS NOT SPECIFIC TO D2 -- IT IS ON EVERY
      DIMENSION.

      SM-05 asked each judge, in the dispatch, to say where the ladder broke
      rather than smooth it over. `S-p2`, unprompted and in full:

        "four of five dimensions have a top rung this subject cannot reach for
        reasons of SHAPE, not quality -- D1/4 needs a model, D2/3-4 need a
        'before' (and D2's read_first names a descriptor that doesn't exist here
        at all), D3/4 needs a fake FEATURE.md explicitly permits omitting, and
        D4's whole question presupposes a baseline. A competent greenfield
        artifact tops out at 2-3 across the board no matter what it does;
        comparing these numbers to a model-carrying subject's compares different
        ladders."

      A SECOND CRACK SM-04 DID NOT HAVE. D2's `read_first` instructs the judge to
      "read the measured descriptor first (variables, actions, state-space bound,
      R/W density, modularity, dense rows)" -- a MODEL descriptor. `ab_quota_ledger`
      ships no model, so D2's own first instruction is unperformable on the
      subject this project scored 31 times. The only measurement in the packet is
      a CODE complexity block, which scoring rule 7 forbids converting into a
      score.

      AND THE CUMULATIVITY CRACK GENERALISES. SM-04-DF-06 reported a 2-to-4-point
      spread on D2 from one judge. Three more judges found it independently, at
      two tiers, and one widened it to every dimension -- `K-p2`:

        "'Score the LOWEST anchor the artifact fully satisfies' is served
        verbatim to every judge in both scorecard.md and how_to_fill, and read
        literally it yields 0 on every dimension. I scored the highest anchor
        fully satisfied and broke ties downward, which the tie-break clause
        presumes -- but a judge who took it literally would produce a card of
        zeros that looked like a finding."

      Four judges across two rounds have now rejected the served rule's literal
      reading in order to score at all. The rule as served is not the rule anyone
      applies.
    reproduction: >-
      `score_tools.py serve` and read the scoring-rules block against the D2
      anchors; then read `dimensions.D2.read_first` against any artifact under
      `blind/` that ships no `.tla`.
    evidence:
      - "references/eval_scorecard.md:99-101 -- 'Score the LOWEST anchor the artifact fully satisfies'"
      - "references/eval_scorecard.md:119-121 -- D2's read_first, naming a model descriptor"
      - "specs/results/scorecards/subtract-to-measure-sm05-greenfield/ab_quota_ledger/20260807-sm05gf-S-p2/scorecard.json -- the ladder-fit answer and the cumulativity rejection"
      - "specs/results/scorecards/subtract-to-measure-sm05/toolchain_removal/20260807-sm05rm-K-p2/scorecard.md -- 'yields 0 on every dimension'"
      - "SM-04-DF-06 -- the same crack, one judge, D2 only"
    why_out_of_scope: >-
      Rewriting an anchor or a scoring rule requires a version bump with its own
      measured discontinuity, and doing it inside the round that measures the
      anchors would pre-decide the result -- the identical reason SM-04 gave for
      not fixing SM-04-DF-06.
    suggested_fix: >-
      Two things, and the first is cheap. (1) Rule the tie-break explicitly:
      "score the HIGHEST anchor the artifact fully satisfies; when torn between
      two, take the lower and say why" is what every judge actually does and what
      the existing tie-break clause presumes. (2) Decide whether the card is for
      model-carrying subjects only. If it is, say so, and stop comparing greenfield
      cards to it. If it is not, D1/4, D2/3, D3/4 and D4/2-4 need rungs that a
      subject without a model can reach.
    blast_radius: >-
      Every card ever written. If a competent greenfield artifact structurally
      tops out at 2-3, then 31 of the project's 41 cards were scored on a ladder
      whose upper half was unreachable, and every cross-subject comparison drawn
      from them compares different ladders.
    disposition: carried
    disposition_ticket: "https://github.com/haydenrear/tla-spec-dev/issues/188"
    disposition_note: >-
      Carried to the successor epic RD-01 (#188): make a single-example generalisation catchable and make contested compute. The premise of subtract-to-measure was a claim about ONE example restated as a fact about the instrument, and nothing existed to refuse it.
    disposition_ticket: "https://github.com/haydenrear/tla-spec-dev/issues/169"

  - id: SM-05-DF-06
    found_by: "SM-05 (two blind judges disagreeing by two points, and naming why)"
    found_at_commit: "f49a1c9"
    schedule_revision: 3
    severity: major
    surface:
      production: []
      tla: []
      adapters: []
      test_graph: []
      workflow: ["references/eval_scorecard.md"]
    summary: >-
      D3 -- THE DIMENSION THIS PROJECT RESTS ITS CROSS-EPIC CLAIMS ON BECAUSE IT
      "DISCRIMINATES AND HOLDS STILL" -- SPANS TWO POINTS ON A REPOSITORY-SCALE
      SUBJECT, AND RULE 5's ADJUDICATION CANNOT SETTLE IT.

      On the toolchain removal, four judges scored D3 at 2, 2, 4, 3. The 2-vs-4
      pair is `contested` under scoring rule 5, which requires "a third pass that
      must cite NEW EVIDENCE, not re-read the same lines". Both judges state that
      no new evidence exists, because the disagreement is not evidentiary.

      `K-p2`: "A D3 of 4 I could have justified with my own execution -- 28/28
      against real and fake -- put aside because `reference_ports/domain.py:3-5`
      says that tree is a FIXTURE the instruments are pointed at, not the
      artifact. That is the largest swing in the card (2 vs 4 on identical lines)
      and it is a disagreement about what 'it' means, not about the code; NO NEW
      EVIDENCE WILL SETTLE IT."

      `K-p1`, independently: "D3 at the 2->3 seam, where 'the domain' silently
      changes referent."

      D3's anchors 3 and 4 say "the domain does not import its I/O" and "a driven
      port is exercised by a real adapter AND a fake". On a single artifact "the
      domain" is unambiguous. On a repository that CONTAINS test fixtures which
      themselves have domains and ports, it is not, and the card gives no rule for
      choosing the referent.

      A SECOND, SMALLER INSTABILITY: D3 moved one point on byte-identical
      greenfield bytes at the lower judge tier (`S-p3` = 1 against ten prior cards
      at 2). D5 shows the same one-point tier effect. D1 and D2 show none.

      AND NOTHING COMPUTES `contested`. Scoring rule 5 says a dimension where two
      judges differ by more than 1 "is RECORDED as `contested`". The field is
      per-card, every judge left it `[]`, and neither `check` nor `index` compares
      cards to each other -- `index` printed "contested: --" on all four removal
      rows while the D3 spread across them was two points. So the one rule the
      card has for judge disagreement is a declaration with no executor, which is
      the `declaration_executability_rule` shape this project has now filed
      against five separate declarations. The spread in this finding was found by
