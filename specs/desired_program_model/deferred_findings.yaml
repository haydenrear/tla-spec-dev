      does not contain.

      AND THE VERDICT IS A THEOREM, NOT A MEASUREMENT, FOR THIS FAULT CLASS.
      `entail` counts a kill as surviving iff its detector is not deleted AND
      `node_present(head, node)`; `node_present` returns False whenever
      `git show head:path` fails (`price_removal.py:175-193`, `:307-313`). So for
