  - id: CL-04-DF-06
    found_by: "CL-04's blind adopter probe -- an agent given only the files the skill ships, forbidden our source, our specs/ and our epic documents"
    found_at_commit: "0adfb79"
    schedule_revision: 1
    severity: blocking
    surface:
      production: []
      tla: []
      adapters: []
      test_graph: []
      workflow: ["references/adopting_the_scorecard.md", "examples/validation/scorecards/score_tools.py", "examples/validation/scorecards/architecture_tags.py", "references/architecture_tags.md"]
    summary: >-
      ESCALATED: the deferment budget is 5 per ticket and this is the sixth,
      because it is the direct answer to the question the epic exists to ask and
      because one of its parts is a CHECK THAT CANNOT FAIL.

      THE HEADLINE IS GOOD NEWS AND IT SHOULD BE READ FIRST. A blind agent given
      only `SKILL.md`, `README.md`, `references/`, `examples/`, `scripts/` and
      `templates/` -- forbidden our `.py` source, everything under `specs/`, our
      tests and our git history -- RAN THE WHOLE LOOP END TO END on an artifact
      it wrote itself: serve, scaffold, fill, check, index, seal, audit, bump the
      card to version 6, re-serve, re-score the same commit under both versions,
      declare the movement, `audit` clean at `0 violation(s)`. It reports the
      four documented commands worked, three of them first time. THE CHANGE RULE
      IS EXECUTABLE BY AN OUTSIDER. That has never been demonstrated before.

      (a) THE ARCHITECTURE AXIS IS A CHECK THAT CANNOT FAIL WHEN UNDER-INSTALLED,
      AND THIS IS THE PART THAT IS BLOCKING. `adopting_the_scorecard.md` section 1
      lists three files for the axis. A fourth, `scripts/code_complexity.py`, is
      required and is named only in `references/architecture_tags.md:125`. Without
      it every subject reads `derived=UNDERIVABLE:unmeasurable`. The probe then
      set a subject's `scope` to a DIRECTORY THAT DOES NOT EXIST and got
      BYTE-IDENTICAL OUTPUT. A real scope and a fabricated one are
      indistinguishable, so the axis is INERT rather than undecided, and nothing
      says which. `audit` compounds it by stating a falsehood: it reports the
      declared scope "is absent" when the scope is present and it is the
      DERIVATION that returned nothing. That is the `absent` versus
      `checked, none found` conflation this project's own `subjects.toml` header
      says it keeps finding, shipped in the axis that carries D3's refusal
      authority. The docs' fail-open defence
      (`architecture_tags.md:338`, "UNDERIVABLE has zero refusal authority") is a
      good defence of a derivation that RAN and declined; it does not cover a
      derivation that never ran.

      (b) THE MOVEMENT LEDGER IS UNDISCOVERABLE FROM THE ADOPTER PAGE, AND ITS
      KEY FORMAT IS DOCUMENTED NOWHERE. `adopting_the_scorecard.md` never mentions
      `INSTRUMENT-LOG.toml` or `[[movement]]`, yet the first `audit` after a card
      bump demands both. `eval_scorecard.md:581-583` names the fields and never
      says what a card is NAMED by. The probe brute-forced four wrong shapes
      before finding `<round>/<example>/<run_id>`, each failure returning the same
      line with no expected shape. The only working example of the syntax in the
      tree is `specs/results/scorecards/INSTRUMENT-LOG.toml` -- OUR PRIVATE
      MEASUREMENT RECORD, not documentation. An adopter reverse-engineering a
      config format out of somebody else's results file is the failure mode, not
      the workaround, and the probe rejected doing it.

      (c) `seal` CRASHES WITH A RAW TRACEBACK ON THE LAYOUT THE DOCS TELL YOU TO
      BUILD. Section 3 puts rounds at `results/round-1` and says to seal them; the
      obvious command dies in `pathlib` with `FileNotFoundError` on a missing
      `INSTRUMENT-LOG.toml`. `--root` fixes it and is documented -- in a different
      section.

      (d) `tags` PRINTS `REFUSED:` AND EXITS 0. Any CI wrapper reads that as
      success. The refusal message itself is the best in the tool.

      (e) NOTHING STOPS A SOLO ADOPTER FROM SILENTLY BREAKING SCORING RULE 5.
      Rule 5 requires two independent blind judges. `scaffold --judges 1` is
      accepted, `check --require-filled` reports 0 problems, and `contested`
      reports one judge group with nothing contested. The record does not say
      anywhere a reader would trip over it that the round had one judge. Compare
      the `--unblinded --reason` path, which is handled well and shouts at
      scaffold time.

      (f) SMALLER, AND ALL FIRST-CONTACT SURFACES. `UNDERIVABLE:unmeasurable` is
      the one reason code an under-installed adopter will hit and the only one
      not documented. The `--help` epilogue still says "scorecard_version 3". An
      adopter's generated `index` carries OUR fixtures and ticket ids
      (`ex6_jenga`, `ex4`, `RM-04`) into their file. `index` and `history` print
      D1/D4/D5 columns that have been dead since version 4. `subjects.toml` is
      offered as a file to copy when it is a file to replace, and copying it makes
      `audit` name twenty of our subjects as unverifiable in the adopter's tree.
    reproduction: >-
      Install only what section 1 of `references/adopting_the_scorecard.md` lists,
      declare one subject in your own `subjects.toml`, and run
      `python3 examples/validation/scorecards/architecture_tags.py`. Then change
      that subject's `scope` to a path that does not exist and run it again: the
      output is byte-identical. Copy `scripts/code_complexity.py` into place and
      run it a third time: the axis derives. For (c),
      `python3 examples/validation/scorecards/score_tools.py seal results/round-1`
      from an adopter tree laid out as section 3 describes. For (d),
      `python3 examples/validation/scorecards/score_tools.py tags; echo $?` with
      `architecture_tags.py` absent -> `REFUSED: ...` and `0`.
    evidence:
      - "specs/results/scorecards/close-the-loop/CL-04/RESULT.md section 8 -- the probe's full blocker list and what it rejected"
      - "references/adopting_the_scorecard.md -- section 1's file table, section 3's seal instruction"
      - "references/architecture_tags.md:125 -- the only mention of scripts/code_complexity.py"
      - "references/architecture_tags.md:338 -- the fail-open defence, which does not cover a derivation that never ran"
    why_out_of_scope: >-
      CL-04 is `role: evaluation` and fixes nothing. Every repair here is a change
      to a shipped instrument or to the adopter page, in the round whose product
      is the measurement of exactly those things.
    suggested_fix: >-
      (a) FIRST AND ALONE, because it is the one that reports a clean on nothing:
      make the axis distinguish "the derivation did not run" from "the derivation
      ran and declined". `tags` already refuses by name when `architecture_tags.py`
      is missing and that message is good; give the missing complexity dependency
      the same treatment, and make `audit` say "the derivation produced no figures"
      rather than "their declared scope is absent" when the scope exists. (b) Put
      the `[[movement]]` shape in `adopting_the_scorecard.md` with one worked
      example that is not our record, and print the expected shape in the
      violation. (c) `--root` in section 3's code block, and refuse instead of
      raising. (d) non-zero exit on REFUSED. (e) record the judge count on the
      round rather than adding a gate -- an adopter with one judge is a legitimate
      adopter whose record should say so. (f) is a doc pass. DO NOT respond to
      this by adding gates: the probe's own verdict is that the four core commands
      work and the optional subsystems are honestly optional, and the failure is
      that one of them lies about being installed.
    blast_radius: >-
      Nothing published changes value. It bounds what the epic may claim: the loop
      IS runnable by a stranger from the shipped documentation -- that is now
      demonstrated rather than asserted, and it is the epic's best result -- but
      an adopter who runs `audit`, reads its OPEN findings and tries to close them,
      which is the move a card bump makes mandatory, hits an undocumented config
      format. And any adopter who installs the axis incompletely gets an inert
      check reporting the same thing for a real scope and a fabricated one.
    disposition: open
  - id: SV-02-DF-01
    found_by: "SV-02, re-deriving RM-02's autopsy over the 87-card corpus"
    found_at_commit: "a527305"
