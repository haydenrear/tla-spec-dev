  - id: RC-01-DF-03
    found_by: "RC-01"
    found_at_commit: "d3eb851"
    schedule_revision: 6
    severity: minor
    surface:
      production: ["scripts/tla_spec_dev.py"]
      tla: ["specs/*/TlaSpecDevCli.tla"]
      adapters: []
      test_graph: []
    summary: >-
      THREE OF THE SIX GUARD-WEAKENING FLAGS CANNOT BE OBSERVED AT THE POINT THE
      MODEL RECORDS THEM. The owner's decision models the six flags as a
      weakened-close transition, and RC-01 lands it: `CloseTicketWeakened`, the
      `TicketClosedWeakened` stage, and a `guard_weakening` block written into
      the append-only close history. That block can name `--accept-new`,
      `--allow-open` and `--no-promote-current`, because those three reach
      `close ticket`. It cannot name the other three.

      `--validate-only` belongs to `run spec-unit-tests` and produces a run that
      reports success having executed no case body; `--force` and `--dry-run`
      belong to `scaffold` and `open ticket`. Each weakens a PRECONDITION a
      later close relies on, so a close that follows one of them is a weakened
      close in fact -- and the close path has no way to know it happened. The
      model represents the fact (this close did not pass the guarded
      precondition) and the record names the flags it can name; the gap between
      the two is recorded here rather than papered over.
    reproduction: >-
      `python3 scripts/tla_spec_dev.py --spec-root specs run spec-unit-tests
      --scope project --validate-only` prints "spec-unit validation passed" with
      no case body executed, and the subsequent `close ticket` history entry
      records `guard_weakening.weakened: false`.
    evidence:
      - "specs/current/TlaSpecDevCli.tla (CloseTicketWeakened, the recorded limit of observation)"
      - "scripts/spec_evolution.py weakening_flags_record"
    why_out_of_scope: >-
      Closing it means either threading a weakening record forward through the
      ticket workspace (new persisted state on the shipped CLI) or changing what
      `--validate-only` reports. Both are behaviour changes to commands outside
      this ticket's decision, and the owner's decision named the weakened CLOSE
      as the thing to model.
    suggested_fix: >-
      The cheap and honest version: have `run spec-unit-tests --validate-only`
      drop a marker into the ticket workspace, and have the close read it into
      the same `guard_weakening` block. That makes all four close-relevant flags
      observable in one record; `--force` / `--dry-run` on scaffold are further
      out, since the workspace they weaken may not exist yet.
    blast_radius: >-
      The strongest claim in this model. `ClosedTicketsPassedSpecUnitTests` is
      now narrowed to guarded closes and TLC proves it over 10,331,543 states,
      but a close following a `--validate-only` run is recorded as a GUARDED
      close, so the invariant's scope is slightly wider in the record than it is
      in fact. Three flags of six are covered; before RC-01 it was zero of six.
    disposition: open
    disposition_ticket: null
    disposition_note: >-
      Recorded on TlaSpecDevCli.tla's CloseTicketWeakened as a named limit of
      OBSERVATION rather than of the model, so a reader of the model meets it.

  - id: RC-01-DF-04
    found_by: "RC-01"
    found_at_commit: "c2dab33"
    schedule_revision: 6
    severity: minor
    surface:
      production: ["scripts/spec_evolution.py", "scripts/new_ticket_workflow.py"]
      tla: []
      adapters: []
      test_graph: []
    summary: >-
      THE COMPLEXITY LEDGER HAS NO REACHABLE-STATE FIGURE FOR THE TWO LARGEST
      MODEL DELTAS IN THIS EPIC'S HISTORY, AND NOTHING TOLD THE AUTHORS SO.
      `record_complexity_ledger` fills `distinct_states`, `generated_states` and
      `depth` only when it finds a TLC report at one of three CONVENTIONAL
      filenames -- `tlc-current.txt`, `tlc.txt`, `tlc-baseline.txt` -- sitting
      NEXT TO the ledger input, i.e. inside the ticket's own `results/`
      directory. The scaffolded `complexity_ledger.yaml` documents
      `validated_refactor`, `retention`, `coverage_audit`, `architecture_delta`,
      `justification`, `refinement`, `transition_diff` and `narrative` at
      length, and says NOTHING about this filename convention. There is no
      field to point at a report and no warning when none is found.

      The consequence, measured across the committed ledger: AC-01 -- the ticket
      whose 4.6x reachable-state increase is the epic's headline model-delta
      figure -- recorded `distinct_states: null`. EV-03 recorded null. RC-01
      recorded null, with a MEASURED 7.99x in hand and written into three other
      places. AC-04, which added no model delta at all, is the entry that
      carries `after: 1292951`, because its evidence happened to be named
      `tlc-current.txt` in its ticket results directory.

      So the machine-readable record of the standing objective carries the
      number for the ticket that did not move it and null for the three that
      did. Every one of those numbers exists, was measured, and is committed as
      evidence under a name the ledger does not look for.
    reproduction: >-
      `python3 -c "import json; d=json.load(open('specs/results/complexity_ledger.json'));
      [print(e['scope_id'], e['delta']['metrics']['distinct_states']) for e in d['entries']
      if e.get('scope_id') in ('AC-01','AC-04','EV-03','RC-01')]"`
      -> AC-01, EV-03 and RC-01 all-null; AC-04 after=1292951.
      The lookup is scripts/spec_evolution.py::record_complexity_ledger, the
      `for candidate in ("tlc-current.txt", "tlc.txt", "tlc-baseline.txt")` loop.
    evidence:
      - "specs/results/complexity_ledger.json (the null entries)"
      - "specs/results/rc01-tlc-current.txt (RC-01's measured figure, under a name the ledger does not look for)"
      - "specs/results/tlc-desired-epic-ac.txt (AC-01's, likewise)"
    why_out_of_scope: >-
      Two candidate fixes and both change shipped behaviour outside this
      ticket's decision: adding a field to the scaffolded ledger input changes
      the template every project gets from `scaffold workflow`, and making the
      absence a WARNING changes what `close ticket` prints for every close. RC-01
      also cannot repair its own entry -- the history is append-only and the
      entry is sealed, which is correct and is why this is filed rather than
      quietly re-closed.
    suggested_fix: >-
      Add `tlc_report:` to the scaffolded `complexity_ledger.yaml` with the
      convention documented beside it, keep the three-filename probe as the
      fallback, and PRINT ONE LINE at close when neither resolves: "reachable
      states not measured for this close -- no TLC report found at <paths>".
      A silent null in the record of the standing objective is the same shape as
      the defects this epic's audit was opened to find.
    blast_radius: >-
      The ledger's reachable-state series, retroactively. The BOUND series is
      intact and is what the ledger actually compares on
      (`DIRECTION_METRICS` includes `distinct_states`, but a null contributes
      nothing), so no verdict was wrong and no close was let through that should
      not have been. The cost is to the record: the standing objective's own
      history cannot show the reachable-state trajectory of the epic that grew
      the model most.
    disposition: open
    disposition_ticket: null
    disposition_note: >-
      Found by RC-01 while checking that its own 7.99x had landed in the ledger.
      It had not. RC-01's figure is recorded in
      specs/results/rc01-model-delta.md, in the plan's RC-01 model_delta_result,
      and in the ledger input's narrative -- three prose records and no machine
      one, which is exactly the arrangement this epic keeps finding.
