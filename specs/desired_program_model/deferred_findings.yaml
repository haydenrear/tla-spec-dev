    summary: >-
      The manual-test-starter path's central claim -- that a non-author can
      write an aspect from the public surface -- holds for SLICES and fails for
      GIVENS, and no document says so. A slice is writable from action names
      alone (README plus actions.yml). A Given must constrain EVERY variable of
      the view, which forces knowledge of all state variables and each action's
      guard; a public README names none of them. Measured by a blind agent that
      authored one of each. This matters because the Given is the form with the
      best measured ratio -- 60 authored lines produced 38 cases that killed
      EXACTLY what the 330-case whole-view corpus killed on a 12-mutant
      catalogue, an 8.7x reduction at zero measured loss -- so the mechanism
      with the strongest number is precisely the one that cannot be written
      from outside. Second, related: Step 0's requirement that the aspect list
      come from the model author and never be derived is UNENFORCEABLE. Nothing
      stopped the blind agent producing a complete, schema-valid,
      coverage-clean decomposition with no author in the loop; the `Source`
      column is free text and is never checked. The agent disclosed its own
      violation, which is the best available outcome and is not a control.
    reproduction: >-
      Read references/case_modules.md and the aspect-decomposition prompt for
      any statement of what a Given's author must know; there is none. Then
      compare specs/case_modules/Scenario_DeliveryPath.tla (slice, 14 authored
      lines, no state knowledge) with Scenario_RecordAfterDelivery.tla (Given,
      22 lines, constrains all six variables) in the ex4 fixture.
    evidence:
      - "examples/validation/runs/ex4-run3/scoring.md"
      - "examples/validation/runs/ex4-run1/scoring.md"
    why_out_of_scope: >-
      The case-module references and the aspect prompt are CM-01's conflict
      keys. EV-02 measures whether they are sufficient; rewriting them from
      inside the measurement would answer its own question.
    suggested_fix: >-
      State the precondition per FORM in the reference: a slice needs the
      action set, a Given needs the full variable set and every guard of the
      actions it admits. Then either give the Given an authoring aid that
      supplies that surface (a printed pre-state skeleton from the view), or
      say plainly that Givens are an inside-author form. For Step 0, either
