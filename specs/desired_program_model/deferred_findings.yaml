      `grep -c "D1, D4 and D5 all moved on unchanged input"
      specs/results/scorecards/falsifiable-instruments-rescore-v2/ab_quota_ledger/*/scorecard.md`
      -> 1 on each of six. Then, at any commit from SM-04 forward,
      `python3 -c "import importlib.util,sys; ..."` loading `score_tools` and
      calling `result_leaks(open(<that card>).read())`.
    evidence:
