  - id: SV-01-DF-02
    found_by: "SV-01"
    found_at_commit: "5e07dce"
    schedule_revision: 1
    severity: major
    surface:
      production: []
      tla: []
      adapters: []
      test_graph: []
      workflow: ["references/eval_scorecard.md"]
    summary: >-
      D2's ANCHOR LADDER IS NON-MONOTONE: RUNGS 0 AND 2 ARE SIMULTANEOUSLY
      SATISFIABLE, AND ONLY THE DIMENSION'S PREAMBLE FORECLOSES THE 0. THREE OF
      FOUR BLIND JUDGES RAISED IT INDEPENDENTLY AND UNPROMPTED, AND IT NAMES THE
      CAUSE OF AN ALREADY-RECORDED CONTESTED SPREAD.

      D2 anchor 0 reads "Complexity is unmeasured, or measured and ignored".
      Anchor 2 reads "The design's complexity is proportional to its behavior; no
      god-state, no variable written from everywhere". An artifact that never ran
      a complexity tool but whose design is proportional satisfies BOTH, and the
      instruction served to every judge is "score the LOWEST anchor the artifact
      fully satisfies". Read mechanically, that is a 0.

      The only thing standing against it is D2's `read_first` preamble -- "where a
      measured complexity descriptor exists you may read it, and on its own it
      decides nothing; where none exists that is not a gap in the evidence".
      Rungs 0 and 1 grade THE REPORT; rungs 2 and 3 grade THE DESIGN. They are two
      different scales sharing one ladder.

      Verbatim, from three separate cards on byte-identical bytes:
      "Anchor 0's text and the preamble say opposite things about the same fact; a
      judge reading the ladder without the preamble scores this 0. A 0-vs-2 spread
      on identical bytes is a rubric defect, not a judging one." / "The D2 ladder
      is non-monotone at that seam: applied mechanically, it scores 0 on any
      artifact that never ran a complexity tool, making D2 measure TOOL USE rather
      than design." / "Two judges weighting the anchor text vs. the `read_first`
      differently will split 0 vs 2 on byte-identical evidence."

      AND THAT SPLIT IS ALREADY IN THE SEALED RECORD. `[[contested]]`
      `cl03-v5-d2-spread-2` is D2 at 2 against 0 on one artifact, recorded by CL-03
      as "both judges wrote the same defect and differ only on where D2's ladder
      puts it", with no cause named. This is the cause, found by four judges who
      were never shown that card.

      This is the same shape as the D1/D4 autopsy in the epic charter: a dimension
      that grades toolchain use rather than the artifact.
    reproduction: >-
      Read D2's served block: `python3 examples/validation/scorecards/score_tools.py serve`.
      Anchor 0 and anchor 2 are both true of any artifact with a proportional design
      and no recorded complexity figure. Then
      `python3 examples/validation/scorecards/score_tools.py contested --root specs/results/scorecards`
      -> `cl03-v5-d2-spread-2`, D2 spread 2, third pass none.
    evidence:
      - "specs/results/scorecards/score-drives-validation-sv01-v4/ab_quota_ledger/20260812-sv01v4-GL-p1/scorecard.json -- D2 rationale and the rejected 0"
      - "specs/results/scorecards/score-drives-validation-sv01-v4/ab_quota_ledger/20260812-sv01v4-GL-p2/scorecard.json"
      - "specs/results/scorecards/score-drives-validation-sv01-v5/ab_quota_ledger/20260812-sv01v5-GL-p1/scorecard.json"
      - "specs/results/scorecards/score-drives-validation-sv01-v5/ab_quota_ledger/20260812-sv01v5-GL-p2/scorecard.json"
      - "specs/results/scorecards/INSTRUMENT-LOG.toml -- [[contested]] cl03-v5-d2-spread-2"
    why_out_of_scope: >-
      An anchor is PERMANENT under the change rule and 91 sealed cards are read
      against D2's ladder. Rewording a rung during a round that is measuring the
      effect of a card change is the one thing this ticket exists to be a control
      for, and it would make every historical D2 incomparable. SV-01 does not touch
      the card at all.
    suggested_fix: >-
      DO NOT REWORD AN ANCHOR to fix this, and do not add a rung. The cheapest
      carrier that does the job is a CAVEAT, which is what CL-03 established and
      what this round has just shown to be conditional rather than blunt: one
      sentence on D2 saying that where no complexity figure exists anywhere, rungs
      0 and 1 do not apply and the ladder starts at 2. Pay for it out of served
      bytes as CL-03 did. THE ALTERNATIVE WORTH CONSIDERING FIRST is that the
      finding is really that D2 rungs 0-1 grade the report and 2-3 grade the
      design, which is a dimension doing two jobs -- and the epic charter's
      question is whether a dimension can be scored without grading toolchain
      ownership. Hand this to SV-02 as evidence before anyone edits anything.
    blast_radius: >-
      Every D2 score in the record is read against a ladder whose bottom two rungs
      may not have been applicable. It does not move any published number by
      itself; it means a D2 of 2 and a D2 of 0 on comparable artifacts may be one
      judge reading the preamble and another reading the rung.
    disposition: open
