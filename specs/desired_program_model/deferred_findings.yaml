  - id: CL-04-DF-01
    found_by: "CL-04 (running the change rule downwards, which nobody had)"
    found_at_commit: "0adfb79"
    schedule_revision: 1
    severity: major
    surface:
      production: []
      tla: []
      adapters: []
      test_graph: []
      workflow: ["examples/validation/scorecards/score_tools.py", "references/eval_scorecard.md"]
    summary: >-
      CL-01'S BASELINE DEFECT IS ALIVE AT THE TIP WITH ITS DIRECTION REVERSED: A
      CARD REQUESTED AT AN OLD VERSION IS STAMPED WITH THAT VERSION AND SERVED
      THE CURRENT BYTES. The epic's baseline was "a v5 card is silently stamped
      version 4 and check reports 0 problems". CL-01 closed the UPWARD
      direction -- `--card-version 6` and `7` are refused by name, exit 2, with
      the two edits spelled out, and that refusal is real and good. The DOWNWARD
      direction was never closed.

      (a) `scaffold --card-version 4` AT THE TIP SUCCEEDS SILENTLY and writes a
      card carrying `scorecard_version: 4` with
      `rubric.served_digest: sha256:2d7d4a0506d9b259` -- which is VERSION 5's
      digest. The card's own `### Version history` table, in the same file
      `check` already parses, declares version 4's served digest to be
      `sha256:a213a36770ccab09`. Nothing compares the two. `check` reports 0
      problems, because the card truthfully records the bytes it was served; it
      is the VERSION LABEL that is false, and the version label is the one thing
      the second seal does not cover.

      (b) THE GUARD THAT CATCHES 1, 2 AND 3 IS STRUCTURAL AND CANNOT EVER CATCH
      4. `scaffold --card-version 1|2|3` IS refused, loudly and correctly,
      naming `rubric_v3_frozen.md` as the remedy -- but the refusal fires
      because the current file "carries no anchors for D1, D4, D5", not because
      any digest disagrees. Versions 4 and 5 share a dimension set, so no
      structural difference exists and the guard is silent. The one signal that
      would separate them -- the declared served digest -- is present and
      unused.

      (c) `serve` AND `scaffold` ANSWER THE SAME QUESTION TWO DIFFERENT WAYS.
      `serve --card-version 1 --digest-only` returns `sha256:a753de37842e4953`
      and `serve --card-version 1` emits a TWO-dimension card (D2, D3) labelled
      version 1 -- version 1 was a five-dimension card. `scaffold
      --card-version 1` refuses the identical request. The card file states the
      rule that `serve` is breaking, in the paragraph above the table: rows 1-3
      "can never declare" a served digest because "rendering them from this file
      would produce a digest no judge was ever handed". `--digest-only` produces
      exactly that digest, for versions 1, 2, 3 and 4.

      WHAT IS NOT WRONG, STATED SO THE FINDING IS NOT READ WIDER THAN IT IS: NO
      SEALED CARD IS RE-BASED. The four CL-03 cards carry their own recorded
      digests, `check` compares them against the current serve, and the two
      version-4 cards correctly report SERVED-DRIFT. Rows 1-3 declare no served
      digest, so no published row is contradicted. The damage is to
      REPRODUCTION, not to the record: for every version but the current one,
      `--digest-only` is not a reproduction path, and the only thing that has
      ever reproduced version 4's bytes is a frozen copy of the whole file.
    reproduction: >-
      In a clean checkout of `0adfb79`:
      `python3 examples/validation/scorecards/score_tools.py serve --card-version 4 --digest-only`
      -> `sha256:2d7d4a0506d9b259`, identical to `--card-version 5`, against
      `sha256:a213a36770ccab09` in the version-history table. Then
      `python3 examples/validation/scorecards/score_tools.py scaffold /tmp/probe
      --example probe --arms A --judges 1 --card-version 4` -> succeeds; the
      written card has `scorecard_version: 4` and served digest
      `sha256:2d7d4a0506d9b259`; `check /tmp/probe` reports 0 problems. The same
      command with `--card-version 1` is refused. And
      `serve --rubric examples/validation/scorecards/rubric_v4_frozen.md
      --card-version 4 --digest-only` -> `sha256:a213a36770ccab09`, which is the
      only way to get it.
    evidence:
      - "references/eval_scorecard.md -- `### Version history`, the version-4 row and the paragraph above the table"
      - "examples/validation/scorecards/score_tools.py -- cmd_serve, resolve_card_version, cmd_scaffold"
      - "specs/results/scorecards/close-the-loop/CL-04/RESULT.md section 4"
    why_out_of_scope: >-
      CL-04 is `role: evaluation` and fixes nothing. Beyond that, every repair
      here is a change to the shipped instrument, and the epic's measurement of
      that instrument is the artifact CL-04 is producing; changing `serve` in
      the commit that reports what `serve` does is the move `measurement_rule`
      forbids.
    suggested_fix: >-
      Cheapest honest repair: `resolve_card_version` already parses the version
      history, and the history already carries the served digest. When a version
      is requested that is NOT the file's declared current version AND the
      history declares a served digest for it, recompute and refuse on
      mismatch, with the frozen-rubric instruction the 1|2|3 path already
      prints. That closes (a) and (b) with no new field and no new gate. For
      (c), `serve --card-version N` for any N below the declared version should
      refuse for the same reason `scaffold` does, or `--digest-only` should
      print the declared historical digest rather than a freshly rendered one --
      but do NOT widen `anchors_digest`, which CL-01 rejected for a reason that
      still holds.
    blast_radius: >-
      No published card or figure changes value. What changes is what a future
      round may claim: any statement of the form "version N served these bytes"
      is only checkable for N = the current version, so a re-score across a
      version boundary must keep a frozen rubric file, as CL-03 did, and that
      operator convention is load-bearing rather than optional. It is
      `FI-06-DF-11(c)`'s fourth consecutive appearance seen from the other side.
    disposition: open
