      `path/to/file.py:164 (the outstanding counter incremented at three sites)`.
      Served scoring rule 2 says "Every score >= 2 cites `file:line`. A score
      with no citation is capped at 1, mechanically, by the schema check." A
      judge reading that has been told the citation is checked and has NOT been
      told that a parenthetical invalidates it.

      TWELVE OF TWELVE, at two tiers, with no communication between them. That is
      not twelve mistakes; it is the served card failing to state a machine
      requirement.

      THE CARDS WERE NOT NORMALISED. Stripping the annotations would edit twelve
      judges' measurements to satisfy a checker, and the annotations are the most
      useful part of several citations.
