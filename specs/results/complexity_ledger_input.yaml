# Workflow-ledger input for the ATTRIBUTE-THE-CATCH close.
#
# WRITTEN FOR THIS EPIC. The file it replaces was last touched by
# `5a0a39d Close the hexagonal-prompting spec workflow` and opened
# "Workflow close of complexity-descriptor-main-readiness" -- two epics before
# that. Closing this workflow against it consumed another epic's narrative,
# another epic's coverage-audit report, and another epic's TLC numbers into
# four permanent ticket receipts, each asserting a green `tlc_before` and
# `tlc_after` about a `SCAN-REMOVE` ticket that is not in this epic. The
# metrics were freshly measured; the EVIDENCE was recycled, and a receipt is
# append-only. Refreshing this file is what stops that.

narrative: >-
  Workflow close of attribute-the-catch. The epic ships documentation and
  prompts: `references/bug_attribution.md` (the four record kinds -- CATCH,
  REACH, BLIND, PRICE), the two surfaces that ask for them at ticket close-out
  and workflow close, `prompts/regression_architecture.md`, and AT-04's
  clause-by-clause evaluation of six goals. MODEL DELTA IS ZERO AND THAT IS THE
  TICKET: no TLA+ action, variable or invariant was added, removed or changed,
  and `specs/current` was byte-identical to `specs/desired_program_model` on
  every semantic file at close. Six goals MET; one clause of
  GOAL-the-record-says-what-caught-it is DESIGNED, NOT APPLIED, because the
  364-row ledger whose 27 out-of-vocabulary rows it would dispose lives on
  epic/stabilize-substrate and arrives with #296 -- stated in AT-04's RESULT.md
  as the epic's single largest limitation rather than worked around.

justification: >-
  ZERO model delta, so no TLA+ representation was added and none needs
  justifying. TLC was nonetheless run at close on the converged model rather
  than cited from a previous epic, so the receipts carry a measurement of THIS
  tree.

transition_diff: ""

validated_refactor:
  tlc_before:
    status: green
    evidence: >-
      Not a separate run, and deliberately not presented as one. Model delta is
      zero, so the before-model and the after-model are the same file and one
      TLC run measures both. A second run of an unchanged model would be the
      same numbers wearing a different label, which is the shape that made the
      recycled evidence hard to spot.
  tlc_after:
    status: green
    evidence: >-
      specs/current/TlaSpecDevCli.tla with MC.cfg, run at close on 2026-09-06:
      "Model checking completed. No error has been found." 2,505,440 states
      generated, 124,643 distinct, depth 24, 0 left on queue, finished in 02s.
  behavior_tests:
    status: green
    evidence: >-
      Full suite at the close tip: 12 failed, 1613 passed, 23 skipped -- item
      for item the standing baseline, with no failure introduced by this epic.
      The 12 are pre-existing and four of them assert against a ledger that is
      not on main; see #296.
  descriptor_comparison:
    status: recorded
    evidence: >-
      `diff -rq specs/current specs/desired_program_model` differs only in
      README.md, spec_manifest.yaml status metadata, and the two planning files
      the close ignores by design (desired_state.yaml, ticket_plan.yaml). No
      semantic file differs.

refinement:
  searched: true
  measured: true
  applied: false
  outcome: none
  detail: >-
    No reduction was searched for, because there is no model change to reduce.
    An epic that adds zero actions cannot simplify its way to a smaller one,
    and inventing a refactor to fill this field is the retrospective this
    programme has spent three epics learning not to write.

