# SS-03 -- the additive baseline resolution index.
#
# WHAT THIS IS, AND WHAT IT IS NOT.
#
# `R-H4` seals `specs/.history`. Every judged goal in this record -- 23 of 23,
# counted at 25600fa -- is declared ONLY in a plan under `specs/.history`, so
# not one of them can be made compliant by editing the goal. Editing a sealed
# plan is forbidden and would be the worse outcome anyway: a baseline that can
# be edited after the fact is exactly the property the seal exists to remove.
#
# So this file says, BESIDE the record, which sealed cards produced which sealed
# number. It is SS-03's assertion about somebody else's baseline. A COMPLIANT
# GOAL IS THE EPIC THAT WROTE THE NUMBER SAYING SO ITSELF, and this is not that.
# `baseline_is_a_card.py` reports a goal located this way as `card-via-index`,
# a verdict class of its own that is NEVER added to `card`. The `0 card-backed`
# numerator is unmoved by anything in this file, by construction.
#
# EVERY ENTRY CARRIES ITS CORROBORATION. A card is listed only where a field in
# the card itself -- `example`, `arm`, `commit`, `judge.pass`, a dimension score
# -- reproduces part of the goal's `baseline.value`. Where the value is an
# ABSENCE CLAIM ("NOT MEASURED", "NO TAGS EXIST", "0 FOR 7 EPICS", "ZERO"), no
# card can carry it and the entry says so and lists no cards. That is the
# finding, not a gap in this file: a judged goal whose baseline is a survey or
# an absence has nothing for an evaluation ticket to re-open, and the
# card-backed rule cannot be satisfied by it at all.
#
# `cards:` is read by the instrument. `corroborating_cards:` is NOT read by it:
# those cards support a sub-clause of the value, not the headline figure, and
# counting them would overstate what was resolved.
# A CIRCULARITY IN THIS FILE, NAMED BY THE SS-03 INDEPENDENT REVIEW AND NOT
# REPAIRED BY IT. The entries verdicted `no-card-produced-it` are exactly the
# entries with `cards: []`, and both were decided by the SAME pass -- the one
# that went looking for cards and did not find them. NOTHING HERE INDEPENDENTLY
# SEPARATES "no card could carry this claim" FROM "I could not attribute it".
# The distinction is argued per entry in each `note:`, and an argument is not a
# test. A reader who doubts a particular row should read its note and contest
# it; a reader who doubts the SPLIT should treat 15 as an upper bound on the
# unsatisfiable population, not as a measurement.
