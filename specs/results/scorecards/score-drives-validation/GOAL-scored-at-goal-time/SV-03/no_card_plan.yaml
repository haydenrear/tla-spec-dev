# SV-03. A project with NO CARD, designed for first and demonstrated rather
# than asserted.
#
# This is a complete, valid epic plan for a project that has never heard of a
# scorecard: two goals, both decided by a command, no rubric, no dimension, no
# judge, no `scorecard.json` anywhere. It is the subject of the before/after in
# `analysis/no_card_project_unaffected.sh`, which runs
# `git-epic-workflow/scripts/validate_epic_plan.py` over it from a PRISTINE
# copy of the skill and from a copy with all four proposed diffs applied, and
# diffs the two outputs.
#
# The claim being demonstrated is `the_card_is_never_mandatory`: this plan
# validates identically before and after, and a reader of the patched files
# never enters a sentence about a judged instrument, because every added block
# opens with a conditional this plan does not satisfy.
#
# Loads with BOTH loaders. Pinned by tests/test_goal_baseline_is_a_card.py.
version: 1
name: ingest-latency-epic
updated: null
purpose: >-
  Batched ingest cuts tail latency without losing throughput. The bench at bench/ingest.sh decides both goals, and it is the only instrument this epic has.
status:
  workflow: ingest-latency-epic
  active_ticket: null
  active_ticket_title: null
  desired_module: Ingest
  phase: planning
epic:
  id: ingest-latency
  branch: epic/ingest-latency
  default_branch: main
  base_sha: 8f21c0d
  schedule_revision: 1
deferment_policy:
  mode: batch
  blocking: escalate
  budget: 5
  backlog: specs/desired_program_model/deferred_findings.yaml
epic_goals:
  - id: GOAL-ingest-p99
    kind: perf
    statement: >-
      Batched ingest cuts tail latency without losing throughput.
    metric: >-
      p99 request latency over the ingest bench, three runs, median reported.
    harness: bench/ingest.sh
    baseline:
      value: p99 412ms
      measured_at: 8f21c0d
      evidence: results/epic-ingest/goals/GOAL-ingest-p99/baseline.json
    target: p99 <= 250ms
    evaluation_ticket: ING-02
    evidence_root: results/epic-ingest/goals/GOAL-ingest-p99
  - id: GOAL-throughput-held
    kind: perf
    statement: >-
      Throughput does not regress while tail latency falls.
    metric: >-
      Sustained events per second over the same bench run.
    harness: bench/ingest.sh
    baseline:
      value: 41200 events/s
      measured_at: 8f21c0d
      evidence: results/epic-ingest/goals/GOAL-throughput-held/baseline.json
    target: no worse than 40000 events/s
    evaluation_ticket: ING-02
    evidence_root: results/epic-ingest/goals/GOAL-throughput-held
tickets:
