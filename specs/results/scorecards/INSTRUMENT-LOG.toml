better between the two rounds: what changed is that the number stopped being
attributable to the treatment. A reader who takes the ceiling moving 2 -> 3 as
progress and the arm attribution as settled has read one instrument's output as
if it were two rounds of improvement.

STILL UNDER REVIEW, and for a narrower reason than when it was filed. PA-03's
re-derivation discharges the KILL-TABLE half of PA-05-DF-02 (see
