[[claim]]
id = "pa04-control-red-empty"
example = "ab_quota_ledger"
status = "known_wrong"
measured_at = "5a58b2b"
date = "2026-08-05"
corrected_by = "cb90a0a"
statement = "PA-04 at 5a58b2b: control_red = [] on all three subjects -- no control is red."
why = """
KNOWN-WRONG, AND IT IS THE CLEANEST WORKED EXAMPLE THIS EPIC HAS PRODUCED,
because it is the case the reading rules did NOT yet cover. `control_red`
reported only instruments that failed on UNMUTATED code. It never executed a
control's declared ROLE against the measured count, so `PA-M14` SURVIVING four
columns that each ran 294 accepting `Reserve` cases raised nothing, and the
field shipped empty. Repaired at cb90a0a: 4 red entries for `PA-M14` and 3 per
arm for `M07`, each carrying `witness_ran_accepting: 294`.

NO NUMBER MOVED. Zero verdicts changed across all 90 cells -- verified
independently by PA-05 by diffing every `per_mutant[*].cells` block before and
after -- and the instrument still got materially more honest. R-H3 said "a
number that moved because the instrument was repaired is not improvement"; this
is the converse it did not say, and the log now records it as
`verdicts_moved = 0` on the change itself. The kills are untouched; what changed
is that the SURVIVED cells beside them are now correctly labelled a FLOOR.

It is EVAL-SUPPRESS with the sign flipped: that closed "a declaration can ERASE
a demonstrated kill", this closes "a role string can FAIL TO RAISE a
demonstrated control failure". Both were declarations that nothing executed --
which is the class of artifact this epic keeps finding stale, and the reason
PA-05's own reading rules are executed by `audit` rather than merely written.
"""

[[claim]]
id = "goal-port-reach-clause-1"
example = "ab_quota_ledger"
status = "current"
delta_basis = "across_time"
measured_at = "cb90a0a"
date = "2026-08-05"
statement = "GOAL-port-reach clause 1: MET. A fault behind a port stops hiding -- PA-M12 is KILLED on corpus-port-swap:fake."
why = """
ONE HALF OF A SPLIT VERDICT. Recorded as its own claim precisely because the
goal no longer has a single verdict token: PA-04 reports clause 1 met and clause
2 not met, and a ledger that stored one word per goal would have to choose. A
demonstrated kill stands on its own and a red control cannot erase one
(EVAL-SUPPRESS); what the red control does is bound the cells BESIDE it.
"""

[[claim]]
id = "goal-port-reach-clause-2"
example = "ab_quota_ledger"
status = "current"
delta_basis = "across_time"
measured_at = "cb90a0a"
date = "2026-08-05"
statement = "GOAL-port-reach clause 2: NOT MET. The target reads '...and no positive control is red', and four are."
why = """
THE OTHER HALF, and it is the unflattering one, which is why it is recorded
separately rather than averaged into a word. It was failing at the moment "MET"
was written; the repair that surfaced it made the reported result WORSE, which
is always the allowed direction. The reverse -- re-seeding an in-region positive
control to turn the column green -- was available, is named in PA-03-DF-03's own
suggested_fix, and was declined twice as repairing an instrument after an
unflattering signal. Every port kill number on this goal is a FLOOR until the
control is green.
"""

