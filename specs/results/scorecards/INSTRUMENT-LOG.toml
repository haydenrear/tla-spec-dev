[[claim]]
id = "fi03-stable-against-the-adjacent-row"
example = "ab_quota_ledger"
status = "superseded"
superseded_by = "sm04-rescore-moves-two-points-with-practice-held"
delta_basis = "across_time"
measured_at = "51fe73d"
date = "2026-08-06"
statement = "FI-03: re-scoring the three sealed PA-06 artifacts moves at most ONE dimension-point per judge on every dimension, in both the version 1 and the version 2 arm."
why = """
TRUE AND NOT THE ANSWER TO THE GOAL, and the two must not be separated. The
target is met against the ADJACENT sealed row and missed against the row before
it -- see `fi03-d4-and-d5-cannot-carry-a-delta`. Quoting this claim without that
one is quoting the flattering half of one measurement.

Summed |movement|: 9 over 30 judge-scores for the v1 arm, 5 over 30 for the v2
arm, against the baseline's 13 over 20.

SUPERSEDED AT SM-04 (`2098d55`). True of what FI-03 measured and NOT true as a
statement about what re-scoring does. SM-04 re-scored one of the same three
sealed artifacts and moved D4 by TWO points on one judge against FI-03's own
version 2 row. "At most one dimension-point per judge" was a property of two
adjacent rounds, not of the instrument, and it was the flattering half of this
ticket's numbers -- which is exactly what its own `why` warned against, applied
one round too late to itself.
"""

[[claim]]
id = "fi03-d4-and-d5-cannot-carry-a-delta"
example = "ab_quota_ledger"
status = "current"
delta_basis = "across_time"
measured_at = "51fe73d"
reaffirmed_at = "2098d55"
date = "2026-08-06"
statement = "FI-03: against EVAL-RERUN -- the same bytes, the same card version, one round further back than PA-06 -- D4 moves 2 dimension-points per judge in BOTH arms and D5 moves 2 in the version 2 arm. GOAL-scorecard-carries-a-delta is MISSED on D4 and D5."
why = """
Arm A's D4 across four independent pairs of same-family blind judges on
byte-identical code: 2/2 (EVAL-RERUN), 4/4 (PA-06), 3/4 (FI-03 v1), 4/4 (FI-03
v2). A two-point range with no artifact underneath it.

The two dimensions fail for DIFFERENT reasons and the difference is the useful
part. D4 is an UNRECORDED PRACTICE: its anchor 4 asks for a behavior-breaking
change shown to be caught, and a judge who runs one awards it while a judge
reading a kill table does not. That now has a mechanism -- version 2 records the
practice and gates the anchor on it. D5 is an AMBIGUOUS ANCHOR: both version 2
judges executed their own faults and still split 3 against 4 on the same
artifact, over whether an artifact's own disclosure of a limitation is "a result
unflattering to the thing being scored". No mechanism was shipped for that one.

RE-AFFIRMED AT SM-04 (`2098d55`), AND STRENGTHENED ON THE HALF THAT MATTERS. This
claim's own `why` splits the two dimensions: D4 an unrecorded practice with a
mechanism now shipped, D5 an ambiguous anchor with none. SM-04 tested the first
half and it does not hold as an explanation. Four fresh judges, ALL FOUR
recording `executed_own_faults = true`, produced D4 = 2, 3, 3, 4 on the same
sealed artifact, and the single-judge movement against FI-03's version 2 row is
-2 with practice recorded true at BOTH ends. Recording the practice made the
variable visible; it did not make the dimension stable. `GOAL-scorecard-carries-a-delta`
is MISSED on D4 and D5 more firmly than when this was written. See `SM-04-DF-07`.
"""

[[claim]]
id = "fi03-d2-d3-zero-on-sixty-judge-scores"
example = "ab_quota_ledger"
status = "current"
delta_basis = "across_time"
measured_at = "51fe73d"
reaffirmed_at = "2098d55"
date = "2026-08-06"
statement = "FI-03: D2 and D3 moved ZERO dimension-points on all 60 judge-scores measured -- two fresh judge pairs, two card versions, three artifacts, two sealed baselines. D1 moved zero against EVAL-RERUN in both arms."
why = """
THE LOAD-BEARING HALF. D3 = 4 / 2 / 1 across the three artifacts has now been
produced by FOUR independent pairs of judges on the same bytes, two of whom
executed the swap themselves and two of whom did not. `ports-as-adapters` rested
its headline on D3 and that decision is vindicated by measurement rather than by
argument.

D1's only movement is against PA-06, and both instances are PA-06's pass-1 judge
giving a 4 where every other judge in three rounds gave a 3. SELF-IMPROVEMENT.md
lists "D1 crossing 3 on any example" as a thing that has never happened; PA-06
recorded it happening; IT HAS NOT REPLICATED.

RE-AFFIRMED AT SM-04 (`2098d55`) ON 20 MORE JUDGE-SCORES, and the twenty are the
strongest of the eighty because they are the first served a card carrying no
statement about how any dimension has scored or moved (`SM-04-DF-01`). D2 and D3
moved zero across the version 2 to version 3 bump and zero against FI-03's rows.

READ THE TWO HALVES APART, WHICH THIS CLAIM DOES NOT MAKE EASY. D3 taking three
values across artifacts and holding still on each is stability. D2 taking ONE
value on 31 of 31 cards ever written about this example is not stability, it is a
constant, and `FI-06-DF-05` says so. Every SM-04 judge gave anchor 3's
unreachability as the reason, unprompted and undisclosed to them. `SM-05` is the
ticket that decides it.
"""

