[[change]]
id = "EVAL-STABLE"
commit = "b285595"
date = "2026-08-04"
kind = "repair"
affects = ["ab_quota_ledger"]
verdicts_unmeasurable = """no cell-for-cell diff exists across this boundary: HP-06 and EVAL-RERUN scored DIFFERENT PAIRS OF ARTIFACTS, produced by re-dispatching the same two prompts to fresh agents, so there is no before/after table on one subject to diff. What is measurable, and is recorded above, is that M07 went from unreachable by anything (0 of 588 positive Reserve cases carried an argument) to decided on 5 of 7 instruments."""
paths = [
  "examples/validation/ab/eval",
  "scripts/infer_action_params.py",
]
summary = """
The positive control was red because of a missing regex. All four
parameter-recovery mechanisms looked at indices and whole variables and none at
the value written into a function entry, so `Reserve(t, a, r)`'s amount was
UNRECOVERABLE, 0 of 588 positive Reserve cases carried an argument, and M07 --
seeded inside reserve -- could not be reached by anything. A fifth mechanism
(except-value) took recovery to 4,028 of 4,028. In the same change M09 was
retired as a negative control (it reverses a sequence, and this model's ledger
IS a sequence, so it was never negative here) and replaced by N01 with a reality
witness, and reach began being printed per instrument.
"""
invalidates = [
  "arm A's `wrong_value` row as HP-06 recorded it",
  "\"union of every generated instrument: 9 of 10, survivor M07\" -- both describe an instrument that executed ZERO Reserve cases",
]

[[change]]
id = "EVAL-SUPPRESS"
commit = "3e721a5"
date = "2026-08-05"
kind = "repair"
affects = ["ab_quota_ledger"]
verdicts_moved = 1
verdicts_scope = "the rerun's own data, 11 mutants x 7 instruments x 2 arms"
paths = [
  "examples/validation/ab/eval/run_controls.py",
  "examples/validation/ab/eval/oracle.py",
  "scripts/kill_test.py",
]
summary = """
A declaration could erase a demonstrated kill. run_controls.py computed
NOT_DECIDABLE BEFORE the mutated run was consulted, so a declared limitation
converted a cell the instrument had actually KILLED, reporting verified: true,
green: true and exit 0, with no trace. And a limitation could verify against
nothing: `.get(key, 0)` made a missing count and a measured zero the same
number. The mutated run now decides first; a limitation may only convert a
SURVIVED cell, and over a kill it is reported contradicted_by_evidence and the
run exits nonzero. Every limitation now carries a witness_basis. Exactly one
cell changed when this round's data went back through the repaired driver: arm
B's M07 / corpus-slice-led, NOT_DECIDABLE -> SURVIVED, its control green -> RED,
exit 0 -> 1.
"""
invalidates = [
  "EVAL-RERUN's \"controls green on both arms\" -- false for arm B",
]

# NOTE THE CHRONOLOGY. EVAL-SUPPRESS post-dates EVAL-RERUN's measurement, so
# every number the rerun recorded came from a driver repaired afterwards. A
# scorer comparing naively across this boundary would compare two different
# instruments and call the difference progress.

