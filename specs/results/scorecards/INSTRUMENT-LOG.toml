[[claim]]
id = "guard-relaxation-3-of-3"
example = "ab_quota_ledger"
status = "current"
delta_basis = "within_run"
measured_at = "b3a0199"
date = "2026-08-04"
reaffirmed_at = "21da25b"
statement = "Guard relaxation measures 3 of 3 under `corpus-neg` on the seeded catalogue on both arms, and 1 of 1 on a fresh blind one, against 0 under every other generated instrument."
why = """
A REAL MECHANISM GAIN, and the reason it survives R-H3 is structural rather than
lucky: the 0 and the 3 were measured IN THE SAME RUN, on two instruments, not at
two points in time. `delta_basis = "within_run"` is what says so. The historical
0 of 3 / 0 of 3 / 0 of 4 figures are era-crossing and are NOT what carries this
claim; the within-run contrast is. The ledger re-affirmed it at 21da25b after
EVAL-SUPPRESS, explicitly: "GOAL-catch-bugs is untouched by this -- its met
verdict is carried by corpus-neg's guard-relaxation result, whose controls are
green and independently reproduced."
"""

