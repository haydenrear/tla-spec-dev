# The instrument log — what changed under the numbers, and when
#
# APPEND-ONLY. Nothing here edits a sealed card. This file is the "beside it"
# that `references/eval_scorecard.md` § Reading history (R-H4) requires: when a
# sealed number goes stale, the ledger records WHICH number and WHY, next to it,
# and the card stays exactly as it was measured.
#
# Read it with:
#   python3 examples/validation/scorecards/score_tools.py history --example E
#   python3 examples/validation/scorecards/score_tools.py audit
#
# Three record kinds:
#
#   [[change]]  an INSTRUMENT change. Everything measured before it is in a
#               different era from everything measured after it, and rows in two
#               eras are NOT comparable until the change is named. `audit`
#               verifies the commit resolves AND actually touched one of the
#               declared `paths` -- a fictional era boundary is a violation.
#
#   [[note]]    a correction recorded BESIDE a sealed card or a claim. The card
#               is never edited.
#
#   [[claim]]   a number that lives in prose rather than in a scorecard -- a
#               ledger sentence, a goal baseline, a headline. It goes stale the
#               same way a card does, and this project has now been bitten by
#               exactly that twice in one epic's own paperwork. `status` is one
#               of: current (asserted NOW, and policed), sealed (true of its
#               era, not read forward), superseded (needs `superseded_by`),
#               known_wrong (a MEASUREMENT that stopped being true; needs
#               `why`), refuted (an ASSERTION SOMEONE MADE IN REVIEW that was
#               falsified from data; needs `refuted_by` and `why`, and keeps its
#               `filed_as` so the finding stays reachable), under_review (needs
#               `filed_as`, naming a real id in deferred_findings.yaml, so a
#               number cannot be parked quietly). `filed_as` is verified on
#               EVERY status, not only under_review.
#
#   [[sealed]]  digests, appended by `score_tools.py seal`. See the end of file.

schema_version = 1


# ==========================================================================
# instrument changes
# ==========================================================================

[[change]]
id = "EVAL-STABLE"
commit = "b285595"
date = "2026-08-04"
kind = "repair"
affects = ["ab_quota_ledger"]
paths = [
  "examples/validation/ab/eval",
  "scripts/infer_action_params.py",
]
summary = """
The positive control was red because of a missing regex. All four
parameter-recovery mechanisms looked at indices and whole variables and none at
the value written into a function entry, so `Reserve(t, a, r)`'s amount was
UNRECOVERABLE, 0 of 588 positive Reserve cases carried an argument, and M07 --
seeded inside reserve -- could not be reached by anything. A fifth mechanism
(except-value) took recovery to 4,028 of 4,028. In the same change M09 was
retired as a negative control (it reverses a sequence, and this model's ledger
IS a sequence, so it was never negative here) and replaced by N01 with a reality
witness, and reach began being printed per instrument.
"""
invalidates = [
  "arm A's `wrong_value` row as HP-06 recorded it",
  "\"union of every generated instrument: 9 of 10, survivor M07\" -- both describe an instrument that executed ZERO Reserve cases",
]

[[change]]
id = "EVAL-SUPPRESS"
commit = "3e721a5"
date = "2026-08-05"
kind = "repair"
affects = ["ab_quota_ledger"]
paths = [
  "examples/validation/ab/eval/run_controls.py",
  "examples/validation/ab/eval/oracle.py",
  "scripts/kill_test.py",
]
summary = """
A declaration could erase a demonstrated kill. run_controls.py computed
NOT_DECIDABLE BEFORE the mutated run was consulted, so a declared limitation
converted a cell the instrument had actually KILLED, reporting verified: true,
green: true and exit 0, with no trace. And a limitation could verify against
nothing: `.get(key, 0)` made a missing count and a measured zero the same
number. The mutated run now decides first; a limitation may only convert a
SURVIVED cell, and over a kill it is reported contradicted_by_evidence and the
run exits nonzero. Every limitation now carries a witness_basis. Exactly one
cell changed when this round's data went back through the repaired driver: arm
B's M07 / corpus-slice-led, NOT_DECIDABLE -> SURVIVED, its control green -> RED,
exit 0 -> 1.
"""
invalidates = [
  "EVAL-RERUN's \"controls green on both arms\" -- false for arm B",
]

# NOTE THE CHRONOLOGY. EVAL-SUPPRESS post-dates EVAL-RERUN's measurement, so
# every number the rerun recorded came from a driver repaired afterwards. A
# scorer comparing naively across this boundary would compare two different
# instruments and call the difference progress.

[[change]]
id = "PA-01-three-arms"
commit = "e6d1351"
date = "2026-08-05"
kind = "extension"
affects = ["ab_quota_ledger"]
paths = [
  "examples/validation/ab/seeded_faults.toml",
  "examples/validation/ab/arm_c",
  "examples/validation/ab/check_catalogue.py",
]
summary = """
A THIRD ARM and a PORT-AWARE CATALOGUE. Arm C is length-matched to arm B in
unique content and asks for nothing architectural, which is the only thing that
separates "hexagonal helped" from "a longer prompt helped". The catalogue now
seeds faults deliberately INSIDE an adapter implementation -- the class the
predecessor proved invisible, because the port creates a region no shared oracle
reaches. Two arms became three and the fault population changed, so no
two-arm cell count from a previous round is a like-for-like comparison to
anything measured after this point.
"""

[[change]]
id = "PA-01-control-repair"
commit = "46c29c9"
date = "2026-08-05"
kind = "repair"
affects = ["ab_quota_ledger"]
paths = ["examples/validation/ab/seeded_faults.toml"]
summary = """
The positive control re-anchored BY THE PROPERTY rather than by the bytes:
[pa_control_properties] declares that a positive control must be invisible until
an accepted Reserve runs, and a probe checks it. Arm A HOLDS; arm B was BROKEN
and carried arm A's role string verbatim. Repairing an instrument before any
measurement is not the forbidden act; the forbidden acts are repairing after an
unflattering signal and moving a target to meet a result.
"""


