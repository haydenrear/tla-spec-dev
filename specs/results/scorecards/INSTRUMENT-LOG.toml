why = """
KNOWN-WRONG, AND IT IS THE CLEANEST WORKED EXAMPLE THIS EPIC HAS PRODUCED,
because it is the case the reading rules did NOT yet cover. `control_red`
reported only instruments that failed on UNMUTATED code. It never executed a
control's declared ROLE against the measured count, so `PA-M14` SURVIVING four
columns that each ran 294 accepting `Reserve` cases raised nothing, and the
field shipped empty. Repaired at cb90a0a: 4 red entries for `PA-M14` and 3 per
arm for `M07`, each carrying `witness_ran_accepting: 294`.

NO NUMBER MOVED. Zero verdicts changed across all 90 cells -- verified
independently by PA-05 by diffing every `per_mutant[*].cells` block before and
after -- and the instrument still got materially more honest. R-H3 said "a
number that moved because the instrument was repaired is not improvement"; this
is the converse it did not say, and the log now records it as
`verdicts_moved = 0` on the change itself. The kills are untouched; what changed
is that the SURVIVED cells beside them are now correctly labelled a FLOOR.

It is EVAL-SUPPRESS with the sign flipped: that closed "a declaration can ERASE
a demonstrated kill", this closes "a role string can FAIL TO RAISE a
demonstrated control failure". Both were declarations that nothing executed --
which is the class of artifact this epic keeps finding stale, and the reason
PA-05's own reading rules are executed by `audit` rather than merely written.
"""

