[[claim]]
id = "df02-flipped-cell-inside-the-comparable-set"
example = "ab_quota_ledger"
status = "refuted"
measured_at = "1cad5ea"
date = "2026-08-05"
refuted_by = "the epic owner, from the sealed raw kill tables at 3e721a5, and reproduced independently by PA-05"
filed_as = "PA-05-DF-02"
statement = "PA-05 asserted that EVAL-SUPPRESS's one flipped cell (arm B's M07 / corpus-slice-led) is INSIDE the 56 strictly comparable cells, and therefore contaminates GOAL-cases-drive-ports' baseline."
why = """
FALSE, AND IT IS DECIDABLE FROM THE SEALED RAW DATA RATHER THAN FROM PROSE --
which is the reproach this ticket earned, because PA-05 reasoned from
SELF-IMPROVEMENT.md's narrative about "one cell, one arm" instead of opening
`eval-suppress/arm-a-repaired.json` and `arm-b-repaired-sealed-catalogue.json`
and counting. Both files were sitting in the commit PA-05 had already declared
an instrument change.

M07 is excluded from the strictly comparable set under the rerun's own rule, so
moving one of its cells cannot change the 56. Of all 11 x 7 = 77 cells, exactly
two differ between the arms and both are M07.

RECORDED RATHER THAN DELETED, and kept `refuted` rather than `known_wrong`: this
was not a measurement that went stale, it was an assertion made in review that
was falsified. A finding that turned out to be wrong is evidence about this
epic's own review process -- and the review that caught it was a human reading
raw JSON, not a check. Nothing in `score_tools.py` could have caught this: the
tool can say a claim STRADDLES an instrument change, and it did say so
correctly, but it cannot say whether the change TOUCHED the cells the claim is
about. That limit is now stated in the finding.

ONE CORRECTION TRAVELS WITH THE REFUTATION -- see note PA-05-N-11.
"""

[[note]]
id = "PA-05-N-11"
about = "claim:df02-flipped-cell-inside-the-comparable-set"
kind = "the refutation is right and one step of its arithmetic is not"
field = "the denominator"
recorded_at = "2026-08-05"
by = "PA-05"
why = """
The refutation reached 56 as "excluding controls leaves 8 non-control mutants x
7 instruments". The conclusion is right and this step is not the reason.

The three declared CONTROLS are M07, M09 and N01. The three rows the rerun
excludes as "not the same diff" are M07, M08 and M10. Both sets have size three,
so both arrive at 8 x 7 = 56 -- but they are different sets, and the coincidence
is size, not construction.

It is decidable which rule the sealed numbers were computed under, because the
two rules disagree on HP-06: "non-control" gives 6 x 7 = 42 and DOES NOT
reproduce the sealed 49, while "not the same diff" gives 7 x 7 = 49 and does.
The rerun's own record states the rule in words -- "M07's arm-A and arm-B cells
-- plural, all seven -- are not the same experiment, and M08 and M10 are seeded
by ADDITION rather than perturbation, so three of eleven rows are not the same
diff".

Recorded because the whole purpose of writing a denominator down is that the
next reader can reproduce it, and "non-control" does not reproduce. It changes
nothing about the refutation: M07 is out of the denominator under BOTH rules.
"""

