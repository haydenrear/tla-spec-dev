confirmed on a third arm). Like for like on role=code the ported arm is LARGER on
code_lines 202/151/78, public_surface 25/20/11, modules 4/1/1 and classes 6/4/2,
and FLAT on branch_points 11/10/10, worst callable 4/4/4 and depth 1/1/1. The
smallest artifact on every size figure is arm C, the control that got no
architectural guidance at all. The one figure separating the DESIGNS rather than
their size is where the effects sit: branch_points_in_effectful_modules 1 against
10 and 10.

ALL SIX CARDS SCORED D2 = 2 and both judges gave the same reason: anchor 3 needs
a simplification with before AND after figures, and a from-scratch implementation
of one spec has no before. One judge filed it as a finding about the card --
"D2 contributed nothing to this comparison and will contribute nothing to the
next one under the same task design."

RE-AFFIRMED AT SM-04 (`2098d55`), having gone and looked rather than reasoning
from the bar. `SM-04-scorecard-v3` declares `references/eval_scorecard.md` and
`examples/validation/scorecards/score_tools.py`. Neither is on the path of this
measurement: nothing under `examples/validation/ab/`, `scripts/code_complexity.py`
or `specs/results/scorecards/ports-as-adapters/measure/` imports `score_tools`
or reads the rubric -- the three files that name them do so in a docstring. The
change is an era boundary for JUDGED cards and not for this one.
"""

[[claim]]
id = "pa06-scores-moved-on-unchanged-artifacts"
example = "ab_quota_ledger"
status = "current"
delta_basis = "across_time"
measured_at = "8878cd5"
reaffirmed_at = "2098d55"
date = "2026-08-05"
filed_as = "PA-06-DF-06"
statement = "Four dimension-points moved on artifacts that did not change by a byte: arm A D4 2/2 -> 4/4 and D5 3/2 -> 4/4, arm B D4 3/2 -> 4/4, between EVAL-RERUN and PA-06."
why = """
ITEM THREE ON THE LEDGER'S OWN "EVIDENCE WE ARE FOOLING OURSELVES" LIST -- a
score moving without an artifact moving -- and it happened. Arms A and B are the
sealed EVAL-RERUN trees, unedited; the blind copies PA-06 judged are proved
AST-identical to them with docstrings blanked.

DO NOT READ IT AS IMPROVEMENT, and R-H1 is why: the two rows sit in different
eras (`PA-03-corpus-port`, `PA-04-port-swap-columns`), the rubric gained
R-H1..R-H4 at PA-05, and the judges are different agents scoring from a
different packet -- EVAL-RERUN gave each judge ONE artifact's source and PA-06
gave each all three.

THE MECHANISM IS IDENTIFIABLE AND IT IS NOT THE RUBRIC. Both PA-06 judges wrote,
unprompted and independently, that they SEEDED THEIR OWN FAULTS and ran them
against each author's own suite instead of scoring the packet, and both said
that is what moved a score. D4 anchor 4 requires a demonstrated catch; a judge
who executes one can award it and a judge reading a table cannot. So the card's
top anchors are sensitive to JUDGING PRACTICE, which nothing in the rubric
mandates and nothing records.

NOTE WHICH DIMENSIONS DID NOT MOVE: D2 and D3, the two about the artifact's
shape, moved zero points on either arm. That is what makes this a finding about
the judging rather than about the artifacts.

RE-AFFIRMED AT SM-04 (`2098d55`), AND WIDENED. SM-04 re-scored arm A's artifact
with four more blind judges and D4 came out 2, 3, 3, 4 -- so the sealed EVAL-RERUN
to PA-06 movement this claim records is not an episode, it is a sample from a
range that now spans the whole usable scale. The claim stands exactly as written;
what has changed is that nobody should read it as a one-off. See `SM-04-DF-07`.
"""


