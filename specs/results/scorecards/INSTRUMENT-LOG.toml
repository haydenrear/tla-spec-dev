# ===========================================================================
# SM-04 -- scorecard_version 3, and the four judge-scores that priced it
# ===========================================================================

[[change]]
id = "SM-04-scorecard-v3"
commit = "2098d55"
date = "2026-08-06"
kind = "repair"
# NO `affects`, DELIBERATELY -- which applies this change to EVERY card rather
# than to one example. A card-version change is an era boundary for every judged
# card there is, and scoping it to the one example SM-04 re-scored would have
# been a false narrowing that happens to keep the audit quiet.
paths = ["references/eval_scorecard.md", "examples/validation/scorecards/score_tools.py"]
verdicts_moved = 0
verdicts_scope = """no cell was re-decided by this change: it re-scored one prior artifact with FOUR FRESH JUDGES rather than re-running an instrument over sealed cells, so there is no cell-for-cell diff to take. The 20 new judge-scores are new measurements, not moved ones, and they are declared as [[movement]] rows below where they pair with a sealed row."""
summary = """
THE ANCHORS DID NOT MOVE. `anchors_digest` is sha256:eeccf4576bc6fd85 at versions
1, 2 and 3 alike, and `check` recomputes it from the file on every run.

What moved is what a card RECORDS and what a judge is SERVED. A judge is now
handed a generated rubric and never `references/eval_scorecard.md`, which also
carries reading rules and prior results about the same five dimensions; every
card records `served_digest` over exactly the bytes it was served, plus
`file_sha256` over the whole rubric file; D5's anchor 4 records which of its two
defensible readings was used; and `total` is gone from the card and from every
rendering.

ROWS ABOVE AND BELOW THIS BAR WERE SERVED DIFFERENT BYTES, and before it nothing
recorded which. The served digest starts here, so for every card measured before
this bar the question "were these two judges served the same rubric" is
permanently unanswerable -- SM-04-DF-02.
"""

# The movement that matters, and it is not the version bump. Both ends record
# `executed_own_faults: true`, so `readable = true` is earned rather than
# asserted -- and the movement is still -2. Version 2's account of D4 was
# judging practice; practice is held constant here and D4 moved anyway.
