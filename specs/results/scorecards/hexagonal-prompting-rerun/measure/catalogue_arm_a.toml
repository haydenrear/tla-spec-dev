# EVAL-RERUN: the SEALED catalogue re-anchored onto arm A.
#
# `examples/validation/ab/seeded_faults.toml` is sealed and is NOT amended. Each
# of its ten mutants declares a `semantic` in arm-independent terms; this file
# writes arm-specific find/replace producing that semantic, and
# `check_catalogue.py --root <arm> --catalogue <this>` re-proves exactly-once,
# byte-identical revert and parse-after-mutation on THIS tree.
#
# `seeded_by` is recorded on every row and is a fact about the DIFF, not about
# the arm's quality:
#
#   perturbation -- an existing statement changed. The shape a person writes by
#                   accident.
#   addition     -- a statement invented and inserted. A fault that has no
#                   one-token form in this design.
#
# Every row on arm A is a perturbation. The arm-B catalogue is where the column
# earns its keep.

[catalogue]
id = "EVAL-RERUN-arm-a"
anchored_on = "quota_ledger.py"
root = "specs/results/scorecards/hexagonal-prompting-rerun/arms/arm_a/"
extends = "examples/validation/ab/seeded_faults.toml"

[[mutants]]
id = "M01-guard-zero-amount"
fault_class = "guard_relaxation"
gap_targeted = "a corpus replays only ENABLED edges; a zero-amount reserve is a refusal no positive state graph emits"
seeded_by = "perturbation"
path = "quota_ledger.py"
find = "        if amount < 1:"
replace = "        if amount < 0:  # MUTANT M01"
description = "reserve(t, 0) is accepted, allocating a reservation the feature forbids"
semantic = "The amount_not_positive guard admits amount == 0."
boundary_kind = "invariant"
boundary_ref = "R4-rejection-changes-nothing"
refine_variable = "available"
refine_action = "Reserve"

[[mutants]]
id = "M02-guard-over-quota"
fault_class = "guard_relaxation"
gap_targeted = "the same enabled-edges gap, on a guard a suite is less likely to exhaust"
seeded_by = "perturbation"
path = "quota_ledger.py"
find = "        if amount > self._available[tenant]:"
replace = "        if amount > self._quotas[tenant]:  # MUTANT M02"
description = "the quota guard compares against the total quota rather than what remains"
semantic = "A second reservation that fits the quota but not the remainder is accepted; available goes negative."
boundary_kind = "invariant"
boundary_ref = "R1-conservation"
refine_variable = "available"
refine_action = "Reserve"

[[mutants]]
id = "M03-guard-close-with-outstanding"
fault_class = "guard_relaxation"
gap_targeted = "TWO gaps at once: the enabled-edges gap AND the aspect slice gap -- the guard reads RESERVATIONS while the effect writes LEDGER"
seeded_by = "perturbation"
path = "quota_ledger.py"
find = """        if self._has_outstanding(tenant):
            return Result.rejected(OUTSTANDING_RESERVATIONS)"""
replace = """        if False:  # MUTANT M03
            return Result.rejected(OUTSTANDING_RESERVATIONS)"""
description = "close_tenant succeeds while reservations are still outstanding"
semantic = "The outstanding_reservations guard is removed; a CLOSE line is written whose total a later commit contradicts."
boundary_kind = "invariant"
boundary_ref = "R3-close-is-final-and-singular"
refine_variable = "closed"
refine_action = "CloseTenant"

[[mutants]]
id = "M04-durable-stale-total"
fault_class = "durable_content"
gap_targeted = "a silent mapping has no durable-write oracle; the in-memory state is entirely correct"
seeded_by = "perturbation"
path = "quota_ledger.py"
find = '        self._ledger.append(f"COMMIT {reservation.tenant} {reservation.amount} {total_after}")'
replace = '        self._ledger.append(f"COMMIT {reservation.tenant} {reservation.amount} {total_after - reservation.amount}")  # MUTANT M04'
description = "the durable running total is one commit stale; committed() in memory is correct"
semantic = "Each COMMIT line's running-total field carries the total BEFORE this commit."
boundary_kind = "port"
boundary_ref = "LedgerAppendPort"
refine_variable = "committed"
refine_action = "Commit"

[[mutants]]
id = "M05-durable-close-line-zero-and-swallowed"
fault_class = "durable_content"
gap_targeted = "the same silent-mapping gap, compounded: the write is wrong AND any error from it never reaches the caller"
seeded_by = "perturbation"
path = "quota_ledger.py"
find = '        self._ledger.append(f"CLOSE {tenant} {self._committed[tenant]}")'
replace = """        try:  # MUTANT M05
            self._ledger.append(f"CLOSE {tenant} 0")
        except Exception:
            pass"""
description = "every CLOSE line reports a final total of 0, and a failed durable write is swallowed"
semantic = "close_tenant writes CLOSE <t> 0 regardless of what was committed, and discards any write failure."
boundary_kind = "port"
boundary_ref = "LedgerAppendPort"
refine_variable = "committed"
refine_action = "CloseTenant"

[[mutants]]
id = "M06-wrong-status-on-release"
fault_class = "output_oracle"
gap_targeted = "an oracle that compares only projected AFTER-STATE; here the after-state is entirely correct"
seeded_by = "perturbation"
path = "quota_ledger.py"
find = """        self._available[reservation.tenant] += reservation.amount
        del self._reservations[reservation_id]
        return Result.accepted(reservation_id)"""
replace = """        self._available[reservation.tenant] += reservation.amount
        del self._reservations[reservation_id]
        return Result.rejected(UNKNOWN_RESERVATION)  # MUTANT M06"""
description = "release performs the full transition and reports that it did not"
semantic = "release(r) applies its correct effect and returns rejected/unknown_reservation."
boundary_kind = "invariant"
boundary_ref = "R4-rejection-changes-nothing"
refine_variable = "available"
refine_action = "Release"

[[mutants]]
id = "M07-positive-control-wrong-hold"
fault_class = "wrong_value"
control_role = "positive -- must die on every instrument that can execute an accepted Reserve"
gap_targeted = "none. In nobody's gap, on purpose: blatant, visible in projected state and in every downstream durable line."
seeded_by = "perturbation"
path = "quota_ledger.py"
find = "        self._available[tenant] -= amount"
replace = "        self._available[tenant] -= amount + 1  # MUTANT M07"
description = "reserve deducts one more than it holds, so conservation breaks on the first call"
semantic = "reserve(t, n) reduces available(t) by n+1. This is the FAITHFUL seeding: identical to the sealed catalogue's."
boundary_kind = "invariant"
boundary_ref = "R1-conservation"
refine_variable = "available"
refine_action = "Reserve"

[[mutants]]
id = "M08-cross-aspect-commit-refunds-the-hold"
fault_class = "cross_aspect"
gap_targeted = "a slice narrower than its view orphans the other aspect's variables; neither single-aspect slice constrains what Commit does to `available`"
seeded_by = "perturbation"
path = "quota_ledger.py"
find = "        self._committed[reservation.tenant] = total_after"
replace = """        self._committed[reservation.tenant] = total_after
        self._available[reservation.tenant] += reservation.amount  # MUTANT M08"""
description = "commit credits the ledger correctly AND gives the hold back"
semantic = "committed(t) and every ledger line are correct; available(t) is inflated and R1 breaks."
boundary_kind = "invariant"
boundary_ref = "R1-conservation"
refine_variable = "available"
refine_action = "Commit"

[[mutants]]
id = "M09-negative-control-ledger-order"
fault_class = "ordering"
control_role = "negative -- RETIRED at EVAL-STABLE; see eval/controls.toml. Still runs, still scored in its class row, decides nothing."
gap_targeted = "declared as the set-shape gap, and measured to be nothing of the kind on this model"
seeded_by = "perturbation"
path = "quota_ledger.py"
find = """        with self._path.open("a", encoding="utf-8") as handle:
            handle.write(line + "\\n")
            handle.flush()"""
replace = """        existing = self._path.read_text(encoding="utf-8")  # MUTANT M09
        self._path.write_text(line + "\\n" + existing, encoding="utf-8")  # MUTANT M09"""
description = "the ledger is written newest-first; every line is present and byte-correct"
semantic = "Ledger lines are prepended rather than appended. Only R5's ordering is violated."
boundary_kind = "port"
boundary_ref = "LedgerAppendPort"
refine_variable = "committed"
refine_action = "Commit"

[[mutants]]
id = "M10-apply-only-double-refund"
fault_class = "wrong_value"
gap_targeted = "an action whose adapter is apply()-only was invisible to the oracle before HP-04"
seeded_by = "perturbation"
path = "quota_ledger.py"
find = "        self._available[reservation.tenant] += reservation.amount"
replace = "        self._available[reservation.tenant] += reservation.amount * 2  # MUTANT M10"
description = "release returns double the reserved amount to available"
semantic = "release(r) credits available(t) with 2x the reservation amount. R1 breaks upward."
boundary_kind = "invariant"
boundary_ref = "R1-conservation"
refine_variable = "available"
refine_action = "Release"

