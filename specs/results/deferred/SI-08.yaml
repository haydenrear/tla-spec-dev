  - id: SI-08-DF-11
    found_by: SI-08
    found_at_commit: 2131cdad
    schedule_revision: 4
    severity: major
    surface: {production: [skills/spec-double-2/scripts/improvement_ledger.py], tla: [], adapters: [], test_graph: []}
    summary: >-
      THE EPIC PARTITIONED THE BACKLOG AND DID NOT TELL THE INSTRUMENT THAT
      DECIDES THE GOAL. `improvement_ledger.py` hardcodes its sources at lines
      82-83: `specs/results/deferred_findings_final.yaml` and
      `specs/results/epic-close/deferred_findings_next.yaml`. The per-ticket
      partition `specs/results/deferred/{ticket}.yaml` -- which
      `git-epic-workflow/references/deferment.md:47` declares as
      `per_ticket_backlog`, and which SI-15, the epic agent and now SI-08 all file
      into -- is read by NOTHING. Measured: 16 rows live there today
      (EPIC-AGENT 1, SI-15 5, SI-08 11) and are invisible to the ledger, which
      reports a population of 121 where the true population is 137. Ten of the
      sixteen carry a `skill_change` field, so the partition holds a
      DISPROPORTIONATE share of exactly the field the goal is measured on, and
      every one of them is uncounted. The goal's own number is therefore biased
      DOWNWARD by the epic's own filing convention.
    reproduction: >-
      sed -n '80,86p' skills/spec-double-2/scripts/improvement_ledger.py  (BACKLOGS is a 2-tuple);
      then: ls specs/results/deferred/*.yaml -> EPIC-AGENT.yaml SI-08.yaml SI-15.yaml;
      count their `findings:` rows (16) and compare with the ledger's own header,
      "improvement ledger -- 121 record(s) across 4 file(s)".
    evidence:
      - specs/results/epic-self-improvement-substrate/goals/GOAL-findings-become-changes/SI-08-EVALUATION-A.md
    why_out_of_scope: >-
      Adding a glob to the ledger changes the number the ledger reports for the
      goal this ticket is measuring, in the middle of measuring it. That is the
      one change an evaluation ticket may not make silently, so it is reported and
      the biased figure is published WITH its bias named rather than quietly
      corrected.
    suggested_fix: >-
      Add `specs/results/deferred/*.yaml` to `BACKLOGS` as a glob, and have SI-23
      re-read the goal with the partition included so the corrected population
      (137 and rising) is the one the epic closes on. Keep SI-08's 121 on the
      record as the reading taken before the fix.
    skill_change: proposed(spec-double-2, read specs/results/deferred/*.yaml in the ledger's BACKLOGS so the per-ticket partition is counted)
    blast_radius: >-
      GOAL-findings-become-changes directly, and it worsens as the epic proceeds:
      every ticket that follows the CURRENT filing instruction files into the
      partition, so the share of the record the instrument cannot see grows with
      each ticket that complies.
