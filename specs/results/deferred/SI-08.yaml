  - id: SI-08-DF-05
    found_by: SI-08
    found_at_commit: 2131cdad
    schedule_revision: 4
    severity: major
    surface: {production: [evals/run.sh, evals/lib/toolchain.py], tla: [], adapters: [], test_graph: []}
    summary: >-
      THE TOOLCHAIN RECORD AND THE SCORE ARE NOT JOINED BY ANYTHING. The baseline
      for GOAL-pinned-eval-toolchain complains that nothing "writes it next to a
      score". Measured on the first scored run ever performed: the score artifact
      `evals/results/<runstamp>/aggregate-result.json` contains ZERO occurrences of
      `toolchain`, `pinned`, or either pinned sha, and the run record is a SIBLING
      directory `evals/results/toolchain/<utcstamp>.json` whose stamp differs from
      the run directory's by five seconds. They share no run id, no case name, no
      key. Pairing them is a human reading two timestamps.
    reproduction: >-
      ./evals/run.sh --case use-the-front-door; then
      grep -c -iE "toolchain|286a3694|6ffacb88|pinned" evals/results/<runstamp>/aggregate-result.json
      -> 0. Compare ls evals/results/ (2026-09-20T16-45-12-045Z) with
      ls evals/results/toolchain/ (20260920T164507Z).
    evidence:
      - specs/results/epic-self-improvement-substrate/goals/GOAL-pinned-eval-toolchain/first-scored-run/
      - specs/results/epic-self-improvement-substrate/goals/GOAL-pinned-eval-toolchain/RUN-ATTEMPT.md
    why_out_of_scope: "Changing what run.sh writes is a behavioural delta to the instrument this ticket is measuring with. Rule 1."
    suggested_fix: >-
      Write the run record INTO the run directory `claude plugin eval` creates
      (run.sh already knows the path when it harvests results), or stamp the record
      with the same id. A one-line copy at harvest time is enough.
    skill_change: proposed(spec-double-2, write the toolchain run record into the eval run's own results directory so a score and its toolchain share a key)
    blast_radius: "Every future comparison of two scores. Attributing a moved score to a moved ref is the entire purpose of the pin, and today it rests on timestamp proximity."

  - id: SI-08-DF-06
    found_by: SI-08
    found_at_commit: 2131cdad
    schedule_revision: 4
    severity: minor
    surface: {production: [.gitignore], tla: [], adapters: [], test_graph: []}
    summary: >-
      `.gitignore:32` ignores `evals/results/`, so the toolchain run record a
      scored run writes is NOT committed by the run that made it. The goal's
      harness demands "the pinned ref must appear in the repository, not only in a
      run log" -- which the lock file satisfies -- but the per-run evidence that
      a given score ran at a given ref does not persist in git at all.
    reproduction: "git check-ignore -v evals/results/toolchain/20260920T164507Z.json -> .gitignore:32:evals/results/"
    evidence:
      - specs/results/epic-self-improvement-substrate/goals/GOAL-pinned-eval-toolchain/first-scored-run/run-record-20260920T164507Z.json
    why_out_of_scope: "Un-ignoring a results tree is a repository-policy change with blast radius well outside an evaluation ticket's slice."
    suggested_fix: >-
      Negate the ignore for the record only -- `!evals/results/toolchain/` -- so
      scores stay untracked while the toolchain provenance is committed. This
      ticket preserved its own copies under the goal evidence root by hand.
    skill_change: proposed(spec-double-2, un-ignore evals/results/toolchain/ so per-run toolchain provenance is committed)
    blast_radius: "Any attempt to audit, after the fact, which ref a past score ran at."

