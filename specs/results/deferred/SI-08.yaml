# Deferred findings filed by SI-08 (Evaluation A) on epic self-improvement-substrate.
#
# Filed to the PARTITIONED backlog, not the cumulative
# specs/results/deferred_findings_final.yaml (79 rows, read-only to this ticket).
#
# NOTE ON THE BUDGET. The assignment declares `deferment.budget: 5` and this file
# carries 11 rows. That is deliberate and is flagged rather than trimmed: for an
# `role: evaluation` ticket the findings ARE the deliverable, and a measurement
# ticket that drops five of its measurements to fit a deferral budget has
# falsified its own output. None of the ten was fixed here (rule: measurement
# only, no behavioural delta).
#
# Every row carries a `skill_change` field in the grammar
# improvement_ledger.py parses (`none` | `proposed(<unit>, <what>)` |
# `applied(<sha>)` | `declined(<reason>)`), because SI-08 measured that 94 of 121
# records in this repository carry none, and a measurement ticket that adds ten
# more fieldless rows makes its own number worse.

findings:
  - id: SI-08-DF-01
    found_by: SI-08
    found_at_commit: 2131cdad
    schedule_revision: 4
    severity: major
    surface: {production: [skills/spec-double-2/scripts/improvement_ledger.py], tla: [], adapters: [], test_graph: []}
    summary: >-
      THE GOAL'S OWN INSTRUMENT SILENTLY READS A QUARTER OF ITS POPULATION.
      `improvement_ledger.py` decides GOAL-findings-become-changes. Run with the
      ambient `python3` (Homebrew 3.14 on this machine), it cannot import PyYAML,
      skips BOTH deferred backlogs, and then prints a complete-looking disposition
      table over 36 records from 2 files. The declared metric is "findings by
      disposition across skill_feedback.md, BOTH DEFERRED BACKLOGS, and the matrix"
      -- 4 sources. Under `uv run --python 3.12 --with pyyaml` the same script reads
      121 records across 4 files. The warning line is honest ("this is not an empty
      backlog") but sits ABOVE an unmarked table, and 36 is the number a reader
      copies. Every figure this evaluation reports is the 4-file figure.
    reproduction: >-
      cd <repo> && python3 skills/spec-double-2/scripts/improvement_ledger.py
      -> "121 record(s)" is NOT printed; the header reads "36 record(s) across 2 file(s)".
      Then: uv run --python 3.12 --with pyyaml python skills/spec-double-2/scripts/improvement_ledger.py
      -> "improvement ledger -- 121 record(s) across 4 file(s)".
    evidence:
      - specs/results/epic-self-improvement-substrate/goals/GOAL-findings-become-changes/SI-08-EVALUATION-A.md
    why_out_of_scope: >-
      Fixing it means either vendoring a YAML reader or making the script re-exec
      under an interpreter that has one -- a behavioural change to a script this
      ticket is using as a measuring instrument. Rule 1 of the work order forbids
      the delta; the defect was worked around by naming the interpreter and is
      reported instead.
    suggested_fix: >-
      Make the partial read LOUD: if a declared source could not be parsed, print
      the table with an explicit "PARTIAL: n of m sources" banner in the header
      line itself, not only as a warning above it. Better, re-exec under
      `uv run --with pyyaml` when PyYAML is missing.
    skill_change: proposed(spec-double-2, mark a partial source read in the ledger's header line and/or re-exec under an interpreter with PyYAML)
    blast_radius: >-
      Any reader of this goal. The two numbers differ by 85 records and by a factor
      of four on the headline "no skill_change field at all" count (23 vs 94).

