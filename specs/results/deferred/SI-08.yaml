  - id: SI-08-DF-03
    found_by: SI-08
    found_at_commit: 2131cdad
    schedule_revision: 4
    severity: major
    surface: {production: [], tla: [], adapters: [], test_graph: []}
    summary: >-
      THE FRONT DOOR IS BROKEN BY THE VERY MIGRATION THIS EPIC PERFORMED, AND THE
      ROOT CAUSE IS ONE LINE. `skt ticket new` resolves the bootstrap script as
      `<home>/skills/git-issue-workflow/scripts/bootstrap-home.sh`
      (skt/src/skt/ticket.py:150, `_bootstrap_script()`), i.e. ONLY from a
      standalone skill install. It never looks inside `<home>/plugins/*/skills/`.
      The project home has the file -- at
      `.skill-manager/plugins/tla-spec-dev/skills/git-issue-workflow/scripts/bootstrap-home.sh`
      -- so the script is PRESENT and the resolver cannot see it. Result: "error:
      bootstrap-home.sh not found in this home; worktree rolled back", no worktree,
      no branch. This is the 9th occurrence in this epic (SI-06-DF-02,
      SI-11-DF-04, SI-15-DF-04 and others) and the FIRST to name the resolving
      line rather than the symptom. Note also that the rollback still exits 0
      through a pipe, which is how three earlier agents mis-read it.
    reproduction: >-
      cd /Users/hayde/IdeaProjects/tla-spec-dev &&
      SKT="${SKILL_MANAGER_HOME:-$HOME/.skill-manager}/bin/cli/skt";
      "$SKT" ticket new SI-08 --base 2131cdad --path ../wt-341-evaluation
      -> "error: bootstrap-home.sh not found in this home; worktree rolled back",
      and `test -d ../wt-341-evaluation` is false. Then:
      find <project home> -name bootstrap-home.sh
      -> .skill-manager/plugins/tla-spec-dev/skills/git-issue-workflow/scripts/bootstrap-home.sh
    evidence:
      - specs/results/epic-self-improvement-substrate/tickets/SI-08/VERDICTS.md
    why_out_of_scope: "The fix is upstream in the skt plugin, whose source is not in this worktree. `skills/**` here does not contain skt."
    suggested_fix: >-
      In `_bootstrap_script()`, after the standalone `<home>/skills/<UNIT>/` probe
      fails, glob `<home>/plugins/*/skills/<UNIT>/scripts/bootstrap-home.sh` before
      giving up -- the plugin layout is now the SUPPORTED layout, so the resolver
      that predates it is the bug, not the home. Independently: exit non-zero on
      rollback.
    skill_change: proposed(skt, resolve bootstrap-home.sh from plugins/*/skills/ as well as skills/, and exit non-zero on rollback)
    blast_radius: >-
      Every ticket agent in every epic that runs this repository's front door from a
      home where the substrate is installed as the plugin -- which is the layout
      GOAL-one-unit exists to produce. The goal and the front door are in direct
      conflict until this is fixed.

