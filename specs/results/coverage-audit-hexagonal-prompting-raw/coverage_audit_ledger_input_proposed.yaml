    - "F-10 [minor] ticket_plan.yaml:165 STILL cites effect_conformance.py:1141-1145 for 'in-process CPython only'. Round 1 filed this as F-6; the plan was amended at schedule_revision 3 and the citation was not fixed. Line 1141 is now an OutOfProcessObservation field declaration; the text is at :1441. tests/test_source_citations.py still does not cover ticket_plan.yaml."
