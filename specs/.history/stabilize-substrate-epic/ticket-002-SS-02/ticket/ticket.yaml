    "objective": "THE CONSUMPTION THIS PROGRAMME OWES, AND THE REASON THE EPIC EXISTS. R1 REQUIRES A DEMONSTRATED FAILING INPUT ON A REAL SUBJECT. IT DOES NOT REQUIRE A DEMONSTRATED ABSENT ONE. THAT SINGLE GAP IS WHY ALL 48 INSTANCES SHIPPED -- each satisfied R1 IN FULL and still answered PASS to the question it was built to refuse. YOUR SLICE IS THE RULE AND THE INSTRUMENT, NOT THE REPAIRS -- SS-05 does the repairs, and if you start fixing instances you will both blow your slice and shrink the class SS-08 has to measure. EXTEND R1: every instrument ships a demonstrated ABSENT-INPUT case, and THE CORRECT ANSWER TO AN ABSENT INPUT IS UNDECIDED OR A REFUSAL, NEVER PASS. THE WORKED SHAPE IS A SIGNATURE CHANGE: score_tools._finding_ids went set[str] -> set[str] | None, because THE OLD TYPE COULD NOT DISTINGUISH 'READ AND FOUND NOTHING' FROM 'READ NOTHING' AND ANSWERED THE SECOND WITH THE FIRST. That is the class in one line, and the third state was demonstrated too -- against a tree with no ledger live or archived, audit_rh3 emits ONE UNVERIFIED LINE instead of 14 fabrication claims, and UNVERIFIED does not increment the violation count. NOW LAND IT AS AN EXECUTED CHECK. A DOCTRINE LINE WITH NO INSTRUMENT IS A PREFERENCE, and the predecessor measured 1-of-41 consumption and then filed 57 findings while consuming almost none. THE CHECK RUNS OVER THIS PROJECT'S OWN INSTRUMENT REGISTER, and it is IN THE PERMITTED POPULATION under the adjudicated static-gates doctrine: static checks over this project's own record, metadata and method have 3 catches : 1 false refusal, and the doctrine MAY NOT refuse them. IT IS NOT A GATE ON AN ADOPTER'S CODE AND MUST NOT BECOME ONE. R1 APPLIES TO YOUR OWN CHECK: demonstrate it REFUSING A REAL INSTRUMENT IN THIS REPOSITORY -- failing before, passing after -- not a fixture. AND THE OBVIOUS SELF-REFERENTIAL TRAP, WHICH YOU MUST NOT FALL INTO: YOUR CHECK IS ITSELF AN INSTRUMENT THAT CAN BE HANDED AN ABSENT INPUT. An empty register, an absent register, a register that parses to nothing -- what does your check answer? If it answers PASS you have shipped the 49th instance INSIDE the fix for the class. DEMONSTRATE THE ANSWER. THE SUB-SHAPES ARE ENUMERATED FOR YOU in CA-10-absent-input/RESULT.md section 3.2 and the next sweep is cheaper because of it: absent-path-returns-empty; vacuous all()/not any(); one-sided threshold trivially satisfied by zero; .get() collapsing both sides of a comparison; unparseable becoming indistinguishable from absent; default-named lookup missing silently; empty selection reported as a satisfied population.",
