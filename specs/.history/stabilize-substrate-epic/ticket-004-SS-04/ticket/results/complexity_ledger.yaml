# Complexity ledger input -- MF-019 standing objective.
#
# `close ticket` refuses until this is filled in. That refusal is the mechanism:
# the standing objective is a required close-out step, not a stance.
#
# The delta is computed for you from `analyze complexity` and the TLC report.
# What you supply is the part a tool cannot know: whether behavior was retained,
# what the refinement search found, and why any increase is essential.

# Validated-refactor basis -- CD-09 (owner-approved 2026-07-22). This is what
# LICENSES a complexity DECREASE: TLC green on the model before AND after the
# change, behavior tests green, and the before/after descriptor comparison
# recorded. Absent, unknown, or degraded evidence REJECTS a decrease: an
# unmeasured constraint cannot witness retention. (The fourth obligation, the
# inspected transition-level diff, is `transition_diff:` below and is demanded
# whenever the MF-020 red flag fires.)
#
#   tlc_before:            green | fail        -- TLC on the pre-change model
#   tlc_after:             green | fail        -- TLC on the post-change model
#   behavior_tests:        pass | fail         -- the repository behavior tests
#   descriptor_comparison: recorded            -- before/after descriptor doc
validated_refactor:
  tlc_before:
    status: "TODO"
    evidence: "TODO -- path to the pre-change TLC output"
  tlc_after:
    status: "TODO"
    evidence: "TODO -- path to the post-change TLC output"
  behavior_tests:
    status: "TODO"
    evidence: "TODO -- path to the behavior-test output"
  descriptor_comparison:
    status: "TODO"
    evidence: "TODO -- path to the before/after descriptor comparison"

# Fuzzing-era retention members -- RECORDED at every close, non-gating since
# CD-09. Demoted to EXPERIMENTAL by the 2026-07-21 pivot (MF-038: kill 0.31 vs
# floor 0.8, 0/9 content bugs caught). `not_run` is the honest value; fill in a
# measured verdict only when one of them actually ran.
#
#   kill_rate:           pass | below_floor | incomplete_catalog | not_run   (MF-016)
#   effect_conformance:  clean | gaps | dead_surface | unobservable | not_run (MF-013/MF-027)
#   external_coverage:   pass | gaps | incomplete | not_run                  (MF-015)
#
# NOTE: `unobservable` IS NOT `clean`. MF-027 made the effect oracle refuse
# targets it cannot see; the record keeps that distinction even though the
# member no longer gates.
retention:
  kill_rate:
    status: "not_run"
    evidence: ""
  effect_conformance:
    status: "not_run"
    evidence: ""
  external_coverage:
    status: "not_run"
    evidence: ""

# Coverage audit -- MF-026. The completeness REVIEW, distinct from the three
# retention members above, which are all FIDELITY measures bounded to what is
# already modeled. Unmodeled surface is invisible to every one of them, and this
# is the only sweep that looks at it.
#
#   status: pass | fail | incomplete | not_run
#
# RECORDED, NEVER REFUSING (2026-08-04, owner direction). It was a hard gate at
# workflow close with no override; it is now an optional agent-run review whose
# verdict is written down and read by a person. `incomplete` IS STILL NOT
# `pass`, because a sweep that did not walk the surface says nothing about it --
# what was withdrawn is the refusal, not the distinction.
#
# Procedure: prompts/coverage_audit.md   Doctrine: references/coverage_audit.md
coverage_audit:
  status: "not_run"
  report: ""          # path to the filled templates/coverage_audit_report.md
  in_scope_gaps: null # count; in-scope gaps are HARD -- model it or change the program
  scope_source: ""    # plan file:lines the declared scope was READ from, never chosen

# Required if complexity INCREASED. Name the new essential behavior the added
# representation carries. This documents real behavior; it does not waive the
# increase, which is recorded and reported either way.
justification: ""

# The recursive refinement loop -- REQUIRED at every close.
# Either an approved recommendation with evidence, or "searched, found none".
# Recommendations are advisory and user-approved, never auto-applied.
refinement:
  searched: true
  outcome: "none"
  detail: >-
    SEARCHED, FOUND NONE. Model delta is ZERO: this ticket changes a measurement
    instrument (`examples/validation/scorecards/score_tools.py`) and adds one
    repository test file. It adds no state, no action and no invariant, and
    ticket-local `current` and `desired` are byte-identical (`diff -rq` empty).
    `model_delta_expectation` in the plan says `none expected` and none occurred,
    so there is no representation to refine. The refinement search was run over
    the ticket's declared surface anyway and returned nothing: `direction=zero
    (vs SS-07)`, variables 8, actions 16, bound 277,830 -- unchanged.
    NOTE THE MEASURED BOUND IS INCOMPLETE, 6 of 8 variables resolved, so
    `within_cap` is UNKNOWN rather than green. That is recorded here rather than
    read as a pass.
  measured: false      # no TLC run exists at this tree; `run` accepts only spec-unit-tests and effect-conformance
  applied: false
  approved_by: ""

# Required only if a generated-states drop at constant distinct states is
# detected. That is a RED FLAG (deleted self-loop, MF-020), not a win -- record
# the inspected transition-level diff here to accept it.
transition_diff: ""

# REQUIRED. The narrative ledger: reasoning, measured alternatives, findings the
# machine-checked core above cannot express. Path to a document, or prose.
narrative: "specs/results/scorecards/stabilize-substrate/SS-04/RESULT.md -- the full write-up. In brief: SS-04 adds FORM P to `scope`, a recogniser for `<n> of <m>` counted figures in ORDINARY PROSE, because `CA-08-DF-01` measured the instrument at ZERO counted figures on the charters, the ticket plan, four goal baselines and a price table, all of which were being swept the whole time -- the bound was the SENTENCE FORM, not the corpus. COMPLEXITY: the model delta is ZERO and the added representation is entirely inside an eval-harness file that `representation_scope` places OUT of model, so nothing here widens the program surface. WHAT LICENSES THE ADDED CODE: `scope` is on the do-not-cut list and the plan says EXTEND IT, DO NOT REPLACE IT, so the addition is additive by construction -- FORM P cannot return REFUTED and cannot return HOLDS, its verdict set is asserted over all 2,887 of its rows rather than promised, and `scope --form bound` reproduces the base output byte-for-byte at 103 / 81 / 0 / 2 / 20. MEASURED ALTERNATIVES CONSIDERED AND REJECTED: (1) a paragraph-wide matching window, rejected because it is exactly what lets a figure bind to a scope three sentences away, which is the defect R3 exists to refuse; (2) letting FORM P re-derive numerators and return REFUTED, rejected because a prose figure binds no value to a dimension, so a REFUTED would be invented -- and A FALSE REFUTED IS WORSE THAN AN UNREACHABLE; (3) widening the recogniser until the five figures the issue names all parse, REFUSED AS MF-020 and pinned by a test that fails if a later hand does it. FINDINGS THE MACHINE-CHECKED CORE CANNOT EXPRESS: five, `SS-04-DF-01` through `SS-04-DF-05`, ledger 334 -> 339. Two of them are defects in this ticket own deliverable found by hand-auditing its output (42 of 88 COUNT-MOVED rows were counting ledger rows, not cards; a greedy noun capture ate the next figure numerator), one is a latent crash that predates the ticket by five card versions (`KeyError: D5` killed the whole command, taking every other figure answer with it), and one is that every documented `python3 score_tools.py` invocation dies with a traceback under a python3 below 3.11 -- which made this ticket own document sweep report ten zeroes before it was caught, and A ZERO FROM A CRASHED INTERPRETER IS INDISTINGUISHABLE FROM A ZERO FROM A BLIND RECOGNISER. TWO OF EIGHT SEALED PREDICTIONS FAILED, both about how much counted prose this record carries, both in the direction that says the blindness was worse than estimated. Recall against a separate deliberately over-broad scanner is 3,305 of 5,790 = 57.1%, with every miss in a category declared BEFORE measuring."
