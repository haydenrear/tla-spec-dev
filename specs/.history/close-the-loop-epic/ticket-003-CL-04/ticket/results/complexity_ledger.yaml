# Complexity ledger input -- MF-019 standing objective.
#
# `close ticket` refuses until this is filled in. That refusal is the mechanism:
# the standing objective is a required close-out step, not a stance.
#
# The delta is computed for you from `analyze complexity` and the TLC report.
# What you supply is the part a tool cannot know: whether behavior was retained,
# what the refinement search found, and why any increase is essential.

# Validated-refactor basis -- CD-09 (owner-approved 2026-07-22). This is what
# LICENSES a complexity DECREASE: TLC green on the model before AND after the
# change, behavior tests green, and the before/after descriptor comparison
# recorded. Absent, unknown, or degraded evidence REJECTS a decrease: an
# unmeasured constraint cannot witness retention. (The fourth obligation, the
# inspected transition-level diff, is `transition_diff:` below and is demanded
# whenever the MF-020 red flag fires.)
#
#   tlc_before:            green | fail        -- TLC on the pre-change model
#   tlc_after:             green | fail        -- TLC on the post-change model
#   behavior_tests:        pass | fail         -- the repository behavior tests
#   descriptor_comparison: recorded            -- before/after descriptor doc
validated_refactor:
  tlc_before:
    status: "TODO"
    evidence: "TODO -- path to the pre-change TLC output"
  tlc_after:
    status: "TODO"
    evidence: "TODO -- path to the post-change TLC output"
  behavior_tests:
    status: "TODO"
    evidence: "TODO -- path to the behavior-test output"
  descriptor_comparison:
    status: "TODO"
    evidence: "TODO -- path to the before/after descriptor comparison"

# Fuzzing-era retention members -- RECORDED at every close, non-gating since
# CD-09. Demoted to EXPERIMENTAL by the 2026-07-21 pivot (MF-038: kill 0.31 vs
# floor 0.8, 0/9 content bugs caught). `not_run` is the honest value; fill in a
# measured verdict only when one of them actually ran.
#
#   kill_rate:           pass | below_floor | incomplete_catalog | not_run   (MF-016)
#   effect_conformance:  clean | gaps | dead_surface | unobservable | not_run (MF-013/MF-027)
#   external_coverage:   pass | gaps | incomplete | not_run                  (MF-015)
#
# NOTE: `unobservable` IS NOT `clean`. MF-027 made the effect oracle refuse
# targets it cannot see; the record keeps that distinction even though the
# member no longer gates.
retention:
  kill_rate:
    status: "not_run"
    evidence: ""
  effect_conformance:
    status: "not_run"
    evidence: ""
  external_coverage:
    status: "not_run"
    evidence: ""

# Coverage audit -- MF-026. The completeness REVIEW, distinct from the three
# retention members above, which are all FIDELITY measures bounded to what is
# already modeled. Unmodeled surface is invisible to every one of them, and this
# is the only sweep that looks at it.
#
#   status: pass | fail | incomplete | not_run
#
# RECORDED, NEVER REFUSING (2026-08-04, owner direction). It was a hard gate at
# workflow close with no override; it is now an optional agent-run review whose
# verdict is written down and read by a person. `incomplete` IS STILL NOT
# `pass`, because a sweep that did not walk the surface says nothing about it --
# what was withdrawn is the refusal, not the distinction.
#
# Procedure: prompts/coverage_audit.md   Doctrine: references/coverage_audit.md
coverage_audit:
  status: "not_run"
  report: ""          # path to the filled templates/coverage_audit_report.md
  in_scope_gaps: null # count; in-scope gaps are HARD -- model it or change the program
  scope_source: ""    # plan file:lines the declared scope was READ from, never chosen

# Required if complexity INCREASED. Name the new essential behavior the added
# representation carries. This documents real behavior; it does not waive the
# increase, which is recorded and reported either way.
justification: ""

# The recursive refinement loop -- REQUIRED at every close.
# Either an approved recommendation with evidence, or "searched, found none".
# Recommendations are advisory and user-approved, never auto-applied.
refinement:
  searched: true
  outcome: "none"
  detail: >-
    Searched, found none, and the reason is structural rather than a shrug.
    CL-04 is `role: evaluation` with `model_delta_expectation: none expected`.
    It changed no TLA+ model, no adapter, no generated code and no shipped
    instrument; `specs/tickets/CL-04/current` and `.../desired` are
    byte-identical, and the close-out itself measured `delta: direction=zero
    (vs CL-03)`. Its entire product is three sealed measurement documents, six
    ledger findings and a NEXT-EPIC section.

    A refinement recommendation here would have to be a recommendation about a
    model this ticket did not touch, derived during a round whose declared job
    is to MEASURE that model's surroundings and fix nothing. Proposing one would
    be the `measurement_rule` violation the epic files findings about: a round
    that changes the thing in the commit that reports on it. Two of CL-04's own
    findings -- `CL-04-DF-01` and `CL-04-DF-06` -- name concrete repairs to
    shipped instruments and were deliberately NOT applied for exactly this
    reason, with the repair written into `suggested_fix` so the next round
    inherits it.

    The bound is stated: no TLC run was performed by this ticket, so `measured`
    is false and nothing here is offered as a measured refinement claim. The
    reported bound of 1,111,320 is over the 1,000,000 cap and is INHERITED from
    CL-03 unchanged -- it is a lower bound over 7 of 9 resolved variables, it
    moved zero this ticket, and CL-04 is not the round that may move it.
  measured: false      # true only if a real TLC run produced the figure
  applied: false       # if true, approved_by is required
  approved_by: ""

# Required only if a generated-states drop at constant distinct states is
# detected. That is a RED FLAG (deleted self-loop, MF-020), not a win -- record
# the inspected transition-level diff here to accept it.
transition_diff: ""

# REQUIRED. The narrative ledger: reasoning, measured alternatives, findings the
# machine-checked core above cannot express. Path to a document, or prose.
narrative: >-
  FULL RECORD: `specs/results/scorecards/close-the-loop/CL-04/RESULT.md`.
  PREDICTIONS, sealed 2026-08-11T21:00:12Z in commit `ab73164` BEFORE any
  measurement and before either blind agent was dispatched:
  `specs/results/scorecards/close-the-loop/CL-04/PREDICTIONS-CL-04.md`.

  WHAT THIS TICKET DECIDED. All three epic goals. `GOAL-change-rule-runnable`:
  MET, and "a stranger can run it" is now DEMONSTRATED rather than plausible --
  a stranger's NEXT bump (5 -> 6, one file, zero Python) produced `2 failed,
  1496 passed`, byte-identical to the unmodified tip, and a blind adopter agent
  bumped the card in its own foreign tree with no configuration at all. But the
  change rule fails loudly only UPWARDS: `scaffold --card-version 4` at the tip
  stamps a card `version 4`, serves it version 5's bytes, and `check` reports 0
  problems. `GOAL-price-means-something`: MET on every clause, and the
  instrument still has exactly one price to its name. `GOAL-loop-closes-once`:
  MET, reproduced from the sealed cards with no judge re-run -- and the closure
  has NO NEGATIVE CONTROL, which is the next epic's first ticket.

  THE HEADLINE. The epic's own premise is false. It said the loop "cannot be run
  by anyone who did not build it"; a blind agent given only the shipped files,
  forbidden our source, our `specs/`, our tests and our git history, ran it end
  to end and our D3 caveat fired correctly on an artifact we had never seen.

  THE SERVED SURFACE: 6,319 -> 6,281 bytes, rungs 9 -> 9. It fell. Not a
  `git archive` figure; measured in clean detached checkouts named in the
  RESULT. Suite: 2 failed at both ends, the two inherited deliberate reds,
  neither repaired. +27 collected across the epic, ALL numerator, decomposed per
  file; `test_spec_yaml_valid.py` did not move because both trees are clean
  checkouts rather than ticket workspaces.

  COST, WITH ITS BASIS NAMED as the standing rule requires: the harness's
  `subagent_tokens` field, composition undocumented -- 102,034 for the adopter
  probe (1 finding, 0.98/100k) and 84,214 for the census (0 findings, 0.00/100k),
  186,248 across both blind channels for 1 finding, 0.54/100k. NOT comparable to
  RD-03's 1.14, which used a different and named basis. The numerator was NOT
  budget-capped: six filed against a budget of five, the sixth escalated,
  nothing dropped. The three tickets that did the epic's work recorded no token
  count at all, the second consecutive epic to record none, filed as
  `CL-04-DF-02`.

  FINDINGS FILED, NONE FIXED: `CL-04-DF-01` through `CL-04-DF-06`. Two of them
  name repairs to shipped instruments that were deliberately not applied.

  THE ALARM DID NOT FIRE -- three of eleven predictions were falsified -- and
  the RESULT says why that is not self-congratulation: six of the eleven only
  predicted that the predecessors' reports would reproduce, and two of the three
  predictions carrying a real mechanism were the ones that broke.
