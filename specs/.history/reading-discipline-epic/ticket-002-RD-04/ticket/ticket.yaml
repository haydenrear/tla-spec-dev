    "objective": "A RESEARCH TICKET -- it produces a design and evidence, NOT an implementation, and ships no production code. The card is not comparable across architectures and nothing records which architecture a score describes: D2 = 2 on greenfield against 3/4 on a real before/after, and D3 contested 2/2/3/4 with both judges saying no new evidence could settle it because the disagreement was about WHAT THE ARTIFACT IS -- one refusing a D3 = 4 its own execution supported because the port lives in a fixture. The mechanism is visible in the toolchain: ports-and-adapters is validated through port-bound adapters, flat effectful through an oracle that is in-process CPython only and drives 8 of 18 actions. SAME D1 ANCHOR, DIFFERENT INSTRUMENT REACH. Decide: a closed vocabulary starting from effectful and ports-and-adapters and their interaction; derived versus declared; what R-H1 becomes and what INCOMPARABLE looks like; how a tag value EARNS ITS PLACE; and how an architecture CHANGE is itself scored, since moving between tags is a before/after and that is the subject shape D2 was just proven able to measure. STATE THE SUPPRESSION-KEY ATTACK AND SHOW WHY THE DESIGN SURVIVES IT. Name what you could not settle -- those become RD-05's open questions rather than assumptions baked into code.",
