    "model_delta_expectation": "none expected -- these are harness and binding changes, not missing model surface",
    "objective": "The second half, and the one that closes the epic's thesis. Bind spec-unit and Test Graph adapters TO PORTS rather than to whole actions, so a generated case drives a real port. Then make the FAKE/REAL SWAP the instrument: run the identical case list against the real adapter and against its fake, and a fault in either one dies. This is aimed at one measured hole. A fault in the previous epic's treatment arm lived in its in-memory adapter and SURVIVED EVERY INSTRUMENT -- five corpus instruments, the effect oracle, and the hand-written suite. The port created a region no shared oracle reaches, so hexagonal architecture made the code more modular and simultaneously created somewhere for a bug to hide. Note what the scorecard already asks: D3 anchor 4 wants a driven port exercised by a real adapter AND a fake with the same cases passing against both. One arm reached it. What nobody has shown is that the pair CATCHES anything, and that is this ticket. Two inherited defects are yours if they block you, and both were found by RUNNING rather than inspecting: the oracle drives 8 of 18 actions because nine adapters have no run() at all, and its counterfactual showed that an adapter differing ONLY in having one takes a mutant from surviving to dying 8 of 8. The oracle's reach was never the limit; the adapters' shape was.",
