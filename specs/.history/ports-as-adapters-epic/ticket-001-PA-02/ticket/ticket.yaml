    "model_delta_expectation": "none expected -- a reporting tool, not program behaviour the model represents",
    "objective": "THE GOAL THIS REPLACES DID NOT FAIL BECAUSE THE PROMPT FAILED TO SIMPLIFY. It failed because nothing in the toolchain could tell. The shipped descriptor reads TLA+; every arm produces Python. Both arms scored D2 = 2 from all four judges for that reason. Build the missing measurement: complexity of PRODUCED CODE. Modules, public surface, pieces of mutable state, branch count, depth -- the same kind of figures the TLA+ descriptor reports, over the thing the agent actually wrote. A THERMOMETER, NOT A THERMOSTAT, and this is the whole design constraint. It reports. It refuses nothing. Nothing is gated on it. Its output lands in the scorecard's MECHANICAL BLOCK, which is recorded and never scored, precisely so that a disagreement between measurement and judgement is visible as a finding rather than resolved by arithmetic. Two rules the instrument must not violate, both bought by measurement: - MF-020: A NUMBER FALLING IS NOT EVIDENCE THE DESIGN IMPROVED. A metric can improve because an edge was deleted. The best complexity result in the record was withheld from a top score by both judges for exactly this. The instrument reports figures; it must not report a verdict. - CD-01: it proposes no cut, no refactor, no move. A tool that picks the boundary makes every edge legal by construction. NO TARGET ON THE NUMBER. The goal is that the instrument exists and can tell two implementations of one spec apart. Setting a threshold before anything can produce a figure would be inventing the answer.",
