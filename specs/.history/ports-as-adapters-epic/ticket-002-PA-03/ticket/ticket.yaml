    "model_delta_expectation": "Possibly one generation-mode variant. Per surface_cost_rule, state what it buys and what the state space costs BEFORE adding it -- the predecessor measured ~1.5 new coverage gaps and ~8x state space per surface-adding ticket.",
    "objective": "The first half of making the two senses of \"adapter\" one object. The prompt already makes an agent declare ports in the DOMAIN'S vocabulary. Have it declare them in the MANIFEST too, in the same shape the toolchain already uses for effect ports -- so a port the agent invented becomes a port the toolchain knows about. Then generate cases PER PORT, not only per action. Today every generated case drives a whole action, which is why a hexagonal codebase and a non-hexagonal one produce identical verdicts on 49 of 49 comparable cells: the port boundary is invisible to generation. NOTE, added by the epic owner 2026-08-05: 49 of 49 is the SEALED HP-06 number and it was SUPERSEDED before this epic opened. EVAL-RERUN at b3a0199 replicated and widened it to 56 OF 56 strictly comparable cells on a fresh artifact pair and a wider catalogue. Aim at 56 of 56. See GOAL-cases-drive-ports.baseline for why the bar moved up. Inherit rather than rebuild. The negative-corpus mode already emits the disabled edges at each reachable state and took guard relaxation from 0 of 3 to 3 of 3; per-port generation should compose with it, not replace it. And the tractability work stands: a corpus nobody can run is not a mechanism, and this model needed a projection to produce one at all.",
