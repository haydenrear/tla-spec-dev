narrative: >-
  specs/results/scorecards/ports-as-adapters/RESULTS.md is the ledger, with
  PREDICTIONS-SCORED.md, UNBLINDING.md, DETERMINISM.md, channels/ADVERSARIAL.md
  and six sealed cards beside it. In short:

  ARM C SETTLES THE PREDECESSOR'S CONFOUND, FOR THE PROMPT. A control prompt
  longer than the hexagonal one and asking for nothing architectural scored
  D3 = 1 from both blind judges against arm B's 4 and arm A's 2, and its author,
  asked what it REJECTED, named the exact seam arm B built and declined it on
  merit. Length does not produce structure here.

  AND THAT IS THE ONLY GOOD NEWS. GOAL-port-reach is a SPLIT -- clause 1 met on
  PA-M12, clause 2 not met with twelve red control/instrument pairs.
  GOAL-cases-drive-ports is MISSED: 64 of 64 strictly comparable cells identical
  on every pairing of three arms, 88 of 88 over all rows for A vs C, and the one
  diverging cell in the whole three-arm port-binding table is a fault the
  hexagonal arm LOST. GOAL-complexity-measurable is MET and is not a claim that
  anything got simpler -- the produced-code figures support no simplification
  claim for any arm, and the smallest artifact on every size figure is the
  control that got no architectural guidance at all.

  THE FRESH ADVERSARIAL CHANNEL CORRECTED THIS TICKET'S OWN NUMBERS TWICE and
  found the round's most important result -- THE NULL WAS ENTAILED. An
  exhaustive 28,561-sequence observational fingerprint measures the three arms'
  MUTATED trees identical on 10 of 11 rows, so "the arms do not diverge" is a
  consequence of the re-anchoring succeeding and this experiment can only
  diverge where it FAILS. It also measured the repaired positive control
  unobservable in one step on three of four trees, and the probe that certifies
  it unable to fail -- a no-op mutant reports HOLDS. P07's own sealed row named
  that in advance as this epic's worst possible own goal.

  FINDINGS BY CHANNEL 1 : 12 : 4 : 2. Eighteen of nineteen came from asking an
  agent what it REJECTED or telling it to attack. The suite produced its first
  finding in four rounds and it fired at this ticket's own helper. Five of
  fifteen predictions FAILED, three of them negatives; one is SUPERSEDED.

  ELEVEN FINDINGS FILED, NOTHING FIXED. The deferment budget of 5 is
  deliberately exceeded and every row is `escalated` rather than carried,
  because PA-06 is the last ticket and there is no sibling to carry to. The
  alternative was to not report findings during the ticket whose entire purpose
  is to report them.

  ACCEPTANCE. `uv run --with pytest --with pyyaml python -m pytest tests -q` ->
  1 failed, 1177 passed; the single failure is PA-06-DF-05 and it is left red on
  purpose. `score_tools.py check` -> 6 cards, 0 problems. `index` -> exit 0.
  `audit` -> 0 violations, after PA-06's own change turned three PA-04 claims
  SUPERSEDED-UNMARKED and six of its own cards OPEN, resolved by superseding the
  claims forward and recording a note beside each card. A reading rule that
  fires on its own author's cards is a reading rule doing its job.
