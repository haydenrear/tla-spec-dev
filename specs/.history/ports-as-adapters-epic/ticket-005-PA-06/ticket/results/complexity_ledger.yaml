refinement:
  searched: true
  outcome: "none"
  detail: >-
    Searched and found none, and the reason is structural rather than a shrug: a
    measurement ticket adds no representation, so there is nothing to refine.
    The one thing that could have become a modeled obligation was the port
    binding's `[ports.*]` table, and PA-04 already established it is a binding
    table rather than TLA+ state -- no variable, no action, no Next disjunct, no
    CONSTANT.

    WHAT WAS SEARCHED FOR AND DELIBERATELY NOT DONE, because the epic's standing
    rule makes it the forbidden act.

    (1) PA-03-DF-03 / PA-04-DF-01 -- seed a blatant fault inside the declared
    port's region so a port-scoped instrument can have a green positive control.
    DECLINED for the third time, by the ticket both findings assign it to. PA-01
    schedule_revision 2 permits repairing an instrument BEFORE a measurement and
    forbids it after an unflattering signal; PA-06 IS the measurement, so no
    legitimate ordering exists. Carried forward with its protocol spelled out --
    seal the prediction, seed the control, run it, in that order, in a ticket
    that is not deciding a goal.

    (2) The one-sided control probe (PA-06-DF-07, blocking) and the vacuous
    sanitiser verification (PA-06-DF-11). Both are instruments this round
    measured with; repairing either during the round they serve would mean the
    verdict and the shipped tool describe different things.

    (3) tests/test_code_complexity.py::test_nothing_executable_reads_this_instrument,
    which is RED at this tip against PA-06's own evidence-packet builder
    (PA-06-DF-05). Left red: repairing a check during the measurement it watches
    is forbidden, and evading it by renaming a string would be the
    six-lines-of-YAML defeat this epic exists to prevent, performed by the
    ticket that exists to catch it.
  measured: false
  applied: false
  approved_by: ""

