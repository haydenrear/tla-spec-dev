    "objective": "The epic's product, and the ticket every other ticket was written against. A MEASUREMENT, not a victory lap. A low or unflattering result is the preferred outcome. Run the three arms on the integrated tip: A ordinary, B hexagonal, C length-matched control. Seed PA-01's catalogue, including its adapter-internal faults, in all three. Generate cases, run them through each arm's adapters and through the real/fake pair, and count what dies. ARM C IS THE POINT OF THIS ROUND'S DESIGN. The previous epic's headline was D3 = 1 to 4 on the hexagonal arm, and its own report said the win could not be attributed to \"hexagonal\" rather than to a 6.6x longer prompt. If arm C matches arm B, say so plainly: the finding becomes that longer prompts produce better structure, and the architectural content was decoration. Judge all three arms per references/eval_scorecard.md: TWO JUDGES, BLIND TO ARM AND TO EACH OTHER, artifacts not claims, file:line for every score >= 2, a named refusal for every 4, prose quality never an input. A spread > 1 is contested and needs a third pass citing NEW evidence. Validate every card with score_tools.py check. Score the sealed predictions PASS / FAIL / SUPERSEDED. Do not amend them. Decide each goal: baseline -> measured -> target, verdict met / missed / unmeasured with a reason. NEVER edit a target to match a result. NEVER re-run selectively until a number passes. Report the run that happened. Report FINDINGS BY CHANNEL -- suite re-run, fresh adversarial attack, blind author -- with counts and the ratio stated as a result. For three rounds running the best material came from asking an agent what it REJECTED, and the suite produced ZERO findings from 1,329 green assertions last round. A suite-only round means the suite has stopped being informative. Report the complexity instrument's figures in the MECHANICAL BLOCK, never scored, and say explicitly whether they agree or disagree with D2. A disagreement between measurement and judgement is a finding. Append rows and verdicts to specs/results/scorecards/SELF-IMPROVEMENT.md, and report against the \"evidence we are fooling ourselves\" list already written there. FILE FINDINGS, FIX NOTHING.",
