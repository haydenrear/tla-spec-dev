    "model_delta_expectation": "none -- eval harness under examples/validation/, out of model by representation_scope",
    "objective": "A BLOCKER ON PA-06, deliberately: the evaluation must use this, not hand-author around it. Two halves. (1) SCAFFOLD THE CARD. For two epics every scorecard was hand-authored from the rubric by whichever agent was judging. That is how a dimension key or the `refuses_to_claim` requirement drifts, and it puts the burden of remembering five sets of anchors on the judge. Add `score_tools.py scaffold`, emitting one skeleton per arm per judge with the anchors and the scoring rules INLINE, so a judge reads the bar for a score in the same file where the score is written. MAKE BLINDING THE DEFAULT rather than something each eval remembers. Emit arms under opaque labels and write the mapping to an unblinding file the judge is not given. An eval that wants unblinded scoring should have to undo that deliberately. Both prior rounds blinded correctly by discipline; discipline is not a mechanism. Refuse to overwrite an existing card. A scaffold that clobbers a measurement is worse than no scaffold. (2) TEACH THE SCORER TO READ HISTORY, which is the half that matters more. `specs/results/scorecards/SELF-IMPROVEMENT.md` carries every epic's rows, and the metric is the DELTA. But this project has just proved that a row can go stale without anyone noticing: the predecessor's instrument was repaired AFTER its measurement, and two of its sealed numbers stopped describing the instrument that produced them. A scorer comparing naively across that boundary would have compared two different instruments and called the difference progress. So add a way to SEE a scorecard's history beside the changes that affect it -- `score_tools.py history --example E` or equivalent -- showing rows over time WITH the instrument changes between them marked, and write the reading rules into `references/eval_scorecard.md`: - A row is comparable to another row ONLY on the same example AND across an unchanged instrument. Name the instrument change or do not compare. - Never average across examples: a deliberately incoherent fixture is SUPPOSED to score low on D3. - A number that moved because the instrument was repaired is not improvement. Say which happened. - A sealed card is never edited. When one goes stale, the ledger records WHICH number and WHY, beside it. Worked examples exist and should be used: the guard-relaxation row moving 0 -> 3 of 3 is a real mechanism gain; the D1 3 appearing on BOTH arms is an attribution correction, not a gain; and \"controls green on both arms\" is a sealed number known-wrong for one arm.",
