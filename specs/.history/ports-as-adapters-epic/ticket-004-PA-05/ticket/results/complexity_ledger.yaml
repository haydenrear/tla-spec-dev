refinement:
  searched: true
  outcome: "none"
  detail: >-
    Searched and found none, and the reason is the same one that keeps this
    ticket out of the model: a scorecard scaffold and a history reader are
    evidence-side tooling with no modeled CLI transition behind them. Modelling
    score_tools.py as program surface would make every eval change a model
    change, which representation_scope deliberately excludes. The one thing that
    could have become a modeled obligation was rejected on the epic's standing
    rule: PA-05 adds NO gate, and its refusals are on EVIDENCE (do not clobber a
    measurement, do not re-seal an edited card), never on the product.
  measured: false
  applied: false
  approved_by: ""

transition_diff: ""

narrative: >-
  TWO HALVES, and the second matters more.

  (1) `score_tools.py scaffold` emits one skeleton per arm per judge with the
  anchors and the seven scoring rules INLINE -- READ OUT OF
  references/eval_scorecard.md rather than transcribed, so there is one source
  of truth and a judge reads the bar for a score in the same file where the
  score is written. The skeleton records the rubric's digest and `check` refuses
  to let a judge fill in a card scaffolded against a rubric that has since
  changed. Blinding is the DEFAULT: labels are drawn from a pool that excludes
  every label any prior round published, and the mapping goes to UNBLINDING.md
  outside every card directory; --unblinded requires --reason and writes it into
  the key. Scaffolding twice REFUSES and writes NOTHING -- not one file,
  including the ones that would not have collided.

  (2) `history --example E` prints one example's rows with the instrument
  changes marked BETWEEN them, and `audit` EXECUTES the four reading rules the
  ticket asked to be written down. That is deliberate: a declaration nothing
  executes will drift, which is the exact class of artifact this epic keeps
  finding stale, so `audit` fails if references/eval_scorecard.md declares an
  R-H rule with no check behind it.

  WHAT THE HISTORY VIEW FOUND, beyond the three worked examples it was given.
  Two live stale rows, both filed and neither fixed. PA-05-DF-01: the epic
  document's own baseline table has the D5 attribution INVERTED -- the best-ever
  4 went to the TREATMENT under the rerun, not the control -- in the document
  every ticket agent in this epic is told to read first. PA-05-DF-02: every
  EVAL-RERUN number this epic uses as a live baseline was measured before TWO
  later instrument changes and none has been re-affirmed, including
  GOAL-cases-drive-ports' 56-of-56, where EVAL-SUPPRESS flipped exactly one cell
  and flipped it on ONE ARM ONLY.

  Evidence: specs/results/scorecards/HISTORY-ab_quota_ledger.md,
  specs/results/scorecards/INSTRUMENT-LOG.toml, and tests/test_score_tools.py
  (34 cases, all 34 failing on the parent tree 1cad5ea, verified by archiving it
  and running this file against it).
