# PROBE INPUT -- NOT THIS REPOSITORY'S MAP. DO NOT USE.
#
# AC-04 evidence. This is specs/program_model/architecture_map.yaml with exactly
# one edit: `scripts/budgets.py` moved from `surface` to `kill`. Under it this
# repository reports 8 divergence sites / 6 distinct divergent dependencies
# where the real map reports 0 -- with not one line of source changed.
#
# It exists to demonstrate the refusal: a delta measured across this map and the
# real one reports `unattributable` and names the re-placement, instead of a
# six-edge improvement. See results/gaming-probe.txt and results/refactor-loop.md.
# A DECLARED production-module -> model-component map for this repository's own
# `scripts/` tree (AC-02, `analyze architecture ... --code scripts --map <this>`).
#
# The component names are the ones declared in
# `specs/program_model/architecture_components.yaml`, and the placements below
# follow the same grounding that file uses: each script goes to the component
# whose STATE the command it implements commits. This repository's
# `spec_manifest.yaml` declares no `architecture:` block, so running the check
# WITHOUT `--components` reports `unmappable` for a model reason -- the model
# has one component and no boundary for the code to respect. That is the
# recorded acceptance result, not a defect.
#
# Every `.py` file under `scripts/` is placed. That is not politeness: a module
# the map leaves out makes the whole tree `unmappable`, precisely so a map
# cannot cover the tidy half of a tree and report it clean.
#
# A different reader would place several of these differently, and that freedom
# is the honest limitation of the reflexion model: the map is where the lying
# would happen. See references/architecture_coherence.md, "What The Map Cannot
# Stop", and specs/tickets/AC-02/results/dogfood-findings.txt.
architecture_map:
  language: python
  components:
    # setup_phase, spec_root, lastCommand, result -- the CLI entry point, the
    # scaffolding and onboarding commands, and the manifest/budget plumbing
    # they run on.
    - component: surface
      modules:
        - scripts/tla_spec_dev.py
        - scripts/extract_spec_manifest.py
        - scripts/generate_docs.py
        - scripts/generate_python.py
        - scripts/infer_action_params.py
        - scripts/onboard_program_model.py
        - scripts/scaffold_spec.py
        - scripts/scaffold_spec_workflow.py
        - scripts/skill_feedback.py
        - scripts/spec_paths.py

    # ticket_state -- OpenTicket, CloseTicket, UpdateTicketCurrent,
    # UpdateTicketDesired, RunSpecUnitTests.
    - component: tickets
      modules:
        - scripts/close-spec-workflow.py
        - scripts/close-ticket.py
        - scripts/close_spec_workflow.py
        - scripts/close_ticket.py
        - scripts/close_tickets.py
        - scripts/new_ticket_workflow.py
        - scripts/spec_evolution.py
        - scripts/start_ticket.py

    # complexity_gate, corpus_gate, effect_conformance -- the scanners and the
    # case-corpus machinery whose verdicts they record.
    - component: corpus
      modules:
        - scripts/analyze_architecture.py
        - scripts/analyze_complexity.py
        - scripts/architecture_reflexion.py
        - scripts/case_modules.py
        - scripts/complexity_ledger.py
        - scripts/corpus_diagnostics.py
        - scripts/effect_conformance.py
        - scripts/effect_conformance_report.py
        - scripts/export_testgraph_cases.py
        - scripts/fitness_functions.py
        - scripts/generate_cases_from_tlc_dump.py
        - scripts/run_generated_case_adapters.py
        - scripts/testgraph_channels.py

    # kill_test -- RunKillTest, and nothing else in the model.
    - component: kill
      modules:
        - scripts/budgets.py
        - scripts/kill_test.py
        - scripts/run_kill_test.py
