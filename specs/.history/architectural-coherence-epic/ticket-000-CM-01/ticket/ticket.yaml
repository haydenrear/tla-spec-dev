    "objective": "Mechanize the case-module option and fix the defect the probe found underneath it. Three parts, in this order. (1) CM-F1 -- record_complexity_ledger locates its model as the alphabetically first *.tla excluding MC*, which on any Core/Internal/External baseline resolves to Core.tla paired with External.cfg and measures bound=None, modularity=0.0; the standing-objective ledger has been measuring a module with no variables and no actions. The measured model becomes DECLARED, and a mismatched .tla/.cfg pair is an error rather than a silent measurement. This is a live defect on every three-module project, independent of case modules. (2) A `case_modules:` block in spec_manifest.yaml -- per module, the view it extends, its action subset, and (for a Given form) the recorded claim the Given asserts. (3) Per-module action scope so generation stops emitting the R4-DF-04 zero-case alias-wrapper warning for actions that simply are not in this aspect (CM-F2), plus an aggregation report of per-action coverage across modules against the view's action set -- a report, never a gate.\n",
