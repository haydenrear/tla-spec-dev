# Complexity did not increase in the model. Recorded anyway, because the
# standing objective's question is about the PROGRAM, not only the model.
justification: >
  ZERO model delta, so no TLA+ representation was added and none needs
  justifying. The advisory caps that were already over at AC-01's close
  (max_state_space_bound 2,799,360 / 1,000,000; max_distinct_states 1,292,951 /
  500,000) are unchanged and were NOT renegotiated by this ticket -- AC-01
  recorded the 4.6x as accepted against the owner's independent pre-ticket
  measurement, and AC-02 neither adds to it nor argues it down.

  Production complexity DID increase: scripts/architecture_reflexion.py is a new
  module. The essential behavior it carries is the code side of a command the
  model already represents. `analyze architecture` already recorded a value in
  `architecture_scan`; before this ticket only `unmappable` was reachable,
  because the command measured the model and nothing else. The reflexion check
  makes `coherent` and `divergent` reachable by actually observing a code tree.
  That is not new modeled behavior -- it is the existing action finally able to
  produce its other outcomes -- which is why the TLA+ delta is zero, and why
  inventing an action for it would have been the semantic_model_rule violation
  the plan names.

refinement:
  searched: true
  outcome: "none"
  detail: >
    Three reductions were considered against the landed design and all three
    were rejected on fidelity grounds -- each would have made a report LOOK
    cleaner while measuring less.

    (1) Treat an intra-component code edge as a convergence, collapsing the
    report to two categories instead of four. Rejected: with a one-component map
    every edge is then a convergence and the tool reports a perfect score for a
    codebase it never constrained. Internal edges are counted and explicitly NOT
    checked against a port.

    (2) Downgrade the extraction blind spots (dynamic imports, unparsed files,
    non-Python files, unmapped modules) from `unmappable` to a warning attached
    to a `coherent` verdict -- the smaller state space and the friendlier
    report. Rejected; this is MF-027 verbatim: a clean report on a target you
    could not see is indistinguishable from a clean report on one you could. The
    dogfood shows the cost of the decision honestly -- this repository's own
    scripts/ tree has zero divergences under a falsifiable partition and STILL
    reports unmappable, for three computed-name imports, one shell script, and
    one sibling package.

    (3) Drop the `unfalsifiable_coherence` check, on the argument that a fully
    ported architecture with no divergences is simply coherent. Rejected after
    measuring it: under the three-component partition this ticket first wrote,
    this repository's model ports every pair, so no code edge could have
    diverged and `coherent` would have been true by construction. That is the
    same false clean as (2), arriving through the model instead of the
    extractor.

    No reduction to the TLA+ model was found beyond AC-01's, and for AC-01's
    reason: the model's own architecture descriptor reports one component at
    Q = 0.000, so there is no cut available to take. AC-02 measured that from a
    second direction -- see the dogfood finding.
  measured: true
  applied: false
  approved_by: ""

# Not required: no generated-states drop (the figures are identical to AC-01's).
transition_diff: ""

narrative: >
  AC-02 implements the reflexion model (Murphy, Notkin & Sullivan) on top of
  AC-01's descriptor: a DECLARED map from production modules to model
  components, an extracted Python dependency graph, and a diff reported as
  convergences, divergences (with file:line at the SITE of the dependency), and
  absences. Internal edges are counted as a fourth category and deliberately not
  checked -- they crossed no boundary. Shipped as
  scripts/architecture_reflexion.py, wired into `analyze architecture --code
  <tree> --map <map.yaml>`, with its own JSON schema
  (tla-spec-dev/architecture-reflexion v1) and a standalone CLI. Half a check is
  a usage error: --code without --map would make the TOOL pick the boundary, and
  --map without --code reports every port absent.

  THE DELIVERABLE IS THE DOGFOOD, and it took three runs to state honestly. Full
  write-up in results/dogfood-findings.txt; the short form:

  1. The acceptance command as the plan wrote it -- no declared partition --
  reports `unmappable` and does not run the diff at all. The model has one
  component (Q = 0.000; lastCommand and result are written by all fifteen
  commands). Had the diff run, all 258 code edges would have been internal to
  that single component: 0 divergences, 0 absences, `coherent`. The report
  prints "NOT RUN" instead of three zeroes, because zero findings from a
  comparison that never happened is the false clean in its purest form. This is
  the branch AC-01 published partition.consumable_as_architecture for, used
  exactly as intended.

  2. With a DECLARED four-component partition (surface / tickets / corpus /
  kill, cut by the state each command commits) the check runs and is
  FALSIFIABLE: corpus<->kill and kill<->tickets have no port, because no action
  of the model touches kill_test together with ticket_state or with a corpus
  verdict. 34 modules all mapped, 4 components all realized, 258 edges, 140
  internal, 118 convergences, 0 divergences, 0 absences. The two kill-test
  scripts reach only budgets.py, which is in surface and ported. That is a
  genuine falsifiable negative result about this codebase. The verdict is still
  `unmappable`, now for five extraction blind spots: three computed-name
  importlib.import_module calls, scripts/run_tlc.sh (no extractor), and
  spec_double_compiler/ (first-party, beside the code root, outside --code).

  3. The COARSER three-component partition this ticket wrote first -- folding
  kill_test in with the other scanner verdicts, an entirely natural reading --
  ports every pair, so no code edge could diverge and `coherent` would have been
  true by construction. `unfalsifiable_coherence` fires and refuses it.

  Runs 2 and 3 are both defensible readings of the same model, separated by one
  variable's placement. That is the ticket's central caution and it is stated in
  the reference rather than buried: the map and the partition are where the
  lying would happen, the tool measures the declaration it is handed, and it
  cannot audit that declaration. What it CAN do it does -- the map must place
  every module in the tree (leaving one out is `unmapped_module`, never
  cleaner), every declared component must be realized, no module may be in two
  components, and every placement is published. `unfalsifiable_coherence`
  catches only the fully degenerate case; a merely COARSE partition still
  reports a real-looking clean, and that limitation is documented.

  MF-027 is enforced structurally, not by convention. The verdict property reads
  nothing but the report: no environment variable, no flag, no manifest key.
  Suppression-shaped keys in the map (assume_coherent, allow_unmapped, waived,
  justification, accepted_divergences, ignore, exclude, skip, trusted, override,
  ...) are SCANNED, reported under ignored_suppression_keys, and never honored --
  the shape scripts/effect_conformance.py uses, because a silently ignored key
  is nearly as bad as an honored one.
  TestNothingDowngradesAnUnobservableVerdict holds it shut from four directions:
  sixteen map keys, four environment variables, four plausible CLI flags
  (argparse rejects them), and a source-level assertion that the verdict
  property mentions no configuration at all. Evidence:
  results/suppression-ignored.txt, the same tree run twice with identical
  findings.

  A positive case exists, which matters because without one "always unmappable"
  would have passed every refusal test in the suite. The fixture is a
  three-component pipeline model whose ports permit ingest<->transform and
  transform<->deliver but not ingest<->deliver, with matching code:
  results/fixture-coherent.txt reports `coherent` with the unported pair named,
  so the clean result is falsifiable. results/fixture-divergent.txt adds one
  import and reports both the import and the call site with file:line;
  results/fixture-absence.txt removes an edge and reports the dead port.

  Advisory throughout. Exit 0 on `divergent` AND on `unmappable`; nonzero (2)
  only for an unusable map or an unreadable code tree -- "I could not measure
  this". No close, promotion, or case-generation path reads architecture_scan.
  CD-01 holds: the report names edges, ports, and files, and never says where a
  module should live; a test asserts the rendered text carries no
  move-suggesting phrasing.

  Coverage limits are stated in the report itself rather than left to be
  discovered: Python only; static resolution only; in-tree edges only, so a
  component that reaches a database or a socket directly is invisible (that axis
  belongs to scripts/effect_conformance.py). One limit was FOUND by the dogfood
  and fixed: imports resolving to a first-party package beside the code root
  were being filed as third-party, which meant narrowing --code would delete
  real edges from the graph with nothing recorded. They are now a named blind
  spot.
