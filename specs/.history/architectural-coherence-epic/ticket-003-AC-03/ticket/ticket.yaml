    "objective": "The generation-time half of the epic, and the owner's stated hypothesis: incoherent code is partly a function of how the work is ASKED for. Ship two prompts in the shape prompts/coverage_audit.md already established. (1) implementation_brief.md turns an architecture descriptor into a constrained ask: this action belongs to component C, which owns variables V; it may reach D only through port P; effects live at the boundary (functional core / imperative shell); one externally visible commitment per action. The refactor target shapes in references/architecture_tractability.md, Move 3, are the vocabulary -- this ticket makes them an instruction instead of advice. (2) aspect_decomposition.md is the BDD ask from the user's perspective: enumerate the aspects of the public surface, name each one's Given, and map each to a case module and its action scope. Reconcile both with SKILL.md's Program Spec Rule so a case module is never mistaken for a feature module.\n",
