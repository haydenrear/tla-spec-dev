    "model_delta_expectation": "SUBSTANTIAL and deliberate: two new actions, at least one new variable or a widened domain, and new effect ports on existing actions. Record the state-space cost in the ledger the way AC-01's 4.6x was recorded. This is the first ticket in the epic whose whole purpose is model delta.",
    "objective": "The MF-026 coverage audit returned `fail` with nine in-scope gaps, each anchored on a file `representation_scope` names IN MODEL, each closable only by modeling it or changing the program. There is no third disposition. This ticket closes all nine and the epic cannot promote until it does. The audit's own framing, which is the reason this ticket exists at all: every oracle in this toolchain is bounded to what is already modeled, so unmodeled surface is invisible to all four and all four report green. Two eval rounds could not have caught any of this. G-6 (the headline). CASE-MODULE GENERATION IS ENTIRELY UNREPRESENTED and it is this epic's flagship feature. `scripts/case_modules.py` ships a standalone main() unreachable from the parser, writing a coverage record and a JSON report; `generate_cases_from_tlc_dump.py` spawns java/TLC, rmtree's a metadir, and writes generated packages. No action, no port, no CLI subcommand -- and CM-01 AND RP-03 BOTH CLOSED \"ZERO MODEL DELTA\" against surface the model does not contain. Add a `GenerateCases` action carrying corpus_process (spawn), spec_tree (write) and spec_tree_delete (the metadir rmtree), reachable from the shipped parser. Fold in the parameter-recovery audit write (infer_action_params.py:825-826) with evidence_report; it is a generation-time artifact. G-1. `AnalyzeArchitecture` -- the epic's only new action -- has no row in `effects.actions` in any of the three manifests, and it is the only non-stutter action without one. The manifest's own rule says an ABSENT row claims \"unmapped\" while an EMPTY row claims \"performs no distinct effect\", and TlaSpecDevCli.tla states that each action's @port lines mirror its row. There is no row to mirror. G-2 / G-3. `analyze architecture --out` and `architecture_reflexion --out` perform unconstrained undeclared filesystem writes: the path is a bare string, so a write can land anywhere, while the nearest candidate port targets only **/results/**. Declare the port and constrain the path, or drop --out and let callers redirect stdout (the descriptor already goes to stdout). G-4. TlaSpecDevCli.tla:649 reads \"No @port: the scan reads the model and the source tree and prints.\" It does not only print -- G-2 and G-3 are its writes. This is the honest-in-prose / misleading-in-artifact class RP-02 was opened for, except the MODEL now carries the misleading record. G-5. All three manifests state \"9 variables and 15 actions\" for a model with 10 and 16. AC-01 added `architecture_scan` and `AnalyzeArchitecture` and did not update the comment. Same class as EV-01-DF-03, which RP-05 was opened to repair. Add the counts to whatever check RP-05 used for architecture_components.yaml so the next variable cannot leave it stale. G-7. Two manifest comments cite \"the 2026-07-22 scope amendment\" as their authority; no such amendment exists in this plan, and the restored ruling is dated 2026-08-01. One of them says case generation is \"EXPERIMENTAL surface, deliberately unmodeled\" -- which becomes AFFIRMATIVELY FALSE the moment G-6 lands. Both comments are edited by hand; classification cannot fix a stale pointer. G-8. AC-04's `architecture_delta` ledger member and its four attribution verdicts (code_only, unattributable, unverified, improved-with-RED-FLAG) are externally observable results of `analyze architecture --baseline` with no modeled state. The refusals AC-04 shipped are exactly the ones a reader would want the model to guarantee. Record the state-count cost the way AC-01's 4.6x was recorded. G-9. THE DEAD PORT, verified independently by the owner. `cli_artifact` is the ONLY port declared for BuildSkillCli and InstallLocalCli and it targets **/.venv/**, while `grep -rn '\\.venv' scripts/*.py skill-scripts/*.sh` returns ZERO hits. It is dead model surface by the manifest's own rule, and `port-cli_artifact` is seeded in kill_mutants.toml and listed in kill_tests -- SO THE KILL TEST HAS BEEN SEEDING A FAULT FOR A PORT NOTHING EXERCISES. What the install path actually does: mkdir into $SKILL_MANAGER_BIN_DIR / $SKILL_MANAGER_CACHE_DIR, cat > \"$WRAPPER\", spawn \"$WRAPPER\" --help, mkdir \"$JAR_DIR\", curl -fL \"$JAR_URL\", mv the jar into place. Declare what it does, INCLUDING the network port ESC-6 named -- the standing proviso is that an out-of-model FILE does not make an out-of-model EFFECT. PLUS the owner decision that is not a numbered gap: MODEL THE SIX GUARD-WEAKENING FLAGS (--accept-new, --allow-open, --no-promote-current, --validate-only, --force, --dry-run) as a weakened-close transition, so a close taken under one is a DIFFERENT STATE from one taken under the guard. CloseTicket guards on TicketSpecUnitTestsPassed and TLC proves ClosedTicketsPassedSpecUnitTests over 1,292,951 states, while --accept-new and --allow-open exist specifically to bypass that precondition and no oracle could see the difference. Six of 78; the granularity limitation covering the other 72 is untouched.",
