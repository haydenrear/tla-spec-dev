# Complexity ledger input -- MF-019 standing objective.
#
# `close ticket` refuses until this is filled in. That refusal is the mechanism:
# the standing objective is a required close-out step, not a stance.
#
# The delta is computed for you from `analyze complexity` and the TLC report.
# What you supply is the part a tool cannot know: whether behavior was retained,
# what the refinement search found, and why any increase is essential.

# Validated-refactor basis -- CD-09 (owner-approved 2026-07-22). This is what
# LICENSES a complexity DECREASE: TLC green on the model before AND after the
# change, behavior tests green, and the before/after descriptor comparison
# recorded. Absent, unknown, or degraded evidence REJECTS a decrease: an
# unmeasured constraint cannot witness retention. (The fourth obligation, the
# inspected transition-level diff, is `transition_diff:` below and is demanded
# whenever the MF-020 red flag fires.)
#
#   tlc_before:            green | fail        -- TLC on the pre-change model
#   tlc_after:             green | fail        -- TLC on the post-change model
#   behavior_tests:        pass | fail         -- the repository behavior tests
#   descriptor_comparison: recorded            -- before/after descriptor doc
validated_refactor:
  tlc_before:
    status: "green"
    evidence: "specs/tickets/RP-05/results/tlc-current.txt (32,122,220 generated / 1,292,951 distinct / depth 26 / 60s -- no TLA+ model file touched by this ticket, so 'before' and 'after' are the same model)"
  tlc_after:
    status: "green"
    evidence: "specs/tickets/RP-05/results/tlc-current.txt (same run; RP-05's implementation_scope is tests/test_new_ticket_workflow.py, references/generation_modes.md, specs/program_model/architecture_components.yaml -- no .tla/.cfg delta)"
  behavior_tests:
    status: "pass"
    evidence: "specs/tickets/RP-05/results/pytest-full.txt (865 passed, 0 failed -- the epic's first fully green run; test_skill_requires_two_minute_case_generation_budget now passes)"
  descriptor_comparison:
    status: "recorded"
    evidence: "the ledger's own delta header at this close: variables=10 actions=16 bound=2,799,360, direction=zero (vs EV-02) -- ZERO model delta, no .tla/.cfg file in RP-05's implementation_scope"

# Fuzzing-era retention members -- RECORDED at every close, non-gating since
# CD-09. Demoted to EXPERIMENTAL by the 2026-07-21 pivot (MF-038: kill 0.31 vs
# floor 0.8, 0/9 content bugs caught). `not_run` is the honest value; fill in a
# measured verdict only when one of them actually ran.
#
#   kill_rate:           pass | below_floor | incomplete_catalog | not_run   (MF-016)
#   effect_conformance:  clean | gaps | dead_surface | unobservable | not_run (MF-013/MF-027)
#   external_coverage:   pass | gaps | incomplete | not_run                  (MF-015)
#
# NOTE: `unobservable` IS NOT `clean`. MF-027 made the effect oracle refuse
# targets it cannot see; the record keeps that distinction even though the
# member no longer gates.
retention:
  kill_rate:
    status: "not_run"
    evidence: ""
  effect_conformance:
    status: "not_run"
    evidence: ""
  external_coverage:
    status: "not_run"
    evidence: ""

# Coverage audit -- MF-026. The completeness gate, distinct from the three
# retention members above, which are all FIDELITY measures bounded to what is
# already modeled. Unmodeled surface is invisible to every one of them.
#
#   status: pass | fail | incomplete | not_run
#
# `not_run` is the CORRECT value at a ticket close: the audit is an end-of-epic
# step, run after the mechanism tickets land and before final integration. It is
# recorded and reported either way so that an epic which skipped it is visible.
# At WORKFLOW close anything but `pass` REFUSES -- and `incomplete` IS NOT
# `pass`, because a sweep that did not walk the surface says nothing about it.
#
# Procedure: prompts/coverage_audit.md   Doctrine: references/coverage_audit.md
coverage_audit:
  status: "not_run"
  report: ""          # path to the filled templates/coverage_audit_report.md
  in_scope_gaps: null # count; in-scope gaps are HARD -- model it or change the program
  scope_source: ""    # plan file:lines the declared scope was READ from, never chosen

# Architecture delta -- AC-04. The STRUCTURE half of the ledger: the complexity
# delta above says whether the representation got smaller; this says whether the
# code moved toward or away from the boundaries the model draws. A refactor that
# lowers complexity while scattering the code further is not the refactor anyone
# wanted, and reading either number alone cannot tell.
#
# Produce the report with:
#
#   tla-spec-dev analyze architecture <spec.tla> <cfg> --components <components.yaml> #       --code <tree> --map <map.yaml> --baseline <a previous --format json scan> #       --format json --out <this path>
#
# RECORDED AT EVERY CLOSE AND GATING NOTHING. A rise in structural divergence is
# written down, printed, and closed through. What is NOT optional is honesty
# about it: `status` is not yours to write -- the ledger opens the report and
# derives the direction (improved | worsened | unchanged | unverified |
# unattributable). `claim:` is optional and exists only so a wrong one can be
# caught; a claim that disagrees with the measured direction REFUSES the close.
#
# Two refusals worth knowing before you run it:
#   * a divergence DROP whose disappeared edges are not enumerated is
#     `unverified`, never `improved` (MF-020, applied to structure);
#   * a comparison across two different maps -- or two different models -- is
#     `unattributable`. Any divergence disappears if the map moves the offending
#     module into the component it reaches, so a delta across a changed map
#     measures the map. Both digests are recorded in the entry.
architecture_delta:
  report: ""   # path to the --baseline delta JSON; empty is an honest `not_run`
  claim: ""    # optional: improved | worsened | unchanged | unverified | unattributable

# Required if complexity INCREASED. Name the new essential behavior the added
# representation carries. This documents real behavior; it does not waive the
# increase, which is recorded and reported either way.
justification: ""

# The recursive refinement loop -- REQUIRED at every close.
# Either an approved recommendation with evidence, or "searched, found none".
# Recommendations are advisory and user-approved, never auto-applied.
refinement:
  searched: true
  outcome: "none"
  detail: >
    RP-05 is a doc/test-only ticket (a stale test assertion and a stale YAML
    comment); it carries zero TLA+ model delta and the complexity ledger's own
    header confirms direction=zero versus EV-02. There is no representation to
    refine here: no variable, action, or domain was added or removed, so no
    reduction search over the model applies. The refinement search that
    matters for this ticket is over the FIX, not the model: for the test,
    "revert the doc to restore stale prose" was considered and rejected
    (rehardcodes a literal that will drift the next time the page is
    reworded) in favor of retargeting the assertion at the durable fact
    (the `budgets.tlc_seconds` config key and its 120-second default are
    documented); for the YAML comment, "state the current verdict word" was
    considered and rejected per this ticket's own instruction (RP-01 is
    concurrently changing verdict reporting) in favor of recording the
    measured numbers (263 edges, 0 divergences, 0 absences) with a re-run
    command so the comment does not go stale the same way again.
  measured: true
  applied: false
  approved_by: ""

# Required only if a generated-states drop at constant distinct states is
# detected. That is a RED FLAG (deleted self-loop, MF-020), not a win -- record
# the inspected transition-level diff here to accept it.
transition_diff: ""

# REQUIRED. The narrative ledger: reasoning, measured alternatives, findings the
# machine-checked core above cannot express. Path to a document, or prose.
narrative: >
  RP-05 closes the two stale-record defects filed against this epic's own
  dogfooding: CM-01-DF-01/AC-DF-01 (the one red test every prior ticket in
  this epic was told to ignore) and EV-01-DF-03 (a comment contradicting the
  measurement beside it).

  1. test_skill_requires_two_minute_case_generation_budget asserted the
  literal phrase "hard two-minute budget" in references/generation_modes.md.
  The c72d03a docs refresh reworded that sentence to "hard wall-time budget:
  `budgets.tlc_seconds` in `spec_manifest.yaml`, default 120 seconds" --
  naming the actual config key instead of a fixed literal. Restoring the old
  phrase would have reverted a genuine accuracy improvement (the new wording
  points at the real, checked-in default: spec_manifest.yaml `tlc_seconds:
  120`) purely to satisfy a test. Chosen instead: retarget the assertion at
  the durable fact -- that the budget's config key (`budgets.tlc_seconds`)
  and its value (120 seconds) are documented -- rather than an exact
  sentence. A test asserting doc prose verbatim is a maintenance tax with no
  compensating signal (it does not catch the budget being undocumented, only
  a paraphrase); asserting the key name and value is checked whenever it
  changes and survives copy-editing.

  2. specs/program_model/architecture_components.yaml's comment claimed the
  AC-02 reflexion dogfood "found edges across both" of the two unported
  component pairs (`tickets<->kill`, `corpus<->kill`). The actual measured
  result, both at AC-02's original 2026-07-27 run (references/
  architecture_coherence.md) and re-measured here 2026-07-30, is DIVERGENCES
  (0) -- the opposite claim. The edge count also drifted: 258 at AC-02's
  writing vs 263 now (143 internal, 120 crossing, all 120 convergences).
  Re-ran `analyze architecture ... --components architecture_components.yaml
  --code scripts --map architecture_map.yaml`
  (specs/tickets/RP-05/results/architecture-reflexion.txt) to confirm both
  numbers directly rather than trust the filed finding. The comment now
  states the measured counts (263 edges, 0 divergences, 0 absences) with the
  run date and a pointer to re-run the check for the current figure, and
  deliberately does NOT restate the verdict word (`unmappable`/`coherent`/
  etc.) since RP-01 is concurrently changing how that command reports its
  verdict -- recording the verdict wording here would create the exact same
  staleness defect the moment RP-01 merges.

  Both fixes are documentation/test-only; RP-05 carries ZERO TLA+ model
  delta, confirmed by comparing specs/tickets/RP-05/current against
  specs/tickets/RP-05/desired after a clean __pycache__ (identical) and by
  the complexity ledger's own delta header (direction=zero vs EV-02).

  Full repository suite: `uv run --with pytest --with pyyaml -m pytest tests
  -q` -- 865 passed, 0 failed. This is the first fully green run of this
  epic; every prior ticket carried CM-01-DF-01/AC-DF-01 as a known,
  explicitly out-of-scope red test.
