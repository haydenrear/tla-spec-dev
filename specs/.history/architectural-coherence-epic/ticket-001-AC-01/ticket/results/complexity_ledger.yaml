narrative: >
  AC-01 turned the structure `analyze complexity` computes internally into an
  addressable artifact: `tla-spec-dev analyze architecture`, with a text
  descriptor and a versioned JSON form (schema
  tla-spec-dev/architecture-descriptor v1) that AC-02 and AC-03 consume.

  The load-bearing finding is negative and is recorded as such. Run against the
  two real models available, the emergent clustering does NOT yield a usable
  architecture in either case:

    * specs/current/TlaSpecDevCli.tla -- ONE component, Q = 0.000. `lastCommand`
      and `result` are written by all 15 commands, so the variable interaction
      graph is effectively complete and greedy modularity finds nothing to
      separate.
    * examples/distributed_history/.../External.tla -- two components, Q = 0.047,
      but 9 of 12 actions cross the boundary and EVERY variable is written by
      some action that also writes into the other component. The reference
      example has no single-writer state at all.

  The descriptor reports that instead of presenting the one-component partition
  as an architecture. That refusal is the design decision this ticket most
  wanted to get right: with one component every variable is trivially "written
  inside its component", so a naive implementation reports zero single-writer
  violations and no ports -- a flawless architecture report for a model that has
  none, indistinguishable from the real thing. The ownership fields are `null`
  with a stated reason instead, and `partition.consumable_as_architecture` is
  published as the single field AC-02 must branch on to report `unmappable`
  rather than a false `coherent`.

  Because both real targets refuse, the descriptor would be vacuous without a
  second, non-inventive source of components. That source is a DECLARED
  partition (`architecture:` in spec_manifest.yaml, or --components), symmetric
  with AC-02's declared module map and justified by the same rule: a tool that
  picks its own boundary can define every finding out of existence. The tool
  measures the partition the project names and never writes one; an unreadable
  declaration is refused rather than silently replaced by the emergent
  clustering. Exercised against this repository's own model in
  results/architecture-self-declared-demo.txt, where a four-component
  declaration makes all 10 variables single-writer violations -- the measured
  cause of the non-decomposition, now expressed as ownership.

  CD-01 is honored: no proposed cut, no refactor, no target shape, no next step.
  The one judgment the tool makes -- "this partition is not a cut" -- ships with
  the criteria table that produced it (component_count >= 2, Q > 0, crossing
  fraction <= 0.5), so a reader can disagree with the rule rather than with a
  verdict handed down without one. The crossing-fraction rule reuses the R/W
  matrix's existing >half dense-row/dense-column convention rather than a
  threshold invented here, and Newman's Q >= 0.3 convention is reported beside
  the score but never applied as a criterion.

  Doctrine held throughout: exit 0 on any analyzable model however incoherent,
  nonzero only for the MF-030 unresolved-hierarchy fail-closed or an unreadable
  declaration; and `analyze architecture` on its own always reports
  `unmappable`, because it measures the model side and an unobserved target is
  never clean.
