# Complexity INCREASED. The new essential behavior:
justification: >
  AC-01 adds one variable (`architecture_scan`) and one action
  (`AnalyzeArchitecture`) to represent a command the CLI now genuinely has. An
  unrepresented command is not modeled behavior, and the same reasoning has
  licensed every previous scanner variable in this model (MF-011
  complexity_gate, MF-014 corpus_gate, MF-013/MF-027 effect_conformance, MF-016
  kill_test).

  The domain is 4-valued: unknown | coherent | divergent | unmappable. It is NOT
  collapsed to shrink the state space. `unmappable` is distinct from `unknown`
  for exactly the reason MF-027 grew `unobservable` on the effect oracle: "the
  scan has not run" and "the scan ran and could not see the target" are
  different facts, and merging them deletes the one verdict this epic exists to
  report. `divergent` is distinct from `coherent` because it is the finding, and
  the two select distinct CLI next-steps.

  Measured cost, recorded rather than argued down:
    static bound        699,840 -> 2,799,360   (x4, the domain size)
    TLC distinct        283,805 -> 1,292,951   (x4.6)
    TLC generated     6,209,780 -> 32,122,220  (x5.2)
    depth                    25 -> 26
    wall clock              12s -> 58s
  The static bound now exceeds max_state_space_bound 1,000,000 and the distinct
  count exceeds max_distinct_states 500,000. Both are ADVISORY thresholds
  (MF-036) and both were left as they are: `max_distinct_states` was NOT raised
  to make the number look compliant, and the domain was NOT shrunk to fit under
  it. The owner measured these same figures independently before the ticket
  opened (specs/results/tlc-desired-epic-ac.txt) and recorded the 4.6x as
  accepted.

  No action in the model guards on `architecture_scan`, and no close, promotion,
  or case-generation path reads it. The variable is a record, not a gate.

refinement:
  searched: true
  outcome: "none"
  detail: >
    Two reductions were considered and both rejected on fidelity grounds.
    (1) Merge `unmappable` into `unknown` (domain 4 -> 3, bound 2,799,360 ->
    2,099,520): rejected -- it deletes the MF-027 distinction between "not run"
    and "ran blind", which is the verdict AC-02's refusal semantics depend on.
    (2) Drop `architecture_scan` and let AnalyzeArchitecture touch only
    lastCommand/result (bound back to 699,840): rejected -- the command's whole
    output is the verdict, so a model that cannot see the verdict cannot
    represent the command.
    Beyond this ticket's delta no reduction to the existing model was found: the
    model's own architecture descriptor (results/architecture-self.txt) reports
    one component at Q = 0.000, so there is no cut available to take. That
    non-decomposition is itself this ticket's headline finding.
  measured: true
  applied: false
  approved_by: ""

