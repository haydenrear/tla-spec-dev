refinement:
  searched: true
  outcome: "none"
  detail: >-
    Searched, found none applicable to this ticket's model delta, because there
    is no model delta: specs/tickets/EV-01/current == desired, byte for byte.
    The refinement search WAS run against the fixtures, which is where this
    ticket's representation decisions live, and it produced three recorded
    outcomes rather than a model change. (1) The decomposable fixture was
    almost built on the owner's two-component probe model; a two-component
    partition has exactly one component pair, that pair is ported, and
    `unfalsifiable_coherence` fires on every run over it -- a fixture that
    cannot produce a divergence cannot be the positive test for a divergence
    check. One variable and one action were added so that ingest <-> ledger is
    unported. Measured: Q = 0.133, all three criteria met, divergence
    detectable, and the twin's four divergences are therefore findable.
    (2) The corpus arm was almost built as one adapter mapping with the
    provider assertion behind a flag; that is a suppression key with better
    manners, so it was built as TWO declared mappings instead, and a reader of
    the mapping can now see which instrument produced a number. (3) A synthetic
    Jenga was almost dropped in favour of this repository's own model, which IS
    one; it was kept because the real one refuses at the model stage and so can
    never exercise the `unfalsifiable_coherence` refusal against a code side.
    Each of the three is written down in the fixture READMEs rather than left
    as an unexplained shape.
  measured: false
  applied: false
