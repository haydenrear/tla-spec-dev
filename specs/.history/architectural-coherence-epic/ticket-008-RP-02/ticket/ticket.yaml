    "model_delta_expectation": "ZERO. Document the no-op with evidence.",
    "objective": "MF-029 recovers 0 of 5 parameters on a set-membership model, so every generated case carries `params={'i': UNCHECKED}` (or `{}`) and the adapter is forced to re-derive the action argument by diffing before against after -- i.e. from the ORACLE. Two eval runs found this independently, one from inside and one from outside. It is why guard relaxation is unkillable in the measured catalog: the adapter only ever calls the action with the argument that was going to succeed. Meanwhile `param_recovery_audit.md` states \"every parameter of every action is recoverable from its state pair\" on a run reporting 0/38 cases carrying arguments -- the audit contradicts the corpus it audits, which is the honest-in-prose/misleading-in-artifact class this epic keeps finding. Fix the recovery for set-membership actions (the argument is the element that entered or left the set), and make the audit report what the run measured. If recovery genuinely cannot be done for a class, the audit must say UNRECOVERABLE for it -- never \"recoverable\" over a corpus that carries nothing.\n",
