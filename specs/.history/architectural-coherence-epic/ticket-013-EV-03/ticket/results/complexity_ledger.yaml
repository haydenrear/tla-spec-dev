# Complexity ledger input -- MF-019 standing objective.
#
# `close ticket` refuses until this is filled in. That refusal is the mechanism:
# the standing objective is a required close-out step, not a stance.
#
# The delta is computed for you from `analyze complexity` and the TLC report.
# What you supply is the part a tool cannot know: whether behavior was retained,
# what the refinement search found, and why any increase is essential.

# Validated-refactor basis -- CD-09 (owner-approved 2026-07-22). This is what
# LICENSES a complexity DECREASE: TLC green on the model before AND after the
# change, behavior tests green, and the before/after descriptor comparison
# recorded. Absent, unknown, or degraded evidence REJECTS a decrease: an
# unmeasured constraint cannot witness retention. (The fourth obligation, the
# inspected transition-level diff, is `transition_diff:` below and is demanded
# whenever the MF-020 red flag fires.)
#
#   tlc_before:            green | fail        -- TLC on the pre-change model
#   tlc_after:             green | fail        -- TLC on the post-change model
#   behavior_tests:        pass | fail         -- the repository behavior tests
#   descriptor_comparison: recorded            -- before/after descriptor doc
validated_refactor:
  tlc_before:
    status: "TODO"
    evidence: "TODO -- path to the pre-change TLC output"
  tlc_after:
    status: "TODO"
    evidence: "TODO -- path to the post-change TLC output"
  behavior_tests:
    status: "TODO"
    evidence: "TODO -- path to the behavior-test output"
  descriptor_comparison:
    status: "TODO"
    evidence: "TODO -- path to the before/after descriptor comparison"

# Fuzzing-era retention members -- RECORDED at every close, non-gating since
# CD-09. Demoted to EXPERIMENTAL by the 2026-07-21 pivot (MF-038: kill 0.31 vs
# floor 0.8, 0/9 content bugs caught). `not_run` is the honest value; fill in a
# measured verdict only when one of them actually ran.
#
#   kill_rate:           pass | below_floor | incomplete_catalog | not_run   (MF-016)
#   effect_conformance:  clean | gaps | dead_surface | unobservable | not_run (MF-013/MF-027)
#   external_coverage:   pass | gaps | incomplete | not_run                  (MF-015)
#
# NOTE: `unobservable` IS NOT `clean`. MF-027 made the effect oracle refuse
# targets it cannot see; the record keeps that distinction even though the
# member no longer gates.
retention:
  kill_rate:
    status: "not_run"
    evidence: ""
  effect_conformance:
    status: "not_run"
    evidence: ""
  external_coverage:
    status: "not_run"
    evidence: ""

# Coverage audit -- MF-026. The completeness gate, distinct from the three
# retention members above, which are all FIDELITY measures bounded to what is
# already modeled. Unmodeled surface is invisible to every one of them.
#
#   status: pass | fail | incomplete | not_run
#
# `not_run` is the CORRECT value at a ticket close: the audit is an end-of-epic
# step, run after the mechanism tickets land and before final integration. It is
# recorded and reported either way so that an epic which skipped it is visible.
# At WORKFLOW close anything but `pass` REFUSES -- and `incomplete` IS NOT
# `pass`, because a sweep that did not walk the surface says nothing about it.
#
# Procedure: prompts/coverage_audit.md   Doctrine: references/coverage_audit.md
coverage_audit:
  status: "not_run"
  report: ""          # path to the filled templates/coverage_audit_report.md
  in_scope_gaps: null # count; in-scope gaps are HARD -- model it or change the program
  scope_source: ""    # plan file:lines the declared scope was READ from, never chosen

# Architecture delta -- AC-04. The STRUCTURE half of the ledger: the complexity
# delta above says whether the representation got smaller; this says whether the
# code moved toward or away from the boundaries the model draws. A refactor that
# lowers complexity while scattering the code further is not the refactor anyone
# wanted, and reading either number alone cannot tell.
#
# Produce the report with:
#
#   tla-spec-dev analyze architecture <spec.tla> <cfg> --components <components.yaml> #       --code <tree> --map <map.yaml> --baseline <a previous --format json scan> #       --format json --out <this path>
#
# RECORDED AT EVERY CLOSE AND GATING NOTHING. A rise in structural divergence is
# written down, printed, and closed through. What is NOT optional is honesty
# about it: `status` is not yours to write -- the ledger opens the report and
# derives the direction (improved | worsened | unchanged | unverified |
# unattributable). `claim:` is optional and exists only so a wrong one can be
# caught; a claim that disagrees with the measured direction REFUSES the close.
#
# Two refusals worth knowing before you run it:
#   * a divergence DROP whose disappeared edges are not enumerated is
#     `unverified`, never `improved` (MF-020, applied to structure);
#   * a comparison across two different maps -- or two different models -- is
#     `unattributable`. Any divergence disappears if the map moves the offending
#     module into the component it reaches, so a delta across a changed map
#     measures the map. Both digests are recorded in the entry.
architecture_delta:
  report: ""   # path to the --baseline delta JSON; empty is an honest `not_run`
  claim: ""    # optional: improved | worsened | unchanged | unverified | unattributable

# Required if complexity INCREASED. Name the new essential behavior the added
# representation carries. This documents real behavior; it does not waive the
# increase, which is recorded and reported either way.
justification: ""

# The recursive refinement loop -- REQUIRED at every close.
# Either an approved recommendation with evidence, or "searched, found none".
# Recommendations are advisory and user-approved, never auto-applied.
refinement:
  searched: true
  outcome: "none"
  detail: >-
    Searched, found none, and the search is a no-op by construction: EV-03 is a
    MEASUREMENT ticket whose declared conflict keys are examples/validation/ and
    NEXT-EPIC.md. It added no model state, no action, no production code and no
    test; `git diff --stat HEAD -- specs/current specs/program_model` is empty
    and ticket current == ticket desired (results/zero-model-delta.txt). There is
    no representation this ticket introduced that could be refined away. The
    refinement opportunities this ticket DID find are in the tool it was
    measuring, not in the model, and every one of them was FILED rather than
    applied -- EV-03-DF-01..05 in specs/desired_program_model/deferred_findings.yaml
    -- because a fix during a measurement destroys the measurement. The largest,
    EV-03-DF-03, has a suggested fix that is entirely in the detection path and
    changes no verdict rule.
  measured: false      # true only if a real TLC run produced the figure
  applied: false       # if true, approved_by is required
  approved_by: ""

# Required only if a generated-states drop at constant distinct states is
# detected. That is a RED FLAG (deleted self-loop, MF-020), not a win -- record
# the inspected transition-level diff here to accept it.
transition_diff: ""

# REQUIRED. The narrative ledger: reasoning, measured alternatives, findings the
# machine-checked core above cannot express. Path to a document, or prose.
narrative: >-
  EV-03 re-ran the whole eval suite against the repaired tree (RP-01..RP-05,
  RP-07 merged) and re-scored it against the SAME committed predictions in
  examples/validation/PREDICTIONS.md, which was not edited. The headline artifact
  is examples/validation/runs/ROUND-2-DELTA.md; the per-arm records are
  runs/ex4-run4..6, runs/ex5-run3..4 and runs/ex6-run2.

  MEASURED, NOT ASSUMED -- what worked. RP-01: the 203-partition sweep of the
  divergent fixture reports 0 `coherent`, down from 12, with all 203 exiting 0.
  The number that had to be checked separately is that it removed no TRUE
  findings: zero of round 1's 71 divergence verdicts were lost, and 20
  previously-suppressed ones were released (71 -> 91). RP-01's basis_limits vs
  blind_spots distinction was verified independently -- 67 of round 1's 71
  divergence verdicts carry partition_does_not_decompose, so filing that as a
  blind spot would have suppressed 67 real findings to remove the same 12 false
  cleans. DP-2 re-scored MISSED -> CAUGHT, DP-2b CONFIRMED -> CLOSED on the
  measured path. RP-03: case modules generate from the documented location (round
  1: exit 150), their corpora carry 50/50 and 6/6 recovered arguments (round 1:
  0/50 and 0/6), and a Given's corpus EXECUTES against the project's unchanged
  adapters -- a capability that did not exist in round 1.

  THE HONEST NEGATIVE. RP-02 took parameter recovery from 0 of 5 to 5 of 5,
  removed the oracle leak completely, and made the audit render from the corpus
  it audits. THE MUTANT MATRIX DID NOT MOVE A SINGLE CELL: ARM A 4/6, ARM B 6/6,
  guard relaxation 0/3, ordering 0/3, identical to round 1 on both catalogues and
  on the pytest column, and re-confirmed a third time by a blind agent on a fresh
  16-mutant catalogue (0 of 4 guard-accepts on five corpus instruments). Round
  1's own conclusion that parameter recovery was part of the reason guard
  relaxation is unkillable is FALSIFIED, and NEXT-EPIC.md retracts it in place.

  THE FINDING OF THE ROUND, which is about the tool this ticket was measuring.
  Blind run A -- an agent with no epic context, told only to make the
  architecture report clean -- reported, and the scorer reproduced independently
  from scratch, that every divergence is erasable with NO declaration edit, no
  map edit, no blind spot and no basis limit, by re-exporting the offending
  symbol through a first-party package nested one directory deeper than
  architecture_reflexion.py's single-path first-party check. Measured: `coherent`
  on the divergent twin for a 41-line diff, both digests byte-identical to the
  answer key, blind_spots [], basis_limits [], 8/8 behavioural tests green, and
  the runtime coupling fully intact. The same defect the other way round flips
  the COHERENT fixture to `unmappable` when its generated package moves up one
  directory with zero Python changed -- so this epic's only positive architecture
  result was conditional on directory depth. EV-03-DF-03, major, FILED NOT FIXED.
  It is a false clean of exactly the DP-1 class the epic's scoring rule exists to
  catch, and the rule cannot see it because no declared artifact moved.

  WHAT THIS TICKET DID NOT MEASURE, so a silence is not read as a result. RP-04's
  partial-bound honesty and RP-05's suite repair were exercised only through the
  954-passing repository suite; this ticket built no independent instrument for
  either. DP-7 was not re-exercised -- no --baseline architecture delta was taken
  in round 2, which is why architecture_delta below is an honest not_run. The
  sweep varies the PARTITION and not the MAP, so the map-gaming space is
  unenumerated. Everything is still one model, six variables, and two fixtures
  that share a layout the finding above turns out to depend on.

  COMPLEXITY. Zero model delta, verified three ways in
  results/zero-model-delta.txt. The ledger's `direction=zero` against RP-07 is
  correct and the bound is unchanged at 2,799,360 (INCOMPLETE, 8/10 variables
  resolved, over cap) -- the same figure RP-07 recorded, carried forward
  unmodified. The over-cap state is inherited, not introduced: this ticket
  touched no TLA+ module. The `bound` percent is a floor and the ledger says so,
  which is RP-04's repair working on this ticket's own close.
