version: 1
name: subtract-to-measure-epic
updated: null
purpose: >-
  WE HAVE NEVER GIVEN THE SCORECARD A SUBJECT IT COULD MEASURE. D2 = 2 on 27 of 27 cards ever written, and two explanations have never been separated: the card cannot measure complexity, or there has never been anything to measure. D2 anchor 3 requires a simplification with a recorded before and after, and EVERY subject this project has scored was greenfield -- written once from a prompt, with no before. No greenfield artifact can reach that anchor, ever.


  This epic produces the first real before/after: a substantial, evidence-driven REMOVAL from the toolchain itself, which carries five epics of accumulated complexity and mostly cannot be shown to work. The ports binding machinery has zero unique kills across 28 tables. The falsifiability registry's 26 of 35 is at most ~11 of >=43 once swept. The suite has produced zero findings in five of six rounds.


  So: cut what cannot be shown to work, seed a mutant in every gap FIRST so the cut is measured rather than assumed, and score the removal on the card. If D2 finally moves, the subjects were the problem. If it does not, the card is -- and it will have been tested rather than assumed.
planning_rules:
  no_new_gates_rule: >-
    Four epics of static checking caught zero bugs. Subtraction is not licence to add a refusal.
  thermometer_rule: >-
    Complexity reports, refuses nothing, gates nothing. CD-01: it may not choose the boundary -- including in this epic, where the subject is our own boundary.
  removal_is_a_delta_rule: >-
    NEW AND LOAD-BEARING. MF-020 says a number can fall because an edge was deleted. Applied to ourselves: REMOVING AN INSTRUMENT REMOVES THE ABILITY TO DETECT THAT THE REMOVAL WAS HARMFUL. Every removal ships with a mutant seeded in its gap BEFORE the removal. After it, the mutant either still dies (redundant, cut was free) or survives (load-bearing, now priced). Both are results. A removal with no mutant in its gap is not a measurement.
  denominator_rule: >-
    NEW. Deleting a hollow demonstration must not quietly improve the ratio. Report deletions separately from repairs, and report the count before and after. A ratio that rises because the denominator shrank is MF-020 wearing this epic's clothes.
  do_not_retire_untested_rule: >-
    NEW. D2, D4 and D5 STAY ON THE CARD. Retiring them before SM-05 runs destroys the only measurement that could separate 'the card cannot measure' from 'there was nothing to measure'. Likewise 'defund [ports.*]' is supported and 'defund the corpus' is NOT; the two cuts must not merge.
  measurement_rule: >-
    File findings; fix nothing during a measurement. Never edit a target to match a result. Never re-run selectively until a number passes. If every prediction passes, report it as an ALARM. Report per class with executable counts, never a single rate.
status:
  workflow: subtract-to-measure-epic
  active_ticket: null
