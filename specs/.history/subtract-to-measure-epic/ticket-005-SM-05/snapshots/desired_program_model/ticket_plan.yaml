        expected_effect: decides the goal
        local_signal: 'N/A: this ticket is the measurement'
      - goal: GOAL-removal-is-measured
        contribution: guard
        expected_effect: decides the goal
        local_signal: 'N/A: this ticket is the measurement'
      - goal: GOAL-cheaper
        contribution: guard
        expected_effect: decides the goal
        local_signal: 'N/A: this ticket is the measurement'
    acceptance:
      commands: [uv run --with pytest --with pyyaml python -m pytest tests -q]
      assertions: [D2 is scored on the removal and the round says WHICH explanation the evidence supports., Every removal reports its gap mutant's before and after verdict., D3 is re-scored and any movement is reported as a regression outranking the D2 result., Findings by channel with the per-token ratio stated as a result., Findings FILED and NONE fixed.]
    model_delta_expectation: none expected
    role: evaluation
    owns_goals: [GOAL-D2-can-move, GOAL-removal-is-measured, GOAL-cheaper]
