      tla: []
      adapters: []
      test_graph: []
      workflow: [examples/validation/]
    objective: >-
      FIRST AND ALONE. MF-020 applied to ourselves: removing an instrument removes the ability to detect that the removal was harmful. Seed a mutant in the gap each mechanism slated for removal claims to cover, and record what currently catches it. Capture the toolchain's before-state descriptor -- the input D2 anchor 3 has never had. Seal predictions with at least three negatives, committed before any other ticket dispatches, predicting specifically what will NOT get better when we cut.
    desired_actions: []
    implementation_scope: [examples/validation/, specs/results/]
    goals:
      - goal: GOAL-removal-is-measured
        contribution: direct
        expected_effect: >-
          Supplies every gap mutant the goal is measured with. A mechanism with no seedable gap is REPORTED, never skipped.
        local_signal: gap mutants seeded, with what currently catches each
      - goal: GOAL-D2-can-move
        contribution: enabling
        expected_effect: none -- supplies the before-state figures D2 anchor 3 requires
        local_signal: before-state descriptor captured
      - goal: GOAL-cheaper
        contribution: guard
        expected_effect: none expected
        local_signal: N/A
    acceptance:
      commands: [uv run --with pytest --with pyyaml python -m pytest tests -q]
      assertions: ["A gap mutant exists for every mechanism SM-02 and SM-03 will remove, seeded BEFORE the removal.", The toolchain's before-state descriptor is captured and committed., Predictions sealed with >= 3 negatives before any other ticket dispatches.]
    model_delta_expectation: none expected
