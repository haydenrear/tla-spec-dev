epic:
  id: subtract-to-measure
  branch: epic/subtract-to-measure
  default_branch: main
  base_sha: 3f58aca
  base_note: Branched from main after falsifiable-instruments merged and pushed.
  schedule_revision: 2
  review_mode: epic-owner-post-merge
  notes: >-
    Never merge to main and never run skill-manager sync without explicit owner say-so. Never invoke tla-spec-dev from PATH. THE PLAN MUST LOAD WITH BOTH LOADERS -- parse_simple_yaml AND the git-epic-workflow validator.
  schedule_revision_note: >-
    BUMPED TO 2, 2026-08-06, adding SM-06 at owner direction. tla-spec-dev becomes the AUTHORITATIVE SOURCE for the scorecard: one home for the card, pointers everywhere else, and three open upstream PRs reconciled to it. It is a REMOVAL ticket -- it deletes duplicated statements of the card -- so it belongs in this epic rather than a later one. Only SM-01 had been dispatched when this landed; SM-01 will reconcile.
deferment_policy:
  mode: batch
  blocking: escalate
  budget: 5
  backlog: specs/desired_program_model/deferred_findings.yaml
epic_goals:
  - id: GOAL-D2-can-move
    kind: eval
    statement: >-
      D2 can move at all, when given a subject with a real before and after. This separates 'the card cannot measure complexity' from 'there has never been anything to measure'.
    metric: D2 scored by two blind judges on the toolchain's removal, before against after, per judge.
    harness: >-
      SM-05 scores the SM-02 + SM-03 removal on the card, with the before/after descriptors SM-01 captured
    baseline:
      value: >-
        D2 = 2 on 27 of 27 cards ever written about the A/B example. A CONSTANT, not a stable dimension. Anchor 3 requires a measured simplification and every subject scored so far was greenfield, so the anchor has been structurally unreachable in every round to date.
      measured_at: 3f58aca
      evidence: specs/results/scorecards/ -- FI-06, and every sealed card
    target: >-
      D2 reaches 3 or more on the removal, OR the round reports plainly that D2 is still 2 on a genuine measured simplification -- at which point the card cannot measure complexity and D2 must stop being cited, having finally been TESTED rather than assumed. BOTH OUTCOMES DECIDE THE GOAL. What is not permitted is reporting met/missed without saying which explanation the evidence supports.
    evaluation_ticket: SM-05
    evidence_root: specs/results/scorecards/subtract-to-measure/GOAL-D2-can-move
  - id: GOAL-removal-is-measured
    kind: eval
    statement: 'Every removal is measured: a mutant seeded in its gap before the cut, re-run after it.'
    metric: >-
      Per removed mechanism: gap mutant still dies (redundant) or now survives (load-bearing). Count of removals with NO gap mutant, reported separately.
    harness: SM-01's seeded gap mutants, re-run on the integrated tip by SM-05
    baseline:
      value: >-
        ZERO. This project has never removed a shipped mechanism and measured what the removal cost. The scanners were deleted in a prior epic with no gap mutants seeded, and what they taught was written to references/architecture_advice.md instead.
      measured_at: 3f58aca
      evidence: references/architecture_advice.md
    target: >-
      Every removed mechanism has a gap mutant with a before and after verdict. Removals with no gap mutant are counted and named, never omitted.
    evaluation_ticket: SM-05
    evidence_root: specs/results/scorecards/subtract-to-measure/GOAL-removal-is-measured
  - id: GOAL-cheaper
    kind: quality
    statement: >-
      The round costs less per finding than its predecessor, and we know which channels earn their tokens.
    metric: >-
      Findings per 100k subagent tokens, BY CHANNEL. Not a total -- the per-channel split is the result.
    harness: SM-05 reports channel counts against token spend
    baseline:
      value: >-
        falsifiable-instruments: findings by channel 0 : 16 : 1 : 1 : 12 over roughly 2.6M subagent tokens. THE SUITE PRODUCED ZERO FOR THE FIFTH ROUND IN SIX while a full run costs about five minutes each time. The dominant channel is 'build the instrument, then ask what it cannot report'.
      measured_at: 3f58aca
      evidence: specs/results/scorecards/falsifiable-instruments/
    target: >-
      NO TARGET ON THE TOTAL -- a token target invites a cheaper round rather than a better one. What is targeted: the per-channel ratio is reported as a result, and the round says which channels should keep being funded and which should not.
    evaluation_ticket: SM-05
    evidence_root: specs/results/scorecards/subtract-to-measure/GOAL-cheaper
