    status: done
    github_issue: https://github.com/haydenrear/tla-spec-dev/issues/169
    schedule_revision: 3
    schedule_revision_note: >-
      BUMPED TO 3, 2026-08-07, owner-agreed eval design. A lone D2 score cannot distinguish "the card
      works now" from "these judges were generous", so the round scores TWO SUBJECTS IN ONE PASS: the
      toolchain removal (a real before/after) AND a greenfield fixture re-scored (which by construction
      cannot reach anchor 3). If D2 separates between them, the difference is the SUBJECT and five epics
      of fixtures were the problem. If D2 is 2 on both, the card cannot measure complexity. SECOND AXIS:
      the same subjects judged at DIFFERENT MODEL TIERS. If D2 stays 2 regardless of judge strength that
      is strong evidence it is the card; if a stronger judge reaches anchor 3, it was judging capacity all
      along. COST: this expansion works against GOAL-cheaper and the round REPORTS THAT TENSION AS A
      RESULT, including reporting the goal MISSED if the expansion causes it. An epic that hides the cost
