# Complexity ledger input -- MF-019 standing objective.
#
# `close ticket` refuses until this is filled in. That refusal is the mechanism:
# the standing objective is a required close-out step, not a stance.
#
# The delta is computed for you from `analyze complexity` and the TLC report.
# What you supply is the part a tool cannot know: whether behavior was retained,
# what the refinement search found, and why any increase is essential.

# Validated-refactor basis -- CD-09 (owner-approved 2026-07-22). This is what
# LICENSES a complexity DECREASE: TLC green on the model before AND after the
# change, behavior tests green, and the before/after descriptor comparison
# recorded. Absent, unknown, or degraded evidence REJECTS a decrease: an
# unmeasured constraint cannot witness retention. (The fourth obligation, the
# inspected transition-level diff, is `transition_diff:` below and is demanded
# whenever the MF-020 red flag fires.)
#
#   tlc_before:            green | fail        -- TLC on the pre-change model
#   tlc_after:             green | fail        -- TLC on the post-change model
#   behavior_tests:        pass | fail         -- the repository behavior tests
#   descriptor_comparison: recorded            -- before/after descriptor doc
validated_refactor:
  tlc_before:
    status: "not_run"
    evidence: >-
      No model change, so there is no pre/post model pair to run TLC over. The
      close report already records the bound as INCOMPLETE (7 of 9 variables
      resolved) for this scope, which is a standing property of TlaSpecDevCli
      and not something this ticket moved.
  tlc_after:
    status: "not_run"
    evidence: >-
      As above. UNVERIFIED is the honest value and it is recorded rather than
      dressed up: this ticket claims no complexity DECREASE on the model and so
      needs no validated-refactor licence for one.
  behavior_tests:
    status: "pass"
    evidence: >-
      `uv run --with pytest --with pyyaml python -m pytest tests -q` -> 1386
      passed at f26ec40; parent 6aac1ec -> 1378 passed. The 8 new nodes are
      tests/test_card_has_one_home.py. Full demonstrate.py exit 0 with zero
      failures, recorded as the baseline block of
      specs/results/scorecards/subtract-to-measure/SM-06/dup-mutants-after.json.
  descriptor_comparison:
    status: "recorded"
    evidence: >-
      Zero model delta, direction=zero vs SM-04, and no TLA+ surface is touched
      -- so the before/after descriptor is the SM-04 descriptor unchanged. What
      this ticket did reduce is counted instead in
      specs/results/scorecards/subtract-to-measure/SM-06/RESULT.md section 3,
      with the denominator effect stated: the numerator fell by 20 and the
      scanned surface did not move.

# Fuzzing-era retention members -- RECORDED at every close, non-gating since
# CD-09. Demoted to EXPERIMENTAL by the 2026-07-21 pivot (MF-038: kill 0.31 vs
# floor 0.8, 0/9 content bugs caught). `not_run` is the honest value; fill in a
# measured verdict only when one of them actually ran.
#
#   kill_rate:           pass | below_floor | incomplete_catalog | not_run   (MF-016)
#   effect_conformance:  clean | gaps | dead_surface | unobservable | not_run (MF-013/MF-027)
#   external_coverage:   pass | gaps | incomplete | not_run                  (MF-015)
#
# NOTE: `unobservable` IS NOT `clean`. MF-027 made the effect oracle refuse
# targets it cannot see; the record keeps that distinction even though the
# member no longer gates.
retention:
  kill_rate:
    status: "not_run"
    evidence: ""
  effect_conformance:
    status: "not_run"
    evidence: ""
  external_coverage:
    status: "not_run"
    evidence: ""

# Coverage audit -- MF-026. The completeness REVIEW, distinct from the three
# retention members above, which are all FIDELITY measures bounded to what is
# already modeled. Unmodeled surface is invisible to every one of them, and this
# is the only sweep that looks at it.
#
#   status: pass | fail | incomplete | not_run
#
# RECORDED, NEVER REFUSING (2026-08-04, owner direction). It was a hard gate at
# workflow close with no override; it is now an optional agent-run review whose
# verdict is written down and read by a person. `incomplete` IS STILL NOT
# `pass`, because a sweep that did not walk the surface says nothing about it --
# what was withdrawn is the refusal, not the distinction.
#
# Procedure: prompts/coverage_audit.md   Doctrine: references/coverage_audit.md
coverage_audit:
  status: "not_run"
  report: ""          # path to the filled templates/coverage_audit_report.md
  in_scope_gaps: null # count; in-scope gaps are HARD -- model it or change the program
  scope_source: ""    # plan file:lines the declared scope was READ from, never chosen

# Required if complexity INCREASED. Name the new essential behavior the added
# representation carries. This documents real behavior; it does not waive the
# increase, which is recorded and reported either way.
justification: ""

# The recursive refinement loop -- REQUIRED at every close.
# Either an approved recommendation with evidence, or "searched, found none".
# Recommendations are advisory and user-approved, never auto-applied.
refinement:
  searched: true
  outcome: "none"
  detail: >-
    SEARCHED, FOUND NONE. SM-06's `model_delta_expectation` is `none expected`
    and the measured delta is zero: the ticket adds no action, no variable and
    no state to `TlaSpecDevCli.tla`. Everything it touches is prose and
    instrument surface -- `README.md`, two epic charters,
    `references/hexagonal_prompting.md`, `_skeleton_md`'s hand-written headings
    in `score_tools.py`, an evidence-packet generator under `specs/results/`,
    one new pytest tripwire, and its registry row. None of that is modeled.

    A REMOVAL TICKET WITH A ZERO DELTA IS THE EXPECTED SHAPE HERE, and saying
    so is the point rather than a formality: what SM-06 removed was duplicated
    STATEMENTS of the eval card, which the TLA+ model has never represented. The
    reduction it can show is counted in
    `specs/results/scorecards/subtract-to-measure/SM-06/RESULT.md` section 3 --
    38 statements in 10 files down to 18 in 5, with the live unguarded class
    going 20 to 0 -- and that is a measurement about documents, not about the
    state machine. Reading a zero model delta as "nothing was removed" would be
    exactly the MF-020 error in reverse.
  measured: false      # true only if a real TLC run produced the figure
  applied: false       # if true, approved_by is required
  approved_by: ""

# Required only if a generated-states drop at constant distinct states is
# detected. That is a RED FLAG (deleted self-loop, MF-020), not a win -- record
# the inspected transition-level diff here to accept it.
transition_diff: ""

# REQUIRED. The narrative ledger: reasoning, measured alternatives, findings the
# machine-checked core above cannot express. Path to a document, or prose.
narrative: >-
    Path: specs/results/scorecards/subtract-to-measure/SM-06/RESULT.md, read
    against specs/results/scorecards/subtract-to-measure/SM-06/dup-mutants-before.json
    and dup-mutants-after.json.

    THE LOAD-BEARING RESULT IS AN UNFLATTERING ONE. Before anything was deleted,
    four copies of the card were made to DISAGREE with the card and the whole
    repository was asked whether it noticed. Three of the four -- a charter's
    dimension table, a scoring rule inside a judge's evidence packet, and the
    same rule in every scaffolded scorecard -- were missed by the 1378-test
    suite, by demonstrate.py, and by check, audit and serve together. The fourth,
    the control, went red on three surfaces, so that green is a fact about the
    copies rather than a dead harness. The copy anything caught was the one
    something already compared to the card.

    Re-run after the removal, both reintroduced copies are caught, on one node.

    The card's CONTENT is byte-identical to the parent commit: sha256
    210618e0c6557592940d086d91c8e35502a521af07b9429364ea667d31998594 before and
    after, anchors_digest sha256:eeccf4576bc6fd85 unchanged at v1, v2 and v3.
    D2, D4 and D5 stay on the card and no anchor was tuned.

    Five findings filed, none fixed, SM-06-DF-01..05. Two of them are about
    instruments this ticket did not build: served_digest does not cover every
    byte a judge is served, and `check` did not catch an edited anchor inside a
    card -- `audit` did, for a different reason than anyone would have
    predicted.
