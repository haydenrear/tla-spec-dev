# Complexity ledger input -- MF-019 standing objective.
#
# `close ticket` refuses until this is filled in. That refusal is the mechanism:
# the standing objective is a required close-out step, not a stance.
#
# The delta is computed for you from `analyze complexity` and the TLC report.
# What you supply is the part a tool cannot know: whether behavior was retained,
# what the refinement search found, and why any increase is essential.

# Validated-refactor basis -- CD-09 (owner-approved 2026-07-22). This is what
# LICENSES a complexity DECREASE: TLC green on the model before AND after the
# change, behavior tests green, and the before/after descriptor comparison
# recorded. Absent, unknown, or degraded evidence REJECTS a decrease: an
# unmeasured constraint cannot witness retention. (The fourth obligation, the
# inspected transition-level diff, is `transition_diff:` below and is demanded
# whenever the MF-020 red flag fires.)
#
#   tlc_before:            green | fail        -- TLC on the pre-change model
#   tlc_after:             green | fail        -- TLC on the post-change model
#   behavior_tests:        pass | fail         -- the repository behavior tests
#   descriptor_comparison: recorded            -- before/after descriptor doc
validated_refactor:
  tlc_before:
    status: "TODO"
    evidence: "TODO -- path to the pre-change TLC output"
  tlc_after:
    status: "TODO"
    evidence: "TODO -- path to the post-change TLC output"
  behavior_tests:
    status: "TODO"
    evidence: "TODO -- path to the behavior-test output"
  descriptor_comparison:
    status: "TODO"
    evidence: "TODO -- path to the before/after descriptor comparison"

# Fuzzing-era retention members -- RECORDED at every close, non-gating since
# CD-09. Demoted to EXPERIMENTAL by the 2026-07-21 pivot (MF-038: kill 0.31 vs
# floor 0.8, 0/9 content bugs caught). `not_run` is the honest value; fill in a
# measured verdict only when one of them actually ran.
#
#   kill_rate:           pass | below_floor | incomplete_catalog | not_run   (MF-016)
#   effect_conformance:  clean | gaps | dead_surface | unobservable | not_run (MF-013/MF-027)
#   external_coverage:   pass | gaps | incomplete | not_run                  (MF-015)
#
# NOTE: `unobservable` IS NOT `clean`. MF-027 made the effect oracle refuse
# targets it cannot see; the record keeps that distinction even though the
# member no longer gates.
retention:
  kill_rate:
    status: "not_run"
    evidence: ""
  effect_conformance:
    status: "not_run"
    evidence: ""
  external_coverage:
    status: "not_run"
    evidence: ""

# Coverage audit -- MF-026. The completeness REVIEW, distinct from the three
# retention members above, which are all FIDELITY measures bounded to what is
# already modeled. Unmodeled surface is invisible to every one of them, and this
# is the only sweep that looks at it.
#
#   status: pass | fail | incomplete | not_run
#
# RECORDED, NEVER REFUSING (2026-08-04, owner direction). It was a hard gate at
# workflow close with no override; it is now an optional agent-run review whose
# verdict is written down and read by a person. `incomplete` IS STILL NOT
# `pass`, because a sweep that did not walk the surface says nothing about it --
# what was withdrawn is the refusal, not the distinction.
#
# Procedure: prompts/coverage_audit.md   Doctrine: references/coverage_audit.md
coverage_audit:
  status: "not_run"
  report: ""          # path to the filled templates/coverage_audit_report.md
  in_scope_gaps: null # count; in-scope gaps are HARD -- model it or change the program
  scope_source: ""    # plan file:lines the declared scope was READ from, never chosen

# Required if complexity INCREASED. Name the new essential behavior the added
# representation carries. This documents real behavior; it does not waive the
# increase, which is recorded and reported either way.
justification: ""

# The recursive refinement loop -- REQUIRED at every close.
# Either an approved recommendation with evidence, or "searched, found none".
# Recommendations are advisory and user-approved, never auto-applied.
refinement:
  searched: true
  outcome: "none"
  detail: >-
    Searched, found none, and the reason is that this ticket changes no model.
    CA-02's assignment declares `model_delta_expectation: none expected`; its
    ticket-local `current` and `desired` are byte-identical (`diff -rq` clean),
    and `specs/current/` is untouched on this branch. There is no added
    representation to refine and no increase to justify -- the ticket is a
    REMOVAL, and it removes nothing the model describes.

    The whole surface cut is `examples/validation/gap_mutants/`,
    `examples/validation/removal_census/` and their two test files. None of it is
    reachable from Internal.tla or External.tla, none declares an action, and
    none is a spec double. `CL-02` recorded the same fact about the same file one
    epic ago: "CL-02's whole surface is `price_removal.py` and its tests, which
    the model does not describe and no product path invokes."

    REFINEMENT WAS CONSIDERED IN THE OTHER DIRECTION -- cutting FURTHER -- and
    refused twice, which is the part worth recording because both would have
    made the headline number better.

    (1) `scripts/complexity_ledger.py`. The work order directed this ticket to
        cut "whatever in `complexity_ledger.py` exists only to feed them", and
        `scripts/` is 63% of the goal's denominator. MEASURED: nothing does. One
        grep over all 1,245 lines for `gap_mutant|price|removal|residual|census|
        mutant` returns a single hit -- the word "removed" inside an unrelated
        prose string at line 854 -- and the file does not satisfy the instrument
        registry's executable predicate either. Cutting any of it would have been
        a deletion with no finding behind it, which fails clause (b) of
        `GOAL-apparatus-cut` even when the lines fall. Filed as `CA-02-DF-01`.

    (2) Deleting `examples/validation/gap_mutants/` outright rather than leaving
        a 63-line tombstone. It is the declared `scope` of the SEALED subject
        `rm04_removal_pricer`, and NOTHING IN THE SUITE ASSERTS THAT -- only
        `test_rd06_subjects.py` checks scope existence, and only for RD-06
        labels. The outright deletion would have passed every test and left a
        sealed card pointing at nothing. Kept, and the gap filed as
        `CA-02-DF-03`.
  measured: false      # no TLC run: no model change to run it against
  applied: false       # if true, approved_by is required
  approved_by: ""

# Required only if a generated-states drop at constant distinct states is
# detected. That is a RED FLAG (deleted self-loop, MF-020), not a win -- record
# the inspected transition-level diff here to accept it.
transition_diff: ""

# REQUIRED. The narrative ledger: reasoning, measured alternatives, findings the
# machine-checked core above cannot express. Path to a document, or prose.
narrative: >-
  Full price table: specs/results/scorecards/cut-the-apparatus/CA-02/PRICE-TABLE.md.
  Format established: .../GOAL-apparatus-cut/PRICE-TABLE-FORMAT.md. Suite:
  .../CA-02/pytest-repo-unit.txt and .../CA-02/pytest-repo-unit-reconciled.txt.
  Spec-unit: .../CA-02/spec-unit-tests.txt. Local signal:
  .../CA-02/local-signal-apparatus-cut.txt.

  WHAT THE MACHINE-CHECKED CORE ABOVE CANNOT EXPRESS.

  The complexity delta is zero and the ticket removed 1,444 Python lines, because
  what was cut was never in the model. `examples/validation/` 15,901 -> 14,457;
  `scripts/` unchanged at 27,652; `tests/` 32,162 -> 31,274; card unchanged at
  6,281 bytes and digest `sha256:2d7d4a0506d9b259`. The surfaces are reported
  separately and none is added to the card.

  WHY THE CUT IS ON THE RECORD RATHER THAN ON AESTHETICS. `RM-05-DF-01` and
  `CL-02`: for every fault whose killing nodes all lie in a file the removal
  deletes, `ENTAILED-SURVIVES` follows from `git show` alone and no other verdict
  is reachable. `CL-02` re-priced the entire sealed history over kill sets and
  got `priced rows: [], 0 of 10`. `RM-03`'s "first PRICED removal" was WITHDRAWN
  when its own zero-gap control returned the same verdict. `RM-02` supplies the
  argument that does not depend on that zero being right: the catalogues are
  `ab_quota_ledger` fixtures with no version an adopter receives, and that
  "survives a zero and survives a defective classifier producing one, because it
  is not a pricing argument."

  THE FINDING THE CORE CANNOT CARRY, and it argues against this ticket:
  `CA-02-DF-04`. The cut deleted the instrument behind DISPROOF 3 -- "the
  removal-pricing instrument could only ever return zero", 0 of 9 -- and disproof
  3 is what justified the cut. The disproof still READS from the sealed record,
  which is untouched; what is gone is the ability to RE-DERIVE it. An instrument
  that measures itself useless licenses its own deletion, after which the
  measurement cannot be checked. The cut is still right, but the load-bearing
  argument is RM-02's adoption one, not the 0 of 9.

  THE ONE SEALED THING THIS CUT MOVED, stated rather than buried.
  `rm04_removal_pricer` went `UNDERIVABLE:no-effect-surface`, moving the
  architecture-tag derivation from `17 of 21` to `16 of 21`, refusals 4 -> 5.
  denominator_rule: the NUMERATOR fell and the DENOMINATOR HELD at 21 -- nothing
  left the population, the subject is still declared and its sealed cards still
  read. It is the first downward move of that figure and the first caused by a
  deletion rather than a declaration; `RD-06-DF-04` predicted the mechanism and
  was incomplete about the direction. The demonstration was updated per its own
  stated rule, with all five superseded figures kept.

  THE DELIBERATE RED: DELETED WITH ITS SUBJECT, NOT REPAIRED.
  `test_nothing_in_the_repository_invokes_the_pricer` lived in
  `tests/test_price_removal.py`, which tests only the pricer. It was never a code
  failure -- at the base exactly TWO files tripped it and both are prose,
  `CLOSE-THE-LOOP-EPIC.md` and `NEXT-EPIC.md`. At this branch's HEAD the same
  filter returns THREE, including this ticket's own tombstone, so had the test
  been kept it would be red today with MORE hits than before. Suite numerator
  7 -> 6, denominator 1566 -> 1532 (-34 tests). Nothing was repaired and nothing
  is reported as repaired. `RM-05` had already refused the only available fix --
  widening the allow-list -- as "editing a target so a result passes"; this
  ticket refused it too, and refused the tidier variant of keeping a test whose
  subject no longer exists purely to preserve a red.

  MEASURED ALTERNATIVES REFUSED. (1) Cutting `complexity_ledger.py` to make the
  `scripts/` column non-zero -- no finding behind it. (2) Deleting the three
  registry rows instead of retiring them -- `FI-04-DF-04` is exactly the class of
  a capability leaving a registry without a row. (3) Writing a price-table
  GENERATOR -- a tool for measuring the cutting of apparatus is apparatus, and
  `RD-02`'s census is the worked example of that becoming a thing a later ticket
  has to remove; the format is a plain markdown file with no code behind it.
  (4) Restoring a Python file under `gap_mutants/` to keep the derivation at
  17 of 21 -- that is `MF-020`, fitting the tree to an expected output.

  METHOD FAILURE, RECORDED RATHER THAN HIDDEN. The first full-suite run was
  discarded: it was killed at 79% under contention with two concurrent CA-01
  review suites, AND contaminated by this ticket writing an evidence file into
  `specs/` while it was in flight -- the same class the epic owner was bitten by
  at kickoff, committed by the ticket that had been warned about it. Two clean
  runs replaced it and agree exactly: 6 failed / 1526 passed, same six failures,
  on the pre-merge tree and again on the reconciled tip.

  A FIFTH UNDECLARED INHERITED RED, reported and not filed because the deferment
  budget of 5 is spent: the spec-unit target `specs/current` fails with
  `active_ticket 'PA-01' is not present in the desired ticket plan`. That file is
  byte-identical at 37ab155 and CA-02 changed nothing under `specs/current/`.
