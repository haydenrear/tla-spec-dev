# Complexity ledger input -- MF-019 standing objective.
#
# `close ticket` refuses until this is filled in. That refusal is the mechanism:
# the standing objective is a required close-out step, not a stance.
#
# The delta is computed for you from `analyze complexity` and the TLC report.
# What you supply is the part a tool cannot know: whether behavior was retained,
# what the refinement search found, and why any increase is essential.

# Validated-refactor basis -- CD-09 (owner-approved 2026-07-22). This is what
# LICENSES a complexity DECREASE: TLC green on the model before AND after the
# change, behavior tests green, and the before/after descriptor comparison
# recorded. Absent, unknown, or degraded evidence REJECTS a decrease: an
# unmeasured constraint cannot witness retention. (The fourth obligation, the
# inspected transition-level diff, is `transition_diff:` below and is demanded
# whenever the MF-020 red flag fires.)
#
#   tlc_before:            green | fail        -- TLC on the pre-change model
#   tlc_after:             green | fail        -- TLC on the post-change model
#   behavior_tests:        pass | fail         -- the repository behavior tests
#   descriptor_comparison: recorded            -- before/after descriptor doc
validated_refactor:
  tlc_before:
    status: "TODO"
    evidence: "TODO -- path to the pre-change TLC output"
  tlc_after:
    status: "TODO"
    evidence: "TODO -- path to the post-change TLC output"
  behavior_tests:
    status: "TODO"
    evidence: "TODO -- path to the behavior-test output"
  descriptor_comparison:
    status: "TODO"
    evidence: "TODO -- path to the before/after descriptor comparison"

# Fuzzing-era retention members -- RECORDED at every close, non-gating since
# CD-09. Demoted to EXPERIMENTAL by the 2026-07-21 pivot (MF-038: kill 0.31 vs
# floor 0.8, 0/9 content bugs caught). `not_run` is the honest value; fill in a
# measured verdict only when one of them actually ran.
#
#   kill_rate:           pass | below_floor | incomplete_catalog | not_run   (MF-016)
#   effect_conformance:  clean | gaps | dead_surface | unobservable | not_run (MF-013/MF-027)
#   external_coverage:   pass | gaps | incomplete | not_run                  (MF-015)
#
# NOTE: `unobservable` IS NOT `clean`. MF-027 made the effect oracle refuse
# targets it cannot see; the record keeps that distinction even though the
# member no longer gates.
retention:
  kill_rate:
    status: "not_run"
    evidence: ""
  effect_conformance:
    status: "not_run"
    evidence: ""
  external_coverage:
    status: "not_run"
    evidence: ""

# Coverage audit -- MF-026. The completeness REVIEW, distinct from the three
# retention members above, which are all FIDELITY measures bounded to what is
# already modeled. Unmodeled surface is invisible to every one of them, and this
# is the only sweep that looks at it.
#
#   status: pass | fail | incomplete | not_run
#
# RECORDED, NEVER REFUSING (2026-08-04, owner direction). It was a hard gate at
# workflow close with no override; it is now an optional agent-run review whose
# verdict is written down and read by a person. `incomplete` IS STILL NOT
# `pass`, because a sweep that did not walk the surface says nothing about it --
# what was withdrawn is the refusal, not the distinction.
#
# Procedure: prompts/coverage_audit.md   Doctrine: references/coverage_audit.md
coverage_audit:
  status: "not_run"
  report: ""          # path to the filled templates/coverage_audit_report.md
  in_scope_gaps: null # count; in-scope gaps are HARD -- model it or change the program
  scope_source: ""    # plan file:lines the declared scope was READ from, never chosen

# Required if complexity INCREASED. Name the new essential behavior the added
# representation carries. This documents real behavior; it does not waive the
# increase, which is recorded and reported either way.
justification: ""

# The recursive refinement loop -- REQUIRED at every close.
# Either an approved recommendation with evidence, or "searched, found none".
# Recommendations are advisory and user-approved, never auto-applied.
refinement:
  searched: true
  outcome: "none"
  detail: >-
    SEARCHED, FOUND NONE, and the reason is that this ticket changes no model.
    CA-03's assignment declares `model_delta_expectation: none expected`; its
    ticket-local `current` and `desired` are byte-identical (`diff -rq` clean)
    and `specs/current/` is untouched on this branch. No action, variable or
    state is added to any TLA+ model, so there is no added representation to
    refine.

    A REFINEMENT RECOMMENDATION WAS AVAILABLE AND IS REFUSED RATHER THAN
    UNFOUND, and it is worth naming because it is the obvious move. The
    registration this ticket ships makes a blinded round self-describing, and
    the tempting next step is to MODEL the round lifecycle -- scaffold, blind,
    register, judge, check, seal -- so the missing registration becomes a state
    the model forbids. Refused on two grounds. First, this epic's instruction is
    NO NEW GATES, and a model that forbids the state is a gate wearing a
    proof. Second, and decisively, the defect was never that the state was
    unreachable in theory: it was that nothing WROTE a fact the scaffold already
    held. Adding representation to describe a bookkeeping omission is
    apparatus growth in an epic whose subject is the apparatus-to-result ratio.
    Filed here rather than acted on.

# Required only if a generated-states drop at constant distinct states is
# detected. That is a RED FLAG (deleted self-loop, MF-020), not a win -- record
# the inspected transition-level diff here to accept it.
transition_diff: ""

# REQUIRED. The narrative ledger: reasoning, measured alternatives, findings the
# machine-checked core above cannot express. Path to a document, or prose.
narrative: >-
  Evidence, all under specs/results/scorecards/cut-the-apparatus/CA-03/:
  descriptor-coupling.md (the RD-03-DF-08 enumeration and its verdict),
  five-checks.md (the SV-04-DF-05 repair and the per-check ruling),
  four-results.md (all four standing results recomputed from the sealed cards),
  local-signal-apparatus-cut.txt, and the suite output.

  WHAT THE MACHINE-CHECKED CORE ABOVE CANNOT EXPRESS.

  THE COMPLEXITY DELTA IS ZERO AND THE LINE COUNT WENT UP. `examples/validation/`
  14,685 -> 14,854 (+169); `scripts/` UNMOVED at 27,652; combined 42,337 ->
  42,506; card unchanged at 6,281 bytes and digest sha256:2d7d4a0506d9b259.
  Reported per surface, never combined with the card. THIS TICKET MOVES
  GOAL-apparatus-cut THE WRONG WAY, by 169 lines, and it is the third epic
  running in which a ticket called a simplification came out net-additive --
  which is RM-03-DF-03's structural point arriving on schedule.

  ZERO DELETIONS, SO CLAUSE (b) IS SATISFIED VACUOUSLY AND SHOULD BE READ THAT
  WAY. CA-03 deleted nothing, so there is no deletion without a finding behind
  it; that is not the same as having earned the clause.

  THE HALF OF THE BRIEF WITH NO LIVE SUBJECT. RD-03-DF-08 asked for the
  descriptor's role as a precondition of a D2 score to be cut. It was cut at
  card version 4 -- the card's own version-history row says so -- and what
  remains is either mandated by SERVED card rule 7 (which the acceptance freezes
  at 6,281 bytes), or a sealed reproduction bar protected by R-H4, or on the D3
  axis carrying standing result 2. `grep -c code_complexity score_tools.py` is 0
  and a repository-wide test has asserted the property since RD-05. So the
  answer is an enumeration and a verdict, not a diff. CA-03-DF-01.

  THE OTHER HALF IS ONE FAILURE, NOT FIVE. SV-04-DF-05 reads as an indictment of
  five checks. It is a defect in `scaffold`: it blinds `subject.name`, which is
  correct and is F3's first defence, and then does not record the
  [round-dir, arm-label] pair the blinding makes necessary. Repaired there --
  the finding's own FIRST suggestion -- and not by the finding's second, which
  is to make `check` refuse and is a sixth gate. The repair refuses nothing.

  TWO CORRECTIONS TO THE CHARTER THIS TICKET COULD NOT MAKE ITSELF. (1)
  "CL-01's second seal" is executed by `check` (version_history_problems, called
  from cmd_check and nowhere else), not by `seal`; a cut made on the charter's
  wording would remove the thing the charter protects. CA-03-DF-04. (2) "Static
  gates catch nothing -- seven epics, zero bugs" holds over subject code and
  fails over this project's own record, where `audit` alone has three dated,
  outcome-changing catches including the epic owner's own unexecuted R-H5,
  rejected at close within the minute. CA-03-DF-05, carried to CA-08.

  RAN MY OWN RULE AGAINST THE SEALED RECORD, PER THE CHARTER, AND `scope`
  REACHED NONE OF MY PROSE. `scope` reports 102 counted figures before and after
  these documents were written: not one claim in them takes the `D<n> = k on N
  of M` shape `scope` reads. That is a bound on `scope`, recorded rather than
  reported as a pass. The verification that did the work was reading each cited
  finding verbatim before resting anything on it, which is what caught that half
  this ticket's brief had already been done.
