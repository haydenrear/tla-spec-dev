# Complexity ledger input -- MF-019 standing objective.
#
# `close ticket` refuses until this is filled in. That refusal is the mechanism:
# the standing objective is a required close-out step, not a stance.
#
# The delta is computed for you from `analyze complexity` and the TLC report.
# What you supply is the part a tool cannot know: whether behavior was retained,
# what the refinement search found, and why any increase is essential.

# Validated-refactor basis -- CD-09 (owner-approved 2026-07-22). This is what
# LICENSES a complexity DECREASE: TLC green on the model before AND after the
# change, behavior tests green, and the before/after descriptor comparison
# recorded. Absent, unknown, or degraded evidence REJECTS a decrease: an
# unmeasured constraint cannot witness retention. (The fourth obligation, the
# inspected transition-level diff, is `transition_diff:` below and is demanded
# whenever the MF-020 red flag fires.)
#
#   tlc_before:            green | fail        -- TLC on the pre-change model
#   tlc_after:             green | fail        -- TLC on the post-change model
#   behavior_tests:        pass | fail         -- the repository behavior tests
#   descriptor_comparison: recorded            -- before/after descriptor doc
validated_refactor:
  tlc_before:
    status: "TODO"
    evidence: "TODO -- path to the pre-change TLC output"
  tlc_after:
    status: "TODO"
    evidence: "TODO -- path to the post-change TLC output"
  behavior_tests:
    status: "TODO"
    evidence: "TODO -- path to the behavior-test output"
  descriptor_comparison:
    status: "TODO"
    evidence: "TODO -- path to the before/after descriptor comparison"

# Fuzzing-era retention members -- RECORDED at every close, non-gating since
# CD-09. Demoted to EXPERIMENTAL by the 2026-07-21 pivot (MF-038: kill 0.31 vs
# floor 0.8, 0/9 content bugs caught). `not_run` is the honest value; fill in a
# measured verdict only when one of them actually ran.
#
#   kill_rate:           pass | below_floor | incomplete_catalog | not_run   (MF-016)
#   effect_conformance:  clean | gaps | dead_surface | unobservable | not_run (MF-013/MF-027)
#   external_coverage:   pass | gaps | incomplete | not_run                  (MF-015)
#
# NOTE: `unobservable` IS NOT `clean`. MF-027 made the effect oracle refuse
# targets it cannot see; the record keeps that distinction even though the
# member no longer gates.
retention:
  kill_rate:
    status: "not_run"
    evidence: ""
  effect_conformance:
    status: "not_run"
    evidence: ""
  external_coverage:
    status: "not_run"
    evidence: ""

# Coverage audit -- MF-026. The completeness REVIEW, distinct from the three
# retention members above, which are all FIDELITY measures bounded to what is
# already modeled. Unmodeled surface is invisible to every one of them, and this
# is the only sweep that looks at it.
#
#   status: pass | fail | incomplete | not_run
#
# RECORDED, NEVER REFUSING (2026-08-04, owner direction). It was a hard gate at
# workflow close with no override; it is now an optional agent-run review whose
# verdict is written down and read by a person. `incomplete` IS STILL NOT
# `pass`, because a sweep that did not walk the surface says nothing about it --
# what was withdrawn is the refusal, not the distinction.
#
# Procedure: prompts/coverage_audit.md   Doctrine: references/coverage_audit.md
coverage_audit:
  status: "not_run"
  report: ""          # path to the filled templates/coverage_audit_report.md
  in_scope_gaps: null # count; in-scope gaps are HARD -- model it or change the program
  scope_source: ""    # plan file:lines the declared scope was READ from, never chosen

# Required if complexity INCREASED. Name the new essential behavior the added
# representation carries. This documents real behavior; it does not waive the
# increase, which is recorded and reported either way.
justification: ""

# The recursive refinement loop -- REQUIRED at every close.
# Either an approved recommendation with evidence, or "searched, found none".
# Recommendations are advisory and user-approved, never auto-applied.
refinement:
  searched: true
  outcome: "none"
  detail: >-
    Searched, found none. CA-05's model_delta_expectation is "none expected" and
    the ticket held to it: no Internal/External action, state variable or
    invariant changed, so there is no transition structure to refine. The
    ticket's whole delta is markdown registers, five appended ledger rows, one
    133-line checker under scripts/ and one 119-line test. The refinement loop
    has nothing to search over here, and saying so is the honest outcome rather
    than manufacturing a recommendation.
  measured: false      # true only if a real TLC run produced the figure
  applied: false       # if true, approved_by is required
  approved_by: ""

# Required only if a generated-states drop at constant distinct states is
# detected. That is a RED FLAG (deleted self-loop, MF-020), not a win -- record
# the inspected transition-level diff here to accept it.
transition_diff: ""

# REQUIRED. The narrative ledger: reasoning, measured alternatives, findings the
# machine-checked core above cannot express. Path to a document, or prose.
narrative: >-
  CA-05 -- the disposition requirement. Full working:
  specs/results/scorecards/cut-the-apparatus/GOAL-consumption-obligatory/CA-05/refusal.md
  and .../harvest-recount.md; the rule itself is references/consumption.md.

  WHAT SHIPPED. An epic may not close while a finding it filed is undisposed:
  D1 a disposition that is not `open`, D2 a note on a terminal disposition, D3 a
  named successor on a deferral. Vocabulary closed on purpose. NOT A GATE ON
  ANYONE'S CODE -- it reads one file in this repository and reports on this
  project's own epics; seven epics of static checking caught zero bugs and this
  epic adds none.

  R1, DISCHARGED ON REAL INPUT. Run against the sealed 225-row ledger it REFUSES
  cut-the-apparatus at 10 of 15 rows open -- this epic, its own close-out, not a
  fixture -- while ACCEPTING falsifiable-instruments (30/30) and
  subtract-to-measure (30/30), and refusing ports-as-adapters on 2 of 28 rows
  under D2 alone. Two real epics pass, six refuse, the refusals differ in size
  and clause, and one real slice (--ticket CA-05) passes inside a refused epic.
  A rule that refuses everything is a constant, not a measurement -- the mirror
  of harvest class D1 -- so the discrimination was demonstrated separately
  rather than assumed.

  THE FINDING, AND IT IS NOT THE ONE THE TICKET WAS SENT TO GET. The premise
  "consumption is 1 of 38 because nothing requires it" is half wrong. A
  disposition practice EXISTED, ran three consecutive epics, routed 83 findings
  into named successors -- including five purpose-built carry-forward issues,
  #144-#148, still open today -- and STOPPED DEAD on 2026-08-08 with no
  discussion in any record. And the same four epics are missing from
  SELF-IMPROVEMENT.md, whose sections end at SM-05 on 2026-08-07: the
  correlation is exact across all eight epics in both directions. Both registers
  lapsed at the same commit because nothing reported on either. CA-05-DF-01.

  THE REGISTER. 38 verified before it was changed, then SV-01-DF-05's three
  unswept classes appended as G1-G3. Per denominator_rule: THE DENOMINATOR ROSE
  38 -> 41, THE NUMERATOR DID NOT MOVE, 2.6% -> 2.4%; the rate fell on a
  bookkeeping repair, nothing regressed. 41 IS A FLOOR -- the sweep read 83
  cards, the tree holds 95, twelve are unswept (CA-05-DF-04). And three of the
  four classes named by a ledger row are this project catching ITSELF committing
  the class; only A1 was consumed.

  MEASURED ALTERNATIVES, REJECTED. (1) A pure-prose requirement with a grep,
  which the charter prefers -- rejected because grep cannot scope to an epic or
  check the D2/D3 grammar, and the "demonstrated refusal" R1 demands would not
  have been reproducible. (2) Hiding the instrument in tests/, where
  GOAL-apparatus-cut does not count it -- rejected as metric-dodging; it sits in
  scripts/ and is priced at +133 lines. (3) Retro-classifying `channel` on the
  210 pre-existing rows -- rejected because assigning a channel from somebody
  else's prose is exactly the hand classification the field exists to end, and
  in bulk it would manufacture a clean history nobody measured. (4) Building the
  consumption half of the check -- rejected as apparatus measuring apparatus,
  and DECLARED as the instrument's known blindness instead (CA-05-DF-03): a row
  can satisfy all three clauses by being carried to an issue that closes unread,
  and falsifiable-instruments passes on exactly that shape.

  PRICE. scripts/ 27,652 -> 27,785 (+133, scripts/disposition.py). tests/ +119.
  examples/validation/ 16,129, UNCHANGED. Card 6,281 bytes,
  sha256:2d7d4a0506d9b259, UNCHANGED -- clause (c) of GOAL-apparatus-cut holds.
  The surfaces are reported separately and never combined with the card.
