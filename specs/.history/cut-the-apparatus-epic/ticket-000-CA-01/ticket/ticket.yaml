    "objective": "GOAL 03, AND IT LANDS BEFORE ANY JUDGED ROUND IN THIS EPIC. The owner's words: 'make sure the memory doesn't leak in, because that's been a killer.' SV-05 measured 4 of 4 blind agents disclosing UNPROMPTED that the operator's auto-memory and the environment block were in their context before they read anything; one quoted MEMORY.md verbatim, naming the exact prior on the exact question a D3 judge is asked. IT ARRIVES WITH NO TOOL CALL, so no forbidden-reading list in any dispatch can reach it, and NOTHING A DISPATCH SAYS REMOVES A BLOCK THE HARNESS INJECTS FIRST. THREE THINGS, IN ORDER. FIRST, ESTABLISH WHAT A DISPATCHED AGENT ACTUALLY RECEIVES -- auto-memory, environment block, CLAUDE.md, session hooks, skill listings, anything else -- BY MEASURING IT, NOT BY ASSUMING IT: dispatch agents that are asked only to report their own pre-read context verbatim, and record what comes back. SECOND, BUILD A DISPATCH PATH THAT DEMONSTRABLY CARRIES NONE OF THE OPERATOR'S CONCLUSIONS, and PROVE IT THE SAME WAY -- fresh agents through the new path, asked what they received, with their answers recorded verbatim. Inspecting configuration is not proof; R1 requires a demonstrated failing input on a real subject, so SHOW THE PATH REFUSING TO LEAK ON A CASE THAT LEAKED BEFORE. THIRD, SAY WHAT IT COSTS. IF BLINDNESS CANNOT BE ACHIEVED WITH THIS HARNESS, THAT IS A FINDING ABOUT THE WHOLE PROGRAMME and it must be stated rather than worked around, together with a contamination note that can be printed beside every number the way SV-01-DF-01 did. DO NOT SOLVE THIS BY EDITING THE OPERATOR'S MEMORY SILENTLY AND CALLING THE PROBLEM GONE -- the record must say what every past round carried, and any change to a memory file or a skill is PROPOSED AS A DIFF AND ESCALATED, never applied. ASK EVERY AGENT YOU DISPATCH WHAT IT REJECTED.",
