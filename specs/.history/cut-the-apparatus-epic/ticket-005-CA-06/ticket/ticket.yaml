    "objective": "THE OWNER'S DIRECTION, AND THE TENSION IS TO BE NOTED HONESTLY RATHER THAN QUIETLY RESOLVED EITHER WAY. The owner keeps this path: 'I do want to keep parts of the TLA+ diagram, I still think generating cases, using adapters is valid, I want to make it dead simple, the regressions should tried to be included in TLA+ and adapters in the most simple validated way.' TAKE THAT AS A DECISION. And state the tension plainly in your PR: THE MEASUREMENT SAYS THE CURRENT IMPLEMENTATION DOES NOT BEAT HAND-WRITTEN TESTS -- 0 unique kills against 4 the other way, replicated on new subjects -- while the direction is to keep it and shrink it. THOSE ARE COMPATIBLE ONLY IF IT GETS DRAMATICALLY SMALLER. generate_cases_from_tlc_dump.py (3,471) plus run_generated_case_adapters.py (2,455) is ~5,900 LINES PRODUCING A CORPUS WITH ZERO UNIQUE KILLS. THE TARGET IS NOT DELETION -- it is a version small enough that its yield is worth its size and simple enough that AN ADOPTER COULD RUN IT. SIMPLIFY AGGRESSIVELY; DO NOT DELETE. Keep the shape the owner named: a TLA+ action or an adapter conformance case is how a regression gets expressed, and SV-04 ALREADY DEMONSTRATED THE ADAPTER HALF -- a 14-case conformance suite with durability asserted OUT OF BAND moved D3 from 3 to 4 against a control. REPORT WHAT THE SIMPLIFIED VERSION COSTS AND WHAT IT CATCHES, on a real subject. IF THE SIMPLIFIED VERSION STILL YIELDS ZERO UNIQUE KILLS, SAY SO -- THAT IS A RESULT, and the owner's direction was to simplify it, not to prove it works. MF-020 applies with force here: do not fit a case, an axis or a corpus to a bug you already know about.",
