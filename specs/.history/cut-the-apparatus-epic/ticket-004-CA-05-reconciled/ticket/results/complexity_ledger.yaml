# Complexity ledger input -- MF-019 standing objective.
#
# `close ticket` refuses until this is filled in. That refusal is the mechanism:
# the standing objective is a required close-out step, not a stance.
#
# The delta is computed for you from `analyze complexity` and the TLC report.
# What you supply is the part a tool cannot know: whether behavior was retained,
# what the refinement search found, and why any increase is essential.

# Validated-refactor basis -- CD-09 (owner-approved 2026-07-22). This is what
# LICENSES a complexity DECREASE: TLC green on the model before AND after the
# change, behavior tests green, and the before/after descriptor comparison
# recorded. Absent, unknown, or degraded evidence REJECTS a decrease: an
# unmeasured constraint cannot witness retention. (The fourth obligation, the
# inspected transition-level diff, is `transition_diff:` below and is demanded
# whenever the MF-020 red flag fires.)
#
#   tlc_before:            green | fail        -- TLC on the pre-change model
#   tlc_after:             green | fail        -- TLC on the post-change model
#   behavior_tests:        pass | fail         -- the repository behavior tests
#   descriptor_comparison: recorded            -- before/after descriptor doc
validated_refactor:
  # ==================================================================
  # READ THIS BEFORE CREDITING CA-05 WITH ANYTHING BELOW.
  #
  # THE `vars 9->8, actions 17->16` DECREASE IS **CA-04's**, NOT CA-05's.
  # CA-04 removed the mutation kill test, which removes model surface; its
  # plan entry says so ("EXPECTED AND DELIBERATE"). CA-05's
  # model_delta_expectation is "none expected" and the ticket held to it:
  #   ticket desired == ticket current == promoted specs/current,
  #   and no .tla/.cfg outside CA-05's own sealed history snapshot differs
  #   from the epic tip e379d6b.
  # Recorded entries: CA-01, CA-02, CA-03 and CA-05's OWN FIRST CLOSE all
  # read vars=9 actions=17. CA-04 reads vars=8 actions=16.
  #
  # THE EVIDENCE BELOW IS **CITED FROM CA-04, NOT MEASURED BY CA-05**, on the
  # epic owner's explicit instruction after this gate refused CA-05's close.
  # CA-05 did NOT run TLC. Running it would have certified a decrease this
  # ticket did not cause, which is the misattribution the gate exists to
  # prevent. Filed as CA-05-DF-07: the gate's ticket-scoped delta compares a
  # ticket's new entry against ITS OWN PREVIOUS ENTRY, and that pair straddles
  # a merge, so any ticket promoting after a model-changing ticket inherits
  # that ticket's delta and is asked to license it.
  # ==================================================================
  tlc_before:
    status: "green"
    evidence: >-
      CITED FROM CA-04, NOT RUN BY CA-05.
      specs/results/scorecards/cut-the-apparatus/CA-04/tlc-before.txt (also at
      specs/.history/cut-the-apparatus-epic/ticket-003-CA-04/results/tlc-before.txt):
      13,008,254 states generated, 563,963 distinct states, 0 left on queue,
      depth 25, "Model checking completed. No error has been found." This is the
      BEFORE side of the 9-variable model -- the model CA-04 changed and CA-05
      did not. CA-04 additionally reported that this figure reproduces the count
      recorded in TlaSpecDevCli.tla's own comment for that model, a faithfulness
      check stronger than a hash.
  tlc_after:
    status: "green"
    evidence: >-
      CITED FROM CA-04, NOT RUN BY CA-05.
      specs/results/scorecards/cut-the-apparatus/CA-04/tlc-after.txt:
      2,505,440 states generated, 124,643 distinct states, 0 left on queue,
      depth 24, "Model checking completed. No error has been found.", 13
      invariants hold. This is the AFTER side of the same delta -- the
      8-variable model CA-05 inherited by merging CA-04 and did not modify.
  behavior_tests:
    status: "pass"
    evidence: >-
      MEASURED BY CA-05, and the only member here that is.
      specs/results/scorecards/cut-the-apparatus/GOAL-consumption-obligatory/CA-05/suite-CA-05.md
      -- stated plainly rather than as a bare "pass": 8 FAILED / 1483 passed at
      the reconciled tip. ALL EIGHT ARE THE EPIC-TIP BASELINE, MEASURED DIRECTLY
      at e379d6b in a detached worktree with this branch not involved, rather
      than assumed: the 2 deliberate/inherited, the 3 test_source_citations,
      test_ticket_retirement, CA-00-DF-02, and the TWO CA-04 DECLARED under
      CA-04-DF-04. ZERO attributable to CA-05. "pass" means BEHAVIOR RETAINED,
      not a green suite.
  descriptor_comparison:
    status: "recorded"
    evidence: >-
      CITED FROM CA-04, NOT PRODUCED BY CA-05.
      specs/results/scorecards/cut-the-apparatus/CA-04/descriptor-comparison.md
      -- before/after over the same two models, before side verified
      byte-faithful by sha256 9c0f394c28259fe67848d2b7d45323d759d29bfb8e69c916b010051c91c622ef,
      recording variables 9 -> 8 attributed to `kill_test`. CA-05 produced no
      descriptor comparison because CA-05 changed no descriptor.

# Fuzzing-era retention members -- RECORDED at every close, non-gating since
# CD-09. Demoted to EXPERIMENTAL by the 2026-07-21 pivot (MF-038: kill 0.31 vs
# floor 0.8, 0/9 content bugs caught). `not_run` is the honest value; fill in a
# measured verdict only when one of them actually ran.
#
#   kill_rate:           pass | below_floor | incomplete_catalog | not_run   (MF-016)
#   effect_conformance:  clean | gaps | dead_surface | unobservable | not_run (MF-013/MF-027)
#   external_coverage:   pass | gaps | incomplete | not_run                  (MF-015)
#
# NOTE: `unobservable` IS NOT `clean`. MF-027 made the effect oracle refuse
# targets it cannot see; the record keeps that distinction even though the
# member no longer gates.
retention:
  kill_rate:
    status: "not_run"
    evidence: ""
  effect_conformance:
    status: "not_run"
    evidence: ""
  external_coverage:
    status: "not_run"
    evidence: ""

# Coverage audit -- MF-026. The completeness REVIEW, distinct from the three
# retention members above, which are all FIDELITY measures bounded to what is
# already modeled. Unmodeled surface is invisible to every one of them, and this
# is the only sweep that looks at it.
#
#   status: pass | fail | incomplete | not_run
#
# RECORDED, NEVER REFUSING (2026-08-04, owner direction). It was a hard gate at
# workflow close with no override; it is now an optional agent-run review whose
# verdict is written down and read by a person. `incomplete` IS STILL NOT
# `pass`, because a sweep that did not walk the surface says nothing about it --
# what was withdrawn is the refusal, not the distinction.
#
# Procedure: prompts/coverage_audit.md   Doctrine: references/coverage_audit.md
coverage_audit:
  status: "not_run"
  report: ""          # path to the filled templates/coverage_audit_report.md
  in_scope_gaps: null # count; in-scope gaps are HARD -- model it or change the program
  scope_source: ""    # plan file:lines the declared scope was READ from, never chosen

# Required if complexity INCREASED. Name the new essential behavior the added
# representation carries. This documents real behavior; it does not waive the
# increase, which is recorded and reported either way.
justification: ""

# The recursive refinement loop -- REQUIRED at every close.
# Either an approved recommendation with evidence, or "searched, found none".
# Recommendations are advisory and user-approved, never auto-applied.
refinement:
  searched: true
  outcome: "none"
  detail: >-
    Searched, found none. CA-05's model_delta_expectation is "none expected" and
    the ticket held to it: no Internal/External action, state variable or
    invariant changed, so there is no transition structure to refine. The
    ticket's delta is markdown registers, six appended ledger rows, one 213-line
    checker under scripts/ and one test file. Saying so is the honest outcome
    rather than manufacturing a recommendation.
  measured: false      # true only if a real TLC run produced the figure
  applied: false       # if true, approved_by is required
  approved_by: ""

# Required only if a generated-states drop at constant distinct states is
# detected. That is a RED FLAG (deleted self-loop, MF-020), not a win -- record
# the inspected transition-level diff here to accept it.
transition_diff: ""

# REQUIRED. The narrative ledger: reasoning, measured alternatives, findings the
# machine-checked core above cannot express. Path to a document, or prose.
narrative: >-
  CA-05 -- the disposition requirement, at the RECONCILED epic tip e379d6b
  (CA-01..CA-04 all merged). Working:
  specs/results/scorecards/cut-the-apparatus/GOAL-consumption-obligatory/CA-05/refusal.md,
