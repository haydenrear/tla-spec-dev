    "objective": "GOAL 02, IN THE OWNER'S WORDS: 'Detection, filing, scoring and re-scoring all work. Consumption is 1 of 38 because nothing requires it. Either a filed finding must receive a disposition before an epic can close, or the honest description is a measurement programme rather than a self-improvement loop. Both are respectable; the current state is neither.' THE OWNER CHOSE THE FIRST, WITH THE REGISTER REPAIRED. FOUR PARTS. (1) A DISPOSITION REQUIREMENT: every filed finding gets an explicit disposition -- consumed, deferred with a named successor, or wontfix with a reason -- before an epic can close. THIS IS A CLOSE-OUT REQUIREMENT ON THIS PROJECT'S OWN EPICS AND NOT A GATE ON ANYONE'S CODE; seven epics of static checking caught zero bugs and this epic adds no gate. (2) R1 APPLIED TO IT: ship it with a DEMONSTRATED REFUSAL on a real input -- run it against THIS epic's own filed findings and show it refusing a real close-out, not a fixture. This project has shipped three instruments later found blind. (3) REPAIR THE REGISTER: HARVEST-CL-03.md carries 38 classes and was untouched last epic, and SV-01-DF-05 filed three new classes into the ledger and not into the harvest, SO 38 STOPPED GROWING ON 2026-08-11 AND UNDERSTATES THE BACKLOG. State the TRUE denominator and, per denominator_rule, SAY WHETHER THE NUMERATOR ROSE OR THE DENOMINATOR FELL. Read the 1-of-38 honestly: THREE OF THE FOUR NEWLY-NAMED CLASSES ARE THIS PROJECT CATCHING ITSELF COMMITTING THE CLASS, not consuming it. (4) THE TWO MISSING FIELDS: a channel field on the ledger, asked for six epics ago and still hand-classified from free text every single time; and CL-04's cost block with basis and value at ticket close-out, proposed three epics ago and never built -- SV-05 measured 353,816 tokens at 0.57 findings per 100k, comparable to SV-01's 0.98 on the same basis, AND THAT IS THE FIRST TIME TWO ROUNDS IN THIS PROGRAMME WERE COMPARABLE AT ALL. Populate both from this epic's own tickets. RUN YOUR OWN RULE AGAINST THE SEALED RECORD BEFORE SHIPPING IT, per the charter -- SV-07 refuted its predecessor's recommendation in one command by trying to ship it. AND KEEP THE HONEST ALTERNATIVE ON THE TABLE: if the requirement cannot be made to work, saying 'this is a measurement programme, not a self-improvement loop' IS AN ACCEPTABLE AND VALUABLE OUTCOME.",
