    "objective": "SUBJECT NAMED AT SCHEDULE REVISION 2 BY THE EPIC OWNER, FROM WHAT THIS EPIC ACTUALLY FILED: CA-06-DF-02. THE NEGATIVE CORPUS KEYS `params` BY TLA FORMAL NAMES WHILE THE POSITIVE CORPUS KEYS THEM BY RECOVERED NAMES, SO EVERY SHIPPED ADAPTER DIES ON KeyError -- confirmed by CA-06's reviewer running all 11 recovered cases: 11 dead, KeyError 'account' x7, KeyError 'order' x4. CA-06 FILED IT AND DELIBERATELY DID NOT FIX IT, because re-keying changes corpus contents under the fixture whose sealed tables this programme quotes. IT IS THE RIGHT SUBJECT FOR THIS TICKET FOR THREE REASONS: it is a finding THIS EPIC FILED rather than a fresh defect invented for the ticket; the defect is EXACTLY an adapter-conformance mismatch, so the regression's natural home is an ADAPTER CONFORMANCE CASE, which is the owner's section 4 shape verbatim; and CA-06-DF-01 established that the measured yield of --negative-cases on a real subject is ZERO CASES EXECUTED, so this is the defect standing between a mechanism the owner chose to keep and any yield at all. THIS TICKET IS DELIBERATELY RESERVED AT PLANNING TIME AND ITS SUBJECT WAS SUPPLIED BY ITS PREDECESSORS. That is the point: the epic is testing whether consumption can be made routine, and a consumption ticket whose defect was chosen before the epic ran would be answering an easier question. AT WAVE-3 TRIAGE THE EPIC OWNER NAMES THE SUBJECT from what CA-01 through CA-06 actually filed, and records it in this entry with a schedule_revision bump. THE RULE FOR CHOOSING: use a finding THIS EPIC FILED or one already on the harvest register -- NEVER A FRESH DEFECT INVENTED FOR THE TICKET, because inventing one dodges the thing being tested. THE SHAPE, from the owner's section 4: 'a regression, once found, should be expressible as a TLA+ action or an adapter conformance case -- the most simple validated way'. Use CA-06's simplified path to do it, which is also the first real test of whether that path is usable. SV-04 is the worked precedent and its honest caveat carries: a 14-case conformance suite with durability asserted OUT OF BAND moved D3 3 -> 4 against a control, AND THE SCORE MOVEMENT IS THE OBSERVATION, NOT THE OBJECTIVE. Tuning validation to raise a number is MF-020 and fails this ticket. IF NO SUITABLE FINDING EXISTS AT TRIAGE, THIS TICKET IS RETIRED THROUGH THE CANONICAL RECEIPT FLOW WITH ITS GOAL DISPOSITION RECORDED -- and that retirement is itself a result about GOAL-consumption-obligatory, not an embarrassment to be avoided.",
