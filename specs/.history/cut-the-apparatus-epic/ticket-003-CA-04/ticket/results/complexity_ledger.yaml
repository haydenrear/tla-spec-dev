# Complexity ledger input -- MF-019 standing objective.
#
# `close ticket` refuses until this is filled in. That refusal is the mechanism:
# the standing objective is a required close-out step, not a stance.
#
# The delta is computed for you from `analyze complexity` and the TLC report.
# What you supply is the part a tool cannot know: whether behavior was retained,
# what the refinement search found, and why any increase is essential.

# Validated-refactor basis -- CD-09 (owner-approved 2026-07-22). This is what
# LICENSES a complexity DECREASE: TLC green on the model before AND after the
# change, behavior tests green, and the before/after descriptor comparison
# recorded. Absent, unknown, or degraded evidence REJECTS a decrease: an
# unmeasured constraint cannot witness retention. (The fourth obligation, the
# inspected transition-level diff, is `transition_diff:` below and is demanded
# whenever the MF-020 red flag fires.)
#
#   tlc_before:            green | fail        -- TLC on the pre-change model
#   tlc_after:             green | fail        -- TLC on the post-change model
#   behavior_tests:        pass | fail         -- the repository behavior tests
#   descriptor_comparison: recorded            -- before/after descriptor doc
validated_refactor:
  tlc_before:
    status: "green"
    evidence: >-
      specs/results/scorecards/cut-the-apparatus/CA-04/tlc-before.txt --
      `tlc2 -config MC.cfg TlaSpecDevCli.tla` on the PRE-change model,
      reconstructed from `git show 4302082:specs/current/{TlaSpecDevCli.tla,MC.cfg}`
      into a scratch tree and verified byte-faithful by sha256
      (9c0f394c28259fe67848d2b7d45323d759d29bfb8e69c916b010051c91c622ef,
      identical to git show's own output). "Model checking completed. No error
      has been found." 13,008,254 states generated, 563,963 distinct, 0 left on
      queue, depth 25, EXIT=0. INDEPENDENT CHECK ON THE RECONSTRUCTION: 563,963
      is the exact figure TlaSpecDevCli.tla's own comment recorded for that model
      long before this ticket, so the before-tree reproduces the repository's own
      state count and not merely its bytes.
  tlc_after:
    status: "green"
    evidence: >-
      specs/results/scorecards/cut-the-apparatus/CA-04/tlc-after.txt --
      `tlc2 -config MC.cfg TlaSpecDevCli.tla` on specs/current at the merged tip.
      "Model checking completed. No error has been found." 2,505,440 states
      generated, 124,643 distinct, 0 left on queue, depth 24, EXIT=0. All 13
      surviving invariants held over the whole reachable state space.
  behavior_tests:
    status: "pass"
    evidence: >-
      specs/results/scorecards/cut-the-apparatus/CA-04/pytest-repo-unit-final.txt
      -- `uv run --with pytest --with pyyaml -m pytest tests -q` on the merged
      tip: 8 failed, 1466 passed in 1295.22s. STATED IN FULL RATHER THAN
      SUMMARISED, because a validated-refactor record that paraphrases its own
      suite is how a red gets lost. SIX ARE PRE-EXISTING at CA-03's tip 24cd340
      and identical there (test_architecture_tags::test_the_same_tag_control_holds,
      test_goal_baseline_is_a_card::...cannot_be_re_opened, three
      test_source_citations spec_manifest parametrisations, and
      test_ticket_retirement::...matching_close_receipts). TWO ARE NEWLY FAILING
      AND ARE THIS TICKET'S: test_instrument_demonstrations::test_every_declared_path_exists
      and ::test_every_fast_demonstration_reproduces, both because
      examples/validation/instruments/instruments.toml still declares rows and
      demonstrations for the deleted scripts/run_kill_test.py. That file is
      outside this ticket's conflict keys and implementation scope; filed as
      CA-04-DF-04 and deliberately not repaired.
      THE CLAIM THIS `pass` MAKES, AND ITS LIMIT: no RETAINED behavior regressed
      -- both new failures are bookkeeping ABOUT the deliberately removed
      capability, in a registry this ticket may not edit. THIS IS NOT the
      standard the closest precedent set: the 2026-08-04 scanner removal recorded
      `green` on "no test newly failing, verified test-by-test", and CA-04 cannot
      say that. The difference is disclosed here rather than absorbed, and the
      verdict is a judgement the reviewer may overturn.
  descriptor_comparison:
    status: "recorded"
    evidence: >-
      specs/results/scorecards/cut-the-apparatus/CA-04/descriptor-comparison.md
      -- before/after static descriptor, both TLC runs, and the two things the
      comparison surfaced that nothing else had: (1) reachable states fell by
      4.52x against a declared bound that fell by exactly 4x, because RunKillTest
      left as a TRANSITION as well as kill_test leaving as a state component
      (depth 25 -> 24); (2) `comparable_to_cap` went False -> None, so the model
      did not become compliant, it became UNMEASURABLE against the cap -- which
      corrected a claim this ticket had already written down the flattering way.

# Fuzzing-era retention members -- RECORDED at every close, non-gating since
# CD-09. Demoted to EXPERIMENTAL by the 2026-07-21 pivot (MF-038: kill 0.31 vs
# floor 0.8, 0/9 content bugs caught). `not_run` is the honest value; fill in a
# measured verdict only when one of them actually ran.
#
#   kill_rate:           pass | below_floor | incomplete_catalog | not_run   (MF-016)
#   effect_conformance:  clean | gaps | dead_surface | unobservable | not_run (MF-013/MF-027)
#   external_coverage:   pass | gaps | incomplete | not_run                  (MF-015)
#
# NOTE: `unobservable` IS NOT `clean`. MF-027 made the effect oracle refuse
# targets it cannot see; the record keeps that distinction even though the
# member no longer gates.
retention:
  kill_rate:
    status: "not_run"
    evidence: ""
  effect_conformance:
    status: "not_run"
    evidence: ""
  external_coverage:
    status: "not_run"
    evidence: ""

# Coverage audit -- MF-026. The completeness REVIEW, distinct from the three
# retention members above, which are all FIDELITY measures bounded to what is
# already modeled. Unmodeled surface is invisible to every one of them, and this
# is the only sweep that looks at it.
#
#   status: pass | fail | incomplete | not_run
#
# RECORDED, NEVER REFUSING (2026-08-04, owner direction). It was a hard gate at
# workflow close with no override; it is now an optional agent-run review whose
# verdict is written down and read by a person. `incomplete` IS STILL NOT
# `pass`, because a sweep that did not walk the surface says nothing about it --
# what was withdrawn is the refusal, not the distinction.
#
# Procedure: prompts/coverage_audit.md   Doctrine: references/coverage_audit.md
coverage_audit:
  status: "not_run"
  report: ""          # path to the filled templates/coverage_audit_report.md
  in_scope_gaps: null # count; in-scope gaps are HARD -- model it or change the program
  scope_source: ""    # plan file:lines the declared scope was READ from, never chosen

# Required if complexity INCREASED. Name the new essential behavior the added
# representation carries. This documents real behavior; it does not waive the
# increase, which is recorded and reported either way.
justification: ""

# The recursive refinement loop -- REQUIRED at every close.
# Either an approved recommendation with evidence, or "searched, found none".
# Recommendations are advisory and user-approved, never auto-applied.
refinement:
  searched: true
  outcome: "found"
  detail: >-
    SEARCHED AND FOUND, NOT APPLIED. `analyze complexity` on the post-change
    model reports three god-state rows and a near-zero modularity: lastCommand
    touched by 15/16 actions, result 15/16, setup_phase 13/16, spec_root 11/16,
    graph modularity Q = 0.002 over the variable interaction graph, with the
    partition falling into C1 (complexity_gate, lastCommand, result, setup_phase,
    spec_root, ticket_state -- 6 variables, 15 actions) and C2 (corpus_gate,
    effect_conformance -- 2 variables, 3 actions). lastCommand and result are
    also the two variables with NO resolvable domain, so they are simultaneously
    the densest rows and the reason every bound this repository has ever recorded
    is a product over a subset rather than the model.
    THE REFINEMENT THAT IS AVAILABLE: lastCommand and result are presentation --
    the CLI's last command string and its structured result -- read by no guard.
    Giving them declared domains, or lifting them out of the state entirely,
    would make the bound COMPLETE for the first time and would make
    `comparable_to_cap` return an actual verdict instead of None. That is the
    move that would repair what section 4 of the descriptor comparison records
    as this ticket's one worsened measurement.
    NOT APPLIED, and not by oversight: it is a model redesign, this ticket's
    objective says in terms "THIS TICKET IS A CUT, NOT A REDESIGN", and
    recommendations here are advisory and user-approved rather than
    auto-applied. Recorded so the next model-changing ticket inherits the search
    rather than repeating it.
  measured: true       # the figures above come from the real TLC runs recorded in validated_refactor
  applied: false       # if true, approved_by is required
  approved_by: ""

# Required only if a generated-states drop at constant distinct states is
# detected. That is a RED FLAG (deleted self-loop, MF-020), not a win -- record
# the inspected transition-level diff here to accept it.
transition_diff: ""

# REQUIRED. The narrative ledger: reasoning, measured alternatives, findings the
# machine-checked core above cannot express. Path to a document, or prose.
narrative: >-
  FULL RECORD: specs/results/scorecards/cut-the-apparatus/CA-04/PRICE-TABLE.md
  (the cut, its price, what the model can no longer express, and what was
  rejected) and .../descriptor-comparison.md (the before/after basis).

  WHAT THIS CLOSE IS. CA-04 removed oracle 4, the mutation kill test, and with it
  the last hard static gate in this repository. The finding is RM-03-DF-05, which
  identified this exact cut, declined it because it was a model delta its own
  ticket forbade, and whose suggested_fix asked for "its own ticket against the
  CLI model". Removed: the kill_test variable, the RunKillTest action and the
  KillTestVerdictRequiresBudgets invariant; RunKillTestAdapter and its binding;
  kill_rate_floor, the mutation_write port and RunKillTest's port row; three
  kill_mutants.toml catalogues; three spec-unit adapter tests;
  scripts/run_kill_test.py; tests/test_kill_test.py; and the `run kill-test`
  subcommand. scripts/ -1,105 lines. The card is untouched at 6,281 bytes.

  THE DECREASE IS LICENSED, AND IT WAS NOT LICENSED WHEN THIS CLOSE WAS FIRST
  ATTEMPTED. The first attempt was REFUSED by this ledger -- "complexity
  decreased but the validated-refactor basis is UNVERIFIED ... absent evidence is
  not passing evidence" -- because CA-04 had run no TLC on either side. That
  refusal was correct and is kept at .../close-refusal.txt. The basis above was
  then measured rather than argued around: TLC green on both models, the
  before-model reconstructed from the branch point and verified by sha AND by
  reproducing the 563,963-state figure the repository had already recorded for
  it.

  WHAT THE MODEL CAN NO LONGER EXPRESS, which is the price and is not softened:
  nothing validates the representation against the PROGRAM. The model's own
  comment said kill_test was "the only one of the four [oracles] that validates
  the representation against the PROGRAM rather than against itself ... none of
  them can tell a faithful model from a vacuous one. This can." The cost caps
  have lost their matching value floor; coverage can drift behind the model
  silently; and compare_reports, the mechanism separating a legitimate
  simplification from a disguised deletion, is gone -- in a cutting epic. A green
  tlc_after is therefore WEAKER evidence here than for an ordinary refactor: it
  certifies the remaining model's self-consistency, which is precisely the
  property the kill test existed because TLC could not check.

  THE MEASUREMENT THAT GOT WORSE, recorded because the flattering version was
  already written down and had to be withdrawn: the declared bound fell
  1,111,320 -> 277,830, and an earlier draft of the price table called that "now
  under the declared max_state_space_bound for the first time". It is not.
  `comparable_to_cap` returns None rather than True for an incomplete bound at or
  under the cap, and the scanner's advisory changed from `state_space_bound` to
  `state_space_bound_partial`, "INCOMPLETE and CANNOT be compared". The model did
  not become compliant; it became unmeasurable against the cap. The refinement
  search above names the move that would repair that.

  TWO ORDERED DELETIONS WERE REFUSED, both on the record rather than on taste.
  kill_test.py could not be deleted whole: five in-repo consumers import its
  catalogue parser and suppression scanner, including
  examples/validation/ab/eval/run_controls.py at MODULE SCOPE, which is the
  driver RD-03 used for the model-derived columns whose zero unique kills is a
  load-bearing disproof. Measured by parking the file. The oracle-4 half was cut
  (839 of 1,149 lines) and the 310-line parser/scanner retained; three of those
  five consumers were found by the reviewer, not by me. candidate_note_bar.py was
  not deleted at all: SV-06-DF-04 does not say what four documents say it says,
  "the shortest test asserts nothing imports it" is false (it asserts the card is
  still 6,281 bytes, the only such assertion in the repository), it is the named
  reproduction of the open SV-07-DF-01, and instruments.toml declares it with two
  demonstration nodes. CA-04-DF-01 through -03.

  THE MOST TRANSFERABLE RESULT IS CA-04-DF-06 AND IT GENERALISES BEYOND THIS CUT.
  The epic's REQUIRED loader check greps deleted PATHS, so it is structurally
  blind to deleted INTERFACES -- CLI subcommands, exported symbols, manifest keys
  and TOML sections have no basename to grep for. Every cutting ticket in this
  programme runs a check that cannot see the interfaces it retires, and shipped
  adopter-facing instructions rot with nothing going red. Demonstrated on this
  ticket's own cut: SKILL.md:1167 and :1174 still tell adopters to run
  `tla-spec-dev run kill-test`, which now answers "invalid choice". CA-04-DF-08
  is the same defect from the other end -- the validation matrix handed to all
  eight tickets names `tla-spec-dev run tlc`, and there is no such subcommand.

  AND THE FINDING THIS LEDGER PRODUCED ABOUT ITSELF: CA-04-DF-07. A hard gate
  refused a real promotion, on substance, and it was right. Its decrease clause
  had been DORMANT for the whole epic -- CA-02 and CA-03 both left
  validated_refactor entirely at its template default and closed cleanly, because
  neither changed the model -- and it fired on the first ticket that reached it. Complying with
  it caught two errors in this ticket's own reporting that nothing else had
  asked for. The charter carries "static gates catch nothing -- seven epics, zero
  bugs" among four disproven claims and uses it to forbid adding gates; with
  CA-03-DF-05's record-checks and CA-05's registry tripwire, that sentence is in
  serious trouble. This is not a licence to add a gate, and CA-04 added none -- it
  removed the last hard one.

  Eight findings filed against a declared budget of five, all disposed; the
  overrun is recorded as an overrun. Suite 8 failed / 1466 passed on the merged
  tip: six pre-existing at CA-03's tip and two this ticket's, both declared, both
  outside its scope, none repaired.
