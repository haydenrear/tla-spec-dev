# Complexity ledger input -- MF-019 standing objective.
#
# `close ticket` refuses until this is filled in. That refusal is the mechanism:
# the standing objective is a required close-out step, not a stance.
#
# The delta is computed for you from `analyze complexity` and the TLC report.
# What you supply is the part a tool cannot know: whether behavior was retained,
# what the refinement search found, and why any increase is essential.

# Retention evidence -- the doctrine's three-member constraint set. A complexity
# DECREASE is REJECTED unless all three are retained. Absent or unknown evidence
# does NOT pass: an unmeasured constraint cannot witness retention.
#
#   kill_rate:           pass | below_floor | incomplete_catalog   (MF-016)
#   effect_conformance:  clean | gaps | dead_surface | unobservable (MF-013/MF-027)
#   external_coverage:   pass | gaps | incomplete                  (MF-015)
#
# NOTE: `unobservable` IS NOT `clean`. MF-027 made the effect oracle refuse
# targets it cannot see; treating that as passing here would rebuild the silence.
retention:
  kill_rate:
    status: "TODO"
    evidence: "TODO -- path to the kill-test report"
  effect_conformance:
    status: "TODO"
    evidence: "TODO -- path to the effect-conformance report"
  external_coverage:
    status: "TODO"
    evidence: "TODO -- path to the external coverage report"

# Coverage audit -- MF-026. The completeness gate, distinct from the three
# retention members above, which are all FIDELITY measures bounded to what is
# already modeled. Unmodeled surface is invisible to every one of them.
#
#   status: pass | fail | incomplete | not_run
#
# `not_run` is the CORRECT value at a ticket close: the audit is an end-of-epic
# step, run after the mechanism tickets land and before final integration. It is
# recorded and reported either way so that an epic which skipped it is visible.
# At WORKFLOW close anything but `pass` REFUSES -- and `incomplete` IS NOT
# `pass`, because a sweep that did not walk the surface says nothing about it.
#
# Procedure: prompts/coverage_audit.md   Doctrine: references/coverage_audit.md
coverage_audit:
  status: "not_run"
  report: ""          # path to the filled templates/coverage_audit_report.md
  in_scope_gaps: null # count; in-scope gaps are HARD -- model it or change the program
  scope_source: ""    # plan file:lines the declared scope was READ from, never chosen

# Required if complexity INCREASED. Name the new essential behavior the added
# representation carries. This documents real behavior; it does not waive the
# increase, which is recorded and reported either way.
justification: ""

# The recursive refinement loop -- REQUIRED at every close.
# Either an approved recommendation with evidence, or "searched, found none".
# Recommendations are advisory and user-approved, never auto-applied.
refinement:
  searched: true
  outcome: "none"
  detail: >-
    Zero-delta ticket. CD-02 is a docs-only change (new
    references/complexity_intuition.md plus SKILL.md wiring of the
    "take this complexity descriptor to consider how to refactor complexity
    out of the app" framing). The TLA+ model, configs, manifest, adapters and
    tests are byte-identical to the epic baseline merged by CD-01 (ticket
    current/ == desired/, verified by diff -r), and TLC reports the same
    figures as CD-01: 5,619,356 states generated / 231,621 distinct / depth 25
    (results/tlc_current.txt), 46.3% of the negotiated max_distinct_states
    500000 carried through desired/spec_manifest.yaml with its rationale.
    The refinement search for an architectural reduction found none
    applicable: the ticket's objective is to teach descriptor reading, not to
    change the model. The doc's before/after worked example was produced on
    external scratch models, not on this program's model.
  measured: true       # TLC run produced the figure (231,621 distinct / depth 25)
  applied: false       # no architectural change applied
  approved_by: ""

# Required only if a generated-states drop at constant distinct states is
# detected. That is a RED FLAG (deleted self-loop, MF-020), not a win -- record
# the inspected transition-level diff here to accept it.
transition_diff: ""

# REQUIRED. The narrative ledger: reasoning, measured alternatives, findings the
# machine-checked core above cannot express. Path to a document, or prose.
narrative: >-
  CD-02 writes the complexity intuition: references/complexity_intuition.md,
  a doc an agent reads ALONGSIDE an `analyze complexity` descriptor to decide
  whether and how to refactor. It covers: the "how complex should a program
  be" best practice (complexity proportional to essential behavior; a
  validated refactor that lowers complexity -- TLC/tests green, behavior
  preserved, before/after descriptors compared -- is encouraged as normal
  practice, not an exceptional event); what good and bad descriptor shapes
  look like, section by section of the real output; five worked examples,
  every excerpt verbatim scanner output from real runs (a modular
  two-subsystem model with Q=0.314 and one port-crossing action; a pipeline
  showing Q=0.000 on a clean single-writer design; a god-state model with
  oversized domains, unconstrained variables and a TLC run that did not
  finish in 120s; the validated before/after refactor of that model, bound
  1,654,784 -> 576 with TLC going from timeout to green 36 distinct states;
  and this repository's own program_model descriptor as the mixed real-world
  case, including the deliberate lastCommand/result observability unknowns
  and the max_distinct_states 500000 budget rationale); and a reading order
  for forming a refactor recommendation. Everywhere explicit: intuitions for
  the agent to judge with, never automated moves -- CD-01 removed the
  suggested-move output because it was confidently wrong, and this doc makes
  no automated-suggestion claims on the scanner's behalf. SKILL.md wires the
  refactor-input framing into the shipped-descriptor paragraph, the
  "Complexity Budgets Are Advisory" doctrine, and the References index.
  Retention oracles (kill_rate/effect_conformance/external_coverage) were not
  re-run: the model is byte-identical to the CD-01 baseline, behavior
  retention is witnessed by the identical TLC run, and no complexity decrease
  is claimed that would require them. Per the epic's case_execution_rule the
  fuzzing machinery is experimental and not ticket validation. One
  out-of-scope defect deferred (batch mode): CD-02-DF-01, the misleading
  "no readable spec manifest at does-not-exist" warning path emitted from
  scripts/analyze_complexity.py:1044 when no --manifest is supplied.
