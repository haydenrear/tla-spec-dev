# Complexity ledger input -- MF-019 standing objective.
#
# `close ticket` refuses until this is filled in. That refusal is the mechanism:
# the standing objective is a required close-out step, not a stance.
#
# The delta is computed for you from `analyze complexity` and the TLC report.
# What you supply is the part a tool cannot know: whether behavior was retained,
# what the refinement search found, and why any increase is essential.

# Validated-refactor basis -- CD-09 (owner-approved 2026-07-22). This is what
# LICENSES a complexity DECREASE: TLC green on the model before AND after the
# change, behavior tests green, and the before/after descriptor comparison
# recorded. Absent, unknown, or degraded evidence REJECTS a decrease: an
# unmeasured constraint cannot witness retention. (The fourth obligation, the
# inspected transition-level diff, is `transition_diff:` below and is demanded
# whenever the MF-020 red flag fires.)
#
#   tlc_before:            green | fail        -- TLC on the pre-change model
#   tlc_after:             green | fail        -- TLC on the post-change model
#   behavior_tests:        pass | fail         -- the repository behavior tests
#   descriptor_comparison: recorded            -- before/after descriptor doc
validated_refactor:
  tlc_before:
    status: "green"
    evidence: "specs/.history/complexity-descriptor-main-readiness/ticket-000-CD-04/ticket/results/tlc_current.txt"
  tlc_after:
    status: "green"
    evidence: "specs/tickets/CD-05/results/tlc_current.txt"
  behavior_tests:
    status: "pass"
    evidence: "specs/tickets/CD-05/results/repo_unit_tests.txt"
  descriptor_comparison:
    status: "recorded"
    evidence: "specs/tickets/CD-05/results/descriptor_comparison.md"

# Fuzzing-era retention members -- RECORDED at every close, non-gating since
# CD-09. Demoted to EXPERIMENTAL by the 2026-07-21 pivot (MF-038: kill 0.31 vs
# floor 0.8, 0/9 content bugs caught). `not_run` is the honest value; fill in a
# measured verdict only when one of them actually ran.
#
#   kill_rate:           pass | below_floor | incomplete_catalog | not_run   (MF-016)
#   effect_conformance:  clean | gaps | dead_surface | unobservable | not_run (MF-013/MF-027)
#   external_coverage:   pass | gaps | incomplete | not_run                  (MF-015)
#
# NOTE: `unobservable` IS NOT `clean`. MF-027 made the effect oracle refuse
# targets it cannot see; the record keeps that distinction even though the
# member no longer gates.
retention:
  kill_rate:
    status: "not_run"
    evidence: ""
  effect_conformance:
    status: "not_run"
    evidence: ""
  external_coverage:
    status: "not_run"
    evidence: ""

# Coverage audit -- MF-026. The completeness gate, distinct from the three
# retention members above, which are all FIDELITY measures bounded to what is
# already modeled. Unmodeled surface is invisible to every one of them.
#
#   status: pass | fail | incomplete | not_run
#
# `not_run` is the CORRECT value at a ticket close: the audit is an end-of-epic
# step, run after the mechanism tickets land and before final integration. It is
# recorded and reported either way so that an epic which skipped it is visible.
# At WORKFLOW close anything but `pass` REFUSES -- and `incomplete` IS NOT
# `pass`, because a sweep that did not walk the surface says nothing about it.
#
# Procedure: prompts/coverage_audit.md   Doctrine: references/coverage_audit.md
coverage_audit:
  status: "not_run"
  report: ""          # end-of-epic step; correct value at a ticket close
  in_scope_gaps: null
  scope_source: "specs/desired_program_model/ticket_plan.yaml (CD-05 entry)"

# Required if complexity INCREASED. Name the new essential behavior the added
# representation carries. This documents real behavior; it does not waive the
# increase, which is recorded and reported either way.
justification: ""

# The recursive refinement loop -- REQUIRED at every close.
# Either an approved recommendation with evidence, or "searched, found none".
# Recommendations are advisory and user-approved, never auto-applied.
refinement:
  searched: true
  outcome: "none"
  detail: "searched the delta for refinement opportunities; found none -- CD-05 changes only the MEASUREMENT machinery (scripts/analyze_complexity.py domain resolution), its tests, and the resolver-coverage doc. Zero semantic model delta: ticket model identical to the promoted epic-tip model, TLC distinct-state count unchanged at 283,805. On this repository's own model every previously resolved figure is unchanged (bound 699,840 over the same 7 dimensions); the resolver now additionally resolves the VAL-06/16/17 shapes on models that exhibit them. One adjacent literal-parsing defect was found and DEFERRED (CD-05-DF-01, deferred_findings.yaml) rather than fixed, to keep the ticket at its assigned scope."
  measured: false
  applied: false
  approved_by: ""

# Required only if a generated-states drop at constant distinct states is
# detected. That is a RED FLAG (deleted self-loop, MF-020), not a win -- record
# the inspected transition-level diff here to accept it.
transition_diff: ""

# REQUIRED. The narrative ledger: reasoning, measured alternatives, findings the
# machine-checked core above cannot express. Path to a document, or prose.
narrative: "CD-05 (resolves VAL-06, VAL-16, VAL-17) removes three domain-resolution blind spots the validation agents hit in three of six runs. (1) _set_size now expands zero-parameter operator definitions transitively through the EXTENDS hierarchy with a cycle guard -- the same definition map CD-01/F1 resolve_definition_body walks -- and sizes function sets [S -> T] as |T|^|S| consistently with the dimension inference, so tasks \\in [Names -> TaskStatus] with TaskStatus defined in an EXTENDS-ed module resolves (was UNKNOWN). (2) Constraints are extracted conjunct-wise via resolve_constraint_chunks (split on /\\ and \\/, per definition, transitively; chunks never bleed across definition boundaries), so membership conjuncts wrapped across lines resolve (was silent unknown from an end-of-line regex capture). (3) Domain sources merge PER-VARIABLE in the documented order TypeInvariant > TypeOK > configured cfg invariants, first resolvable wins, replacing first-named-definition-wins -- the scaffold multi-view layout resolves both views without renaming tricks; bound_source names every contributing source and each dimension records its source in text and JSON output. F3 preserved: genuinely unresolvable domains stay explicit UNKNOWN (guard test); the resolver coverage contract is documented in references/architecture_tractability.md (What The Domain Resolver Can And Cannot See), which the scanner output now cites. Three regression tests each proven failing pre-fix by stashing the production change (domain_resolution_regressions.txt). Zero TLA+ model delta; all validation green post-reconcile with epic tip 8df525f (CD-04 merged): TLC 283,805 distinct (budget 500,000 with negotiated rationale carried), spec-unit 2 targets (67+64), 583 repo tests, specWorkflow 8/8 and cliWorkflow 2/2 graphs. Deferred: CD-05-DF-01 (pre-existing _set_size literal/union miscount -- silent wrong number shapes needing a depth-aware tokenizer)."
