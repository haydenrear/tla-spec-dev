    "objective": "Resolves VAL-06, VAL-16, VAL-17 \u2014 three domain-resolution blind spots that real agents hit in three of six validation runs, each currently degrading the bound to UNKNOWN (or a partial product) on standard patterns. (1) VAL-06: _set_size resolves only literals, int ranges, BOOLEAN, unions, and cfg constants; an operator-defined set (TaskStatus == {...} in an EXTENDS-ed module, used as tasks \\in [Names -> TaskStatus]) resolves unknown even though resolve_definition_body has already expanded the operator \u2014 consult it (the same transitive resolution CD-01 built for F1). (2) VAL-16: the `variable \\in <domain>` regex captures to end-of-line, so a membership conjunct wrapped across lines silently resolves unknown \u2014 parse conjunct-wise, not line-wise. (3) VAL-17: domain-source precedence (any TypeInvariant in the EXTENDS hierarchy becomes the sole source, then TypeOK, then cfg invariants) interacts badly with the scaffold's own multi-view layout where TypeInvariant cannot be redefined per view \u2014 merge domain sources (per-variable, first resolvable wins with a documented order) instead of first-named-definition-wins, or document the per-view naming convention and make the resolver honor both names. Regression tests for each, failing pre-fix. Document exactly what the resolver can see.\n",
