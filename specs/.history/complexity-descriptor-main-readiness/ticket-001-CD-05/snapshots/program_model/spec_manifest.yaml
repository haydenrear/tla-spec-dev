# Per-program complexity and case budgets. Scaffolding emits this block with
# the documented defaults from references/modular_fuzzing.md and instructs the
# agent to negotiate the values with the user, recording a one-line rationale
# per changed value. Downstream gates read it through scripts/budgets.py.
budgets:
  tlc_seconds: 120                          # hard external timeout per TLC run
  # NEGOTIATED 2026-07-19 (owner decision), raised from the documented default
  # 50000. Derived, not chosen to fit: TLC completes this model in 2s at ~19,120
  # distinct/sec, so ~2,294,400 are reachable inside the 120s tlc_seconds budget
  # -- halved to ~1,147,200 for throughput decay as the model grows. The epic's
  # remaining worst case (two further 3x gates on 38,241) is ~344,169. 500000
  # sits 1.5x above that trajectory and 4.6x under the measured ceiling, running
  # in ~26s. The 50000 default was MF-012's generic value, never calibrated to
  # this program, and the real constraint (TLC wall time) is nowhere near
  # binding. REVISIT AT MF-023: decomposition gives each component its own much
  # smaller state space, and this should drop back toward the default then.
  max_distinct_states: 500000               # reachable states TLC may find, per component model
  max_state_space_bound: 1000000            # static declared-representation ceiling; see modular_fuzzing.md
  max_internal_cases_per_component: 200     # spec-unit case cap per component
  max_external_cases_per_action: 50         # Test Graph case cap per external action
  kill_rate_floor: 0.8                      # minimum mutation kill rate
  max_component_variables: 6                # component-size heuristic
  max_component_actions: 8                  # component-size heuristic
  max_symmetric_instances: 2                # component-size heuristic
  source: defaults
  rationale: {}

source_model:
  program_model_manifest: ../program_model/spec_manifest.yaml
  # CD-10 (DF-3): Core.tla / Internal.tla / External.tla references REMOVED --
  # the files do not exist. MF-023 (concluded epic) measured modularity
  # Q=0.012, found no clean cut, and deliberately did NOT decompose; the
  # baseline is a single TlaSpecDevCli.tla module and the view split is
  # unscoped future work (ticket_plan.yaml known_gaps, amended 2026-07-22).
  # A source_model reference must resolve to a file that exists.
  desired_ticket_plan: ../desired_program_model/ticket_plan.yaml

case_codegen:
  style: explicit_transition_cases
  generation_status: planned

# CD-11 (audit run 4, ESC-R4-2): these three stanzas are GENERATED-CONTENT
# PLACEHOLDERS owned by case codegen. They are scaffolded empty by
# scripts/new_ticket_workflow.py and are filled only when
# case_codegen.generation_status (above) reaches `generated`. Empty here
# claims "no generated case index yet" -- generation_status is `planned` --
# NOT "the model has no state, actions, or ports": the model's 9 variables
# and 15 actions live in TlaSpecDevCli.tla, and its declared effect ports
# live in effects.components below. An empty stanza and an inapplicable
# stanza are different claims; this comment, and the matching one at the
# schema source (scripts/new_ticket_workflow.py), record which one is made.
state_fields: []
actions: []
ports: {}

# MF-013: EFFECT DECLARATION SCHEMA.
#
# Components declare typed emissions on named ports; each action names the
# ports it may emit on. `tla-spec-dev run effect-conformance`, and every
# `run spec-unit-tests` batch, executes adapters in a sandbox that records what
# actually crossed a boundary and diffs it against these declarations.
#
# Two findings, both HARD FAILURES:
#   - an observed effect matching no port declared for its action is a GAP;
#   - a declared port no case ever exercises is DEAD MODEL SURFACE.
#
# NOTHING SUPPRESSES A GAP REPORT. There is deliberately no justification,
# waiver, or allow-list key in this schema. Out-of-contract justifications were
# WITHDRAWN on 2026-07-18 (references/architecture_tractability.md, "No
# Degenerate Escapes", rules 3 and 4). Adding such a key here does not work:
# scripts/effect_conformance.py scans for suppression-shaped keys and reports
# them as IGNORED rather than honoring them, and
# tests/test_effect_conformance.py asserts the verdict is identical with and
# without one. Declare the port, or change the program so it stops emitting the
# effect. There is no third option.
#
# `type` must be one of the sandbox-observable types (filesystem.write,
# filesystem.delete, process.spawn, network.connect, network.http): a port
# whose type cannot be observed can never be checked. `target` is a glob over
# the resolved path or command line. Both are required -- a port that omits
# either is rejected, not defaulted.
effects:
  components:
    TlaSpecDevCliPort:
      ports:
        spec_tree:
          type: filesystem.write
          target: "**/specs/**"
        evidence_report:
          type: filesystem.write
          target: "**/results/**"
        cli_artifact:
          type: filesystem.write
          target: "**/.venv/**"
        # CD-09 (coverage-audit run 2, gap G4): tlc_process (process.spawn
        # *java*) REMOVED. It was declared for AnalyzeComplexity, but the
        # analyze path spawns nothing -- the descriptor scan is a static
        # parser (scripts/analyze_complexity.py contains no subprocess), and
        # no other modeled action spawns java. By this manifest's own rule a
        # declared port no case exercises is DEAD MODEL SURFACE. The
        # repository's real java spawn lives in case generation
        # (generate_cases_from_tlc_dump.py), which is EXPERIMENTAL surface,
        # deliberately unmodeled post-pivot (G3, resolved by the 2026-07-22
        # scope amendment).
        test_process:
          type: process.spawn
          target: "*pytest*"
        # CD-10 (audit run 3, gap R3-3a): RunSpecUnitTests' shipped dispatch
        # spawns the generated-case runner (`python
        # scripts/run_generated_case_adapters.py ...`, tla_spec_dev.py:313-339
        # executed at :358) whenever a target carries a generated case package.
        # That command line does not match test_process's `*pytest*` -- only
        # the `uv run --with pytest -m pytest` child (:296-303) does -- so the
        # runner spawn gets its own port rather than a widened, dishonest
        # test_process target.
        runner_process:
          type: process.spawn
          target: "*run_generated_case_adapters*"
        # CD-10 (audit run 3, gap R3-2): CloseTicket's shipped close path
        # performs destructive deletes, all under the spec tree: rmtree of TLC
        # `states/` dirs (spec_evolution.py:154 via :707 ticket close / :851
        # workflow close), rmtree of project `current/` before promotion
        # (:385 via replace_tree, the GitHub #22 data-loss mechanism), and
        # unlink of seeded paths the ticket dropped (:477). filesystem.write
        # on spec_tree never covered these -- the schema distinguishes
        # filesystem.delete precisely so a delete cannot hide under a write.
        spec_tree_delete:
          type: filesystem.delete
          target: "**/specs/**"
        # CD-10 (audit run 3, gap R3-3b): CloseTicket spawns `git rev-parse
        # ...` for history-entry provenance (spec_evolution.py:99 via
        # git_metadata at :801 ticket close / :903 workflow close). The
        # fail-open branch on git error is out-of-model; the spawn itself is
        # not, so it is declared.
        git_metadata:
          type: process.spawn
          target: "git rev-parse*"
        # CD-11 (audit run 4, gap R4-1): RunKillTest's shipped path seeds
        # each catalog mutant INTO the production source tree and restores it
        # (kill_test.py:548 write of the mutated copy, :551 finally-branch
        # restore, driven per mutant by run_kill_test.py:130). The targets
        # are the catalog's `path` keys -- scripts/*.py and
        # skill-scripts/install-tla-spec-dev.sh -- which no other declared
        # write port covers (spec_tree is **/specs/**, evidence_report
        # **/results/**, cli_artifact **/.venv/**). An interrupted run leaves
        # a mutated working tree; the schema distinguishes exactly this write
        # so it cannot hide. DECLARED rather than moved to a copied tree: the
        # finally-branch restore is the shipped defense, and the port makes
        # the danger visible instead of relocating it. The glob covers both
        # catalog trees (fnmatch `*` crosses separators, so it matches
        # scripts/ and skill-scripts/).
        mutation_write:
          type: filesystem.write
          target: "*scripts/*"
        # CD-11 (audit run 4, gap R4-1, spawn member): the per-mutant corpus
        # run (kill_test.py:609 via run_kill_test.py:198) spawns the
        # user-supplied --corpus-command once per mutant plus the control
        # run. The command is unconstrained user input, so any glob narrower
        # than `*` would assert a constraint the code does not enforce -- the
        # documented pytest-shaped corpus command is one possible value, not
        # a contract. This port replaces test_process on RunKillTest's row:
        # the kill test's only spawn is the corpus command itself.
        corpus_process:
          type: process.spawn
          target: "*"
  actions:
    BuildSkillCli: [cli_artifact]
    InstallLocalCli: [cli_artifact]
    ScaffoldProject: [spec_tree]
    # CD-10 (DF-2/ESC-4): deliberately an EMPTY row, not an absent one -- an
    # absent row claims "unmapped", an empty row claims "performs no distinct
    # effect", and only the second is true. The CLI records no budgets:
    # budget_prompt only prints negotiation instructions (budgets.py:74-94,
    # printed at tla_spec_dev.py:91/:118); the budgets: block itself is
    # emitted at scaffold time under ScaffoldProject/ScaffoldWorkflow's
    # spec_tree, and recording user-negotiated values is an agent edit, not a
    # program effect.
    RecordBudgets: []
    ScaffoldWorkflow: [spec_tree]
    OpenTicket: [spec_tree]
    UpdateTicketDesired: [spec_tree]
    UpdateTicketCurrent: [spec_tree]
    AnalyzeComplexity: [evidence_report]
    # CD-11 (audit run 4, gap R4-3): evidence_report REMOVED -- a dead
    # declared port, the same class G4 removed for AnalyzeComplexity's
    # tlc_process. corpus_diagnostics.py has no --out flag (add_arguments
    # :835-852 registers cases_dir/--view/--manifest only) and no file write
    # anywhere; run() (:902-935) prints the report and returns. Removal
    # matches the shipped print-only behavior. Deliberately an EMPTY row, not
    # an absent one (the RecordBudgets rule above): the command reads and
    # prints, performing no distinct declared effect.
    AnalyzeCorpus: []
    # CD-11 (audit run 4, gap R4-2): spec_tree ADDED, matching shipped
    # behavior. `run effect-conformance --cases-dir` creates its work tree
    # under the spec dir (effect_conformance_report.py:149, default
    # spec_dir/.effect-conformance-work; :163 per-case dirs;
    # effect_conformance.py:619/:656 sandbox roots) -- writes landing under
    # **/specs/**. DECLARED rather than relocated under results/: the same
    # physical sandbox writes on the spec-unit path are already declared as
    # spec_tree on RunSpecUnitTests (manifest row below), the work tree is
    # spec-scoped working state rather than evidence, and relocating would
    # change a shipped default to fit a declaration -- the dishonesty lived
    # in the manifest, so the manifest is what changed.
    RunEffectConformance: [evidence_report, spec_tree]
    # CD-11 (audit run 4, gap R4-1): mutation_write + corpus_process ADDED,
    # test_process REMOVED from this row (it stays declared, and exercised,
    # via RunSpecUnitTests). The kill test's spawn is the user-supplied
    # corpus command (corpus_process), of which the pytest-shaped default is
    # one value; its writes are the mutation seed/restore into production
    # source (mutation_write) and the JSON evidence report (evidence_report).
    RunKillTest: [evidence_report, mutation_write, corpus_process]
    RunSpecUnitTests: [test_process, runner_process, spec_tree]
    CloseTicket: [spec_tree, spec_tree_delete, git_metadata]

adapters: case_adapters.toml
notes:
  package_from_program_model: tlaspecdevcli_program_cases
  budgets_helper: scripts/budgets.py

# MF-011: per-variable justification table. Every element of the model earns
# its place by supporting an invariant, carrying an effect, or killing a
# mutant (references/architecture_tractability.md, "Grow The Model By
# Evidence, Not By Transcription"). `tla-spec-dev analyze complexity` reads
# this table and flags any variable with no linkage as dead weight.
justification:
  setup_phase:
    invariants: [TypeInvariant, CliInstalledRequiresBuilt, WorkflowRequiresProject, BudgetsRequireProject, WorkflowRequiresBudgets, ProjectChoosesKnownSpecRoot]
    effects: []
    kill_tests: [inv-BudgetsRequireProject, inv-CliInstalledRequiresBuilt, inv-WorkflowRequiresBudgets, inv-WorkflowRequiresProject, port-cli_artifact]
  spec_root:
    invariants: [ProjectChoosesKnownSpecRoot, TypeInvariant]
    effects: []
    kill_tests: [inv-ProjectChoosesKnownSpecRoot, port-spec_tree]
  # MF-025: active_tickets, ticket_phase and closed_tickets collapsed into the
  # single ticket_state ordinal. It inherits the union of their invariant
  # linkages -- every named property they justified is still checked.
  ticket_state:
    invariants: [TypeInvariant, NoOpenClosedOverlap, CurrentRequiresDesired, SpecUnitTestsRequireCurrent, SpecUnitTestsRequireMeasuredCorpus, ClosedTicketsPassedSpecUnitTests]
    effects: []
    kill_tests: [inv-ClosedTicketsPassedSpecUnitTests, inv-CurrentRequiresDesired, inv-NoOpenClosedOverlap, inv-SpecUnitTestsRequireCurrent, port-test_process]
  # CD-09 (G2): complexity_gate is the recorded ADVISORY verdict -- an
  # observable fact AnalyzeComplexity writes into its evidence report, read by
  # no guard. SpecUnitTestsRequireAnalyzedGate and the blocking guard it
  # depended on were removed with the withdrawn gate, and port-tlc_process /
  # inv-SpecUnitTestsRequireAnalyzedGate left the mutant catalog with them.
  complexity_gate:
    invariants: [TypeInvariant]
    effects: []
    kill_tests: []
  corpus_gate:
    invariants: [TypeInvariant, SpecUnitTestsRequireMeasuredCorpus]
    effects: [CliWorkflowResult.analyze_corpus_verdict]
    kill_tests: [inv-SpecUnitTestsRequireMeasuredCorpus]
  lastCommand:
    invariants: []
    effects: [CliWorkflowResult.last_command]
    kill_tests: []
  result:
    invariants: []
    effects: [CliWorkflowResult]
    kill_tests: [inv-TypeInvariant]
  effect_conformance:
    invariants: [TypeInvariant, SpecUnitTestsRequireMeasuredEffects]
    effects: [CliWorkflowResult.effect_conformance_verdict]
    kill_tests: [inv-SpecUnitTestsRequireMeasuredEffects, port-evidence_report]
  # MF-016: kill_test is justified by its own invariant AND by the mutant that
  # attacks the floor it gates against -- the oracle is subject to the oracle.
  kill_test:
    invariants: [TypeInvariant, KillTestVerdictRequiresBudgets]
    effects: [CliWorkflowResult.kill_test_verdict]
    kill_tests: [inv-KillTestVerdictRequiresBudgets]
