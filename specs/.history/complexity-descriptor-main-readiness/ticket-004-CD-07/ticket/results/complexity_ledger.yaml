# Complexity ledger input -- MF-019 standing objective.
#
# `close ticket` refuses until this is filled in. That refusal is the mechanism:
# the standing objective is a required close-out step, not a stance.
#
# The delta is computed for you from `analyze complexity` and the TLC report.
# What you supply is the part a tool cannot know: whether behavior was retained,
# what the refinement search found, and why any increase is essential.

# Validated-refactor basis -- CD-09 (owner-approved 2026-07-22). This is what
# LICENSES a complexity DECREASE: TLC green on the model before AND after the
# change, behavior tests green, and the before/after descriptor comparison
# recorded. Absent, unknown, or degraded evidence REJECTS a decrease: an
# unmeasured constraint cannot witness retention. (The fourth obligation, the
# inspected transition-level diff, is `transition_diff:` below and is demanded
# whenever the MF-020 red flag fires.)
#
#   tlc_before:            green | fail        -- TLC on the pre-change model
#   tlc_after:             green | fail        -- TLC on the post-change model
#   behavior_tests:        pass | fail         -- the repository behavior tests
#   descriptor_comparison: recorded            -- before/after descriptor doc
validated_refactor:
  tlc_before:
    status: "green"
    evidence: "specs/.history/complexity-descriptor-main-readiness/ticket-003-CD-06/ticket/results/tlc_current.txt"
  tlc_after:
    status: "green"
    evidence: "specs/tickets/CD-07/results/tlc_current.txt"
  behavior_tests:
    status: "pass"
    evidence: "specs/tickets/CD-07/results/repo_unit_tests.txt"
  descriptor_comparison:
    status: "recorded"
    evidence: "specs/tickets/CD-07/results/own_model_descriptor_delta.txt"

# Fuzzing-era retention members -- RECORDED at every close, non-gating since
# CD-09. Demoted to EXPERIMENTAL by the 2026-07-21 pivot (MF-038: kill 0.31 vs
# floor 0.8, 0/9 content bugs caught). `not_run` is the honest value; fill in a
# measured verdict only when one of them actually ran.
#
#   kill_rate:           pass | below_floor | incomplete_catalog | not_run   (MF-016)
#   effect_conformance:  clean | gaps | dead_surface | unobservable | not_run (MF-013/MF-027)
#   external_coverage:   pass | gaps | incomplete | not_run                  (MF-015)
#
# NOTE: `unobservable` IS NOT `clean`. MF-027 made the effect oracle refuse
# targets it cannot see; the record keeps that distinction even though the
# member no longer gates.
retention:
  kill_rate:
    status: "not_run"
    evidence: ""
  effect_conformance:
    status: "not_run"
    evidence: ""
  external_coverage:
    status: "not_run"
    evidence: ""

# Coverage audit -- MF-026. The completeness gate, distinct from the three
# retention members above, which are all FIDELITY measures bounded to what is
# already modeled. Unmodeled surface is invisible to every one of them.
#
#   status: pass | fail | incomplete | not_run
#
# `not_run` is the CORRECT value at a ticket close: the audit is an end-of-epic
# step, run after the mechanism tickets land and before final integration. It is
# recorded and reported either way so that an epic which skipped it is visible.
# At WORKFLOW close anything but `pass` REFUSES -- and `incomplete` IS NOT
# `pass`, because a sweep that did not walk the surface says nothing about it.
#
# Procedure: prompts/coverage_audit.md   Doctrine: references/coverage_audit.md
coverage_audit:
  status: "not_run"
  report: ""          # path to the filled templates/coverage_audit_report.md
  in_scope_gaps: null # count; in-scope gaps are HARD -- model it or change the program
  scope_source: ""    # plan file:lines the declared scope was READ from, never chosen

# Required if complexity INCREASED. Name the new essential behavior the added
# representation carries. This documents real behavior; it does not waive the
# increase, which is recorded and reported either way.
justification: ""

# The recursive refinement loop -- REQUIRED at every close.
# Either an approved recommendation with evidence, or "searched, found none".
# Recommendations are advisory and user-approved, never auto-applied.
refinement:
  searched: true
  outcome: "none"
  detail: "Zero semantic model delta -- CD-07 changes only advisory wording, warning routing, a scratch-dir location, tests, and docs (scripts/budgets.py, new_ticket_workflow.py, onboard_program_model.py, fitness_functions.py, analyze_complexity.py warning path, run_tlc.sh, three references, SKILL.md). The repository model is byte-identical before and after: identical TLC counts (283,805 distinct, depth 25) and a byte-identical descriptor modulo absolute input paths (own_model_descriptor_delta.txt). Searched the unchanged descriptor for refinement opportunities anyway: the known dense rows (lastCommand/result 14/15, setup_phase 12/15, spec_root 10/15) and the C1 component-actions warning are unchanged from CD-06's close; lastCommand/result now pass the write-only-state test this ticket added to the intuition doc (the spec-double layer consumes them), so no new collapse candidate appears."
  measured: false      # true only if a real TLC run produced the figure
  applied: false       # if true, approved_by is required
  approved_by: ""

# Required only if a generated-states drop at constant distinct states is
# detected. That is a RED FLAG (deleted self-loop, MF-020), not a win -- record
# the inspected transition-level diff here to accept it.
transition_diff: ""

# REQUIRED. The narrative ledger: reasoning, measured alternatives, findings the
# machine-checked core above cannot express. Path to a document, or prose.
narrative: "CD-07 aligns every remaining user-facing surface with the advisory doctrine and fixes the UX defects the six validation runs catalogued, with zero TLA+ model delta. VAL-04: the scaffold epilog (budgets.budget_prompt) and every generated-manifest budgets comment (new_ticket_workflow.py both manifests, onboard_program_model.py -- the latter found by this ticket's sweep beyond the finding's named sites) now state that budgets are advisory thresholds that warn and never block, with tlc_seconds named as the one hard operational limit; a grep-evidenced sweep (advisory_language_sweep.md) shows zero gate-era budget language in scaffold output and classifies every remaining 'hard gate' occurrence as by-design non-budget (corpus caps, MF-015 channels, experimental kill floor), superseded historical narrative, or immutable record. VAL-01: fitness_functions.load_rules detects PyYAML absence before validating a manifest-embedded rules block and emits the documented advisory CONFIG ERROR naming PyYAML and the fitness_functions.json alternative (verified against the real CLI under this machine's yaml-less python3, exit 0; regression test simulates absence via sys.modules). VAL-02: kill_rate_floor and max_symmetric_instances are excluded from the missing-budgets warning (EXPERIMENTAL_BUDGET_KEYS) while keeping documented defaults so kill_test stays functional; a per-docs manifest scans with empty stderr. CD-02-DF-01: analyze() no longer feeds a Path('does-not-exist') sentinel to load_budgets -- the no-manifest warning states what happened. VAL-05: the justification-table schema (mapping per variable, non-empty invariants/effects/kill_tests lists, prose is not linkage) is documented in architecture_tractability.md and as a comment in every scaffolded manifest. VAL-03: run_tlc.sh points TLC -metadir at a mktemp dir removed by an EXIT trap; the ticket TLC run leaves no states/ residue. VAL-15: complexity_intuition.md gains 'The write-only-state test' -- a write-only stamped variable is bookkeeping unless a nameable dependent (guard, invariant beyond type, test, or reader) exists; stated design intent is not a reader -- worked from the recorded ex3-run1 vs ex3-run2 divergence, blessing run 1's classification as canonical while separating classification from production-refactor authorization. CD-06-DF-01 (inherited): action_count fact description corrected in FACT_DOCS and the reference catalog. Validation: TLC green (283,805 distinct within max_distinct_states 500,000, rationale carried through desired/), spec-unit 2 targets green, 601 repo tests, specWorkflow and cliWorkflow green."
