    "objective": "Add the smallest fail-closed runtime that maps a generated case's action to typed semantic effect ports and binds project-owned providers around that case. Reuse manifest `ports` as generated Protocol contracts, mark semantic effect ports explicitly, declare action requirements in actions.yml (`effect_ports`), and map each required port in case_adapters.toml (`[effect_providers.<Port>] provider = \"module:object\"`). Keep the inherited passive `effects:` observation schema separate: it detects escaped writes/process/network activity and is not a provider-response API. Introduce a provider context/binding contract and expose bound values through AdapterCaseContext.effects. Enter providers in declaration order before adapter setup; run setup/run/assert/teardown while bindings are live; exit providers in reverse order even on failure. Unknown ports, missing providers, duplicate bindings, invalid types, and provider-bearing unsupported execution modes fail before application execution. No-effect legacy batches remain compatible. V0 supports Python batch execution only.\n",
