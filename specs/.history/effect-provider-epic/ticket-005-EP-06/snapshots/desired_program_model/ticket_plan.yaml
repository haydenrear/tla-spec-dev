  - id: MF-027
    title: "Effect oracle must refuse targets it cannot observe"
    status: done
    github_issue: "https://github.com/haydenrear/tla-spec-dev/issues/43"
    schedule_revision: 1
    depends_on: [MF-013]
    blocks: []
    wave: 5
    promotion_order: 45
    promotion_predecessor: MF-013
    conflict_keys:
      production: [scripts/effect_conformance.py, scripts/effect_conformance_report.py, references/modular_fuzzing.md]
      tla: []
      adapters: []
      test_graph: []
      workflow: []
    objective: "Amendment to MF-013, which shipped correct behavior with a SILENT boundary. EffectSandbox observes by monkeypatching the in-process Python runtime (builtins.open, os mutators, subprocess.run/Popen, socket.connect), so a Java or Kotlin adapter in a separate JVM is entirely invisible -- not hypothetical, since the Test Graph SDK ships Java and JVM nodes are first-class -- and a spawned subprocess is recorded as a spawn while everything it does is unobserved. Neither case reports a problem; the oracle returns GREEN. A clean report on an unobservable target is indistinguishable from a real one, which is the defect class this epic purged five times (corpus filtering, gap suppression, a self-disabling justification check, a budgets fallback hiding a broken parser, an override making a hard gate advisory). The problem is NOT that the oracle is Python-only -- that is useful and honest if declared -- it is that it does not declare it. Fix: the sandbox determines observability and FAILS with target-not-observable rather than returning clean; a subprocess spawn becomes an explicit unobservable-boundary finding; and the External/test-graph gap (exported cases run in JBang/uv nodes with no effect checking at all) is documented with a follow-up, since observing a JVM target needs a different mechanism behind the same port schema and is a second implementation rather than an extension. Scrapping the oracle was considered and rejected -- effect conformance is one of exactly three members of the doctrine constraint set and is the only one that catches boundaries never modeled at all. See tickets/027-effect-oracle-refuses-unobservable-targets.md."
    desired_actions: []
    implementation_scope:
      - scripts/effect_conformance.py (observability determination and refusal)
      - scripts/effect_conformance_report.py (unobservable verdict)
      - references/modular_fuzzing.md and SKILL.md (declared observable scope)
    current_increment:
      model_state: []
      model_actions: []
      adapters:
        - adapter proving an unobservable target fails rather than reporting clean
      unit_tests:
        - uv run --with pytest -m pytest tests -q
        - uv run --with pytest -m pytest specs/tickets/MF-027/current/tests -q
      graph_after_unit_pass:
        - specWorkflow
        - cliWorkflow
    acceptance:
      commands:
        - python3 scripts/tla_spec_dev.py --spec-root specs run spec-unit-tests --ticket MF-027
      assertions:
        - an adapter not observable in-process produces a FAILING verdict naming why, never a clean report; proven by a test running a deliberately unobservable target.
        - a subprocess spawn produces an explicit unobservable-boundary finding naming the process, not silence; proven by a test.
        - no configuration, flag, annotation or manifest entry can downgrade an unobservable-target verdict to a pass; the inverse is proven, as MF-013 did for gap suppression.
        - the External/test-graph gap is documented in references/modular_fuzzing.md with a filed follow-up issue for JVM-capable observation.
        - SKILL.md states the oracle observable scope plainly, so a user onboarding a JVM project learns it from documentation rather than from a false green.
      evidence:
        - specs/tickets/MF-027/results/observability-refusal.md
        - specs/tickets/MF-027/results/complexity-delta.md
        - specs/tickets/MF-027/results/deferred-to-mf023.md
        - specs/tickets/MF-027/results/budget-retention.md
        - specs/tickets/MF-027/results/tlc.txt
        - specs/tickets/MF-027/results/analyze-complexity.txt
        - specs/tickets/MF-027/results/spec-unit-tests.txt
        - specs/tickets/MF-027/results/repository-unit-tests.txt
        - specs/tickets/MF-027/results/graph-reports/
      results:
        - "SHIPPED: observability is determined by assess_target_observability() in scripts/effect_conformance.py and granted ONLY on positive evidence -- the adapter was resolved to a live Python object and called in-process. A declared non-Python runtime, a kind/channel/reference naming an out-of-process runtime, an unresolvable target, or a non-Python reference shape all REFUSE. An unrecognised runtime refuses rather than defaulting to observable; that polarity is what made the original defect silent. Both runners (run_generated_case_adapters.py, the enforcing copy, and effect_conformance_report.py, the standalone command) call EffectSandbox.require_observable BEFORE executing an adapter, so refusal is recorded at the sandbox rather than decided at the call site."
        - "THE REFUSAL IS STRUCTURAL: VERDICT_UNOBSERVABLE is added to the SAME conjunction as gaps and dead_surface in EffectConformanceReport.ok -- not beside it -- so there is no second code path to relax, and it is tested FIRST in .verdict because a diff computed over an unseen target carries no information. Reporting it as clean, or even as gaps, would assert something the run has no evidence for."
        - "THE DELIVERABLE'S PROOF: TestUnobservableTargetFails::test_jvm_target_fails_rather_than_reporting_clean uses a fixture whose observed effect MATCHES its declared port -- under MF-013 that exact input produced verdict=clean, ok=True. It now produces verdict=unobservable, ok=False with gaps==[] and dead_surface==[]. That is the false green, removed."
        - "SUBPROCESS BOUNDARY: every observed process.spawn yields a process-boundary finding naming the command, derived from the observation itself so no declaration suppresses it. It fires EVEN WHEN the spawn matches a declared port -- declaring tlc_process says 'I spawn java', not 'here is what java then wrote', and that was the silent half of the defect. test_a_child_that_writes_is_proof_the_boundary_is_real spawns a child that writes a real file, asserts the file exists, and asserts the sandbox recorded NO write for it."
        - "THE INVERSE TEST (the regression guard, built exactly as MF-013 built its gap-suppression inverse): TestNothingDowngradesAnUnobservableVerdict asserts only NEGATIVES -- manifest observable:true, assume_observable, allow_unobservable, trusted_runtime, justification prose, port-level skip_observability, EVERY SUPPRESSION_KEYS entry applied at once, lying with runtime:python on a JBang reference, and three environment variables all leave verdict and ok unchanged. Structural tests prove diff_effects accepts no suppression keyword, EffectRecorder exposes no clear/waive method, the CLI carries no --allow-unobservable/--skip-observability/--assume-observable flag, and ok's source (comments stripped) contains no config/flag/os.environ/getattr/manifest/if -- it is a pure conjunction of finding lists. There is deliberately no test that an opt-out works, because no opt-out exists."
        - "MODEL DELTA -- NON-ZERO, deviating from this entry's prescribed desired_actions [] / model_state [] (possibly stale per #33, and not treated as binding). Three consecutive prior tickets correctly recorded a zero delta; this one does not. The effect_conformance verdict maps directly onto a TLA variable whose domain is enumerated, and 'unobservable' selects a distinct result.next and a distinct CLI exit path. Omitting it would leave the model blind to a real outcome of a modeled command -- the same defect class the verdict exists to report. Domain grows 4 -> 5 in RunEffectConformance, RunSpecUnitTests, and TypeInvariant. NO new variables (still 8), NO new actions, depth unchanged at 24."
        - "COMPLEXITY DELTA recorded JOINTLY with retention evidence in specs/tickets/MF-027/results/complexity-delta.md: bound 139,968 -> 174,960 (exactly x5/4, confirming the domain growth is the whole delta); TLC 678,724 -> 1,067,828 generated, 38,241 -> 49,875 distinct (+30.4%), depth 24 unchanged; 10.0% of the 500,000 max_distinct_states budget. Baseline re-measured on-branch rather than quoted. RETENTION: the value supports TypeInvariant and is one of the values excluded by SpecUnitTestsRequireMeasuredEffects, and it carries the externally-visible CliWorkflowResult.effect_conformance_verdict. Its kill-test leg is deferred to MF-016/MF-023."
        - "REFINEMENT SEARCH: SEARCHED, AND A REDUCTION WAS FOUND -- collapsing all three failure verdicts into one 'fail' measures 375,096 generated / 26,607 distinct by real TLC run, a 47% cut versus this ticket and 30% BELOW the epic baseline. NOT APPLIED: it deletes externally-visible result.next distinctions, which is a complexity reduction bought by dropping a boundary -- the cheap way the doctrine names -- and it reverses a deliberate MF-013 design choice. Recorded as an owner-approval architectural recommendation with the number in hand, so the owner can decide whether result.next granularity is worth 23,268 distinct states."
        - "THE LIVE FINDING WAS NOT WORKED AROUND and is unchanged: 'component C1 is touched by 13 actions, exceeding max_component_actions 8'. No budget renegotiation, no --allow-over-budget; the budget gate remains FAIL exactly as at the epic tip. Resolved at the root by MF-023. The SUGGESTED MOVE ABSTRACT recommendation (project lastCommand/result) is likewise unchanged and is not this ticket's to take."
        - "NEGOTIATED BUDGET CARRIED AND VERIFIED: max_distinct_states 500000 and its full derivation comments were carried into desired/ and current/ and confirmed present in specs/current AFTER promotion -- the SF-003 blind spot (#32). Evidence: specs/tickets/MF-027/results/budget-retention.md."
        - "FLAGGED TO THE EPIC OWNER: this repository's own manifest declares two process.spawn ports (tlc_process -> *java*, test_process -> *pytest*), so a real corpus sweep will now report 'unobservable' rather than 'clean'. That is ACCURATE -- the harness genuinely cannot see inside the java and pytest children -- but MF-023 must route those boundaries through in-process adapters or record the refusal as a known limitation. It must NOT be resolved by relaxing the rule. See specs/tickets/MF-027/results/deferred-to-mf023.md."
        - "DOCUMENTED: references/modular_fuzzing.md gains 'Observable scope of the effect oracle (MF-027)' and 'Known limitation: exported Test Graph cases get no effect checking' under Oracles alongside oracle 3, stating that export_testgraph_cases.py has zero references to effect conformance because exported cases run in JBang/uv nodes in their own processes. SKILL.md Testing Layers item 3 states the observable scope plainly, headed 'read this before onboarding a non-Python project', so a user onboarding a JVM project learns it from documentation rather than from a false green."
        - "FOLLOW-UP FILED for JVM-capable observation behind the same port-declaration schema -- a JVM agent, syscall capture, or container-level recorder. A second implementation, NOT an extension, and explicitly out of scope here: https://github.com/haydenrear/tla-spec-dev/issues/44"
        - "VALIDATION: TLC on ticket-local current 1,067,828 generated / 49,875 distinct / depth 24, no error, 02s. spec-unit 31+28 passed across 2 targets. Repository suite 284 baseline -> 315 with 31 new MF-027 tests -> 318 collected once the MF-027 ticket tree widens a parametrized YAML guard by 3 cases (verified by stashing the ticket tree and re-running: 315). No regression. specWorkflow 8/8 nodes and cliWorkflow 2/2 nodes passed."
        - "Validations DEFERRED to MF-023 per the epic-wide instruction, enumerated in specs/tickets/MF-027/results/deferred-to-mf023.md: spec-case generation, the corpus run, the effect-conformance sweep over a real corpus, and the mutation kill test. Called out there for MF-027 specifically -- MF-023 must confirm the observability assessment raises no FALSE REFUSAL against the REAL adapter tree; fixtures cannot prove that."

  - id: MF-016
    title: "Mutation kill test"
    status: closed
    github_issue: "https://github.com/haydenrear/tla-spec-dev/issues/17"
    schedule_revision: 4
    depends_on: [MF-012, MF-014]
    blocks: [MF-019]
    wave: 6
    promotion_order: 60
    promotion_predecessor: MF-027
    conflict_keys:
      production: [scripts/run_kill_test.py, examples/distributed_history/]
      tla: [TlaSpecDevCli.tla]
      adapters: []
      test_graph: []
      workflow: []
    objective: "Kill-test support: documented and CLI-assisted seeding of at least one fault per port and one per invariant, distilled-corpus run, kill_rate_floor gate from manifest budgets, evidence storage (mutants, kill matrix, surviving-mutant analysis), onboarding/promotion as required kill-test moments, kill-rate before/after comparison across model revisions so the kill test doubles as the abstraction validator (references/architecture_tractability.md), and a worked kill test in distributed_history. See tickets/016-mutation-kill-test.md."
    desired_actions:
      - RunKillTest
    implementation_scope:
      - scripts/run_kill_test.py (new) or documented procedure with runner support
      - examples/distributed_history/ worked kill test
      - references/modular_fuzzing.md kept in sync
    current_increment:
      model_state:
        - kill_test
      model_actions:
        - RunKillTest
      adapters:
        - spec-unit adapter proving a seeded fault is killed and reported
      unit_tests:
        - uv run --with pytest -m pytest tests -q
        - uv run --with pytest -m pytest specs/tickets/MF-016/current/tests -q
      graph_after_unit_pass:
        - specWorkflow
        - cliWorkflow
    acceptance:
      commands:
        - bash scripts/run_tlc.sh specs/tickets/MF-016/current/TlaSpecDevCli.tla specs/tickets/MF-016/current/MC.cfg
        - python3 scripts/tla_spec_dev.py --spec-root specs run spec-unit-tests --ticket MF-016
        - python3 examples/run_distributed_history_validation.py --mode local
      assertions:
        - kill rate is computed against kill_rate_floor from budgets and gates nonzero below it.
        - mutants, kill matrix, and surviving-mutant analysis land under ticket evidence.
        - distributed_history carries a worked kill test in local mode.
      evidence:
        - specs/tickets/MF-016/results/DEFERRED-TO-MF-023.md
        - specs/tickets/MF-016/results/tlc.txt
        - specs/tickets/MF-016/results/analyze-complexity.txt
        - specs/tickets/MF-016/results/spec-unit-tests.txt
        - specs/tickets/MF-016/results/repository-unit-tests.txt
        - specs/tickets/MF-016/results/testgraph-specWorkflow.txt
        - specs/tickets/MF-016/results/testgraph-cliWorkflow.txt
        - specs/tickets/MF-016/results/kill-test-boundaries.txt
        - specs/tickets/MF-016/results/example-kill-test-report.json
    outcome:
      - "DEVIATION 1 (plan entry not binding, known-stale #33): desired_actions/model_state prescribed the kill_test fact and RunKillTest action, both landed. Added beyond the entry: invariant KillTestVerdictRequiresBudgets, because RunKillTest guards on setup_phase >= 4 - the floor it gates against IS a budget, and reading kill_rate_floor before budgets are recorded would measure against a default nobody negotiated. That addition immediately grew the required-boundary set 18 -> 19 and made the kill test refuse until a mutant covered it: the coverage mechanism applying to its own oracle."
      - "DEVIATION 1b: the verdict domain is 4-valued (unknown/pass/below_floor/incomplete_catalog) rather than the entry's not-run/pass/fail, on the MF-027 criterion - below_floor and incomplete_catalog have different remedies (refine the model at the survivor's named variable vs. seed a fault for an uncovered boundary) and select different result.next strings. All three non-unknown values were confirmed individually reachable by TLC before the domain was fixed at four."
      - "DEVIATION 2: the promotion INTERLOCK is deliberately NOT modelled. CloseTicket does not require kill_test = pass, because the shipped close ticket does not enforce it and kill-test RUNS are deferred to MF-023. Gating close on a run that cannot happen would block every ticket close including this one, and writing the guard in anyway would make the model assert a behaviour the program lacks - precisely the defect oracle 4 exists to detect. The interlock lands with the runs."
      - "DEVIATION 3: examples/run_distributed_history_validation.py --mode local is NOT green and could not have been. Case generation for the example's External model is refused by a PRE-EXISTING complexity-gate finding (C2 touched by 9 actions, exceeding max_component_actions 8), verified by re-running with this ticket's files removed. Not worked around; no --allow-over-budget. The worked kill test was validated directly end-to-end against the real internal corpus instead."
      - "MOST IMPORTANT FINDING: the first end-to-end run of the worked example scored a perfect 7/7 kill rate that was entirely SPURIOUS. The corpus was already failing an unrelated effect-oracle dead_surface finding before any mutant was seeded, and since killed means the corpus run failed, every mutant was recorded as killed by that one pre-existing failure. A kill test without a control run reports its most flattering number exactly when the corpus is most broken. control_run() and the control_failed verdict were added because of this; it dominates every other verdict, computes no rate, seeds nothing, and has no skip flag."
      - "The dead_surface finding was itself real: the example manifest first declared five filesystem.write ports that EcommerceStore never crosses (in-memory sqlite). Per governing rule 4 the false declarations were REMOVED rather than the finding suppressed - a port the program never crosses is not a richer model, it is a wrong one."
      - "The corrected worked example then measured 0.571 (4/7) against the 0.8 floor with a GREEN control - BELOW FLOOR, three genuine survivors, each with an actionable pointer (projections/ProjectOrder, orders/Checkout, responses/SubmitCreateAccount). The floor was NOT lowered and the survivors were NOT waived; validate_kill_test() asserts the strict outcome and keeps failing until the example's representation is actually refined. That refinement is MF-023's work."
      - "COMPLEXITY DELTA recorded jointly with retention evidence: 8 -> 9 variables, bound 174,960 -> 699,840 (x4), TLC 1,067,828 -> 5,619,356 generated / 49,875 -> 231,621 distinct / depth 24 -> 25. That is 46.3% of the negotiated max_distinct_states 500,000, up from 10.0% - a much larger consumption than 'a gate variable is affordable' suggested, reported as measured rather than estimated. Both caps still pass. Repository unit tests 315 -> 373."
      - "STANDING OBJECTIVE - searched, found a measured 26.2% reduction, REFUSED it. Collapsing kill_test to 3 values gives 171,039 distinct (from 231,621) at unchanged depth 25. Refused on MF-027's own standard: it deletes an externally-visible distinction with a distinct remedy and a distinct result.next. RETENTION EVIDENCE: each of pass / below_floor / incomplete_catalog was confirmed individually reachable by TLC (invariant-violation probe), so the 4-value domain represents the reachable set exactly - a cheaper representation exists but it is not a re-representation."
