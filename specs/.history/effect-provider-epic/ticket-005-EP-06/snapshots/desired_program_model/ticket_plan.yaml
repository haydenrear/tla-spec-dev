      so there is nothing named DistillCorpus to model and no corpus_distilled
      fact to record. Staleness class tracked as #33; precedent for recording the
      deviation here rather than inventing a model change is MF-017.
      What landed: scripts/corpus_diagnostics.py, wired as a post-write gate in
      generate_cases_from_tlc_dump.py, a pre-selection gate in
      export_testgraph_cases.py, and the `tla-spec-dev analyze corpus` command.
      Model delta is NOT zero: corpus_gate (a 3-valued global verdict) plus the
      AnalyzeCorpus action, 8 -> 9 variables, 11 -> 12 actions, bound 221,184 ->
      663,552, distinct states 2,923 -> 9,011, depth 23 -> 24, all within budget.
      The growth is deliberate -- an unrepresented gate is not a gate, and hiding
      a real command to hold a count down is the under-representation this
      ticket's own doctrine forbids.
      NOTHING IS DROPPED: no code path removes a case to satisfy a cap. Generation
      writes the complete package BEFORE the gate runs, and the export gate
      measures the full corpus BEFORE --label/--case/--limit selection, so no flag
      can bring a corpus under cap. corpus_gate deliberately has no override; the
      accept path is raising the cap in spec_manifest.yaml with a recorded
      rationale, which the failure output prints as a ready-to-paste block.
