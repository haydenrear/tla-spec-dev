    objective: "GOVERNING REFRAME (owner direction 2026-07-20), pulled to the front of the remaining work. A probe measured what the complexity gate does to ordinary programs: a 5-variable 10-command model, an unremarkable CLI over shared state, HARD-FAILED promotion because component C1 is touched by 10 actions exceeding the cap of 8. Any program with more than eight commands over shared state fails, which is most real programs, so as a hard gate the complexity metric fails in nearly every user project instead of helping. Complexity is a SCANNER, not a gate: it produces metrics, warnings and recommendations and tells the agent where to refactor, and it NEVER blocks promotion. Remove every complexity hard-fail -- analyze complexity exit-nonzero-to-block, case generation refusing above-gate, the component-size and bound checks that exit 1 -- and convert each to a warning that names what and where and recommends a move. Also fix the scanner-accuracy bug the probe found: v-prime-equals-v frame conditions are counted as touched, over-reporting coupling so every UNCHANGED variable shows as touched by every action. Keep the good scanner content that already exists: dimension table, state-space bound, R/W matrix, modularity score, dense-row god-state detection, suggested moves. What does NOT change is evidence integrity -- no dropping cases, no suppressing effect gaps, no silencing findings, because a scanner fed doctored input is worthless. See references/architecture_tractability.md Advisory Not Blocking. This resolves the everyone-fails-to-promote risk at its root."
