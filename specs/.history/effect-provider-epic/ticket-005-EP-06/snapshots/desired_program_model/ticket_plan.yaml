      setup/run/assert/teardown while bindings are live; exit providers in
      reverse order even on failure. Unknown ports, missing providers,
      duplicate bindings, invalid types, and provider-bearing unsupported
      execution modes fail before application execution. No-effect legacy
      batches remain compatible. V0 supports Python batch execution only.
