# Canonical plan for the effect-provider epic. GitHub issues mirror this file
# for handoff; this file remains the source of truth. Dispatched ticket IDs,
# dependency edges, waves, and promotion order are immutable after issue
# assignment — add amendment tickets instead of editing dispatched identities.
#
# This workflow branches the concluded modular-fuzzing discovery at dfd2a80.
# Its MF-* tickets remain below as an immutable historical record. The only
# completed original priority lane is EP-01 -> EP-02 -> EP-03. The owner-level
# coverage audit failed with 12 hard gaps. The owner then chose a deliberate
# product-contract reduction: ship only the generic agent-authored provider
# interface, harden that interface, and retain the examples as repeatable
# experimental evidence. EP-04 -> EP-05 -> EP-06 is that amendment lane.
version: 1
name: effect-provider-epic
updated: "2026-07-22"
purpose: "Ship the smallest useful effectful-modeling architecture: generated TLA+ cases select repository-defined typed semantic ports; one generic project-owned provider interface binds agent-authored implementations around each case; deterministic fuzz iterations explore concrete values inside the case's modeled semantic outcome; and repeatable example projects measure authoring cost, mutation kills, replay, cleanup, modularity, and abstraction limits without becoming framework-owned domain libraries."

epic:
  id: effect-providers
  branch: epic/effect-providers
  default_branch: main
  base_sha: dfd2a8004c10510f4819c5a9b17d652fd3baf8df
  base_tree: b9da49f29ef0bd8fd0441ee86252a1bad64d8651
  schedule_revision: 3
  review_mode: epic-owner-pr-review
  notes: >
    This is a sibling of epic/complexity-descriptor, deliberately branched
    from the user-selected modular-fuzzing tip rather than main. Ticket agents
    work in isolated worktrees, open PRs to epic/effect-providers, and stop;
    the epic owner reviews, validates, merges, and closes the matching GitHub
    issue. Run strictly EP-01 -> EP-02 -> EP-03. Use the repository-local
    `python3 scripts/tla_spec_dev.py` throughout; do not run skill-manager sync
    or merge this epic to main. The runtime contract is deliberately narrow:
    typed semantic ports and provider lifecycle/replay are framework-owned;
    concrete response behavior and fuzz strength are provider-owned. Passive
    effect observation remains a separate surface. V0 is Python batch mode;
    Java, streaming providers, universal monkeypatching, generated per-call
    response scripts, exhaustive cross-products, shrinking, and production
    Kafka/SMTP libraries are explicit non-goals. 2026-07-22 owner amendment:
    after all three dispatched tickets completed, revision 2 adds the exact
    validation scope required by the end-of-epic coverage audit. It changes no
    dispatched ticket identity, dependency, wave, promotion order, or conflict
    key. 2026-07-22 owner amendment revision 3 adds EP-04, EP-05, and EP-06
    after the completed original lane. The amendment deliberately reduces the
    shipped product contract to one generic agent-authored provider interface,
    dispositions the three generic DEF findings into EP-05, and reruns the
    examples as repeatable experimental consumers rather than domain libraries.

deferment_policy:
  mode: batch
  blocking: escalate
  budget: 5
  backlog: "specs/desired_program_model/deferred_findings.yaml"

