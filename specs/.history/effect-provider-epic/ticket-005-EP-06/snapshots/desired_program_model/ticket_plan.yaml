    objective: >
      Add the smallest fail-closed runtime that maps a generated case's action
      to typed semantic effect ports and binds project-owned providers around
      that case. Reuse manifest `ports` as generated Protocol contracts, mark
      semantic effect ports explicitly, declare action requirements in
      actions.yml (`effect_ports`), and map each required port in
