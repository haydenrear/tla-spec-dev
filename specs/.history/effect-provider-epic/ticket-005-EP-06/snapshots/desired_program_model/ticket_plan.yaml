      silently degrading to documented defaults, which would have made this
      ticket's cap-raise accept path a no-op. Fixed minimally; the
      fallback-with-warning policy itself is untouched and stays with MF-023.
      Spec-case execution deferred epic-wide; see deferred-validations.md. The
      C1 action-count finding goes 11 -> 12 and was NOT worked around with
      --allow-over-budget or by renegotiating component budgets.
