    with read-back into manifest.json, and feedback_status none-found is a
    first-class answer so silence records as unresolved.
    ZERO MODEL DELTA accepted, deviating from this entry's prescribed
    desired_actions EmitSkillFeedback / model_state skill_feedback (written
    when the ticket sat at promotion_order 70). Close-out already exists as
    CloseTicket; the feature adds a file effect and a history field, not a
    command, guard, or branch, and filing status is recorded rather than
    enforced. Precedent MF-021, same close path, same rationale. Verified
    alternative cost -- a 3-valued fact would take the bound 221,184 ->
    663,552 to represent a document field. Modeling filing status as state
    would gate close and is a real behavior change; amendment ticket if
    wanted. The deviation is recorded in the ticket entry outcome field.
    The loop produced three findings on its first run, all verified and filed
    as GitHub issues -- SF-003 (#32) promotion enumerates removed and
    preserved but NOT overwritten, so an edit to specs/current is reverted
    with no record, an incomplete transparency guarantee from MF-021;
    SF-002 (#33) the plan's prescriptive desired_actions/model_state are
    never reconciled against implementation, third instance after MF-011 and
    MF-020, same root cause as the three recorded spec-level errors;
    SF-001 (#34) scaffold workflow emits a one-ticket plan, so cross-close
    behavior such as append-only accumulation cannot be tested without
    hand-editing YAML, which the MF-019 ledger will hit too.
    2026-07-18: MF-021 accepted and closed at post-merge review (merge
    8a458f2). Promotion is now provenance-aware: `open ticket` records a
    seed_manifest in ticket.yaml, and close partitions current-minus-desired
    by whether the ticket was actually given the path. Seeded-then-dropped is
    a real deletion decision and still propagates; never-seeded is preserved.
    specs/current therefore remains a whole-program working copy rather than
    an accumulating union. Regression test verified to FAIL against a
    pre-fix shim (4 failed / 2 passed before, 6 passed after). Model delta
    zero — preserve-and-enumerate changes promotion's file effect, not the
    command state machine.
    TOOLCHAIN INTEGRITY FINDING (epic-wide, surfaced by MF-021): the PATH
    `tla-spec-dev` wrapper execs the installed skill clone, which tracks main
    at da0a7ff — this epic's base_sha — so every lifecycle command run this
    epic executed PRE-EPIC code. That is why the promotion defect destroyed
    files on three separate closes, including once after the fix merged. The
    MF-021 agent's recommended remedy (`skill-manager sync`) would NOT have
    worked and would have produced false confidence: the installed clone
    tracks main, and the epic does not reach main until finalization. All
    remaining epic issues (#13-#19) and this plan were repinned to
    `python3 scripts/tla_spec_dev.py`; see planning_rules.toolchain_rule.
    Test evidence from prior tickets remains SOUND — pytest, the spec-unit
    adapters, and the test_graph nodes all resolve to the repository
    independently of PATH.
    2026-07-18: MF-011 accepted and closed at post-merge review (merge
    463c906). The analyze command reports its own gate FAILING on this
    repository rather than tuning the budget to pass, applied MF-020's
    self-loop lesson to its own idempotent AnalyzeComplexity transitions, and
    independently derived the setup_phase collapse from the model alone
    (393,216 -> 73,728 at 11 -> 7 variables), matching the figure MF-020
    measured separately — real validation that the metric works. Complexity
    rose 11 -> 12 variables and 919 -> 2923 distinct states, justified: the
    gate is externally-visible behavior and the x3 is its 3-valued domain.
    SECOND SPEC-LEVEL ERROR FOUND (same class as the withdrawn -13.1%): the
    MF-011 spec instructed gating the static state-space upper bound against
    max_distinct_states, but the quantities are incommensurable. On this
    repository the bound is 1,179,648 while actual reachable distinct states
    are 2,923 — a ~400x over-approximation — so the gate fails a model that
    is 17x UNDER its own budget. Decisive: the tool's own recommended optimum
    (setup_phase, bound 73,728) STILL fails the 50,000 budget. The
    implementation was correct; the specification was wrong. MF-022 added at
    promotion_order 25 to add a distinct max_state_space_bound and, per owner
    decision, to bundle the approved setup_phase collapse into the same
    model touch. MF-014 bumped to revision 2 (depends_on gains MF-022;
    promotion_predecessor MF-011 -> MF-022) because corpus distillation needs
    case generation, which the miscalibrated gate currently refuses.
    Component-size heuristics are unaffected and working correctly.

    2026-07-21: PIVOT -- the modular-fuzzing epic is concluded as SOLID
    DISCOVERY. Validation project 1 (of MF-037) found the complexity scanner's
    SUGGESTED MOVES are confidently wrong on standard TLA+ (F1: composed/aliased
    invariants make it recommend projecting away all variables; the scaffold's
    own External view triggers it). Combined with the earlier findings that
    fuzzing catches 0/9 content bugs (MF-038) and complexity gates fail every
    normal program (the MF-036 probe), the owner concluded: we went too far too
    fast, suggestions are not ready and may never be automated. MF-037 projects
    2 and 3 are NOT run -- they would validate a direction now abandoned;
    project 1 was sufficient discovery. MF-037 marked done as discovery.
    NEXT EPIC "complexity-descriptor" (branch epic/complexity-descriptor off
    this tip to inherit the scanner): (1) remove suggested moves and ship a
    factual complexity DESCRIPTOR, fixing the F1 invariant-aliasing and F3
    bound-degeneracy accuracy bugs; (2) a complexity INTUITION doc on what good
    and bad descriptors look like, framed as refactor input; (3) self-
    configurable, composable FITNESS FUNCTIONS over the descriptor that notify
    future agents, experimental. Issues #71 (CD-01 descriptor), #72 (CD-02 intuition), #73 (CD-03 fitness functions); starter COMPLEXITY-DESCRIPTOR-EPIC.md
    at repo root. The advisory scanner and honest docs from this epic are the
    foundation the next epic builds on.

planning_rules:
  current_model_rule: Update specs/current after each production slice lands as a whole-program working copy of specs/program_model, not a ticket projection.
  unit_validation_rule: Run current-model TLC and adapter/unit tests before adding graph execution.
  graph_rule: Add graph or integration nodes only after current-model validation passes.
  semantic_model_rule: Do not add test graph nodes, pytest jobs, CI workflow steps, integration harnesses, or validation scripts as TLA+ program state/actions. The CLI's own workflow commands (scaffold, analyze, generate, close) ARE program behavior for this repository.
  evidence_rule: Record tests and graph runs as evidence for semantic program actions in manifests or ticket status.
  desired_sync_rule: Update this file and spec_manifest.yaml whenever scope, order, acceptance checks, or status changes; bump schedule_revision for any change to IDs, edges, waves, promotion order, conflict keys, or validation scope.
  promotion_rule: Only epic finalization promotes; ticket agents close exactly their own ticket and never run close_tickets.py or use --accept-new.
  effect_provider_rule: Generated cases choose the modeled semantic outcome; providers may fuzz concrete representatives inside that outcome but may not rewrite case before/input/output/after expectations. A different semantic outcome requires another TLA+ case or an independent provider oracle. The framework guarantees lookup, lifecycle, cleanup, deterministic replay metadata, and fail-closed configuration — never that arbitrary application effects cannot bypass a provider.
  toolchain_rule: Never invoke the PATH `tla-spec-dev` wrapper for this epic. It execs ~/.skill-manager/skills/spec-double-compiler, a separate clone tracking main at da0a7ff rather than this epic's dfd2a80 base, so it runs pre-epic behavior and contains none of this branch's work. `skill-manager sync` does NOT fix this while the installed clone tracks main. Use `python3 scripts/tla_spec_dev.py --spec-root specs ...` from the repository root for every lifecycle command. The automated layers (pytest, spec-unit adapters via production_adapters.py, test_graph nodes) already resolve to the repository and need no change. Revisit only after an eventual default-branch merge.

