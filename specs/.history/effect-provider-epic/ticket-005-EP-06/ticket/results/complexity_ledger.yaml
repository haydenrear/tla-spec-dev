# Complexity ledger input -- MF-019 standing objective.
#
# `close ticket` refuses until this is filled in. That refusal is the mechanism:
# the standing objective is a required close-out step, not a stance.
#
# The delta is computed for you from `analyze complexity` and the TLC report.
# What you supply is the part a tool cannot know: whether behavior was retained,
# what the refinement search found, and why any increase is essential.

# Retention evidence -- the doctrine's three-member constraint set. A complexity
# DECREASE is REJECTED unless all three are retained. Absent or unknown evidence
# does NOT pass: an unmeasured constraint cannot witness retention.
#
#   kill_rate:           pass | below_floor | incomplete_catalog   (MF-016)
#   effect_conformance:  clean | gaps | dead_surface | unobservable (MF-013/MF-027)
#   external_coverage:   pass | gaps | incomplete                  (MF-015)
#
# NOTE: `unobservable` IS NOT `clean`. MF-027 made the effect oracle refuse
# targets it cannot see; treating that as passing here would rebuild the silence.
retention:
  kill_rate:
    status: "pass"
    evidence: "examples/effect_providers/evidence/validation-runs/ep06-central-20260722-v2/aggregate.json -- 36 unique fixed mutants, 48/48 scored executions killed"
  effect_conformance:
    status: "clean"
    evidence: "specs/tickets/EP-06/results/testgraph/effectProviderExamples-20260722-234720-abf456cf/report.md -- 37/37 exact replays, 3140/3140 cleanup checks, bounded bypass findings explicit"
  external_coverage:
    status: "pass"
    evidence: "specs/tickets/EP-06/results/testgraph/effectProviderExamples-20260722-234720-abf456cf/report.md -- all 70 generated real-boundary cases passed"

# Coverage audit -- MF-026. The completeness gate, distinct from the three
# retention members above, which are all FIDELITY measures bounded to what is
# already modeled. Unmodeled surface is invisible to every one of them.
#
#   status: pass | fail | incomplete | not_run
#
# `not_run` is the CORRECT value at a ticket close: the audit is an end-of-epic
# step, run after the mechanism tickets land and before final integration. It is
# recorded and reported either way so that an epic which skipped it is visible.
# At WORKFLOW close anything but `pass` REFUSES -- and `incomplete` IS NOT
# `pass`, because a sweep that did not walk the surface says nothing about it.
#
# Procedure: prompts/coverage_audit.md   Doctrine: references/coverage_audit.md
coverage_audit:
  status: "not_run"
  report: ""          # path to the filled templates/coverage_audit_report.md
  in_scope_gaps: null # count; in-scope gaps are HARD -- model it or change the program
  scope_source: ""    # plan file:lines the declared scope was READ from, never chosen

# Required if complexity INCREASED. Name the new essential behavior the added
# representation carries. This documents real behavior; it does not waive the
# increase, which is recorded and reported either way.
justification: "The added representation is essential replay infrastructure: three non-overwriting project validators, one shared schema/aggregate gate, usage descriptors, raw failure evidence, and an executable Test Graph node. It does not add host-model state or domain adapters. The deliberately rich research evidence measures authoring cost and product boundaries; POST_REPLACEMENT_RECOMMENDATIONS.md identifies what may later be factored."

# The recursive refinement loop -- REQUIRED at every close.
# Either an approved recommendation with evidence, or "searched, found none".
# Recommendations are advisory and user-approved, never auto-applied.
refinement:
  searched: true
  outcome: "none"
  detail: "Compared all three independent implementations. Shared append-only result validation and orchestration were factored at the repository level; concrete providers stayed local. No further safe reduction is justified before another correlated-state consumer and data-dependent mutation catalog exist."
  measured: true       # true only if a real TLC run produced the figure
  applied: false       # if true, approved_by is required
  approved_by: ""

# Required only if a generated-states drop at constant distinct states is
# detected. That is a RED FLAG (deleted self-loop, MF-020), not a win -- record
# the inspected transition-level diff here to accept it.
transition_diff: ""

# REQUIRED. The narrative ledger: reasoning, measured alternatives, findings the
# machine-checked core above cannot express. Path to a document, or prose.
narrative: "See results/validation-summary.md, results/agent-validation-summary.md, results/defect-resolution.md, and examples/effect_providers/POST_REPLACEMENT_RECOMMENDATIONS.md. The host model remained at 5,619,356 generated / 231,621 distinct / depth 25. The aggregate validation took 59.92s; the HTTP external tier dominated at about 32.7s."
