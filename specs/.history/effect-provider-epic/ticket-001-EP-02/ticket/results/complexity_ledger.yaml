# Complexity ledger input -- MF-019 standing objective.
#
# `close ticket` refuses until this is filled in. That refusal is the mechanism:
# the standing objective is a required close-out step, not a stance.
#
# The delta is computed for you from `analyze complexity` and the TLC report.
# What you supply is the part a tool cannot know: whether behavior was retained,
# what the refinement search found, and why any increase is essential.

# Retention evidence -- the doctrine's three-member constraint set. A complexity
# DECREASE is REJECTED unless all three are retained. Absent or unknown evidence
# does NOT pass: an unmeasured constraint cannot witness retention.
#
#   kill_rate:           pass | below_floor | incomplete_catalog   (MF-016)
#   effect_conformance:  clean | gaps | dead_surface | unobservable (MF-013/MF-027)
#   external_coverage:   pass | gaps | incomplete                  (MF-015)
#
# NOTE: `unobservable` IS NOT `clean`. MF-027 made the effect oracle refuse
# targets it cannot see; treating that as passing here would rebuild the silence.
retention:
  kill_rate:
    status: "incomplete_catalog"
    evidence: >-
      CARRIED FORWARD from EP-01/MF-030. EP-02 adds deterministic provider-owned
      representative campaigns but does not add or claim a repository-wide
      mutant catalog. The inherited non-passing verdict remains explicit.
  effect_conformance:
    status: "unobservable"
    evidence: >-
      CARRIED FORWARD from EP-01 for the subprocess-driven host CLI. EP-02 does
      prove clean in-process coexistence between semantic providers and passive
      observation, including temporary-root explicit DI and a self-installed
      patch, in tests/test_effect_provider_fuzzing.py. It does not claim those
      patches observe a child process, JVM, native client, or remote service.
  external_coverage:
    status: "incomplete"
    evidence: >-
      CARRIED FORWARD from EP-01/MF-030. EP-02 adds no external-view adapter or
      corpus coverage and therefore asserts no improvement on this axis.

# Coverage audit -- MF-026. The completeness gate, distinct from the three
# retention members above, which are all FIDELITY measures bounded to what is
# already modeled. Unmodeled surface is invisible to every one of them.
#
#   status: pass | fail | incomplete | not_run
#
# `not_run` is the CORRECT value at a ticket close: the audit is an end-of-epic
# step, run after the mechanism tickets land and before final integration. It is
# recorded and reported either way so that an epic which skipped it is visible.
# At WORKFLOW close anything but `pass` REFUSES -- and `incomplete` IS NOT
# `pass`, because a sweep that did not walk the surface says nothing about it.
#
# Procedure: prompts/coverage_audit.md   Doctrine: references/coverage_audit.md
coverage_audit:
  status: "not_run"
  report: ""          # path to the filled templates/coverage_audit_report.md
  in_scope_gaps: null # count; in-scope gaps are HARD -- model it or change the program
  scope_source: ""    # plan file:lines the declared scope was READ from, never chosen

# Required if complexity INCREASED. Name the new essential behavior the added
# representation carries. This documents real behavior; it does not waive the
# increase, which is recorded and reported either way.
justification: >-
  No TLA+ representation was added. EP-02 is host-side Python provider
  orchestration, scaffolding, and author guidance; ticket current and desired
  are byte-identical. The unchanged model was measured again: 5,619,356 states
  generated, 231,621 distinct, depth 25, no error. The added host behavior is
  essential for deterministic representative campaigns and exact replay.

# The recursive refinement loop -- REQUIRED at every close.
# Either an approved recommendation with evidence, or "searched, found none".
# Recommendations are advisory and user-approved, never auto-applied.
refinement:
  searched: true
  outcome: "none"
  detail: >-
    Searched for a smaller authoring/runtime representation and retained two
    narrow helpers plus project-owned provider implementations. The TLA case
    continues to own semantic outcome; the provider owns concrete responses,
    state, and assertions. A central response language, universal interception,
    Hypothesis/exhaustive orchestration, Java, and service libraries were
    rejected for EP-02 rather than inflating the mechanism before EP-03 measures
    three real projects.
  measured: true       # results/tlc-current.txt
  applied: false       # if true, approved_by is required
  approved_by: ""

# Required only if a generated-states drop at constant distinct states is
# detected. That is a RED FLAG (deleted self-loop, MF-020), not a win -- record
# the inspected transition-level diff here to accept it.
transition_diff: ""

# REQUIRED. The narrative ledger: reasoning, measured alternatives, findings the
# machine-checked core above cannot express. Path to a document, or prose.
narrative: >-
  EP-02 adds a versioned stable seed protocol, bounded campaign iteration,
  exact single-point replay, structured lifecycle diagnostics, project-owned
  provider scaffolds, and small context-stack/temporary-root helpers. Provider
  configuration and lazy binding are prepared across the corpus before any
  application hook; each runtime point then gets isolated singleton batch
  hooks, adapter/shared caches, provider resources, and opaque work paths.
  Provider allocation and cleanup sit outside passive application observation,
  while adapter setup/run/assertion/teardown remains within both provider and
  observation scopes. This prevents harness filesystem churn from becoming a
  false effect without hiding application calls through injected bindings or
  installed patches. Review corrections, exact validation, explicit limits,
  and the zero-model-delta rationale are recorded in
  results/validation-summary.md, results/review-correction.txt, and
  results/zero-model-delta.md.
