    "objective": "Make EP-01 usable by a project author without expanding it into a framework-owned simulator. Add a small provider kit: an explicit temporary-root filesystem helper and a generic context-manager/patch provider factory, plus generated provider stubs. Add bounded CLI fuzz iteration (`--fuzz-runs N --seed S`) with a stable derived seed for each case, iteration, and port, deterministic ordering, and copy-paste replay diagnostics on every failure. The provider receives the immutable generated case plus run metadata and owns concrete response generation, state, and assertions. It may fuzz concrete representatives inside the modeled semantic outcome; it must not rewrite the case's expected output/after state. Document how users implement filesystem, HTTP, Kafka, SMTP, or domain-specific providers, and be explicit that fuzzing depth is bounded by provider capability. Do not add a central Hypothesis campaign, exhaustive cross-product, shrinking claim, real Kafka/SMTP libraries, or generated per-call response scripts in this ticket.\n",
