    "objective": "Validate the architecture as a measurement, not a showcase, with three independently onboarded projects and predeclared predictions: (A) an explicitly injected atomic document publisher \u2014 predicted high mutation yield at low integration cost; (B) a legacy HTTP client with retries/timeouts and a self-installed patch provider \u2014 predicted useful protocol bugs but higher monkeypatch/bypass friction; (C) a stateful multi-provider outbox workflow (store/queue plus clock/notification) \u2014 predicted highest semantic value and highest composition/modeling cost. Each project owns its TLA+ model, generated cases, application, adapter, providers, predeclared mutants, and validation record. Run green controls and every mutant with multiple deterministic seeds, prove replay and cleanup, and add a Test Graph node that validates all three. Measure authoring footprint, retrieval surface, generated states/cases, runtime, provider/adapter code, mutation kills by semantic bug class, bypasses, unsupported effects, run-to-run divergence, and whether an agent can onboard using the shipped docs without framework changes. Record findings before fixing them. Produce a go/no-go recommendation and a prioritized backlog for effectful modeling, including whether a standard response-plan schema, stronger bypass detection, or Java belongs next.\n",
