    "objective": "A RESEARCH TICKET -- design and evidence, NO production code. Its output SCOPES RM-03's removal. The card has only ever graded this repository's own methodology, and the owner intends to expose it so external projects grade their own architecture, with the regressions they find by hand becoming card and architecture iterations they choose. That is strategic AND it is the only non-arbitrary stopping rule available for how much to cut. Decide: what is actually portable; what the card assumes that only this repo satisfies -- DOES IT GRADE ARCHITECTURE OR CONFORMANCE TO THIS PROJECT'S ARCHITECTURE, answered from the sealed cards rather than the anchors' wording; the minimum an adopter must supply; WHICH DIMENSIONS SURVIVE THE TRIP, because a dimension that cannot be trusted in the project that built it should not be exported; and whether the card's change rule survives an adopter using it. THE TRAP: do not design a product, and DO NOT LET PORTABILITY BECOME A REASON TO ADD. The most valuable output may be 'these three things cannot be exported and here is why.'",
