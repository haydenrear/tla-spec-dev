    "objective": "FIRST AND ALONE -- everything else depends on it. The instrument that prices removals CAN ONLY RETURN ZERO: a gap mutant prices a removal only if every detector that killed it is one the removal deletes, and over the sealed before-table that is 0 OF 9. The re-runnability rule is self-confirming BY CONSTRUCTION -- it excludes exactly the faults that could go DIES->SURVIVES, and SM-01 named the one fault the machinery uniquely caught and declared it not_seedable BECAUSE it cannot be re-run after the cut. Characterise the exclusion, build an instrument that can return non-zero, DEMONSTRATE A DIES->SURVIVES ON A REAL REMOVAL, and re-price at least one historical removal. SM-04-GM-T1 is the known-positive: an instrument that cannot reproduce it is not working. DO NOT TUNE UNTIL A COMFORTABLE NUMBER APPEARS -- a high price on a past removal is the informative outcome.",
