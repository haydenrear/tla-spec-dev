    "model_delta_expectation": "none",
    "objective": "The architecture lever of this epic, and it is a PROMPT. Not a schema, not a check, not a gate. Owner direction 2026-08-03: the hoops already built are not smart enough to provide value and agents spend real time jumping through them, so architecture guidance moves into the ask. The hypothesis being tested, stated so it can fail: an agent working from the DIAGRAM -- far enough from the code that it is not defending existing structure -- will produce a modular, testable design if simply asked for one, and will preserve behavior while reducing complexity if told that is the goal. Build on what already ships: prompts/implementation_brief.md and prompts/aspect_decomposition.md (AC-03). The new prompt asks for ports and adapters explicitly -- a domain that does not import its I/O, driven ports behind interfaces, adapters swappable for fakes -- and asks for the SIMPLEST design that retains the behaviors, feeding the shipped complexity descriptor in AS GUIDANCE rather than gating on it. Two things the prompt must NOT do, both learned the hard way. It must not instruct the agent to make any check pass -- \"make the coherence check clean\" is a standing instruction to duplicate across component boundaries, measured in round 2. And it must not promise that a metric improving means the design improved: MF-020, a metric can improve because an edge was deleted.",
