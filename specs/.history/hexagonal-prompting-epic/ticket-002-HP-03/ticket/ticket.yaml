    "model_delta_expectation": "A generation mode may need an action. If so, state what it buys and what the state space costs BEFORE dispatch, per surface_cost_rule -- the predecessor measured ~1.5 new coverage gaps and 8x state space per surface-adding ticket.",
    "objective": "The single largest available increase in what a generated corpus can see, and the only ticket aimed at a fault class that has measured ZERO on every instrument in every round. A generated corpus replays only ENABLED edges, so it contains no rejected inputs: a service that accepts what the model forbids passes every case. Round 1: 0 of 3. Round 2: 0 of 3, on both arms, AFTER RP-02 took parameter recovery from 0 of 5 to 5 of 5 -- which moved nothing and thereby falsified round 1's own explanation. RP-02 counted why: all 330 recovered arguments are arguments the guard ACCEPTS, 0 are rejected inputs, and 220 refusable pairs exist in the state space a state graph can never emit. A third blind catalogue reproduced it unaided: `330 'status': 'applied'` -- the corpus never once asks the program to reject a call. So build the generator mode: at each reachable state, the actions whose guards are DISABLED, emitted as cases asserting the call is REJECTED. TLC already knows them; the profile does not widen. AND MAKE A CORPUS TRACTABLE, because today one is not. Carries RC-02-DF-04 and MF026-R4-F-01: `generate cases` on MCsmall -- the config that exists to make a corpus tractable -- produces 3,678,217 cases and a 7.4 GB file CPython cannot import, 18,391x the manifest's own cap, and this model has no tlc_projection.py while every worked example does. A negative corpus nobody can run is not a mechanism. DO NOT BUDGET ANY OF THIS AGAINST PARAMETER RECOVERY. That hypothesis is dead, measured, and retracted in writing.",
