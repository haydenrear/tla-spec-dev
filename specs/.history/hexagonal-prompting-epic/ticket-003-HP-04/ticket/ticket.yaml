    "model_delta_expectation": "none expected -- these are defects in the harness, not missing model surface",
    "objective": "The adapters are the half that catches bugs, and three measured defects stop them. All three were found by RUNNING the oracle for the first time in the project's history, not by inspecting it. RC-02-DF-02: the oracle never puts the target spec dir on sys.path, so it cannot import the `case_adapters.toml` convention the CLI itself scaffolds. It cannot read a project it created. RC-02-DF-03: it never consults `can_run` and aborts the whole run on the first apply()-only adapter. NINE OF SEVENTEEN adapters in this model are apply()-only, so it sees 8 of 18 actions. MF026-R4-F-01: the gap count is NOT REPRODUCIBLE -- 20 / 15 / 14 across three runs of an identical corpus, a 43% spread on the number that would gate, because a work directory persists between runs. Any claim resting on that number is currently unciteable. Plus CM-F5, still open and still the cheapest outside-in artifact: a slice narrower than its view orphans the view's effect providers, both shipped mappings bind the port, so a slice has ZERO working configurations and the documented workaround needs a third file that exists nowhere. A round-2 blind agent lost 3 of its 15 actions to it and had to author that file -- and observed that the mapping it wrote is a STRICTLY WEAKER instrument with no durable-write oracle, so a green slice run over-reads.",
