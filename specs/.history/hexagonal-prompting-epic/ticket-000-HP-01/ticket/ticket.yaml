    "objective": "Build the experiment, then get out of the way. Three parts. (1) THE A/B TASK. One feature specification, written once, given to two agents: ARM A with an ordinary implementation prompt, ARM B with HP-02's hexagonal + minimize-complexity prompt. Same feature, same model, same seeded-fault catalogue, same judges. The arms are declared as two prompts in two files, never one prompt with a paragraph switched off, so a reader of the record can see which instrument produced which number. (2) THE SEEDED CATALOGUE, shipped as an artifact -- a `seeded_faults.toml`-shaped file with exact find/replace and a harness asserting each pattern occurs exactly once, so every number is re-derivable. Seed a fault IN THE GAP each mechanism is supposed to lose, including at least one guard-relaxation fault and one requiring a content assertion. A reduction result with no mutant in the gap is not a measurement. (3) COMMIT `examples/validation/PREDICTIONS-HP.md` BEFORE any other ticket is dispatched, with at least three NEGATIVE predictions -- what will NOT move. RP-02 is why: it closed a real oracle leak, took parameter recovery from 0 of 5 to 5 of 5, and moved the mutant matrix by zero cells. Nobody predicted that, and it killed a hypothesis recorded as fact. This ticket adds NO model surface. Per surface_cost_rule that is a feature.",
