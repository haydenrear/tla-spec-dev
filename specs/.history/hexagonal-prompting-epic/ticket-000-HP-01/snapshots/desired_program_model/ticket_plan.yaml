        local_signal: "the HP-01 catalogue's durable-write class under the default mapping"
      - goal: GOAL-hexagonal-in-fact
        contribution: guard
        expected_effect: "none -- must not require a particular architecture to work"
        local_signal: "N/A"
      - goal: GOAL-simpler-same-behavior
        contribution: guard
        expected_effect: "none expected"
        local_signal: "N/A"
