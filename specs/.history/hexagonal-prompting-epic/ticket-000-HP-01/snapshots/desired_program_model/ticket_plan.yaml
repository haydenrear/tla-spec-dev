  - id: HP-06
    title: "EVALUATION: run the A/B, judge it blind, decide the three goals"
    status: planned
    role: evaluation
    owns_goals: [GOAL-catch-bugs, GOAL-simpler-same-behavior, GOAL-hexagonal-in-fact]
    github_issue: null
    schedule_revision: 1
    depends_on: [HP-01, HP-02, HP-03, HP-04, HP-05]
    blocks: []
    wave: 4
    promotion_order: 60
    promotion_predecessor: HP-05
    conflict_keys:
      production: []
      tla: []
      adapters: []
      test_graph: []
      workflow: ["specs/results/scorecards/hexagonal-prompting/", "NEXT-EPIC.md"]
    objective: >-
      The epic's product and the ticket every other ticket was written against.
      A MEASUREMENT, not a victory lap. A low or unflattering result is the
      preferred outcome; an epic that closes with only good news about itself
      has not been measured.

      Run the A/B from HP-01 on the integrated epic tip: same feature, arm A
      ordinary prompt, arm B the HP-02 prompt. Seed the same catalogue in both.
      Generate cases from the model, run them through each arm's adapters, and
      count what dies.

      Then judge both arms on the scorecard, TWO JUDGES, BLIND TO ARM, per
      references/eval_scorecard.md -- artifacts not claims, file:line for every
      score >= 2, a named refusal for every 4, prose quality never an input. Any
      dimension where the judges differ by more than 1 is `contested` and gets a
      third pass citing NEW evidence.

      Report baseline -> measured -> target per goal, with a verdict of `met`,
      `missed`, or `unmeasured` and a reason. Never edit a target to match a
      result. Never re-run selectively until a number passes. Report the run
      that happened.

      Also report, because the predecessor learned it the hard way: findings BY
      CHANNEL -- suite re-run, fresh adversarial attack, blind author. Both
      rounds of the predecessor produced their best finding from an agent asked
      what it REJECTED and zero from re-running the suite. If this round's
      findings come only from the suite, say so plainly: the suite has stopped
      being informative, and that alarm is meant to fire before the tool
      silently gets worse.

      FILE FINDINGS, FIX NOTHING. A fix during a measurement destroys the
      measurement.
    desired_actions: []
    implementation_scope: ["specs/results/scorecards/", "NEXT-EPIC.md"]
    goals:
      - goal: GOAL-catch-bugs
        contribution: guard
        expected_effect: "decides the goal; adds no behavioral delta"
        local_signal: "N/A: this ticket is the measurement"
      - goal: GOAL-simpler-same-behavior
        contribution: guard
        expected_effect: "decides the goal; adds no behavioral delta"
        local_signal: "N/A: this ticket is the measurement"
      - goal: GOAL-hexagonal-in-fact
        contribution: guard
        expected_effect: "decides the goal; adds no behavioral delta"
        local_signal: "N/A: this ticket is the measurement"
    acceptance:
      commands:
        - "uv run --with pytest --with pyyaml python -m pytest tests -q"
        - "python3 examples/validation/scorecards/score_tools.py check specs/results/scorecards/hexagonal-prompting"
        - "python3 examples/validation/scorecards/score_tools.py index specs/results/scorecards/hexagonal-prompting"
      assertions:
        - "Both arms scored by two judges blind to arm; every scorecard passes the schema check; contested dimensions adjudicated with NEW evidence."
        - "Every prediction in PREDICTIONS-HP.md scored PASS / FAIL / SUPERSEDED. None amended."
        - "Each goal reports baseline -> measured -> target with a verdict of met / missed / unmeasured and a reason."
        - "Findings reported BY CHANNEL with counts, and the ratio stated as a result."
        - "Findings FILED and NONE fixed."
    model_delta_expectation: "none -- a measurement ticket carries no model delta"
