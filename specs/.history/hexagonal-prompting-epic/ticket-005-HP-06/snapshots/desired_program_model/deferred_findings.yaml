      ORACLE DISAGREEMENT FROM AN INSTRUMENT CRASH IS COMPUTED AND THEN THROWN
      AWAY. run_arm_kill_table.py catches bare `Exception`, so a TypeError from a
      sentinel, a KeyError from a binding or an IndexError from the line codec
      all score as kills. `run_all()` collects the failure text for every mutated
      run and `main()` reads only the count, so NOT ONE `KILLED` CELL in either
      merged table is attributable to a case, an assertion or a reason. Only the
      CONTROL failure text survives, and only in the run-1 files. Related and
      filed with it: 92% of the whole-view corpus is skipped and the per-case
      skip REASON -- which both adapters construct -- is dropped, so no
      `SURVIVED` cell can be distinguished from "the action was never executed".
    reproduction: >-
      specs/results/scorecards/hexagonal-prompting/measure/run_arm_kill_table.py:104-107
      (skip reason dropped) and :121-125 with :216-219 (failure text collected
      then unread).
    evidence:
      - "specs/results/scorecards/hexagonal-prompting/FINDINGS.md"
    why_out_of_scope: >-
      The instrument produced the tables this ticket reports. Changing it and
      re-running is the selective re-run an evaluation ticket may not do.
    suggested_fix: >-
      Record per mutant per instrument: the skip reason histogram, the count of
      executed cases, and the first three failure messages -- the driver already
      computes all three. Then a reader can tell a kill from a crash and a
      survivor from a skip without re-running anything.
    blast_radius: >-
      Every kill table this project has published, including HP-03's and HP-05's,
      which share this driver's ancestry.
    disposition: open
    disposition_ticket: null
    disposition_note: >-
      The seven remaining HP-06 findings are in
      specs/results/scorecards/hexagonal-prompting/FINDINGS.md with file:line
      evidence: DF-01 (slice adapter over-compared), DF-02 (the mechanical block
      cannot count mutable state in either arm), DF-03 (blinding leaked on the
      control arm), DF-04 (a missing sentence in HP-06's own packet moved a
      judged score by one anchor), DF-06 (the catalogue over-claimed "not
      seedable"), DF-08 (the branches figure is not comparable), DF-09 (the
      determinism claim covered 2 of 6 instruments on 1 of 2 arms).
