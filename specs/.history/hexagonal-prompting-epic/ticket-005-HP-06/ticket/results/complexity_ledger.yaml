# Complexity ledger input -- MF-019 standing objective.
#
# `close ticket` refuses until this is filled in. That refusal is the mechanism:
# the standing objective is a required close-out step, not a stance.
#
# The delta is computed for you from `analyze complexity` and the TLC report.
# What you supply is the part a tool cannot know: whether behavior was retained,
# what the refinement search found, and why any increase is essential.

# Validated-refactor basis -- CD-09 (owner-approved 2026-07-22). This is what
# LICENSES a complexity DECREASE: TLC green on the model before AND after the
# change, behavior tests green, and the before/after descriptor comparison
# recorded. Absent, unknown, or degraded evidence REJECTS a decrease: an
# unmeasured constraint cannot witness retention. (The fourth obligation, the
# inspected transition-level diff, is `transition_diff:` below and is demanded
# whenever the MF-020 red flag fires.)
#
#   tlc_before:            green | fail        -- TLC on the pre-change model
#   tlc_after:             green | fail        -- TLC on the post-change model
#   behavior_tests:        pass | fail         -- the repository behavior tests
#   descriptor_comparison: recorded            -- before/after descriptor doc
validated_refactor:
  # HP-06 IS A MEASUREMENT AND CLAIMS NO COMPLEXITY CHANGE IN EITHER DIRECTION.
  # It touched no TLA+ file, no .cfg, no manifest and no production script. Its
  # ticket-local desired/ and current/ are the whole-program state HP-01..HP-05
  # already produced, unedited. The measured delta is `direction=zero (vs
  # HP-05)`, computed by the ledger itself rather than asserted here.
  tlc_before:
    status: "green"
    evidence: "specs/.history/hexagonal-prompting-epic/ticket-004-HP-05/ticket/results/tlc-current-mcsmall.txt -- the epic tip this ticket branched from; the model is byte-identical at HEAD"
  tlc_after:
    status: "green"
    evidence: "identical file. `git diff --stat epic/hexagonal-prompting -- specs/current specs/program_model specs/desired_program_model/TlaSpecDevCli.tla specs/desired_program_model/MC*.cfg` is EMPTY for this ticket, so the pre- and post-change models are the same bytes and re-running TLC would compare a file against itself."
  behavior_tests:
    status: "pass"
    evidence: "specs/tickets/HP-06/results/pytest-full.txt -- 1130 passed, unchanged from the epic tip; specs/tickets/HP-06/results/spec-unit-tests.txt -- 73 + 70 passed across both targets"
  descriptor_comparison:
    status: "recorded"
    evidence: "specs/tickets/HP-06/results/goal-verdicts.md and specs/results/scorecards/hexagonal-prompting/GOAL-simpler-same-behavior/mechanical.json. NOTE, and it is the point of this ticket: the descriptor comparison recorded here is over the two A/B ARMS' PRODUCED CODE, not over this repository's model, because that is what GOAL-simpler-same-behavior measures. Two of its figures were found NOT COMPARABLE between the arms by an adversarial pass and are corrected in place (HP-06-DF-02, HP-06-DF-08)."

# Fuzzing-era retention members -- RECORDED at every close, non-gating since
# CD-09. Demoted to EXPERIMENTAL by the 2026-07-21 pivot (MF-038: kill 0.31 vs
# floor 0.8, 0/9 content bugs caught). `not_run` is the honest value; fill in a
# measured verdict only when one of them actually ran.
#
#   kill_rate:           pass | below_floor | incomplete_catalog | not_run   (MF-016)
#   effect_conformance:  clean | gaps | dead_surface | unobservable | not_run (MF-013/MF-027)
#   external_coverage:   pass | gaps | incomplete | not_run                  (MF-015)
#
# NOTE: `unobservable` IS NOT `clean`. MF-027 made the effect oracle refuse
# targets it cannot see; the record keeps that distinction even though the
# member no longer gates.
retention:
  kill_rate:
    # The SHIPPED kill test was not run against THIS repository's model. What ran
    # is HP-06's per-class per-arm per-instrument mutant table over HP-01's
    # sealed catalogue AND over a fresh independently authored one, on the two
    # A/B arms. It is recorded as a table and NEVER converted into a rate: the
    # catalogue forbids an aggregate, and HP-06's own adversarial channel filed
    # the one aggregate this ticket does compute (F13).
    status: "not_run"
    evidence: "specs/results/scorecards/hexagonal-prompting/GOAL-catch-bugs/kill-table-arm-{a,b}-merged.json and kill-table-blind-author-arm-{a,b}.json. Guard relaxation 3 of 3 under the negative corpus and 0 of 3 under every other generated instrument, on both arms; the POSITIVE CONTROL IS RED on arm A."
  effect_conformance:
    # Deliberately NOT RUN in this workspace, for the reason HP-04-DF-04 records:
    # `open ticket` snapshots the effect oracle's scratch tree into the ticket
    # workspace (706 of 801 tracked files on one HP-04 run) and `close ticket`
    # would promote it. HP-05 avoided it the same way. This workspace holds 92
    # files and was checked before close.
    status: "not_run"
    evidence: "HP-04-DF-04 in specs/desired_program_model/deferred_findings.yaml. Workspace verified at 92 tracked files before close."
  external_coverage:
    status: "not_run"
    evidence: "no external view was generated or changed by this ticket"

# Coverage audit -- MF-026. The completeness gate, distinct from the three
# retention members above, which are all FIDELITY measures bounded to what is
# already modeled. Unmodeled surface is invisible to every one of them.
#
#   status: pass | fail | incomplete | not_run
#
# `not_run` is the CORRECT value at a ticket close: the audit is an end-of-epic
# step, run after the mechanism tickets land and before final integration. It is
# recorded and reported either way so that an epic which skipped it is visible.
# At WORKFLOW close anything but `pass` REFUSES -- and `incomplete` IS NOT
# `pass`, because a sweep that did not walk the surface says nothing about it.
#
# Procedure: prompts/coverage_audit.md   Doctrine: references/coverage_audit.md
coverage_audit:
  status: "not_run"
  report: ""          # path to the filled templates/coverage_audit_report.md
  in_scope_gaps: null # count; in-scope gaps are HARD -- model it or change the program
  scope_source: ""    # plan file:lines the declared scope was READ from, never chosen

# Architecture delta -- AC-04. The STRUCTURE half of the ledger: the complexity
# delta above says whether the representation got smaller; this says whether the
# code moved toward or away from the boundaries the model draws. A refactor that
# lowers complexity while scattering the code further is not the refactor anyone
# wanted, and reading either number alone cannot tell.
#
# Produce the report with:
#
#   tla-spec-dev analyze architecture <spec.tla> <cfg> --components <components.yaml> #       --code <tree> --map <map.yaml> --baseline <a previous --format json scan> #       --format json --out <this path>
#
# RECORDED AT EVERY CLOSE AND GATING NOTHING. A rise in structural divergence is
# written down, printed, and closed through. What is NOT optional is honesty
# about it: `status` is not yours to write -- the ledger opens the report and
# derives the direction (improved | worsened | unchanged | unverified |
# unattributable). `claim:` is optional and exists only so a wrong one can be
# caught; a claim that disagrees with the measured direction REFUSES the close.
#
# Two refusals worth knowing before you run it:
#   * a divergence DROP whose disappeared edges are not enumerated is
#     `unverified`, never `improved` (MF-020, applied to structure);
#   * a comparison across two different maps -- or two different models -- is
#     `unattributable`. Any divergence disappears if the map moves the offending
#     module into the component it reaches, so a delta across a changed map
#     measures the map. Both digests are recorded in the entry.
architecture_delta:
  report: ""   # path to the --baseline delta JSON; empty is an honest `not_run`
  claim: ""    # optional: improved | worsened | unchanged | unverified | unattributable

# Required if complexity INCREASED. Name the new essential behavior the added
# representation carries. This documents real behavior; it does not waive the
# increase, which is recorded and reported either way.
justification: >-
  Not applicable: complexity did not increase. The ledger measures
  `direction=zero (vs HP-05)`. A measurement ticket carries no model delta and
  this one added no TLA+ action, variable, port or config value.

# The recursive refinement loop -- REQUIRED at every close.
# Either an approved recommendation with evidence, or "searched, found none".
# Recommendations are advisory and user-approved, never auto-applied.
refinement:
  searched: true
  outcome: "none"
  detail: >-
    Searched and found none that this ticket may apply. HP-06 is an evaluation
    ticket: its slice is the measurement, and a ticket whose evaluation changes
    the thing it evaluates has no measurement left to report. Applying a
    refinement to the model here would move the artefact the three goals were
    just decided against, after the numbers were known.

    THE SEARCH DID FIND REAL REFINEMENT WORK, and it is FILED rather than
    applied, which is the correct disposition for a measurement:

      * HP-06-DF-10 / HP-03's committed measurement -- this repository's
        `Refuse*`-style profile change produces 90.7% of a corpus and ZERO
        executable cases, because a refusal action's parameters appear nowhere
        in its body. That is a refinement question about how refusals are
        modeled, and it is now measured on two fixtures.
      * The blind-author channel's BA-F1..BA-F5 -- five ways the A/B fixture's
        model does not refine its own FEATURE.md, including a COMMIT record with
        three fields where the feature's has four. That is refinement work on
        HP-01's fixture, not on this repository's model, and HP-01's fixture is
        sealed evidence this ticket may not edit.
      * HP-06-DF-11 -- the oracle re-derives a reservation id the model does not
        allocate that way, which is HP-03-DF-01's "a model that guards an id its
        own API allocates rather than accepts" seen from the other side.

    None is a refinement of `TlaSpecDevCli`, which is the module this ledger is
    about, and none was applied.
  measured: false
  applied: false
  approved_by: ""

# Required only if a generated-states drop at constant distinct states is
# detected. That is a RED FLAG (deleted self-loop, MF-020), not a win -- record
# the inspected transition-level diff here to accept it.
transition_diff: ""

# REQUIRED. The narrative ledger: reasoning, measured alternatives, findings the
# machine-checked core above cannot express. Path to a document, or prose.
narrative: "specs/tickets/HP-06/results/goal-verdicts.md, specs/results/scorecards/hexagonal-prompting/RESULTS.md, specs/results/scorecards/hexagonal-prompting/PREDICTIONS-SCORED.md and specs/results/scorecards/hexagonal-prompting/FINDINGS.md. Read RESULTS.md first: two goals met, one missed, both `met` verdicts carrying a caveat that must not be separated from them, 7 PASS / 4 FAIL on thirteen sealed predictions with three of the four failures being NEGATIVE predictions, findings by channel 0 suite : 17 adversarial : 13 blind author, and twelve findings filed with none fixed -- six of which falsified a claim HP-06 had already written down and are corrected in place with the correction marked."
