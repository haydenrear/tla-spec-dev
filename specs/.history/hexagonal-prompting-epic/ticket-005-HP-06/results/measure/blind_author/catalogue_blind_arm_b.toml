# The BLIND AUTHOR's independently authored catalogue for arm B,
# copied verbatim from the channel's scratch output and re-keyed into the
# field names scripts/kill_test.py requires (target -> path, plus the
# refine_* fields the shipped parser demands). NOT ONE find/replace PAIR,
# id, class OR description WAS CHANGED.
