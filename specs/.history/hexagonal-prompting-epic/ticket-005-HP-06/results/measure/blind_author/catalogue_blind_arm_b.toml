# catalogue's mutants in prose -- filed as HP-06-DF-07.

[catalogue]
id = "HP-06-blind-author-arm-b"
root = "specs/results/scorecards/hexagonal-prompting/arms/arm_b/"

[[mutants]]
id = "BA-B01"
fault_class = "guard_relaxation"
path = "quota_ledger/domain.py"
find = "        if amount > self.available(tenant):"
replace = "        if amount > self.available(tenant) + 1:"
description = "The quota_exceeded guard is off by one, so a tenant can reserve one unit more than it has available."
observer = "The status of a reserve that asks for exactly available+1, or available(tenant) going negative afterwards."
gap_targeted = "authored blind; the author was not shown any gap declaration"
boundary_kind = "invariant"
boundary_ref = "authored-blind"
refine_variable = "available"
refine_action = "Reserve"

