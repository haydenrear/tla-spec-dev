# The BLIND AUTHOR's independently authored catalogue for arm A,
# copied verbatim from the channel's scratch output and re-keyed into the
# field names scripts/kill_test.py requires (target -> path, plus the
# refine_* fields the shipped parser demands). NOT ONE find/replace PAIR,
# id, class OR description WAS CHANGED.
#
# The author never saw examples/validation/ab/seeded_faults.toml, HP-06's
# re-anchored catalogues, or any HP-06 result. It DID disclose that
# QuotaLedger.tla and spec_manifest.yaml name several of the sealed
# catalogue's mutants in prose -- filed as HP-06-DF-07.

[catalogue]
id = "HP-06-blind-author-arm-a"
root = "specs/results/scorecards/hexagonal-prompting/arms/arm_a/"

[[mutants]]
id = "BA-A01"
fault_class = "guard_relaxation"
path = "quota_ledger.py"
find = "        if amount > found.available:"
replace = "        if amount > found.available + 1:"
description = "The quota_exceeded guard is off by one, so a tenant can reserve one unit more than it has available."
observer = "Either the status of a reserve that asks for exactly available+1, or available(tenant) going negative afterwards."
gap_targeted = "authored blind; the author was not shown any gap declaration"
boundary_kind = "invariant"
boundary_ref = "authored-blind"
refine_variable = "available"
refine_action = "Reserve"

[[mutants]]
id = "BA-A02"
fault_class = "outcome_misreport"
path = "quota_ledger.py"
find = '''            return _reject("amount_not_positive")'''
replace = '''            return _reject("quota_exceeded")'''
description = "A non-positive amount is still refused and still changes nothing, but the reason reported is quota_exceeded."
observer = "The reason field of the returned Result; no observation of program state can distinguish this from correct behaviour."
gap_targeted = "authored blind; the author was not shown any gap declaration"
boundary_kind = "invariant"
boundary_ref = "authored-blind"
refine_variable = "available"
refine_action = "Reserve"

[[mutants]]
id = "BA-A03"
fault_class = "guard_order"
path = "quota_ledger.py"
find = '''        if found.closed:
            return _reject("tenant_closed")
        if amount < 1:
            return _reject("amount_not_positive")'''
replace = '''        if amount < 1:
            return _reject("amount_not_positive")
        if found.closed:
            return _reject("tenant_closed")'''
description = "The tenant_closed check is evaluated after the amount check, so reserving a non-positive amount against a CLOSED tenant reports amount_not_positive instead of tenant_closed."
observer = "The reason field of reserve(<closed tenant>, 0) -- an input that fails two guards at once; a corpus that never doubles up on invalidity cannot see it."
gap_targeted = "authored blind; the author was not shown any gap declaration"
boundary_kind = "invariant"
boundary_ref = "authored-blind"
refine_variable = "available"
refine_action = "Reserve"

[[mutants]]
id = "BA-A04"
fault_class = "state_arithmetic"
path = "quota_ledger.py"
find = "        self._tenants[reservation.tenant].held -= reservation.amount"
replace = "        self._tenants[reservation.tenant].held -= 0"
description = "release() drops the reservation but does not return its amount to available; the quota is silently consumed forever."
observer = "available(tenant) after a release, or R1 conservation across a release."
gap_targeted = "authored blind; the author was not shown any gap declaration"
boundary_kind = "invariant"
boundary_ref = "authored-blind"
refine_variable = "available"
refine_action = "Reserve"

[[mutants]]
id = "BA-A05"
fault_class = "cross_aspect_leak"
path = "quota_ledger.py"
find = "        tenant.held -= reservation.amount"
replace = "        tenant.held -= reservation.amount * 2"
description = "commit() releases the hold twice, so the amount is both committed AND given back to available; every ledger line it writes stays byte-correct and committed() stays right."
observer = "available(tenant) after a commit -- a RESERVATIONS-aspect variable, perturbed by a LEDGER-aspect action; the ledger file and committed() are indistinguishable from correct."
gap_targeted = "authored blind; the author was not shown any gap declaration"
boundary_kind = "invariant"
boundary_ref = "authored-blind"
refine_variable = "available"
refine_action = "Reserve"

[[mutants]]
id = "BA-A06"
fault_class = "durable_content"
path = "quota_ledger.py"
find = '''        self._ledger.append(f"COMMIT {tenant.name} {reservation.amount} {total_after}")'''
replace = '''        self._ledger.append(f"COMMIT {tenant.name} {reservation.amount} {reservation.amount}")'''
description = "The fourth field of a COMMIT line carries the reservation amount instead of the running committed total."
observer = "The text of the SECOND COMMIT line for a tenant -- the first commit for any tenant is byte-identical to correct, so a single-commit trace cannot see it."
gap_targeted = "authored blind; the author was not shown any gap declaration"
boundary_kind = "invariant"
boundary_ref = "authored-blind"
refine_variable = "available"
refine_action = "Reserve"

[[mutants]]
id = "BA-A07"
fault_class = "durable_cardinality"
path = "quota_ledger.py"
find = '''        self._ledger.append(f"COMMIT {tenant.name} {reservation.amount} {total_after}")'''
replace = '''        _unwritten = f"COMMIT {tenant.name} {reservation.amount} {total_after}"'''
description = "commit() updates memory correctly but writes no durable line at all."
observer = "ledger_lines() (or the file) after a commit; every in-memory query is correct."
gap_targeted = "authored blind; the author was not shown any gap declaration"
boundary_kind = "invariant"
boundary_ref = "authored-blind"
refine_variable = "available"
refine_action = "Reserve"

[[mutants]]
id = "BA-A08"
fault_class = "durable_cardinality"
path = "quota_ledger.py"
find = '''        self._ledger.append(f"CLOSE {found.name} {found.committed}")
        found.closed = True'''
replace = '''        self._ledger.append(f"CLOSE {found.name} {found.committed}")
        self._ledger.append(f"CLOSE {found.name} {found.committed}")
        found.closed = True'''
description = "close_tenant() appends the correct CLOSE line twice, breaking R3's 'exactly one CLOSE line'."
observer = "The NUMBER of ledger lines after a close; the content of every line is correct."
gap_targeted = "authored blind; the author was not shown any gap declaration"
boundary_kind = "invariant"
boundary_ref = "authored-blind"
refine_variable = "available"
refine_action = "Reserve"

[[mutants]]
id = "BA-A09"
fault_class = "durable_extra_write"
path = "quota_ledger.py"
find = '''        del self._outstanding[reservation_id]
        self._tenants[reservation.tenant].held -= reservation.amount
        return _accept()'''
replace = '''        del self._outstanding[reservation_id]
        self._tenants[reservation.tenant].held -= reservation.amount
        self._ledger.append(f"RELEASE {reservation.tenant} {reservation.amount}")
        return _accept()'''
description = "release() appends a RELEASE line, though the feature says a release writes nothing to the ledger."
observer = "ledger_lines() after a release; all numeric state is correct."
gap_targeted = "authored blind; the author was not shown any gap declaration"
boundary_kind = "invariant"
boundary_ref = "authored-blind"
refine_variable = "available"
refine_action = "Reserve"

[[mutants]]
id = "BA-A10"
fault_class = "id_allocation"
path = "quota_ledger.py"
find = "        self._next_sequence += 1"
replace = "        self._next_sequence = len(self._outstanding) + 2"
description = "The id counter is rebased on the number of live reservations, so ids are still ascending within a burst but are REUSED once earlier reservations have been resolved."
observer = "The id returned by a reserve that follows a commit or release of every prior reservation -- i.e. you must resolve reservations and then reserve again and look at the id."
gap_targeted = "authored blind; the author was not shown any gap declaration"
boundary_kind = "invariant"
boundary_ref = "authored-blind"
refine_variable = "available"
refine_action = "Reserve"

[[mutants]]
id = "BA-A11"
fault_class = "query_projection"
path = "quota_ledger.py"
find = "                self._outstanding.values(), key=lambda held: held.sequence"
replace = "                self._outstanding.values(), key=lambda held: held.reservation_id"
description = "outstanding_ids() sorts by the id STRING rather than by allocation order, so the order is wrong once a tenth id exists ('r10' < 'r2')."
observer = "outstanding_ids() with ten or more simultaneously live reservations; with nine or fewer the two orders coincide exactly."
gap_targeted = "authored blind; the author was not shown any gap declaration"
boundary_kind = "invariant"
boundary_ref = "authored-blind"
refine_variable = "available"
refine_action = "Reserve"

[[mutants]]
id = "BA-A12"
fault_class = "rejection_side_effect"
path = "quota_ledger.py"
find = '''        if any(held.tenant == tenant for held in self._outstanding.values()):
            return _reject("outstanding_reservations")'''
replace = '''        if any(held.tenant == tenant for held in self._outstanding.values()):
            self._ledger.append(f"CLOSE {found.name} {found.committed}")
            return _reject("outstanding_reservations")'''
description = "close_tenant() writes the CLOSE line before discovering the tenant still has outstanding reservations, then rejects -- a durable write on a rejected path (R4)."
observer = "ledger_lines() across a REJECTED close; the returned Result and every in-memory query are correct."
gap_targeted = "authored blind; the author was not shown any gap declaration"
boundary_kind = "invariant"
boundary_ref = "authored-blind"
refine_variable = "available"
refine_action = "Reserve"

[[mutants]]
id = "BA-A13"
fault_class = "durable_encoding"
path = "quota_ledger.py"
find = '''            handle.write(line + "\n")'''
replace = '''            handle.write("\n" + line)'''
description = "The ledger writes a leading newline instead of a trailing one, so the file is no longer newline-terminated and the next appender would concatenate onto the last record."
observer = "The BYTES of the ledger file. ledger_lines() strips blanks and returns the identical list, so any oracle that reads the durable side through the program's own accessor is blind to it."
gap_targeted = "authored blind; the author was not shown any gap declaration"
boundary_kind = "invariant"
boundary_ref = "authored-blind"
refine_variable = "available"
refine_action = "Reserve"
