# Blind fault catalogue for implementation ONE (artifact_P).
#
# Written without sight of any catalogue this project already has. The taxonomy
# in `fault_class` is my own; it is organised by WHAT WENT WRONG IN THE HEAD OF
# THE ENGINEER, not by which line changed, because that is what decides whether
# a given kind of checking can see it.
#
# The same fifteen classes are instantiated in catalogue_Q.toml, so that a
# per-arm score is a comparison of two implementations and not of two
# catalogues. Where an implementation's shape forces a different edit to
# produce the same behavior change, `semantic` is the field that is held equal.
#
# `observation` names a driver in ./observations.py. Every mutant has one, and
# VERIFY.md records the clean-vs-mutated difference it produced. A mutant with
# no separating observation was dropped and is in REJECTED.md.

[catalogue]
id = "BLIND-AUTHOR-P"
anchored_on = "quota_ledger.py"

# --------------------------------------------------------------------------
# guard faults -- the engineer got the admission test wrong
# --------------------------------------------------------------------------

[[mutants]]
id = "BA-P01"
fault_class = "guard_order_inversion"
gap_targeted = "Any corpus in which no single call trips two guards at once. Each guard is individually right, so every input that violates exactly one rule still gets the right reason; only an input that is BOTH closed and non-positive separates them. Also invisible to any oracle that checks status without checking reason."
boundary_kind = "invariant"
boundary_ref = "reserve -- 'Rejects, in this order' (tenant_closed precedes amount_not_positive)"
refine_variable = "reason"
refine_action = "RefuseReserveClosed"
observation = "C01_guard_order"
path = "quota_ledger.py"
find = '''
        if self.is_closed(tenant):
            return Result.rejected(TENANT_CLOSED)
        if amount < 1:
            return Result.rejected(AMOUNT_NOT_POSITIVE)'''
replace = '''
        if amount < 1:
            return Result.rejected(AMOUNT_NOT_POSITIVE)
        if self.is_closed(tenant):
            return Result.rejected(TENANT_CLOSED)'''
description = "reserve checks amount before closedness, inverting two of the four declared rejection precedences."
semantic = "A reserve that is both against a closed tenant and non-positive reports amount_not_positive instead of tenant_closed. Every single-fault input is unaffected."

[[mutants]]
id = "BA-P02"
fault_class = "guard_boundary_shift"
gap_targeted = "Coverage that never reserves EXACTLY the amount still available. Off-by-one at a boundary is only visible at the boundary; a corpus of round numbers against a large quota never lands on it."
boundary_kind = "invariant"
boundary_ref = "reserve -- 'quota_exceeded -- amount is greater than available(tenant)'"
refine_variable = "available"
refine_action = "Reserve"
observation = "C02_boundary"
path = "quota_ledger.py"
find = "        if amount > self._available[tenant]:"
replace = "        if amount >= self._available[tenant]:"
description = "reserve rejects an amount equal to the remaining availability."
semantic = "The last unit of a tenant's quota becomes unreservable: a reserve for exactly available(tenant) is refused as quota_exceeded. Strictly smaller reserves are unaffected."

[[mutants]]
id = "BA-P03"
fault_class = "guard_relaxation"
gap_targeted = "Any corpus built from accepting edges alone. If the program is never asked to refuse, a refusal that stops happening is not an observable event. Also survives a state-only oracle when amount is 0, because accepting a 0 leaves every numeric variable where it was -- only the reservation-id set and the reported status move."
boundary_kind = "invariant"
boundary_ref = "reserve -- 'amount_not_positive -- amount is less than 1'"
refine_variable = "live"
refine_action = "RefuseReserveNotPositive"
observation = "C03_relaxation"
path = "quota_ledger.py"
find = '''
        if amount < 1:
            return Result.rejected(AMOUNT_NOT_POSITIVE)'''
replace = '''
        if amount < 0:
            return Result.rejected(AMOUNT_NOT_POSITIVE)'''
description = "reserve admits a zero amount, allocating a real reservation id for nothing."
semantic = "reserve(t, 0) is accepted and burns a reservation id on a zero-sized hold. Negative amounts are still refused, so the reason vocabulary looks intact."

[[mutants]]
id = "BA-P04"
fault_class = "guard_basis_confusion"
gap_targeted = "Single-reservation corpora. The first reserve against a fresh tenant behaves identically because available == quota at that moment; the fault only shows on the second reserve, so any corpus whose sequences are one command deep cannot reach it."
boundary_kind = "invariant"
boundary_ref = "R1 -- conservation"
refine_variable = "available"
refine_action = "Reserve"
observation = "C04_basis"
path = "quota_ledger.py"
find = "        if amount > self._available[tenant]:"
replace = "        if amount > self._quotas[tenant]:"
description = "reserve checks the amount against the tenant's whole quota instead of what is left of it."
semantic = "Reservations can be granted past the quota: two 6-unit holds succeed against a quota of 10 and available goes negative. Conservation is broken while nothing is rejected."

[[mutants]]
id = "BA-P05"
fault_class = "reason_substitution"
gap_targeted = "Anything derived from QuotaLedger.tla. Tenants is a CONSTANT set, so an unknown tenant is not a reachable input in the model and there is no unknown_tenant refusal edge to relax; a model-derived corpus cannot construct the input, and a model-derived oracle has no proposition about it. Only the requirement text and a hand-written case know the reason exists."
boundary_kind = "invariant"
boundary_ref = "reserve -- 'unknown_tenant -- no such tenant', and R4's six-reason vocabulary"
refine_variable = "reason"
refine_action = "(none -- QuotaLedger.tla has no unknown-tenant edge)"
observation = "C05_reason"
path = "quota_ledger.py"
find = '''
        if tenant not in self._quotas:
            return Result.rejected(UNKNOWN_TENANT)
        if self.is_closed(tenant):
            return Result.rejected(TENANT_CLOSED)
        if amount < 1:'''
replace = '''
        if tenant not in self._quotas:
            return Result.rejected(TENANT_CLOSED)
        if self.is_closed(tenant):
            return Result.rejected(TENANT_CLOSED)
        if amount < 1:'''
description = "reserve reports an unknown tenant as tenant_closed."
semantic = "The refusal still happens and still changes nothing; the caller is told the tenant is closed rather than that it does not exist. close_tenant still reports unknown_tenant, so the two commands now disagree about the same tenant."

# --------------------------------------------------------------------------
# effect faults -- the guard was right and the transition was not
# --------------------------------------------------------------------------

[[mutants]]
id = "BA-P06"
fault_class = "effect_misrouted_conservation_preserving"
gap_targeted = "R1 alone. This one is deliberately built to keep conservation TRUE: the amount leaves the hold and lands in committed, so available + held + committed still equals quota at every step. Only a rule that relates memory to the DURABLE side (R2) or a case that names available and committed separately can see it. A conservation-only invariant scores this a pass."
boundary_kind = "invariant"
boundary_ref = "R2 -- the durable ledger agrees with memory; release -- 'returns its amount to available. Writes nothing to the ledger.'"
refine_variable = "committed"
refine_action = "Release"
observation = "C06_release"
path = "quota_ledger.py"
find = '''
        self._available[reservation.tenant] += reservation.amount
        del self._reservations[reservation_id]'''
replace = '''
        self._committed[reservation.tenant] += reservation.amount
        del self._reservations[reservation_id]'''
description = "release credits the amount to committed instead of returning it to available."
semantic = "A released hold is counted as committed. committed(t) rises with no COMMIT line behind it, so memory and the durable ledger disagree, while total conservation still holds exactly."

[[mutants]]
id = "BA-P07"
fault_class = "cross_aspect_write"
gap_targeted = "Any view that projects only the ledger side. The cause is inside Commit -- a ledger-aspect action whose written line stays byte-perfect -- and the symptom lands on available, a reservations-aspect variable. A slice that contains Commit but not available, or contains available but not Commit, is blind by construction; only the whole view sees both ends."
boundary_kind = "invariant"
boundary_ref = "commit -- 'available(tenant) is not changed', and R1 -- conservation"
refine_variable = "available"
refine_action = "Commit"
observation = "C07_commit_refund"
path = "quota_ledger.py"
find = '''
        self._committed[reservation.tenant] = total_after
        del self._reservations[reservation_id]'''
replace = '''
        self._committed[reservation.tenant] = total_after
        self._available[reservation.tenant] += reservation.amount
        del self._reservations[reservation_id]'''
description = "commit gives the hold back to available as well as counting it as committed."
semantic = "Committing refunds the reservation. The tenant can spend the same quota twice; every ledger line written remains correct in isolation."

[[mutants]]
id = "BA-P08"
fault_class = "durable_content_running_total"
gap_targeted = "Any effect mapping that records THAT a durable write happened without asserting WHAT it said. The port is called, once, on the right action, with the right tenant and the right amount -- only the fourth field is wrong. A call-counting or arity-checking mapping passes this."
boundary_kind = "port"
boundary_ref = "R2 -- 'the running total on each COMMIT line equals the sum of that tenant's COMMIT amounts up to and including that line'"
refine_variable = "ledger"
refine_action = "Commit"
observation = "C08_running_total"
path = "quota_ledger.py"
find = '''f"COMMIT {reservation.tenant} {reservation.amount} {total_after}"'''
replace = '''f"COMMIT {reservation.tenant} {reservation.amount} {reservation.amount}"'''
description = "the COMMIT line repeats the amount where the running total belongs."
semantic = "Each COMMIT line's fourth field is that commit's own amount rather than the tenant's total to date. The first commit of a tenant is indistinguishable from correct; the second and later ones are wrong. Memory is untouched."

[[mutants]]
id = "BA-P09"
fault_class = "durable_content_close_total"
gap_targeted = "Same silent-mapping gap as BA-P08, plus: a corpus that closes tenants only at quota exhaustion never separates 'committed' from 'quota', because at exhaustion they are the same number. The fault needs a close after a PARTIAL commit."
boundary_kind = "port"
boundary_ref = "R3 -- 'exactly one CLOSE line, whose total equals committed(tenant)'"
refine_variable = "ledger"
refine_action = "CloseTenant"
observation = "C09_close_total"
path = "quota_ledger.py"
find = '''f"CLOSE {tenant} {self._committed[tenant]}"'''
replace = '''f"CLOSE {tenant} {self._quotas[tenant]}"'''
description = "the CLOSE line records the tenant's quota instead of its committed total."
semantic = "A closed tenant's final durable total overstates what was committed, unless the tenant happened to commit its entire quota. Memory is untouched and the line count is right."

[[mutants]]
id = "BA-P10"
fault_class = "accumulator_overwrite"
gap_targeted = "Single-commit sequences. One commit per tenant is exactly the case where assignment and accumulation agree, so a corpus of short traces or one-shot cases scores this a pass. Needs two commits on the SAME tenant."
boundary_kind = "invariant"
boundary_ref = "commit -- 'increases committed(tenant) by the reservation's amount'; R1, R2"
refine_variable = "committed"
refine_action = "Commit"
observation = "C10_accumulator"
path = "quota_ledger.py"
find = "        total_after = self._committed[reservation.tenant] + reservation.amount"
replace = "        total_after = reservation.amount"
description = "commit assigns the new committed total instead of adding to it."
semantic = "committed(t) becomes the amount of the most recent commit rather than the sum of all of them. Conservation and the durable running totals both break, consistently with each other -- memory and the ledger agree on the wrong number."

[[mutants]]
id = "BA-P11"
fault_class = "identity_reuse"
gap_targeted = "Corpora that never resolve a reservation before allocating the next one. The ids stay distinct as long as nothing is committed or released; the collision needs an allocate-after-resolve. A model whose ResIds are drawn from a small set and whose 'never reused' condition is a guard rather than a checked property also lets it through."
boundary_kind = "invariant"
boundary_ref = "reserve -- 'Ids are allocated r1, r2, r3, ... in order of acceptance and are never reused'"
refine_variable = "holder"
refine_action = "Reserve"
observation = "C11_id_reuse"
path = "quota_ledger.py"
find = '''
        seq = self._next_seq
        self._next_seq += 1'''
replace = '''
        seq = len(self._reservations) + 1'''
description = "reservation ids are numbered from the count of live reservations, so an id is reused once its predecessor is resolved."
semantic = "After a commit or release, the freed id is handed out again. Two different holds can share an id, and a later commit can silently overwrite a live reservation."

[[mutants]]
id = "BA-P12"
fault_class = "rejection_not_inert"
gap_targeted = "Every oracle that reads only status and reason on a refused call. The refusal is correct -- right status, right reason, right vocabulary -- and the damage is to a variable nobody looks at ACROSS a rejection. Note the model's RejectionIsInert says only `status = \"rejected\" => reason # \"none\"`, which this mutant satisfies; the invariant's name promises more than its body checks."
boundary_kind = "invariant"
boundary_ref = "R4 -- 'A command that returns status == rejected performs no state change'"
refine_variable = "available"
refine_action = "RefuseReserveOverQuota"
observation = "C12_rejection_inert"
path = "quota_ledger.py"
find = '''
        if amount > self._available[tenant]:
            return Result.rejected(QUOTA_EXCEEDED)

        reservation = self._allocate(tenant, amount)
        self._available[tenant] -= amount'''
replace = '''
        self._available[tenant] -= amount
        if self._available[tenant] < 0:
            return Result.rejected(QUOTA_EXCEEDED)

        reservation = self._allocate(tenant, amount)'''
description = "reserve deducts first and refuses afterwards, leaving the deduction in place on the refused path."
semantic = "An over-quota reserve is still refused with quota_exceeded, but the tenant's availability is permanently reduced by the amount that was refused. Accepted reserves behave identically."

# --------------------------------------------------------------------------
# durable-medium faults -- the record itself
# --------------------------------------------------------------------------

[[mutants]]
id = "BA-P13"
fault_class = "append_only_violation"
gap_targeted = "Any check that reads back only the LAST line, or that asserts the most recent write rather than the whole sequence. Single-write traces are entirely unaffected. The port is still called once per accepting action with the correct content."
boundary_kind = "port"
boundary_ref = "R5 -- 'the ledger is append-only and ordered. Nothing is ever rewritten, reordered, or removed.'"
refine_variable = "ledger"
refine_action = "Commit"
observation = "C13_append_only"
path = "quota_ledger.py"
find = '''        with self._path.open("a", encoding="utf-8") as handle:'''
replace = '''        with self._path.open("w", encoding="utf-8") as handle:'''
description = "the durable writer truncates the file on every write, so only the newest record survives."
semantic = "The durable ledger holds exactly one line -- the last one written. Everything committed or closed earlier is destroyed on disk."

[[mutants]]
id = "BA-P14"
fault_class = "observation_order_violation"
gap_targeted = "The single-digit ceiling. Lexicographic and numeric order agree on r1..r9, and every hand-written case I can imagine stops well short of ten live reservations, so the fault is unreachable unless a corpus deliberately goes past r9. The model makes it worse: ResIds is a small CONSTANT set, so a model-derived corpus can never allocate a tenth id."
boundary_kind = "invariant"
boundary_ref = "outstanding_ids() -- 'the ids of all live reservations, ascending'"
refine_variable = "live"
refine_action = "Reserve"
observation = "C14_outstanding_order"
path = "quota_ledger.py"
find = "            for reservation in sorted(self._reservations.values(), key=lambda r: r.seq)"
replace = "            for reservation in sorted(self._reservations.values(), key=lambda r: r.reservation_id)"
description = "outstanding_ids sorts ids as strings, so r10 comes before r2."
semantic = "Once ten reservations have been allocated, the reported order of live reservations is lexicographic rather than allocation order. Fewer than ten, the two orders coincide exactly."

[[mutants]]
id = "BA-P15"
fault_class = "construction_not_empty"
gap_targeted = "Every harness that hands the constructor a fresh temporary path -- which is every harness I have seen, because tmp_path is the obvious fixture. The fault needs a pre-existing file at the ledger path, which no generated corpus will produce because the ledger path is not part of the modeled state. This is the class I most expect nothing to catch."
boundary_kind = "port"
boundary_ref = "'The ledger file starts empty', and R2 -- the durable ledger agrees with memory"
refine_variable = "ledger"
refine_action = "Init"
observation = "C15_construction"
path = "quota_ledger.py"
find = '''        self._path.write_text("", encoding="utf-8")'''
replace = "        self._path.touch()"
description = "construction creates the ledger file but does not empty an existing one."
semantic = "A ledger constructed over an existing file inherits its lines. The reader immediately observes COMMIT and CLOSE records for totals memory says are zero, so R2 and R3 are false from the first observation, with no command having run."
