# Complexity ledger input -- MF-019 standing objective.
#
# `close ticket` refuses until this is filled in. That refusal is the mechanism:
# the standing objective is a required close-out step, not a stance.
#
# The delta is computed for you from `analyze complexity` and the TLC report.
# What you supply is the part a tool cannot know: whether behavior was retained,
# what the refinement search found, and why any increase is essential.

# Retention evidence -- the doctrine's three-member constraint set. A complexity
# DECREASE is REJECTED unless all three are retained. Absent or unknown evidence
# does NOT pass: an unmeasured constraint cannot witness retention.
retention:
  # NOT RE-MEASURED by MF-030, and said so rather than asserting a pass. This
  # ticket changes scripts/analyze_complexity.py only: it touches no TLA+ file
  # (git diff of '*.tla'/'*.cfg' vs origin/epic/modular-fuzzing is empty), no
  # adapter, and no generated case. TLC re-measured 231,621 distinct / depth 25
  # / bound 699,840 (70.0%), identical to MF-029. There is no mechanism by which
  # it could move any of the three, so MF-029's verdicts are carried forward
  # verbatim, all NON-PASSING and left non-passing.
  kill_rate:
    status: "incomplete_catalog"
    evidence: "CARRIED FORWARD from MF-029 (specs/.history/modular-fuzzing-epic/ticket-015-MF-029/ticket/results/complexity_ledger.yaml). No kill rate is computable while case execution is blocked. MF-030 is an analyzer change and does not re-measure or claim improvement."
  effect_conformance:
    status: "unobservable"
    evidence: "CARRIED FORWARD from MF-029. Adapters drive the CLI via subprocess; the sandbox observes only the in-process CPython runtime, so the target is structurally invisible. MF-027's refusal stands. MF-030 touches no adapter and no observation boundary."
  external_coverage:
    status: "incomplete"
    evidence: "CARRIED FORWARD from MF-029. 72.5% of the corpus has a before-state this repository cannot materialize. MF-030 adds no runnable case; it corrects how EXTENDS-decomposed models are scored, which is orthogonal to external coverage."

