    "objective": "Two bundled changes that both touch the model and the budgets block, so they land as one TlaSpecDevCli.tla touch. (1) GATE RECALIBRATION: MF-011 gates the static state-space upper bound against max_distinct_states, but the quantities are incommensurable \u2014 on this repo the bound is 1,179,648 while actual reachable distinct states are 2,923, a ~400x over-approximation, so the gate FAILS a model that is 17x UNDER its own budget. Decisive evidence of miscalibration: applying the only reduction the tool itself recommends (setup_phase) yields a bound of 73,728, which STILL fails the 50,000 budget \u2014 a gate its own recommended optimum cannot satisfy is wrong by construction. Add a distinct max_state_space_bound budget for the static estimate and gate the bound against it; keep max_distinct_states for post-TLC comparison against actual reachable states. The error originated in the MF-011 spec, not its implementation. (2) SETUP_PHASE COLLAPSE: owner-approved architectural move, found independently by both the MF-020 and MF-011 agents \u2014 collapse cli_built / cli_installed / project_scaffolded / budgets_recorded / workflow_scaffolded into a single ordinal setup_phase in 0..5. They form a strict bootstrap chain pinned by their own action guards, so only 6 of 32 combinations are reachable. Measured: 11 -> 7 variables and declared bound 393,216 -> 73,728 at identical reachable states. See tickets/022-gate-recalibration-and-setup-phase.md.",
