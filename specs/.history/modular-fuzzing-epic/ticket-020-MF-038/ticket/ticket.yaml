    "objective": "INVESTIGATION TICKET, deliverable is a measured kill rate not a feature. Answers the one question the fuzzing value-proposition rests on and never answered against a runnable corpus: DO THE GENERATED CASES CATCH REAL BUGS? The kill test (MF-016) is the only instrument that measures bug-catching power and has never produced a real number here -- its worked example was synthetic (4/7 on a toy), and against the real corpus it control_failed because no case ran. MF-031/MF-032 made ~10% of the corpus (the filesystem-mutating commands) executable, so the experiment is finally possible. Establish a GREEN CONTROL first (unmutated runnable corpus must pass, or the rate is meaningless -- report and stop). Seed >=10 realistic bugs across the runnable adapters (ScaffoldProject, ScaffoldWorkflow, RecordBudgets, OpenTicket, InstallLocalCli, UpdateTicketDesired/Current), spanning obvious (wrong file, wrong output) and SUBTLE (off-by-one count, plausible-but-wrong phase, neighbouring budget default, dropped field) -- the subtle ones are the real test and trivial-only seeding inflates the rate. Run cases against each mutant; a mutant is killed if some oracle (output/projected-state/effect conformance) catches the divergence. Report the kill rate, per-bug kill/survive, and for each survivor WHY the cases missed it. HONEST-OUTCOME RULE: a low kill rate is a valid valuable result -- do not tune it, do not seed only catchable bugs, do not delete a survivor; MF-016 nearly shipped a spurious perfect rate and caught itself. Recommend whether model-derived conformance testing is worth shipping as case-advising based on the number. See tickets/038-kill-rate-probe.md.",
