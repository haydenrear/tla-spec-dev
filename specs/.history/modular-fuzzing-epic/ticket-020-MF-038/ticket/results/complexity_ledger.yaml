# Complexity ledger input -- MF-019 standing objective.
#
# `close ticket` refuses until this is filled in. That refusal is the mechanism:
# the standing objective is a required close-out step, not a stance.
#
# The delta is computed for you from `analyze complexity` and the TLC report.
# What you supply is the part a tool cannot know: whether behavior was retained,
# what the refinement search found, and why any increase is essential.

# Retention evidence -- the doctrine's three-member constraint set. A complexity
# DECREASE is REJECTED unless all three are retained. Absent or unknown evidence
# does NOT pass: an unmeasured constraint cannot witness retention.
#
#   kill_rate:           pass | below_floor | incomplete_catalog   (MF-016)
#   effect_conformance:  clean | gaps | dead_surface | unobservable (MF-013/MF-027)
#   external_coverage:   pass | gaps | incomplete                  (MF-015)
#
# NOTE: `unobservable` IS NOT `clean`. MF-027 made the effect oracle refuse
# targets it cannot see; treating that as passing here would rebuild the silence.
retention:
  kill_rate:
    status: "TODO"
    evidence: "TODO -- path to the kill-test report"
  effect_conformance:
    status: "TODO"
    evidence: "TODO -- path to the effect-conformance report"
  external_coverage:
    status: "TODO"
    evidence: "TODO -- path to the external coverage report"

# Coverage audit -- MF-026. The completeness gate, distinct from the three
# retention members above, which are all FIDELITY measures bounded to what is
# already modeled. Unmodeled surface is invisible to every one of them.
#
#   status: pass | fail | incomplete | not_run
#
# `not_run` is the CORRECT value at a ticket close: the audit is an end-of-epic
# step, run after the mechanism tickets land and before final integration. It is
# recorded and reported either way so that an epic which skipped it is visible.
# At WORKFLOW close anything but `pass` REFUSES -- and `incomplete` IS NOT
# `pass`, because a sweep that did not walk the surface says nothing about it.
#
# Procedure: prompts/coverage_audit.md   Doctrine: references/coverage_audit.md
coverage_audit:
  status: "not_run"
  report: ""          # path to the filled templates/coverage_audit_report.md
  in_scope_gaps: null # count; in-scope gaps are HARD -- model it or change the program
  scope_source: ""    # plan file:lines the declared scope was READ from, never chosen

# Required if complexity INCREASED. Name the new essential behavior the added
# representation carries. This documents real behavior; it does not waive the
# increase, which is recorded and reported either way.
justification: ""

# The recursive refinement loop -- REQUIRED at every close.
# Either an approved recommendation with evidence, or "searched, found none".
# Recommendations are advisory and user-approved, never auto-applied.
refinement:
  searched: true
  outcome: "none"
  detail: >-
    MF-038 is an investigation ticket that adds NO TLA+ model or production code
    -- only a results-local measurement harness, a mutant catalog, and evidence
    under specs/tickets/MF-038/results. The complexity delta is zero (variables
    9, actions 14, distinct 231,621, depth 25 -- identical to the MF-033 tip), so
    there is no added representation to refine and no abstraction to simplify.
    Searched for a smaller representation that would still support the probe:
    none applies, because the probe measures the EXISTING corpus's kill power
    rather than changing the model. The refinement this probe DID surface is a
    model-deepening recommendation (project file/field content into model
    variables so subtle bugs are killable); it is advisory, user-approved, and
    belongs to MF-023's surface, not to this measurement ticket.
  measured: true       # TLC ran on ticket current: 231,621 distinct / depth 25
  applied: false       # advisory only; no model change applied here
  approved_by: ""

# Required only if a generated-states drop at constant distinct states is
# detected. That is a RED FLAG (deleted self-loop, MF-020), not a win -- record
# the inspected transition-level diff here to accept it.
transition_diff: ""

# REQUIRED. The narrative ledger: reasoning, measured alternatives, findings the
# machine-checked core above cannot express. Path to a document, or prose.
narrative: >-
  MF-038 measured the one number the modular-fuzzing value proposition rests on:
  do the generated cases catch real bugs? Control on the reduced runnable corpus
  (14 representative cases spanning every runnable filesystem command) was GREEN,
  so the measurement is meaningful (MF-016's own safeguard). Kill rate = 4/13 =
  0.308. The four killed mutants are all STRUCTURAL bugs that change which
  directory or lifecycle tree gets created (wrong program_model dir, wrong
  desired_program_model dir, wrong tickets/<id> dir, ticket desired-tree never
  created); three were caught via before-state replay divergence and one (open
  ticket wrong dir) via a clean projected ticket_state conformance mismatch. All
  NINE subtle bugs SURVIVED: empty Internal.tla, wrong manifest enums
  (model_role, workflow), three neighbouring/off-by-one budget defaults, a
  wrong manifest field value, a wrong ticket_plan phase enum, and a misplaced
  results/.gitkeep. Root cause is uniform: the adapters project a real repository
  into 9 model variables that are functions of directory/file EXISTENCE and exit
  codes only -- no oracle reads file content, a budget value, a manifest field,
  an enum, or a count. The cases are existence-and-exit-code oracles, not content
  oracles. Full analysis and the per-survivor refine_variable/refine_action
  pointers: results/kill-rate-report.md and results/kill-rate-report.json.
  Recommendation to the owner: NOT yet ship-worthy as "case advising" on
  bug-catching strength (0.308, and lower under a realistically subtle catalog);
  the highest-value deepening is to project the CONTENT the commands produce
  (budget block, manifest status/model_role, ticket_plan phase) into model
  variables so those survivors become killable. The number was not tuned in any
  direction: 9 of 13 mutants are subtle and all 9 survived; no threshold lowered,
  no survivor deleted, ignored_suppression_keys none. Validation matrix green:
  TLC 231,621 distinct / depth 25 (zero delta), spec-unit 63+60 passed, repo
  units 526 passed (>=522 baseline), specWorkflow 8/8, cliWorkflow 2/2.
