# Complexity ledger input -- MF-019 standing objective.
#
# `close ticket` refuses until this is filled in. That refusal is the mechanism:
# the standing objective is a required close-out step, not a stance.
#
# The delta is computed for you from `analyze complexity` and the TLC report.
# What you supply is the part a tool cannot know: whether behavior was retained,
# what the refinement search found, and why any increase is essential.

# Retention evidence -- the doctrine's three-member constraint set. A complexity
# DECREASE is REJECTED unless all three are retained. Absent or unknown evidence
# does NOT pass: an unmeasured constraint cannot witness retention.
#
#   kill_rate:           pass | below_floor | incomplete_catalog   (MF-016)
#   effect_conformance:  clean | gaps | dead_surface | unobservable (MF-013/MF-027)
#   external_coverage:   pass | gaps | incomplete                  (MF-015)
#
# NOTE: `unobservable` IS NOT `clean`. MF-027 made the effect oracle refuse
# targets it cannot see; treating that as passing here would rebuild the silence.
retention:
  # NOT RE-MEASURED by MF-029, and said so rather than asserting a pass. This
  # ticket adds no representation (delta is zero), touches no TLA+ file, and
  # touches no adapter -- so there is no mechanism by which it could move any of
  # the three. MF-028's measurements are carried forward verbatim with their
  # original verdicts, which are all NON-PASSING and are left non-passing here.
  kill_rate:
    status: "incomplete_catalog"
    evidence: "CARRIED FORWARD from MF-028 (specs/.history/modular-fuzzing-epic/ticket-014-MF-028/ticket/results/complexity_ledger.yaml). No kill rate is computable while case execution is blocked. MF-029 did not re-measure and does not claim improvement."
  effect_conformance:
    status: "unobservable"
    evidence: "CARRIED FORWARD from MF-028. Adapters drive the CLI via subprocess.run; the sandbox observes only the in-process CPython runtime, so the target is structurally invisible. MF-027's refusal stands. MF-029 changes generated case PARAMETERS only and no adapter consumes them yet, so the observability barrier is untouched."
  external_coverage:
    status: "incomplete"
    evidence: "CARRIED FORWARD from MF-028. 72.5% of the corpus has a before-state this repository cannot materialize. MF-029 makes the arguments available for when those adapters land (that is its whole purpose) but does not itself make any additional case runnable."

# Coverage audit -- MF-026. The completeness gate, distinct from the three
# retention members above, which are all FIDELITY measures bounded to what is
# already modeled. Unmodeled surface is invisible to every one of them.
#
#   status: pass | fail | incomplete | not_run
#
# `not_run` is the CORRECT value at a ticket close: the audit is an end-of-epic
# step, run after the mechanism tickets land and before final integration. It is
# recorded and reported either way so that an epic which skipped it is visible.
# At WORKFLOW close anything but `pass` REFUSES -- and `incomplete` IS NOT
# `pass`, because a sweep that did not walk the surface says nothing about it.
#
# Procedure: prompts/coverage_audit.md   Doctrine: references/coverage_audit.md
coverage_audit:
  status: "not_run"
  report: ""          # path to the filled templates/coverage_audit_report.md
  in_scope_gaps: null # count; in-scope gaps are HARD -- model it or change the program
  scope_source: ""    # plan file:lines the declared scope was READ from, never chosen

# Required if complexity INCREASED. Name the new essential behavior the added
# representation carries. This documents real behavior; it does not waive the
# increase, which is recorded and reported either way.
justification: >-
  No representation added and none needed. MF-029 is deliberately a GENERATOR
  change, not a model change: parameters are recovered from each case's own
  before/after state pair, which the generator already held. TLC re-measured at
  231,621 distinct / depth 25 / bound 699,840 (70.0%), identical to the MF-028
  baseline, and `git diff origin/epic/modular-fuzzing -- '*.tla' '*.cfg'` is
  empty. Zero delta is the required outcome here, not merely an acceptable one:
  the owner rejected a lastInternalAction marker precisely because
  max_state_space_bound is at 70% and MF-019 proved a single boolean variable
  breaches it.

# The recursive refinement loop -- REQUIRED at every close.
# Either an approved recommendation with evidence, or "searched, found none".
# Recommendations are advisory and user-approved, never auto-applied.
refinement:
  searched: true
  outcome: "none"
  detail: >-
    Searched, and found none this ticket should apply. The analyzer's standing
    recommendation remains to project [lastCommand, result], which no configured
    invariant reads. MF-028 recorded a strong second argument for it and still
    declined; that reasoning is unchanged and MF-029 adds no new evidence for or
    against it. MF-029 adds one argument AGAINST applying it now: this ticket
    makes action arguments available to adapters for the first time, so the next
    tickets will be extending what a case genuinely checks. Shrinking the checked
    surface in the same window as widening it would confound the two effects and
    make the resulting kill-rate movement uninterpretable. Deferred to MF-023,
    where decomposition revisits the projection with per-component state spaces.
    Doctrine also bars it independently: a DECREASE requires all three retention
    members retained, and all three are non-passing above.
  measured: false      # true only if a real TLC run produced the figure
  applied: false       # if true, approved_by is required
  approved_by: ""

# Required only if a generated-states drop at constant distinct states is
# detected. That is a RED FLAG (deleted self-loop, MF-020), not a win -- record
# the inspected transition-level diff here to accept it.
transition_diff: ""

# REQUIRED. The narrative ledger: reasoning, measured alternatives, findings the
# machine-checked core above cannot express. Path to a document, or prose.
narrative: "specs/tickets/MF-029/results/recoverability_audit.md"
