    "objective": "All 57,617 generated cases carry params={} -- the generator records THAT an action fired, not WITH WHAT. Until fixed, every downstream adapter fix buys reachability testing rather than argument testing, which for a CLI is most of the point. THIS IS A GENERATOR CHANGE, NOT A MODEL CHANGE. Adding a lastInternalAction marker was considered and REJECTED by the owner: unnecessary, because parameters are recoverable from the case own before/after state pair which the generator already has; and unaffordable, because max_state_space_bound is at 70% and MF-019 proved a boolean variable breaches it, so a marker carrying action names plus argument bindings would force decomposition before it could land. Being generator-side is also what makes this experimental and cheaply revertible, an explicit condition of approval -- nothing in the spec changes and reverting is deleting a function. Recovery verified across three mechanisms: GUARD-PINNED (OpenTicket root, via the guard root = spec_root), EXCEPT-INDEX (ticket, via ticket_state EXCEPT ![ticket]), and WRITTEN-THROUGH (ScaffoldProject root, via spec_root in the after-state). THE TRAP: MF-028 wrote a tautology into its own work, defaulting spec_root from case.after then checking against case.after, which passed vacuously and was caught only because a negative control that should have failed passed. Derive from the BEFORE-state and the transition, never from the field being checked; mark unrecoverable parameters UNCHECKED rather than fabricating a value; and require a negative control per action, because a check that cannot fail is not a check. See tickets/029-infer-action-parameters.md.",
