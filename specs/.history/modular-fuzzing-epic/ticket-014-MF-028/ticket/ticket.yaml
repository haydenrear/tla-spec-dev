    "objective": "INVESTIGATION TICKET -- the deliverable is a measured answer, not a finished feature. MF-023 dogfooding found that no adapter can execute a generated case (FINDING 4). run_generated_case_adapters.py drives each case through an adapter run(case, ...); all 16 adapter classes implement apply(target_repo, ...) and not one implements run. The two paths never met -- the spec-unit suite calls apply() directly, so the adapters are thoroughly tested and simultaneously unreachable from the corpus, and case execution was deferred in every ticket of this epic so no run crossed the seam. THREE OF FOUR ORACLES THEREFORE PRODUCE NO SIGNAL AT ALL -- effect conformance reports 0 observed effects over 40 cases with all 5 ports dead, the kill test cannot compute a rate, and corpus distillation has nothing real to distil; output and projected-state conformance are blocked by the same root cause. A generated case carries a before-state, an action and an expected after-state, so run() must MATERIALIZE AN ARBITRARY BEFORE-STATE, execute, and project the result -- for a CLI whose state is a filesystem tree plus a manifest that means constructing a repository already in that state. Nobody knows what that costs per adapter, it is the largest remaining item, and everything else waits behind it, so it is measured ONCE before five or six tickets are scoped against a guess. Deliverable is one adapter executing one case end to end, a written account specific enough to scope the other fifteen, per-adapter difficulty bands with reasons, and a recommendation on shape (run() shim over apply(), shared before-state builder, per-adapter rewrite, or a design the adapters cannot support without change). A blocked spike reporting where it stops and why is a legitimate result. See tickets/028-case-execution-spike.md.",
