# MF-028 SPIKE-ONLY additions. The runner's coverage gate is whole-corpus, so a
# single case cannot execute until every label in the corpus is bound. These
# three were unbound at the epic tip. They are recorded here, in the ticket's
# evidence directory, rather than in the production mapping, because the
# production bindings are MF-023's surface (open PR #50) and this spike must not
# duplicate or pre-empt them.
[adapters.RunEffectConformance]
adapter = "production_adapters:RunEffectConformanceAdapter"

[adapters.RunKillTest]
adapter = "production_adapters:RunKillTestAdapter"

[adapters.Stutter]
adapter = "production_adapters:StutterAdapter"

# MF-028 FINDING: these two modelled actions have NO adapter class anywhere in
# the repository. They are bound to refusing stubs purely to clear the
# whole-corpus coverage gate; they do not execute.
[adapters.UpdateTicketDesired]
adapter = "production_adapters:UpdateTicketDesiredAdapter"

[adapters.UpdateTicketCurrent]
adapter = "production_adapters:UpdateTicketCurrentAdapter"
