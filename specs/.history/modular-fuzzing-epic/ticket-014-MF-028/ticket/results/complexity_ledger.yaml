# The recursive refinement loop.
refinement:
  searched: true
  outcome: "none"
  detail: >-
    Searched for a refinement this ticket could justifiably apply, and found
    none that belongs here. The analyzer's standing recommendation is to project
    [lastCommand, result], which no configured invariant reads. This spike
    produced NEW evidence bearing directly on that recommendation: those two
    variables are also the only two that no filesystem projection can recover
    (spike-report.md#2.2), so they are unobservable as well as un-read. That is
    a strong second argument for the projection -- but applying it would remove
    the `lastCommand` and `result.accepted` checks that are currently among the
    nine fields the executed case genuinely verifies, and it would shrink the
    model while three of four oracles cannot witness behavior retention. Under
    the doctrine a DECREASE requires all three retention members retained; two
    are unverified here (see above). Shrinking now would be exactly the
    budget-gaming the kill-rate floor exists to prevent. Recorded as a finding
    for the re-scope instead, with the evidence attached, for owner approval.
  measured: false
  applied: false
  approved_by: ""

