    "objective": "Corpus diagnostics and HARD CAPS. Cases are never dropped, filtered, sampled, or truncated to fit a budget -- not silently and not with a recorded drop rule. Case caps (max_internal_cases_per_component, max_external_cases_per_action) become hard gates in the same shape as MF-011 state-space bound -- over budget exits nonzero and reports, and caps stay per-program negotiable so raising one with a recorded rationale is the explicit accept path. On failure the diagnostics report the count per (action, label class), which strata dominate, which are starved, and what varies across the redundant group, so the agent can fix the CAUSE. A lopsided corpus is evidence about the representation -- the committed example emits 200 cases for one action and 2 for another, which means the model enumerates redundant interleavings wanting symmetry reduction, a state constraint, or abstraction. The corpus is the symptom; the diagram is the defect. Labelers are retained but repurposed from selection criteria to diagnostic strata. Remediation is a recommendation requiring user approval, never auto-applied. Named regression traces are always retained. SCOPE CHANGE 2026-07-18 by owner direction -- this replaces the former Corpus Distillation scope, which transcribed the modular_fuzzing.md Corpus Discipline section; both were wrong, because filtering to fit a budget under-represents the program and the kill_rate_floor only samples for the damage. references/modular_fuzzing.md is amended in the same change. See tickets/014-corpus-diagnostics-and-caps.md.",
