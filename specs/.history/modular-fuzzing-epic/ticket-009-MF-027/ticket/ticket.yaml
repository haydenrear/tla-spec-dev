    "objective": "Amendment to MF-013, which shipped correct behavior with a SILENT boundary. EffectSandbox observes by monkeypatching the in-process Python runtime (builtins.open, os mutators, subprocess.run/Popen, socket.connect), so a Java or Kotlin adapter in a separate JVM is entirely invisible -- not hypothetical, since the Test Graph SDK ships Java and JVM nodes are first-class -- and a spawned subprocess is recorded as a spawn while everything it does is unobserved. Neither case reports a problem; the oracle returns GREEN. A clean report on an unobservable target is indistinguishable from a real one, which is the defect class this epic purged five times (corpus filtering, gap suppression, a self-disabling justification check, a budgets fallback hiding a broken parser, an override making a hard gate advisory). The problem is NOT that the oracle is Python-only -- that is useful and honest if declared -- it is that it does not declare it. Fix: the sandbox determines observability and FAILS with target-not-observable rather than returning clean; a subprocess spawn becomes an explicit unobservable-boundary finding; and the External/test-graph gap (exported cases run in JBang/uv nodes with no effect checking at all) is documented with a follow-up, since observing a JVM target needs a different mechanism behind the same port schema and is a second implementation rather than an extension. Scrapping the oracle was considered and rejected -- effect conformance is one of exactly three members of the doctrine constraint set and is the only one that catches boundaries never modeled at all. See tickets/027-effect-oracle-refuses-unobservable-targets.md.",
