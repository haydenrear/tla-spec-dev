# Complexity ledger input -- MF-019 standing objective.
#
# `close ticket` refuses until this is filled in. That refusal is the mechanism:
# the standing objective is a required close-out step, not a stance.
#
# The delta is computed for you from `analyze complexity` and the TLC report.
# What you supply is the part a tool cannot know: whether behavior was retained,
# what the refinement search found, and why any increase is essential.

# Validated-refactor basis -- CD-09 (owner-approved 2026-07-22). This is what
# LICENSES a complexity DECREASE: TLC green on the model before AND after the
# change, behavior tests green, and the before/after descriptor comparison
# recorded. Absent, unknown, or degraded evidence REJECTS a decrease: an
# unmeasured constraint cannot witness retention. (The fourth obligation, the
# inspected transition-level diff, is `transition_diff:` below and is demanded
# whenever the MF-020 red flag fires.)
#
#   tlc_before:            green | fail        -- TLC on the pre-change model
#   tlc_after:             green | fail        -- TLC on the post-change model
#   behavior_tests:        pass | fail         -- the repository behavior tests
#   descriptor_comparison: recorded            -- before/after descriptor doc
validated_refactor:
  tlc_before:
    status: "TODO"
    evidence: "TODO -- path to the pre-change TLC output"
  tlc_after:
    status: "TODO"
    evidence: "TODO -- path to the post-change TLC output"
  behavior_tests:
    status: "TODO"
    evidence: "TODO -- path to the behavior-test output"
  descriptor_comparison:
    status: "TODO"
    evidence: "TODO -- path to the before/after descriptor comparison"

# Fuzzing-era retention members -- RECORDED at every close, non-gating since
# CD-09. Demoted to EXPERIMENTAL by the 2026-07-21 pivot (MF-038: kill 0.31 vs
# floor 0.8, 0/9 content bugs caught). `not_run` is the honest value; fill in a
# measured verdict only when one of them actually ran.
#
#   kill_rate:           pass | below_floor | incomplete_catalog | not_run   (MF-016)
#   effect_conformance:  clean | gaps | dead_surface | unobservable | not_run (MF-013/MF-027)
#   external_coverage:   pass | gaps | incomplete | not_run                  (MF-015)
#
# NOTE: `unobservable` IS NOT `clean`. MF-027 made the effect oracle refuse
# targets it cannot see; the record keeps that distinction even though the
# member no longer gates.
retention:
  kill_rate:
    status: "not_run"
    evidence: ""
  effect_conformance:
    status: "not_run"
    evidence: ""
  external_coverage:
    status: "not_run"
    evidence: ""

# Coverage audit -- MF-026. The completeness REVIEW, distinct from the three
# retention members above, which are all FIDELITY measures bounded to what is
# already modeled. Unmodeled surface is invisible to every one of them, and this
# is the only sweep that looks at it.
#
#   status: pass | fail | incomplete | not_run
#
# RECORDED, NEVER REFUSING (2026-08-04, owner direction). It was a hard gate at
# workflow close with no override; it is now an optional agent-run review whose
# verdict is written down and read by a person. `incomplete` IS STILL NOT
# `pass`, because a sweep that did not walk the surface says nothing about it --
# what was withdrawn is the refusal, not the distinction.
#
# Procedure: prompts/coverage_audit.md   Doctrine: references/coverage_audit.md
coverage_audit:
  status: "not_run"
  report: ""          # path to the filled templates/coverage_audit_report.md
  in_scope_gaps: null # count; in-scope gaps are HARD -- model it or change the program
  scope_source: ""    # plan file:lines the declared scope was READ from, never chosen

# Required if complexity INCREASED. Name the new essential behavior the added
# representation carries. This documents real behavior; it does not waive the
# increase, which is recorded and reported either way.
justification: ""

# The recursive refinement loop -- REQUIRED at every close.
# Either an approved recommendation with evidence, or "searched, found none".
# Recommendations are advisory and user-approved, never auto-applied.
refinement:
  searched: true
  outcome: "none"
  detail: >-
    SEARCHED, FOUND NONE, and the reason is structural rather than a shrug.
    SV-01 is a MEASUREMENT ticket with `model_delta_expectation: none expected`
    and `desired_actions: []`. It adds no action, no port, no state variable and
    no representation to Internal.tla or External.tla; `specs/tickets/SV-01/current`
    and `.../desired` are byte-identical, verified with `diff -r` before close.
    There is no new representation for a refinement to fold, so the recursive
    search has nothing to walk. What the ticket adds is four sealed scorecards,
    one declared subject, one `labels` entry, one updated pinned figure in a
    demonstration, and prose -- none of it modeled surface.
    The one thing that COULD have grown and deliberately did not is the served
    card: `serve | wc -c` is 6,281 bytes and 9 rungs, byte-identical to the
    branch point `a527305`, verified by sha256 against a clean checkout of it.
    A negative control that edits its own instrument has measured nothing.
  measured: false      # true only if a real TLC run produced the figure
  applied: false       # if true, approved_by is required
  approved_by: ""

# Required only if a generated-states drop at constant distinct states is
# detected. That is a RED FLAG (deleted self-loop, MF-020), not a win -- record
# the inspected transition-level diff here to accept it.
transition_diff: ""

# REQUIRED. The narrative ledger: reasoning, measured alternatives, findings the
# machine-checked core above cannot express. Path to a document, or prose.
narrative: >-
  THE MISSING CELL, RUN. `close-the-loop` moved D3 from 4,4 to 3,3 by adding a
  caveat that tells a judge to take 3 when the only observer of the effect the
  port exists for is the adapter that wrote it -- and it applied that caveat to
  an artifact WITH EXACTLY THAT PROPERTY. That demonstrates the caveat is wired
  up. It does not measure discrimination. SV-01 scored one artifact that plainly
  LACKS the property under card version 4 and card version 5, two passes a side,
  same judge model (claude-opus-5[1m] on all four cards, tier keyed on the full
  model id), same architecture tag (`ports-and-adapters`, DERIVED and not
  asserted, identical metrics to the source subject), same packet, same dispatch
  text. RESULT: D3 = 4,4 under version 4 and 4,4 under version 5. THE CAVEAT
  DISCRIMINATES, and the predecessor's headline is a detection rather than a
  recalibration.

  THE PREDICTION WAS SEALED FIRST, in commit 5e07dce at 2026-08-12T16:37:51Z,
  before any judge agent was launched, while all four cards were unfilled
  skeletons, and before the operator ran the mutation probe whose outcome P6
  predicts. How every outcome would be read -- including the inconclusive one --
  was fixed in that same commit.

  MEASURED ALTERNATIVES CONSIDERED AND REJECTED. (1) Building a control artifact
  by repairing CL-03's fixture: a tree constructed to lack the property, by the
  round measuring whether the property matters, is MF-020 in its purest form.
  (2) Scoring the source directory in place: it sits two directories from ten
  published cards scoring the same bytes, and the tooling's own blinding check
  REFUSES a scope path that spells a published label. The copy is the tool's own
  documented remedy. (3) Reusing the two version 4 cards that already exist on
  these bytes: a different round, packet and dispatch, so the card version would
  not have been the only mover. They are recorded as a stated prior and averaged
  with nothing. (4) Running unblinded as CL-03 did: blinding was used anyway --
  `subject.name` null, declared boundary withheld -- because it cost nothing and
  is strictly better.

  WHAT THE MACHINE-CHECKED CORE ABOVE CANNOT EXPRESS. Five findings are filed and
  nothing is repaired: the judge scratch paths were not ticket-specific and all
  four held a prior round's artifact and a prior D3 = 4 one `ls` away
  (SV-01-DF-01, the operator's own defect, and it cuts TOWARD the predicted
  answer, which is why it is filed loudly); D2's anchor ladder is non-monotone
  and it names the cause of the already-sealed contested spread
  `cl03-v5-d2-spread-2` (SV-01-DF-02); `git status` leaks sibling cards
  (SV-01-DF-03); the shared 28-case suite is blind to the property the caveat
  names, so the discrimination is conditional on artifact-authored tests
  (SV-01-DF-04); and three defect classes all four judges found that survive both
  suites (SV-01-DF-05).

  P7 IS FALSIFIED ON BOTH HALVES and is reported as written rather than corrected
  to the fixed world. It predicted the branch point would fail the two inherited
  deliberate reds; a clean checkout of a527305 failed THREE, the third tripped by
  the epic's own opening commit. SV-06 found the same thing independently, from
  the cleaner direction, and the owner fixed it upstream at 2059500.

  THREE REDS WERE THIS ROUND'S OWN and each is worked through in RESULT.md 7.2
  rather than absorbed: four blinded cards unmapped because `labels` was left
  empty (a blinded card cannot name its own subject -- RM-04's documented path),
  a demonstration pinning `16 of 20 subject(s) decided` against a 21st subject
  (updated with the arithmetic stated, refusals unchanged at four), and a stale
  committed history rendering whose version 5 era read "no rows measured in this
  era" -- CL-03 bumped the card to version 5 and nothing was scored under it
  again until this round.

  SUITE, WITH ITS TREE. 2 failed, 1501 passed at 6d895de, reconciled onto epic
  tip b999d71. The two are exactly the inherited deliberate pair and neither is
  repaired. THAT TREE IS STALE ON PURPOSE: the epic tip moved four times during
  this round and 6d895de predates 86a8767, which it was NOT re-measured against,
  at the epic owner's instruction. denominator_rule: collected 1,498 -> 1,503,
  and none of the +5 are this ticket's -- they arrive through SV-06 in the
  reconciliation. SV-01 wrote no test and deleted, skipped or weakened none.

  Full record: specs/results/scorecards/score-drives-validation/GOAL-caveat-discriminates/SV-01/
