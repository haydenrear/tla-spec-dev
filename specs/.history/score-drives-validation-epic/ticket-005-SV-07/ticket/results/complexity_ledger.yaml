# Complexity ledger input -- MF-019 standing objective.
#
# `close ticket` refuses until this is filled in. That refusal is the mechanism:
# the standing objective is a required close-out step, not a stance.
#
# The delta is computed for you from `analyze complexity` and the TLC report.
# What you supply is the part a tool cannot know: whether behavior was retained,
# what the refinement search found, and why any increase is essential.

# Validated-refactor basis -- CD-09 (owner-approved 2026-07-22). This is what
# LICENSES a complexity DECREASE: TLC green on the model before AND after the
# change, behavior tests green, and the before/after descriptor comparison
# recorded. Absent, unknown, or degraded evidence REJECTS a decrease: an
# unmeasured constraint cannot witness retention. (The fourth obligation, the
# inspected transition-level diff, is `transition_diff:` below and is demanded
# whenever the MF-020 red flag fires.)
#
#   tlc_before:            green | fail        -- TLC on the pre-change model
#   tlc_after:             green | fail        -- TLC on the post-change model
#   behavior_tests:        pass | fail         -- the repository behavior tests
#   descriptor_comparison: recorded            -- before/after descriptor doc
validated_refactor:
  tlc_before:
    status: "TODO"
    evidence: "TODO -- path to the pre-change TLC output"
  tlc_after:
    status: "TODO"
    evidence: "TODO -- path to the post-change TLC output"
  behavior_tests:
    status: "TODO"
    evidence: "TODO -- path to the behavior-test output"
  descriptor_comparison:
    status: "TODO"
    evidence: "TODO -- path to the before/after descriptor comparison"

# Fuzzing-era retention members -- RECORDED at every close, non-gating since
# CD-09. Demoted to EXPERIMENTAL by the 2026-07-21 pivot (MF-038: kill 0.31 vs
# floor 0.8, 0/9 content bugs caught). `not_run` is the honest value; fill in a
# measured verdict only when one of them actually ran.
#
#   kill_rate:           pass | below_floor | incomplete_catalog | not_run   (MF-016)
#   effect_conformance:  clean | gaps | dead_surface | unobservable | not_run (MF-013/MF-027)
#   external_coverage:   pass | gaps | incomplete | not_run                  (MF-015)
#
# NOTE: `unobservable` IS NOT `clean`. MF-027 made the effect oracle refuse
# targets it cannot see; the record keeps that distinction even though the
# member no longer gates.
retention:
  kill_rate:
    status: "not_run"
    evidence: ""
  effect_conformance:
    status: "not_run"
    evidence: ""
  external_coverage:
    status: "not_run"
    evidence: ""

# Coverage audit -- MF-026. The completeness REVIEW, distinct from the three
# retention members above, which are all FIDELITY measures bounded to what is
# already modeled. Unmodeled surface is invisible to every one of them, and this
# is the only sweep that looks at it.
#
#   status: pass | fail | incomplete | not_run
#
# RECORDED, NEVER REFUSING (2026-08-04, owner direction). It was a hard gate at
# workflow close with no override; it is now an optional agent-run review whose
# verdict is written down and read by a person. `incomplete` IS STILL NOT
# `pass`, because a sweep that did not walk the surface says nothing about it --
# what was withdrawn is the refusal, not the distinction.
#
# Procedure: prompts/coverage_audit.md   Doctrine: references/coverage_audit.md
coverage_audit:
  status: "not_run"
  report: ""          # path to the filled templates/coverage_audit_report.md
  in_scope_gaps: null # count; in-scope gaps are HARD -- model it or change the program
  scope_source: ""    # plan file:lines the declared scope was READ from, never chosen

# Required if complexity INCREASED. Name the new essential behavior the added
# representation carries. This documents real behavior; it does not waive the
# increase, which is recorded and reported either way.
justification: ""

# The recursive refinement loop -- REQUIRED at every close.
# Either an approved recommendation with evidence, or "searched, found none".
# Recommendations are advisory and user-approved, never auto-applied.
refinement:
  searched: true
  outcome: "none"
  detail: >-
    Searched, found none, and the search had a subject rather than being a
    formality. SV-07's `model_delta_expectation` is `none expected`,
    `desired_actions` is empty, and `diff -rq specs/tickets/SV-07/current
    specs/tickets/SV-07/desired` is EMPTY -- the TLA+ model, the configs, the
    adapters and the spec-unit tests are byte-identical to the project `current`
    they were seeded from. This ticket added no representation to the model, so
    there is none to refine away. What it added to the repository is one
    generator under `scripts/`, one test module, one finding and one record; the
    ledger's OVER CAP figure and its INCOMPLETE caveat are inherited from the
    seeded model unchanged and this ticket neither improved nor worsened them.
  measured: false      # true only if a real TLC run produced the figure
  applied: false       # if true, approved_by is required
  approved_by: ""

# Required only if a generated-states drop at constant distinct states is
# detected. That is a RED FLAG (deleted self-loop, MF-020), not a win -- record
# the inspected transition-level diff here to accept it.
transition_diff: ""

# REQUIRED. The narrative ledger: reasoning, measured alternatives, findings the
# machine-checked core above cannot express. Path to a document, or prose.
narrative: >-
    specs/results/scorecards/score-drives-validation/GOAL-scored-at-goal-time/SV-07/RESULT.md
    is the evidence ledger; `references/scoring_validation.md` (SV-02) is the
    design this ticket was sent to implement.

    WHAT THE TICKET WAS ASKED FOR. SV-02 found one property that separates
    well-validated from badly-validated code without grading which tools made
    the tests, priced three carriers for it against the real renderer, and
    defended the cheapest -- sharpening the recorded-note prompt that already
    elicits it, at minus fifteen bytes and no new rung. The work order said ship
    that, and bound it with three constraints: do not restore a retired
    dimension, do not add a rung, do not force a card bump.

    WHAT CAME BACK. The prompt is built and prices at exactly the figure SV-02
    predicted, and it cannot go into the card at this ticket. A recorded note's
    prompt is inside BOTH of the card's seals -- the payload `load_rubric`
    digests, and the bytes `serve` emits, which the version history declares per
    version. Put the priced prompt in and change nothing else, and the card's
    own change rule refuses it: bump the card, or restore the text. The card's
    own version 5 row is the precedent, because it moved no anchor, moved only
    served bytes, and took a bump to do it. So BOTH carriers cost a version
    bump, which was the decisive argument SV-02 used against the rung. Filed as
    SV-07-DF-01 and not fixed, because the work order says a required bump is a
    finding and not a licence, and because the bump additionally owes the change
    rule's re-score of a prior example under both versions, which is a judging
    round and belongs to the evaluation ticket.

    WHAT SHIPPED INSTEAD, at zero bytes on the served surface.
    `scripts/candidate_note_bar.py` derives the candidate bar from the card at
    run time, applies exactly one substitution, adds the version row the change
    rule requires, and prices the result with the real renderer: 6,281 to 6,266
    bytes, 9 to 9 rungs, anchors digest byte-identical, exactly one served line
    moved. A generator and not a checked-in frozen copy, because the one-home
    test measured that three of four disagreeing copies of this card went
    uncaught by the whole suite, and there is nothing yet to compare a FUTURE
    candidate against. It makes SV-02's one missing experiment runnable in one
    command instead of by hand-freezing a file.

    THE DEMONSTRATED FAILING INPUT IS ON REAL SEALED CARDS AND NOT A FIXTURE.
    The two version-5 cards under close-the-loop-cl03-v5 agree with the shipped
    bar today and drift against the candidate on both seals -- served drift 46
    to 48, rubric drift 66 to 68, the same two cards each time -- while the same
    cards checked against the shipped bar do not drift, so the drift is a fact
    about the candidate and not about the cards.

    WHAT WAS REJECTED. Restoring the retired dimension; adding any rung;
    bumping the card; a checked-in frozen candidate; a checker that a note
    carries a denominator, which SV-02 rejected under the no-new-gates rule; and
    productionising SV-02's `demonstration_grade`, which its own page says has
    never been validated against a human read. No skill was edited and
    `skill-manager sync` was never run.
