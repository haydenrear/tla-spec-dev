# Complexity ledger input -- MF-019 standing objective.
#
# `close ticket` refuses until this is filled in. That refusal is the mechanism:
# the standing objective is a required close-out step, not a stance.
#
# The delta is computed for you from `analyze complexity` and the TLC report.
# What you supply is the part a tool cannot know: whether behavior was retained,
# what the refinement search found, and why any increase is essential.

# Validated-refactor basis -- CD-09 (owner-approved 2026-07-22). This is what
# LICENSES a complexity DECREASE: TLC green on the model before AND after the
# change, behavior tests green, and the before/after descriptor comparison
# recorded. Absent, unknown, or degraded evidence REJECTS a decrease: an
# unmeasured constraint cannot witness retention. (The fourth obligation, the
# inspected transition-level diff, is `transition_diff:` below and is demanded
# whenever the MF-020 red flag fires.)
#
#   tlc_before:            green | fail        -- TLC on the pre-change model
#   tlc_after:             green | fail        -- TLC on the post-change model
#   behavior_tests:        pass | fail         -- the repository behavior tests
#   descriptor_comparison: recorded            -- before/after descriptor doc
validated_refactor:
  tlc_before:
    status: "TODO"
    evidence: "TODO -- path to the pre-change TLC output"
  tlc_after:
    status: "TODO"
    evidence: "TODO -- path to the post-change TLC output"
  behavior_tests:
    status: "TODO"
    evidence: "TODO -- path to the behavior-test output"
  descriptor_comparison:
    status: "TODO"
    evidence: "TODO -- path to the before/after descriptor comparison"

# Fuzzing-era retention members -- RECORDED at every close, non-gating since
# CD-09. Demoted to EXPERIMENTAL by the 2026-07-21 pivot (MF-038: kill 0.31 vs
# floor 0.8, 0/9 content bugs caught). `not_run` is the honest value; fill in a
# measured verdict only when one of them actually ran.
#
#   kill_rate:           pass | below_floor | incomplete_catalog | not_run   (MF-016)
#   effect_conformance:  clean | gaps | dead_surface | unobservable | not_run (MF-013/MF-027)
#   external_coverage:   pass | gaps | incomplete | not_run                  (MF-015)
#
# NOTE: `unobservable` IS NOT `clean`. MF-027 made the effect oracle refuse
# targets it cannot see; the record keeps that distinction even though the
# member no longer gates.
retention:
  kill_rate:
    status: "not_run"
    evidence: ""
  effect_conformance:
    status: "not_run"
    evidence: ""
  external_coverage:
    status: "not_run"
    evidence: ""

# Coverage audit -- MF-026. The completeness REVIEW, distinct from the three
# retention members above, which are all FIDELITY measures bounded to what is
# already modeled. Unmodeled surface is invisible to every one of them, and this
# is the only sweep that looks at it.
#
#   status: pass | fail | incomplete | not_run
#
# RECORDED, NEVER REFUSING (2026-08-04, owner direction). It was a hard gate at
# workflow close with no override; it is now an optional agent-run review whose
# verdict is written down and read by a person. `incomplete` IS STILL NOT
# `pass`, because a sweep that did not walk the surface says nothing about it --
# what was withdrawn is the refusal, not the distinction.
#
# Procedure: prompts/coverage_audit.md   Doctrine: references/coverage_audit.md
coverage_audit:
  status: "not_run"
  report: ""          # path to the filled templates/coverage_audit_report.md
  in_scope_gaps: null # count; in-scope gaps are HARD -- model it or change the program
  scope_source: ""    # plan file:lines the declared scope was READ from, never chosen

# Required if complexity INCREASED. Name the new essential behavior the added
# representation carries. This documents real behavior; it does not waive the
# increase, which is recorded and reported either way.
justification: ""

# The recursive refinement loop -- REQUIRED at every close.
# Either an approved recommendation with evidence, or "searched, found none".
# Recommendations are advisory and user-approved, never auto-applied.
refinement:
  searched: true
  outcome: "none"
  detail: >-
    Searched, found none. SV-06 is a RESEARCH ticket: `model_delta_expectation`
    is `none expected`, `desired_actions` is empty, and `diff -rq
    specs/tickets/SV-06/current specs/tickets/SV-06/desired` is EMPTY -- the TLA+
    model, the configs, the adapters and the spec-unit tests are byte-identical
    to the project `current` they were seeded from. There is no representation to
    refine because none was added: the ticket's whole product is two documents,
    one survey script, five filed findings and a set of sealed evidence files,
    all under `references/` and `specs/results/`, which are its declared
    `implementation_scope`. The measured figures the ledger prints
    (variables=9, actions=17, bound=1,111,320, INCOMPLETE 7/9) are the inherited
    state of the model at `a527305` and delta=zero against CL-04 confirms this
    ticket did not touch it. The over-cap bound and the two unresolved variables
    (`lastCommand`, `result`) are pre-existing and are not this ticket's to
    repair -- repairing an inherited condition inside a research ticket is the
    move this epic's rules forbid.
  measured: false      # true only if a real TLC run produced the figure
  applied: false       # if true, approved_by is required
  approved_by: ""

# Required only if a generated-states drop at constant distinct states is
# detected. That is a RED FLAG (deleted self-loop, MF-020), not a win -- record
# the inspected transition-level diff here to accept it.
transition_diff: ""

# REQUIRED. The narrative ledger: reasoning, measured alternatives, findings the
# machine-checked core above cannot express. Path to a document, or prose.
narrative: >-
    specs/results/scorecards/score-drives-validation/GOAL-scored-at-goal-time/SV-06/RESULT.md
    is the evidence ledger and `references/goal_score_wiring.md` is the design.

    WHAT WAS MEASURED. Over every `ticket_plan.yaml` on disk at `a527305`, live
    and sealed: 27 distinct epic goals, 12 of which name a scorecard dimension
    in prose, and ZERO whose `baseline.evidence` points at a sealed
    `scorecard.json` -- against 87 sealed cards in the record. The epic's own
    baseline says "NO GOAL HAS EVER BEEN KEYED TO A DIMENSION"; that clause is
    false (SV-06-DF-01) and the true gap is sharper: a goal here has DESCRIBED a
    score twelve times and has never BEEN one.

    THE MEASURED ALTERNATIVE, RUN AND REJECTED. An optional `scored_by:` block on
    `epic_goals[]` plus a `score_signal:` on the ticket-goal link was added to a
    scratch copy of this epic's plan and put through
    `git-epic-workflow/scripts/validate_epic_plan.py`: exit 0, byte-identical
    message, zero lines of Python changed, because the plan schema reads named
    fields and ignores unknown ones. It is REJECTED anyway -- every field is
    already sayable in `harness`, `metric` and `baseline.evidence`, and
    `dimension:` would export an index into one project's rubric into a schema
    three skills share. Cheap to add is not a reason to add. The experiment is
    sealed at validator-experiment/ because it is the argument AGAINST the field,
    and because its other half is the absence guarantee: a plan with no scoring
    block validates today, unchanged, and will validate identically after SV-07.

    ALSO REJECTED: scoring at ticket start or ticket close (cost, rubric noise
    exceeding one ticket's movement, and R-H1/R-H2 comparability against a
    mid-epic tree); any new check or gate, including a check that a judged goal
    carries a card baseline (`no_new_gates_rule` -- 0 of 27 argues for a
    sentence, not a checker); a `--goal` flag on `score_tools.py` or any
    `tla-spec-dev` path that reads a plan, which would invert the dependency and
    make the card a participant in the goal process rather than an instrument it
    names; and a shared "judged instrument" reference page in any skill, which
    would be a seventh file in a surface this ticket had just finished counting.

    WHAT THE CORE CANNOT EXPRESS. A THIRD suite red is inherited and the epic
    lists only two. `tests/test_card_has_one_home.py::test_only_the_card_states_a_dimension_an_anchor_or_a_scoring_rule`
    fails on four lines in `SCORE-DRIVES-VALIDATION-EPIC.md` and
    `specs/desired_program_model/ticket_plan.yaml` -- the only two files
    `a527305` touched, in the same document that says "Two reds are inherited
    deliberately". Demonstrated inherited, not caused: with this ticket's page,
    evidence tree and findings all removed, the failure is identical, and SV-06's
    own design page appears nowhere in the offender list. NOT FILED -- the
    finding budget of 5 is spent and none of the five is blocking; escalated in
    RESULT.md section 7 and the ticket report, per RM-02's precedent. NOT
    REPAIRED -- both files are outside this ticket's implementation scope and
    silently repairing an inherited red is forbidden.

    BYTE COST: zero. Nothing here touches `references/eval_scorecard.md`, so
    `serve` stays 6,281 bytes and 9 rungs, and the SV-07 hand-off creates no
    anchor -- four prose edits across three skill files and one free-text plan
    convention. NO SKILL WAS EDITED by this ticket and `skill-manager sync` was
    never run.
