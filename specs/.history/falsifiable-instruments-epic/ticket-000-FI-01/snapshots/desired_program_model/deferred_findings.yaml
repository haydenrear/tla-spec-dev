    summary: >-
      THE CORPUS RUNNER'S EFFECT REPORT NEVER PRINTS `ADAPTER REACH`, SO THE ONE
      NUMBER THAT SAYS HOW MUCH OF THE MODEL AN ORACLE COULD SEE IS MISSING FROM
      THE PATH MOST RUNS TAKE.

      `effect_conformance.diff_effects` accepts `skipped`, `offered_actions` and
      `executed_actions` and renders `ADAPTER REACH: N of M action(s) ...
      EXECUTED` from them. `scripts/run_generated_case_adapters.py` calls
      `diff_effects` with only `cases`, `case_actions` and `unobservable`, so
      the reach line is emitted by the standalone `run effect-conformance`
      command and never by the corpus runner.

      That asymmetry is why "the oracle drives 8 of 18 actions" was a fact about
      the standalone command and had to be rediscovered by reading source rather
      than read off a run.
    reproduction: >-
      `grep -n 'diff_effects(' scripts/run_generated_case_adapters.py` -> the
      call passes three keyword arguments; `grep -n 'def action_reach'
      scripts/effect_conformance.py` -> the renderer that never fires.
    evidence:
      - "scripts/effect_conformance.py"
      - "references/case_modules.md"
    why_out_of_scope: >-
      Both files ARE in PA-04's implementation_scope, so this is scope-legal --
      it is deferred on the measurement rule instead. Threading three more
      arguments through the batch executor changes what the effect report says
      on every existing run, and PA-04's own numbers were taken with the report
      as it stands. Changing it mid-ticket would mean PA-04's evidence and
      PA-04's shipped behaviour describe different instruments.
    suggested_fix: >-
      Thread the batch executor's skip and offered/executed action sets into the
      `diff_effects` call, and pin it with a test that a corpus run's report
      carries an `action_reach` block. Budget: small.
    blast_radius: >-
