  - id: PA-06-DF-11
    found_by: "PA-06 (fresh adversarial channel, AD-F12)"
    found_at_commit: "930fa57"
    schedule_revision: 1
    severity: major
    surface:
      production: []
      tla: []
      adapters: []
      test_graph: []
      workflow: ["specs/results/scorecards/ports-as-adapters/measure/make_blind_copies.py"]
    summary: >-
      THE SANITISER'S OWN VERIFICATION CANNOT CATCH A LEAK PHRASED IN ITS OWN
      SUBSTITUTION VOCABULARY. IT IS VACUOUS BY CONSTRUCTION, WHICH IS THE SAME
      DEFECT AS `PA-06-DF-07`(b), IN A SECOND SCRIPT WRITTEN FOR THE SAME ROUND.

      `make_blind_copies.py` applies its substitutions and THEN greps the result
      for a FORBIDDEN vocabulary that is almost exactly the set it just
      substituted away. So the grep can only fire on tokens with no substitution
      rule.

      Demonstrated. Injected: "This is ARM B, the hexagonal treatment arm of the
      ports-as-adapters comparison. I was given the HEXAGONAL prompt by HP-02
      and PA-01; the other arm (arm A) got the plain one." The verifier flagged
      ONE line, on `ports-as-adapters` -- the only forbidden token with no
      substitution. The sentence "I was given the structured prompt by
      <ticket> and <ticket>; another artifact (this artifact) got the plain one"
      passed CLEAN, as did a docstring reading "this artifact, produced by the
      structured prompt."

      TWO REAL LEAKS IN THIS ROUND'S OWN PACKETS, neither caught by the
      verifier:

      * `artifact_T`'s `EVIDENCE.md` is the only one carrying `seeded_by =
        "addition"` rows (on M08 and M10). That is a per-artifact signal in a
        document the judges were told to read in full, and it identifies the arm
        whose catalogue needed substitutes -- i.e. the one with the different
        structure.
      * `artifact_U`'s and `artifact_W`'s packets are byte-identical apart from
        one label cell, so a judge reading both learns that the apparatus does
        not distinguish them -- which is a true and important fact, and one both
        judges used, but it is not a per-artifact measurement.

      The blinding held anyway on the real copies: 0 FORBIDDEN hits across all
      three trees, and both judges' independent inference about which arm was
      which came from the NOTES rather than from anything the sanitiser could
      have removed.
    reproduction: >-
      Point `make_blind_copies.py`'s `SOURCES` at a tree containing the injected
      sentence above and run it: `VERIFY` reports one problem, on
      `ports-as-adapters`, and the sanitised text still says the artifact was
      given "the structured prompt".
    evidence:
      - "specs/results/scorecards/ports-as-adapters/measure/make_blind_copies.py"
      - "specs/results/scorecards/ports-as-adapters/channels/ADVERSARIAL.md -- AD-F12"
      - "specs/results/scorecards/ports-as-adapters/UNBLINDING.md"
    why_out_of_scope: >-
      The script is in PA-06's implementation_scope and could be edited, but the
      blind copies it produced are the artifacts this round's six judged cards
      were scored against. Re-sanitising them now would mean the cards and the
      copies describe different inputs, which is worse than a filed defect.
    suggested_fix: >-
      Verify the ORIGINAL, not the OUTPUT. Grep the source tree for the
      forbidden vocabulary, require that every hit is covered by a substitution
      rule, and fail on any hit that is not -- then the pass is a proof that
      every leak it can name was rewritten, rather than a tautology. Ship a test
      that injects a known leak and asserts the verifier FAILS; a sanitiser with
      no negative test is what produced this row. Separately, drop `seeded_by`
      from the packets or emit it for every row on every artifact.
    blast_radius: >-
      Every blinded round that reuses this script. This round's cards are not
      invalidated -- the copies are clean by the same grep on the real inputs,
      and the leak both judges actually found is one no sanitiser can close --
      but "VERIFY: clean" carried more weight in `UNBLINDING.md` than it had
      earned, and that sentence is corrected there.
    disposition: carried
    disposition_ticket: "https://github.com/haydenrear/tla-spec-dev/issues/147"
    disposition_note: >-
      Carried out of the epic. Harness and tooling defects, none fixed during the measurement. PA-06-DF-05 leaves the epic branch with one DELIBERATELY RED test. PA-01-DF-04 and PA-01-DF-01 are STALE, settled by the owner at 479a9c1 and 14ac568, listed for completeness; PA-01's missing close-history entry is the permanent cost.

  - id: FI-01-DF-01
    found_by: "FI-01"
    found_at_commit: "2cce78c"
    schedule_revision: 1
    severity: blocking
    surface:
      production: []
      tla: []
      adapters: []
      test_graph: []
      workflow: ["examples/validation/ab/eval/run_controls.py"]
    summary: >-
      `run_controls.py` CANNOT MEASURE THE PORTED TREE AT ALL. Every mutant
      seeded in `reference_ports/` executes against UNMUTATED code and the run
      reports SURVIVED with no error, no warning and exit-code behaviour that
      looks like a clean measurement. THIS IS `EVAL-RERUN-DF-01` RECURRING, in
      the one place that finding's own repair does not reach.

      The purge is keyed on `ARM_MODULE_PREFIXES = ("quota_ledger",)`. On a flat
      tree that is the whole program. On the PORTED tree the program is four
      modules -- `quota_ledger` (the composition point), `domain`,
      `journal_file`, `journal_memory` -- and only the first is dropped, so a
      re-import of `quota_ledger` picks the CACHED `domain` straight back up.
      `tree_handle_holders()` does not save it: it finds modules holding a
      handle ON a tree module, and `domain` is a tree module that nothing points
      at from outside.

      MEASURED, NOT REASONED. `run_controls.py --tree examples/validation/ab
      --module-dir reference_ports --binding ports_binding --instrument
      corpus-port=<port corpus>` reports 15 of 15 mutants SURVIVED, including
      `PA-M11`, which `run_port_swap.py` KILLS on the same corpus in the same
      commit. A 12-line probe confirms the mechanism directly: after
      `_purge_modules("ports_binding")`, `domain` and `journal_file` are still
      in `sys.modules`, and a `QuotaLedger` built afterwards reports
      `committed == 3` on a tree whose `domain.py` on disk says 4.

      NO SEALED NUMBER IS CONTAMINATED, and that is luck rather than design:
      PA-03 ran `run_controls.py` only with `--module-dir reference` (the flat
      tree), and PA-04 and PA-06 measured the ported tree with
      `run_port_swap.py`, which runs every cell in a FRESH INTERPRETER for
      exactly this reason. FI-01 is the first ticket to point `run_controls.py`
      at a ported tree.

      WHY IT IS BLOCKING RATHER THAN MAJOR. FI-02 enumerates every shipped
      instrument and FI-03..FI-06 measure with them. `run_controls.py` is the
      shipped driver whose docstring is the reproduction recipe for this fixture,
      and it now silently produces a fully dead column on any ported subject. A
      dead column with a green-looking artifact is the exact failure EVAL-RERUN
      spent a round recovering from.
    reproduction: >-
      `PYTHONPATH=specs/results/scorecards/ports-as-adapters/GOAL-port-reach/measure
      python3 examples/validation/ab/eval/run_controls.py --label X --tree
      examples/validation/ab --module-dir reference_ports --binding ports_binding
      --catalogue examples/validation/ab/seeded_faults.toml --instrument
      corpus-port=<corpus> --out out.json` -> every `per_mutant` cell SURVIVED.
      Compare `run_port_swap.py --subject reference_ports --cases <the same
      corpus>` -> `FI-M15` KILLED on all four corpus columns, `PA-M11` KILLED on
      `corpus-port-swap:real`. Direct mechanism check: import `quota_ledger` from
      a copy of `reference_ports`, call `run_controls._purge_modules(...)`, and
      ask which of `quota_ledger`, `domain`, `journal_file` are still in
      `sys.modules`.
    evidence:
      - "examples/validation/ab/eval/results/fi01/run_controls-reference_ports-AFTER-false-survivors.json"
      - "examples/validation/ab/eval/results/fi01/run_controls-reference_ports-BEFORE.json"
      - "examples/validation/ab/eval/results/fi01/swap-reference_ports.json"
    why_out_of_scope: >-
      FI-01's slice is the CONTROL and the PROBE. Repairing the driver that
      decides kill tables is an unbounded change to a measurement instrument,
      taken by the ticket that is seeding a control into the catalogue that
      driver reads -- two instrument changes in one commit, with no way to
      attribute a moved cell to either. The standing rule is that a fix during a
      measurement destroys the measurement, and FI-01's own evidence would be
      the first casualty.
    suggested_fix: >-
      Do not extend `ARM_MODULE_PREFIXES` with a longer list of names; that is
      the fix EVAL-RERUN-DF-01 already rejected on the grounds that a list of
      names cannot be right. Ask the filesystem instead: a module whose
      `__file__` is under the tree copy IS a tree module, whatever it is called.
      That is one predicate, it needs no per-fixture knowledge, and it is
      checkable by a test that imports a two-module tree and asserts both are
      dropped. The alternative -- adopt `port_corpus_run.py`'s fresh-interpreter
      model for `run_controls.py` too -- is stronger and more expensive, and it
      would also retire the whole class rather than this instance of it.
    blast_radius: >-
      Every future `run_controls.py` run over `reference_ports` or any arm whose
      program is more than one module, which is arm B today and any hexagonal arm
      a later round produces. It does not reach `run_port_swap.py`,
      `port_corpus_run.py`, `check_catalogue.py --verify-suite` or the probe,
      all of which run in a fresh interpreter or a subprocess.
    disposition: open

  - id: FI-01-DF-02
    found_by: "FI-01"
    found_at_commit: "2cce78c"
    schedule_revision: 1
    severity: minor
    surface:
      production: []
      tla: []
      adapters: []
      test_graph: []
      workflow: ["examples/validation/ab/check_catalogue.py"]
    summary: >-
      `check_integrity` MAKES A MEASUREMENT CATALOGUE'S OBLIGATIONS OF A
      SUPPLEMENT CATALOGUE, so probing one control on one arm prints sixteen
      complaints that are all true of the wrong file. This is `PA-06-DF-02`'s
      hazard -- a false complaint a reader has to know to discount -- in a second
      shape, produced beside the fix for the first.

      `check_catalogue.py --controls --tree-root --root <arm B>
      --catalogue examples/validation/ab/eval/controls_port_region_arm_b.toml`
      prints the control verdict correctly (`FI-M15 arm_b HOLDS`) and then
      sixteen problems: no mutant in six required classes, no mutant in five
      declared gaps, no negative control, and two declared adapter
      implementations "orphaned by a rename" because `reference_ports/` does not
      exist under arm B. Every one of those obligations belongs to the parent
      catalogue this file `extends`.

      The verdict is unaffected, exactly as in PA-06-DF-02, and the cost is
      identical: it trains a reader to skip a block whose real form -- a
      catalogue that genuinely lost a class -- is the thing the block exists to
      catch.
    reproduction: >-
      The command above. Contrast `python3 examples/validation/ab/
      check_catalogue.py --controls` on the parent catalogue, which reports the
      same coverage clean.
    evidence:
      - "examples/validation/ab/eval/controls_port_region_arm_b.toml"
      - "examples/validation/ab/check_catalogue.py -- check_integrity, REQUIRED_CLASSES / REQUIRED_GAPS / ADAPTER_IMPLEMENTATIONS"
    why_out_of_scope: >-
      FI-01 was asked to make `extends` executable for the PROPERTY TABLE and
      did. Making it govern coverage obligations too is a different and larger
      decision: the per-arm catalogues under `specs/results/` DO carry full class
      coverage and are checked for it today, so a blanket "a catalogue with
      `extends` inherits its obligations" would silently drop a real check on
      five sealed files. That trade wants deciding on its own, not as a side
      effect of a control being seeded.
    suggested_fix: >-
      Attribute rather than skip: when `extends` resolves, report a missing class
      or gap as INHERITED and check it against the PARENT, so an obligation is
      still enforced somewhere and the complaint names the file that owes it. A
      supplement whose parent also lacks the class is still a problem, and it is
      then reported against the parent, which is where it can be fixed.
    blast_radius: >-
      Readability of every `--controls` run over a per-arm or per-tree catalogue,
      which is every run this epic will make. No verdict, no measurement.
    disposition: open

  - id: FI-01-DF-03
    found_by: "FI-01"
    found_at_commit: "2cce78c"
    schedule_revision: 1
    severity: minor
    surface:
      production: []
      tla: []
      adapters: []
      test_graph: []
      workflow:
        - "specs/results/scorecards/ports-as-adapters/measure/pa_m14_arm_a.toml"
        - "specs/results/scorecards/ports-as-adapters/measure/pa_m14_arm_b.toml"
        - "specs/results/scorecards/ports-as-adapters/measure/pa_m14_arm_c.toml"
    summary: >-
      `PA-06-DF-02`'S SUGGESTED FIX HAS TWO HALVES AND FI-01 SHIPPED ONE. The
      half it shipped: `extends` is followed, so a re-anchored control inherits
      its parent's property and a new re-anchoring never has to restate it --
      demonstrated by `eval/controls_port_region_arm_b.toml`, which declares no
      property table at all and resolves correctly. The half it did not: "then
      delete the duplicated tables PA-06 had to write."

      Those three files live under `specs/results/`, which this epic's plan
      declares `out_of_model` -- sealed history and recorded evidence. Deleting a
      table out of a sealed measurement file to tidy up after a repair is the
      shape of edit this project has spent three epics learning not to make, and
      the duplicates are now HARMLESS (the child's value equals the parent's, and
      child-wins merging means they resolve identically).

      What they are not is future-proof: if the parent's property for `PA-M14`
      ever changes, three sealed files will silently keep asserting the old one,
      and nothing compares them. That is a smaller version of the same drift
      PA-06-DF-02 named, now with a clock on it rather than a defect.
    reproduction: >-
      `grep -n 'pa_control_properties' specs/results/scorecards/ports-as-adapters/measure/pa_m14_arm_*.toml`
      -> three copies of the same line. `python3 -c` on
      `check_catalogue.resolve_control_properties` for each -> all three resolve
      to the same value with or without their local table.
    evidence:
      - "specs/desired_program_model/deferred_findings.yaml -- PA-06-DF-02 suggested_fix"
      - "examples/validation/ab/eval/controls_port_region_arm_b.toml"
    why_out_of_scope: >-
      Sealed evidence under `specs/results/`, and FI-01 wrote nothing there --
      not the arm trees it probed, not the measure directory it ran drivers out
      of. An epic-owner decision, not a ticket's.
    suggested_fix: >-
      Either leave them and accept the note, or add a check that a child's
      restated property EQUALS the one it inherits and report a disagreement.
      The second costs four lines, edits no sealed file, and converts a silent
      divergence into a loud one -- which is what the duplicates were dangerous
      for in the first place.
    blast_radius: >-
      Three sealed catalogue files. No verdict today.
    disposition: open

  - id: FI-01-DF-04
    found_by: "FI-01 (self-audit: what did I ship that nothing executes?)"
    found_at_commit: "2cce78c"
    schedule_revision: 1
    severity: minor
    surface:
      production: []
      tla: []
      adapters: []
      test_graph: []
      workflow: ["examples/validation/ab/check_catalogue.py"]
    summary: >-
      `PORT_REGION` IS A TRANSCRIPTION OF THE GENERATOR'S OUTPUT, NOT A READING
      OF IT, AND IT IS THE ONE DECLARATION FI-01 ADDED THAT NOTHING EXECUTES
      AGAINST ITS SOURCE.

      The probe's region test decides whether a control is seeded where a
      port-scoped instrument can see it. The region it uses is the constant
      `("closed", "committed", "ledger_lines")`, typed out from what
      `tla_spec_dev.py generate cases --port-cases only` prints for this
      fixture's one port. `tests/test_falsifiable_controls.py` pins the constant;
      NOTHING compares it against the generator.

      So if the manifest declares a second port, or `LedgerAppendPort`'s region
      grows a variable, the probe's region test silently NARROWS: a control
      seeded in the new part of the region would be reported OUT_OF_REGION and a
      correct control would be called broken. The failure direction is the safe
      one -- it produces a false RED, not a false green -- and it is still the
      `declaration_executability_rule`'s own shape, filed by the ticket that
      quotes that rule three times.
    reproduction: >-
      `grep -n 'PORT_REGION' examples/validation/ab/check_catalogue.py` -> a
      literal tuple. `python3 scripts/tla_spec_dev.py --spec-root specs generate
      cases examples/validation/ab/model/QuotaLedger.tla ... --port-cases only`
      -> "region {closed, committed, ledger}". Nothing joins them.
    evidence:
      - "examples/validation/ab/check_catalogue.py -- PORT_REGION"
      - "examples/validation/ab/model/spec_manifest.yaml -- effects.components.ledger.ports"
    why_out_of_scope: >-
      Reading the region from the generator means either generating a corpus
      inside the probe -- which turns a seconds-long probe into a TLC run and
      makes it unusable as the cheap re-runnable check it is for -- or teaching
      `check_catalogue.py` to compute a port's derived region from the manifest,
      which is duplicating the generator's logic in a second place. Both are
      designs, not fixes, and both are larger than the ticket.
    suggested_fix: >-
      Have the generator WRITE the region it computed into the corpus package
      (it already writes `case_coverage.json` beside the cases), and have the
      probe read it from there when a corpus is available and fall back to the
      constant with a printed note when one is not. The declaration then has one
      producer and one consumer and a rename breaks the consumer.
    blast_radius: >-
      The probe's region test, on any future fixture with a different port
      shape. Nothing today: this fixture declares one port and its region is
      measured to be the three names the constant carries.
    disposition: open
