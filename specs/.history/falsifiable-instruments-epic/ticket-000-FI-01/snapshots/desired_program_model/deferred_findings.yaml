  - id: PA-06-DF-01
    found_by: "PA-06"
    found_at_commit: "930fa57"
    schedule_revision: 1
    severity: major
    surface:
      production: []
      tla: []
      adapters: []
      test_graph: []
      workflow: ["examples/validation/ab/check_catalogue.py"]
    summary: >-
      THE FIXTURE-INTEGRITY HARNESS NOW REFUSES EVERY PER-ARM CATALOGUE,
      INCLUDING THE TWO SEALED ONES THIS EPIC TELLS PA-06 TO USE, AND THE SEALED
      RECORD BESIDE THEM SAYS THEY HOLD.

      `python3 examples/validation/ab/check_catalogue.py --root <arm tree>
      --catalogue <arm catalogue>` EXITS 1 on arm A, on arm B and on arm C, with
      six complaints in each case:

        no mutant in required class 'adapter_internal'
        no mutant declares a fault in the 'behind a port' gap
        declared adapter implementation 'reference_ports/journal_file.py' does
          not exist under <arm tree>   (and the same for journal_memory.py)
        0 adapter-internal mutant(s); the plan's PA-01 acceptance requires at
          least 2
        every adapter-internal mutant is in the same file

      Every one of those requirements is applied GLOBALLY, to whatever catalogue
      is handed in, including an arm-anchored one for an arm that ships no
      adapter. It is therefore UNSATISFIABLE BY CONSTRUCTION for any flat arm:
      the harness demands a fault seeded inside an adapter implementation that
      the tree under test does not have, and it resolves the declared adapter
      paths relative to `--root`, which for an arm is the arm.

      The load-bearing checks all PASS on all three trees -- every `find` occurs
      exactly once, every mutant applies, reverts byte-identically and leaves a
      file that parses, one positive and one negative control are present. The
      exit code says otherwise, so the one number a caller can read is wrong on
      every arm.

      THE SEALED RECORD DISAGREES WITH THE HARNESS, AND THE HARNESS IS THE THING
      THAT MOVED. `specs/results/scorecards/hexagonal-prompting-rerun/measure/
      catalogue-integrity-arm-a.txt` records "Catalogue integrity holds: every
      pattern occurs exactly once, every mutant applies and reverts cleanly, and
      every declared gap is seeded" and EXIT 0. That was true when written; the
      adapter-internal requirements were added at PA-01 (`e6d1351`), after it.
      A sealed integrity certificate that silently stops describing the harness
      that issued it is the exact class PA-05 was chartered to make visible, and
      nothing in the instrument log records this one.
    reproduction: >-
      `python3 examples/validation/ab/check_catalogue.py --root
      specs/results/scorecards/hexagonal-prompting-rerun/arms/arm_a --catalogue
      specs/results/scorecards/hexagonal-prompting-rerun/measure/catalogue_arm_a.toml;
      echo $?` -> 1, with the six complaints. The same command on arm B and on
      PA-06's arm C -> 1, identically. `python3
      examples/validation/ab/check_catalogue.py` with no arguments (the sealed
      catalogue on its own anchor trees) -> 0.
    evidence:
      - "examples/validation/ab/check_catalogue.py"
      - "specs/results/scorecards/hexagonal-prompting-rerun/measure/catalogue-integrity-arm-a.txt -- EXIT 0, 'integrity holds'"
      - "specs/results/scorecards/ports-as-adapters/RESULTS.md"
    why_out_of_scope: >-
      `examples/validation/` is PA-01's implementation_scope, not PA-06's, and
      `check_catalogue.py` is an instrument this ticket is measuring with.
      Widening or narrowing a check during the measurement that uses it is the
      forbidden half of the repair rule, and it would also mean PA-06's
      integrity evidence and PA-06's shipped harness describe different things.
    suggested_fix: >-
      Scope the adapter-internal requirements to the catalogue that DECLARES an
      adapter tree, rather than to every catalogue. Concretely: the requirement
      belongs to `[catalogue]` blocks whose `anchored_on` names an adapter-
      bearing tree, and a catalogue that declares none should report "no adapter
      declared on this tree; the adapter-internal class is NOT SEEDED here"
      rather than failing. Then re-issue the per-arm integrity certificates so
      the sealed text and the harness agree again, and add a `[[change]]` to
      INSTRUMENT-LOG.toml for `PA-01-three-arms` recording that it invalidated
      the two sealed certificates.
    blast_radius: >-
      Every per-arm catalogue in this project, on every future round. A caller
      that trusts the exit code cannot use the harness on an arm at all; a
      caller that reads the table past it gets the right answer and no signal
      that it did. It did not corrupt any PA-06 number -- the per-mutant
      integrity table was read directly and every row passes -- but the next
      round has no way to tell a real integrity failure from this one.
    disposition: carried
    disposition_ticket: "https://github.com/haydenrear/tla-spec-dev/issues/147"
    disposition_note: >-
      Carried out of the epic. Harness and tooling defects, none fixed during the measurement. PA-06-DF-05 leaves the epic branch with one DELIBERATELY RED test. PA-01-DF-04 and PA-01-DF-01 are STALE, settled by the owner at 479a9c1 and 14ac568, listed for completeness; PA-01's missing close-history entry is the permanent cost.

  - id: PA-06-DF-02
    found_by: "PA-06"
    found_at_commit: "930fa57"
    schedule_revision: 1
    severity: minor
    surface:
      production: []
      tla: []
      adapters: []
      test_graph: []
      workflow: ["examples/validation/ab/check_catalogue.py", "examples/validation/ab/seeded_faults.toml"]
    summary: >-
      `extends` IS DOCUMENTATION, SO A RE-ANCHORED POSITIVE CONTROL IS REPORTED
      AS UNDECLARED NO MATTER WHAT ITS PARENT SAYS.

      `[pa_control_properties]` lives in `examples/validation/ab/
      seeded_faults.toml` and is what PA-01 added so that a positive control's
      PROPERTY -- "invisible until an accepted reserve executes" -- is declared
      rather than assumed. Every per-arm catalogue carries `extends =
      "examples/validation/ab/seeded_faults.toml"`, and `check_catalogue.py`
      reads the property table only out of the file it is handed. So

        check_catalogue.py --controls --tree-root --root <arm> \
          --catalogue <arm catalogue>

      reports, for a control the sealed parent DOES declare:

        M07-positive-control-wrong-hold: `[pa_control_properties]` does not
        declare it as 'accept-path-only'. The property is the whole job; a
        control that does not state it cannot be checked against it, and an
        undeclared control is how a role string gets copied.

      The message is right about the hazard and wrong about this catalogue. The
      probe still RUNS -- it reported HOLDS on arm A and arm C and BROKEN on arm
      B -- so nothing is suppressed; what is produced is a false complaint that
      a reader has to know to discount.

      PA-06 worked around it by repeating `[pa_control_properties]` in each of
      its three PA-M14 re-anchoring files, which is a duplicated declaration and
      therefore the `declaration_executability_rule`'s own failure shape: five
      copies of one property, and nothing checks them against each other.
    reproduction: >-
      `python3 examples/validation/ab/check_catalogue.py --controls --tree-root
      --root specs/results/scorecards/hexagonal-prompting-rerun/arms/arm_a
      --catalogue specs/results/scorecards/hexagonal-prompting-rerun/measure/catalogue_arm_a.toml
      --impl quota_ledger` -> the probe reports HOLDS and the complaint appears
      in the same output. `grep -n 'pa_control_properties'
      examples/validation/ab/check_catalogue.py` -> read from the loaded
      catalogue only; `extends` is never followed.
    evidence:
      - "examples/validation/ab/check_catalogue.py"
      - "specs/results/scorecards/ports-as-adapters/measure/pa_m14_arm_a.toml -- the duplicated declaration and why"
    why_out_of_scope: >-
      `examples/validation/` is PA-01's scope, and following `extends` changes
      what every catalogue in the round declares -- an instrument change taken
      during the measurement that instrument is serving.
    suggested_fix: >-
      Follow `extends` when reading `[pa_control_properties]` (one level is
      enough for every catalogue that exists), and ship a test that a
      re-anchored control inherits its parent's property. Then delete the
      duplicated tables PA-06 had to write.
    blast_radius: >-
      Every re-anchored control in every round. Low today because the probe's
      verdict is unaffected, but the complaint trains a reader to ignore a
      message whose real form -- an undeclared control -- is the thing
      PA-01-DF-05 exists to catch.
    disposition: carried
    disposition_ticket: "https://github.com/haydenrear/tla-spec-dev/issues/144"
    disposition_note: >-
      Carried out of the epic. OWNER DIRECTION 2026-08-05: FIRST TICKET of the next epic, seeded BEFORE any measurement runs. Three tickets declined to fix it mid-measurement, each correctly. Every port-scoped kill number in this epic is a floor until it lands.

  - id: PA-06-DF-03
    found_by: "PA-06"
    found_at_commit: "930fa57"
    schedule_revision: 1
    severity: minor
    surface:
      production: []
      tla: []
      adapters: []
      test_graph: []
      workflow: ["examples/validation/PREDICTIONS-PA.md"]
    summary: >-
      A SEALED NEGATIVE PREDICTION WAS SEALED AGAINST DATA THAT ALREADY
      FALSIFIED IT, IN A FILE THE SEALING TICKET HAD READ.

      `N05` predicts: "ordering stays at zero on every generated corpus, on
      every arm ... M09 under corpus-whole, corpus-slice, corpus-neg, both
      mappings, three arms. Direction: FLAT at zero for every corpus
      instrument."

      Measured at PA-06: `M09` is KILLED by `corpus-whole`, `corpus-slice-led`,
      `corpus-port`, `map-silent` and `map-checking` on ALL THREE ARMS. N05
      FAILS on five of eight columns.

      IT WAS ALREADY FALSE WHEN SEALED, AND THE RECORD SAID SO. N05's stated
      basis is "Sets in the model, ordered lists in the code, `sorted()` at
      every oracle layer". That is true of `N01` and false of `M09`:
      `examples/validation/ab/eval/controls.toml` RETIRED M09 as a control at
      EVAL-STABLE precisely because this model represents its ledger as a
      SEQUENCE (`ledger' = Append(ledger, ...)`, projected as a tuple and
      compared positionally), "so ordering is expressible and the corpus sees
      it". PA-03's sealed `kill-table-arm-a.json` records `M09 / corpus-whole =
      KILLED`.

      This is NOT scored SUPERSEDED. Nothing about the instrument changed, and
      that escape requires that it did. It is a wrong prediction, which is what
      a predictions file is for -- but it is wrong in a way that could have been
      caught by reading one field of the control record it cites, which makes it
      a defect in the SEALING rather than a surprise in the measurement.
    reproduction: >-
      `grep -n 'M09' examples/validation/ab/eval/controls.toml` -> the
      retirement and its reason. `python3 -c` over
      `specs/.history/ports-as-adapters-epic/ticket-002-PA-03/results/kill-table-arm-a.json`
      -> `per_mutant["M09-negative-control-ledger-order"]["corpus-whole"] ==
      "KILLED"`, sealed before PREDICTIONS-PA was written. PA-06's three tables
      reproduce it on all three arms.
    evidence:
      - "examples/validation/PREDICTIONS-PA.md -- N05"
      - "examples/validation/ab/eval/controls.toml -- M09's retirement"
      - "specs/results/scorecards/ports-as-adapters/PREDICTIONS-SCORED.md"
    why_out_of_scope: >-
      `PREDICTIONS-PA.md` is SEALED and PA-06 may not amend it. That is the
      whole point of the file and this row is filed rather than fixed for
      exactly that reason.
    suggested_fix: >-
      Nothing to fix in the sealed file. What the next round should adopt is a
      cheap check at SEALING time rather than at scoring time: for every
      prediction naming a mutant and an instrument, look the cell up in the most
      recent sealed kill table and refuse to seal a prediction the record
      already contradicts -- or, if it is sealed deliberately as a re-test, say
      so in the row. The ordering class's real negative control is `N01`, which
      SURVIVED all eight instruments on all three arms and is the row N05's
      reasoning actually describes.
    blast_radius: >-
      One prediction row. The wider cost is to the file's authority: a
      predictions file whose negatives include one that was already known false
      makes "five of fifteen failed" harder to read as information.
    disposition: carried
    disposition_ticket: "https://github.com/haydenrear/tla-spec-dev/issues/148"
    disposition_note: >-
      Carried out of the epic. Protocol deviations the round DISCLOSED AGAINST ITS OWN HEADLINE. Both point against this round's conclusion, which is why it survives them; neither is explained away.

  - id: PA-06-DF-04
    found_by: "PA-06"
    found_at_commit: "930fa57"
    schedule_revision: 1
    severity: major
    surface:
      production: []
      tla: []
      adapters: []
      test_graph: []
      workflow: ["examples/validation/ab/seeded_faults.toml"]
    summary: >-
      NO ARM CARRIES AN ADAPTER-INTERNAL FAULT. THE CLASS THIS EPIC EXISTS FOR
      IS MEASURED ONLY ON A FIXTURE THAT IS DECLARED NOT TO BE AN ARM.

      `GOAL-port-reach` clause 1 is reported MET on `PA-M12`, seeded in
      `reference_ports/journal_memory.py`. `PREDICTIONS-PA.md` confound 3 states
      plainly: "`reference_ports/` is not an arm ... Its numbers are never
      placed beside an arm's." Confound 4 adds that the fixture and the mutants
      seeded into it have the SAME AUTHOR.

      So the epic's flagship result -- a fault behind a port stops hiding -- is
      demonstrated on a tree built by the person who wrote the mutant, and has
      never been demonstrated on an artifact any prompt produced.

      THIS IS NOT A GAP IN THE CATALOGUE'S DESIGN; IT IS A GAP NOBODY WAS
      SCHEDULED TO CLOSE. Arm B ships a real driven adapter
      (`quota_ledger/file_journal.py`) AND a working fake
      (`quota_ledger/memory_journal.py`), and PA-04 already composes the fake in
      the measurement tree. The half-pair exists and was measured: `M09` is
      seeded in arm B's REAL adapter with `boundary_kind = "port"`, and it is
      the one diverging cell in the entire three-arm table -- KILLED under the
      real wiring, SURVIVED under the fake. What has never been seeded is the
      OTHER half: the same semantic in arm B's own fake. That row would be
      `PA-M11`/`PA-M12` on an arm rather than on a fixture, and it is the only
      thing that would let clause 1 be stated about an artifact a prompt
      produced.
    reproduction: >-
      `grep -n 'adapter_internal' examples/validation/ab/seeded_faults.toml` ->
      PA-M11, PA-M12, PA-M13, all under `reference_ports/`. `grep -n
      'adapter_internal'` on the three per-arm catalogues -> no hits.
      `specs/results/scorecards/ports-as-adapters/GOAL-port-reach/results/pa06-swap-arm_b.json`
      -> `per_mutant["M09-negative-control-ledger-order"].cells` is KILLED on
      `corpus-port-swap:real` and SURVIVED on `corpus-port-swap:fake`.
    evidence:
      - "examples/validation/PREDICTIONS-PA.md -- stated confounds 3 and 4"
      - "specs/results/scorecards/ports-as-adapters/GOAL-port-reach/results/pa06-swap-arm_b.json"
      - "specs/results/scorecards/ports-as-adapters/RESULTS.md"
    why_out_of_scope: >-
      Seeding it is amending the catalogue, which is PA-01's scope AND the
      instrument PA-06 is measuring with. PA-06 has seen the round's numbers;
      adding a mutant now is adding to an instrument after an unflattering
      signal, which PA-01 schedule_revision 2 names as the forbidden act. The
      same argument PA-04 used to decline PA-03-DF-03 applies here and applies
      more strongly, because PA-06 IS the measurement.
    suggested_fix: >-
      In a ticket that is NOT the one deciding a goal: seed the `PA-M11` /
      `PA-M12` semantic into arm B's own `file_journal.py` and
      `memory_journal.py`, seal the prediction BEFORE running it, and report the
      difference between the two rows rather than their total. Arm B's `M09`
      result says the region is reachable, so the pair will be decidable. Until
      then, `GOAL-port-reach` clause 1 should be quoted as "met on the ported
      REFERENCE" and never as "met on an arm".
    blast_radius: >-
      The epic's headline. `PA-M12`'s kill is a real, reproducible kill and
      nothing here retracts it; what is bounded is what it is a kill ABOUT. A
      reader who takes clause 1 as evidence that asking an agent for ports makes
      its adapter faults visible is reading a result about a hand-built fixture.
    disposition: carried
    disposition_ticket: "https://github.com/haydenrear/tla-spec-dev/issues/146"
    disposition_note: >-
