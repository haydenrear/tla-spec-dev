# Complexity ledger input -- MF-019 standing objective.
#
# `close ticket` refuses until this is filled in. That refusal is the mechanism:
# the standing objective is a required close-out step, not a stance.
#
# The delta is computed for you from `analyze complexity` and the TLC report.
# What you supply is the part a tool cannot know: whether behavior was retained,
# what the refinement search found, and why any increase is essential.

# Validated-refactor basis -- CD-09 (owner-approved 2026-07-22). This is what
# LICENSES a complexity DECREASE: TLC green on the model before AND after the
# change, behavior tests green, and the before/after descriptor comparison
# recorded. Absent, unknown, or degraded evidence REJECTS a decrease: an
# unmeasured constraint cannot witness retention. (The fourth obligation, the
# inspected transition-level diff, is `transition_diff:` below and is demanded
# whenever the MF-020 red flag fires.)
#
#   tlc_before:            green | fail        -- TLC on the pre-change model
#   tlc_after:             green | fail        -- TLC on the post-change model
#   behavior_tests:        pass | fail         -- the repository behavior tests
#   descriptor_comparison: recorded            -- before/after descriptor doc
validated_refactor:
  tlc_before:
    status: "green"
    evidence: "no model change: specs/tickets/FI-02/current and desired are byte-identical to specs/current at 51fe73d. FI-02 touched tests/, examples/validation/instruments/ and the ledgers only."
  tlc_after:
    status: "green"
    evidence: "same model, same configs; nothing in specs/*/TlaSpecDevCli.tla, MC.cfg or MCsmall.cfg was edited by this ticket."
  behavior_tests:
    status: "pass"
    evidence: "uv run --with pytest --with pyyaml python -m pytest tests -q -> 1236 passed. The one failure carried in from the predecessor epic (PA-06-DF-05, tests/test_code_complexity.py::test_nothing_executable_reads_this_instrument) is repaired by this ticket and is green."
  descriptor_comparison:
    status: "recorded"
    evidence: "no complexity delta to compare: model_delta_expectation is 'none expected' in the plan and no .tla or .cfg was touched."

# Fuzzing-era retention members -- RECORDED at every close, non-gating since
# CD-09. Demoted to EXPERIMENTAL by the 2026-07-21 pivot (MF-038: kill 0.31 vs
# floor 0.8, 0/9 content bugs caught). `not_run` is the honest value; fill in a
# measured verdict only when one of them actually ran.
#
#   kill_rate:           pass | below_floor | incomplete_catalog | not_run   (MF-016)
#   effect_conformance:  clean | gaps | dead_surface | unobservable | not_run (MF-013/MF-027)
#   external_coverage:   pass | gaps | incomplete | not_run                  (MF-015)
#
# NOTE: `unobservable` IS NOT `clean`. MF-027 made the effect oracle refuse
# targets it cannot see; the record keeps that distinction even though the
# member no longer gates.
retention:
  kill_rate:
    status: "below_floor"
    evidence: "examples/distributed_history, RUN ON PURPOSE as the kill test's demonstrated FAILING input: 0.571 (4/7) against a floor of 0.800. Its demonstrated PASSING input, the same corpus over examples/validation/instruments/fixtures/kill_test/killable_only.toml, is 1.000 (4/4). Both are re-runnable: python3 examples/validation/instruments/demonstrate.py --only kill-test-floor. NOTHING WAS REPAIRED to produce the second number -- the three survivors are a true finding about that example and are left standing there."
  effect_conformance:
    status: "gaps"
    evidence: "run as the effect oracle's demonstrated failing input through the shipped runner path: tests/test_effect_conformance_runner.py::TestRunnerEnforcesEffectConformance::test_undeclared_effect_fails_the_run (gap) and ::test_dead_declared_port_fails_the_run (dead surface), with ::test_declared_only_adapter_passes as the clean half. Enumerated as `effect-oracle`."
  external_coverage:
    status: "not_run"
    evidence: "MF-015 channel enforcement is ENUMERATED as an instrument with a demonstrated failing and passing input (tests/test_testgraph_channels.py, tests/test_export_testgraph_cases.py), but no external corpus was generated by this ticket, so no coverage figure was measured."

# Coverage audit -- MF-026. The completeness REVIEW, distinct from the three
# retention members above, which are all FIDELITY measures bounded to what is
# already modeled. Unmodeled surface is invisible to every one of them, and this
# is the only sweep that looks at it.
#
#   status: pass | fail | incomplete | not_run
#
# RECORDED, NEVER REFUSING (2026-08-04, owner direction). It was a hard gate at
# workflow close with no override; it is now an optional agent-run review whose
# verdict is written down and read by a person. `incomplete` IS STILL NOT
# `pass`, because a sweep that did not walk the surface says nothing about it --
# what was withdrawn is the refusal, not the distinction.
#
# Procedure: prompts/coverage_audit.md   Doctrine: references/coverage_audit.md
coverage_audit:
  status: "not_run"
  report: ""          # path to the filled templates/coverage_audit_report.md
  in_scope_gaps: null # count; in-scope gaps are HARD -- model it or change the program
  scope_source: ""    # plan file:lines the declared scope was READ from, never chosen

# Required if complexity INCREASED. Name the new essential behavior the added
# representation carries. This documents real behavior; it does not waive the
# increase, which is recorded and reported either way.
justification: >-
  No complexity increase to justify: no .tla or .cfg was edited. What grew is
  test and fixture surface -- examples/validation/instruments/ (a registry, a
  runner and three small fixtures) and tests/test_instrument_demonstrations.py
  -- carrying one behaviour the repository did not have: EVERY SHIPPED
  INSTRUMENT NOW HAS A RE-RUNNABLE DEMONSTRATION OF WHAT IT DOES AND DOES NOT
  REPORT. That is architecture_advice.md S2 turned on ourselves, which is the
  epic's thesis, and it refuses nothing.

# The recursive refinement loop -- REQUIRED at every close.
# Either an approved recommendation with evidence, or "searched, found none".
# Recommendations are advisory and user-approved, never auto-applied.
refinement:
  searched: true
  outcome: "none"
  detail: >-
    Searched, and the search is the ticket. Every shipped instrument was
    enumerated and asked the same two questions -- what does it watch, and can
    it report that the thing is broken. No representation refinement follows:
    the model was not touched and no boundary changed. What the search DID
    produce is three findings about instruments that cannot report what they
    claim (FI-02-DF-01, FI-02-DF-02, FI-02-DF-03) and nine rows counted as
    having no demonstrated failing input, which is the ticket's product rather
    than a defect list.
  measured: false
  applied: false
  approved_by: ""

# Required only if a generated-states drop at constant distinct states is
# detected. That is a RED FLAG (deleted self-loop, MF-020), not a win -- record
# the inspected transition-level diff here to accept it.
transition_diff: ""

# REQUIRED. The narrative ledger: reasoning, measured alternatives, findings the
# machine-checked core above cannot express. Path to a document, or prose.
narrative: >-
  FI-02, the epic's thesis ticket. references/architecture_advice.md S2 applied
  to this repository's own instruments for the first time.


  ENUMERATED 37 rows, of which 5 are classified NOT an instrument after being
  checked rather than assumed (fitness_functions, budgets, skill_feedback,
  case_modules coverage, score_tools index -- each refuses nothing, by its own
  docstring). Of the 32 instruments, 23 now ship a re-runnable demonstrated
  FAILING input and 27 a demonstrated PASSING input. NINE CANNOT BE SHOWN TO
  FAIL and each says why, in the registry, in its own row.


  Nine rows additionally carry a DEMONSTRATED BLIND SPOT: a genuine break the
  instrument does not report. That column is the more interesting half. The
  blinding sanitiser goes red on a leak with no substitution rule and stays
  CLEAN on the exact sentence PA-06-DF-11 measured. run_controls.py cannot
  measure a ported tree at all. run_port_swap.py prints a red control and exits
  0. The TLA+ descriptor sits 432x over its own declared bound and exits 0, by
  design. And the tripwire this ticket repaired still cannot see a consumer
  that reads its JSON without naming it -- which is the route the one real
  reader takes.


  THE TRIPWIRE. PA-06-DF-05 is fixed and NOT by renaming the searched string.
  What was a substring grep is now an AST reference scan (an import under any
  alias, or a string whose WHOLE value is a path or module token) plus a taint
  analysis onto conditions, and it drops specs/**, which the plan declares out
  of model. It gained a second test that IS the invariant the docstring always
  stated -- nothing gates on the output -- which does reach specs/. Its cost is
  named: two exempt files, both of them files whose subject is the scanner,
  pinned by a test that asserts they would otherwise be flagged.


  NO NEW GATE. Nothing here refuses anything about the repository's design. The
  runner exits non-zero for one reason only: a DECLARED demonstration stopped
  reproducing, which means the instrument changed or the demonstration went
  stale, and both are things a reader has to be told.


  Full table: specs/tickets/FI-02/results/instrument_enumeration.txt
  Machine-readable: specs/tickets/FI-02/results/instrument_enumeration.json
  Re-run: python3 examples/validation/instruments/demonstrate.py
