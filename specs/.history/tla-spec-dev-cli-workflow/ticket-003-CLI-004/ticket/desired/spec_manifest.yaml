module: TlaSpecDevCli
package: current_program_cases

status:
  workflow: ticket
  active_ticket: CLI-004
  active_ticket_title: "Implement open and close ticket commands"
  relation_to_program_model: implemented_cli_ticket_lifecycle_slice
  relation_to_desired_program_model: completed_prefix_through_cli_004
  current_model_rule: whole_program_working_copy_not_ticket_projection
  updated: null
  current_slice:
    name: cli-ticket-lifecycle
    status: implemented
    summary: "The CLI now executes ticket open and close lifecycle commands."
    implemented_actions:
      - BuildSkillCli
      - InstallLocalCli
      - ScaffoldProject
      - ScaffoldWorkflow
      - OpenTicket
      - CloseTicket
    validation:
      tlc:
        - python3 -c "import subprocess; subprocess.run(['bash','scripts/run_tlc.sh','specs/current/TlaSpecDevCli.tla','specs/current/MC.cfg'], timeout=30, check=True)"
      unit:
        - uv run --with pytest -m pytest tests/test_tla_spec_dev_cli.py specs/current/tests tests/test_new_ticket_workflow.py -q
      graph:
        - python3 /Users/hayde/.skill-manager/skills/test-graph/scripts/discover.py cliWorkflow
        - python3 /Users/hayde/.skill-manager/skills/test-graph/scripts/discover.py specWorkflow
        - python3 /Users/hayde/.skill-manager/skills/test-graph/scripts/run.py --all
      evidence:
        - "CLI open ticket and close ticket commands are tested through root Python tests."
        - "Ticket-local lifecycle adapters execute the CLI against a temporary repository."
        - "specWorkflow now invokes the installed CLI for project, workflow, open, and close ticket commands."
  next:
    - CLI-005 replaces spec-unit validation script calls with CLI commands.

source_model:
  program_model_manifest: ../program_model/spec_manifest.yaml
  program_model_module: ../program_model/TlaSpecDevCli.tla
  desired_ticket_plan: ../desired_program_model/ticket_plan.yaml

state:
  TlaSpecDevCliState:
    fields:
      cli_built:
        type: bool
        tla: cli_built
      cli_installed:
        type: bool
        tla: cli_installed
      spec_root:
        type: SpecRoot
        tla: spec_root
      project_scaffolded:
        type: bool
        tla: project_scaffolded
      workflow_scaffolded:
        type: bool
        tla: workflow_scaffolded
      active_tickets:
        type: frozenset[TicketId]
        tla: active_tickets
      desired_ready:
        type: dict[TicketId, bool]
        tla: desired_ready
      current_ready:
        type: dict[TicketId, bool]
        tla: current_ready
      spec_unit_tests_passed:
        type: dict[TicketId, bool]
        tla: spec_unit_tests_passed
      closed_tickets:
        type: frozenset[TicketId]
        tla: closed_tickets
      last_command:
        type: str
        tla: lastCommand

actions:
  - BuildSkillCli
  - InstallLocalCli
  - ScaffoldProject
  - ScaffoldWorkflow
  - OpenTicket
  - UpdateTicketDesired
  - UpdateTicketCurrent
  - RunSpecUnitTests
  - CloseTicket

commands:
  build_skill_cli:
    cli: skill-script:tla-spec-dev creates the local wrapper
    action: BuildSkillCli
    adapter: BuildSkillCliAdapter
  install_local_cli:
    cli: tla-spec-dev --help
    action: InstallLocalCli
    adapter: InstallLocalCliAdapter
  scaffold_project:
    cli: tla-spec-dev --spec-root <root> scaffold project
    action: ScaffoldProject
    adapter: ScaffoldProjectAdapter
  scaffold_workflow:
    cli: tla-spec-dev --spec-root <root> scaffold workflow
    action: ScaffoldWorkflow
    adapter: ScaffoldWorkflowAdapter
  open_ticket:
    cli: tla-spec-dev --spec-root <root> open ticket <ticket-name>
    action: OpenTicket
    adapter: OpenTicketAdapter
  run_spec_unit_tests:
    cli: tla-spec-dev --spec-root <root> run spec-unit-tests
    action: RunSpecUnitTests
    status: help_surface_only_until_CLI_005
  close_ticket:
    cli: tla-spec-dev --spec-root <root> close ticket <ticket-name>
    action: CloseTicket
    adapter: CloseTicketAdapter

ports:
  TlaSpecDevCliPort:
    role: production_adapter_surface
    commands:
      - BuildSkillCli
      - InstallLocalCli
      - ScaffoldProject
      - ScaffoldWorkflow
      - OpenTicket
      - CloseTicket

invariants:
  - TypeInvariant
  - CliInstalledRequiresBuilt
  - WorkflowRequiresProject
  - ProjectChoosesKnownSpecRoot
  - NoOpenClosedOverlap
  - CurrentRequiresDesired
  - SpecUnitTestsRequireCurrent
  - ClosedTicketsPassedSpecUnitTests

case_codegen:
  style: explicit_transition_cases
  generation_status: planned

adapters: case_adapters.toml
notes:
  package_from_program_model: tlaspecdevcli_program_cases
  progressive_disclosure: "CLI-004 wires ticket open/close commands while leaving spec-unit validation as planned-command guidance."
