SPECIFICATION Spec

CONSTANTS
  SpecRoots = {default_specs, custom_specs}
  Tickets = {cli_entrypoint, cli_workflow, cli_validation}
  NoRoot = NoRoot
  NoReason = NoReason

INVARIANTS
  TypeInvariant
  CliInstalledRequiresBuilt
  WorkflowRequiresProject
  ProjectChoosesKnownSpecRoot
  NoOpenClosedOverlap
  CurrentRequiresDesired
  SpecUnitTestsRequireCurrent
  ClosedTicketsPassedSpecUnitTests
