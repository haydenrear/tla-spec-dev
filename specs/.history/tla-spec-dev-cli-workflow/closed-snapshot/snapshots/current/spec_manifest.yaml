module: TlaSpecDevCli
package: current_program_cases

status:
  workflow: ticket
  active_ticket: null
  active_ticket_title: null
  relation_to_program_model: implemented_cli_documentation_slice
  relation_to_desired_program_model: completed_prefix_through_cli_007
  current_model_rule: whole_program_working_copy_not_ticket_projection
  updated: null
  current_slice:
    name: cli-progressive-disclosure-docs
    status: implemented
    summary: "The CLI workflow is documented through progressive-disclosure onboarding references."
    implemented_actions:
      - BuildSkillCli
      - InstallLocalCli
      - ScaffoldProject
      - ScaffoldWorkflow
      - OpenTicket
      - CloseTicket
      - RunSpecUnitTests
    validation:
      tlc:
        - python3 -c "import subprocess; subprocess.run(['bash','scripts/run_tlc.sh','specs/current/TlaSpecDevCli.tla','specs/current/MC.cfg'], timeout=30, check=True)"
      unit:
        - rg "tla-spec-dev --spec-root" README.md SKILL.md references test_graph/README.md
        - python3 scripts/tla_spec_dev.py --spec-root specs run spec-unit-tests --ticket CLI-007
        - uv run --with pytest -m pytest tests specs/current/tests -q
      graph:
        - python3 /Users/hayde/.skill-manager/skills/test-graph/scripts/run.py specWorkflow
      evidence:
        - "SKILL.md, README.md, references, and test_graph/README.md introduce tla-spec-dev before lower-level implementation scripts."
        - "Docs preserve the desired-first ticket workflow, spec-root rule, and specWorkflow reference path."
  next: []

source_model:
  program_model_manifest: ../program_model/spec_manifest.yaml
  program_model_module: ../program_model/TlaSpecDevCli.tla
  desired_ticket_plan: ../desired_program_model/ticket_plan.yaml

state:
  TlaSpecDevCliState:
    fields:
      cli_built:
        type: bool
        tla: cli_built
      cli_installed:
        type: bool
        tla: cli_installed
      spec_root:
        type: SpecRoot
        tla: spec_root
      project_scaffolded:
        type: bool
        tla: project_scaffolded
      workflow_scaffolded:
        type: bool
        tla: workflow_scaffolded
      active_tickets:
        type: frozenset[TicketId]
        tla: active_tickets
      desired_ready:
        type: dict[TicketId, bool]
        tla: desired_ready
      current_ready:
        type: dict[TicketId, bool]
        tla: current_ready
      spec_unit_tests_passed:
        type: dict[TicketId, bool]
        tla: spec_unit_tests_passed
      closed_tickets:
        type: frozenset[TicketId]
        tla: closed_tickets
      last_command:
        type: str
        tla: lastCommand

actions:
  - BuildSkillCli
  - InstallLocalCli
  - ScaffoldProject
  - ScaffoldWorkflow
  - OpenTicket
  - UpdateTicketDesired
  - UpdateTicketCurrent
  - RunSpecUnitTests
  - CloseTicket

commands:
  build_skill_cli:
    cli: skill-script:tla-spec-dev creates the local wrapper
    action: BuildSkillCli
    adapter: BuildSkillCliAdapter
  install_local_cli:
    cli: tla-spec-dev --help
    action: InstallLocalCli
    adapter: InstallLocalCliAdapter
  scaffold_project:
    cli: tla-spec-dev --spec-root <root> scaffold project
    action: ScaffoldProject
    adapter: ScaffoldProjectAdapter
  scaffold_workflow:
    cli: tla-spec-dev --spec-root <root> scaffold workflow
    action: ScaffoldWorkflow
    adapter: ScaffoldWorkflowAdapter
  open_ticket:
    cli: tla-spec-dev --spec-root <root> open ticket <ticket-name>
    action: OpenTicket
    adapter: OpenTicketAdapter
  run_spec_unit_tests:
    cli: tla-spec-dev --spec-root <root> run spec-unit-tests
    action: RunSpecUnitTests
    adapter: RunSpecUnitTestsAdapter
  close_ticket:
    cli: tla-spec-dev --spec-root <root> close ticket <ticket-name>
    action: CloseTicket
    adapter: CloseTicketAdapter
  validate_test_graph_cli:
    cli: python3 /Users/hayde/.skill-manager/skills/test-graph/scripts/run.py specWorkflow
    action: ValidateTestGraphCli
    adapter: TestGraphCliAdapter

ports:
  TlaSpecDevCliPort:
    role: production_adapter_surface
    commands:
      - BuildSkillCli
      - InstallLocalCli
      - ScaffoldProject
      - ScaffoldWorkflow
      - OpenTicket
      - CloseTicket
      - RunSpecUnitTests
      - ValidateTestGraphCli

invariants:
  - TypeInvariant
  - CliInstalledRequiresBuilt
  - WorkflowRequiresProject
  - ProjectChoosesKnownSpecRoot
  - NoOpenClosedOverlap
  - CurrentRequiresDesired
  - SpecUnitTestsRequireCurrent
  - ClosedTicketsPassedSpecUnitTests

case_codegen:
  style: explicit_transition_cases
  generation_status: planned

adapters: case_adapters.toml
notes:
  package_from_program_model: tlaspecdevcli_program_cases
  progressive_disclosure: "CLI-007 documents the end-to-end CLI workflow through progressive-disclosure onboarding references."
