module: TlaSpecDevCli
package: current_program_cases

status:
  workflow: ticket
  active_ticket: CLI-006
  active_ticket_title: "Validate CLI with Test Graph"
  relation_to_program_model: implemented_cli_test_graph_validation_slice
  relation_to_desired_program_model: completed_prefix_through_cli_006
  current_model_rule: whole_program_working_copy_not_ticket_projection
  updated: null
  current_slice:
    name: cli-test-graph-validation
    status: implemented
    summary: "The CLI workflow is validated through Test Graph against disposable git repositories."
    implemented_actions:
      - BuildSkillCli
      - InstallLocalCli
      - ScaffoldProject
      - ScaffoldWorkflow
      - OpenTicket
      - CloseTicket
      - RunSpecUnitTests
    validation:
      tlc:
        - python3 -c "import subprocess; subprocess.run(['bash','scripts/run_tlc.sh','specs/current/TlaSpecDevCli.tla','specs/current/MC.cfg'], timeout=30, check=True)"
      unit:
        - uv run --with pytest -m pytest tests/test_tla_spec_dev_cli.py specs/current/tests tests/test_generate_cases_from_tlc_dump.py tests/test_case_adapter_runtime.py -q
      graph:
        - python3 /Users/hayde/.skill-manager/skills/test-graph/scripts/discover.py cliWorkflow
        - python3 /Users/hayde/.skill-manager/skills/test-graph/scripts/discover.py specWorkflow
        - python3 /Users/hayde/.skill-manager/skills/test-graph/scripts/run.py --all
      evidence:
        - "specWorkflow invokes the installed CLI for project scaffold, workflow scaffold, open ticket, spec-unit validation, and close ticket."
        - "specWorkflow includes a failure-cleanup probe that runs an intentionally failing graph and asserts the cleanup finalizer removes its fixture repository."
        - "Ticket-local TestGraphCliAdapter validates graph composition and failure-cleanup probe artifacts."
  next:
    - CLI-007 documents progressive-disclosure CLI onboarding.

source_model:
  program_model_manifest: ../program_model/spec_manifest.yaml
  program_model_module: ../program_model/TlaSpecDevCli.tla
  desired_ticket_plan: ../desired_program_model/ticket_plan.yaml

state:
  TlaSpecDevCliState:
    fields:
      cli_built:
        type: bool
        tla: cli_built
      cli_installed:
        type: bool
        tla: cli_installed
      spec_root:
        type: SpecRoot
        tla: spec_root
      project_scaffolded:
        type: bool
        tla: project_scaffolded
      workflow_scaffolded:
        type: bool
        tla: workflow_scaffolded
      active_tickets:
        type: frozenset[TicketId]
        tla: active_tickets
      desired_ready:
        type: dict[TicketId, bool]
        tla: desired_ready
      current_ready:
        type: dict[TicketId, bool]
        tla: current_ready
      spec_unit_tests_passed:
        type: dict[TicketId, bool]
        tla: spec_unit_tests_passed
      closed_tickets:
        type: frozenset[TicketId]
        tla: closed_tickets
      last_command:
        type: str
        tla: lastCommand

actions:
  - BuildSkillCli
  - InstallLocalCli
  - ScaffoldProject
  - ScaffoldWorkflow
  - OpenTicket
  - UpdateTicketDesired
  - UpdateTicketCurrent
  - RunSpecUnitTests
  - CloseTicket

commands:
  build_skill_cli:
    cli: skill-script:tla-spec-dev creates the local wrapper
    action: BuildSkillCli
    adapter: BuildSkillCliAdapter
  install_local_cli:
    cli: tla-spec-dev --help
    action: InstallLocalCli
    adapter: InstallLocalCliAdapter
  scaffold_project:
    cli: tla-spec-dev --spec-root <root> scaffold project
    action: ScaffoldProject
    adapter: ScaffoldProjectAdapter
  scaffold_workflow:
    cli: tla-spec-dev --spec-root <root> scaffold workflow
    action: ScaffoldWorkflow
    adapter: ScaffoldWorkflowAdapter
  open_ticket:
    cli: tla-spec-dev --spec-root <root> open ticket <ticket-name>
    action: OpenTicket
    adapter: OpenTicketAdapter
  run_spec_unit_tests:
    cli: tla-spec-dev --spec-root <root> run spec-unit-tests
    action: RunSpecUnitTests
    adapter: RunSpecUnitTestsAdapter
  close_ticket:
    cli: tla-spec-dev --spec-root <root> close ticket <ticket-name>
    action: CloseTicket
    adapter: CloseTicketAdapter
  validate_test_graph_cli:
    cli: python3 /Users/hayde/.skill-manager/skills/test-graph/scripts/run.py specWorkflow
    action: ValidateTestGraphCli
    adapter: TestGraphCliAdapter

ports:
  TlaSpecDevCliPort:
    role: production_adapter_surface
    commands:
      - BuildSkillCli
      - InstallLocalCli
      - ScaffoldProject
      - ScaffoldWorkflow
      - OpenTicket
      - CloseTicket
      - RunSpecUnitTests
      - ValidateTestGraphCli

invariants:
  - TypeInvariant
  - CliInstalledRequiresBuilt
  - WorkflowRequiresProject
  - ProjectChoosesKnownSpecRoot
  - NoOpenClosedOverlap
  - CurrentRequiresDesired
  - SpecUnitTestsRequireCurrent
  - ClosedTicketsPassedSpecUnitTests

case_codegen:
  style: explicit_transition_cases
  generation_status: planned

adapters: case_adapters.toml
notes:
  package_from_program_model: tlaspecdevcli_program_cases
  progressive_disclosure: "CLI-006 validates the end-to-end CLI workflow through Test Graph while preserving progressive workflow guidance."
