# Which view each action belongs to, and what it generates.
#
#   layer: internal  -> spec-unit cases  (case_adapters.toml)
#   layer: external  -> Test Graph cases (testgraph_bindings.yml)
#   controllability: hidden -> generates nothing; internal progress the harness
#                              cannot drive directly.
#   effect_ports: typed semantic ports required while this case executes.
#
# SCAFFOLD: keep this in sync with Internal.tla / External.tla.
actions:
  RegisterActor:
    layer: internal
    controllability: unit_direct
    generates:
      - spec_unit
    effect_ports: []
  AcceptRecord:
    layer: internal
    controllability: unit_direct
    generates:
      - spec_unit
    effect_ports: []
  PublishRecord:
    layer: internal
    controllability: unit_direct
    generates:
      - spec_unit
    effect_ports: []
  SubmitRegisterActor:
    layer: external
    controllability: e2e_direct
    generates:
      - testgraph
    effect_ports: []
  SubmitDuplicateRegisterActor:
    layer: external
    controllability: e2e_direct
    generates:
      - testgraph
    effect_ports: []
  SubmitAcceptRecord:
    layer: external
    controllability: e2e_direct
    generates:
      - testgraph
    effect_ports: []
  SubmitAcceptRecordUnknownActor:
    layer: external
    controllability: e2e_direct
    generates:
      - testgraph
    effect_ports: []
  SubmitDuplicateAcceptRecord:
    layer: external
    controllability: e2e_direct
    generates:
      - testgraph
    effect_ports: []
  RunPublishWorker:
    layer: external
    controllability: e2e_direct
    generates:
      - testgraph
    effect_ports: []
  RunPublishWorkerNoop:
    layer: external
    controllability: e2e_direct
    generates:
      - testgraph
    effect_ports: []
  HiddenInternalProgress:
    layer: internal
    controllability: hidden
    generates: []
    effect_ports: []
