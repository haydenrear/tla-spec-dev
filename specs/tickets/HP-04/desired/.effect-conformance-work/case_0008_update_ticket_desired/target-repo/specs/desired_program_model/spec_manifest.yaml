module: CliProject
package: desired_program_cases

status:
  workflow: ticket
  initial_ticket: CLI-028
  initial_ticket_title: "MF-028 spike replay"
  ticket_plan: ticket_plan.yaml
  relation_to_program_model: desired_successor_of_accepted_program_model
  relation_to_current: target_state_for_specs_current_to_converge_to
  updated: null
  summary:
    desired_model_scaffolded: true
    ticket_plan_scaffolded: true
    current_model_scaffolded: true
    generated_cases: pending
    adapters: pending
  done: []
  pending:
    - Fill in desired state/actions/invariants for the ticket.
    - Break the work into tickets in ticket_plan.yaml.
    - Update specs/current as each ticket lands.
    - Promote converged desired/current model back into specs/program_model.
    - Propose the budgets below to the user, ask which to adjust for this program, and record a one-line rationale per changed value.

# Per-program complexity and case budgets. These are advisory thresholds read
# by analyze complexity (which warns with facts and never blocks) and by the
# EXPERIMENTAL fuzzing surface (case generation, the adapter runner, the
# mutation kill test). Defaults come from references/modular_fuzzing.md;
# negotiate them with the user and record a one-line rationale for each
# changed value. Doctrine: SKILL.md "Complexity Budgets Are Advisory".
budgets:
  tlc_seconds: 120                          # hard external timeout per TLC run
  max_distinct_states: 50000                # reachable states TLC may find, per component model
  max_state_space_bound: 1000000            # static declared-representation ceiling; see modular_fuzzing.md
  max_internal_cases_per_component: 200     # spec-unit case cap per component
  max_external_cases_per_action: 50         # Test Graph case cap per external action
  kill_rate_floor: 0.8                      # minimum mutation kill rate (EXPERIMENTAL fuzzing surface; optional)
  max_component_variables: 6                # component-size heuristic
  max_component_actions: 8                  # component-size heuristic
  max_symmetric_instances: 2                # component-size heuristic (EXPERIMENTAL fuzzing surface; optional)
  source: negotiateds
  rationale: {}

# Optional dead-weight audit (advisory): add a justification: table linking
# every declared variable to what depends on it. Schema: one mapping per
# variable with at least one NON-EMPTY list among invariants/effects/
# kill_tests. Prose strings are not linkage -- a prose-only entry leaves the
# variable flagged DEAD WEIGHT. Example:
#   justification:
#     orders:
#       invariants: [SafetyInv]
#       effects: [order_submitted]
#       kill_tests: [test_order_cap]

views:
  internal:
    module: Internal.tla
    config: Internal.cfg
    spec: InternalSpec
    generates: spec_unit
    adapter_mapping: case_adapters.toml
  external:
    module: External.tla
    config: External.cfg
    spec: Spec
    generates: testgraph
    adapter_mapping: testgraph_bindings.yml

state:
  CliProjectState:
    fields:
      owners:
        type: frozenset[ActorId]
        tla: owners
      records:
        type: dict[RecordId, RecordEntry]
        tla: records
      outbox:
        type: frozenset[RecordId]
        tla: outbox
      projections:
        type: dict[RecordId, str]
        tla: projections

types:
  ActorId:
    python: str
    source: Actors
  RecordId:
    python: str
    source: Records
  ClientId:
    python: str
    source: Clients

commands:
  RegisterActor:
    action: RegisterActor
    fields:
      actor:
        type: ActorId
        tla: a
  AcceptRecord:
    action: AcceptRecord
    fields:
      actor:
        type: ActorId
        tla: a
      record:
        type: RecordId
        tla: r
  PublishRecord:
    action: PublishRecord
    fields:
      record:
        type: RecordId
        tla: r

results:
  RegisterActorResult:
    fields:
      status:
        type: int
      body:
        type: dict
  AcceptRecordResult:
    fields:
      status:
        type: int
      body:
        type: dict
  PublishRecordResult:
    fields:
      status:
        type: int
      body:
        type: dict

ports:
  CliProjectPort:
    methods:
      register_actor:
        command: RegisterActor
        result: RegisterActorResult
      accept_record:
        command: AcceptRecord
        result: AcceptRecordResult
      publish_record:
        command: PublishRecord
        result: PublishRecordResult
      snapshot:
        result: CliProjectState

invariants:
  - InternalInvariant
  - ExternalInvariant

finite_model:
  Actors:
    values:
      - actor-1
      - actor-2
  Records:
    values:
      - record-1
      - record-2
  Clients:
    values:
      - client-1

case_codegen:
  style: explicit_transition_cases
  generation_status: planned
  projection: tlc_projection.py
