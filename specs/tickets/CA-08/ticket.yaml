ainst itself for sealing after. IF EVERY PREDICTION PASSES, REPORT IT AS AN ALARM. FILE FINDINGS, FIX NOTHING. Then write the next epic's starter: amend NEXT-EPIC.md top-down, newest first, and say what the next owner must not repeat. A LOW OR UNFLATTERING RESULT IS THE PREFERRED OUTCOME; AN EPIC THAT CLOSES WITH ONLY GOOD NEWS ABOUT ITSELF HAS NOT BEEN MEASURED.",
