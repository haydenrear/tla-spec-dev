        THE INTERNAL/EXTERNAL DECOMPOSITION, performed by running the finished
        toolchain on this repository. Core.tla / Internal.tla / External.tla
        replace the single TlaSpecDevCli.tla module.

        THE CUT WAS NOT CHOSEN BY HAND. `analyze complexity` on the pre-split
        module reported modularity Q = 0.012 and proposed C1 = {kill_test,
        lastCommand, result, setup_phase, spec_root, ticket_state} /
        C2 = {complexity_gate, corpus_gate, effect_conformance}. That proposal
