      "git subtree add --prefix=skills/skt <skt-remote> b7ea313a, full history, no --squash, following specs/results/epic-self-improvement-substrate/migration/pulling-upstream.md. Subtree from the PR #54 BRANCH, not main: main (0f3807) lacks the front-door fix and nesting from it would carry the defect this epic has tripped over nine times into the unit meant to replace it. skt is NOT configured as a remote on this repo yet -- the seven existing constituents are; add it first.",
