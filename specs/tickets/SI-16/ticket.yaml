      "install-skt.sh MOVES to the plugin's own skill-scripts/. PluginUnit.unionCli resolves a skill-script: installer by the INSTALLED UNIT's name, never the declaring skill's. SI-11 measured this exact failure for tlc2 (SIS-W2-F-05): every fresh install reported 'skill-script not found: <home>/skills/tla-spec-dev/skill-scripts/install-tlc2.sh'. Leaving install-skt.sh on the contained skill reproduces it for skt.",
      "manifests fold: .claude-plugin/plugin.json (skt 0.8.2 dissolves into tla-spec-dev 0.1.0), skt's [[cli_dependencies]] spec = skill-script:skt / on_path = skt joins the carrier's skill-manager-plugin.toml, and [plugins.skt] is DELETED from the plugin's skill-project.toml -- that single line is the two-units-not-one state.",
      "skt's own skill-project.toml declares name = skill-publisher (a THIRD identity, neither skt nor tla-spec-dev) and pulls [skills.skill-manager] from github:haydenrear/skill-manager-skill as an external coord. Resolve both deliberately and say what happened to each.",
      "skt's three contained skills -- skill-manager, skt, unit-authoring -- are ALL absent from the carrier's eight, so ContainedNameCollisionIsRefused cannot fire. Verified by name intersection, not assumed.",
      "the generated <home>/bin/cli/skt wrapper gains a plugins/*/ rung resolving plugins/tla-spec-dev/skills/skt/src/skt/cli.py relative to the home it lives in, with no absolute path. NOTE the pre-demotion path plugins/skt/src/skt/cli.py is now WRONG and must not be reintroduced.",
