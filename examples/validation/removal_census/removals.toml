schema_version = 1

# ===========================================================================
# THE REMOVAL CENSUS -- what `subtract-to-measure` paid to prove itself safe
# ===========================================================================
#
# READ THE ROWS, NOT A TOTAL. The predecessor published one figure -- "-225
# lines from scripts/" -- which was true, and which hid that the same epic
# added 1677 net `code_lines` across the trees it touched. `removal_census.py`
# refuses `--total` for that reason.
#
# WHAT EACH ROLE MEANS, because the split is where a census can lie:
#
#   cut_production  lines of the MECHANISM deleted
#   cut_tests       lines of the mechanism's OWN tests deleted -- real deletion,
#                   but they stopped testing anything the moment the mechanism
#                   went, so counting them in one denominator with production
#                   code makes every ratio look cheaper than it is
#   cut_prose       documentation of the deleted mechanism
#   replacement     lines added that ARE the new mechanism -- not proof
#   proof           lines added whose only job is to show the removal was safe:
#                   seeded mutants, tests that assert the gap stayed covered,
#                   tripwires that keep the thing removed
#
# `denominator_rule`: two ratios are reported per removal, over
# `cut_production` and over all cut lines, and they are not averaged.
#
# SCOPE (R3). Every figure here is `git diff -U0` line counts over the named
# paths at the named commit range. It is NOT `code_lines` from
# `scripts/code_complexity.py`, which counts differently and is what the +1677
# figure was measured in. The two are not interchangeable and no row claims to
# be the other.

report_total = false

gap_mutant_before_table = "specs/results/scorecards/subtract-to-measure/before-state/gap-mutants-before.json"


