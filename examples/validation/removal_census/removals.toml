# ===========================================================================
# MUTANTS SEEDED UNDER `removal_is_a_delta_rule` BUT NOT IN THE CATALOGUE
# ===========================================================================
#
# R3. "Two epics of gap mutants produced two SURVIVES -> DIES and zero
# DIES -> SURVIVES" is a claim about `gap_mutants.toml`'s SM-GM series. These
# mutants were seeded under the same rule, by the same epic, and are not in it.
# ONE OF THEM WENT DIES -> SURVIVES. Counting them separately is the point.

[[mutant_outside_this_table]]
id = "SM-04-GM-T1"
seeded_by = "SM-04"
lives_in = "tests/test_score_tools.py::test_the_price_of_removing_total_measured_on_both_sides"
removal = "total-checksum-field"
before = "DIES -- `check` reports `total does not equal the sum` on an altered unsealed version 2 card"
after = "SURVIVES on an unsealed version 3 card; still DIES on a sealed one, where the R-H4 seal digest catches it"
verdict = "DIES -> SURVIVES. The only one in the epic. The removal was LOAD-BEARING for unsealed cards and the price was reported rather than absorbed."

[[mutant_outside_this_table]]
id = "SM-06-DUP-M1..M3"
seeded_by = "SM-06"
lives_in = "specs/results/scorecards/subtract-to-measure/SM-06/run_dup_mutants.py"
removal = "card-duplication"
before = "UNCAUGHT on all five surfaces -- pytest, score_tools check/audit/serve, demonstrate.py"
after = "the copies they mutated no longer exist; the after-run seeded REINTRODUCTION instead (A1, A2), both CAUGHT"
verdict = "no transition, because there was no kill to lose. The informative half of this mutant was the BEFORE table: three of four disagreeing copies of the card were invisible to every instrument this repository ships."

[[mutant_outside_this_table]]
id = "SM-06-DUP-M4"
seeded_by = "SM-06"
lives_in = "specs/results/scorecards/subtract-to-measure/SM-06/run_dup_mutants.py"
removal = "card-duplication"
before = "CAUGHT -- by `score_tools.py audit` (R-H4's seal digest), NOT by `check` as its author predicted"
after = "not re-run; the surface it rode was not removed"
verdict = "positive control, GREEN. And it caught the round's own prediction being wrong, which is why it was worth running."
