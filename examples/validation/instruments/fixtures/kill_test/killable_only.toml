# FI-02 FIXTURE -- the kill test's DEMONSTRATED PASSING INPUT.
#
# `examples/distributed_history/specs/program_model/kill_mutants.toml` with the
# THREE mutants that corpus demonstrably cannot kill removed, and nothing else
# changed. It is a fixture, NOT a repair: those three survive because the model
# is too abstract at their boundaries, which is a true finding about the example
# and is left standing where it is. What this file establishes is only the half
# of S2 that a below-floor run cannot show -- that the instrument reports PASS
# when every seeded fault does in fact die.
#
# Regenerate by dropping the [[mutants]] stanzas with ids
#   store-projection_store, inv-InternalInvariant, inv-Invariant

# MF-016: the worked mutation kill test for the distributed_history example.
#
# One seeded fault per declared effect port (spec_manifest.yaml) and one per
# model invariant (Internal.cfg). The obligation is recomputed every run by
# scripts/kill_test.py, so this file cannot silently fall behind the model.
#
# Every mutant is a real, reviewable behavioral break in the ecommerce backend
# -- an off-by-one, a dropped write, a swapped status code. None of them is a
# syntax error: a mutant that breaks the parse is killed by every case
# trivially and proves nothing about whether the REPRESENTATION is faithful.
#
# Run it:
#   python3 examples/run_distributed_history_validation.py --mode local
# or directly:
#   python3 scripts/run_kill_test.py \
#     --target examples/distributed_history/specs/program_model \
#     --root examples/distributed_history \
#     --corpus-command "<the internal spec-unit corpus command>"

# ---------------------------------------------------------------------------
# Faults at the internal component's surface.
#
# The internal model declares ONE invariant, so every fault below is seeded at
# that boundary. Coverage requires at least one; six is better than one, and
# extra mutants beyond the required minimum are always welcome -- more
# measurement is never gaming. See spec_manifest.yaml for why this component
# declares no effect ports.
# ---------------------------------------------------------------------------

[[mutants]]
id = "store-account_store"
boundary_kind = "invariant"
boundary_ref = "InternalInvariant"
path = "ecommerce_backend/domain.py"
find = '            self._conn.execute("insert or ignore into accounts(account_id) values (?)", (account_id,))'
replace = "            pass  # MUTANT: the account is never persisted"
description = "creating an account returns 201 but writes nothing to the account store"
refine_variable = "accounts"
refine_action = "CreateAccount"

[[mutants]]
id = "store-cart_store"
boundary_kind = "invariant"
boundary_ref = "InternalInvariant"
path = "ecommerce_backend/domain.py"
find = """            self._conn.execute(
                "insert into cart_items(account_id, sku, qty) values (?, ?, 1)",
                (account_id, sku),
            )
        return OperationResult(202, {"account": account_id, "sku": sku})"""
replace = """            pass  # MUTANT: the cart item is never persisted
        return OperationResult(202, {"account": account_id, "sku": sku})"""
description = "adding a cart item is acknowledged with 202 but never written to the cart store"
refine_variable = "carts"
refine_action = "AddCartItem"

[[mutants]]
id = "store-order_store"
boundary_kind = "invariant"
boundary_ref = "InternalInvariant"
path = "ecommerce_backend/domain.py"
find = '                (order_id, account_id, json.dumps(items, sort_keys=True), "accepted"),'
replace = '                (order_id, account_id, json.dumps(items, sort_keys=True), "pending"),'
description = "a checked-out order is stored with status 'pending' instead of 'accepted'"
refine_variable = "orders"
refine_action = "Checkout"

[[mutants]]
id = "store-outbox"
boundary_kind = "invariant"
boundary_ref = "InternalInvariant"
path = "ecommerce_backend/domain.py"
find = """            self._conn.execute(
                "insert into outbox(order_id, event_name) values (?, ?)",
                (order_id, "OrderAccepted"),
            )"""
replace = "            pass  # MUTANT: checkout emits no outbox event"
description = "checkout persists the order but emits no outbox event, so nothing is ever projected"
refine_variable = "outbox"
refine_action = "Checkout"

