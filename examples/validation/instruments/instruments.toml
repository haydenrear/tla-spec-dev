# FI-02. EVERY INSTRUMENT THIS REPOSITORY SHIPS, AND WHETHER IT CAN BE SHOWN
# TO FAIL.
#
#     python3 examples/validation/instruments/demonstrate.py
#
# `references/architecture_advice.md` S2: "Every criterion must have a
# demonstrated failing input and a demonstrated passing input." Written for a
# scanner that has since been deleted, never once turned on the instruments
# this repository kept. FI-01 turned it on ONE of them and the result justified
# the epic: against the parent probe exactly as it shipped, three of four
# deliberately broken controls reported HOLDS.
#
# WHAT COUNTS AS AN INSTRUMENT HERE. Something this repository ships that
# WATCHES a subject and produces a VERDICT about it -- an exit code, a printed
# refusal, or a pytest assertion about the repository rather than about a unit.
# Generators, scaffolders and libraries are enumerated only when they refuse
# something; where they do not, they are listed with `family =
# "not-an-instrument"` so the omission is recorded rather than silent, because
# a quietly dropped row is exactly the failure mode this ticket has.
#
# WHAT IS DELIBERATELY OUT. Frozen measurement scripts under
# `specs/results/**/measure/` and `examples/validation/runs/**/artifacts/` other
# than the two the ticket names: they are kept byte-identical to the run that
# produced them and re-running them is not a property of the toolchain. Pure
# argparse usage errors ("you typed the command wrong") are not verdicts about
# a subject and are not counted as failing inputs anywhere below.
#
# HOW TO READ A ROW.
#   classification  demonstrated-can-fail   | demonstrated-cannot-fail
#                   no-demonstration-constructible | no-instrument-exists
#                   not-an-instrument
#   [instrument.failing]     the subject is GENUINELY BROKEN and it must report
#   [instrument.passing]     the subject is sound and it must stay green
#   [instrument.blind_spot]  the subject is GENUINELY BROKEN and it must NOT
#                            report -- a demonstrated inability, per R2
#
# `tier = "slow"` marks a demonstration the fast pass skips: one that shells out
# to pytest, or needs `uv`, or needs a corpus that has to be generated first.

[registry]
id = "FI-02-instrument-enumeration"
ticket = "FI-02"
epic = "falsifiable-instruments"
rule = "references/architecture_advice.md S2; epic R1 and R2"
note = """
THE COUNT OF INSTRUMENTS THAT CANNOT BE SHOWN TO FAIL IS THIS FILE'S PRODUCT.
There is no target on the ratio. A high count is the honest outcome and the
epic prefers it to a flattering one; what is targeted is only that nothing is
silently omitted.
"""

# SM-03. WHERE THE OBLIGATION TO REGISTER APPLIES.
#
# Until this ticket, "nothing is silently omitted" was checked by
# `required <= enumerated` over a literal of thirteen paths -- a RENAME guard
# that could not catch an instrument NEVER ADDED, conceded in its own docstring
# and confirmed four times as `FI-04-DF-04`. Lengthening that literal was
# rejected at `EVAL-RERUN-DF-01` and again at `ARM_MODULE_PREFIXES`, and it
# would be worse here: the literal has to be edited by the same person who
# forgot to register the instrument.
#
# This block declares a SCOPE instead. Its members are DISCOVERED by walking
# the tree for executables -- a `__main__` guard plus a nonzero exit path,
# which is the definition the preamble above already uses -- and every one of
# them must appear in some row's `paths`. Adding a file cannot satisfy it; only
# adding a row can.
#
# WHAT IT STILL CANNOT SEE. A repo tripwire that is a pytest FILE has no
# `__main__` and no exit call, so `tests/test_code_complexity.py` and its four
# siblings are invisible to the scan and are registered by hand. That is a real
# remaining hole and it is written here rather than left for the next sweep.
[registry.enumeration]
roots = ["scripts", "examples/validation"]

  [[registry.enumeration.exclude]]
  path = "examples/validation/runs"
  reason = """
SEALED MEASUREMENT ARCHIVES. `runs/ex4-run1/artifacts/kill_matrix.py` and its
two siblings are kept byte-identical to the run that produced them; they are
records of a measurement, not instruments of the toolchain, and re-running one
is not a property of anything this repository ships. Already declared out by
the preamble's "WHAT IS DELIBERATELY OUT"; declared out here too so the scan
agrees with the prose instead of contradicting it.
"""

  [[registry.enumeration.exclude]]
  path = "examples/validation/ex1_scaffold_only"
  reason = """
A SCAFFOLDED SUBJECT, NOT AN INSTRUMENT. `taskq/taskq.py` is a program the
toolchain GENERATED, checked in as an example of its output. It is the thing
instruments are pointed AT. Registering it would put the subject into the
denominator of a count about the measuring equipment.
"""


# ===========================================================================
# THE FOUR ORACLES
# ===========================================================================

[[instrument]]
id = "corpus-runner"
name = "generated-case corpus runner"
paths = ["scripts/run_generated_case_adapters.py"]
family = "measurement"
watches = "every generated case's output and projected after-state against the model"
verdict_surface = "exit code 1 with the per-case diff"
classification = "demonstrated-can-fail"
note = """
The one instrument in this set whose failing input was always one line away and
had never been written down. Its catalogue of mutants is `kill_mutants.toml`;
any row of it is a re-runnable perturbation of the SUBJECT, not of the runner.
"""

  [instrument.failing]
  summary = "a checked-out order is persisted with status 'pending' instead of 'accepted' (kill_mutants.toml store-order_store, verbatim)"
  argv = ["{python}", "{repo}/scripts/run_generated_case_adapters.py",
          "{tree}/dh/specs/generated/spec_unit/ecommerce_internal_cases",
          "--mapping", "{tree}/dh/specs/program_model/case_adapters.toml",
          "--view", "internal", "--batch", "--import-root", "{tree}/dh"]
  cwd = "{tree}/dh"
  expect_exit = 1
  expect_output = ["batched case executions failed", "adapter after-state mismatch"]

    [[instrument.failing.stage]]
    from = "examples/distributed_history"
    to = "dh"

    [[instrument.failing.mutate]]
    file = "dh/ecommerce_backend/domain.py"
    find = '                (order_id, account_id, json.dumps(items, sort_keys=True), "accepted"),'
    replace = '                (order_id, account_id, json.dumps(items, sort_keys=True), "pending"),'

  [instrument.passing]
  summary = "the same corpus against the same tree, unmutated"
  argv = ["{python}", "{repo}/scripts/run_generated_case_adapters.py",
          "{tree}/dh/specs/generated/spec_unit/ecommerce_internal_cases",
          "--mapping", "{tree}/dh/specs/program_model/case_adapters.toml",
          "--view", "internal", "--batch", "--import-root", "{tree}/dh"]
  cwd = "{tree}/dh"
  expect_exit = 0
  expect_output = ["executed 4 cases in batch"]

    [[instrument.passing.stage]]
    from = "examples/distributed_history"
    to = "dh"

[[instrument]]
id = "effect-oracle"
name = "MF-013 effect conformance oracle"
paths = ["scripts/effect_conformance.py", "scripts/effect_conformance_report.py"]
family = "measurement"
watches = "observed filesystem/network/process effects against the ports the model declares"
verdict_surface = "exit 1 (gap, dead surface, unobservable), exit 2 (malformed declarations)"
classification = "demonstrated-can-fail"
note = """
Its failing input is driven through the SHIPPED runner path
(`execute_cases_in_batch`), not through the diff in isolation, because the
enforcing copy and the reporting copy are two call sites and only one of them
decides a run.
"""

  [instrument.failing]
  kind = "pytest"
  tier = "slow"
  summary = "an adapter that writes into a directory no port covers, and one that declares a port no case exercises"
  nodes = [
    "tests/test_effect_conformance_runner.py::TestRunnerEnforcesEffectConformance::test_undeclared_effect_fails_the_run",
    "tests/test_effect_conformance_runner.py::TestRunnerEnforcesEffectConformance::test_dead_declared_port_fails_the_run",
  ]
  expect_exit = 0
  expect_passed = 2  # SM-03: exit 0 is also what a fully-skipped run returns

  [instrument.passing]
  kind = "pytest"
  tier = "slow"
  summary = "an adapter that writes only where its port says it writes"
  nodes = ["tests/test_effect_conformance_runner.py::TestRunnerEnforcesEffectConformance::test_declared_only_adapter_passes"]
  expect_exit = 0
  expect_passed = 1  # SM-03: exit 0 is also what a fully-skipped run returns

  [instrument.blind_spot]
  kind = "declared"
  summary = "a process.spawn is UNOBSERVABLE whatever a port declares, so any effect a child process performs is outside this oracle by construction -- the kill test must run outside the sandbox for exactly this reason, and says so on every run"
  reason = "MF-027. Not a defect and not repairable here; recorded so the oracle's reach is not read as total."

[[instrument]]
id = "kill-test-floor"
name = "MF-016 mutation kill test"
paths = ["scripts/kill_test.py", "scripts/run_kill_test.py"]
family = "measurement"
watches = "whether the distilled corpus can tell a seeded fault from the correct program"
verdict_surface = "exit 1 below floor / regressed, exit 2 incomplete catalogue / no control"
classification = "demonstrated-can-fail"

  [instrument.failing]
  summary = "the shipped distributed-history example: 3 of 7 seeded faults survive the corpus, 0.571 against a floor of 0.800 -- a genuinely under-refined representation, not a contrived one"
  argv = ["{python}", "{repo}/scripts/run_kill_test.py",
          "--target", "{tree}/dh/specs/program_model", "--root", "{tree}/dh",
          "--cfg", "Internal.cfg",
          "--corpus-command", "{python} {repo}/scripts/run_generated_case_adapters.py {tree}/dh/specs/generated/spec_unit/ecommerce_internal_cases --mapping {tree}/dh/specs/program_model/case_adapters.toml --view internal --batch --import-root {tree}/dh"]
  expect_exit = 1
  expect_output = ["BELOW FLOOR", "There is no waiver"]

    [[instrument.failing.stage]]
    from = "examples/distributed_history"
    to = "dh"

  [instrument.passing]
  summary = "the same corpus over a catalogue containing only faults it does kill"
  argv = ["{python}", "{repo}/scripts/run_kill_test.py",
          "--target", "{tree}/dh/specs/program_model", "--root", "{tree}/dh",
          "--cfg", "Internal.cfg",
          "--corpus-command", "{python} {repo}/scripts/run_generated_case_adapters.py {tree}/dh/specs/generated/spec_unit/ecommerce_internal_cases --mapping {tree}/dh/specs/program_model/case_adapters.toml --view internal --batch --import-root {tree}/dh"]
  expect_exit = 0
  expect_output = ["PASS: kill rate 1.000"]

    [[instrument.passing.stage]]
    from = "examples/distributed_history"
    to = "dh"

    [[instrument.passing.stage]]
    from = "examples/validation/instruments/fixtures/kill_test/killable_only.toml"
    to = "dh/specs/program_model/kill_mutants.toml"

[[instrument]]
id = "kill-test-boundary-coverage"
name = "kill test boundary coverage (--list-boundaries)"
paths = ["scripts/run_kill_test.py"]
family = "measurement"
watches = "that every boundary the model declares carries a seeded fault"
verdict_surface = "exit 2 on an incomplete catalogue"
classification = "demonstrated-can-fail"

  [instrument.failing]
  summary = "the model grows a declared port and the catalogue does not follow it -- the drift a sealed catalogue certificate hides"
  argv = ["{python}", "{repo}/scripts/run_kill_test.py",
          "--target", "{tree}/dh/specs/program_model", "--root", "{tree}/dh",
          "--list-boundaries"]
  expect_exit = 2
  expect_output = ["NO MUTANT"]

    [[instrument.failing.stage]]
    from = "examples/distributed_history"
    to = "dh"

    [[instrument.failing.mutate]]
    file = "dh/specs/program_model/spec_manifest.yaml"
    find = "budgets:"
    replace = """effects:
  components:
    ledger:
      ports:
        unseeded_port:
          type: filesystem.write
          target: "**/never-seeded/**"
  actions:
    Checkout: [unseeded_port]

budgets:"""

  [instrument.passing]
  summary = "the catalogue as shipped: every declared boundary carries a seeded fault"
  argv = ["{python}", "{repo}/scripts/run_kill_test.py",
          "--target", "{tree}/dh/specs/program_model", "--root", "{tree}/dh",
          "--list-boundaries"]
  expect_exit = 0
  expect_output = ["declared boundaries carry a seeded fault"]

    [[instrument.passing.stage]]
    from = "examples/distributed_history"
    to = "dh"

[[instrument]]
id = "corpus-diagnostics"
name = "corpus case-cap diagnostics"
paths = ["scripts/corpus_diagnostics.py"]
family = "measurement"
watches = "the per-component and per-action case distribution against declared caps"
verdict_surface = "exit 1 over cap; exit 2 via enforce_case_cap inside generation"
classification = "demonstrated-can-fail"

  [instrument.failing]
  summary = "a component carrying more cases than its declared cap allows"
  argv = ["{python}", "{repo}/scripts/corpus_diagnostics.py",
          "{tree}/dh/specs/generated/spec_unit/ecommerce_internal_cases",
          "--manifest", "{tree}/dh/specs/program_model/spec_manifest.yaml"]
  expect_exit = 1

    [[instrument.failing.stage]]
    from = "examples/distributed_history"
    to = "dh"

    [[instrument.failing.mutate]]
    file = "dh/specs/program_model/spec_manifest.yaml"
    find = "max_internal_cases_per_component: 200"
    replace = "max_internal_cases_per_component: 2"

  [instrument.passing]
  summary = "the same corpus under the caps it was generated against"
  argv = ["{python}", "{repo}/scripts/corpus_diagnostics.py",
          "{tree}/dh/specs/generated/spec_unit/ecommerce_internal_cases",
          "--manifest", "{tree}/dh/specs/program_model/spec_manifest.yaml"]
  expect_exit = 0
  expect_output = ["Every component is within cap"]

    [[instrument.passing.stage]]
    from = "examples/distributed_history"
    to = "dh"

[[instrument]]
id = "tla-complexity-descriptor"
name = "TLA+ complexity descriptor (analyze complexity)"
paths = ["scripts/analyze_complexity.py"]
family = "measurement"
watches = "model dimension, state-space bound, per-component variables and actions, the R/W matrix"
verdict_surface = "exit 1 ONLY when the model cannot be analyzed; complexity itself is advisory"
classification = "demonstrated-can-fail"
note = """
CAN FAIL, BUT NOT ON THE THING ITS NAME DESCRIBES. Its failing input is 'I
could not analyze this', never 'this is too complex'. That is MF-036 working as
designed and it is the reason the blind-spot row below exists rather than a
finding.
"""

  [instrument.failing]
  summary = "a module hierarchy the analyzer cannot resolve -- an INSTANCE it does not model, so it fails closed rather than under-report the bound"
  argv = ["{python}", "{repo}/scripts/analyze_complexity.py",
          "{tree}/model/QuotaLedger.tla", "{tree}/model/QuotaLedger.cfg"]
  expect_exit = 1
  expect_output = ["could not analyze this model"]

    [[instrument.failing.stage]]
    from = "examples/validation/ab/model"
    to = "model"

    [[instrument.failing.mutate]]
    file = "model/QuotaLedger.tla"
    find = "Spec == Init /\\ [][Next]_vars"
    replace = "Spec == Init /\\ [][Next]_vars\n\nBase == INSTANCE QuotaLedgerBase"

  [instrument.passing]
  summary = "the same model, resolvable"
  argv = ["{python}", "{repo}/scripts/analyze_complexity.py",
          "{tree}/model/QuotaLedger.tla", "{tree}/model/QuotaLedger.cfg"]
  expect_exit = 0

    [[instrument.passing.stage]]
    from = "examples/validation/ab/model"
    to = "model"

  [instrument.blind_spot]
  summary = "a model 432x over its own declared state-space bound and 5x over its per-component variable bound: WARNINGS, and exit 0. There is no input that makes this instrument refuse on complexity, deliberately (MF-036, and CD-01: a tool that picks the boundary makes every edge legal by construction)."
  argv = ["{python}", "{repo}/scripts/analyze_complexity.py",
          "{tree}/model/QuotaLedger.tla", "{tree}/model/QuotaLedger.cfg"]
  expect_exit = 0
  expect_output = ["exceeds max_state_space_bound", "COMPLEXITY WARNINGS"]

    [[instrument.blind_spot.stage]]
    from = "examples/validation/ab/model"
    to = "model"

    [[instrument.blind_spot.mutate]]
    file = "model/spec_manifest.yaml"
    append = """

budgets:
  max_distinct_states: 1
  max_state_space_bound: 1
  max_component_variables: 1
  max_component_actions: 1
"""

[[instrument]]
id = "produced-code-instrument"
name = "produced-code complexity thermometer"
paths = ["scripts/code_complexity.py"]
family = "measurement"
watches = "the shape of produced Python: branch points, depth, state, effectful calls, declared interfaces"
verdict_surface = "none -- it prints figures and exits 0 on every input"
classification = "demonstrated-cannot-fail"
no_failing_demonstration = """
BY CONSTRUCTION AND ON PURPOSE, and this is the one row where that is the
correct answer rather than a defect. It is a THERMOMETER: it reports, refuses
nothing, gates nothing, and exits 0 on a tree that does not exist, a file that
does not parse and a file that is not UTF-8. `EXIT_OK = 0` is the only exit
constant in the file and `tests/test_code_complexity.py` asserts that against
the AST, not against prose. 'I could not measure this' is a completeness fact
printed with the path and the reason. The blind-spot row demonstrates the
inability rather than asserting it.
"""

  [instrument.passing]
  summary = "two implementations of one spec, told apart"
  argv = ["{python}", "{repo}/scripts/code_complexity.py",
          "{repo}/examples/validation/ab/reference",
          "{repo}/examples/validation/ab/reference_ports"]
  cwd = "{repo}"
  expect_exit = 0
  expect_output = ["branch_points"]

  [instrument.blind_spot]
  summary = "a tree with a file that does not parse, a path that is not there, and a module 12 branches deep in every method: exit 0, every time. Nothing you can put in front of this instrument makes it refuse."
  argv = ["{python}", "{repo}/scripts/code_complexity.py",
          "{tree}/subject", "{tree}/no-such-tree"]
  expect_exit = 0

    [[instrument.blind_spot.stage]]
    from = "examples/validation/ab/reference"
    to = "subject"

    [[instrument.blind_spot.mutate]]
    file = "subject/quota_ledger.py"
    append = "\n\ndef truncated(:\n"

[[instrument]]
id = "catalogue-integrity"
name = "seeded-fault catalogue integrity harness"
paths = ["examples/validation/ab/check_catalogue.py"]
family = "measurement"
watches = "that every catalogued fault applies exactly once, reverts byte-identically, still parses, and covers every required class and gap"
verdict_surface = "exit 1, CATALOGUE INTEGRITY FAILED, with one line per problem"
classification = "demonstrated-can-fail"

  [instrument.failing]
  summary = "the tree moves under the catalogue -- a guard is rewritten and a seeded fault silently stops applying, which is the drift that turns a survivor into a lie"
  argv = ["{python}", "{repo}/examples/validation/ab/check_catalogue.py",
          "--root", "{tree}/ab", "--catalogue", "{tree}/ab/seeded_faults.toml"]
  expect_exit = 1
  expect_output = ["CATALOGUE INTEGRITY FAILED", "must be exactly 1"]

    [[instrument.failing.stage]]
    from = "examples/validation/ab"
    to = "ab"

    [[instrument.failing.mutate]]
    file = "ab/reference/quota_ledger.py"
    find = "        if amount < 1:"
    replace = "        if amount <= 0:"

  [instrument.passing]
  summary = "the sealed catalogue on its own anchor trees"
  argv = ["{python}", "{repo}/examples/validation/ab/check_catalogue.py",
          "--root", "{tree}/ab", "--catalogue", "{tree}/ab/seeded_faults.toml"]
  expect_exit = 0

    [[instrument.passing.stage]]
    from = "examples/validation/ab"
    to = "ab"

  [instrument.blind_spot]
  kind = "declared"
  summary = "it makes a MEASUREMENT catalogue's obligations of a SUPPLEMENT catalogue, so probing one control on one arm prints sixteen complaints that are all true of the wrong file, and it refuses every per-arm catalogue including two sealed ones"
  reason = "PA-06-DF-01 and FI-01-DF-02, both open. Not repaired here: FI-02 measures WITH this harness, and widening or narrowing a check during the measurement that uses it is the forbidden half of the repair rule."

[[instrument]]
id = "control-property-probe"
name = "control-property probe (--demonstrate)"
paths = ["examples/validation/ab/check_catalogue.py", "examples/validation/ab/probe_demonstrations.toml"]
family = "measurement"
watches = "that a declared positive control is invisible before its path runs and observable after ONE step, inside the region it claims"
verdict_surface = "exit 1, THE PROBE FAILED ITS OWN DEMONSTRATION"
classification = "demonstrated-can-fail"
note = """
FI-01's row, and the epic's proof of concept. Against the PARENT probe exactly
as it shipped, three of four broken controls reported HOLDS -- a no-op, one
observable outside the port's region, and one not observable in a single step.
Every HOLDS that probe printed was uninformative, including the one PA-01 cited
as evidence its repair worked.
"""

  [instrument.failing]
  kind = "pytest"
  tier = "slow"
  summary = "the probe made to go soft: forced to answer HOLDS, the demonstration must fail"
  nodes = ["tests/test_falsifiable_controls.py::test_the_demonstration_FAILS_if_the_probe_goes_soft"]
  expect_exit = 0
  expect_passed = 1  # SM-03: exit 0 is also what a fully-skipped run returns

  [instrument.passing]
  summary = "five controls broken on purpose, each declaring the verdict the probe must return, plus one that works"
  argv = ["{python}", "{repo}/examples/validation/ab/check_catalogue.py", "--demonstrate",
          "--catalogue", "{repo}/examples/validation/ab/probe_demonstrations.toml"]
  cwd = "{repo}"
  expect_exit = 0
  expect_output = ["R1 holds"]

[[instrument]]
id = "port-scoped-control-check"
name = "declared-control check (--controls)"
paths = ["examples/validation/ab/check_catalogue.py"]
family = "measurement"
watches = "that every mutant declared a positive control actually holds its declared property on its tree"
verdict_surface = "exit 1 naming the control and the tree"
classification = "demonstrated-can-fail"
no_passing_demonstration = """
There is no green run of this command in the repository today, and that is the
correct state rather than a gap: PA-M14 is INERT on `reference_ports` and R2
says it is REPORTED RED, not re-anchored into looking fine. Its only other
subject is a per-arm supplement catalogue, and those trip PA-06-DF-01's false
integrity complaints, so a green would have to be manufactured.
"""

  [instrument.failing]
  summary = "the repository as it stands: PA-M14 is declared a positive control and cannot be observed in one step on the tree it is declared on"
  argv = ["{python}", "{repo}/examples/validation/ab/check_catalogue.py", "--controls"]
  cwd = "{repo}"
  expect_exit = 1
  expect_output = ["PA-M14", "reported RED"]

[[instrument]]
id = "arms-length-match"
name = "A/B arm length-match and vocabulary check (--arms)"
paths = ["examples/validation/ab/check_catalogue.py"]
family = "measurement"
watches = "that arm C is length-matched to arm B and uses no architectural vocabulary"
verdict_surface = "exit 1"
classification = "demonstrated-can-fail"
note = "`check_arms()` takes no root and resolves the three PROMPT.md files from the script's own location, so its subject cannot be staged; the failing input is therefore the vocabulary probe's own non-vacuity test rather than a staged tree."

  [instrument.failing]
  kind = "pytest"
  tier = "slow"
  summary = "the vocabulary probe run against text that DOES carry architectural vocabulary, so a probe that found nothing anywhere would fail"
  nodes = ["tests/test_ab_three_arms_and_port_faults.py::test_the_vocabulary_probe_is_not_vacuous"]
  expect_exit = 0
  expect_passed = 1  # SM-03: exit 0 is also what a fully-skipped run returns

  [instrument.passing]
  summary = "the three shipped prompts"
  argv = ["{python}", "{repo}/examples/validation/ab/check_catalogue.py", "--arms",
          "--catalogue", "{repo}/examples/validation/ab/seeded_faults.toml"]
  cwd = "{repo}"
  expect_exit = 0

[[instrument]]
id = "suite-verification"
name = "suite prediction verification (--verify-suite)"
paths = ["examples/validation/ab/check_catalogue.py"]
family = "measurement"
watches = "nominally, whether a mutant's recorded `predicted_suite` matches what the suite actually does"
verdict_surface = "prints `*** DISAGREES ***`; NEVER adds the disagreement to `problems`"
classification = "demonstrated-cannot-fail"
no_failing_demonstration = """
A PREDICTION DISAGREEMENT CANNOT MAKE IT RED. `verify_suite` prints
`*** DISAGREES ***` for a wrong prediction and then does not append it to
`problems`, and the function says so in its own closing disclaimer. Only two
conditions reach `problems`: a missing anchor tree, and a control run that is
already red on the UNMUTATED tree. So the one thing the mode is named for is
the one thing it cannot report, and every `predicted_suite` annotation in the
catalogue is unchecked prose. Filed as FI-02-DF-01.
"""


[[instrument]]
id = "control-decision-driver"
name = "control-decision driver (run_controls.py)"
paths = ["examples/validation/ab/eval/run_controls.py"]
family = "measurement"
watches = "per-instrument control verdicts: a positive control must die, a negative one must survive, and a declared limitation may not erase a demonstrated kill"
verdict_surface = "exit 1 with controls_red / polarities_with_no_deciding_control"
classification = "demonstrated-can-fail"

  [instrument.failing]
  tier = "slow"
  summary = "the negative control is rewritten into a fault the suite catches, so a control declared to SURVIVE is killed -- the retraction the catalogue itself calls a finding"
  argv = ["{python}", "{repo}/examples/validation/ab/eval/run_controls.py",
          "--label", "FI-02-failing", "--tree", "{tree}/ab",
          "--module-dir", "reference", "--binding", "reference_binding",
          "--catalogue", "{tree}/ab/eval/controls.toml",
          "--suite", "{tree}/ab/tests/test_behavior.py",
