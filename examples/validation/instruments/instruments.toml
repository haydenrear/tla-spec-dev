# ===========================================================================
# ADDED BY SM-03 -- THE EIGHTEEN THE ENUMERATION COULD NOT SEE
# ===========================================================================
#
# `FI-06-DF-01` said the registry was short by "AT LEAST EIGHT". Once the check
# stopped being a literal and started walking the tree, the number was
# EIGHTEEN, and one of them is `demonstrate.py` -- the file that prints the
# count.
#
# READ THE ARITHMETIC BEFORE THE ROWS. These rows make the denominator BIGGER
# and the headline ratio WORSE, and that is the honest direction:
# `26 of 35` was never a ratio over a known set, it was a ratio over the set
# somebody remembered. `denominator_rule` is usually pointed at a denominator
# that SHRANK; it applies just as hard to one that was too small to begin with.
#
# Most of these carry no failing demonstration and say why. That is the R2
# shape, not a placeholder: a row with a written reason is a thing a reader can
# argue with, and a missing row is not.


[[instrument]]
id = "enumeration-runner"
name = "the instrument enumerator itself"
paths = ["examples/validation/instruments/demonstrate.py"]
family = "measurement"
watches = "every declared demonstration in this file, and whether it still reproduces"
verdict_surface = "exit 1 when a declared demonstration stops reproducing"
classification = "demonstrated-can-fail"
note = """
THE INSTRUMENT THAT COUNTS THE INSTRUMENTS, ABSENT FROM ITS OWN REGISTRY for
three tickets. `FI-06-DF-01` named it; `SM-GM-I5` seeded its verdict away and
found the enumerator's exit code IS watched, by the two nodes cited below --
so the counts this file prints were not, after all, coming from a program
nobody checked. That was a refutation of `SM-01`'s own prediction `N06` and it
is why this row is `demonstrated-can-fail` rather than an admission.
"""

  [instrument.failing]
  kind = "pytest"
  tier = "slow"
  summary = "a declaration that is false (a run declared to exit 1 that exits 0), and a mutation whose `find` string occurs zero times -- the runner must report both rather than print `ok`"
  nodes = [
    "tests/test_instrument_demonstrations.py::test_the_runner_REPORTS_a_demonstration_that_stops_reproducing",
    "tests/test_instrument_demonstrations.py::test_the_runner_refuses_a_mutation_that_seeds_nothing",
  ]
  expect_exit = 0
  expect_passed = 2

  [instrument.passing]
  kind = "pytest"
  tier = "slow"
  summary = "the shipped registry's own fast tier, every declaration reproducing"
  nodes = ["tests/test_instrument_demonstrations.py::test_every_fast_demonstration_reproduces"]
  expect_exit = 0
  expect_passed = 1

  [instrument.blind_spot]
  kind = "pytest"
  tier = "slow"
  summary = "IT CANNOT SEE A SLOT THAT DEMONSTRATES NOTHING, ONLY ONE THAT DEMONSTRATES WRONGLY. `expect_passed` closes the vacuous-run hole SM-GM-I1 found, but a slot citing a node whose assertions are all trivially true still reports `ok` at full count -- the runner judges that the cited test PASSED, never what it asserted."
  nodes = ["tests/test_instrument_demonstrations.py::test_a_cited_node_that_asserts_nothing_still_reports_ok"]
  expect_exit = 0
  expect_passed = 1


[[instrument]]
id = "registry-enumeration-coverage"
name = "executables under a declared root with no registry row"
paths = ["examples/validation/instruments/demonstrate.py"]
family = "repo-tripwire"
watches = "every `__main__`-guarded file with a nonzero exit path under `[registry.enumeration] roots`, against the set of declared `paths`"
verdict_surface = "exit 1 naming each unregistered executable"
classification = "demonstrated-can-fail"
note = """
SM-03's repair of `FI-04-DF-04`, confirmed four times and never fixed because
every proposed fix was a longer list. `SM-GM-I3` is its demonstrated failing
input and it SURVIVED everything at SM-01: a new executable under `scripts/`
with argparse, a `__main__` and a nonzero exit, no row, and both
`registry-enumeration` and the full suite green.

It is measured against a tree it is HANDED, never against wherever it lives.
SM-01 found the gap-mutant runner detecting itself for exactly the opposite
reason, and anything that measures the registry inherits that risk.
"""

  [instrument.failing]
  summary = "an executable under a declared root, with argparse, a `__main__` and a nonzero exit path, and no row anywhere -- SM-GM-I3, staged"
  argv = ["{python}", "{repo}/examples/validation/instruments/demonstrate.py",
          "--check-enumeration", "--root", "{tree}"]
  expect_exit = 1
  expect_output = ["UNREGISTERED INSTRUMENTS: 1", "scripts/gap_probe_instrument.py"]

    [[instrument.failing.stage]]
    from = "examples/validation/gap_mutants/run_gap_mutants.py"
    to = "scripts/gap_probe_instrument.py"

  [instrument.passing]
  summary = "THE SAME FILE, at a path the registry DOES declare. The scan discovers a candidate in both trees, so the red above is the missing ROW's doing and not the staging's -- a passing slot that staged an empty tree would only have proved that nothing was found."
  argv = ["{python}", "{repo}/examples/validation/instruments/demonstrate.py",
          "--check-enumeration", "--root", "{tree}"]
  expect_exit = 0
  expect_output = ["Every discovered executable has a row."]

    [[instrument.passing.stage]]
    from = "examples/validation/gap_mutants/run_gap_mutants.py"
    to = "scripts/tla_spec_dev.py"

  [instrument.blind_spot]
  kind = "pytest"
  tier = "slow"
  summary = "IT CANNOT SEE A REPO TRIPWIRE THAT IS A PYTEST FILE. The predicate is a `__main__` guard plus a nonzero exit path, and `tests/test_code_complexity.py` and its four siblings have neither -- so the five rows the registry most depends on are exactly the five this check would never have asked for."
  nodes = ["tests/test_instrument_demonstrations.py::test_the_derived_check_cannot_see_a_tripwire_that_is_a_test_file"]
  expect_exit = 0
  expect_passed = 1


