id = "M07"
class = "guard_accepts"
path = "pipeline/dispatch/delivery.py"
find = """        if item in failed:
            return False
"""
replace = """        if False:  # MUTANT M07: a failed item can be re-delivered
            return False
"""

[[mutant]]
id = "M08"
class = "missing_write"
path = "pipeline/dispatch/failures.py"
find = """        if not self._dispatcher.release(item):
            return False
        self._failed.add(item)
"""
replace = """        self._failed.add(item)  # MUTANT M08: failed but still delivered
"""

[[mutant]]
id = "M09"
class = "guard_accepts"
path = "pipeline/ledger/journal.py"
find = """        if item in self._entries:
            return False
"""
replace = """        if False:  # MUTANT M09: the ledger is no longer append-only
            return False
"""

