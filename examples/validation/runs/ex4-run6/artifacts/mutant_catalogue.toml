path = "pipeline/ledger/journal.py"
find = "        self._entries.append(item)"
replace = "        self._entries.append(item.upper())  # MUTANT M12: wrong value recorded"

[[mutant]]
id = "M13"
class = "durable_write"
path = "pipeline/ledger/journal.py"
find = """        self._store.persist(PersistLedger(entries=",".join(self._entries)))"""
replace = """        return  # MUTANT M13: nothing is ever persisted"""

[[mutant]]
id = "M14"
class = "durable_write"
path = "pipeline/ledger/journal.py"
find = """        self._store.persist(PersistLedger(entries=",".join(self._entries)))"""
replace = """        self._store.persist(PersistLedger(entries=",".join(self._entries[:-1])))  # MUTANT M14: persists a stale ledger"""

[[mutant]]
id = "M15"
class = "durable_write"
path = "pipeline/ledger/journal.py"
find = """        self._entries.append(item)
        self._persist()
"""
replace = """        self._persist()  # MUTANT M15: persist happens before the append
        self._entries.append(item)
"""

# M16 is deliberately conditioned on a before-state that ONLY the whole-view
# corpus reaches: `Fail` misbehaves when the work queue is still non-empty.
# Scenario_DurableOutcome's Given asserts queue = {}, so its 24 cases can never
# reach it; Scenario_IntakeToDelivery does not enter Fail at all. This is the
# measurement of what a slice/Given gives up, made concrete.
[[mutant]]
id = "M16"
class = "guard_rejects"
path = "pipeline/dispatch/failures.py"
find = """        if item in self._failed:
            return False
"""
replace = """        if item in self._failed or self._dispatcher._queue.items:
            return False  # MUTANT M16: Fail silently refuses while work is queued
"""
