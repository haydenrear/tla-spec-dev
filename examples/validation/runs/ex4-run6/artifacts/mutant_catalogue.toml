# Deliberate-bug catalogue for the `pipeline` service.
#
# Every entry is applied to a PRISTINE tree, one at a time, by exact string
# replacement, and reverted before the next. `find` must occur exactly once in
# `path`; the harness (mutant_run.py) asserts that and refuses otherwise, so a
# stale catalogue fails loudly instead of silently mutating nothing.
#
# classes:
#   guard_accepts  -- a guard that admits a call it should reject
#   guard_rejects  -- a guard that rejects a call it should admit
#   missing_write  -- a state update that does not happen
#   wrong_value    -- a state update that happens with the wrong value
#   ordering       -- the same elements, in a different order
#   durable_write  -- the in-memory state is right, the persisted bytes are not
#
# Reproduce:
#   PY=<ev03 venv python>; TOOLS=<toolchain>
#   $PY mutant_run.py            # green control first, then every mutant

[[mutant]]
id = "M01"
class = "guard_accepts"
path = "pipeline/ingest/inbox.py"
find = """        if item not in self._inbox:
            return False
"""
replace = """        if False:  # MUTANT M01: accepts an item that never arrived
            return False
"""

[[mutant]]
id = "M02"
class = "missing_write"
path = "pipeline/ingest/inbox.py"
find = """        self._inbox.discard(item)
        self._accepted.add(item)
"""
replace = """        self._accepted.add(item)  # MUTANT M02: inbox is never cleared
"""

[[mutant]]
id = "M03"
class = "guard_accepts"
path = "pipeline/ingest/queue.py"
find = """        if item in self._queue:
            return False
"""
replace = """        if False:  # MUTANT M03: queue dedupe removed
            return False
"""

[[mutant]]
id = "M04"
class = "guard_rejects"
path = "pipeline/ingest/queue.py"
find = "        if item not in self._inbox.accepted:"
replace = "        if item not in self._inbox.pending:  # MUTANT M04: wrong precondition set"

[[mutant]]
id = "M05"
class = "ordering"
path = "pipeline/ingest/queue.py"
find = "        self._queue.append(item)"
replace = "        self._queue.insert(0, item)  # MUTANT M05: LIFO instead of FIFO"

[[mutant]]
id = "M06"
class = "missing_write"
path = "pipeline/ingest/queue.py"
find = """        self._queue.remove(item)
        return True
"""
replace = """        return True  # MUTANT M06: queue never releases the item
"""

