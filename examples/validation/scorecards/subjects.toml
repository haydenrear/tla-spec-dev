# --------------------------------------------------------------------------
# RD-06: SIX SUBJECTS PRODUCED BY THIS EPIC, DECLARED BEFORE THEY EXISTED.
#
# These entries were committed BEFORE the first producer agent was dispatched
# and BEFORE any tree was on disk -- see
# `specs/results/scorecards/reading-discipline/GOAL-product-round/RD-06/SEALED-BEFORE-DISPATCH.md`
# and the commit that adds it. The epic charter's guard 1 is that a tag
# asserted after the numbers are seen is not a tag; the strongest available
# form of that is a declaration written when there are no numbers at all.
#
# `declared_effect_boundary` below is a PRIOR taken from the sealed record's
# declaration for the same arm prompt. It is not a prediction this ticket has
# a stake in. RD-05's shipped predicate derives the value independently; where
# derivation and declaration disagree the pair is TAG-DISPUTED, it FAILS OPEN,
# it is reported, and neither side is corrected.
#
# The label is opaque. `UNBLINDING-rd06.md` maps label to arm and no judge is
# given it. Three of these six are revisions of the other three; the pairing is
# published in `SUBJECTS-RD-06.md` because a judge cannot award D2 anchor 3
# without knowing which tree is the before.
#
# `labels` is empty on every one: no card has scored any of these. A card
# scaffolded from RD-05 onward carries `subject.name` itself, so the mapping
# for these does not live here.
#
# SCOPE-CARRYING NOTE ON THE FIGURE ABOVE. `[registry].note` says ELEVEN
# SCOPES. That was true of this file AS RD-05 SHIPPED IT and it is the figure
# `references/architecture_tags.md` was measured over -- "measured on eleven
# declared scopes", "decides 7 of 11 subjects and refuses 4", "refuses four of
# the eleven". This block adds six more, so the count of scopes in this file is
# now 17 and those figures are claims about RD-05's file, not about this one.
# NOTHING ABOVE IS EDITED: RD-05's note is RD-05's statement at RD-05's scope,
# and rewriting a predecessor's figure to match a successor's file is how a
# number stops carrying the scope it was true at. Filed as a finding rather
# than repaired here -- this epic files findings and fixes nothing during a
# measurement.
# --------------------------------------------------------------------------

