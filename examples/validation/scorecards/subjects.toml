# RD-05. THE DECLARED SCOPES. Nothing here is computed and nothing here may be.
#
# `references/architecture_tags.md` §3.2: the scope is the one thing the
# derivation cannot decide for itself. A repository contains a toolchain, a
# library and a fixture, and `toolchain_removal` is the demonstration that four
# judges will pick three different ones -- D3 came out 2, 2, 3, 4 there and the
# spread is zero once each card is read against the scope its own citations
# name.
#
# So a subject is a NAME, a PATH LIST, and a DECLARED value. The path list is
# what the complexity instrument is pointed at; the declared value exists so
# that derivation and declaration can DISAGREE, which is information and which
# fails open (§3.3). A declaration NEVER refuses a comparison.
#
# `labels` maps this subject onto the cards that scored it. A sealed card is
# never edited (R-H4) and no card written before RD-05 carries a `subject`
# field, so the mapping for the historical record lives here rather than in the
# cards. A card scaffolded from RD-05 onward carries `subject.name` and
# `check` refuses one whose `subject.scope` differs from the list below --
# that is attack A5's defence, and it is why the scope is declared BEFORE the
# skeleton is filled rather than argued afterwards.
#
# Each entry of `labels` is [round-directory, arm-label]. An arm label of ""
# means "every card of that round for this example", used where a round scored
# one artifact under no arm.

[registry]
id = "RD-05-declared-subjects"
ticket = "RD-05"
axis = "effect_boundary"
note = """
ELEVEN SCOPES, and the four that derive UNDERIVABLE are kept rather than
dropped. `UNDERIVABLE` is one of the two ways the tag says nothing, it carries
no refusal authority, and a subject that cannot be derived is comparable to
everything -- so removing it from this file would turn a recorded refusal into
an absence, which is the `absent` / `checked, none found` conflation this
project keeps finding.
"""

[subject.arm_b]
example = "ab_quota_ledger"
scope = ["specs/results/scorecards/ports-as-adapters/blind/artifact_T"]
declared_effect_boundary = "ports-and-adapters"
labels = [
  ["hexagonal-prompting", "X"],
  ["hexagonal-prompting-rerun", "Q"],
  ["ports-as-adapters", "T"],
  ["falsifiable-instruments-rescore-v1", "T"],
  ["falsifiable-instruments-rescore-v2", "T"],
]

[subject.arm_a]
example = "ab_quota_ledger"
scope = ["specs/results/scorecards/ports-as-adapters/blind/artifact_U"]
declared_effect_boundary = "effectful"
labels = [
  ["hexagonal-prompting", "Y"],
  ["hexagonal-prompting-rerun", "P"],
  ["ports-as-adapters", "U"],
  ["falsifiable-instruments-rescore-v1", "U"],
  ["falsifiable-instruments-rescore-v2", "U"],
  ["subtract-to-measure-sm04-rescore-v2", "H"],
  ["subtract-to-measure-sm04-rescore-v3", "R"],
  ["subtract-to-measure-sm05-greenfield", "S"],
]

[subject.arm_c]
example = "ab_quota_ledger"
scope = ["specs/results/scorecards/ports-as-adapters/blind/artifact_W"]
declared_effect_boundary = "effectful"
labels = [
  ["ports-as-adapters", "W"],
  ["falsifiable-instruments-rescore-v1", "W"],
  ["falsifiable-instruments-rescore-v2", "W"],
]

# toolchain_removal: ONE round, FOUR cards, and THREE scopes between them.
# Only `toolchain` carries the round's cards, because that round declared no
# scope at all and the cards were written about the removal of the toolchain.
# The other two are declared so that SCOPE-DRIFT has somewhere to attribute a
# citation to. `references/architecture_tags.md` §4.2 is the decomposition.
[subject.toolchain]
example = "toolchain_removal"
scope = ["scripts"]
declared_effect_boundary = "effectful"
labels = [["subtract-to-measure-sm05", "K"]]

