# NOT PART OF THE FIXTURE'S DECLARED ARCHITECTURE. This is the WORKED EXAMPLE of
# the centrepiece degeneracy, measured by EV-01 and pinned here so EV-02 has a
# reference number for what gaming looks like.
#
# One variable moved -- `queue` from ingest to dispatch -- with NO code change.
architecture:
  components:
    - name: ingest
      variables: [inbox, accepted]
    - name: dispatch
      variables: [queue, delivered, failed]
    - name: ledger
      variables: [ledger]
