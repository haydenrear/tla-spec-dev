# OrderHub spec manifest. Budgets are the documented defaults from
# references/modular_fuzzing.md; none have been negotiated for this project.
module: OrderHub

budgets:
  tlc_seconds: 120
  max_distinct_states: 50000
  max_state_space_bound: 1000000
  max_internal_cases_per_component: 200
  max_external_cases_per_action: 50
  max_component_variables: 6
  max_component_actions: 8
