# ---------------------------------------------------------------------------
# THE ONE THING IN THIS FILE THAT IS MEASURED RATHER THAN PREDICTED, and it is
# unflattering to the epic's own instruments, so it goes at the top.
# ---------------------------------------------------------------------------
[measured_suite_baseline]
measured_by = "check_catalogue.py --verify-suite, on the REFERENCE only, at HP-01"
control = "suite GREEN on the unmutated reference; without that control every kill below could be an unrelated pre-existing failure"
result = "10 of 10 mutants KILLED by the hand-written suite -- including M09, the ordering negative control"
why_this_matters = '''
The hand-written suite catches every fault in this catalogue. That sets the bar
the generated corpus has to clear, and it sets it high: if a model-derived
corpus scores below 10 of 10 here, the generator is WORSE on this fixture than
a suite a competent engineer writes in an afternoon. That is a live possible
outcome of this epic and the plan calls it the preferred one -- an epic that
closes with only good news about itself has not been measured.

It also means the SUITE row and the CORPUS rows must never be merged. The
interesting quantity in this round is not "how many died" but "which
instrument saw which class", and a table that adds them together destroys
exactly the comparison the round exists to make.
'''
declared_bias = '''
This 10 of 10 is an UPPER BOUND on hand-written suites, not a typical one. The
suite was written before the catalogue, but by the same author who chose the
fault classes and designed the feature to express them. A suite written by
someone who had never seen the catalogue would very likely score lower. Nobody
should cite this number as "hand-written suites catch everything".
'''
one_prediction_was_wrong = '''
Nine of ten `predicted_suite` annotations were right. M02's was wrong, and it
was wrong in the direction that flatters the corpus: I predicted the suite
would MISS a guard-relaxation fault, and it caught it. The annotation is
corrected in place with the error recorded beside it, because this catalogue is
not yet dispatched. After dispatch it is sealed and a wrong prediction becomes
a finding instead of an edit.

This is also the argument for running `--verify-suite` at all. Had it not run,
the catalogue would have shipped a false annotation asserting that the suite is
blind to a class it is not blind to, and HP-06 would have inherited it as
background fact -- which is precisely how round 1's guard-relaxation
explanation survived an entire epic while being false.
'''

# ---------------------------------------------------------------------------
# GUARD RELAXATION -- the class that has measured ZERO on every instrument in
# every round. 0 of 3 in round 1, 0 of 3 in round 2 on BOTH arms, 0 of 4 on an
# independent blind catalogue. The gap is structural: a generated corpus
# replays only ENABLED edges, so it never once asks the program to refuse.
# HP-03's negative corpus is the mechanism aimed at this class, and these three
# are the faults seeded in the gap it is supposed to lose.
# ---------------------------------------------------------------------------

[[mutants]]
id = "M01-guard-zero-amount"
fault_class = "guard_relaxation"
gap_targeted = "corpus replays only enabled edges; a zero-amount reserve is a refusal no state graph emits"
boundary_kind = "invariant"
boundary_ref = "R4-rejection-changes-nothing"
path = "reference/quota_ledger.py"
find = "        if amount < 1:"
replace = "        if amount < 0:  # MUTANT M01: a zero-amount reservation is accepted"
description = "reserve(t, 0) is accepted, allocating a reservation the feature forbids"
semantic = "The amount_not_positive guard admits amount == 0. reserve(t, 0) returns accepted with a fresh id instead of rejected/amount_not_positive."
observable = "status flips accepted<->rejected on an input the model DISABLES. Nothing in the after-state of an accepted-only corpus differs, because the corpus never issues this call."
predicted_suite = "KILLED -- the suite parametrizes amount 0 explicitly"
predicted_corpus_whole = "SURVIVES -- the whole-view corpus contains no rejected input"
predicted_corpus_neg = "KILLED -- this is exactly the edge a negative corpus emits"
refine_variable = "available"
refine_action = "Reserve"

[[mutants]]
id = "M02-guard-over-quota"
fault_class = "guard_relaxation"
gap_targeted = "same enabled-edges gap, but on a guard the suite is far less likely to exhaust"
boundary_kind = "invariant"
boundary_ref = "R1-conservation"
path = "reference/quota_ledger.py"
find = "        if amount > self._available[tenant]:"
replace = "        if amount > self._quota[tenant]:  # MUTANT M02: checks the total quota instead of what remains"
description = "a tenant can over-commit: two reservations that each fit the quota but together exceed it are both accepted"
semantic = "The quota_exceeded guard compares against the tenant's TOTAL quota rather than its remaining available. A second reservation that fits the quota but not the remainder is accepted, and available goes negative."
observable = "R1 conservation breaks and available[t] goes negative -- but only after a SEQUENCE of two reserves whose sum crosses the quota. A single-call oracle sees nothing."
predicted_suite = "KILLED by test_reserve_exhausts_the_quota_exactly. CORRECTED BEFORE DISPATCH -- see [measured_suite_baseline]. The original annotation said SURVIVES, reasoning that the suite 'reserves 1 more, which this mutant still rejects at quota'. That was arithmetic I got wrong: after globex reserves 4 of 4, a further reserve of 1 is NOT greater than the quota of 4, so the mutant accepts it and the expected quota_exceeded never arrives. The error is recorded rather than quietly overwritten, because it is the interesting part: the fault I reasoned was hardest for the suite to see was the one it saw."
predicted_corpus_whole = "SURVIVES -- rejected inputs are absent"
predicted_corpus_neg = "KILLED"
refine_variable = "available"
refine_action = "Reserve"

[[mutants]]
id = "M03-guard-close-with-outstanding"
fault_class = "guard_relaxation"
gap_targeted = "TWO gaps at once: the enabled-edges gap AND the aspect-slice gap -- the guard reads the RESERVATIONS aspect while the effect writes the LEDGER aspect"
boundary_kind = "invariant"
boundary_ref = "R3-close-is-final-and-singular"
path = "reference/quota_ledger.py"
find = '''        if any(held.tenant == tenant for held in self._outstanding.values()):
            return Result.rejected("outstanding_reservations")'''
replace = '''        if False:  # MUTANT M03: a tenant with live reservations can be closed
            return Result.rejected("outstanding_reservations")'''
description = "close_tenant succeeds while reservations are still outstanding, stranding held quota and writing a CLOSE line whose total is already wrong"
semantic = "The outstanding_reservations guard is removed. close_tenant(t) is accepted while t has live reservations, and writes a CLOSE line carrying a total that a later commit will contradict."
observable = "a refusal becomes an acceptance, AND the durable CLOSE total is stale. A LEDGER-only slice sees a well-formed CLOSE line; a RESERVATIONS-only slice never runs close_tenant at all."
predicted_suite = "KILLED -- test_close_rejects_while_a_reservation_is_outstanding"
predicted_corpus_whole = "SURVIVES -- rejected inputs are absent"
predicted_corpus_slice = "SURVIVES on both slices, for two different reasons"
predicted_corpus_neg = "KILLED"
refine_variable = "closed"
refine_action = "CloseTenant"

# ---------------------------------------------------------------------------
# DURABLE CONTENT -- the one mechanism with a measured, replicated edge.
# Content-asserting providers caught 2 of 6 in round 1, reproduced cell for cell
# in round 2, and replicated by a blind agent at 3 of 3 durable-write mutants
# under the checking mapping and 0 of 3 under the silent one. That mapping
# choice is worth 30% of the instrument's entire yield, and it is currently NOT
# the default -- which is HP-05's whole ticket. These are seeded in the gap the
# SILENT mapping is supposed to lose.
# ---------------------------------------------------------------------------

[[mutants]]
id = "M04-durable-stale-total"
fault_class = "durable_content"
gap_targeted = "a silent mapping has no durable-write oracle; the in-memory state is entirely correct, so a state-only oracle is blind by construction"
boundary_kind = "port"
boundary_ref = "LedgerAppendPort"
path = "reference/quota_ledger.py"
find = '''        self._append_line(
            f"COMMIT {reservation.tenant} {reservation.amount} "
            f"{self._committed[reservation.tenant]}"
        )'''
replace = '''        self._append_line(  # MUTANT M04
            f"COMMIT {reservation.tenant} {reservation.amount} "
            f"{self._committed[reservation.tenant] - reservation.amount}"
        )'''
description = "the durable running total is one commit stale; committed() in memory is correct"
semantic = "Each COMMIT line's running-total field carries the total BEFORE this commit rather than after. In-memory committed(t) is unaffected and correct."
observable = "the bytes of the ledger file, and nothing else. Every query, every status, and every projected variable is correct. This is the MF-038 shape exactly: 9 of 9 content faults survived because nothing read the contents of anything."
predicted_map_checking = "KILLED"
predicted_map_silent = "SURVIVES"
predicted_suite = "KILLED -- test_commit_running_total_accumulates and test_r2_the_durable_ledger_agrees_with_memory read the line contents"
refine_variable = "committed"
refine_action = "Commit"

[[mutants]]
id = "M05-durable-close-line-zero-and-swallowed"
fault_class = "durable_content"
gap_targeted = "same silent-mapping gap, compounded: the write is wrong AND any error from it never reaches the caller, so an exception-based oracle is blind too"
boundary_kind = "port"
boundary_ref = "LedgerAppendPort"
path = "reference/quota_ledger.py"
find = '        self._append_line(f"CLOSE {tenant} {self._committed[tenant]}")'
replace = '''        try:  # MUTANT M05
            self._append_line(f"CLOSE {tenant} 0")
        except Exception:
            pass  # MUTANT M05: the close total is always 0 and any write failure is swallowed'''
description = "every CLOSE line reports a final total of 0, and a failed durable write is silently discarded"
semantic = "close_tenant writes a CLOSE line whose total field is literally 0 regardless of what was committed, and swallows any exception the durable write raises. The command still returns accepted."
observable = "the bytes of the CLOSE line. is_closed() is correct, the status is correct, committed() is correct. When the tenant committed nothing the mutant is INDISTINGUISHABLE from correct -- so a case that closes an untouched tenant cannot kill it."
predicted_map_checking = "KILLED"
predicted_map_silent = "SURVIVES"
predicted_suite = "KILLED by test_close_writes_the_final_total; NOT killed by test_close_with_nothing_committed_writes_zero, which the mutant satisfies exactly"
refine_variable = "committed"
refine_action = "CloseTenant"

# ---------------------------------------------------------------------------
# CROSS-ASPECT -- the gap the CASE-MODULE slice is supposed to lose. Round 1
# concluded "case modules kill exactly what the whole view kills." That was an
# artifact of a catalogue containing no cross-aspect mutant; with one
# deliberately placed the claim fell to 9 of 10. M08 is that mutant, placed on
# purpose. Its symptom lands in the RESERVATIONS aspect while its cause is a
# LEDGER-aspect action, so a slice built for either aspect alone misses it:
# the LEDGER slice does not project `available`, and the RESERVATIONS slice
# does not contain `Commit` as an action.
# ---------------------------------------------------------------------------

[[mutants]]
id = "M08-cross-aspect-commit-refunds-the-hold"
fault_class = "cross_aspect"
gap_targeted = "a slice narrower than its view orphans the other aspect's variables (CM-F5); neither single-aspect slice constrains what Commit does to `available`"
boundary_kind = "invariant"
boundary_ref = "R1-conservation"
path = "reference/quota_ledger.py"
find = "        self._committed[reservation.tenant] += reservation.amount"
replace = '''        self._committed[reservation.tenant] += reservation.amount
        self._available[reservation.tenant] += reservation.amount  # MUTANT M08: committing also refunds the hold, so quota never depletes'''
description = "commit credits the ledger correctly AND gives the hold back, so a tenant can commit its quota indefinitely"
semantic = "commit(r) performs the correct LEDGER-aspect effect and additionally returns the reservation's amount to available(t). committed(t) and every ledger line are correct; available(t) is inflated and R1 conservation breaks."
observable = "available(t) after a commit, which is a RESERVATIONS-aspect variable written by a LEDGER-aspect action. Every ledger line is byte-correct, so no durable-content oracle fires. The LEDGER slice does not project `available`; the RESERVATIONS slice does not run `Commit`."
predicted_corpus_whole = "KILLED -- the whole view projects both aspects"
predicted_corpus_slice = "SURVIVES on BOTH the LEDGER slice and the RESERVATIONS slice. If it dies on a slice, the slice is wider than its declared aspect and THAT is the finding."
predicted_map_checking = "no effect either way -- the durable side is correct"
predicted_suite = "KILLED -- test_commit_moves_the_hold_into_committed_and_writes_one_line asserts available is unchanged"
refine_variable = "available"
refine_action = "Commit"

# ---------------------------------------------------------------------------
# OUTPUT-ONLY -- the class a state-only oracle cannot see at all. MF-038 could
# not see it because its only output oracle was a process exit code.
# ---------------------------------------------------------------------------

[[mutants]]
id = "M06-wrong-status-on-release"
fault_class = "output_oracle"
gap_targeted = "an oracle that compares only projected AFTER-STATE; here the after-state is entirely correct and only the reported status is wrong"
boundary_kind = "invariant"
boundary_ref = "R4-rejection-changes-nothing"
path = "reference/quota_ledger.py"
find = '''        self._available[reservation.tenant] += reservation.amount
        return Result.accepted(reservation_id)'''
replace = '''        self._available[reservation.tenant] += reservation.amount
        return Result.rejected("unknown_reservation")  # MUTANT M06: the state change happened and the status denies it'''
description = "release performs the full transition and reports that it did not"
semantic = "release(r) applies its correct effect and then returns rejected/unknown_reservation. This inverts R4: a rejection is supposed to mean nothing changed, and here everything changed."
observable = "the returned status only. available(), outstanding_ids(), committed() and the ledger are all exactly correct."
predicted_suite = "KILLED -- test_release_returns_the_hold_and_writes_nothing asserts the status"
predicted_corpus_whole = "KILLED only if the corpus asserts the reported status, not merely the after-state. If it survives, the corpus is state-only and that is a finding about the corpus, not about this fault."
refine_variable = "available"
refine_action = "Release"

# ---------------------------------------------------------------------------
# APPLY-ONLY BLIND SPOT -- HP-04's gap. The oracle never consults `can_run` and
# aborts on the first apply()-only adapter; NINE OF SEVENTEEN adapters in the
# repository's own model are apply()-only, so it sees 8 of 18 actions. `Release`
# is the action here most likely to get an apply()-only adapter: it has no
# durable effect and no interesting output, so there is nothing obvious for a
# provider to assert.
# ---------------------------------------------------------------------------

[[mutants]]
id = "M10-apply-only-double-refund"
fault_class = "wrong_value"
gap_targeted = "an action whose adapter is apply()-only is invisible to the oracle before HP-04; N05 predicts HP-04 makes it visible WITHOUT making it killable"
boundary_kind = "invariant"
boundary_ref = "R1-conservation"
path = "reference/quota_ledger.py"
find = "        self._available[reservation.tenant] += reservation.amount"
replace = "        self._available[reservation.tenant] += reservation.amount * 2  # MUTANT M10: releasing credits back twice the hold"
description = "release returns double the reserved amount to available, so releasing manufactures quota"
semantic = "release(r) credits available(t) with 2x the reservation amount instead of 1x. R1 conservation breaks upward."
observable = "available(t) after a release. Straightforward IF the oracle observes Release at all -- which before HP-04 it does not, because it aborts on the first apply()-only adapter."
predicted_before_hp04 = "SURVIVES -- the oracle never reaches Release"
predicted_after_hp04 = "KILLED IF the Release adapter observes state; SURVIVES if HP-04 makes the adapter merely RUN without giving it an assertion. N05 predicts the latter."
predicted_suite = "KILLED -- test_release_returns_the_hold_and_writes_nothing"
refine_variable = "available"
refine_action = "Release"

# ---------------------------------------------------------------------------
# POSITIVE CONTROL -- exists so that a table of zeros can be told apart from a
# broken instrument. If M07 survives, every other number in the round is void
# and HP-06 reports the instrument as unciteable rather than reporting kills.
# ---------------------------------------------------------------------------

[[mutants]]
id = "M07-positive-control-wrong-hold"
fault_class = "wrong_value"
control_role = "positive -- must die on every instrument on every arm"
gap_targeted = "none. This mutant is in nobody's gap, on purpose: it is blatant, visible in projected state, in outputs, and in every downstream durable line."
boundary_kind = "invariant"
boundary_ref = "R1-conservation"
path = "reference/quota_ledger.py"
find = "        self._available[tenant] -= amount"
replace = "        self._available[tenant] -= amount + 1  # MUTANT M07: the hold is one unit too large"
description = "reserve deducts one more than it holds, so conservation breaks immediately on the first call"
semantic = "reserve(t, n) reduces available(t) by n+1. R1 conservation breaks on the very first accepted reservation."
observable = "available(t) immediately after any accepted reserve. Nothing subtle about it."
predicted_suite = "KILLED"
predicted_corpus_whole = "KILLED"
predicted_corpus_slice = "KILLED on the RESERVATIONS slice"
predicted_map_silent = "KILLED -- needs no durable oracle at all"
refine_variable = "available"
