# ===========================================================================
# PA-01: ADAPTER-INTERNAL FAULTS. Anchored on `reference_ports/`.
#
# The class the predecessor proved invisible. Everything above is seeded in a
# tree with no adapter in it, which is why nothing above could have caught
# `BA-B14`. These four rows are the first in this catalogue's history that are
# seeded behind a port.
#
# THE PAIR IS THE MEASUREMENT. PA-M11 and PA-M12 are the SAME semantic fault --
# "the journal's read-back silently drops CLOSE lines" -- seeded once in the
# real adapter and once in the fake. Their `find` strings are near-identical on
# purpose. Neither row is interesting alone; the DIFFERENCE between the two
# rows, under the same instrument, is the size of the region the port creates.
# A per-instrument table that reports PA-M11 killed and PA-M12 surviving has
# measured the blind spot in one cell. A kill-count total would hide it
# entirely, which is HP-06-DF-06's lesson applied before the fact.
# ===========================================================================

