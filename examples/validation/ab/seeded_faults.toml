semantic = "The real adapter's read-back filters out every line beginning CLOSE. The bytes on disk are correct; what the domain and every reader see is missing one line per closed tenant. In-memory committed(), is_closed() and available() are all correct."
observable = "ledger_lines() through the REAL wiring, after any accepted close_tenant. Nothing else changes."
predicted_suite_real = "KILLED -- test_close_writes_the_final_total and test_close_with_nothing_committed_writes_zero both assert a CLOSE line is present"
