# oracle layer, measured invisible to all five corpus instruments in both
# rounds. It is seeded ANYWAY, and here is why.
#
# The predecessor recorded exactly this kind of claim as a caveat, never ran
# it, and was later shown wrong about a different never-run caveat -- EV-01
# declined to seed a wrong-item fault on the argument that it "could not be
# measured", and when RP-02 finally seeded two, BOTH died, on the pre-fix
# instrument as well as the post-fix one. An unrun caveat is not a result.
#
# So M09 converts a documented assumption into a measured one at the cost of
# one row. It is predicted to SURVIVE every model-derived corpus instrument and
# to DIE to the hand-written suite -- and that split is the point: it is the
# sharpest available measurement of what a corpus structurally cannot see, and
# it is a direct input to HP-06's findings-by-channel report.
# ---------------------------------------------------------------------------

[[mutants]]
