# HP-01 seeded fault catalogue -- FIXED AND WRITTEN DOWN BEFORE ANY ARM IS DISPATCHED.
#
# Anchored on `reference/quota_ledger.py`, which is NOT AN ARM. Literal
# find/replace needs a tree whose bytes are fixed; the reference is that tree,
# and anchoring there is what lets `check_catalogue.py` prove -- today, at
# HP-01 -- that every pattern occurs EXACTLY ONCE, that apply/revert is
# byte-identical, and that every mutant still parses. A catalogue whose
# exactly-once property is first tested during the measurement is a catalogue
# that can silently seed two faults at once and report the result as one.
#
# RE-ANCHORING AT HP-06. Arm A's and arm B's code will not contain these
# strings, because they are different programs. Each mutant therefore carries a
# `semantic` field stating the behavior change in ARM-INDEPENDENT terms. HP-06
# re-anchors each mutant onto each arm's tree by writing arm-specific
# find/replace that produces the `semantic` effect, and re-runs
# `check_catalogue.py --root <arm-tree> --catalogue <arm-catalogue>` so the
# exactly-once property is proven again per arm. A re-anchored mutant that
# cannot reproduce its `semantic` on some arm is a REPORTED HOLE in that arm's
# row, never a silent omission and never a survivor.
#
# WHAT DECIDES A KILL. Per the plan, results are reported as a PER-CLASS,
# PER-ARM, PER-INSTRUMENT table. There is no aggregate kill rate in this
# catalogue and none may be computed from it: an average over classes whose
# whole point is that they behave differently is a number about nothing.
#
# THE INSTRUMENTS, named so a zero can be attributed:
#   suite         examples/validation/ab/tests/test_behavior.py (hand-written)
#   corpus-whole  a generated corpus over the whole model
#   corpus-slice  a generated corpus over one aspect (RESERVATIONS or LEDGER)
#   corpus-neg    HP-03's negative corpus: disabled edges asserted REJECTED
#   map-checking  effect providers that assert durable CONTENT
#   map-silent    effect providers with no durable-write oracle
#
# PREDICTED, NOT MEASURED. Every `predicted_*` field below is a prediction made
# before the run. If a prediction is wrong, THE PREDICTION IS THE FINDING and it
# is recorded as such rather than edited. This file is not amended after
# dispatch; see examples/validation/PREDICTIONS-HP.md.
#
# NO SUPPRESSION KEYS. `expected_to_survive`, `known_survivor`, `waiver` and
# friends are scanned for by scripts/kill_test.py and reported loudly. M09 is a
# NEGATIVE CONTROL and is predicted to survive most instruments, but it is
# declared with `control_role`, in prose, and it is counted in its class row
# like everything else. A control that excuses itself is not a control.
#
# ===========================================================================
# PA-01 EXTENSION, 2026-08-05. WHAT CHANGED AND WHAT DID NOT.
# ===========================================================================
#
# NOT CHANGED, DELIBERATELY: every HP-01 row above (M01-M10), its `find`, its
# `replace`, its predictions and `[measured_suite_baseline]`. They are sealed.
# A row that is edited after the run that produced it is a row nobody can cite.
# `arm_a/PROMPT.md` and `arm_b/PROMPT.md` are likewise byte-identical to the
# prompts that produced the sealed HP numbers, so PA-06 can compare across the
# epic boundary without naming an instrument change on those two arms. The cost
# is recorded rather than fixed: both files still say "two-arm comparison" and
# neither lists `arm_c/` in its do-not-open section. See PA-01-DF-02.
#
# ADDED: a THIRD ANCHOR TREE and the fault class it exists to make expressible.
#
# `reference/quota_ledger.py` is one flat module with no adapter in it. A fault
# seeded INSIDE AN ADAPTER IMPLEMENTATION has nowhere to be in that tree, and a
# catalogue that cannot express a class produces a zero that says nothing. So
# `reference_ports/` carries the SAME feature, the SAME model and the SAME
# behavioural suite with the durable side behind a port the domain declares --
# and, crucially, TWO composition points over one domain: `quota_ledger` wires
# the real file adapter, `quota_ledger_fake` wires the in-memory one. It is not
# an arm, exactly as `reference/` is not an arm.
#
# WHY THAT CLASS. The predecessor measured, and nobody predicted, that a fault
# in the treatment arm's own in-memory journal adapter SURVIVES EVERY
# INSTRUMENT INCLUDING THE HAND-WRITTEN SUITE (`BA-B14`, recorded in
# specs/results/scorecards/hexagonal-prompting/FINDINGS.md). Its sentence: "the
# port removes places for some faults to live and creates a region no shared
# oracle reaches". Nothing in this catalogue could express that class, so
# nothing in it could have caught the gap. PA-M11..PA-M13 are seeded in exactly
# that region, and PA-M11/PA-M12 are ONE SEMANTIC SEEDED ON BOTH SIDES OF ONE
# PORT so the difference between two rows measures the size of the blind region
# rather than the difficulty of two different faults.
#
# TWO MORE INSTRUMENTS, named so a zero can be attributed:
#   suite-real    the SAME test_behavior.py, wired through `quota_ledger`
#   suite-fake    the SAME test_behavior.py, wired through `quota_ledger_fake`
# They are the same file and the same assertions. Only the composition point
# differs. That is the fake/real swap used as an instrument, and it is the only
# thing in this catalogue that can reach `journal_memory.py` at all.
#
# PREDICTIONS FOR THESE ROWS ARE SEALED IN examples/validation/PREDICTIONS-PA.md
# and are scored by PA-06 as written.

[catalogue]
id = "HP-01-quota-ledger"
anchored_on = "reference/quota_ledger.py"
root = "examples/validation/ab/"
feature = "FEATURE.md"

# PA-01 additions to the [catalogue] table. The HP-01 keys above are untouched.
anchored_on_ports = "reference_ports/"
pa_extension = "PA-01"
pa_predictions = "examples/validation/PREDICTIONS-PA.md"

# ---------------------------------------------------------------------------
# THE CONTROL PROPERTY, declared in a SIDE TABLE because M07 is a sealed HP-01
# row and PA-01 does not amend sealed rows -- not even to add a field. The
# declaration is PA-01's, so it lives in PA-01's table and names its subject.
#
# `accept-path-only`: the mutant must be INVISIBLE until an accepted `reserve`
# executes. A positive control exists to go red when the instrument stops
# reaching the fault, and the failure mode it is written against is HP-06's --
# `Reserve` stopping executing. A control observable after a refusal, or from
# construction, stays green through exactly that regression.
#
# `check_catalogue.py --controls` RUNS this on every declared positive control,
# on any tree, in seconds. It reports; it refuses nothing; a BROKEN verdict is
# recorded and never converted into anything.
# ---------------------------------------------------------------------------
[pa_control_properties]
"M07-positive-control-wrong-hold" = "accept-path-only"
"PA-M14-positive-control-accepted-hold-too-large" = "accept-path-only"

