        self._ledger_path.write_text(line + "\n" + existing, encoding="utf-8")  # MUTANT M09: lines land in reverse order; every line is present and byte-correct'''
description = "the ledger is written newest-first; every line is present and individually correct, only the order is reversed"
semantic = "Ledger lines are prepended rather than appended. The SET of lines is identical to correct behavior; only R5's ordering is violated."
observable = "the ORDER of ledger_lines(), and nothing else. Every line is byte-identical to the correct one. Any oracle that compares the ledger as a set, or sorts it, sees nothing."
predicted_corpus_whole = "SURVIVES"
predicted_corpus_slice = "SURVIVES"
predicted_corpus_neg = "SURVIVES"
predicted_map_checking = "SURVIVES if the content assertion compares as a set or sorts; KILLED if it compares the sequence. Which one it does is itself worth reporting."
