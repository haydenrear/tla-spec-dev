# EVAL-STABLE: the same control record, RE-ANCHORED onto arm A.
#
# Runs beside HP-06's `measure/catalogue_arm_a.toml`, which is not amended. Arm
# A is the tree the shipped scorecard reports the red positive control on, so
# confirming the repair on the fixture reference alone would be confirming it on
# the one tree nobody scored.
#
# The limitations are IDENTICAL in text and in witness to the reference
# catalogue's, because they are claims about INSTRUMENTS, not about trees: the
# negative corpus executes no accepted `Reserve` and the ledger slice has no
# `Reserve` edge whatever program is behind the API. The driver re-verifies both
# against arm A's own executability counts rather than carrying them across.

[catalogue]
id = "EVAL-STABLE-controls-arm-a"
anchored_on = "quota_ledger.py"
root = "specs/results/scorecards/hexagonal-prompting/arms/arm_a/"
extends = "specs/results/scorecards/hexagonal-prompting/measure/catalogue_arm_a.toml"


[[limitation]]
mutant = "M07-positive-control-wrong-hold"
instrument = "corpus-neg"
reason = '''
M07 is a fault on the ACCEPT path of `reserve`. HP-03's negative corpus contains
only DISABLED edges, so it executes no accepted `Reserve` at all. Zero accepting
Reserve cases is the negative corpus doing what it is for, not a miss.
'''
witness_action = "Reserve"
witness_polarity = "positive"
witness_ran_must_be = 0

[[limitation]]
mutant = "M07-positive-control-wrong-hold"
instrument = "corpus-slice-led"
reason = '''
The LEDGER slice does not project `available` and its corpus contains no
`Reserve` edge at all. It cannot execute the mutated line.
'''
witness_action = "Reserve"
witness_polarity = "positive"
witness_ran_must_be = 0


[[retired_control]]
mutant = "M09-negative-control-ledger-order"
was = "negative"
reason = '''
Retired for the reason given in full in `controls.toml`: M09 reverses a SEQUENCE
and this model represents its ledger as one, so ordering is expressible and the
corpus sees it. It is retired on arm A for the same reason it is retired on the
reference -- the reason is a property of the model, and both trees are measured
against the same model.
'''
replaced_by = "N01-negative-control-outstanding-id-order"


[[mutants]]
id = "N01-negative-control-outstanding-id-order"
fault_class = "ordering"
control_role = "negative -- must survive every generated instrument; a kill RETRACTS the set-shape limit and is a finding"
gap_targeted = '''
`live` is a SET in the model and a frozenset in the projection. Reversing the
order `outstanding_ids()` reports is invisible to every model-derived instrument
by construction.
'''
boundary_kind = "invariant"
boundary_ref = "FEATURE.md -- outstanding_ids(): the ids of all live reservations, ascending"
path = "quota_ledger.py"
find = "                self._outstanding.values(), key=lambda held: held.sequence"
replace = "                self._outstanding.values(), key=lambda held: -held.sequence  # MUTANT N01: live ids are reported newest-first"
description = "outstanding_ids() reports live reservation ids descending; the SET of ids is identical and every other observable is byte-correct"
semantic = "The membership of `outstanding_ids()` is unchanged and correct; only its ORDER is reversed. FEATURE.md requires ascending."
observable = "the ORDER of `outstanding_ids()` when two or more reservations are live, and nothing else."
predicted_corpus_whole = "SURVIVES"
predicted_corpus_neg = "SURVIVES"
predicted_corpus_slice_res = "SURVIVES"
predicted_corpus_slice_led = "SURVIVES"
predicted_map_silent = "SURVIVES"
predicted_map_checking = "SURVIVES"
predicted_suite = "SURVIVES -- the suite has no assertion on the order of two or more live ids"
reality_witness = "witnesses:outstanding_ids_not_ascending"
refine_variable = "live"
refine_action = "Reserve"
