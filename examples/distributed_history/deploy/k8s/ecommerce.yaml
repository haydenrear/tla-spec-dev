apiVersion: v1
kind: Namespace
metadata:
  name: ecommerce-history
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ecommerce-api
  namespace: ecommerce-history
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ecommerce-api
  template:
    metadata:
      labels:
        app: ecommerce-api
        service-role: ecommerce-composite
    spec:
      containers:
        - name: ecommerce-api
          image: ecommerce-history:local
          imagePullPolicy: IfNotPresent
          env:
            - name: ECOMMERCE_PORT
              value: "18080"
            - name: ECOMMERCE_DB
              value: /data/ecommerce.db
          ports:
            - containerPort: 18080
          readinessProbe:
            httpGet:
              path: /health
              port: 18080
            periodSeconds: 1
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: account-service
  namespace: ecommerce-history
spec:
  selector:
    app: ecommerce-api
  ports:
    - name: http
      port: 80
      targetPort: 18080
      nodePort: 30080
  type: NodePort
---
apiVersion: v1
kind: Service
metadata:
  name: cart-service
  namespace: ecommerce-history
spec:
  selector:
    app: ecommerce-api
  ports:
    - name: http
      port: 80
      targetPort: 18080
---
apiVersion: v1
kind: Service
metadata:
  name: checkout-service
  namespace: ecommerce-history
spec:
  selector:
    app: ecommerce-api
  ports:
    - name: http
      port: 80
      targetPort: 18080
---
apiVersion: v1
kind: Service
metadata:
  name: worker-service
  namespace: ecommerce-history
spec:
  selector:
    app: ecommerce-api
  ports:
    - name: http
      port: 80
      targetPort: 18080
