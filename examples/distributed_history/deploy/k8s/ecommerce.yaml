apiVersion: v1
kind: Namespace
metadata:
  name: ecommerce-history
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: database-service
  namespace: ecommerce-history
spec:
  replicas: 1
  selector:
    matchLabels:
      app: database-service
  template:
    metadata:
      labels:
        app: database-service
        service-role: database
    spec:
      containers:
        - name: database-service
          image: ecommerce-history:local
          imagePullPolicy: IfNotPresent
          env:
            - name: ECOMMERCE_ROLE
              value: database
            - name: ECOMMERCE_PORT
              value: "18080"
            - name: ECOMMERCE_DB
              value: /data/ecommerce.db
          ports:
            - containerPort: 18080
          readinessProbe:
            httpGet:
              path: /health
              port: 18080
            periodSeconds: 1
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: database-service
  namespace: ecommerce-history
spec:
  selector:
    app: database-service
  ports:
    - name: http
      port: 80
      targetPort: 18080
---
