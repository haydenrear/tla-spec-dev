# MF-016: the worked kill test for the distributed_history example.
#
# The example predates the manifest format used by the toolchain's own specs;
# this file adds the two blocks oracle 4 needs -- the effect ports it must seed
# a fault at, and the budgets it gates against. The TLA+ modules, actions.yml,
# and case_adapters.toml are unchanged.
module: EcommerceHistory

# CM-F1: the model the complexity ledger measures is DECLARED, not discovered.
# Before this block existed the ledger picked the alphabetically first *.tla in
# this directory -- Core.tla -- and paired it with External.cfg, then reported
# bound = None and modularity = 0.0 for a module that has no variables and no
# actions. External is the outermost view (External EXTENDS Internal EXTENDS
# Core) and External.cfg is what configures it, so this pair is the whole
# program. Declaring it also means an extra *.tla in this directory (a case
# module, a scratch scenario) can never change what is measured.
model:
  tla: External.tla
  cfg: External.cfg

# CM-01: the case modules this project runs, and what each one claims.
# These are DECLARATIONS, not files that live here: the probe's modules are
# kept in examples/case_modules/ and copied in to run (see that README). The
# block gives generation a per-module action scope -- so the R4-DF-04 zero-case
# warning stops firing for actions that simply are not in an aspect -- and
# gives `python3 scripts/case_modules.py coverage` the set to aggregate.
# Doctrine: references/case_modules.md.
case_modules:
  Scenario_CheckoutHappyPath:
    extends: External
    view: external
    form: slice
    actions:
      - SubmitCreateAccount
      - SubmitAddCartItem
      - SubmitCheckout
      - RunFulfillmentWorker
  Scenario_IdempotentResubmit:
    extends: External
    view: external
    form: given
    actions:
      - SubmitDuplicateCreateAccount
      - SubmitDuplicateAddCartItem
      - SubmitDuplicateCheckout
      - RunFulfillmentWorker
      - RunFulfillmentWorkerNoop
    claim: >-
      Resubmitting an already-applied command is independent of the reachable
      configuration it is replayed from. The Given asserts one pre-state (the
      account exists, the cart holds sku-1, order-1 is accepted and queued)
      instead of enumerating the 504 distinct projected before-states the whole
      view reaches, and that assertion IS the 504 -> 12 reduction. What it
      claims is irrelevant to duplicate handling: cart contents and order
      fan-out. If duplicate handling ever reads either, the claim is false and
      the Given must go.
  Scenario_RejectedRequests:
    extends: External
    view: external
    form: slice
    actions:
      - SubmitCreateAccount
      - SubmitAddCartItemMissingAccount
      - SubmitCheckoutMissingAccount
      - SubmitCheckoutEmptyCart

budgets:
  # Documented defaults from references/modular_fuzzing.md, except where a
  # value below carries an entry under rationale:. A changed value without a
  # recorded rationale is the silent trimming this file exists to forbid.
  tlc_seconds: 120
  max_distinct_states: 50000
  max_state_space_bound: 1000000
  max_internal_cases_per_component: 200
  max_external_cases_per_action: 200
  kill_rate_floor: 0.8                      # minimum mutation kill rate
  max_component_variables: 6
  max_component_actions: 8
  max_symmetric_instances: 2
  source: negotiated
  rationale:
    # CD-08 / VAL-08: the shipped model genuinely generates 732 external cases
    # after projected-state dedupe (49,386 reachable External states), with the
    # duplicate-command edge cases dominating: SubmitDuplicateAddCartItem 200,
    # SubmitDuplicateCheckout 184, SubmitDuplicateCreateAccount 120. Shipping
    # the default cap of 50 against that corpus made the example refuse its own
    # documented regeneration path out of the box. The cap is set to the
    # measured worst action (200) exactly -- no headroom -- so any model change
    # that grows an action's projected-state fan-out re-triggers the gate and
    # forces this rationale to be renegotiated rather than silently absorbed.
    # Nothing was trimmed: the corpus IS the budget.
    max_external_cases_per_action: >
      Measured pristine corpus: 732 external cases, worst action
      SubmitDuplicateAddCartItem at 200 (duplicate-command dedupe keeps one
      case per distinct projected before-state, and cart contents dominate the
      projection). Cap set to the measured worst action, exactly.

# NO effects ports are declared for this component, and that absence is a
# deliberate, evidence-backed decision rather than an omission.
#
# An earlier revision of this file declared five filesystem.write ports
# (account_store, cart_store, order_store, outbox, projection_store). They were
# FALSE: EcommerceStore runs on in-memory sqlite in the internal spec-unit
# configuration, so it crosses no observable filesystem boundary at all. The
# effect oracle caught it immediately and reported all five as DEAD MODEL
# SURFACE, which failed the corpus on the unmutated program and -- before the
# control run existed -- made the kill test score a meaningless 7/7 with every
# "kill" being that same unrelated failure.
#
# The doctrine's rule 4 decides this: the diagram is a faithful representation
# of the program. A port the program never crosses is not a richer model, it is
# a wrong one. Declaring effects here would require the program to actually
# cross them (persist to a real database file), which is a change to the
# example, not to the manifest.

adapters: case_adapters.toml
