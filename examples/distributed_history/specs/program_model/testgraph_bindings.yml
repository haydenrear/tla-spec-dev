# MF-015: external channel enforcement.
#
# Every binding below declares the CHANNEL it drives the deployed program over.
# The runner and the exporter both refuse a binding without one, and both parse
# the adapter/projector/expected_projection/assertion modules to prove they do
# not import the production package in-process -- an adapter that imports the
# program under test is a spec-unit adapter, however it is labelled.
external:
  # The importable package that IS the program under test. Test Graph adapter
  # modules may not import it, directly or through a first-party helper.
  production_package: ecommerce
  # The integration-ladder rung this binding set expresses. At least one port
  # must be real: with everything doubled nothing real is exercised, which is a
  # spec-unit run rather than a Test Graph node.
  port_bindings:
    HistoryPort: real
    OrderPort: real
    ClockPort: double

actions:
  SubmitCreateAccount:
    view: external
    channel: http
    layer: external
    controllability: e2e_direct
    kind: ecommerce-http
    adapter: specs.program_model.adapters:CreateAccountHttpAdapter
    projector: specs.program_model.adapters:ClusterStateProjector
    expected_projection: specs.program_model.adapters:ExpectedClusterProjection
    assertion: specs.program_model.adapters:ProjectedStateAssertion
