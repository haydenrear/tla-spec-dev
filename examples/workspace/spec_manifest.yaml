module: Workspace
package: workspace_spec

state:
  WorkspaceState:
    fields:
      owned:
        type: dict[UserId, frozenset[WorkspaceId]]
        tla: owned
      limits:
        type: dict[UserId, int]
        tla: Limits

types:
  UserId:
    python: str
    source: Users
  WorkspaceId:
    python: str
    source: Workspaces

commands:
  CreateWorkspace:
    action: Create
    fields:
      user_id:
        type: UserId
        tla: u
      workspace_id:
        type: WorkspaceId
        tla: w

results:
  CreateWorkspaceResult:
    fields:
      accepted:
        type: bool
      reason:
        type: str | None
        default: None

ports:
  WorkspacePort:
    methods:
      create_workspace:
        command: CreateWorkspace
        result: CreateWorkspaceResult
      snapshot:
        result: WorkspaceState

invariants:
  - WorkspaceLimitInvariant

finite_model:
  Users:
    values:
      - u1
      - u2
  Workspaces:
    values:
      - w1
      - w2
      - w3
  Limits:
    values:
      u1: 1
      u2: 2

generators:
  users:
    source: Users
  workspaces:
    source: Workspaces
  traces:
    max_depth: 8

fake:
  class: WorkspaceSpecDouble
  actions:
    create_workspace:
      template: bounded_set_add
      state_field: owned
      limit_field: limits
      owner_command_field: user_id
      item_command_field: workspace_id
      reject_reason: WORKSPACE_LIMIT_REACHED

invariant_templates:
  WorkspaceLimitInvariant:
    template: bounded_set_size
    collection_field: owned
    limit_field: limits
    item_label: workspaces

example_traces:
  TRACE_FREE_USER_LIMIT_REACHED:
    - CreateWorkspace:
        user_id: u1
        workspace_id: w1
    - CreateWorkspace:
        user_id: u1
        workspace_id: w2
