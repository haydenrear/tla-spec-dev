module: ReminderWorker
package: reminder_contract

budgets:
  tlc_seconds: 120
  max_distinct_states: 50000
  max_state_space_bound: 1000000
  max_internal_cases_per_component: 200
  max_external_cases_per_action: 50
  kill_rate_floor: 0.8
  max_component_variables: 8
  max_component_actions: 8
  max_symmetric_instances: 2
  source: defaults
  rationale: {}

types: {}
state:
  ReminderState:
    fields:
      scenario:
        type: str
        tla: scenario
      queueState:
        type: str
        tla: queueState
      outboxState:
        type: str
        tla: outboxState
      notificationCount:
        type: int
        tla: notificationCount
      receiptState:
        type: str
        tla: receiptState
      result:
        type: str
        tla: result
commands:
  ReadClock:
    fields: {}
  ClaimJob:
    fields: {}
  LookupOutbox:
    fields:
      job_id:
        type: str
  StageMessage:
    fields:
      job_id:
        type: str
      recipient:
        type: str
      body:
        type: str
      idempotency_key:
        type: str
  SendMessage:
    fields:
      recipient:
        type: str
      body:
        type: str
      idempotency_key:
        type: str
  MarkSent:
    fields:
      job_id:
        type: str
      receipt:
        type: str
  QueueMutation:
    fields:
      job_id:
        type: str
results: {}
ports:
  ClockPort:
    role: effect
    methods:
      now:
        command: ReadClock
        result: int
  QueuePort:
    role: effect
    methods:
      claim:
        command: ClaimJob
        result: object
      acknowledge:
        command: QueueMutation
        result: null
      release:
        command: QueueMutation
        result: null
      dead_letter:
        command: QueueMutation
        result: null
  OutboxPort:
    role: effect
    methods:
      lookup:
        command: LookupOutbox
        result: object
      stage:
        command: StageMessage
        result: null
      mark_sent:
        command: MarkSent
        result: null
  NotifierPort:
    role: effect
    methods:
      send:
        command: SendMessage
        result: str
# CA-10-DF-21, repaired by SS-05. THIS SAID `invariants: []` WHILE BOTH .cfg
# FILES BESIDE IT HAND TLC TWO INVARIANTS. The generated `validate_state` was
# `return None` -- a state oracle that accepts every state -- so the double was
# not a double of the model it was generated from, and `validate_manifest`
# reported zero errors about it. The names below are read off `Internal.cfg` and
# `External.cfg`; `tests/test_absent_invariants_refuse.py` re-derives them from
# those files rather than trusting this list.
#
# THERE IS NO `invariant_templates:` ENTRY FOR EITHER, SO THE GENERATED
# `validate_type_invariant` AND `validate_delivery_invariant` RAISE
# NotImplementedError. That is the correct answer and it is not a regression:
# the double never checked these invariants, it silently claimed every state was
# fine. `legacy_payment_http` has shipped exactly this form since it was written.
invariants:
  - TypeInvariant
  - DeliveryInvariant
finite_model: {}
generators: {}
fake:
  class: ReminderWorkerSpecDouble
  actions: {}
adapters: case_adapters.toml
