# Skill project manifest for the tla-spec-dev PLUGIN.
#
# What this declares: the units this repository's own agents and its validation
# surfaces need, and the paths in the working tree whose content belongs to one
# of those units.
#
# How the home is produced — read this before running `project resolve`
# ---------------------------------------------------------------------
# `project resolve` writes into whatever `SKILL_MANAGER_HOME` names. Run it
# before this checkout has its own home and it mutates the operator's global
# ~/.skill-manager. Create the local home first, point `SKILL_MANAGER_HOME` at
# it, and only then resolve:
#
#   mkdir -p .skill-manager/skills
#   SKILL_MANAGER_CLI=<epic skill-manager> \
#     bash <git-integration-repo>/scripts/bootstrap-home.sh --root "$PWD" --force
#   export SKILL_MANAGER_HOME="$PWD/.skill-manager"
#   skill-manager project resolve --skip-gateway
#
# Coords are git-only (no registry is configured) and they name the REPO, not
# the installed unit — see skill-publisher's references/coords-and-distribution.md.
# The table key is the installed unit name, which is what `[[vendored]]`
# `from_unit` and `.skill-manager/skills/<name>` both use.
#
# This repository IS the tla-spec-dev plugin (skill surface at
# skills/spec-double-2/), so it does not declare
# itself: `specs/program_model/production_adapters.py` and the pytest suite
# import `spec_double_compiler` from this working tree, and the spec lifecycle
# runs `python3 skills/spec-double-2/scripts/tla_spec_dev.py`, never the installed
# clone.

[project]
name = "tla-spec-dev"
version = "0.1.0"
description = "Generate and maintain Python spec doubles from constrained, annotated TLA+ specifications, validated by a Test Graph project and the specs/program_model adapters."

# --- validation: the test_graph project at test_graph/ is composed from the
#     test-graph Gradle SDK and build-logic, vendored below. Its three graphs
#     (specWorkflow, cliWorkflow, effectProviderExamples) are the repository's
#     integration surface ---
#
# SI-02: `[skills.test-graph]` IS GONE, and its absence is the point.
#
# test-graph is now a CONTAINED SKILL of this plugin, at skills/test-graph/. A
# contained skill is not a separately installable unit, so there is nothing for
# `[skills.test-graph]` to resolve to; and the coord it used to carry
# (github:haydenrear/test_graph_skill) still resolves, which is worse than an
# error — it would install a SECOND, standalone copy of a skill this repository
# already carries, at its own version, change-managed separately. That is the
# exact incoherence the bundle exists to prevent
# (plugin-repository/references/imports.md § "silently duplicates").
#
# This repository IS the tla-spec-dev plugin, so it does not declare itself
# here for test-graph any more than it does for spec-double-2.

# --- required BY this unit's own SKILL.md, not chosen here. Its `skill-imports`
#     name skill-manager references/cli.md (how the declared tlc2/pytest/jinja2
#     CLI tools are exposed) and references/skills.md (installable-unit layout),
#     and `project resolve` refuses the whole resolve with "references missing
#     unit" until the unit carrying them is declared ---
#
# SI-02: `[skills.skill-manager]` and `[skills.unit-authoring]` are GONE for the
# same reason, one tier up. Both are contained skills of the `skt` PLUGIN, and
# `references/projects.md` is explicit: "A plugin declared as `[skills.<name>]`
# is refused by `project resolve`, and a unit that skt now provides
# (skill-manager, skill-publisher) is deleted from the manifest rather than
# re-declared." `skt status` in this checkout's home had been printing that same
# remedy for the `[skills.skill-manager]` block on every run.

[plugins.skt]
source = "github:haydenrear/skt"

# --- vendored: paths under test_graph/ whose content is the test-graph unit's
#     Gradle SDK. They were scaffolded against whatever SKILL_MANAGER_HOME
#     happened to be set at the time, so git stored one developer's absolute
#     home path in the blob. Declaring them lets `project resolve` check, by
#     RESOLVED PHYSICAL path, that each one still lands in this project's own
#     home rather than a foreign one.
#
#     The check must resolve rather than read link text: a link whose text is
#     relative (`sdk/../standard-nodes`) matches no string test yet can resolve
#     through a sibling absolute link into the operator's home.
#
#     These paths are now produced by test-graph's managed provider bindings
#     (test_graph/provider-bindings.json); they are generated and gitignored,
#     not tracked. This block stays as the validator that says what must hold. ---

#     SI-02 moved `from_unit`. `test-graph` is no longer an installed unit — it
#     is a contained skill of the `tla-spec-dev` plugin, whose bytes land at
#     `<home>/plugins/tla-spec-dev/skills/test-graph/`. So the unit that owns
#     this content is the PLUGIN, and the subpath grows the `skills/test-graph/`
#     rung that the move added.

[[vendored]]
name = "test-graph-sdk"
paths = ["test_graph/sdk", "test_graph/build-logic", "test_graph/standard-nodes"]
from_unit = "tla-spec-dev"
from_subpath = "skills/test-graph/project_sdk_sources"
on_invalid = "error"
